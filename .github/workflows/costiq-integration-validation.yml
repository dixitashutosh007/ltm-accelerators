name: Cost IQ Integration Validation

on:
  push:
    branches:
      - costiq-v10-phase-e-integration
  pull_request:
    branches:
      - main

jobs:
  validate-costiq:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # The repository lockfile is currently stale against the Amplify dependency graph.
      # Resolve from package.json without rewriting the committed lockfile so Cost IQ
      # validation can run; normalize package-lock.json separately before final merge.
      - run: npm install --package-lock=false
      - run: npm run validate:costiq
      - run: npm run build:costiq-config
