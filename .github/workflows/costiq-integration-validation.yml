name: Cost IQ Integration Validation

on:
  push:
    branches:
      - costiq-v10-phase-e-integration
      - diagnose-costiq-ai-500
  pull_request:
    branches:
      - main

jobs:
  validate-costiq:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run validate:costiq
      - run: npm run test:costiq
      - run: npm run test:costiq:hardening
      - run: npm run test:costiq:persistence
      - run: npm run test:costiq:persistence:lifecycle
      - run: npm run test:costiq:persistence:adapter
      - run: npm run test:costiq:persistence:api
      - run: npm run test:costiq:persistence:service
      - run: npm run test:costiq:persistence:http
      - run: npm run test:costiq:persistence:amplify
      - run: npm run test:costiq:persistence:browser
      - run: npm run test:costiq:report-fallback
