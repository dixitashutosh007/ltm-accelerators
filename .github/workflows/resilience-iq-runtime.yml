name: Resilience IQ Runtime

on:
  push:
    branches: [main, resilience-iq-dev]
    paths:
      - "resilience-iq/**"
      - "packages/engine-core/src/accelerators/resilience-iq/**"
      - "packages/engine-core/src/index.ts"
      - "amplify/functions/evaluate-resilience-iq/**"
      - "amplify/functions/manage-resilience-assessment/**"
      - "amplify/functions/manage-resilience-evidence/**"
      - "amplify/functions/_shared/**"
      - "amplify/backend.ts"
      - "package.json"
      - "tsconfig.json"
      - "scripts/**"
      - "Accelerators/resilience-iq.html"
      - "Accelerators/cost-iq-runtime-config.js"
  pull_request:
    branches: [main, resilience-iq-dev]
    paths:
      - "resilience-iq/**"
      - "packages/engine-core/src/accelerators/resilience-iq/**"
      - "packages/engine-core/src/index.ts"
      - "amplify/functions/evaluate-resilience-iq/**"
      - "amplify/functions/manage-resilience-assessment/**"
      - "amplify/functions/manage-resilience-evidence/**"
      - "amplify/functions/_shared/**"
      - "amplify/backend.ts"
      - "package.json"
      - "tsconfig.json"

concurrency:
  group: resilience-iq-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run validate:resilience-bank
      - run: npm run validate:resilience-deployment
      - run: npm run validate:resilience-persistence
      - run: npm run test:resilience
      - run: npm run test:resilience-api
      - run: npm run test:resilience-persistence-api
      - run: npm run test:resilience-evidence-api
