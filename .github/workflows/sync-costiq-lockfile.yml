name: Sync Cost IQ Lockfile

on:
  push:
    branches:
      - costiq-v10-phase-e-integration

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Cost IQ integration branch
        uses: actions/checkout@v4
        with:
          ref: costiq-v10-phase-e-integration
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate package lock
        run: npm install --package-lock-only

      - name: Install dependencies
        run: npm ci

      - name: Validate Cost IQ
        run: npm run validate:costiq

      - name: Check lockfile changes
        id: changes
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated package-lock.json
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix: synchronize package lock for Cost IQ integration"
          git push origin costiq-v10-phase-e-integration

      - name: Report result
        run: |
          echo "Cost IQ lockfile synchronization and validation completed successfully."
