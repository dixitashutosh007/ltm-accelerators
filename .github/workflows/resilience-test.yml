name: Resilience IQ Test Isolation
on:
  push:
    branches:
      - resilience-iq-dev
jobs:
  resilience-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:resilience
