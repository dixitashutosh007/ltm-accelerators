name: CI

# Required checks for every pull request into main (configure branch protection to require them).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, unit tests, repository guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm ci --prefix services/reports-service
      - name: TypeScript (backend + engines, must be 0 errors)
        run: npm run typecheck
      - name: Engine tests (Vitest)
        run: npm run test:engine
      - name: Reports service auth tests
        run: npm run test:reports
      - name: Repository guard rails
        run: npm run check:repo
      - name: Cost IQ configuration validation
        run: npm run validate:costiq
      - name: Dependency audit (runtime dependencies, blocking)
        run: npm audit --omit=dev --audit-level=high
      - name: Dependency audit (build tooling, report only)
        run: npm audit --audit-level=high || true

  backend:
    name: Backend synthesis and security assertions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Synthesize with the legacy API (current cutover state)
        run: npm run check:backend
      - name: Synthesize without the legacy API (post-cutover state)
        run: npm run check:backend
        env:
          LTM_KEEP_LEGACY_API: 'false'

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # gitleaks lists the PR's commits
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
