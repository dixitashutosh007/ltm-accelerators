version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      aws:
        patterns: ['@aws-amplify/*', '@aws-sdk/*', 'aws-cdk-lib', 'constructs']
      testing:
        patterns: ['vitest', '@playwright/test', 'tsx', 'typescript']
    open-pull-requests-limit: 5
    ignore:
      # Node types follow the Node version in CI (20); move them with it, not ahead of it
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: npm
    directory: /services/reports-service
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
