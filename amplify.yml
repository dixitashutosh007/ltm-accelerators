version: 1

backend:
  phases:
    build:
      commands:
        - npm ci --cache .npm --prefer-offline
        - export CI=1
        - npm run test:resilience-all
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID --outputs-out-dir . --outputs-version 1
        - npx ampx generate outputs --branch $AWS_BRANCH --app-id $AWS_APP_ID --out-dir . --outputs-version 1

frontend:
  phases:
    build:
      commands:
        - npm run validate:costiq
        - npm run build:costiq-config
        - echo "Packaging Accelerators for Amplify Hosting..."
  artifacts:
    baseDirectory: Accelerators
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .npm/**/*
