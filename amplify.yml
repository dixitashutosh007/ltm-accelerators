version: 1

backend:
  phases:
    build:
      commands:
        - npm ci --cache .npm --prefer-offline
        - export CI=1
        - mkdir -p Accelerators
        - echo "=== evaluate.test.ts ===" > Accelerators/resilience-test-report.txt
        - npx tsx packages/engine-core/src/accelerators/resilience-iq/evaluate.test.ts >> Accelerators/resilience-test-report.txt 2>&1 || echo "RESULT: evaluate.test.ts FAILED" >> Accelerators/resilience-test-report.txt
        - echo "=== evidence-lifecycle.test.ts ===" >> Accelerators/resilience-test-report.txt
        - npx tsx packages/engine-core/src/accelerators/resilience-iq/evidence-lifecycle.test.ts >> Accelerators/resilience-test-report.txt 2>&1 || echo "RESULT: evidence-lifecycle.test.ts FAILED" >> Accelerators/resilience-test-report.txt
        - echo "=== assessment-lifecycle.test.ts ===" >> Accelerators/resilience-test-report.txt
        - npx tsx packages/engine-core/src/accelerators/resilience-iq/assessment-lifecycle.test.ts >> Accelerators/resilience-test-report.txt 2>&1 || echo "RESULT: assessment-lifecycle.test.ts FAILED" >> Accelerators/resilience-test-report.txt
        - echo "=== assessment-persistence.test.ts ===" >> Accelerators/resilience-test-report.txt
        - npx tsx packages/engine-core/src/accelerators/resilience-iq/assessment-persistence.test.ts >> Accelerators/resilience-test-report.txt 2>&1 || echo "RESULT: assessment-persistence.test.ts FAILED" >> Accelerators/resilience-test-report.txt
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID --outputs-out-dir . --outputs-version 1
        - npx ampx generate outputs --branch $AWS_BRANCH --app-id $AWS_APP_ID --out-dir . --outputs-version 1

frontend:
  phases:
    build:
      commands:
        - npm run validate:costiq
        - npm run build:costiq-config
        - echo "Packaging Accelerators for Amplify Hosting..."
  artifacts:
    baseDirectory: Accelerators
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .npm/**/*
