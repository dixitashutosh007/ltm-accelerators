<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cost IQ — Configuration Studio</title><style>:root{--ink:#282828;--muted:#646464;--paper:#f8f7f5;--white:#fff;--coral:#ff5e4f;--line:#e8e5e1;--green:#86b99a;--gold:#d7aa60}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,Arial,sans-serif}header{padding:26px 32px;background:#282828;color:#fff}header h1{margin:0;font-size:26px}header p{margin:6px 0 0;color:#d5d2cf}main{max-width:1240px;margin:0 auto;padding:28px}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px}.badge{padding:8px 11px;border:1px solid var(--line);background:#fff;border-radius:999px;font:12px monospace}.ok{color:#287a4b;border-color:#b8dec5;background:#f0faf4}.warn{color:#8a5d00;border-color:#edd7a2;background:#fffaf0}.grid{display:grid;grid-template-columns:280px 1fr;gap:18px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 8px 28px rgba(40,40,40,.04)}button,.btn{border:1px solid var(--line);background:#fff;padding:10px 14px;border-radius:9px;cursor:pointer;font-weight:700}button.primary{background:var(--coral);border-color:var(--coral);color:#fff}button:hover{filter:brightness(.98)}nav button{display:block;width:100%;margin:0 0 8px;text-align:left;background:#fff}.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:14px;border:1px solid var(--line);border-radius:10px}.stat b{display:block;font-size:22px}.muted{color:var(--muted);font-size:12px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px;border-bottom:1px solid var(--line);vertical-align:top;text-align:left}th{font-size:11px;text-transform:uppercase;color:var(--muted)}input,textarea,select{width:100%;padding:10px;border:1px solid #d8d4cf;border-radius:8px;font:inherit}textarea{min-height:88px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.pill{font:11px monospace;background:#f1efec;padding:4px 8px;border-radius:999px}.error{color:#b32525}.dep{font:12px monospace;background:#f7f5f2;padding:6px 8px;border-radius:6px;display:inline-block;margin:3px}.hidden{display:none}@media(max-width:900px){.grid{grid-template-columns:1fr}.statgrid{grid-template-columns:1fr 1fr}}</style></head><body><header><h1>Cost IQ — Configuration Studio</h1><p>Edit methodology without touching JSON. Validate dependencies. Build a controlled release.</p></header><main><div class="bar"><span id="releaseBadge" class="badge">Draft</span><button class="primary" id="loadBtn">Load Master JSON</button><button id="saveBtn">Save / Export Master JSON</button><button id="validateBtn">Validate Everything</button><button id="buildBtn">Build Release Package</button></div><div class="grid"><div><div class="card"><h3>Configuration</h3><nav><button data-view="dashboard">Dashboard</button><button data-view="questions">Questions</button><button data-view="scoring">Scoring</button><button data-view="rules">Rules</button><button data-view="findings">Findings</button><button data-view="recommendations">Recommendations</button></nav><p class="muted">Canonical model: master-config.json</p><input type="file" id="fileInput" accept="application/json,.json" class="hidden"></div></div><div id="app"></div></div></main><script>const STORAGE='costiq_master_config_v1';let cfg=null,view='dashboard',selectedId=null;const DEFAULT_URL='../master-config.json';function clone(x){return JSON.parse(JSON.stringify(x))}async function loadDefault(){try{let r=await fetch(DEFAULT_URL,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);cfg=await r.json();render()}catch(e){let saved=localStorage.getItem(STORAGE);if(saved){cfg=JSON.parse(saved);render()}else showError('Could not load master-config.json. Use “Load Master JSON” when running locally.')}}function showError(m){document.getElementById('app').innerHTML='<div class="card"><h2>Configuration not loaded</h2><p class="error">'+escapeHtml(m)+'</p></div>'}function escapeHtml(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]))}function validate(){if(!cfg)return['Configuration is empty.'];const errs=[],ids=new Set();for(const q of cfg.questions||[]){if(ids.has(q.id))errs.push('Duplicate question ID: '+q.id);ids.add(q.id);if(!q.prompt)errs.push(q.id+' has no prompt.');if(!['single-select','multi-select','slider','stars','ranking','matching','true-false'].includes(q.interaction))errs.push(q.id+' has unsupported interaction: '+q.interaction);if(['single-select','multi-select','true-false','ranking'].includes(q.interaction)&&(!q.options||q.options.length<2))errs.push(q.id+' requires at least two options.');if(q.scoring?.dimensionId&&!cfg.dimensions.some(d=>d.id===q.scoring.dimensionId))errs.push(q.id+' references missing dimension '+q.scoring.dimensionId);for(const f of q.findingIds||[])if(!cfg.findings.some(x=>x.id===f))errs.push(q.id+' references missing finding '+f);for(const r of q.recommendationIds||[])if(!cfg.recommendations.some(x=>x.id===r))errs.push(q.id+' references missing recommendation '+r)}for(const f of cfg.findings||[]){if(!cfg.dimensions.some(d=>d.id===f.dimensionId))errs.push(f.id+' references missing dimension '+f.dimensionId);for(const r of f.recommendationIds||[])if(!cfg.recommendations.some(x=>x.id===r))errs.push(f.id+' references missing recommendation '+r)}for(const r of cfg.recommendations||[])for(const f of r.findingIds||[])if(!cfg.findings.some(x=>x.id===f))errs.push(r.id+' references missing finding '+f);for(const rule of cfg.rules||[])if(!cfg.questions.some(q=>q.id===rule.when?.questionId))errs.push(rule.id+' references missing question '+rule.when?.questionId);return errs}function render(){if(!cfg)return;document.getElementById('releaseBadge').textContent=cfg.manifest.releaseId+' · '+cfg.manifest.releaseStatus;document.getElementById('releaseBadge').className='badge '+(validate().length?'warn':'ok');if(view==='dashboard')renderDashboard();if(view==='questions')renderQuestions();if(view==='scoring')renderScoring();if(view==='rules')renderRules();if(view==='findings')renderFindings();if(view==='recommendations')renderRecommendations()}function renderDashboard(){const errs=validate();document.getElementById('app').innerHTML='<div class="card"><div class="sectionTitle"><div><h2 style="margin:0">Methodology Control Plane</h2><p class="muted">Changes made here can be saved as the canonical master and released through Git.</p></div><span class="pill">'+(errs.length?'VALIDATION REQUIRED':'VALID')+'</span></div><div class="statgrid"><div class="stat"><b>'+cfg.questions.length+'</b><span class="muted">Questions</span></div><div class="stat"><b>'+cfg.rules.length+'</b><span class="muted">Rules</span></div><div class="stat"><b>'+cfg.findings.length+'</b><span class="muted">Findings</span></div><div class="stat"><b>'+cfg.recommendations.length+'</b><span class="muted">Recommendations</span></div></div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>Integrity</h3>'+(errs.length?'<p class="error">'+errs.map(x=>'• '+escapeHtml(x)).join('<br>')+'</p>':'<p class="ok">✓ All cross-references in this vertical slice are valid.</p>')+'<h3>Git-friendly change flow</h3><p>Export the master configuration, review the diff, commit to the Cost IQ branch, and create a release package only after validation passes.</p></div>'}function formQuestion(q){const opts=(q.options||[]).map(o=>'<div class="row"><input value="'+escapeHtml(o.id)+'" data-opt="id"><input value="'+escapeHtml(o.label)+'" data-opt="label"></div>').join('');return '<div class="card"><div class="sectionTitle"><h2>'+escapeHtml(q.id)+'</h2><span class="pill">'+escapeHtml(q.interaction)+'</span></div><div class="row"><div><label class="muted">Section</label><input id="qSection" value="'+escapeHtml(q.section)+'"></div><div><label class="muted">Interaction</label><select id="qInteraction"><option>single-select</option><option>multi-select</option><option>slider</option><option>stars</option><option>ranking</option><option>true-false</option><option>matching</option></select></div></div><p><label class="muted">Prompt</label><textarea id="qPrompt">'+escapeHtml(q.prompt)+'</textarea></p><p><label class="muted">Intent</label><textarea id="qIntent">'+escapeHtml(q.intent)+'</textarea></p><h3>Answers</h3>'+(opts||'<p class="muted">This interaction uses non-option input.</p>')+'<button id="saveQ" class="primary">Save Question</button><button id="addOpt" style="margin-left:8px">Add Option</button><div style="margin-top:18px"><b>Dependencies</b><div>'+(q.findingIds||[]).map(x=>'<span class="dep">'+escapeHtml(x)+'</span>').join('')+(q.recommendationIds||[]).map(x=>'<span class="dep">'+escapeHtml(x)+'</span>').join('')+(q.scoring?.dimensionId?'<span class="dep">'+escapeHtml(q.scoring.dimensionId)+'</span>':'')+'</div></div></div>'}function renderQuestions(){const qs=cfg.questions;let selected=qs.find(q=>q.id===selectedId)||qs[0];selectedId=selected?.id;document.getElementById('app').innerHTML='<div class="grid" style="grid-template-columns:300px 1fr"><div class="card"><h3>Questions</h3>'+qs.map(q=>'<button data-q="'+escapeHtml(q.id)+'" style="width:100%;margin-bottom:6px;text-align:left">'+escapeHtml(q.id)+' · '+escapeHtml(q.section)+'</button>').join('')+'</div><div>'+formQuestion(selected)+'</div></div>';document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{selectedId=b.dataset.q;renderQuestions()});document.getElementById('qInteraction').value=selected.interaction;document.getElementById('saveQ').onclick=()=>{selected.section=document.getElementById('qSection').value;selected.interaction=document.getElementById('qInteraction').value;selected.prompt=document.getElementById('qPrompt').value;selected.intent=document.getElementById('qIntent').value;const rows=[...document.querySelectorAll('[data-opt="id"]')];selected.options=rows.map((el,i)=>({id:el.value,label:document.querySelectorAll('[data-opt="label"]')[i].value}));localStorage.setItem(STORAGE,JSON.stringify(cfg));render()};document.getElementById('addOpt')?.addEventListener('click',()=>{selected.options=selected.options||[];selected.options.push({id:String.fromCharCode(65+selected.options.length),label:'New answer option'});renderQuestions()})}function renderScoring(){document.getElementById('app').innerHTML='<div class="card"><h2>Scoring</h2><p class="muted">This slice uses question-level scoring maps. Full v5 will expand this into an explicit scoring editor with simulations and calibration tests.</p><table><tr><th>Question</th><th>Dimension</th><th>Mapping</th></tr>'+cfg.questions.map(q=>'<tr><td>'+escapeHtml(q.id)+'</td><td>'+escapeHtml(q.scoring?.dimensionId||'')+'</td><td><code>'+escapeHtml(JSON.stringify(q.scoring||{}))+'</code></td></tr>').join('')+'</table></div>'}function renderRules(){document.getElementById('app').innerHTML='<div class="card"><h2>Rules</h2><table><tr><th>ID</th><th>Trigger</th><th>Finding</th><th>Priority</th></tr>'+cfg.rules.map(r=>'<tr><td>'+escapeHtml(r.id)+'</td><td>'+escapeHtml(JSON.stringify(r.when))+'</td><td>'+escapeHtml(r.findingId)+'</td><td>'+escapeHtml(r.priority)+'</td></tr>').join('')+'</table></div>'}function renderFindings(){document.getElementById('app').innerHTML='<div class="card"><h2>Findings</h2>'+cfg.findings.map(f=>'<div class="card" style="box-shadow:none;margin:10px 0"><b>'+escapeHtml(f.id)+' · '+escapeHtml(f.title)+'</b><p>'+escapeHtml(f.description)+'</p><div>'+(f.recommendationIds||[]).map(x=>'<span class="dep">'+escapeHtml(x)+'</span>').join('')+'</div></div>').join('')+'</div>'}function renderRecommendations(){document.getElementById('app').innerHTML='<div class="card"><h2>Recommendations</h2>'+cfg.recommendations.map(r=>'<div class="card" style="box-shadow:none;margin:10px 0"><b>'+escapeHtml(r.id)+' · '+escapeHtml(r.title)+'</b><p>'+escapeHtml(r.description)+'</p><div>Findings: '+(r.findingIds||[]).map(x=>'<span class="dep">'+escapeHtml(x)+'</span>').join('')+'<br>LTM Service: '+escapeHtml(r.ltmService)+'</div></div>').join('')+'</div>'}function exportJson(){const blob=new Blob([JSON.stringify(cfg,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='master-config.json';a.click();URL.revokeObjectURL(a.href);localStorage.setItem(STORAGE,JSON.stringify(cfg))}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});document.getElementById('loadBtn').onclick=()=>document.getElementById('fileInput').click();document.getElementById('fileInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{cfg=JSON.parse(r.result);localStorage.setItem(STORAGE,JSON.stringify(cfg));render()}catch(err){showError('Invalid JSON: '+err.message)}};r.readAsText(f)};document.getElementById('saveBtn').onclick=exportJson;document.getElementById('validateBtn').onclick=()=>{if(!cfg)return;const e=validate();alert(e.length?'Validation failed:\n\n'+e.join('\n'):'Validation passed. No blocking integrity errors found.');render()};document.getElementById('buildBtn').onclick=()=>{if(!cfg)return;const e=validate();if(e.length){alert('Release blocked. Fix '+e.length+' validation error(s) first.');return}cfg.manifest.releaseStatus='approved';exportJson();alert('Release package validated and exported. Commit the resulting master-config.json and release files in Git.')};loadDefault();</script></body></html>
