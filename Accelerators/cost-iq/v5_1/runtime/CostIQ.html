<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cost IQ — Runtime v5.1</title><style>:root{--ink:#282828;--muted:#646464;--paper:#f8f7f5;--white:#fff;--coral:#ff5e4f;--line:#e8e5e1}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,Arial,sans-serif}header{padding:24px 30px;background:var(--ink);color:#fff}main{max-width:1080px;margin:auto;padding:24px}.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px;cursor:pointer;font-weight:700}.primary{background:var(--coral);border-color:var(--coral);color:#fff}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px}.small{font-size:12px;color:var(--muted)}.opt{display:block;border:1px solid var(--line);padding:13px;border-radius:10px;margin:8px 0;cursor:pointer}.opt.selected{border-color:var(--coral);box-shadow:inset 3px 0 0 var(--coral)}.star{border:0;background:transparent;font-size:34px;color:#c7c3bf;cursor:pointer}.star.active{color:#282828}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.mutedBox{background:#fbfaf8;border:1px dashed #d9d3cc;border-radius:10px;padding:12px}input[type=range]{width:100%}</style></head><body><header><h1>Cost IQ</h1><div id="meta" class="small" style="color:#ddd">Loading…</div></header><main><div class="bar"><button class="btn primary" id="newBtn">New Assessment</button><button class="btn" id="refreshBtn">Refresh Engine</button><button class="btn" id="loadCfgBtn">Load Configuration</button><button class="btn" id="saveBtn">Save Progress</button><button class="btn" id="loadBtn">Load Progress</button><input id="cfgInput" type="file" accept="application/json,.json" hidden><input id="sessionInput" type="file" accept="application/json,.ciq" hidden></div><div id="app"></div></main><script>const URL_CONFIG='../config/current/config.json';let cfg=null,answers={},phase='home',i=0,questions=[];function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]))}function start(){answers={};i=0;phase='core';questions=cfg.questions.filter(q=>q.active!==false&&q.id.startsWith('CORE-'));render()}function home(){document.getElementById('app').innerHTML=`<div class="card"><h2>CIO Executive Diagnostic</h2><p>The runtime renders the loaded configuration release. It does not own the methodology.</p><div class="grid2"><div class="mutedBox"><b>${cfg.questions.length}</b> configured questions<br><b>${cfg.rules.length}</b> rules<br><b>${cfg.findings.length}</b> findings<br><b>${cfg.recommendations.length}</b> recommendations</div><div class="mutedBox"><b>Release</b><br>${esc(cfg.manifest.releaseId)}<br><span class="small">New assessments start clean; saved sessions carry their release ID.</span></div></div><div style="margin-top:16px"><button class="btn primary" id="start">Start New Assessment</button></div></div>`;document.getElementById('start').onclick=start}function render(){document.getElementById('meta').textContent=cfg?`Release ${cfg.manifest.releaseId} · configuration loaded`:'Configuration unavailable';if(!cfg)return; if(phase==='home')return home();if(phase==='report')return report();let q=questions[i];if(!q){phase='report';return render()}let v=answers[q.id],body='';if(q.interaction==='single-select'||q.interaction==='true-false')body=(q.options||[]).map(o=>`<label class="opt ${v===o.id?'selected':''}"><input type="radio" name="q" value="${esc(o.id)}" ${v===o.id?'checked':''}> ${esc(o.label)}</label>`).join('');else if(q.interaction==='multi-select')body=(q.options||[]).map(o=>`<label class="opt ${Array.isArray(v)&&v.includes(o.id)?'selected':''}"><input type="checkbox" data-m="${esc(o.id)}" ${Array.isArray(v)&&v.includes(o.id)?'checked':''}> ${esc(o.label)}</label>`).join('');else if(q.interaction==='slider'){let x=v??50;body=`<input id="slider" type="range" min="${q.control?.min??0}" max="${q.control?.max??100}" step="${q.control?.step??5}" value="${x}"><div class="row"><span>${esc(q.control?.leftLabel||'Lower')}</span><b id="sv">${x}</b><span>${esc(q.control?.rightLabel||'Higher')}</span></div>`}else if(q.interaction==='stars'){let n=Number(v||0);body=`<div>${[1,2,3,4,5].map(x=>`<button class="star ${x<=n?'active':''}" data-star="${x}">★</button>`).join('')}</div><div class="small">${n?esc(q.control?.labels?.[n-1]||''): 'Select a rating'}</div>`}else if(q.interaction==='ranking'||q.interaction==='multi-select-ranking'||q.interaction==='allocation-ranking'){body=(q.options||[]).map(o=>`<label class="opt"><input type="checkbox" data-r="${esc(o.id)}" ${Array.isArray(v)&&v.includes(o.id)?'checked':''}> ${esc(o.label)}</label>`).join('<div class="small">Select/reorder in the full runtime.</div>')}else if(q.interaction==='range')body=`<div class="mutedBox"><input id="range" value="${esc(v??'')}" placeholder="Approximate range or actual value" style="width:100%"></div>`;else body='<div class="mutedBox">Interaction is defined in configuration; renderer expansion is pending.</div>';document.getElementById('app').innerHTML=`<div class="card"><div class="small">${esc(q.id)} · ${esc(q.section)} · ${i+1} of ${questions.length}</div><h2>${esc(q.prompt)}</h2><p class="small">${esc(q.intent)}</p><div class="mutedBox small"><b>How to answer:</b> ${esc(q.answerDesign||'Choose the response that best reflects current reality.')}</div><div style="margin-top:14px">${body}</div><div class="bar" style="margin-top:18px"><button class="btn" id="back">Back</button><button class="btn primary" id="next">${i===questions.length-1?'Finish':'Continue'}</button></div></div>`;wire(q)}function wire(q){document.getElementById('back').onclick=()=>{if(i>0){i--;render()}else{phase='home';render()}};document.getElementById('next').onclick=()=>{collect(q);if(q.required&&answers[q.id]==null){alert('Please answer this required question.');return}i++;render()};if(q.interaction==='single-select'||q.interaction==='true-false')document.querySelectorAll('input[name=q]').forEach(x=>x.onchange=()=>{answers[q.id]=x.value;render()});if(q.interaction==='multi-select')document.querySelectorAll('[data-m]').forEach(x=>x.onchange=()=>{answers[q.id]=[...document.querySelectorAll('[data-m]:checked')].map(a=>a.dataset.m);render()});if(q.interaction==='slider')document.getElementById('slider').oninput=e=>{answers[q.id]=Number(e.target.value);document.getElementById('sv').textContent=e.target.value};if(q.interaction==='range')document.getElementById('range').oninput=e=>answers[q.id]=e.target.value;if(q.interaction==='stars')document.querySelectorAll('[data-star]').forEach(x=>x.onclick=()=>{answers[q.id]=Number(x.dataset.star);render()})}function collect(q){if(q.interaction==='multi-select')answers[q.id]=[...document.querySelectorAll('[data-m]:checked')].map(x=>x.dataset.m);if(q.interaction.includes('ranking'))answers[q.id]=[...document.querySelectorAll('[data-r]:checked')].map(x=>x.dataset.r)}function report(){document.getElementById('app').innerHTML=`<div class="card"><h2>Diagnostic Preview</h2><p class="small">Release ${esc(cfg.manifest.releaseId)}</p><p>Assessment completed with ${Object.keys(answers).length} recorded response(s).</p><button class="btn primary" id="again">Start New Assessment</button></div>`;document.getElementById('again').onclick=start}function save(){const d={format:'CostIQ Assessment',schemaVersion:'1.0',assessmentId:'CIQ-'+Date.now(),releaseId:cfg.manifest.releaseId,answers,phase,index:i,savedAt:new Date().toISOString()};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}));a.download=d.assessmentId+'.ciq';a.click()}async function load(){try{const r=await fetch(URL_CONFIG,{cache:'no-store'});if(!r.ok)throw 0;cfg=await r.json();questions=cfg.questions.filter(q=>q.active!==false&&q.id.startsWith('CORE-'));phase='home';render()}catch{render()}}document.getElementById('newBtn').onclick=start;document.getElementById('refreshBtn').onclick=load;document.getElementById('loadCfgBtn').onclick=()=>document.getElementById('cfgInput').click();document.getElementById('cfgInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{cfg=JSON.parse(r.result);questions=cfg.questions.filter(q=>q.active!==false&&q.id.startsWith('CORE-'));phase='home';answers={};i=0;render()};r.readAsText(f)};document.getElementById('saveBtn').onclick=save;document.getElementById('loadBtn').onclick=()=>document.getElementById('sessionInput').click();document.getElementById('sessionInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const d=JSON.parse(r.result);answers=d.answers||{};i=d.index||0;phase=d.phase||'core';questions=cfg.questions.filter(q=>q.active!==false&&q.id.startsWith('CORE-'));render()};r.readAsText(f)};load();</script></body></html>
