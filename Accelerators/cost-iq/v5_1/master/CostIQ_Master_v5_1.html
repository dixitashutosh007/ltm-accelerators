<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cost IQ — Master Configuration Studio v5.1</title><style>:root{--ink:#282828;--muted:#646464;--paper:#f8f7f5;--white:#fff;--coral:#ff5e4f;--line:#e8e5e1;--red:#b32525;--blue:#4f7fa0}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,Arial,sans-serif}header{padding:24px 32px;background:var(--ink);color:#fff}header h1{margin:0;font-size:24px}header p{margin:6px 0 0;color:#d9d5d0;font-size:13px}.shell{max-width:1400px;margin:auto;padding:22px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.btn{border:1px solid var(--line);background:#fff;padding:9px 12px;border-radius:9px;cursor:pointer;font-weight:700}.btn.primary{background:var(--coral);color:#fff;border-color:var(--coral)}.btn.danger{color:var(--red)}.status{margin-left:auto}.badge{padding:7px 10px;border-radius:999px;border:1px solid var(--line);background:#fff;font:12px monospace}.ok{color:#2b7c4c;background:#eff9f3;border-color:#b8dec5}.warn{color:#8b5e00;background:#fff8e9;border-color:#ecd59a}.bad{color:#a32b2b;background:#fff1f1;border-color:#efb5b5}.layout{display:grid;grid-template-columns:230px 1fr;gap:16px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 6px 24px rgba(40,40,40,.035)}nav button{width:100%;text-align:left;margin-bottom:7px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.statgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.stat{padding:13px;border:1px solid var(--line);border-radius:10px}.stat b{display:block;font-size:22px}.small{font-size:12px;color:var(--muted)}table{width:100%;border-collapse:collapse;font-size:12px}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{font-size:10px;text-transform:uppercase;color:var(--muted)}input,textarea,select{width:100%;padding:9px;border:1px solid #d8d4cf;border-radius:8px;font:inherit;background:#fff}textarea{min-height:92px;resize:vertical}.list button{width:100%;text-align:left;margin:4px 0;background:#fff}.list button.active{border-color:var(--coral);box-shadow:inset 3px 0 0 var(--coral)}.chips{display:flex;flex-wrap:wrap;gap:5px}.chip{display:inline-flex;align-items:center;background:#f2efec;border-radius:999px;padding:4px 7px;font:11px monospace}.dep{font:11px monospace;background:#f6f4f1;padding:5px 7px;border-radius:6px;display:inline-block;margin:2px}.impactRow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:8px;border-bottom:1px solid var(--line)}.pill{padding:4px 7px;border-radius:999px;background:#f1efec;font:11px monospace}.mutedBox{background:#fbfaf8;border:1px dashed #d9d3cc;border-radius:10px;padding:11px}.hidden{display:none}@media(max-width:1100px){.layout{grid-template-columns:1fr}.statgrid{grid-template-columns:repeat(3,1fr)}}@media(max-width:700px){.grid2{grid-template-columns:1fr}.statgrid{grid-template-columns:1fr 1fr}}</style></head><body><header><h1>Cost IQ — Master Configuration Studio</h1><p>Edit methodology without touching JSON. Inspect dependencies, validate integrity, and prepare controlled releases.</p></header><main class="shell"><div class="toolbar"><button class="btn primary" id="importBtn">Import Master</button><button class="btn" id="exportBtn">Export Master</button><button class="btn" id="draftBtn">Save Draft Locally</button><button class="btn" id="restoreBtn">Restore Draft</button><button class="btn" id="validateBtn">Validate Everything</button><button class="btn" id="impactBtn">Impact Analysis</button><button class="btn" id="releaseBtn">Build Release</button><span class="status"><span id="statusBadge" class="badge">Not loaded</span></span><input id="fileInput" type="file" accept="application/json,.json" class="hidden"></div><div class="layout"><aside><div class="card"><div class="small">MASTER MODEL</div><nav id="nav"><button class="btn" data-view="dashboard">Dashboard</button><button class="btn" data-view="questions">Questions</button><button class="btn" data-view="scoring">Scoring</button><button class="btn" data-view="rules">Adaptive Rules</button><button class="btn" data-view="findings">Findings</button><button class="btn" data-view="recommendations">Recommendations</button><button class="btn" data-view="settings">Settings</button></nav><div class="mutedBox small"><b>Permanent change flow</b><br>Draft → impact analysis → validation → release → Git review/commit.</div></div></aside><section id="app"></section></div></main><script>const DEFAULT_URL='../master-config.json';const STORAGE='costiq_master_v5_1_draft';const TYPES=['single-select','multi-select','slider','stars','ranking','matching','true-false','range','multi-select-ranking','allocation-ranking'];let cfg=null,view='dashboard',selectedId=null;function esc(s){return String(s??'').replace(/[&<>\\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]))}function ids(a){return new Set((a||[]).map(x=>x.id))}function get(a,id){return (a||[]).find(x=>x.id===id)}function validate(){if(!cfg)return['Master configuration is not loaded.'];const e=[],qs=ids(cfg.questions),fs=ids(cfg.findings),rs=ids(cfg.recommendations),ds=ids(cfg.dimensions),seen=new Set();for(const q of cfg.questions||[]){if(seen.has(q.id))e.push('Duplicate question ID: '+q.id);seen.add(q.id);if(!q.prompt)e.push(q.id+': missing prompt');if(!TYPES.includes(q.interaction))e.push(q.id+': unsupported interaction '+q.interaction);if(['single-select','multi-select','ranking','multi-select-ranking','true-false'].includes(q.interaction)&&(!q.options||q.options.length<2))e.push(q.id+': interaction requires at least two options');for(const d of q.scoring?.dimensionIds||[])if(!ds.has(d))e.push(q.id+': missing dimension '+d);for(const f of q.findingIds||[])if(!fs.has(f))e.push(q.id+': missing finding '+f);for(const r of q.recommendationIds||[])if(!rs.has(r))e.push(q.id+': missing recommendation '+r);if(q.interaction==='stars'&&(!q.control||q.control.max<2))e.push(q.id+': invalid star control');if(q.interaction==='slider'&&(!q.control||q.control.min>=q.control.max))e.push(q.id+': invalid slider control')}for(const f of cfg.findings||[]){if(!ds.has(f.dimensionId)&&!cfg.dimensions.some(d=>d.name===f.dimension))e.push(f.id+': missing dimension '+(f.dimensionId||f.dimension));for(const r of f.recommendationIds||[])if(!rs.has(r))e.push(f.id+': missing recommendation '+r)}for(const r of cfg.recommendations||[])for(const f of r.findingIds||[])if(!fs.has(f))e.push(r.id+': missing finding '+f);for(const rule of cfg.rules||[])for(const qid of rule.questionRefs||[])if(!qs.has(qid))e.push(rule.id+': missing question '+qid);for(const f of cfg.findings||[]){const used=(cfg.questions||[]).some(q=>(q.findingIds||[]).includes(f.id))||(cfg.rules||[]).some(r=>r.findingId===f.id);if(!used&&!f.orphanAllowed)e.push(f.id+': orphan finding')}return e}function status(){const e=validate(),b=document.getElementById('statusBadge');if(!cfg){b.textContent='Not loaded';b.className='badge bad';return}b.textContent=e.length?`${e.length} issue${e.length>1?'s':''}`:`Valid · ${cfg.manifest.releaseId}`;b.className='badge '+(e.length?'warn':'ok')}function render(){status();if(!cfg){document.getElementById('app').innerHTML='<div class="card"><h2>Load the master model</h2><p>Use Import Master or open the studio from a served repository folder.</p></div>';return}({dashboard:renderDashboard,questions:renderQuestions,scoring:renderScoring,rules:renderRules,findings:renderFindings,recommendations:renderRecommendations,settings:renderSettings}[view]||renderDashboard)()}function renderDashboard(){const e=validate();document.getElementById('app').innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;gap:10px"><div><h2 style="margin:0">Methodology Control Plane</h2><p class="small">Canonical master model for questions, answer experiences, scoring, rules, findings and recommendations.</p></div><span class="pill">${e.length?'VALIDATION REQUIRED':'READY'}</span></div><div class="statgrid" style="margin-top:14px"><div class="stat"><b>${cfg.questions.length}</b><span class="small">Questions</span></div><div class="stat"><b>${cfg.questions.filter(q=>q.id.startsWith('CORE-')).length}</b><span class="small">Core</span></div><div class="stat"><b>${cfg.questions.filter(q=>q.id.startsWith('ADP-')).length}</b><span class="small">Adaptive</span></div><div class="stat"><b>${cfg.rules.length}</b><span class="small">Rules</span></div><div class="stat"><b>${cfg.findings.length}</b><span class="small">Findings</span></div><div class="stat"><b>${cfg.recommendations.length}</b><span class="small">Recommendations</span></div></div><hr style="border:0;border-top:1px solid var(--line);margin:20px 0"><h3>Integrity</h3>${e.length?`<div class="error">${e.map(x=>'• '+esc(x)).join('<br>')}</div>`:'<div class="success">✓ No blocking integrity errors detected.</div>'}<h3>Governance</h3><div class="grid2"><div class="mutedBox"><b>Canonical source</b><br><span class="small">master-config.json</span><br><br><b>Release</b><br><span class="small">${esc(cfg.manifest.releaseId)}</span></div><div class="mutedBox"><b>Recommended flow</b><br><span class="small">Edit object → inspect dependencies → validate → run calibration → build release → review Git diff → approve.</span></div></div></div>`}function renderQuestions(){const q=get(cfg.questions,selectedId)||cfg.questions[0];selectedId=q.id;document.getElementById('app').innerHTML=`<div class="grid2"><div class="card"><div style="display:flex;justify-content:space-between"><h3>Questions</h3><button class="btn" id="addQ">+ Add</button></div><div class="list">${cfg.questions.map(x=>`<button class="btn ${x.id===q.id?'active':''}" data-q="${esc(x.id)}">${esc(x.id)} · ${esc(x.section)}<br><span class="small">${esc(x.interaction)} · ${x.active===false?'Retired':'Active'}</span></button>`).join('')}</div></div><div class="card">${questionForm(q)}</div></div>`;document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{selectedId=b.dataset.q;renderQuestions()});document.getElementById('addQ').onclick=()=>{const id='NEW-'+Date.now();cfg.questions.push({id,section:'New Section',prompt:'New CIO diagnostic question',intent:'Explain why this question matters and what decision it supports.',interaction:'single-select',required:false,options:[{id:'A',label:'Option A'},{id:'B',label:'Option B'}],scoring:{dimensionIds:[]},findingIds:[],recommendationIds:[],active:true,version:1});selectedId=id;renderQuestions()};document.getElementById('saveQ').onclick=()=>{q.section=document.getElementById('qSection').value;q.prompt=document.getElementById('qPrompt').value;q.intent=document.getElementById('qIntent').value;q.interaction=document.getElementById('qInteraction').value;q.answerDesign=document.getElementById('qDesign').value;q.options=[...document.querySelectorAll('[data-opt-id]')].map((x,i)=>({id:x.value,label:document.querySelectorAll('[data-opt-label]')[i].value}));q.findingIds=document.getElementById('qFindings').value.split(',').map(x=>x.trim()).filter(Boolean);q.recommendationIds=document.getElementById('qRecs').value.split(',').map(x=>x.trim()).filter(Boolean);q.version=(q.version||1)+1;renderQuestions()};document.getElementById('addOption')?.addEventListener('click',()=>{q.options=q.options||[];q.options.push({id:String.fromCharCode(65+q.options.length),label:'New answer option'});renderQuestions()});document.querySelectorAll('[data-delete-opt]').forEach(b=>b.onclick=()=>{q.options.splice(Number(b.dataset.deleteOpt),1);renderQuestions()});document.getElementById('impactQ')?.addEventListener('click',()=>showImpact(q.id))}function questionForm(q){return `<div style="display:flex;justify-content:space-between"><div><h2 style="margin:0">${esc(q.id)}</h2><span class="small">${q.active===false?'Retired':'Active'}</span></div><button class="btn" id="impactQ">Dependencies</button></div><div class="field"><label>Section</label><input id="qSection" value="${esc(q.section)}"></div><div class="field"><label>CIO wording</label><textarea id="qPrompt">${esc(q.prompt)}</textarea></div><div class="field"><label>Diagnostic intent</label><textarea id="qIntent">${esc(q.intent)}</textarea></div><div class="grid2"><div class="field"><label>Interaction</label><select id="qInteraction">${TYPES.map(t=>`<option ${q.interaction===t?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label>Answer design principle</label><textarea id="qDesign">${esc(q.answerDesign||'')}</textarea></div></div><div class="field"><label>Answer choices</label>${(q.options||[]).map((o,i)=>`<div class="grid2" style="margin:6px 0"><input data-opt-id="${i}" value="${esc(o.id)}"><input data-opt-label="${i}" value="${esc(o.label)}"></div><div style="text-align:right"><button class="btn danger" data-delete-opt="${i}">Remove option</button></div>`).join('')}<button class="btn" id="addOption">+ Add option</button></div><div class="grid2"><div class="field"><label>Finding references</label><input id="qFindings" value="${esc((q.findingIds||[]).join(', '))}"></div><div class="field"><label>Recommendation references</label><input id="qRecs" value="${esc((q.recommendationIds||[]).join(', '))}"></div></div><div class="mutedBox small"><b>Scoring references</b><br>${esc(JSON.stringify(q.scoring||{}))}</div><div style="margin-top:12px"><button class="btn primary" id="saveQ">Save changes</button></div>`}function renderScoring(){document.getElementById('app').innerHTML=`<div class="card"><h2>Scoring</h2><p class="small">Dimension weights are editable here. Question-level mappings are visible so a change to wording/type can be reviewed against scoring dependencies.</p><table><tr><th>ID</th><th>Dimension</th><th>Type</th><th>Weight</th></tr>${cfg.dimensions.map((d,i)=>`<tr><td>${esc(d.id)}</td><td>${esc(d.name)}</td><td>${esc(d.type)}</td><td><input data-weight="${i}" type="number" min="0" step="0.1" value="${d.weight}"></td></tr>`).join('')}</table><div style="margin-top:12px"><button class="btn primary" id="saveWeights">Save weights</button></div><h3>Question scoring references</h3><table><tr><th>Question</th><th>Interaction</th><th>Dimensions</th><th>Map / normalization</th></tr>${cfg.questions.map(q=>`<tr><td>${esc(q.id)}</td><td>${esc(q.interaction)}</td><td>${esc((q.scoring?.dimensionIds||[]).join(', '))}</td><td><code>${esc(JSON.stringify(q.scoring||{}))}</code></td></tr>`).join('')}</table></div>`;document.getElementById('saveWeights').onclick=()=>{document.querySelectorAll('[data-weight]').forEach((x,i)=>cfg.dimensions[i].weight=Number(x.value)||0);renderScoring()}}function renderRules(){document.getElementById('app').innerHTML=`<div class="card"><h2>Adaptive Rules</h2><table><tr><th>ID</th><th>Area</th><th>Condition</th><th>Action</th><th>Trigger</th><th>Refs</th></tr>${cfg.rules.map(r=>`<tr><td>${esc(r.id)}</td><td>${esc(r.area)}</td><td>${esc(r.condition)}</td><td>${esc(r.action)}</td><td>${esc(r.triggerKey)}</td><td>${(r.questionRefs||[]).map(x=>`<span class="dep">${esc(x)}</span>`).join('')}</td></tr>`).join('')}</table><div class="mutedBox small" style="margin-top:12px"><b>Design note:</b> structured rule editing and simulation will be added after the master model proves the dependency contract.</div></div>`}function renderFindings(){document.getElementById('app').innerHTML=`<div class="card"><h2>Findings</h2>${cfg.findings.map(f=>`<div class="card" style="box-shadow:none;margin:8px 0"><div style="display:flex;justify-content:space-between"><b>${esc(f.id)} · ${esc(f.title)}</b><span class="pill">${esc(f.severity)}</span></div><p>${esc(f.description)}</p><div class="small">Dimension: ${esc(f.dimensionId||f.dimension)} · Recommendations: ${(f.recommendationIds||[]).join(', ')}</div></div>`).join('')}</div>`}function renderRecommendations(){document.getElementById('app').innerHTML=`<div class="card"><h2>Recommendations</h2>${cfg.recommendations.map(r=>`<div class="card" style="box-shadow:none;margin:8px 0"><b>${esc(r.id)} · ${esc(r.title)}</b><p>${esc(r.description)}</p><div class="small">LTM Service: ${esc(r.ltmService)} · Findings: ${(r.findingIds||[]).join(', ')}</div></div>`).join('')}</div>`}function renderSettings(){document.getElementById('app').innerHTML=`<div class="card"><h2>Release Settings</h2><div class="grid2"><div><label class="small">Release ID</label><input id="releaseId" value="${esc(cfg.manifest.releaseId)}"></div><div><label class="small">Status</label><select id="releaseStatus"><option>draft</option><option>validated</option><option>approved</option><option>released</option></select></div></div><div style="margin-top:12px"><button class="btn primary" id="saveSettings">Save settings</button></div></div>`;document.getElementById('releaseStatus').value=cfg.manifest.releaseStatus;document.getElementById('saveSettings').onclick=()=>{cfg.manifest.releaseId=document.getElementById('releaseId').value;cfg.manifest.releaseStatus=document.getElementById('releaseStatus').value;render()}}function graph(){const g={};for(const q of cfg.questions||[]){g[q.id]=[];for(const f of q.findingIds||[])g[q.id].push(f);for(const r of q.recommendationIds||[])g[q.id].push(r);for(const d of q.scoring?.dimensionIds||[])g[q.id].push(d)}for(const f of cfg.findings||[])g[f.id]=f.recommendationIds||[];for(const r of cfg.recommendations||[])g[r.id]=r.findingIds||[];return g}function dependents(target){const g=graph(),rev={};Object.entries(g).forEach(([a,bs])=>bs.forEach(b=>(rev[b]??=[]).push(a)));const seen=new Set([target]),q=[target];while(q.length){const x=q.shift();for(const y of rev[x]||[]){if(!seen.has(y)){seen.add(y);q.push(y)}}}return [...seen].filter(x=>x!==target)}function showImpact(target){const deps=dependents(target);document.getElementById('app').innerHTML=`<div class="card"><h2>Change Impact Analysis</h2><p>Downstream objects linked to <b>${esc(target)}</b>.</p>${deps.length?deps.map(x=>`<div class="impactRow"><span>${esc(x)}</span><span>${x.startsWith('CORE-')||x.startsWith('ADP-')?'Question':x.startsWith('F-')?'Finding':x.startsWith('R-')?'Recommendation':'Dimension'}</span><span class="pill">Review</span></div>`).join(''):'<p class="success">No downstream references detected.</p>'}<div style="margin-top:12px"><button class="btn" id="back">Back</button></div></div>`;document.getElementById('back').onclick=()=>{view='questions';renderQuestions()}}function saveDraft(){if(!cfg)return;localStorage.setItem(STORAGE,JSON.stringify(cfg));alert('Draft saved locally. Permanent collaboration still belongs in Git.')}function exportMaster(){if(!cfg)return;const b=new Blob([JSON.stringify(cfg,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='master-config.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),800)}function buildRelease(){const e=validate();if(e.length){alert('Release blocked. Fix '+e.length+' validation issue(s) first.');return}cfg.manifest.releaseStatus='validated';const pkg={manifest:cfg.manifest,components:{dimensions:cfg.dimensions,questions:cfg.questions,rules:cfg.rules,findings:cfg.findings,recommendations:cfg.recommendations,settings:cfg.settings}};const b=new Blob([JSON.stringify(pkg,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=cfg.manifest.releaseId+'.release.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),800);alert('Validated release package exported. Review the Git diff before committing/publishing.')}function loadDefault(){fetch(DEFAULT_URL,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error();return r.json()}).then(x=>{cfg=x;render()}).catch(()=>{const s=localStorage.getItem(STORAGE);if(s){cfg=JSON.parse(s);render()}else render()})}document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{view=b.dataset.view;render()});document.getElementById('importBtn').onclick=()=>document.getElementById('fileInput').click();document.getElementById('fileInput').onchange=e=>{const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{cfg=JSON.parse(r.result);render()}catch(err){alert('Invalid JSON: '+err.message)}};r.readAsText(f)};document.getElementById('exportBtn').onclick=exportMaster;document.getElementById('draftBtn').onclick=saveDraft;document.getElementById('restoreBtn').onclick=()=>{const s=localStorage.getItem(STORAGE);if(!s){alert('No local draft found.');return}cfg=JSON.parse(s);render()};document.getElementById('validateBtn').onclick=()=>{const e=validate();alert(e.length?'Validation failed:\n\n'+e.join('\n'):'Validation passed. No blocking integrity errors found.');render()};document.getElementById('impactBtn').onclick=()=>showImpact(selectedId||cfg.questions?.[0]?.id||cfg.findings?.[0]?.id);document.getElementById('releaseBtn').onclick=buildRelease;loadDefault();</script></body></html>
