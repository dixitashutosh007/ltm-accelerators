<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cost IQ — Configuration Driven Runtime</title><style>:root{--ink:#282828;--muted:#646464;--paper:#f8f7f5;--white:#fff;--coral:#ff5e4f;--line:#e8e5e1;--green:#86b99a}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,Arial,sans-serif}header{padding:24px 30px;background:#282828;color:#fff}main{max-width:1000px;margin:0 auto;padding:28px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;box-shadow:0 8px 28px rgba(40,40,40,.04)}button{padding:10px 14px;border:1px solid var(--line);border-radius:9px;background:#fff;cursor:pointer;font-weight:700}.primary{background:var(--coral);border-color:var(--coral);color:#fff}.bar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px}.opt{display:block;padding:13px;border:1px solid var(--line);border-radius:10px;margin:8px 0;cursor:pointer}.opt:hover{background:#faf8f6}.small{color:var(--muted);font-size:12px}.scale{display:flex;gap:7px;flex-wrap:wrap}.star{font-size:32px;border:0;background:transparent;padding:4px}.star.active{filter:brightness(.7)}input[type=range]{width:100%}.row{display:flex;justify-content:space-between;align-items:center;gap:16px}.error{color:#a62828}</style></head><body><header><h1>Cost IQ</h1><div id="meta" class="small" style="color:#ddd">Loading configuration…</div></header><main><div class="bar"><button id="newBtn" class="primary">New Assessment</button><button id="refreshBtn">Refresh Engine</button><button id="loadCfgBtn">Load Configuration</button><button id="saveBtn">Save Progress</button><button id="loadSessionBtn">Load Progress</button><input type="file" id="cfgInput" accept="application/json,.json" style="display:none"><input type="file" id="sessionInput" accept="application/json,.ciq" style="display:none"></div><div id="app"></div></main><script>let cfg=null,answers={},idx=0,releaseId='unknown';const defaultUrl='../config/current/config.json';async function loadConfig(){try{const r=await fetch(defaultUrl,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);cfg=await r.json();releaseId=cfg.manifest.releaseId;document.getElementById('meta').textContent='Release '+releaseId+' · configuration loaded';renderHome()}catch(e){document.getElementById('meta').innerHTML='<span class="error">Configuration file could not be fetched in this local browser. Use Load Configuration.</span>';renderHome()}}function renderHome(){document.getElementById('app').innerHTML=`<div class="card"><h2>Configuration-driven assessment</h2><p>This runtime does not own the methodology. Questions, answer types, scoring and rules come from the loaded configuration release.</p><p><b>Current release:</b> ${esc(releaseId)}</p><button id="start" class="primary">Start Assessment</button></div>`;document.getElementById('start').onclick=()=>{answers={};idx=0;renderQuestion()}}function renderQuestion(){const q=cfg.questions[idx];if(!q){renderReport();return}let body='';if(q.interaction==='single-select'){body=(q.options||[]).map(o=>`<label class="opt"><input type="radio" name="q" value="${esc(o.id)}" ${answers[q.id]===o.id?'checked':''}> ${esc(o.label)}</label>`).join('')}else if(q.interaction==='slider'){const v=answers[q.id]??50;body=`<input id="slider" type="range" min="${q.slider.min}" max="${q.slider.max}" step="${q.slider.step}" value="${v}"><div class="row"><span>${esc(q.slider.leftLabel)}</span><b id="sv">${v}</b><span>${esc(q.slider.rightLabel)}</span></div>`}else if(q.interaction==='stars'){const v=answers[q.id]??0;body=`<div class="scale">${[1,2,3,4,5].map(n=>`<button class="star ${n<=v?'active':''}" data-star="${n}" aria-label="${n} stars">★</button>`).join('')}</div><div class="small">${v?esc(q.stars.labels[v-1]):'Select a rating'}</div>`}else body='<p class="error">Unsupported interaction in this vertical slice.</p>';document.getElementById('app').innerHTML=`<div class="card"><div class="small">${esc(q.id)} · ${esc(q.section)} · Question ${idx+1} of ${cfg.questions.length}</div><h2>${esc(q.prompt)}</h2><p class="small">${esc(q.intent)}</p>${body}<div class="bar" style="margin-top:18px"><button id="back">Back</button><button id="next" class="primary">${idx===cfg.questions.length-1?'Finish':'Continue'}</button></div></div>`;document.getElementById('back').onclick=()=>{if(idx>0){idx--;renderQuestion()}else renderHome()};document.getElementById('next').onclick=()=>{if(answers[q.id]==null && q.interaction!=='slider' && q.interaction!=='stars'){alert('Please answer this question before continuing.');return}idx++;renderQuestion()};if(q.interaction==='single-select')document.querySelectorAll('input[name=q]').forEach(x=>x.onchange=()=>answers[q.id]=x.value);if(q.interaction==='slider'){document.getElementById('slider').oninput=e=>{answers[q.id]=Number(e.target.value);document.getElementById('sv').textContent=e.target.value}}if(q.interaction==='stars')document.querySelectorAll('[data-star]').forEach(b=>b.onclick=()=>{answers[q.id]=Number(b.dataset.star);renderQuestion()})}function score(){const dims={};for(const q of cfg.questions){let v=answers[q.id];if(v==null)continue;let s=null;if(q.interaction==='single-select')s=q.scoring?.map?.[v]??null;else if(q.interaction==='slider')s=Number(v);else if(q.interaction==='stars')s=Number(v)*20;if(s==null)continue;dims[q.scoring.dimensionId]=(dims[q.scoring.dimensionId]||[]).concat([s])}return Object.fromEntries(Object.entries(dims).map(([k,a])=>[k,Math.round(a.reduce((x,y)=>x+y,0)/a.length)]))}function renderReport(){const scores=score();const findings=[];for(const rule of cfg.rules){const v=answers[rule.when.questionId];let pass=false;if(v!=null){pass=rule.when.operator==='<'?Number(v)<rule.when.value:rule.when.operator==='<='?Number(v)<=rule.when.value:false}if(pass){const f=cfg.findings.find(x=>x.id===rule.findingId);if(f&&!findings.some(x=>x.id===f.id))findings.push(f)}}document.getElementById('app').innerHTML=`<div class="card"><h2>CIO Diagnostic Preview</h2><p class="small">Methodology release: ${esc(releaseId)}</p><h3>Scores</h3>${Object.entries(scores).map(([k,v])=>`<div class="row"><span>${esc(k)}</span><b>${v}/100</b></div>`).join('<hr>')}<h3>Findings</h3>${findings.length?findings.map(f=>`<div class="opt"><b>${esc(f.title)}</b><p>${esc(f.description)}</p></div>`).join(''):'<p>No rule-based findings triggered in this slice.</p>'}<button onclick="location.reload()">Start another assessment</button></div>`}function saveProgress(){const data={format:'CostIQ Assessment',version:'1.0',assessmentId:'CIQ-'+Date.now(),releaseId,answers,questionIndex:idx,savedAt:new Date().toISOString()};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=data.assessmentId+'.ciq';a.click();URL.revokeObjectURL(a.href)}function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[c]))}document.getElementById('newBtn').onclick=()=>{answers={};idx=0;renderHome()};document.getElementById('refreshBtn').onclick=loadConfig;document.getElementById('loadCfgBtn').onclick=()=>document.getElementById('cfgInput').click();document.getElementById('cfgInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{cfg=JSON.parse(r.result);releaseId=cfg.manifest.releaseId;document.getElementById('meta').textContent='Release '+releaseId+' · configuration loaded from file';renderHome()};r.readAsText(f)};document.getElementById('saveBtn').onclick=saveProgress;document.getElementById('loadSessionBtn').onclick=()=>document.getElementById('sessionInput').click();document.getElementById('sessionInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const d=JSON.parse(r.result);answers=d.answers||{};idx=d.questionIndex||0;releaseId=d.releaseId||releaseId;renderQuestion()};r.readAsText(f)};loadConfig();</script></body></html>
