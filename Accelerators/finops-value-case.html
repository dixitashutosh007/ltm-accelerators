.rg-pulse-container { position: relative; width: 110px; height: 110px; margin-bottom: 30px; }
.rg-pulse-ring {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  border: 2px solid rgba(255,94,79,0.35); border-radius: 50%;
  animation: radarPulse 2.4s ease-out infinite;
}
.rg-pulse-ring:nth-child(1) { width: 36px; height: 36px; animation-delay: 0s; }
.rg-pulse-ring:nth-child(2) { width: 36px; height: 36px; animation-delay: 0.6s; }
.rg-pulse-ring:nth-child(3) { width: 36px; height: 36px; animation-delay: 1.2s; }
.rg-core-dot {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
  width: 12px; height: 12px; border-radius: 50%;
  background: #FF5E4F; box-shadow: 0 0 20px rgba(255,94,79,0.6);
}
@keyframes radarPulse {
  0%   { transform: translate(-50%,-50%) scale(1); opacity: 0.8; border-color: rgba(255,94,79,0.5); }
  100% { transform: translate(-50%,-50%) scale(3.5); opacity: 0; border-color: rgba(255,94,79,0); }

.rg-step-list { list-style: none; padding: 0; margin: 0 0 28px; width: 420px; max-width: 90vw; }
.rg-step {
  display: flex; align-items: center; gap: 12px;

.rg-step.active { color: #fff; transform: translateX(4px); }
.rg-step.done { color: rgba(255,255,255,0.6); }
.rg-step-icon {
  width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;
  border: 1.5px solid rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center;
  font-size: 11px; transition: 0.3s;
}
.rg-step.active .rg-step-icon { border-color: #FF5E4F; background: rgba(255,94,79,0.15); box-shadow: 0 0 12px rgba(255,94,79,0.3); color: #FF8A7A; }
.rg-step.done .rg-step-icon { border-color: #35754D; background: #35754D; color: #fff; }

.rg-progress-track { width: 340px; max-width: 80vw; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }
.rg-progress-fill { height: 100%; width: 0; background: linear-gradient(90deg, #FF5E4F, #FF8A7A); border-radius: 2px; transition: width 0.6s ease; }

function clone(o){return JSON.parse(JSON.stringify(o));}
function today(){return new Date().toISOString().slice(0,10);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
const $=s=>document.querySelector(s); const app=$("#app");
function cur(){const id=(S.screen==="report"&&S.reportCurrency)?S.reportCurrency:S.org.currency;return (S.kb.meta.currencies.find(c=>c.id===id)||{symbol:"£"}).symbol;}
function money(n){ if(n==null||!isFinite(n))return "—";
  const s=cur();
  if(n>=1e9)return s+(n/1e9).toFixed(1).replace(/\.0$/,"")+"bn";
  if(n>=1e6)return s+(n/1e6).toFixed(1).replace(/\.0$/,"")+"m";
  if(n>=1e3)return s+Math.round(n/1e3)+"k";
  return s+Math.round(n); }
function logVal(pos,sl){ const min=Math.log(sl.min),max=Math.log(sl.max);
  return Math.round(Math.exp(min+(max-min)*(pos/sl.steps))/10000)*10000; }
function logPos(val,sl){ const min=Math.log(sl.min),max=Math.log(sl.max);
  return Math.round(((Math.log(Math.max(sl.min,val))-min)/(max-min))*sl.steps); }

/* ---------------- scoring (Bridge to AWS Lambda ap-south-1) ---------------- */
// Scoring runs on the Advisory API; LTM_API attaches the signed-in user's token.
const EVALUATE_API_PATH = "/api/evaluate/finops-value-case";

// Returns the server's evaluation, or null if scoring failed. Never falls back to local or stale results.
/* Scales an allocation to whole numbers totalling exactly 100 (largest remainder); null if nothing allocated.
   Same rule as the engine's normaliseAllocation, so the API always receives a total of 100. */
function normaliseAlloc(al){
  if(!al||typeof al!=="object"||Array.isArray(al))return null;
  const keys=Object.keys(al).filter(k=>typeof al[k]==="number"&&isFinite(al[k])&&al[k]>=0);
  const total=keys.reduce((t,k)=>t+al[k],0);
  if(!keys.length||total<=0)return null;
  const raw=keys.map(k=>({k:k,v:al[k]/total*100}));
  const out={};
  raw.forEach(r=>{out[r.k]=Math.floor(r.v);});
  let left=100-raw.reduce((t,r)=>t+out[r.k],0);
  raw.slice().sort((x,y)=>(y.v-Math.floor(y.v))-(x.v-Math.floor(x.v))).forEach(r=>{if(left>0){out[r.k]++;left--;}});
  return out;
}
/* The answers as sent to the scoring API: allocation splits are scaled to total 100. */
function answersForScoring(){
  const out=Object.assign({},S.answers);
  (S.kb.questions||[]).forEach(q=>{
    if(q.answer_type!=="allocation_100"||out[q.id]===undefined||out[q.id]==="__DK__")return;
    const n=normaliseAlloc(out[q.id]);
    if(n)out[q.id]=n;else delete out[q.id];
  });
  return out;
}

async function fetchCloudEvaluation() {
  S.evaluation = null;
  hideScoringError();
  try {
    const payload = {
      answers: answersForScoring(),
      org: {
        name: S.org.name || "",
        sector: S.org.sector || "",
        sector_class: S.org.sector_class,
        currency: S.org.currency
      }
    };
    const res = await LTM_API.fetch(EVALUATE_API_PATH, {
      method: "POST",
      body: JSON.stringify(payload)
    });
    const json = await res.json().catch(() => null);
    if (res.ok && json && json.ok && json.data) {
      S.evaluation = json.data;
      return S.evaluation;
    }
    console.error("Evaluation API error:", res.status, json);
  } catch (err) {
    console.error("Failed to connect to evaluation API:", err);
  }
  showScoringError();
  return null;
}

function showScoringError(){
  let el = document.getElementById("scoringError");
  if (!el) {
    el = document.createElement("div");
    el.id = "scoringError";
    el.className = "scoring-error";

function showReportGenerationAnimation(callback) {
  const evalPromise = fetchCloudEvaluation();
  var overlay = document.createElement('div');
  overlay.className = 'report-gen-overlay';
  overlay.id = 'report-gen-overlay';
  var steps = [
    'Benchmarking Estate Scale & Growth Trajectory…',

    'Formulating Phased 30-60-90 Day Execution Roadmap…',

    '<div class="rg-pulse-container"><div class="rg-pulse-ring"></div><div class="rg-pulse-ring"></div><div class="rg-pulse-ring"></div><div class="rg-core-dot"></div></div>' +
    '<div class="rg-title">Synthesizing Cloud Financial Diagnostic</div>' +
    '<div class="rg-subtitle">Correlating estate declarations against 40+ FinOps capabilities, published benchmarks, and peer patterns</div>' +
    '<ul class="rg-step-list">' +
      steps.map(function(s,i){ return '<li class="rg-step" id="rg-step-'+i+'"><div class="rg-step-icon">'+(i+1)+'</div><span>'+s+'</span></li>'; }).join('') +
    '</ul>' +
    '<div class="rg-progress-track"><div class="rg-progress-fill" id="rg-pf"></div></div>';
  document.body.appendChild(overlay);

  var totalDuration = 3800;
  var stepDuration = totalDuration / steps.length;
  var pf = overlay.querySelector('#rg-pf');

  function activateStep(idx) {
    if (idx > 0) {
      var prev = overlay.querySelector('#rg-step-'+(idx-1));
      if (prev) { prev.classList.remove('active'); prev.classList.add('done'); prev.querySelector('.rg-step-icon').textContent = '✓'; }
    }
    var cur = overlay.querySelector('#rg-step-'+idx);
    if (cur) cur.classList.add('active');
    if (pf) pf.style.width = ((idx+1)/steps.length*100)+'%';
  }

  activateStep(0);
  for (var i = 1; i < steps.length; i++) {
    (function(si){ setTimeout(function(){ activateStep(si); }, si*stepDuration); })(i);
  }
  setTimeout(function(){
    var last = overlay.querySelector('#rg-step-'+(steps.length-1));
    if (last) { last.classList.remove('active'); last.classList.add('done'); last.querySelector('.rg-step-icon').textContent = '✓'; }
    if (pf) pf.style.width = '100%';
    setTimeout(function(){
      overlay.classList.add('fade-out');
      setTimeout(function(){
        if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
        evalPromise.then(result => { if (result) callback(); else render(); });
      }, 500);
    }, 400);
  }, totalDuration);
}

    b='<div class="opts">'+q.options.map((o,i)=>'<button class="opt'+(a===i?' sel':'')+'" data-a="ansIdx" data-q="'+q.id+'" data-i="'+i+'"><span class="optdot"></span>'+esc(o.label)+'</button>').join("")
     +(q.allow_dk?'<button class="opt dk'+(dk?' sel':'')+'" data-a="ansDK" data-q="'+q.id+'"><span class="optdot"></span>We don\'t know</button>':'')+'</div>';
  } else if(q.answer_type==="multi_select"){
    const arr=Array.isArray(a)?a:[];
    b='<div class="opts">'+q.options.map((o,i)=>'<button class="opt'+(arr.includes(i)?' sel':'')+'" data-a="ansMulti" data-q="'+q.id+'" data-i="'+i+'"><span class="optbox">'+(arr.includes(i)?'✓':'')+'</span>'+esc(o.label)+'</button>').join("")+'</div>';
  } else if(q.answer_type==="boolean_dk"){
    b='<div class="bool3"><button class="b3'+(a==="yes"?' on':'')+'" data-a="ansVal" data-q="'+q.id+'" data-v="yes">Yes</button>'
     +'<button class="b3'+(a==="no"?' on':'')+'" data-a="ansVal" data-q="'+q.id+'" data-v="no">No</button>'
     +'<button class="b3 dk'+(a==="dk"?' on':'')+'" data-a="ansVal" data-q="'+q.id+'" data-v="dk">We don\'t know</button></div>';
  } else if(q.answer_type==="rating_1_5"){
    b='<div class="rating">'+[1,2,3,4,5].map(n=>'<button class="ratebtn'+(a===n?' on':'')+'" data-a="ansNum" data-q="'+q.id+'" data-v="'+n+'"><span class="raten">'+n+'</span><span class="ratel">'+esc(q.labels[n-1])+'</span></button>').join("")+'</div>';
  } else if(q.answer_type==="slider_currency"){
    const sl=q.slider; const v=(typeof a==="number")?a:sl.default; const pos=logPos(v,sl);
    b='<div class="slwrap"><div class="slrow"><input class="sl" type="range" min="0" max="'+sl.steps+'" step="1" value="'+pos+'" data-a="ansCur" data-q="'+q.id+'"/>'
     +'<div class="slval big" id="v_'+q.id+'">'+(dk?"—":money(v))+'</div></div>'
     +'<div class="slbands"><span>'+money(sl.min)+'</span><span>'+money(sl.max)+'</span></div>'
     +'<button class="dkbtn'+(dk?' on':'')+'" data-a="ansDK" data-q="'+q.id+'">We don\'t know</button></div>';
  } else if(q.answer_type==="slider_percent"||q.answer_type==="slider_signed"){
    const sl=q.slider; const v=(typeof a==="number")?a:sl.default;
    b='<div class="slwrap"><div class="slrow"><input class="sl" type="range" min="'+sl.min+'" max="'+sl.max+'" step="'+sl.step+'" value="'+v+'" data-a="ansSl" data-q="'+q.id+'"/>'
     +'<div class="slval" id="v_'+q.id+'">'+(dk?"—":(v>0&&q.answer_type==="slider_signed"?"+":"")+v+(sl.suffix||""))+'</div></div>'
     +(q.allow_dk?'<button class="dkbtn'+(dk?' on':'')+'" data-a="ansDK" data-q="'+q.id+'">We don\'t know</button>':'')+'</div>';
  } else if(q.answer_type==="allocation_100"){
    const al=(a&&typeof a==="object")?a:{engineering:25,finance:25,central_it:25,nobody:25};
    const tot=Object.values(al).reduce((x,y)=>x+y,0);
    b='<div class="alloc"><div class="allocbar">'+q.buckets.map(bk=>'<div class="allocseg" style="width:'+(al[bk.id]||0)+'%;background:'+bk.color+'"></div>').join("")+'</div>'
     +q.buckets.map(bk=>'<div class="allocrow"><div class="alloclabel"><span class="allocdot" style="background:'+bk.color+'"></span>'+esc(bk.label)+'</div>'
     +'<input class="sl" type="range" min="0" max="100" step="5" value="'+(al[bk.id]||0)+'" data-a="ansAlloc" data-q="'+q.id+'" data-b="'+bk.id+'"/>'
     +'<div class="allocnum">'+(al[bk.id]||0)+'</div></div>').join("")
     +'<div class="alloctotal '+(tot===100?"ok":"off")+'">Total: '+tot+' / 100'+(tot===100?' ✓':' — adjust to reach 100, or we will scale your split to 100 when scoring')+'</div></div>';
  } else if(q.answer_type==="drag_order"){
    const ord=Array.isArray(a)?a:q.options.slice();
    b='<ol class="drag">'+ord.map((it,i)=>'<li class="dragitem"><span class="dragrank">'+(i+1)+'</span><span class="draglabel">'+esc(it)+'</span>'
     +'<span class="dragctl"><button data-a="dUp" data-q="'+q.id+'" data-i="'+i+'" '+(i===0?'disabled':'')+'>▲</button>'
     +'<button data-a="dDn" data-q="'+q.id+'" data-i="'+i+'" '+(i===ord.length-1?'disabled':'')+'>▼</button></span></li>').join("")+'</ol>';
  } else if(q.answer_type==="open_text"){
    b='<textarea class="notebox" data-a="ansText" data-q="'+q.id+'" placeholder="'+esc(q.placeholder||"")+'">'+esc(dk?"":(a||""))+'</textarea>';
  }
  return '<div class="q"><div class="qtext">'+esc(q.text)+'</div>'+(q.hint?'<div class="qhint">'+esc(q.hint)+'</div>':'')+b+'</div>';
}

    : '<p style="color:#5B5B5B;font-size:13.5px">Controls scored above threshold across every signal. A short validation review against billing data is still recommended.</p>';

    +'<button class="csbtn no-print" data-a="dlCase" data-id="'+cs.id+'">Download PDF</button></div>').join("");

  const notes=S.answers["X1"];
  const isUnlocked = !!S.consultantUnlocked;

    ? '<div class="consultant-banner no-print">'
      +'<div class="consultant-banner-left"><span>🔓</span> <b>Consultant Mode Active:</b> Full 90-day roadmap and detailed deliverables are unmasked for live client presentation.</div>'
      +'<button class="btn sm ghost" data-a="toggleConsultant" style="background:#fff">Relock Client Teaser Mode 🔒</button>'
      +'</div>'
    : '';

    +'<div class="repsec"><h3>Recommended 90-Day Execution Roadmap</h3>'
    +'<p style="color:#5B5B5B;font-size:13.5px;margin:0 0 16px">Sequenced to prioritize immediate cash-reclaim quick wins first, followed by structural governance and unit margin defense.</p>'
    +roadmapHtml+'</div>'
    +'<div class="repsec"><h3>Detailed Stream Backlog & Deliverables</h3>'
    +'<p style="color:#5B5B5B;font-size:13.5px;margin-top:0">Granular work packages tailored to your weakest diagnostic signals.</p>'
    +svcBlock+'</div>'
    +'<div class="repsec"><h3>Relevant Case Studies</h3>'
    +'<p style="color:#5B5B5B;font-size:13.5px;margin-top:0">Selected against your weakest signals.</p>'
    +(csBlock?'<div class="csgrid">'+csBlock+'</div>':'<p style="color:#5B5B5B;font-size:13.5px;margin-top:0">Client case studies available upon request.</p>')+'</div>'
    +'<div class="repsec"><h3>Engagement Model: Two-Week Baseline Assessment</h3><div class="nextstep">'
    +'<div style="font-family:\'Manrope\',sans-serif;font-size:17px;font-weight:600;color:#282828;margin-bottom:6px">A two-week FinOps baseline assessment</div>'
    +'<p style="color:#5B5B5B;font-size:13.5px;margin:0 0 14px">Replaces every estimate in this document with verified figures derived from actual cloud billing data. Delivers a validated waste baseline, a prioritized savings backlog with designated owners, and a board-ready business case.</p>'
    +'<div class="broch" style="background:#fff"><div><div class="brochtitle">'+esc(M.brochure.title)+'</div>'
    +'<div class="brochsub">'+esc(M.brochure.subtitle)+'</div></div>'
    +(M.brochure.status==="placeholder"?'</div></div></div>':'<button class="csbtn no-print" data-a="dlBrochure">Download brochure</button></div></div></div>')
    +'</div>';

  // Wrap gated content with teaser overlay if locked
  const gatedWrapper = isUnlocked
    ? gatedContent
    : `<div class="gated-wrapper">
        <div class="gated-overlay no-print">
          <div class="gated-lock-badge">🔒 CIO ACTION PLAN LOCKED</div>
          <div class="gated-lock-title">Unlock Your Complete 90-Day Roadmap & Stream Backlog</div>
          <p class="gated-lock-text">

            To validate your baseline against actual billing data and prioritize quick-win cash reclaims for your executive committee, schedule a 30-minute strategy session with our FinOps practice.

          </div>

        </div>
        <div class="gated-blur-layer">
          ${gatedContent}
        </div>
      </div>`;

  return '<div class="reportwrap">'
   +consultantBar
   +'<div class="reportbar no-print"><button class="btn ghost" data-a="goto" data-s="assess">← Edit answers</button>'
   +'<button class="btn ghost" data-a="exportRes">Export results ↓</button>'

   +'<div style="text-align:right" class="mono" style="font-size:10px"><div class="mlab">Prepared</div><div class="mline">'+esc(r.date)+'</div></div></div>'

   +'<div class="repsec"><h3>1 · The value at stake</h3>'+opener+moneyBlock+'</div>'

   +'<div class="repsec"><h3>2 · Executive Verdict</h3><div class="verdictrow">'

   +'<div><div class="vhead">'+(v?esc(v.headline):"Not enough data")+'</div><p class="vnarr">'+(v?esc(v.narrative):"Complete more of the assessment to produce a verdict.")+'</p>'
   +'<p class="vnarr" style="margin-top:8px"><b>'+(v?esc(v.label):"")+'</b>'+(weak.length?' &middot; Weakest areas: '+esc(weak.join(" and ")):'')+'</p></div></div></div>'

   +blindBlock

   +'<div class="repsec"><h3>'+(bs.length?4:3)+' · Diagnostic Signal Breakdown</h3>'
   +'<p style="color:#5B5B5B;font-size:13px;margin-top:0">Higher is better. These core signals reflect governance maturity. Cost visibility and controls set your addressable waste band; all five shape the need index and the streams below.</p>'+sigBlock+'</div>'

   +'<div class="repsec"><h3>'+(bs.length?5:4)+' · Strategic Optimization Streams</h3>'
   +'<p style="color:#5B5B5B;font-size:13.5px;margin-top:0">Prioritized breakdown of where your cloud estate is leaking value, and where immediate capital can be reclaimed.</p>'
   +streamsBlock+'</div>'

   +gatedWrapper

   +(notes&&notes!=="__DK__"?'<div class="repsec"><h3>Respondent notes</h3><p style="color:#313131;font-size:13.5px;background:#F9F9F9;border-left:3px solid var(--steel);padding:12px 16px;border-radius:0 6px 6px 0;margin:0">'+esc(notes)+'</p></div>':'')

   +'<div class="repsec"><h3>Basis and sources</h3>'
   +M.benchmarks.sources.map(s=>'<p style="color:#5B5B5B;font-size:12.5px;margin:0 0 8px"><b>'+esc(s.label)+'</b> — '+esc(s.note)+'</p>').join("")
   +'<p style="color:#8E8E8E;font-size:12px;margin-top:12px">'+esc(M.benchmarks.honesty_note)+'</p></div>'

   +'</div><div class="repfoot">Prepared with the FinOps Value Case accelerator · LTM Vantage · Responsible Advisory.<div style="margin-top:8px">'+esc(M.disclaimer)+'</div></div></div></div>';
}

/* ---------------- events ---------------- */
let tT=null;
function toast(m){let t=$(".toast");if(!t){t=document.createElement("div");t.className="toast";document.body.appendChild(t);}t.textContent=m;clearTimeout(tT);tT=setTimeout(()=>t.remove(),3000);}
function dl(name,text,type){const b=new Blob([text],{type:type||"application/json"});const u=URL.createObjectURL(b);
  const a=document.createElement("a");a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);}

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a],[data-nav]"); if(!el)return;
  if(el.dataset.nav){S.tab=el.dataset.nav;render();return;}
  const a=el.dataset.a, q=el.dataset.q;
  if(a==="goto"){
    S.tab="assessment";
    const targetScreen = el.dataset.s;
    if(targetScreen === "checkpoint" || targetScreen === "report"){
      fetchCloudEvaluation().then(function(result){
        if (!result) return;
        S.screen = targetScreen;
        render();
        window.scrollTo(0,0);
      });
    } else {
      S.screen = targetScreen;
      render();
      window.scrollTo(0,0);
    }
  }
  else if(a==="startAssess"){if(!S.org.name||!S.respondent.name)return;S.screen="assess";S.secIdx=0;render();window.scrollTo(0,0);}
  else if(a==="secBack"){if(S.secIdx===0)S.screen="org";else S.secIdx--;render();window.scrollTo(0,0);}
  else if(a==="secNext"){S.secIdx++;render();window.scrollTo(0,0);}
  else if(a==="gotoSec"){S.secIdx=Number(el.dataset.i);render();window.scrollTo(0,0);}
  else if(a==="goCheckpoint"){
    const btn = el;
    const origHtml = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '⚡ Calculating Score...';
    fetchCloudEvaluation().then(function(result){
      btn.disabled = false;
      btn.innerHTML = origHtml;
      if (!result) return;
      S.screen="checkpoint";
      render();
      window.scrollTo(0,0);
    });
  }
  else if(a==="secBackToLast"){
    S.screen="assess";S.secIdx=S.kb.sections.length-1;render();window.scrollTo(0,0);
  }
  else if(a==="generateEngineReport"){
    showReportGenerationAnimation(function(){
      S.reportCurrency=S.org.currency;
      S.screen="report";
      render();
      window.scrollTo(0,0);
    });
  }
  else if(a==="goReport"){
    showReportGenerationAnimation(function(){
      S.reportCurrency=S.org.currency;
      S.screen="report";
      render();
      window.scrollTo(0,0);
    });
  }
  else if(a==="print" || a==="saveS3Report"){
    const btn = el;
    const isSaveOnly = a==="saveS3Report";
    const origHtml = btn.innerHTML;
    const paper = document.querySelector('.paper');

    function executeArchive(clientNameConfirmed) {
      if (!window.html2pdf || !paper || !window.LTM_S3) {
        alert('PDF generator or storage service not available.');
        return;
      }
      btn.disabled = true;
      btn.innerHTML = '☁️ Archiving Report...';

      const opt = {
        margin: 10,
        filename: (clientNameConfirmed || S.org.name || 'Client').replace(/\s+/g, '_') + '_FinOps_Value_Case.pdf',
        image: { type: 'jpeg', quality: 0.95 },
        html2canvas: { scale: 1.5, useCORS: true },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };

      html2pdf().set(opt).from(paper).toPdf().outputPdf('datauristring').then(function(pdfBase64){
        return window.LTM_S3.saveReportToS3({
          acceleratorId: 'finops-value-case',
          clientName: clientNameConfirmed || S.org.name || 'Enterprise Client',
          pdfBase64: pdfBase64,
          metadata: {
            needIndex: needIndex(),
            verdict: verdict() ? verdict().label : 'N/A',
            annualSpend: annualSpend()
          }
        });
      }).then(function(res){
        btn.disabled = false;
        btn.innerHTML = '✅ Saved!';
        setTimeout(function(){ btn.innerHTML = origHtml; }, 3500);
        window.LTM_S3.showS3SuccessBanner(res);
      }).catch(function(err){
        btn.disabled = false;
        btn.innerHTML = origHtml;
        alert('Could not archive report: ' + err.message);
      });
    }

    if (isSaveOnly) {
      if (window.LTM_S3 && window.LTM_S3.requestArchiveConsent) {
        window.LTM_S3.requestArchiveConsent({
          acceleratorId: 'finops-value-case',
          acceleratorTitle: 'FinOps Value Case Diagnostic',
          clientName: S.org.name || 'Enterprise Client'
        }, function(confirmedClient) {
          executeArchive(confirmedClient);
        });
      } else {
        executeArchive(S.org.name || 'Enterprise Client');
      }
      return;
    }

    window.print();
  }
  else if(a==="toggleConsultant"){S.consultantUnlocked=!S.consultantUnlocked;render();window.scrollTo(0,0);}
  else if(a==="bookSession"){
    const sig=signalScores(), n=needIndex(), v=verdict(), ex=exposure();
    const streams=computeStreams(sig, annualSpend(), S.answers);
    const crit=streams.filter(s=>s.priorityOrder<=2).map(s=>s.name+" ("+s.priority+")");
    if(window.LTM && window.LTM.contactUs){
      window.LTM.contactUs.setReport({
        headline: v?v.headline:"FinOps Value Case",
        topSignals: Object.keys(sig).filter(k=>sig[k]!==null).map(k=>k+": "+sig[k]+"/100"),
        needIndex: n,
        exposureY1: ex.y1 ? money(ex.y1[0])+" – "+money(ex.y1[1]) : "Unquantified",
        priorityStreams: crit.join(" | ")
      });
      window.LTM.contactUs.open();
      // Pre-fill modal textarea priority and details if modal exists in DOM
      setTimeout(()=>{
        const modal = document.getElementById("ltm-cu-modal");
        if(modal){
          const nameInput = modal.querySelector('input[name="name"]');
          const compInput = modal.querySelector('input[name="company"]');
          const roleInput = modal.querySelector('input[name="role"]');
          const emailInput = modal.querySelector('input[name="email"]');
          const prioText = modal.querySelector('textarea[name="priority"]');
          if(nameInput && S.respondent.name) nameInput.value = S.respondent.name;
          if(compInput && S.org.name) compInput.value = S.org.name;
          if(roleInput && S.respondent.role) roleInput.value = S.respondent.role;
          if(emailInput && S.respondent.email) emailInput.value = S.respondent.email;
          if(prioText){
            prioText.value = "Walk through the FinOps Value Case results for " + (S.org.name || "our organisation")
              + " (" + (ex.y1 ? money(ex.y1[0]) + "–" + money(ex.y1[1]) : "value") + " at stake). "
              + "Focus areas: " + (crit.slice(0,2).join(", ") || "Immediate quick-wins") + " and tailored 90-day roadmap.";
          }
        }
      }, 50);
    }
  }
  else if(a==="ansIdx"){const i=Number(el.dataset.i);if(S.answers[q]===i)delete S.answers[q];else S.answers[q]=i;render();}
  else if(a==="ansVal"){const v=el.dataset.v;if(S.answers[q]===v)delete S.answers[q];else S.answers[q]=v;render();}
  else if(a==="ansNum"){const v=Number(el.dataset.v);if(S.answers[q]===v)delete S.answers[q];else S.answers[q]=v;render();}
  else if(a==="ansDK"){if(S.answers[q]==="__DK__")delete S.answers[q];else S.answers[q]="__DK__";render();}
  else if(a==="ansMulti"){const i=Number(el.dataset.i);const qq=S.kb.questions.find(x=>x.id===q);
    let arr=Array.isArray(S.answers[q])?S.answers[q].slice():[];
    const opt=qq.options[i];
    if(opt.exclusive){ arr=arr.includes(i)?[]:[i]; }
    else { const p=arr.indexOf(i); if(p>=0)arr.splice(p,1);else arr.push(i);
      arr=arr.filter(j=>!qq.options[j].exclusive); }
    if(arr.length)S.answers[q]=arr;else delete S.answers[q]; render();}
  else if(a==="dUp"||a==="dDn"){const i=Number(el.dataset.i);const qq=S.kb.questions.find(x=>x.id===q);
    const ord=Array.isArray(S.answers[q])?S.answers[q].slice():qq.options.slice();
    const j=i+(a==="dUp"?-1:1); if(j<0||j>=ord.length)return;
    [ord[i],ord[j]]=[ord[j],ord[i]]; S.answers[q]=ord; render();}
  else if(a==="dlCase"){const cs=S.kb.meta.case_studies.find(c=>c.id===el.dataset.id);
    if(cs.status==="placeholder")toast("Placeholder — drop the approved PDF at "+cs.file);
    else window.open(cs.file,"_blank");}
  else if(a==="dlBrochure"){const b=S.kb.meta.brochure;
    if(b.status==="placeholder")toast("Placeholder — drop the brochure PDF at "+b.file);
    else window.open(b.file,"_blank");}
  else if(a==="exKb"){dl("finops-valuecase-bank-"+today()+".json",JSON.stringify(S.kb,null,2));toast("Question bank exported");}
  else if(a==="exCsv"){dl("finops-valuecase-questions-"+today()+".csv",toCsv(),"text/csv");toast("CSV exported");}
  else if(a==="imKb"){$("#fileImport").click();}
  else if(a==="resetKb"){S.kb=clone(DEFAULT_KB);S.answers={};render();toast("Reset to default");}
  else if(a==="setLtm"){$("#fileLtm").click();}
  else if(a==="applyJson"){try{const p=JSON.parse($("#jsoned").value);
    if(p&&p.meta&&Array.isArray(p.questions)){S.kb=p;S.answers={};render();toast("Applied");}
    else toast("Not a valid instrument (need meta and questions)");}catch(err){toast("Invalid JSON — "+err.message);}}
  else if(a==="revert"){render();}
  else if(a==="exportRes"){dl("finops-valuecase-results-"+today()+".json",JSON.stringify({
      org:S.org,respondent:S.respondent,answers:S.answers,
      signals:signalScores(),needIndex:needIndex(),urgency:urgencyIndex(),
      exposure:exposure(),blindSpots:blindSpots().map(b=>b.questionId),
      services:recommendedServices().map(s=>s.id)},null,2));toast("Results exported");}
  else if(a==="upOrg"){$("#fileOrg").click();}
  else if(a==="clrOrg"){S.org.logo=null;render();}
});
$("#ltmLogo").addEventListener("click",()=>$("#fileLtm").click());

document.addEventListener("input",e=>{
  const el=e.target;
  if(el.dataset.model){const[o,k]=el.dataset.model.split(".");S[o][k]=el.value;
    const b=document.querySelector('[data-a="startAssess"]');
    if(b)b.disabled=!(S.org.name&&S.respondent.name);
    return;}
  if(el.dataset.band!==undefined){const i=Number(el.dataset.band);
    S.kb.meta.waste_model.bands[i][el.dataset.f]=Number(el.value)||0;return;}
  const q=el.dataset.q, a=el.dataset.a;
  if(a==="ansText"){if(el.value)S.answers[q]=el.value;else delete S.answers[q];return;}
  if(a==="ansCur"){const qq=S.kb.questions.find(x=>x.id===q);const v=logVal(Number(el.value),qq.slider);
    S.answers[q]=v;const lab=$("#v_"+q);if(lab)lab.textContent=money(v);return;}
  if(a==="ansSl"){const qq=S.kb.questions.find(x=>x.id===q);const v=Number(el.value);S.answers[q]=v;
    const lab=$("#v_"+q);if(lab)lab.textContent=(v>0&&qq.answer_type==="slider_signed"?"+":"")+v+(qq.slider.suffix||"");return;}
  if(a==="ansAlloc"){const b=el.dataset.b;
    const cur=(S.answers[q]&&typeof S.answers[q]==="object")?Object.assign({},S.answers[q]):{engineering:25,finance:25,central_it:25,nobody:25};
    cur[b]=Number(el.value); S.answers[q]=cur; render(); return;}
});
document.addEventListener("change",e=>{ if(e.target.dataset.model){const[o,k]=e.target.dataset.model.split(".");S[o][k]=e.target.value;render();} });

function readImg(e,which){const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{if(which==="ltm")S.ltmLogo=r.result;else S.org.logo=r.result;render();toast(which==="ltm"?"LTM logo set":"Logo added");};
  r.readAsDataURL(f);e.target.value="";}
$("#fileLtm").addEventListener("change",e=>readImg(e,"ltm"));
$("#fileOrg").addEventListener("change",e=>readImg(e,"org"));
$("#fileImport").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const p=JSON.parse(r.result);
    if(p&&p.meta&&Array.isArray(p.questions)){S.kb=p;S.answers={};render();toast("Instrument imported");}
    else toast("Not a valid instrument");}catch(err){toast("Import failed — invalid JSON");}e.target.value="";};
  r.readAsText(f);});

function toCsv(){
  const q2=v=>{const s=String(v==null?"":v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  const rows=[["id","section","answer_type","signals","allow_dk","text","options"].join(",")];
  S.kb.questions.forEach(q=>{
    let opts="";
    if(Array.isArray(q.options))opts=q.options.map(o=>typeof o==="string"?o:(o.label+(o.score!=null?"::"+o.score:""))).join(" | ");
    else if(q.buckets)opts=q.buckets.map(b=>b.label).join(" | ");
    else if(q.slider)opts="min="+q.slider.min+"; max="+q.slider.max;
    rows.push([q.id,q.section,q.answer_type,(q.signals||[]).map(s=>s.id+":"+s.w).join(" "),
      (q.allow_dk||q.answer_type==="boolean_dk")?"yes":"no",q.text,opts].map(q2).join(","));
  });
  return rows.join("\n");
}
render();

/* ---------- Splash Screen Controller ---------- */
let fvsTimer = null;
let fvsPhaseTimers = [];

function initValueSplash() {
  const splash = document.getElementById('finopsValueSplash');
  if (!splash) return;

  const bar = document.getElementById('fvsProgressBar');
  const pct = document.getElementById('fvsPctText');
  const log = document.getElementById('fvsStatusText');

  const phases = [
    { time: 100, pct: 25, msg: "Initializing FinOps Diagnostic Probes..." },
    { time: 450, pct: 55, msg: "Calibrating Benchmark Variance Models..." },
    { time: 850, pct: 85, msg: "Mounting Financial Optimization Logic..." },
    { time: 1300, pct: 100, msg: "FinOps Value Engine Ready." }
  ];

  phases.forEach(p => {
    const t = setTimeout(() => {
      if (bar) bar.style.width = p.pct + '%';
      if (pct) pct.textContent = p.pct + '%';
      if (log) log.textContent = p.msg;
    }, p.time);
    fvsPhaseTimers.push(t);
  });

  fvsTimer = setTimeout(() => {
    dismissValueSplash();
  }, 1750);
}

function dismissValueSplash() {
  if (fvsTimer) clearTimeout(fvsTimer);
  fvsPhaseTimers.forEach(t => clearTimeout(t));
  fvsPhaseTimers = [];
  const splash = document.getElementById('finopsValueSplash');
  if (!splash) return;
  splash.classList.add('splash-out');
  setTimeout(() => { splash.style.display = 'none'; }, 550);
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') dismissValueSplash();
});

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', initValueSplash);
} else {
  initValueSplash();
}
</script>
