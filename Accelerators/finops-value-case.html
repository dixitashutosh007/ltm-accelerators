    dlg.innerHTML =

    var loading = document.getElementById("__bundler_loading");

})();

  <script>
    (function(){
      var splash = document.getElementById('ltm-splash');
      if (!splash) return;
      var bar = document.getElementById('splashBar');
      var status = document.getElementById('splashStatus');
      var pct = document.getElementById('splashPct');
      var skip = document.getElementById('splashSkip');
      var canvas = document.getElementById('splash-canvas');

      // 1. Ambient Particle Wave Canvas
      var ctx = canvas ? canvas.getContext('2d') : null;
      var particles = [];
      var w, h;
      function resize() {
        if (!canvas) return;
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      if (ctx) {
        for (var i = 0; i < 45; i++) {
          particles.push({
            x: Math.random() * w,
            y: Math.random() * h,
            radius: Math.random() * 2 + 0.8,
            speedX: Math.random() * 0.8 + 0.2,
            speedY: (Math.random() - 0.5) * 0.4,
            alpha: Math.random() * 0.6 + 0.2,
            color: Math.random() > 0.4 ? '#FF5E4F' : '#3C829B'
          });
        }
        var animId;
        function renderParticles() {
          ctx.clearRect(0, 0, w, h);
          for (var p of particles) {
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.alpha;
            ctx.shadowBlur = 8;
            ctx.shadowColor = p.color;
            ctx.fill();

            p.x += p.speedX;
            p.y += p.speedY;
            if (p.x > w) p.x = 0;
            if (p.y < 0) p.y = h;
            if (p.y > h) p.y = 0;
          }
          animId = requestAnimationFrame(renderParticles);
        }
        renderParticles();
      }

      // 2. Cinematic Loading Sequence
      var steps = [
        { p: 18, text: "Calibrating 40+ FinOps Foundation capabilities..." },
        { p: 44, text: "Loading enterprise billing & sector waste models..." },
        { p: 72, text: "Synthesizing 5 optimization streams & benchmark telemetry..." },
        { p: 92, text: "Formulating executive 30-60-90 day roadmap engine..." },
        { p: 100, text: "Diagnostic Suite Ready · Launching Value Case..." }
      ];

      var stepIdx = 0;
      var duration = 2800; // 2.8 seconds total
      var stepInterval = duration / steps.length;
      var isDismissed = false;

      function updateStep(idx) {
        if (isDismissed || !steps[idx]) return;
        var s = steps[idx];
        if (bar) bar.style.width = s.p + '%';
        if (pct) pct.textContent = (s.p < 10 ? '0' : '') + s.p + '%';
        if (status) {
          status.style.opacity = '0';
          setTimeout(function(){
            status.textContent = s.text;
            status.style.opacity = '1';
          }, 120);
        }
      }

      updateStep(0);
      var timers = [];
      for (var j = 1; j < steps.length; j++) {
        (function(idx){
          timers.push(setTimeout(function(){ updateStep(idx); }, idx * stepInterval));
        })(j);
      }

      function dismiss() {
        if (isDismissed) return;
        isDismissed = true;
        timers.forEach(clearTimeout);
        if (animId) cancelAnimationFrame(animId);
        splash.classList.add('splash-out');
        setTimeout(function(){
          if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
        }, 550);
      }

      // Auto dismiss after completion + slight pause
      setTimeout(dismiss, duration + 450);

      // Skip triggers
      if (skip) skip.addEventListener('click', dismiss);
      window.addEventListener('keydown', function(e){
        if (e.key === 'Escape') dismiss();
      }, { once: true });
    })();
  </script>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const existingSplash = document.getElementById('ltm-splash');
    const doc = new DOMParser().parseFromString(template, 'text/html');
    if (existingSplash && !existingSplash.classList.contains('splash-out')) {
      doc.body.appendChild(existingSplash);
    }
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

card{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;transition:border-color .15s;}\n.stream-card:hover{border-color:var(--steel);}\n.stream-card.p-crit{border-left:4px solid var(--red);background:#FFF9F8;}\n.stream-card.p-high{border-left:4px solid var(--amber);background:#FFFCF7;}\n.stream-card.p-found{border-left:4px solid var(--steel);background:#F8FBFD;}\n.stream-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}\n.stream-icon{font-size:20px;line-height:1;}\n.stream-name{font-family:'Manrope',sans-serif;font-weight:600;font-size:15px;color:var(--ink);}\n.stream-desc{font-size:12.5px;color:var(--mut);line-height:1.45;flex-grow:1;}\n.stream-meta-row{display:flex;justify-content:space-between;align-items:flex-end;padding-top:10px;border-top:1px solid var(--panel2);font-size:12px;}\n.stream-sublab{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--mutd);}\n.stream-subval{font-weight:600;color:var(--ink);margin-top:2px;}\n.text-steel{color:var(--steel);}\n\n.pill.p-crit{background:#FF5E4F18;color:#D83A2A;border:1px solid #FF5E4F44;font-weight:600;font-size:11px;padding:3px 8px;border-radius:999px;}\n.pill.p-high{background:#B26A0018;color:#9E5E00;border:1px solid #B26A0044;font-weight:600;font-size:11px;padding:3px 8px;border-radius:999px;}\n.pill.p-found{background:#3C829B18;color:#28677D;border:1px solid #3C829B44;font-weight:600;font-size:11px;padding:3px 8px;border-radius:999px;}\n\n/* --- Phased Roadmap --- */\n.roadmap-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:14px;}\n.roadmap-card{border:1px solid var(--line);background:var(--ground);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:10px;}\n.roadmap-head{display:flex;align-items:center;gap:10px;}\n.roadmap-phase-num{font-family:'Manrope',sans-serif;font-weight:700;font-size:18px;color:var(--steel);width:32px;height:32px;border-radius:8px;background:var(--panel);display:flex;align-items:center;justify-content:center;flex:none;}\n.roadmap-name{font-family:'Manrope',sans-serif;font-weight:600;font-size:13.5px;color:var(--ink);}\n.roadmap-desc{font-size:12px;color:var(--mut);margin:0;line-height:1.45;}\n.roadmap-actions{display:grid;gap:8px;flex-grow:1;padding:8px 0;}\n.roadmap-action-item{font-size:12px;color:var(--ink);line-height:1.4;background:var(--panel);padding:8px 10px;border-radius:6px;border-left:3px solid var(--steel);}\n.roadmap-yield{display:flex;align-items:center;justify-content:space-between;padding-top:8px;border-top:1px solid var(--panel2);font-size:11px;}\n.yield-label{color:var(--mutd);text-transform:uppercase;letter-spacing:.05em;}\n.yield-val{font-weight:600;color:var(--green);}\n\n/* --- Gated Report Masking & Teaser --- */\n.gated-wrapper{position:relative;margin-top:24px;border-radius:12px;overflow:hidden;}\n.gated-blur-layer{filter:blur(5px);opacity:.28;user-select:none;pointer-events:none;}\n.gated-overlay{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;background:rgba(255,255,255,.82);backdrop-filter:blur(8px);text-align:center;box-shadow:inset 0 0 0 1px var(--line);border-radius:12px;}\n.gated-lock-badge{font-family:'Manrope',sans-serif;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--red);background:#FF5E4F15;border:1px solid #FF5E4F33;padding:4px 12px;border-radius:999px;margin-bottom:12px;}\n.gated-lock-title{font-family:'Manrope',sans-serif;font-size:clamp(19px,3vw,26px);font-weight:700;color:var(--ink);margin-bottom:10px;max-width:32ch;line-height:1.2;}\n.gated-lock-text{font-size:14px;color:var(--mut);line-height:1.55;max-width:54ch;margin:0 0 20px;}\n.gated-lock-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:center;margin-bottom:12px;}\n.gated-lock-sub{font-size:11.5px;color:var(--mutd);letter-spacing:.02em;}\n\n.consultant-banner{background:#1B3440;color:#FFFFFF;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;border-bottom:1px solid rgba(255,255,255,.15);position:sticky;top:0;z-index:100;}\n.consultant-banner-left{display:flex;align-items:center;gap:8px;}\n\n\n/* ---------- Cinematic Report Generation Animation (PostureIQ Style) ---------- */\n.report-gen-overlay {\n  position: fixed; inset: 0; z-index: 99998;\n  background: linear-gradient(135deg, #0F1923 0%, #1E2932 60%, #0F1923 100%);\n  display: flex; flex-direction: column; align-items: center; justify-content: center;\n  opacity: 1; transition: opacity 0.5s ease;\n}\n.report-gen-overlay.fade-out { opacity: 0; pointer-events: none; }\n.rg-brand { font-family: 'Manrope',sans-serif; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; color: #FF5E4F; margin-bottom: 24px; text-align: center; }\n.rg-title { font-family: 'Manrope',sans-serif; font-size: 26px; font-weight: 800; color: #fff; margin-bottom: 8px; text-align: center; }\n.rg-subtitle { font-size: 13.5px; color: rgba(255,255,255,0.65); text-align: center; margin-bottom: 32px; max-width: 520px; line-height: 1.5; padding: 0 16px; }\n\n.rg-pulse-container { position: relative; width: 110px; height: 110px; margin-bottom: 30px; }\n.rg-pulse-ring {\n  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);\n  border: 2px solid rgba(255,94,79,0.35); border-radius: 50%;\n  animation: radarPulse 2.4s ease-out infinite;\n}\n.rg-pulse-ring:nth-child(1) { width: 36px; height: 36px; animation-delay: 0s; }\n.rg-pulse-ring:nth-child(2) { width: 36px; height: 36px; animation-delay: 0.6s; }\n.rg-pulse-ring:nth-child(3) { width: 36px; height: 36px; animation-delay: 1.2s; }\n.rg-core-dot {\n  position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);\n  width: 12px; height: 12px; border-radius: 50%;\n  background: #FF5E4F; box-shadow: 0 0 20px rgba(255,94,79,0.6);\n}\n@keyframes radarPulse {\n  0%   { transform: translate(-50%,-50%) scale(1); opacity: 0.8; border-color: rgba(255,94,79,0.5); }\n  100% { transform: translate(-50%,-50%) scale(3.5); opacity: 0; border-color: rgba(255,94,79,0); }\n}\n\n.rg-step-list { list-style: none; padding: 0; margin: 0 0 28px; width: 420px; max-width: 90vw; }\n.rg-step {\n  display: flex; align-items: center; gap: 12px;\n  padding: 8px 0; font-size: 13.5px; color: rgba(255,255,255,0.35);\n  font-family: 'Manrope',sans-serif; transition: color 0.4s, transform 0.3s;\n}\n.rg-step.active { color: #fff; transform: translateX(4px); }\n.rg-step.done { color: rgba(255,255,255,0.6); }\n.rg-step-icon {\n  width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0;\n  border: 1.5px solid rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center;\n  font-size: 11px; transition: 0.3s;\n}\n.rg-step.active .rg-step-icon { border-color: #FF5E4F; background: rgba(255,94,79,0.15); box-shadow: 0 0 12px rgba(255,94,79,0.3); color: #FF8A7A; }\n.rg-step.done .rg-step-icon { border-color: #35754D; background: #35754D; color: #fff; }\n\n.rg-progress-track { width: 340px; max-width: 80vw; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; }\n.rg-progress-fill { height: 100%; width: 0; background: linear-gradient(90deg, #FF5E4F, #FF8A7A); border-radius: 2px; transition: width 0.6s ease; }\n\n</style>\n</head>\n\n<body>\n<div class=\"gridbg\"></div>\n<header class=\"bar no-print\">\n  <div class=\"ltmlogo\" id=\"ltmLogo\" title=\"Set LTM logo\"></div>\n  <div class=\"nav\" id=\"topnav\">\n    <button class=\"navbtn\" data-nav=\"assessment\">Assessment</button>\n    <button class=\"navbtn\" data-nav=\"bank\">Question Bank</button>\n  </div>\n</header>\n<div id=\"app\"></div>\n<input type=\"file\" id=\"fileLtm\" accept=\"image/*\" style=\"display:none\">\n<input type=\"file\" id=\"fileOrg\" accept=\"image/*\" style=\"display:none\">\n<input type=\"file\" id=\"fileImport\" accept=\".json,application/json\" style=\"display:none\">\n\n<script>\nconst DEFAULT_LTM_LOGO = '<svg width=\"105\" height=\"28\" viewBox=\"0 0 110 30\" fill=\"none\" xmlns=\"http://www.w3.org/2000/svg\">'\n  + '<path d=\"M95.2507 0.740829L87.8453 19.5397L80.4399 0.740829C80.2642 0.295746 79.8309 0 79.3507 0H65.884V29.2818H73.2044V8.51514C73.2044 7.22088 74.9906 6.88414 75.465 8.0847L83.5233 28.538C83.699 28.986 84.1324 29.2788 84.6126 29.2788H91.078C91.5582 29.2788 91.9916 28.9831 92.1673 28.538L100.226 8.0847C100.7 6.88122 102.486 7.22088 102.486 8.51514V29.2818H109.807V0H96.34C95.8597 0 95.4264 0.295746 95.2507 0.740829Z\" fill=\"#FF5E4F\"/>'\n  + '<path d=\"M7.32045 20.7901V0H0V21.9613C0 26.0051 3.27663 29.2818 7.32045 29.2818H29.2818V21.9613H8.49172C7.84459 21.9613 7.32045 21.4372 7.32045 20.7901Z\" fill=\"#FF5E4F\"/>'\n  + '<path d=\"M60.0277 0H23.4254V7.32044H36.3094C37.2786 7.32044 38.0663 8.10812 38.0663 9.07735V29.2818H45.3868V9.07735C45.3868 8.10812 46.1744 7.32044 47.1437 7.32044H60.0277V0Z\" fill=\"#FF5E4F\"/>'\n  + '</svg>';\n\n/* ============================================================\n   FinOps Value Case \u2014 pre-maturity qualification\n   Headline output is money at stake, anchored to published\n   benchmarks. \"Don't know\" is a scored answer, never a skip.\n   ============================================================ */\nconst DEFAULT_KB = {\n  meta:{\n    schema_version:\"1.0.3\",\n    instrument:\"FinOps Value Case \u2014 Pre-Maturity Qualification\",\n    last_reviewed:\"2026-07-22\",\n    disclaimer:\"Indicative estimate based on self-reported inputs and published industry benchmarks. Figures illustrate the scale of opportunity and are not a guarantee of savings. A validated baseline requires assessment of actual billing data. Indicative and directional only. Not a commitment, quote or financial advice.\",\n    currencies:[{id:\"gbp\",symbol:\"\u00a3\"},{id:\"usd\",symbol:\"$\"},{id:\"eur\",symbol:\"\u20ac\"},{id:\"inr\",symbol:\"\u20b9\"}],\n    signals:[\n      {id:\"visibility\",label:\"Cost visibility\",weight:0.22,color:\"#3C829B\"},\n      {id:\"predictability\",label:\"Bill predictability\",weight:0.20,color:\"#B26A00\"},\n      {id:\"ownership\",label:\"Ownership & accountability\",weight:0.20,color:\"#5A3A83\"},\n      {id:\"control\",label:\"Controls & optimisation\",weight:0.22,color:\"#35754D\"},\n      {id:\"value\",label:\"Value realisation\",weight:0.16,color:\"#226882\"}\n    ],\n    benchmarks:{\n      sector:\"Banking, Financial Services & Insurance (BFSI)\",\n      honesty_note:\"Published waste benchmarks are reported cross-industry, not per-sector. Headline anchors below are global figures from named public sources. BFSI modifiers are LTM directional adjustments based on sector characteristics \u2014 not published sector waste rates \u2014 and are editable.\",\n      sources:[\n        {label:\"Flexera 2026 State of the Cloud Report (n=753, March 2026)\",url:\"https://info.flexera.com/CM-REPORT-State-of-the-Cloud\",note:\"Wasted IaaS/PaaS spend 29% \u2014 the first increase in five years, attributed to AI workloads and new PaaS/SaaS pricing complexity. 63% of organisations run an established FinOps team; 71% operate a CCoE; 49% use unit economics. Fewer than half use any one commitment discount per provider.\"},\n        {label:\"Flexera State of the Cloud, multi-year (2019\u20132026)\",url:\"https://info.flexera.com/CM-REPORT-State-of-the-Cloud\",note:\"Estimated waste has stayed within a 27\u201332% band every year since 2019 \u2014 the most stable benchmark available.\"},\n        {label:\"Harness Cloud Cost Management Report (2025)\",url:\"https://www.harness.io/whitepapers/cloud-cost-management-report\",note:\"21% of infrastructure budget wasted on unused or underused resources; a useful conservative floor.\"},\n        {label:\"FinOps Foundation, State of FinOps 2026\",url:\"https://www.finops.org/insights/state-of-finops/\",note:\"Workload optimisation and waste reduction remain the top practitioner priority, but with diminishing returns \u2014 the large obvious waste has been captured.\"}\n      ],\n      anchor_logic:\"The Flexera 29% figure is an average across a population in which 63% already run an established FinOps team. An organisation with no FinOps function therefore sits materially above that average; one with mature controls sits below it.\",\n      bfsi_modifiers:{\n        editable:true,\n        basis:\"LTM directional adjustment \u2014 replace with engagement data when available\",\n        cap:0.45,\n        factors:[\n          {id:\"nonprod\",label:\"Elevated non-production estate\",pts:0.03,rationale:\"Regulatory testing, UAT, model validation and parallel-run environments create a larger idle footprint than other sectors.\"},\n          {id:\"dr\",label:\"Mandated DR and resilience duplication\",pts:0.02,rationale:\"Operational resilience requirements (DORA, FCA/PRA and local equivalents) mandate standby capacity that is provisioned but rarely consumed.\"},\n          {id:\"residency\",label:\"Data residency and sovereignty constraints\",pts:0.015,rationale:\"Limits region arbitrage and constrains commitment flexibility.\"},\n          {id:\"liftshift\",label:\"Core system lift-and-shift patterns\",pts:0.03,rationale:\"Migrated core banking, payments and policy administration systems often retain data-centre sizing rather than cloud-native elasticity.\"},\n          {id:\"change\",label:\"Extended change control cycles\",pts:0.015,rationale:\"Rightsizing and decommissioning move through governance slowly, so identified waste persists longer.\"},\n          {id:\"commitment\",label:\"Conservative commitment purchasing\",pts:0.02,rationale:\"Budget governance and multi-year approval cycles suppress commitment coverage, leaving predictable workloads on on-demand rates.\"}\n        ]\n      }\n    },\n    waste_model:{\n      bands:[\n        {max_capability:25,low:0.30,high:0.40,label:\"No effective cost management\",anchor:\"Above the 29% cross-industry average, since that average includes a majority with established FinOps teams.\"},\n        {max_capability:50,low:0.22,high:0.30,label:\"Ad hoc cost management\",anchor:\"Straddles the 27\u201332% historical band.\"},\n        {max_capability:75,low:0.14,high:0.22,label:\"Partial controls in place\",anchor:\"Approaching the Harness 21% floor for unused and underused infrastructure.\"},\n        {max_capability:100,low:0.08,high:0.14,label:\"Established controls\",anchor:\"Consistent with practitioners reporting diminishing returns once large waste is captured.\"}\n      ]\n    },\n    verdict_bands:[\n      {min:0,max:25,id:\"monitor\",label:\"Lightweight practices sufficient\",color:\"#35754D\",\n       headline:\"No material FinOps gap at current scale\",\n       narrative:\"At the current estate size and growth rate, formal FinOps investment is difficult to justify. Maintain basic budget alerting and revisit when spend or migration pace increases.\"},\n      {min:26,max:50,id:\"foundations\",label:\"Establish foundations now\",color:\"#226882\",\n       headline:\"Foundations needed before the estate grows\",\n       narrative:\"The estate is approaching the scale where informal cost management stops working. Establishing visibility and ownership now is materially cheaper than retrofitting them later.\"},\n      {min:51,max:75,id:\"material\",label:\"Material exposure \u2014 act this year\",color:\"#B26A00\",\n       headline:\"A quantifiable amount of spend is unmanaged\",\n       narrative:\"Cost is being incurred faster than it can be explained or controlled. The gap is large enough to be visible in financial results and will widen as migration continues.\"},\n      {min:76,max:100,id:\"urgent\",label:\"Urgent \u2014 significant value leaking\",color:\"#FF5E4F\",\n       headline:\"Spend is running substantially ahead of control\",\n       narrative:\"The combination of scale, growth and absent controls means a significant proportion of cloud investment is not producing recoverable value. This is normally visible to Finance before it is visible to Technology.\"}\n    ],\n    service_areas:[\n      {id:\"operating_model\",name:\"FinOps Operating Model & Governance\",triggers:[{signal:\"ownership\",below:60}],\n       problem:\"No one is genuinely accountable for cloud spend, so decisions default to whoever notices the bill.\",\n       deliverables:[\"FinOps charter and mandate, signed at executive level\",\"Operating model design \u2014 centralised, federated or hybrid, with rationale\",\"RACI across Engineering, Finance, Procurement and BU owners\",\"Governance forum design, cadence and decision rights\",\"Tooling assessment and platform recommendation\",\"90-day mobilisation plan with named owners\"]},\n      {id:\"visibility_allocation\",name:\"Cost Visibility & Allocation\",triggers:[{signal:\"visibility\",below:65}],\n       problem:\"Spend cannot be attributed to a team, product or customer, so no one can be held to it.\",\n       deliverables:[\"Tagging and metadata taxonomy with enforcement policy\",\"Cost allocation model including shared-cost treatment\",\"Showback design, progressing to chargeback where appropriate\",\"Executive and team-level cost dashboards\",\"Automated cost data pipeline into enterprise BI\",\"Allocation coverage baseline and improvement roadmap\"]},\n      {id:\"forecast_control\",name:\"Forecasting, Budgets & Anomaly Control\",triggers:[{signal:\"predictability\",below:65}],\n       problem:\"The bill cannot be predicted, so Finance treats cloud as uncontrolled spend.\",\n       deliverables:[\"Driver-based forecasting model with documented assumptions\",\"Budget framework at BU and product level with forecast-breach alerting\",\"Anomaly detection configuration and escalation routing\",\"Monthly variance reporting pack and commentary standard\",\"Forecast accuracy baseline and improvement target\"]},\n      {id:\"rate_optimisation\",name:\"Commitment & Rate Optimisation\",triggers:[{signal:\"control\",below:70}],\n       problem:\"Paying on-demand rates for predictable, steady-state workloads.\",\n       deliverables:[\"Commitment coverage analysis across providers\",\"Commitment strategy and purchase calendar\",\"Savings plan and reserved capacity portfolio design\",\"Provider agreement and discount review\",\"Ongoing coverage monitoring and renewal governance\"]},\n      {id:\"workload_optimisation\",name:\"Workload & Architecture Optimisation\",triggers:[{signal:\"control\",below:60}],\n       problem:\"Resources are oversized, idle or orphaned, and nothing systematically reclaims them.\",\n       deliverables:[\"Rightsizing assessment with prioritised savings backlog\",\"Waste and orphaned-resource elimination programme\",\"Storage tiering and lifecycle policy design\",\"Non-production scheduling and automated parking\",\"Spot and transient capacity adoption strategy\",\"Architecture cost review standard for design gates\"]},\n      {id:\"unit_economics\",name:\"Unit Economics & Value Realisation\",triggers:[{signal:\"value\",below:60}],\n       problem:\"Cloud spend cannot be defended to the board because its business value is not measured.\",\n       deliverables:[\"Unit metric definition per product or service line\",\"Cost-per-unit instrumentation and trending\",\"Cloud business case validation against original assumptions\",\"Margin and cost-to-serve analysis by customer or tenant\",\"Board-level cloud value reporting pack\"]},\n      {id:\"enablement\",name:\"FinOps Enablement & Capability Build\",triggers:[{signal:\"ownership\",below:70},{signal:\"value\",below:70}],\n       problem:\"Cost awareness does not survive contact with delivery pressure unless it is built into how engineers work.\",\n       deliverables:[\"FinOps role definitions and target capability model\",\"Training curriculum and FinOps certification pathway\",\"Cost-aware architecture and design standards\",\"Engineering enablement \u2014 cost feedback in CI/CD and pull requests\",\"Community of practice launch and operating rhythm\"]}\n    ],\n    case_studies:[\n      {id:\"cs_airline_na\",title:\"How a leading North American airline saved 30% on cloud cost with our FinOps Excellence Service\",region:\"North America\",industry:\"Aviation & Transport\",outcome:\"30% cost reduction\",relevance:[\"control\",\"predictability\"],file:\"assets/case-studies/PLACEHOLDER-airline-north-america.pdf\",status:\"placeholder\"},\n      {id:\"cs_bank_africa\",title:\"How we helped a leading African bank establish a FinOps governance model\",region:\"Africa\",industry:\"Banking & Financial Services\",outcome:\"Governance model established\",relevance:[\"ownership\",\"visibility\"],file:\"assets/case-studies/PLACEHOLDER-bank-africa.pdf\",status:\"placeholder\"},\n      {id:\"cs_retail_eu\",title:\"How an EU retail business implemented FinOps to improve every-dollar-spend efficacy\",region:\"Europe\",industry:\"Retail & Consumer\",outcome:\"Improved spend efficacy\",relevance:[\"value\",\"visibility\"],file:\"assets/case-studies/PLACEHOLDER-retail-eu.pdf\",status:\"placeholder\"}\n    ],\n    brochure:{title:\"LTM FinOps Services\",subtitle:\"Cloud financial management \u2014 advisory, implementation and managed practice\",file:\"assets/PLACEHOLDER-ltm-finops-brochure.pdf\",status:\"placeholder\"}\n  },\n\n  sections:[\n    {id:\"estate\",n:\"01\",label:\"Your cloud estate\",blurb:\"Where you are today, and where you are heading.\"},\n    {id:\"visibility\",n:\"02\",label:\"Visibility\",blurb:\"Whether spend can be attributed and explained.\"},\n    {id:\"predictability\",n:\"03\",label:\"Predictability\",blurb:\"Whether the bill behaves the way you expect.\"},\n    {id:\"ownership\",n:\"04\",label:\"Ownership\",blurb:\"Who is actually accountable for what is spent.\"},\n    {id:\"controls\",n:\"05\",label:\"Controls\",blurb:\"What prevents and reclaims waste today.\"},\n    {id:\"value\",n:\"06\",label:\"Value\",blurb:\"Whether the spend can be defended as worthwhile.\"}\n  ],\n\n  questions:[\n    {id:\"E1\",section:\"estate\",answer_type:\"card_select\",signals:[],text:\"Which best describes your infrastructure today?\",hint:\"Pick the closest match \u2014 precision is not required.\",\n     options:[{label:\"Entirely on-premise / data centre\",icon:\"\u25a4\",cloud_share:0},{label:\"Mostly data centre, some cloud\",icon:\"\u25a5\",cloud_share:.2},{label:\"Balanced hybrid\",icon:\"\u25eb\",cloud_share:.5},{label:\"Mostly cloud, some legacy\",icon:\"\u25d7\",cloud_share:.8},{label:\"Cloud-native / fully migrated\",icon:\"\u25cf\",cloud_share:1}]},\n    {id:\"E2\",section:\"estate\",answer_type:\"multi_select_logo\",signals:[],text:\"Which cloud platforms are in use or planned?\",hint:\"Multi-cloud materially increases the cost of poor visibility.\",\n     options:[{label:\"Amazon Web Services\",hyper:true},{label:\"Microsoft Azure\",hyper:true},{label:\"Google Cloud\",hyper:true},{label:\"Oracle Cloud\",hyper:true},{label:\"Private / hosted cloud\",hyper:false},{label:\"Not yet decided\",hyper:false}]},\n    {id:\"E3\",section:\"estate\",answer_type:\"slider_currency\",signals:[],text:\"Roughly what is your annual cloud spend?\",hint:\"An order-of-magnitude estimate is enough. This drives the value calculation.\",\n     slider:{min:50000,max:100000000,steps:60,default:2000000},allow_dk:true,\n     dk_blind:\"Annual cloud spend is not known to a single figure \u2014 usually a sign spend is fragmented across accounts or business units.\"},\n    {id:\"E4\",section:\"estate\",answer_type:\"single_select\",signals:[],text:\"Where are you in your cloud journey?\",\n     options:[{label:\"Planning \u2014 not yet migrating\",migration_ahead:1},{label:\"Early migration \u2014 under 25% moved\",migration_ahead:.8},{label:\"In flight \u2014 25% to 75% moved\",migration_ahead:.5},{label:\"Largely migrated \u2014 over 75% moved\",migration_ahead:.2},{label:\"Migration complete, now optimising\",migration_ahead:.05}]},\n    {id:\"E5\",section:\"estate\",answer_type:\"slider_signed\",signals:[],text:\"How do you expect cloud spend to change over the next 12 months?\",\n     slider:{min:-25,max:200,step:5,default:25,suffix:\"%\"}},\n    {id:\"E6\",section:\"estate\",answer_type:\"slider_percent\",signals:[],text:\"What proportion of your remaining estate is still to move to cloud in the next 24 months?\",\n     hint:\"Migrating on top of weak cost controls multiplies the problem rather than adding to it.\",\n     slider:{min:0,max:100,step:5,default:30,suffix:\"%\"}},\n\n    {id:\"V1\",section:\"visibility\",answer_type:\"single_select\",signals:[{id:\"visibility\",w:2}],text:\"Can you attribute cloud cost to a specific business unit, product or team?\",\n     options:[{label:\"Yes \u2014 fully and automatically\",score:100},{label:\"Mostly, with some manual effort\",score:70},{label:\"Only at a very high level\",score:35},{label:\"No \u2014 it is one undifferentiated bill\",score:0}],\n     allow_dk:true,dk_blind:\"Cost attribution capability is unknown \u2014 meaning no one has recently tried to answer 'who spent this?'\"},\n    {id:\"V2\",section:\"visibility\",answer_type:\"slider_percent\",signals:[{id:\"visibility\",w:1.5}],text:\"What percentage of your cloud resources carry complete, reliable tags or labels?\",\n     slider:{min:0,max:100,step:5,default:40,suffix:\"%\"},allow_dk:true,\n     dk_blind:\"Tag coverage is unknown. Without it, every allocation and showback figure is an estimate.\"},\n    {id:\"V3\",section:\"visibility\",answer_type:\"single_select\",signals:[{id:\"visibility\",w:1.5}],text:\"How long does it take to answer the question \\\"why did the bill go up last month?\\\"\",\n     hint:\"This is the single most revealing question in the assessment.\",\n     options:[{label:\"Same day \u2014 the data is at hand\",score:100},{label:\"A few days of analysis\",score:65},{label:\"Weeks, and the answer is contested\",score:25},{label:\"We cannot reliably answer it\",score:0}]},\n    {id:\"V4\",section:\"visibility\",answer_type:\"boolean_dk\",signals:[{id:\"visibility\",w:1},{id:\"value\",w:1}],text:\"Do you know what it costs to serve one customer, transaction or unit of output?\",\n     scores:{yes:100,no:10,dk:0},dk_blind:\"Unit cost is unknown \u2014 cloud spend cannot currently be connected to business volume.\"},\n    {id:\"V5\",section:\"visibility\",answer_type:\"multi_select\",signals:[{id:\"visibility\",w:1.5}],text:\"Which of these do you receive on a regular, scheduled basis?\",hint:\"Select all that genuinely arrive without being chased.\",\n     options:[{label:\"Monthly cost report by team or product\",score:20},{label:\"Forward-looking spend forecast\",score:20},{label:\"Automated anomaly or spike alerts\",score:20},{label:\"Unit cost or efficiency trend\",score:20},{label:\"Commitment coverage and utilisation report\",score:20},{label:\"None of these arrive regularly\",score:0,exclusive:true}]},\n\n    {id:\"P1\",section:\"predictability\",answer_type:\"slider_percent\",signals:[{id:\"predictability\",w:2}],text:\"Over the last 12 months, how far did actual cloud spend differ from what was budgeted?\",\n     slider:{min:0,max:60,step:1,default:15,suffix:\"%\"},invert:true,allow_dk:true,\n     dk_blind:\"Budget variance is not tracked, so overspend is discovered rather than predicted.\"},\n    {id:\"P2\",section:\"predictability\",answer_type:\"single_select\",signals:[{id:\"predictability\",w:1.5}],text:\"How often has an unexpected cloud bill required explanation to Finance or the board?\",\n     options:[{label:\"Never\",score:100},{label:\"Once\",score:70},{label:\"A few times\",score:35,urgency:6},{label:\"It is a recurring conversation\",score:0,urgency:12}]},\n    {id:\"P3\",section:\"predictability\",answer_type:\"rating_1_5\",signals:[{id:\"predictability\",w:1.5}],text:\"How confident are you in your cloud spend forecast for next quarter?\",\n     labels:[\"No forecast exists\",\"Little confidence\",\"Moderate\",\"Confident\",\"High confidence\"]},\n    {id:\"P4\",section:\"predictability\",answer_type:\"single_select\",signals:[{id:\"predictability\",w:1},{id:\"ownership\",w:1}],text:\"Who explains the cloud bill to Finance or the CFO?\",\n     options:[{label:\"A dedicated cost owner with the data to back it\",score:100},{label:\"Central IT, on request\",score:60},{label:\"Whoever is available that month\",score:25},{label:\"No one \u2014 Finance interprets it themselves\",score:0}]},\n\n    {id:\"O1\",section:\"ownership\",answer_type:\"single_select\",signals:[{id:\"ownership\",w:2}],text:\"Who is formally accountable for cloud spend?\",\n     options:[{label:\"A named FinOps owner or team with a mandate\",score:100},{label:\"Each business unit owns its own consumption\",score:75},{label:\"The CIO or CTO, by default rather than design\",score:40},{label:\"Shared and unclear\",score:15},{label:\"No one specifically\",score:0}]},\n    {id:\"O2\",section:\"ownership\",answer_type:\"allocation_100\",signals:[{id:\"ownership\",w:2}],text:\"Distribute 100 points across where responsibility for cloud cost actually sits today.\",\n     hint:\"Not where it should sit \u2014 where it genuinely does.\",\n     buckets:[{id:\"engineering\",label:\"Engineering teams\",color:\"#35754D\"},{id:\"finance\",label:\"Finance\",color:\"#3C829B\"},{id:\"central_it\",label:\"Central IT / Platform\",color:\"#5A3A83\"},{id:\"nobody\",label:\"Honestly, nobody\",color:\"#FF5E4F\"}]},\n    {id:\"O3\",section:\"ownership\",answer_type:\"rating_1_5\",signals:[{id:\"ownership\",w:1.5}],text:\"To what extent do engineers see the cost consequences of what they build?\",\n     labels:[\"Not at all\",\"Rarely\",\"Occasionally\",\"Usually\",\"Continuously, in workflow\"]},\n    {id:\"O4\",section:\"ownership\",answer_type:\"boolean_dk\",signals:[{id:\"ownership\",w:1}],text:\"Is cost efficiency written into anyone's objectives or performance measures?\",\n     scores:{yes:100,no:15,dk:0},dk_blind:\"No one is certain whether cost efficiency is anyone's objective \u2014 which usually means it is not.\"},\n\n    {id:\"C1\",section:\"controls\",answer_type:\"multi_select\",signals:[{id:\"control\",w:2}],text:\"Which cost controls are actually operating today?\",hint:\"Select only those in live use, not those planned or configured but ignored.\",\n     options:[{label:\"Budgets with alerting\",score:14},{label:\"Automated anomaly detection\",score:14},{label:\"Enforced tagging policy\",score:14},{label:\"Commitment / reserved capacity management\",score:14},{label:\"Regular rightsizing cadence\",score:14},{label:\"Automated non-production shutdown\",score:14},{label:\"Showback or chargeback to teams\",score:16},{label:\"None of these\",score:0,exclusive:true}]},\n    {id:\"C2\",section:\"controls\",answer_type:\"slider_percent\",signals:[{id:\"control\",w:1.5}],text:\"What proportion of eligible spend is covered by commitments \u2014 reserved instances, savings plans or committed use discounts?\",\n     slider:{min:0,max:100,step:5,default:20,suffix:\"%\"},allow_dk:true,\n     dk_blind:\"Commitment coverage is unknown \u2014 typically the single largest immediately addressable saving.\"},\n    {id:\"C3\",section:\"controls\",answer_type:\"single_select\",signals:[{id:\"control\",w:1.5}],text:\"When did you last systematically decommission unused or idle resources?\",\n     options:[{label:\"Continuously \u2014 it is automated\",score:100},{label:\"Within the last month\",score:80},{label:\"Within the last quarter\",score:55},{label:\"Over a year ago\",score:20},{label:\"Never, or not that we know of\",score:0}]},\n    {id:\"C4\",section:\"controls\",answer_type:\"drag_order\",signals:[],text:\"Rank these cost concerns by how much they worry you \u2014 most concerning first.\",\n     hint:\"This shapes where we focus, and is not scored against a right answer.\",\n     options:[\"Unpredictable or rising bills\",\"Inability to attribute cost to teams\",\"Paying for resources nobody uses\",\"Cost of the migration itself\",\"Lack of internal skills\",\"Justifying cloud value to the board\"],\n     concern_map:{\"Unpredictable or rising bills\":\"forecast_control\",\"Inability to attribute cost to teams\":\"visibility_allocation\",\"Paying for resources nobody uses\":\"workload_optimisation\",\"Cost of the migration itself\":\"rate_optimisation\",\"Lack of internal skills\":\"enablement\",\"Justifying cloud value to the board\":\"unit_economics\"}},\n    {id:\"C5\",section:\"controls\",answer_type:\"single_select\",\n     signals:[{id:\"control\",w:1.5},{id:\"visibility\",w:1}],\n     allow_dk:true,\n     dk_blind:\"Network data transfer and cross-AZ/cross-region egress costs are unmonitored, creating vulnerability to silent bill inflation.\",\n     text:\"How actively do you monitor and optimize network data transfer (cross-AZ, cross-region, egress to on-premises/internet)?\",\n     sub:\"Data transfer and network egress typically account for 10\u201325% of cloud infrastructure spend and often go unallocated.\",\n     options:[\n       {label:\"Active architectural governance \u2014 private endpoints/interconnects, direct routes, and egress budget alerting\",score:100},\n       {label:\"Standard monitoring in place, but egress spikes are investigated reactively\",score:65},\n       {label:\"High-level awareness; egress is rarely tracked or attributed to specific workloads\",score:30},\n       {label:\"Unmonitored \u2014 network data transfer is treated as an unmanaged baseline utility\",score:0}\n     ]},\n\n    {id:\"L1\",section:\"value\",answer_type:\"single_select\",signals:[{id:\"value\",w:2}],text:\"Can you demonstrate to the board that cloud spend is delivering business value?\",\n     options:[{label:\"Yes \u2014 with quantified, trended evidence\",score:100},{label:\"Partially \u2014 anecdotally or by project\",score:55},{label:\"Not currently\",score:15},{label:\"The question has not been asked yet\",score:25}]},\n    {id:\"L2\",section:\"value\",answer_type:\"single_select\",signals:[{id:\"value\",w:1.5}],text:\"Has cloud delivered the savings or benefits set out in the original business case?\",\n     options:[{label:\"Exceeded expectations\",score:100},{label:\"Broadly met them\",score:80},{label:\"Fallen short\",score:30},{label:\"We do not track against the business case\",score:10},{label:\"There was no formal business case\",score:0}],\n     allow_dk:true,dk_blind:\"Performance against the original cloud business case is not tracked.\"},\n    {id:\"L3\",section:\"value\",answer_type:\"rating_1_5\",signals:[{id:\"value\",w:1}],text:\"If Finance asked today whether cloud spend was under control, how comfortable would you be answering?\",\n     labels:[\"Very uncomfortable\",\"Uncomfortable\",\"Neutral\",\"Comfortable\",\"Very comfortable\"]},\n    {id:\"L4\",section:\"value\",answer_type:\"multi_select\",signals:[],text:\"What would a good outcome look like in 12 months?\",hint:\"Used to shape the recommendations, not scored.\",\n     options:[{label:\"A bill we can predict\"},{label:\"Lower cost per unit of output\"},{label:\"Faster, better-informed decisions\"},{label:\"A position we can defend to Finance\"},{label:\"Funding freed up for innovation\"},{label:\"Confidence to accelerate migration\"}]},\n    {id:\"X1\",section:\"value\",answer_type:\"open_text\",signals:[],text:\"Anything else about your cloud cost position we should understand?\",\n     placeholder:\"Optional \u2014 included in the report for the follow-up conversation.\"}\n  ]\n};\n\n/* ---------------- state ---------------- */\nconst S={kb:clone(DEFAULT_KB),tab:\"assessment\",screen:\"intro\",secIdx:0,\n  org:{name:\"\",logo:null,sector:\"Banking / Financial Services\",sector_class:\"bfsi\",currency:\"gbp\",details:\"\"},\n  respondent:{name:\"\",role:\"\",email:\"\",date:today()},\n  answers:{},ltmLogo:null,reportCurrency:null,consultantUnlocked:false};\nfunction clone(o){return JSON.parse(JSON.stringify(o));}\nfunction today(){return new Date().toISOString().slice(0,10);}\nfunction esc(s){return String(s==null?\"\":s).replace(/[&<>\"']/g,c=>({\"&\":\"&amp;\",\"<\":\"&lt;\",\">\":\"&gt;\",'\"':\"&quot;\",\"'\":\"&#39;\"}[c]));}\nconst $=s=>document.querySelector(s); const app=$(\"#app\");\nfunction cur(){const id=(S.screen===\"report\"&&S.reportCurrency)?S.reportCurrency:S.org.currency;return (S.kb.meta.currencies.find(c=>c.id===id)||{symbol:\"\u00a3\"}).symbol;}\nfunction money(n){ if(n==null||!isFinite(n))return \"\u2014\";\n  const s=cur();\n  if(n>=1e9)return s+(n/1e9).toFixed(1).replace(/\\.0$/,\"\")+\"bn\";\n  if(n>=1e6)return s+(n/1e6).toFixed(1).replace(/\\.0$/,\"\")+\"m\";\n  if(n>=1e3)return s+Math.round(n/1e3)+\"k\";\n  return s+Math.round(n); }\nfunction logVal(pos,sl){ const min=Math.log(sl.min),max=Math.log(sl.max);\n  return Math.round(Math.exp(min+(max-min)*(pos/sl.steps))/10000)*10000; }\nfunction logPos(val,sl){ const min=Math.log(sl.min),max=Math.log(sl.max);\n  return Math.round(((Math.log(Math.max(sl.min,val))-min)/(max-min))*sl.steps); }\n\n/* ---------------- AWS Cloud Evaluation Engine (ap-south-1) ---------------- */\nconst EVALUATE_API_ENDPOINT = \"https://vh7pwyw8q3.execute-api.ap-south-1.amazonaws.com/api/evaluate/finops-value-case\";\n\nasync function fetchCloudEvaluation(answers, org) {\n  try {\n    const res = await fetch(EVALUATE_API_ENDPOINT, {\n      method: \"POST\",\n      headers: { \"Content-Type\": \"application/json\" },\n      body: JSON.stringify({ answers, org })\n    });\n    const json = await res.json();\n    if (json.ok && json.data) {\n      S.cloudResult = json.data;\n      return json.data;\n    }\n  } catch (err) {\n    console.warn(\"[AWS Engine] Cloud calculation failed or CORS restriction:\", err);\n  }\n  return null;\n}\n\nfunction signalScores() { return S.cloudResult ? S.cloudResult.signals : {}; }\nfunction needIndex() { return S.cloudResult ? S.cloudResult.needIndex : null; }\nfunction verdict() { return S.cloudResult ? S.cloudResult.verdict : null; }\nfunction exposure() { return S.cloudResult ? S.cloudResult.exposure : { band: wasteBand(), y1: null, y3: null }; }\nfunction wasteBand() { return S.cloudResult ? S.cloudResult.wasteBand : { low: 0.14, high: 0.28, label: \"Evaluated via AWS Cloud (ap-south-1)\", anchor: \"\", uplift: 0, cap: 50, isBfsi: false }; }\nfunction annualSpend() { return S.cloudResult ? S.cloudResult.annualSpend : null; }\nfunction growth() { return S.cloudResult ? S.cloudResult.growthRate : 25; }\nfunction urgencyIndex() { return S.cloudResult ? S.cloudResult.urgencyIndex : 0; }\nfunction gapIndex() { return S.cloudResult ? S.cloudResult.gapIndex : 0; }\nfunction blindSpots() { return S.cloudResult ? S.cloudResult.blindSpots : []; }\nfunction confidence() { return S.cloudResult ? S.cloudResult.confidence : { label: \"Reasonable confidence\", color: \"#35754D\", note: \"Validated via AWS Engine (ap-south-1)\" }; }\nfunction recommendedServices() { return S.cloudResult ? S.cloudResult.recommendedServices : []; }\nfunction relevantCaseStudies() { return S.cloudResult ? S.cloudResult.relevantCaseStudies : []; }\nfunction computeStreams() { return S.cloudResult ? S.cloudResult.streams : []; }\n\nfunction renderRoadmap(streams){\n  const phases = [\n    {\n      phase: \"01\",\n      name: \"Phase 1: Day 1\u201330\",\n      tag: \"Immediate Cash Reclaim\",\n      tagClass: \"p-crit\",\n      desc: \"Stop active financial waste, decommission dormant infrastructure, and capture instant margin recovery.\",\n      actions: [\n        { title: \"Non-Prod Environment Parking\", note: \"Automate night/weekend shutdowns for dev, test, and sandbox clusters.\" },\n        { title: \"Zombie & Orphan Storage Purge\", note: \"Eliminate unattached persistent disks, unassociated static IPs, and orphaned snapshots.\" },\n        { title: \"Rapid Rightsizing Scan\", note: \"Downsize or terminate compute instances running at < 5% average utilization.\" },\n        { title: \"NAT & Egress Loop Audit\", note: \"Identify high-cost cross-AZ data transfer paths and redundant routing gateways.\" }\n      ],\n      targetYield: \"10% to 18% rapid cost recovery\"\n    },\n    {\n      phase: \"02\",\n      name: \"Phase 2: Day 31\u201360\",\n      tag: \"Rate Tuning & Visibility\",\n      tagClass: \"p-high\",\n      desc: \"Contractually lock in discounted rates and establish automated tagging and anomaly guardrails.\",\n      actions: [\n        { title: \"Baseline Commitment Purchase\", note: \"Execute low-risk 1-year Compute Savings Plans or CUDs for steady baseline workloads.\" },\n        { title: \"Automated Tagging Guardrails\", note: \"Enforce mandatory resource tagging policies in deployment pipelines (IaC / Terraform).\" },\n        { title: \"Real-time Anomaly Alerting\", note: \"Configure automated threshold alerts routed to product engineering Slack/Teams channels.\" },\n        { title: \"Business Unit Showback Pack\", note: \"Publish initial monthly attributed cloud consumption reports to BU leaders.\" }\n      ],\n      targetYield: \"Additional 15% to 25% run-rate savings\"\n    },\n    {\n      phase: \"03\",\n      name: \"Phase 3: Day 61\u201390\",\n      tag: \"Operating Rhythm & Unit Metrics\",\n      tagClass: \"p-found\",\n      desc: \"Embed financial accountability into sprint planning and institutionalize a cross-functional FinOps charter.\",\n      actions: [\n        { title: \"Cross-Functional FinOps Charter\", note: \"Mobilize recurring monthly steering rhythm with Engineering, Finance, and Procurement.\" },\n        { title: \"Unit Economics Instrumentation\", note: \"Benchmark cloud cost per business transaction, customer tenant, or active user.\" },\n        { title: \"Self-Service Cost Dashboards\", note: \"Provide engineering teams with daily visibility into their own infrastructure burn rates.\" },\n        { title: \"Shared Cost Allocation Standard\", note: \"Establish transparent apportionment rules for central platforms, networking, and security.\" }\n      ],\n      targetYield: \"Predictable governance & unit margin defense\"\n    },\n    {\n      phase: \"04\",\n      name: \"Phase 4: Day 90\u2013180\",\n      tag: \"Continuous Architecture Modernization\",\n      tagClass: \"p-found\",\n      desc: \"Sustain cost leadership through cloud-native architecture patterns and automated policy enforcement.\",\n      actions: [\n        { title: \"Automated Storage Lifecycle Rules\", note: \"Implement automatic tiering from hot object storage to warm/cold archival tiers.\" },\n        { title: \"Architecture Cost Review Gates\", note: \"Introduce FinOps design approval for new cloud-native, serverless, and container services.\" },\n        { title: \"Multi-Year Commitment Renewals\", note: \"Consolidate multi-cloud volume agreements and renegotiate enterprise discount tiers.\" },\n        { title: \"Automated Policy Enforcement\", note: \"Implement policy-as-code auto-remediation for untagged or non-compliant cloud resources.\" }\n      ],\n      targetYield: \"Continuous architectural capital optimization\"\n    }\n  ];\n\n  return '<div class=\"roadmap-grid\">' + phases.map(ph => {\n    return `<div class=\"roadmap-card\">\n      <div class=\"roadmap-head\">\n        <div class=\"roadmap-phase-num\">${ph.phase}</div>\n        <div>\n          <div class=\"roadmap-name\">${esc(ph.name)}</div>\n          <span class=\"pill ${ph.tagClass}\">${esc(ph.tag)}</span>\n        </div>\n      </div>\n      <p class=\"roadmap-desc\">${esc(ph.desc)}</p>\n      <div class=\"roadmap-actions\">\n        ${ph.actions.map(a => `<div class=\"roadmap-action-item\">\n          <b>${esc(a.title)}</b> \u2014 <span>${esc(a.note)}</span>\n        </div>`).join(\"\")}\n      </div>\n      <div class=\"roadmap-yield\">\n        <span class=\"yield-label\">Target Yield:</span>\n        <span class=\"yield-val\">${esc(ph.targetYield)}</span>\n      </div>\n    </div>`;\n  }).join(\"\") + '</div>';\n}\n\n\n/* ---------------- Cinematic Report Generation Animation ---------------- */\nfunction showReportGenerationAnimation(callback) {\n  // Call secure AWS Lambda API in ap-south-1 during the animation\n  var cloudPromise = fetchCloudEvaluation(S.answers, S.org);\n\n  var overlay = document.createElement('div');\n  overlay.className = 'report-gen-overlay';\n  overlay.id = 'report-gen-overlay';\n  var steps = [\n    'Benchmarking Estate Scale & Growth Trajectory\u2026',\n    'Analyzing Waste Bands & Structural Exposure Models\u2026',\n    'Evaluating 5 Optimization Streams & Priority Tiers\u2026',\n    'Formulating Phased 30-60-90 Day Execution Roadmap\u2026',\n    'Compiling Executive CIO Value Case & Board Readout\u2026'\n  ];\n  overlay.innerHTML =\n    '<div class=\"rg-brand\">LTM \u00b7 CIS Tech Advisory \u00b7 FinOps Value Engine</div>' +\n    '<div class=\"rg-pulse-container\"><div class=\"rg-pulse-ring\"></div><div class=\"rg-pulse-ring\"></div><div class=\"rg-pulse-ring\"></div><div class=\"rg-core-dot\"></div></div>' +\n    '<div class=\"rg-title\">Synthesizing Cloud Financial Diagnostic</div>' +\n    '<div class=\"rg-subtitle\">Correlating estate declarations against 40+ FinOps capabilities, published benchmarks, and peer patterns</div>' +\n    '<ul class=\"rg-step-list\">' +\n      steps.map(function(s,i){ return '<li class=\"rg-step\" id=\"rg-step-'+i+'\"><div class=\"rg-step-icon\">'+(i+1)+'</div><span>'+s+'</span></li>'; }).join('') +\n    '</ul>' +\n    '<div class=\"rg-progress-track\"><div class=\"rg-progress-fill\" id=\"rg-pf\"></div></div>';\n  document.body.appendChild(overlay);\n\n  var totalDuration = 3800;\n  var stepDuration = totalDuration / steps.length;\n  var pf = overlay.querySelector('#rg-pf');\n\n  function activateStep(idx) {\n    if (idx > 0) {\n      var prev = overlay.querySelector('#rg-step-'+(idx-1));\n      if (prev) { prev.classList.remove('active'); prev.classList.add('done'); prev.querySelector('.rg-step-icon').textContent = '\u2713'; }\n    }\n    var cur = overlay.querySelector('#rg-step-'+idx);\n    if (cur) cur.classList.add('active');\n    if (pf) pf.style.width = ((idx+1)/steps.length*100)+'%';\n  }\n\n  activateStep(0);\n  for (var i = 1; i < steps.length; i++) {\n    (function(si){ setTimeout(function(){ activateStep(si); }, si*stepDuration); })(i);\n  }\n  setTimeout(function(){\n    var last = overlay.querySelector('#rg-step-'+(steps.length-1));\n    if (last) { last.classList.remove('active'); last.classList.add('done'); last.querySelector('.rg-step-icon').textContent = '\u2713'; }\n    if (pf) pf.style.width = '100%';\n    setTimeout(function(){\n      overlay.classList.add('fade-out');\n      Promise.all([cloudPromise, new Promise(function(r){ setTimeout(r, totalDuration); })])\n      .then(function() {\n        setTimeout(function(){\n          if (overlay.parentNode) overlay.parentNode.removeChild(overlay);\n          callback();\n        }, 300);\n      });\n    }, 400);\n  }, totalDuration);\n}\n\n/* ---------------- End of Assessment Score Checkpoint ---------------- */\nfunction viewCheckpoint(){\n  const sig = signalScores(), n = needIndex(), v = verdict(), ex = exposure(), bs = blindSpots();\n  const streams = computeStreams(sig, annualSpend(), S.answers);\n  const crit = streams.filter(s => s.priorityOrder <= 2);\n\n  const sigBars = S.kb.meta.signals.map(s => {\n    const val = sig[s.id];\n    return '<div class=\"sigbar\" style=\"margin-bottom:8px\">'\n      + '<div class=\"signame\" style=\"width:130px;font-size:12.5px\">' + esc(s.label) + '</div>'\n      + '<div class=\"sigtrack\" style=\"height:7px\"><div class=\"sigfill\" style=\"width:' + (val||0) + '%;background:' + s.color + '\"></div></div>'\n      + '<div class=\"sigval\" style=\"width:36px;font-size:12px\">' + (val !== null ? val : '\u2014') + '</div>'\n      + '</div>';\n  }).join('');\n\n  const streamPills = streams.map(st => {\n    return `<div style=\"display:inline-flex;align-items:center;gap:6px;background:var(--ground);padding:6px 12px;border-radius:8px;border:1px solid var(--line);font-size:12.5px\">\n      <span>${st.icon}</span>\n      <span style=\"font-weight:600;color:var(--ink)\">${esc(st.name)}</span>\n      <span class=\"pill ${st.priorityClass}\" style=\"font-size:10px;padding:2px 7px\">${esc(st.priority)}</span>\n    </div>`;\n  }).join('');\n\n  return '<main class=\"wrap\">'\n    + chips(\"checkpoint\")\n    + '<div style=\"max-width:880px;margin:0 auto\">'\n    + '<div class=\"eyebrow\" style=\"margin-bottom:4px\">Diagnostic Complete \u00b7 Executive Checkpoint</div>'\n    + '<h1 class=\"h1 sm\" style=\"margin-bottom:8px\">FinOps Qualification & Score Summary</h1>'\n    + '<p class=\"lead\" style=\"font-size:15px;margin-bottom:28px\">Your assessment answers have established your preliminary cloud cost efficiency score and risk profile.</p>'\n\n    + '<div style=\"background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:24px;margin-bottom:24px\">'\n    + '<div class=\"grid2\" style=\"align-items:center;margin-bottom:20px\">'\n      + '<div style=\"display:flex;align-items:center;gap:18px\">'\n        + '<div class=\"needdial\" style=\"width:84px;height:84px;border-width:6px;border-color:' + (v ? v.color : '#8E8E8E') + ';flex:none\">'\n          + '<b style=\"font-size:26px;color:' + (v ? v.color : '#8E8E8E') + '\">' + (n !== null ? n : '\u2014') + '</b>'\n          + '<span style=\"font-size:9px\">Need Index</span>'\n        + '</div>'\n        + '<div>'\n          + '<div class=\"vhead\" style=\"font-size:17px;line-height:1.25\">' + (v ? esc(v.headline) : 'Assessment Complete') + '</div>'\n          + '<p class=\"vnarr\" style=\"margin-top:4px;font-size:13px\">' + (v ? esc(v.label) : '') + '</p>'\n        + '</div>'\n      + '</div>'\n\n      + '<div style=\"background:var(--ground);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:6px\">'\n        + '<div style=\"font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mutd);font-weight:600\">Estimated Unrealised Value (12M)</div>'\n        + '<div style=\"font-size:24px;font-weight:700;color:var(--ink)\">' + (ex.y1 ? money(ex.y1[0]) + ' \u2013 ' + money(ex.y1[1]) : 'Spend Not Specified') + '</div>'\n        + '<div style=\"font-size:12px;color:var(--mut)\">3-Year Cost of Inaction: <b style=\"color:var(--red)\">' + (ex.y3 ? money(ex.y3[0]) + ' \u2013 ' + money(ex.y3[1]) : '\u2014') + '</b></div>'\n      + '</div>'\n    + '</div>'\n\n    + '<div style=\"border-top:1px solid var(--line);padding-top:18px;margin-bottom:18px\">'\n      + '<div style=\"font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mutd);margin-bottom:12px\">Key Diagnostic Signals</div>'\n      + sigBars\n    + '</div>'\n\n    + '<div style=\"border-top:1px solid var(--line);padding-top:18px\">'\n      + '<div style=\"font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mutd);margin-bottom:10px\">Priority Streams Flagged for Optimization</div>'\n      + '<div style=\"display:flex;flex-wrap:wrap;gap:8px\">' + streamPills + '</div>'\n    + '</div>'\n    + '</div>'\n\n    // Engine Launch Action Box\n    + '<div style=\"background:linear-gradient(135deg, #1B3440 0%, #282828 100%);color:#fff;border-radius:12px;padding:28px 24px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.12)\">'\n      + '<div style=\"display:inline-block;background:rgba(255,94,79,0.2);color:#FF8A7A;border:1px solid rgba(255,94,79,0.4);padding:4px 14px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;margin-bottom:12px\">LTM CIS FinOps Diagnostic Engine</div>'\n      + '<h2 style=\"font-size:22px;color:#fff;margin-bottom:8px\">Ready to Synthesize Detailed Value Case &amp; Roadmap?</h2>'\n      + '<p style=\"font-size:14px;color:rgba(255,255,255,0.78);max-width:58ch;margin:0 auto 22px;line-height:1.5\">The engine will correlate your diagnostic profile, quantify individual optimization stream yields, construct your phased 30-60-90 day execution roadmap, and compile your CIO readout.</p>'\n      + '<div style=\"display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap\">'\n        + '<button class=\"btn primary lg\" data-a=\"generateEngineReport\" style=\"padding:14px 28px;font-size:15px;font-weight:700;box-shadow:0 4px 16px rgba(255,94,79,0.4)\">\u26a1 Generate Detailed Value Case Report \u2192</button>'\n        + '<button class=\"btn ghost sm\" data-a=\"secBackToLast\" style=\"color:#fff;border-color:rgba(255,255,255,0.3)\">\u2190 Review Answers</button>'\n      + '</div>'\n    + '</div>'\n\n    + '</div></main>';\n}\n\n/* ---------------- render ---------------- */\nfunction render(){\n  document.querySelectorAll(\"#topnav .navbtn\").forEach(b=>b.classList.toggle(\"on\",b.dataset.nav===S.tab));\n  $(\"#ltmLogo\").innerHTML = S.ltmLogo\n    ? '<img src=\"'+S.ltmLogo+'\" alt=\"LTM\"/>'\n    : '<div style=\"display:flex;align-items:center;gap:12px\">' + DEFAULT_LTM_LOGO + '<div style=\"border-left:1px solid var(--line);padding-left:10px;line-height:1.2\"><b style=\"font-size:13.5px;color:var(--ink)\">FinOps Value Case</b><span style=\"display:block;font-size:9.5px;letter-spacing:.12em;color:var(--steel);text-transform:uppercase\">CIS Tech Advisory</span></div></div>';\n  if(S.tab===\"bank\"){app.innerHTML=viewBank();return;}\n  if(S.screen===\"intro\"){app.innerHTML=viewIntro();return;}\n  if(S.screen===\"org\"){app.innerHTML=viewOrg();return;}\n  if(S.screen===\"assess\"){app.innerHTML=viewAssess();return;}\n  if(S.screen===\"checkpoint\"){app.innerHTML=viewCheckpoint();return;}\n  if(S.screen===\"report\"){app.innerHTML=viewReport();return;}\n}\nfunction chips(active){\n  const st=[[\"org\",\"Your details\"],[\"assess\",\"Assessment\"],[\"checkpoint\",\"Score Checkpoint\"],[\"report\",\"Value Case Report\"]];\n  const ai=st.findIndex(x=>x[0]===active);\n  return '<div class=\"steps\">'+st.map(([k,l],i)=>'<span class=\"stepchip '+(k===active?\"on\":(i<ai?\"done\":\"\"))+'\"><span class=\"n mono\">0'+(i+1)+'</span>'+l+(i<ai?' \u2713':'')+'</span>').join(\"\")+'</div>';\n}\nfunction viewIntro(){\n  return '<main class=\"wrap\"><div style=\"max-width:780px\">'\n   +'<div class=\"eyebrow\">Cloud financial management \u00b7 Qualification assessment</div>'\n   +'<h1 class=\"h1\">You are already paying<br/>for FinOps. Just not getting it.</h1>'\n   +'<p class=\"lead\">Eight minutes of questions to establish whether your organisation has a material, quantifiable cloud cost problem \u2014 and roughly what it is worth. Not a maturity score. A number you can take to Finance.</p>'\n   +'<div class=\"hero\"><div class=\"hnode\"><div class=\"hk\">Industry benchmark</div><div class=\"hv\">29% of cloud spend wasted</div></div>'\n   +'<div class=\"hbridge\"><span>and rising for the first time in five years</span></div>'\n   +'<div class=\"hnode alt\"><div class=\"hk\">Your estate</div><div class=\"hv\">Unknown until measured</div></div></div>'\n   +'<p class=\"blurb\" style=\"margin-bottom:24px\">Benchmark: Flexera 2026 State of the Cloud Report (n=753). Waste has stayed within a 27\u201332% band every year since 2019.</p>'\n   +'<div style=\"display:flex;gap:12px;align-items:center;flex-wrap:wrap\">'\n   +'<button class=\"btn primary lg\" data-a=\"goto\" data-s=\"org\">Start the assessment \u2192</button>'\n   +'<span class=\"blurb\">'+S.kb.questions.length+' questions \u00b7 no data leaves this browser</span></div></div></main>';\n}\nfunction fieldH(l,o,k,t,ph,v){\n  if(t===\"textarea\")return '<div class=\"field\"><label>'+l+'</label><textarea class=\"textarea\" data-model=\"'+o+'.'+k+'\" placeholder=\"'+esc(ph)+'\">'+esc(v)+'</textarea></div>';\n  if(t===\"select\")return '';\n  return '<div class=\"field\"><label>'+l+'</label><input class=\"input\" type=\"'+(t===\"date\"?\"date\":\"text\")+'\" data-model=\"'+o+'.'+k+'\" placeholder=\"'+esc(ph)+'\" value=\"'+esc(v)+'\"/></div>';\n}\nfunction viewOrg(){\n  const o=S.org,r=S.respondent;\n  const curOpts=S.kb.meta.currencies.map(c=>'<option value=\"'+c.id+'\"'+(o.currency===c.id?' selected':'')+'>'+c.symbol+' '+c.id.toUpperCase()+'</option>').join(\"\");\n  return '<main class=\"wrap\">'+chips(\"org\")\n   +'<h2 class=\"h2\">Your organisation</h2><p class=\"blurb\" style=\"margin-bottom:22px\">Appears on the value case report.</p>'\n   +'<div class=\"panelcard\" style=\"max-width:720px\">'\n   +fieldH(\"Organisation name\",\"org\",\"name\",\"input\",\"e.g. Northgate Financial Group\",o.name)\n   +'<div class=\"field\"><label>Organisation logo</label><div class=\"logoup\">'\n   +'<div class=\"logobox\">'+(o.logo?'<img src=\"'+o.logo+'\"/>':'<span>No logo yet</span>')+'</div>'\n   +'<div><button class=\"btn ghost sm\" data-a=\"upOrg\">Upload logo</button>'+(o.logo?' <button class=\"btn ghost sm\" data-a=\"clrOrg\">Remove</button>':'')+'</div></div></div>'\n   +'<div class=\"grid2\">'+fieldH(\"Sector\",\"org\",\"sector\",\"input\",\"e.g. Retail banking\",o.sector)\n   +'<div class=\"field\"><label>Sector classification</label><select data-model=\"org.sector_class\"><option value=\"bfsi\"'+(o.sector_class===\"bfsi\"?\" selected\":\"\")+'>Banking / Financial Services (BFSI)</option><option value=\"other\"'+(o.sector_class===\"other\"?\" selected\":\"\")+'>Other sector</option></select></div></div>'\n   +'<div class=\"field\"><label>Reporting currency</label><select data-model=\"org.currency\">'+curOpts+'</select></div>'\n   +fieldH(\"Scope / context\",\"org\",\"details\",\"textarea\",\"Which providers, business units or workloads are in scope (optional)\",o.details)\n   +'</div><div class=\"panelcard\" style=\"max-width:720px;margin-top:16px\"><div class=\"eyebrow\" style=\"margin-bottom:14px\">Completed by</div><div class=\"grid2\">'\n   +fieldH(\"
