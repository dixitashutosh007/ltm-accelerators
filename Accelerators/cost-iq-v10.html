@import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap");
:root{--bg:#f6f8fa;--panel:#fff;--ink:#1e2932;--muted:#697586;--line:#e4e8ed;--red:#ff5e4f;--red2:#e54536;--teal:#226882;--green:#35754d;--amber:#c77b00;--nav:#17212b;--shadow:0 12px 35px rgba(22,34,45,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",Arial,sans-serif;line-height:1.5}.wrap{max-width:1180px;margin:auto;padding:28px}
.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}.top-in{max-width:1180px;margin:auto;padding:14px 28px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px}.brand-badge{background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;font-weight:800;padding:5px 9px;border-radius:6px}.brand-title{font-size:14px;font-weight:800}.mono{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase}.muted{color:var(--muted)}.hero{background:linear-gradient(135deg,#17212b 0%,#243846 100%);color:#fff;border-radius:20px;padding:44px;position:relative;overflow:hidden;box-shadow:var(--shadow)}.hero:after{content:"";position:absolute;width:420px;height:420px;right:-140px;top:-190px;border-radius:50%;background:radial-gradient(circle,rgba(255,94,79,.28),transparent 68%)}.eyebrow{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#a9bac6}.hero h1{font-size:42px;line-height:1.08;margin:10px 0 12px;max-width:720px}.hero p{max-width:740px;color:#d5dde3}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:10px 15px;font-weight:800;cursor:pointer;font-family:inherit}.btn.primary{background:var(--red);border-color:var(--red);color:#fff}.btn.dark{background:#17212b;border-color:#17212b;color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}.stat b{font-size:25px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px;margin:18px 0;box-shadow:0 4px 18px rgba(22,34,45,.04)}.section-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.area{border:1px solid var(--line);border-radius:14px;padding:17px;cursor:pointer;transition:.18s;background:#fff;position:relative}.area:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:#bfd0d9}.area.selected{border-color:var(--red);background:#fff7f5}.area input{position:absolute;opacity:0}.area .check{position:absolute;right:13px;top:13px;width:22px;height:22px;border:1px solid #c8d0d7;border-radius:50%;display:grid;place-items:center;font-size:12px}.area.selected .check{background:var(--red);color:#fff;border-color:var(--red)}.area h3{font-size:14px;margin:0 0 4px}.area p{font-size:12px;color:var(--muted);margin:0;padding-right:20px}.baseline{background:#eef6f8;border:1px solid #cfe2e8;color:#255e72;border-radius:10px;padding:12px 14px;font-size:12px}.assessment{display:grid;grid-template-columns:240px 1fr;gap:20px}.rail{position:sticky;top:82px;align-self:start}.rail-card{background:#17212b;color:#fff;border-radius:16px;padding:18px}.rail-item{padding:9px 10px;border-radius:8px;font-size:11px;color:#b9c6cf;margin:3px 0}.rail-item.active{background:rgba(255,255,255,.1);color:#fff}.rail-item.done{color:#9ce0b7}.q-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:var(--shadow)}.q-no{display:inline-flex;background:#eef2f5;color:#5d6a75;padding:4px 8px;border-radius:6px;font:600 10px "JetBrains Mono",monospace}.q-title{font-size:25px;line-height:1.25;margin:12px 0 7px}.help{background:#f4f8fa;border-left:3px solid var(--teal);padding:11px 14px;border-radius:8px;font-size:12px;color:#51606c;margin:16px 0}.option{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:9px 0;cursor:pointer;display:flex;gap:12px;align-items:flex-start;transition:.15s;background:#fff}.option:hover{border-color:#b9cbd4;transform:translateX(2px)}.option.selected{border-color:var(--red);background:#fff7f5;box-shadow:0 0 0 2px rgba(255,94,79,.08)}.letter{width:27px;height:27px;border-radius:7px;background:#eef2f5;display:grid;place-items:center;font-weight:800;font-size:11px;flex:none}.selected .letter{background:var(--red);color:#fff}.option-title{font-size:13px;font-weight:700}.option-desc{font-size:11.5px;color:var(--muted);margin-top:2px}.subjective{margin-top:15px}.subjective textarea{width:100%;min-height:88px;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:12px inherit;resize:vertical}.subjective textarea:focus{outline:2px solid rgba(34,104,130,.15);border-color:var(--teal)}.progress{height:6px;background:#edf0f2;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--red),#ff8b7e);transition:.25s}.nav{display:flex;justify-content:space-between;align-items:center;margin-top:20px}.score-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.score-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}.score-num{font-size:35px;font-weight:800}.score-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.dimension-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.dim{border:1px solid var(--line);border-radius:12px;padding:14px}.dim-top{display:flex;justify-content:space-between;font-size:12px;font-weight:800}.dimbar{height:8px;background:#edf0f2;border-radius:99px;margin-top:9px;overflow:hidden}.dimbar i{height:100%;display:block;background:var(--red)}.finding{border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:10px;padding:14px;margin:9px 0}.finding strong{font-size:13px}.finding p{font-size:12px;color:var(--muted);margin:4px 0 0}.gate{background:linear-gradient(135deg,#17212b,#243846);color:#fff;border-radius:18px;padding:28px;margin-top:20px}.gate p{color:#cbd6dd;font-size:12px}.roadmap{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.road{border:1px solid var(--line);border-radius:12px;padding:15px}.road h4{margin:0 0 8px}.road li{font-size:11.5px;margin:5px 0;color:#596773}.overlay{position:fixed;inset:0;background:rgba(9,15,20,.96);z-index:9999;color:#fff;display:grid;place-items:center;text-align:center}.engine{width:min(620px,90vw)}.pulse{width:110px;height:110px;border-radius:50%;border:1px solid rgba(255,94,79,.55);margin:0 auto 28px;display:grid;place-items:center;position:relative}.pulse:before,.pulse:after{content:"";position:absolute;inset:-15px;border:1px solid rgba(255,94,79,.25);border-radius:50%;animation:ping 1.8s infinite}.pulse:after{inset:-31px;animation-delay:.6s}.core{width:25px;height:25px;border-radius:50%;background:var(--red);box-shadow:0 0 30px rgba(255,94,79,.7)}@keyframes ping{0%{transform:scale(.65);opacity:.8}100%{transform:scale(1.25);opacity:0}}.engine h2{font-size:25px;margin:0}.engine .step{font:11px "JetBrains Mono",monospace;color:#82909b;margin:10px}.engine .step.active{color:#fff}.engine .step.done{color:#69d59a}.mini{font-size:11px;color:var(--muted)}.hidden{display:none!important}@media(max-width:850px){.assessment{grid-template-columns:1fr}.rail{position:static}.section-grid{grid-template-columns:1fr 1fr}.stat-grid,.score-grid{grid-template-columns:1fr 1fr}.hero{padding:28px}.hero h1{font-size:32px}}@media(max-width:600px){.wrap{padding:16px}.section-grid,.dimension-grid,.roadmap{grid-template-columns:1fr}.stat-grid,.score-grid{grid-template-columns:1fr 1fr}.q-title{font-size:21px}}
</style>
</head>
<body>
<div class="top"><div class="top-in"><div class="brand"><span class="brand-badge">LTM</span><span class="brand-title">ADVISORY · Cost IQ</span></div><span id="status" class="mono muted">Diagnostic Engine</span></div></div>
<main class="wrap"><div id="app"></div></main>
<script>
const API=window.COST_IQ_API||'';
const $=id=>document.getElementById(id);
let allQuestions=[],questions=[],answers={},subjective={},selectedAreas=[],sectionIndex=0,qIndex=0,assessment=null,aiReview=null;
const BASELINE=['Enterprise Context','CIO Priorities','Spend & Financial Visibility','Cost Governance & Investment'];
const AREAS={
 'Cloud Economics':['Cloud & SaaS Economics','Public Cloud'],
 'SaaS & Licensing':['Cloud & SaaS Economics','SaaS','Software','Software & Licensing'],
 'Infrastructure':['Infrastructure & Operations','On-Prem','Data Center','Colocation','Disaster Recovery'],
 'Applications':['Architecture & Applications','Applications','Product Operating Model'],
 'Workforce':['People & Vendors','People'],
 'Vendors & Commercials':['People & Vendors','Vendors','Procurement','Contracts','Outsourcing','Managed Services'],
 'Cost Governance':['Cost Governance & Investment','FinOps'],
 'Technology Value':['Technology Value','Value Management','Investment Redirection','Cost Reduction'],
 'FinOps':['FinOps'],
 'Architecture & Technical Debt':['Architecture','Technical Debt','Architecture & Applications'],
 'Data':['Data'],
 'Network':['Network'],
 'Security':['Security'],
 'AI & Emerging Technology':['AI'],
 'Transformation':['Transformation'],
 'Business-led IT':['Business-led IT'],
 'M&A':['M&A'],
 'Geography':['Geography'],
 'Operations & Service Management':['ITSM','Observability','Operating Model']
};
const AREA_DESC={
 'Cloud Economics':'Consumption visibility, allocation, optimization and commercial commitments.',
 'SaaS & Licensing':'SaaS usage, licensing, overlap and renewal economics.',
 'Infrastructure':'Capacity, assets, facilities, network and infrastructure lifecycle economics.',
 'Applications':'Application portfolio, lifecycle, ownership and total cost.',
 'Workforce':'Technology workforce, capacity, skills mix and productivity economics.',
 'Vendors & Commercials':'Contracts, sourcing, vendor leverage and commercial optimization.',
 'Cost Governance':'Budgeting, forecasting, decision rights and cost governance.',
 'Technology Value':'Investment effectiveness, business alignment and benefits realization.',
 'FinOps':'FinOps capabilities, operating model, data and continuous optimization.',
 'Architecture & Technical Debt':'Architecture choices, complexity and technical debt economics.',
 'Data':'Data platforms, storage and analytics economics.',
 'Network':'Connectivity and network economics.',
 'Security':'Security technology and security economics.',
 'AI & Emerging Technology':'AI economics and emerging technology decisions.',
 'Transformation':'Transformation portfolio and investment economics.',
 'Business-led IT':'Business-managed technology and decentralized spend.',
 'M&A':'M&A technology cost and integration economics.',
 'Geography':'Regional technology cost and operating differences.',
 'Operations & Service Management':'IT operations, automation, service management and productivity.'
};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,opts){const r=await fetch(API+path,opts);const t=await r.text();let d={};try{d=t?JSON.parse(t):{}}catch(e){throw Error('Invalid API response ('+r.status+')')}if(!r.ok)throw Error(d.message||d.error||('HTTP '+r.status));return d}
function boot(){
  showSplash(['Loading Cost IQ engine…','Loading diagnostic framework…','Preparing adaptive assessment…'],function(){
    api('/api/evaluate/cost-iq/questions').then(function(d){allQuestions=d.questions||[];home()}).catch(function(e){fail(e.message)});
  });
}
function showSplash(steps,done){
  const o=document.createElement('div');o.className='overlay';o.innerHTML='<div class="engine"><div class="pulse"><div class="core"></div></div><div class="eyebrow">LTM · TECHNOLOGY ECONOMICS</div><h2>Cost IQ</h2><p class="muted">Technology Cost & Value Diagnostic Engine</p><div id="ssteps">'+steps.map((x,i)=>'<div class="step" id="sp'+i+'">'+x+'</div>').join('')+'</div></div>';document.body.appendChild(o);
  steps.forEach(function(x,i){setTimeout(function(){document.querySelectorAll('.step').forEach(function(s){s.classList.remove('active')});const s=document.getElementById('sp'+i);if(s)s.classList.add('active')},i*650)});
  setTimeout(function(){o.remove();done()},steps.length*650+650);
}
function home(){
  selectedAreas=BASELINE.slice();
  const cards=Object.keys(AREAS).map(function(a){return '<label class="area selected" data-area="'+esc(a)+'"><input type="checkbox" checked onchange="toggleArea(this,\''+esc(a).replace(/'/g,"\\'")+'\')"><span class="check">✓</span><h3>'+esc(a)+'</h3><p>'+esc(AREA_DESC[a])+'</p></label>'}).join('');
  $('app').innerHTML='<div class="hero"><div class="eyebrow">LTM INFRASTRUCTURE TECHNOLOGY ADVISORY</div><h1>Technology Cost & Value Diagnostic</h1><p>Cost IQ helps leadership understand where technology spend is going, where value is being created, and where management attention may be required.</p><div class="actions"><button class="btn primary" onclick="begin()">Configure diagnostic →</button></div></div><div class="stat-grid"><div class="stat"><span class="mini">Adaptive</span><br><b>20–50</b><div class="mini">Typical questions</div></div><div class="stat"><span class="mini">Baseline</span><br><b>16</b><div class="mini">Cost & value dimensions</div></div><div class="stat"><span class="mini">Engine</span><br><b>20</b><div class="mini">Calibrated findings</div></div><div class="stat"><span class="mini">AI</span><br><b>Review</b><div class="mini">Anomaly & report synthesis</div></div></div><div class="card"><div class="eyebrow" style="color:#60717d">STEP 01 · FOCUS AREAS</div><h2>What would you like to diagnose?</h2><p class="muted">Baseline areas are pre-selected. Add or remove specialist areas to focus the session.</p><div class="baseline">✓ Enterprise context, CIO priorities, spend visibility and cost governance remain part of every assessment.</div><div class="section-grid" style="margin-top:16px">'+cards+'</div><div class="actions"><button class="btn primary" onclick="begin()">Start focused assessment →</button></div></div>';
}
function toggleArea(el,a){if(el.checked){if(!selectedAreas.includes(a))selectedAreas.push(a);el.parentElement.classList.add('selected')}else{selectedAreas=selectedAreas.filter(x=>x!==a);el.parentElement.classList.remove('selected')}}
function begin(){
  const q=allQuestions.filter(function(q){if(BASELINE.includes(q.section))return true;return selectedAreas.some(function(a){return (AREAS[a]||[]).includes(q.section)})});
  questions=q.filter(function(q){return !String(q.id).startsWith('FIN-')||selectedAreas.includes('FinOps')});
  answers={};subjective={};sectionIndex=0;qIndex=0;
  renderAssessment();
}
function sections(){const seen=[];questions.forEach(function(q){if(!seen.includes(q.section))seen.push(q.section)});return seen}
function renderAssessment(){
  const secs=sections();const sec=secs[sectionIndex];const qs=questions.filter(q=>q.section===sec);const q=qs[qIndex];
  if(!q){sectionIndex++;qIndex=0;if(sectionIndex>=secs.length){runEngine();return}renderAssessment();return}
  const answered=questions.filter(q=>answers[q.id]!==undefined).length,total=questions.length,pct=Math.round(answered/total*100);
  const rail=secs.map(function(s,i){return '<div class="rail-item '+(i===sectionIndex?'active':'')+' '+(i<sectionIndex?'done':'')+'">'+(i<sectionIndex?'✓ ':'')+esc(s)+'</div>'}).join('');
  $('app').innerHTML='<div class="assessment"><aside class="rail"><div class="rail-card"><div class="mono" style="color:#9fb0bb">COST IQ</div><h3 style="margin:7px 0 12px">Diagnostic</h3>'+rail+'<div style="margin-top:14px;font-size:10px;color:#8797a2">'+answered+' of '+total+' answered</div><div class="progress" style="margin-top:7px"><i style="width:'+pct+'%"></i></div></div></aside><section><div class="mini" style="margin-bottom:8px">SECTION '+(sectionIndex+1)+' OF '+secs.length+' · '+esc(sec)+'</div><div class="q-card">'+questionHTML(q,qs.indexOf(q)+1,qs.length)+'</div><div class="nav"><button class="btn" onclick="backQ()">← Back</button><div class="mini">'+(qIndex+1)+' of '+qs.length+'</div><button class="btn primary" onclick="nextQ()">'+(qIndex===qs.length-1?(sectionIndex===secs.length-1?'Complete assessment →':'Next section →'):'Continue →')+'</button></div></section></div>';
}
function questionHTML(q,n,total){
  let body='';
  if(q.interaction==='slider'){const v=answers[q.id]??q.control?.min??0;body='<input id="sl" type="range" min="'+(q.control?.min??0)+'" max="'+(q.control?.max??100)+'" step="'+(q.control?.step||1)+'" value="'+v+'" oninput="setSlider(\''+q.id+'\',this.value)"><div class="nav"><span class="mini">'+esc(q.control?.leftLabel||'Lower')+'</span><b id="sv">'+v+'</b><span class="mini">'+esc(q.control?.rightLabel||'Higher')+'</span></div>'}
  else if(q.interaction==='stars'){const v=answers[q.id]||0;body='<div class="actions">'+[1,2,3,4,5].map(n=>'<button class="btn '+(v===n?'primary':'')+'" onclick="setStar(\''+q.id+'\','+n+')">★ '+n+'</button>').join('')+'</div>'}
  else if(q.interaction==='multi-select'||q.interaction==='multi-select-ranking'||q.interaction==='allocation-ranking'){const vals=new Set(Array.isArray(answers[q.id])?answers[q.id]:[]);body=(q.options||[]).map(function(o,i){return '<div class="option '+(vals.has(o.id)?'selected':'')+'" onclick="toggle(\''+q.id+'\',\''+o.id+'\')"><span class="letter">'+String.fromCharCode(65+i)+'</span><div><div class="option-title">'+esc(o.label)+'</div></div></div>'}).join('')}
  else if(q.interaction==='ranking'){body=(q.options||[]).map(function(o,i){return '<div class="option '+((answers[q.id]||[]).includes(o.id)?'selected':'')+'" onclick="toggle(\''+q.id+'\',\''+o.id+'\')"><span class="letter">'+(i+1)+'</span><div class="option-title">'+esc(o.label)+'</div></div>'}).join('')}
  else {body=(q.options||[]).map(function(o,i){return '<div class="option '+(answers[q.id]===o.id?'selected':'')+'" onclick="pick(\''+q.id+'\',\''+o.id+'\')"><span class="letter">'+String.fromCharCode(65+i)+'</span><div><div class="option-title">'+esc(o.label)+'</div></div></div>'}).join('')}
  const subjectiveAllowed=!!(q.control?.allowActual||q.interaction==='range'||q.interaction==='slider'||q.interaction==='single-select'||q.interaction==='true-false'||q.interaction==='stars');
  const sub=subjectiveAllowed?'<div class="subjective"><div style="font-size:11px;font-weight:800;margin-bottom:5px">Additional context <span class="mini">· optional</span></div><textarea placeholder="Add context, evidence, exceptions or anything our AI reviewer should consider..." oninput="subjective['+JSON.stringify(q.id)+']=this.value">'+esc(subjective[q.id]||'')+'</textarea></div>':'';
  return '<span class="q-no">'+esc(q.id)+' · QUESTION '+n+' OF '+total+'</span><h2 class="q-title">'+esc(q.prompt)+'</h2>'+(q.answerGuidance?'<div class="help"><b>How to answer:</b> '+esc(q.answerGuidance)+'</div>':'')+body+sub;
}
function pick(id,v){answers[id]=v;renderAssessment()}function toggle(id,v){const a=Array.isArray(answers[id])?[...answers[id]]:[];const i=a.indexOf(v);if(i>=0)a.splice(i,1);else a.push(v);answers[id]=a;renderAssessment()}function setStar(id,v){answers[id]=v;renderAssessment()}function setSlider(id,v){answers[id]=Number(v);const x=$('sv');if(x)x.textContent=v}
function currentQ(){const s=sections()[sectionIndex];return questions.filter(q=>q.section===s)[qIndex]}
function validQ(){const q=currentQ();const a=answers[q.id];return q.required===false||!(a===undefined||a===null||a===''||(Array.isArray(a)&&!a.length))}
function nextQ(){if(!validQ()){alert('Please answer this question before continuing.');return}const qs=questions.filter(q=>q.section===sections()[sectionIndex]);if(qIndex<qs.length-1){qIndex++;renderAssessment()}else{sectionIndex++;qIndex=0;if(sectionIndex>=sections().length)runEngine();else renderAssessment()}}
function backQ(){if(qIndex>0){qIndex--;renderAssessment()}else if(sectionIndex>0){sectionIndex--;qIndex=questions.filter(q=>q.section===sections()[sectionIndex]).length-1;renderAssessment()}else home()}
async function runEngine(){
  $('app').innerHTML='<div class="card" style="text-align:center;padding:70px 30px"><div class="pulse" style="margin:auto"><div class="core"></div></div><h2>Reviewing your diagnostic…</h2><p class="muted">Cost IQ is evaluating the deterministic scoring engine before the AI review.</p></div>';
  try{assessment=await api('/api/evaluate/cost-iq',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({answers:answers,scope:{selectedAreas:selectedAreas}})});showEngineOverlay(function(){aiCheck()})}catch(e){fail(e.message)}
}
function showEngineOverlay(done){
  showSplash(['Normalizing assessment responses…','Evaluating cost dimensions…','Evaluating value dimensions…','Checking evidence & confidence…','Preparing AI diagnostic review…'],done)
}
async function aiCheck(){
  try{
    aiReview=await api('/api/evaluate/cost-iq/ai-review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({answers:answers,selectedAreas:selectedAreas,context:subjective})});
    if(aiReview.needsClarification&&aiReview.questions&&aiReview.questions.length){clarify(0);return}
  }catch(e){aiReview={needsClarification:false,observations:['AI review unavailable; deterministic assessment retained.']}}
  preliminary();
}
function clarify(i){
  if(i>=(aiReview.questions||[]).length){preliminary();return}
  const q=aiReview.questions[i];$('app').innerHTML='<div class="card" style="max-width:820px;margin:35px auto"><div class="eyebrow">AI DIAGNOSTIC CHECK · '+(i+1)+' OF '+aiReview.questions.length+'</div><h2>'+esc(q.question)+'</h2><p class="muted">'+esc(q.reason)+'</p>'+(q.options||[]).map(function(o,n){return '<div class="option" onclick="answerClarification('+i+', '+JSON.stringify(o).replace(/</g,'\\u003c')+')"><span class="letter">'+String.fromCharCode(65+n)+'</span><div class="option-title">'+esc(o)+'</div></div>'}).join('')+'</div>';
}
function answerClarification(i,v){answers['AI-'+i]=v;clarify(i+1)}
function preliminary(){
  const h=assessment.headlines||{};const ev=assessment.evidence||{};const dims=assessment.dimensionScores||assessment.dimensions||{};const findings=assessment.findings||[];
  const dimHtml=Object.keys(dims).slice(0,12).map(function(k){const v=typeof dims[k]==='object'?(dims[k].score??dims[k].value):dims[k];return '<div class="dim"><div class="dim-top"><span>'+esc(k)+'</span><b>'+esc(v)+'</b></div><div class="dimbar"><i style="width:'+Math.max(0,Math.min(100,Number(v)||0))+'%"></i></div></div>'}).join('');
  $('app').innerHTML='<div class="hero"><div class="eyebrow">COST IQ · PRELIMINARY DIAGNOSTIC</div><h1>Your technology cost & value snapshot</h1><p>We have completed the deterministic assessment and AI diagnostic review. The detailed advisory report is available through the same consultant-led unlock flow used by the other LTM accelerators.</p></div><div class="score-grid" style="margin-top:20px"><div class="score-card"><div class="score-label">Cost IQ</div><div class="score-num">'+esc(h.costIQ??'—')+'</div></div><div class="score-card"><div class="score-label">Value IQ</div><div class="score-num">'+esc(h.valueIQ??'—')+'</div></div><div class="score-card"><div class="score-label">Confidence</div><div class="score-num" style="font-size:23px">'+esc(ev.confidence||'—')+'</div></div><div class="score-card"><div class="score-label">Completeness</div><div class="score-num">'+esc(ev.assessmentCompleteness??0)+'%</div></div></div><div class="card"><div class="eyebrow">KEY DIMENSIONS</div><h2>Where attention is concentrated</h2><div class="dimension-grid">'+(dimHtml||'<p class="muted">Dimension detail will be expanded in the full report.</p>')+'</div></div><div class="card"><div class="eyebrow">CALIBRATED FINDINGS</div><h2>Initial signals</h2>'+(findings.slice(0,5).map(function(f){return '<div class="finding"><strong>'+esc(f.title||f.id)+'</strong><p>'+esc(f.severity||'')+'</p></div>'}).join('')||'<p class="muted">No calibrated findings activated.</p>')+'</div><div class="gate"><div class="eyebrow" style="color:#a9bac6">FULL EXECUTIVE DIAGNOSTIC</div><h2>Unlock the detailed Cost IQ report</h2><p>The full report adds AI-generated executive interpretation, priority opportunities, evidence/context analysis, recommendations and a 3-horizon roadmap.</p><div class="actions"><button class="btn primary" onclick="generateDetailedReport()">Generate full report →</button><button class="btn" onclick="downloadJSON()" style="background:transparent;color:#fff;border-color:#52616d">Export assessment</button></div></div>';
}
function openBooking(){
  const name=prompt('Your name (optional):','');
  if(name===null)return;
  const company=prompt('Organization / enterprise (optional):','');
  if(company===null)return;
  const email=prompt('Corporate email (optional):','');
  if(email===null)return;
  const subject='Cost IQ Executive Briefing Request'+(company?' — '+company:'');
  const body=['Hi Ashutosh,','','I have completed a Cost IQ assessment and would like to schedule an executive briefing to review the full diagnostic report.','', 'Name: '+(name||'Executive'), 'Company: '+(company||'Enterprise'), 'Email: '+(email||''), 'Cost IQ: '+(assessment.headlines?.costIQ??'—'), 'Value IQ: '+(assessment.headlines?.valueIQ??'—'), '', 'Please get in touch to confirm the session.'].join('\n');
  window.location.href='mailto:ashutosh.dixit@ltm.com?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body);
  generateDetailedReport();
}
async function generateDetailedReport(){
  showSplash(['Packaging deterministic findings…','Correlating subjective context…','Synthesizing executive narrative…','Building opportunity roadmap…','Rendering final advisory report…'],async function(){
    try{const ai=await api('/api/evaluate/cost-iq/ai-report',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({assessment:assessment,answers:answers,subjective:subjective,aiReview:aiReview,selectedAreas:selectedAreas})});renderReport(ai)}catch(e){renderReport({executiveSummary:'AI report generation is not configured yet. The deterministic assessment remains available below.',keyMessages:[],priorityAreas:[],opportunities:[],roadmap:[],consultingRecommendations:[],limitations:e.message})}
  })
}
function renderReport(ai){lastAI=ai;window._renderCostReport=ai;const h=assessment.headlines||{},findings=assessment.findings||[],recs=assessment.recommendations||[];const pri=(ai.priorityAreas||[]).map(function(x){return '<div class="dim"><div class="dim-top"><span>'+esc(x.name)+'</span><b>'+esc(x.score)+'</b></div><p class="mini">'+esc(x.why)+'</p><p style="font-size:11px"><b>Next:</b> '+esc(x.action)+'</p></div>'}).join('');const opp=(ai.opportunities||[]).map(function(x){return '<div class="finding"><strong>'+esc(x.title)+'</strong><p>'+esc(x.description)+'</p><p><b>Confidence:</b> '+esc(x.confidence)+' · '+esc(x.nextStep)+'</p></div>'}).join('');const roads=(ai.roadmap||[]).map(function(r){return '<div class="road"><h4>'+esc(r.horizon)+'</h4><ul>'+(r.actions||[]).map(function(a){return '<li>'+esc(a)+'</li>'}).join('')+'</ul></div>'}).join('');$('app').innerHTML='<div id="report"><div class="hero"><div class="eyebrow">LTM · COST IQ EXECUTIVE REPORT</div><h1>Technology Cost & Value Diagnostic</h1><p>'+esc(ai.executiveSummary||'')+'</p></div><div class="score-grid" style="margin-top:20px"><div class="score-card"><div class="score-label">Cost IQ</div><div class="score-num">'+esc(h.costIQ??'—')+'</div></div><div class="score-card"><div class="score-label">Value IQ</div><div class="score-num">'+esc(h.valueIQ??'—')+'</div></div><div class="score-card"><div class="score-label">Confidence</div><div class="score-num" style="font-size:23px">'+esc((assessment.evidence||{}).confidence||'—')+'</div></div><div class="score-card"><div class="score-label">Findings</div><div class="score-num">'+findings.length+'</div></div></div><div class="card"><div class="eyebrow">EXECUTIVE MESSAGES</div><h2>What leadership should know</h2><ul>'+((ai.keyMessages||[]).map(function(x){return '<li style="margin:9px 0;font-size:13px">'+esc(x)+'</li>'}).join(''))+'</ul></div><div class="card"><div class="eyebrow">PRIORITY AREAS</div><h2>Where to focus</h2><div class="dimension-grid">'+(pri||'<p class="muted">No AI priority areas returned.</p>')+'</div></div><div class="card"><div class="eyebrow">OPPORTUNITY SIGNALS</div><h2>Potential value levers</h2>'+(opp||'<p class="muted">No additional opportunity narrative returned.</p>')+'</div><div class="card"><div class="eyebrow">ROADMAP</div><h2>Recommended action path</h2><div class="roadmap">'+(roads||'<p class="muted">Roadmap will be developed during the advisory engagement.</p>')+'</div></div><div class="card"><div class="eyebrow">ENGINE FINDINGS</div><h2>Deterministic findings</h2>'+(findings.map(function(f){return '<div class="finding"><strong>'+esc(f.id)+' · '+esc(f.title)+'</strong><p>'+esc(f.severity||'')+' '+esc(f.detail||'')+'</p></div>'}).join('')||'<p class="muted">No calibrated findings.</p>')+'</div><div class="card"><div class="eyebrow">LTM ADVISORY</div><h2>Recommended next steps</h2><ul>'+((ai.consultingRecommendations||recs.map(function(x){return x.ltmService||x.title})).map(function(x){return '<li style="margin:7px 0">'+esc(x)+'</li>'}).join(''))+'</ul><p class="mini">'+esc(ai.limitations||'Scores and findings remain governed by the Cost IQ deterministic engine. AI is used for interpretation and report synthesis only.')+'</p></div></div><div class="actions"><button class="btn primary" onclick="downloadPDF()">Download Executive Report</button><button class="btn" onclick="archivePDF()">Archive to Secured Storage</button><button class="btn dark" onclick="home()">Start new assessment</button></div>'}
function fail(m){$('app').innerHTML='<div class="card"><h2>Cost IQ is temporarily unavailable</h2><p class="muted">'+esc(m)+'</p><button class="btn primary" onclick="boot()">Retry</button></div>'}
boot();
</script>
