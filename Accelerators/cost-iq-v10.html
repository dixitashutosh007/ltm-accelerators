px;flex:none}.selected .letter{background:var(--red);color:#fff}.option-title{font-size:13px;font-weight:700}.option-desc{font-size:11.5px;color:var(--muted);margin-top:2px}.subjective{margin-top:15px}.subjective textarea{width:100%;min-height:88px;border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:12px inherit;resize:vertical}.subjective textarea:focus{outline:2px solid rgba(34,104,130,.15);border-color:var(--teal)}.progress{height:6px;background:#edf0f2;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--red),#ff8b7e);transition:.25s}.nav{display:flex;justify-content:space-between;align-items:center;margin-top:20px}.score-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.score-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}.score-num{font-size:35px;font-weight:800}.score-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.dimension-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.dim{border:1px solid var(--line);border-radius:12px;padding:14px}.dim-top{display:flex;justify-content:space-between;font-size:12px;font-weight:800}.dimbar{height:8px;background:#edf0f2;border-radius:99px;margin-top:9px;overflow:hidden}.dimbar i{height:100%;display:block;background:var(--red)}.finding{border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:10px;padding:14px;margin:9px 0}.finding strong{font-size:13px}.finding p{font-size:12px;color:var(--muted);margin:4px 0 0}.gate{background:linear-gradient(135deg,#17212b,#243846);color:#fff;border-radius:18px;padding:28px;margin-top:20px}.gate p{color:#cbd6dd;font-size:12px}.roadmap{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.road{border:1px solid var(--line);border-radius:12px;padding:15px}.road h4{margin:0 0 8px}.road li{font-size:11.5px;margin:5px 0;color:#596773}.overlay{position:fixed;inset:0;background:rgba(9,15,20,.96);z-index:9999;color:#fff;display:grid;place-items:center;text-align:center}.engine{width:min(620px,90vw)}.pulse{width:110px;height:110px;border-radius:50%;border:1px solid rgba(255,94,79,.55);margin:0 auto 28px;display:grid;place-items:center;position:relative}.pulse:before,.pulse:after{content:"";position:absolute;inset:-15px;border:1px solid rgba(255,94,79,.25);border-radius:50%;animation:ping 1.8s infinite}.pulse:after{inset:-31px;animation-delay:.6s}.core{width:25px;height:25px;border-radius:50%;background:var(--red);box-shadow:0 0 30px rgba(255,94,79,.7)}@keyframes ping{0%{transform:scale(.65);opacity:.8}100%{transform:scale(1.25);opacity:0}}.engine h2{font-size:25px;margin:0}.engine .step{font:11px "JetBrains Mono",monospace;color:#82909b;margin:10px}.engine .step.active{color:#fff}.engine .step.done{color:#69d59a}.mini{font-size:11px;color:var(--muted)}.hidden{display:none!important}.visual-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.chart-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;min-height:330px}.chart-wrap{position:relative;height:280px}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}@media(max-width:520px){.chart-wrap{height:340px}}.heatmap{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.heat-cell{border-radius:10px;padding:12px;min-height:82px;display:flex;flex-direction:column;justify-content:space-between;border:1px solid rgba(23,33,43,.08)}.heat-cell .heat-score{font-size:22px;font-weight:800}.heat-cell .heat-name{font-size:10px;font-weight:700;line-height:1.25}.report-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.report-kpi .score-card{position:relative;overflow:hidden}.report-kpi .score-card:after{content:"";position:absolute;width:70px;height:70px;border-radius:50%;right:-25px;top:-25px;background:rgba(255,94,79,.09)}.report-band{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.signal{border-radius:14px;padding:16px;border:1px solid var(--line);background:#fff}.signal b{display:block;font-size:13px;margin-bottom:5px}.signal span{font-size:11px;color:var(--muted)}.engine-data{display:flex;justify-content:center;gap:8px;margin:24px auto}.engine-data i{width:7px;height:42px;border-radius:99px;background:var(--red);animation:dataPulse 1s ease-in-out infinite}.engine-data i:nth-child(2){animation-delay:.12s}.engine-data i:nth-child(3){animation-delay:.24s}.engine-data i:nth-child(4){animation-delay:.36s}.engine-data i:nth-child(5){animation-delay:.48s}@keyframes dataPulse{0%,100%{transform:scaleY(.3);opacity:.35}50%{transform:scaleY(1);opacity:1}}.clarify-card{max-width:820px;margin:35px auto;border-top:4px solid var(--red)}@media(max-width:850px){.visual-grid,.report-band{grid-template-columns:1fr}.heatmap{grid-template-columns:repeat(2,1fr)}.report-kpi{grid-template-columns:1fr 1fr}.assessment{grid-template-columns:1fr}.rail{position:static}.section-grid{grid-template-columns:1fr 1fr}.stat-grid,.score-grid{grid-template-columns:1fr 1fr}.hero{padding:28px}.hero h1{font-size:32px}}{.assessment{grid-template-columns:1fr}.rail{position:static}.section-grid{grid-template-columns:1fr 1fr}.stat-grid,.score-grid{grid-template-columns:1fr 1fr}.hero{padding:28px}.hero h1{font-size:32px}}@media(max-width:600px){.wrap{padding:16px}.section-grid,.dimension-grid,.roadmap{grid-template-columns:1fr}.stat-grid,.score-grid{grid-template-columns:1fr 1fr}.q-title{font-size:21px}}

/* CQ7: light work-page hero, visible focus, one even content column, fields */
.hero{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}.hero:after{display:none}.hero p{color:var(--muted)}

<script>
const API=window.COST_IQ_API||'';
const $=id=>document.getElementById(id);
let allQuestions=[],questions=[],answers={},subjective={},selectedAreas=[],sectionIndex=0,qIndex=0,assessment=null;
let assessmentMetadata={},savedAssessment=null,persistTimer=null,persistQueue=Promise.resolve(),testScenario=false,viewEpoch=0;
// Which questions a client is asked comes from the engine (settings.selection): baseline sections, the sections of each focus area, and the
// default areas. The page and the engine use one definition, so completeness is counted over the questions shown.
let BASELINE=[],DEFAULT_AREAS=[],AREAS={};
const AREA_DESC={
 'Cloud Economics':'Cloud and SaaS footprint and commitments, with a pointer to FinOps IQ for cloud cost practice.',
 'SaaS & Licensing':'SaaS usage, licensing, overlap and renewal economics.',
 'Infrastructure':'Capacity, assets, facilities, network and infrastructure lifecycle economics.',
 'Applications':'Application portfolio, lifecycle, ownership and total cost.',
 'Workforce':'Technology workforce, capacity, skills mix and productivity economics.',
 'Vendors & Commercials':'Contracts, sourcing, vendor leverage and commercial optimization.',
 'Cost Governance':'Budgeting, forecasting, decision rights and cost governance.',
 'Technology Value':'Investment effectiveness, business alignment and benefits realization.',
 'Architecture & Technical Debt':'Architecture choices, complexity and technical debt economics.',
 'Data':'Data platforms, storage and analytics economics.',
 'Network':'Connectivity and network economics.',
 'Security':'Security technology and security economics.',
 'AI & Emerging Technology':'AI economics and emerging technology decisions.',
 'Transformation':'Transformation portfolio and investment economics.',
 'Business-led IT':'Business-managed technology and decentralized spend.',
 'M&A':'M&A technology cost and integration economics.',
 'Geography':'Regional technology cost and operating differences.',
 'Operations & Service Management':'IT operations, automation, service management and productivity.'
};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// The Cost IQ routes need the platform sign-in: send the Cognito ID token, renew it once on a 401, and go to sign-in if that fails.
function toSignIn(){location.href='/?require_login=1&redirect='+encodeURIComponent(location.pathname+location.search)}
async function authedFetch(url,opts){
  const lib=window.LTM_API;const token=lib?await lib.getIdToken():'';
  if(!token){toSignIn();throw Error('Your session has expired. Please sign in again.')}
  const send=t=>fetch(url,Object.assign({},opts,{headers:Object.assign({},(opts&&opts.headers)||{},{Authorization:'Bearer '+t})}));
  let r=await send(token);
  if(r.status===401){const renewed=await lib.refreshIdToken();if(renewed)r=await send(renewed);if(r.status===401){toSignIn();throw Error('Your session has expired. Please sign in again.')}}
  return r;
}
async function api(path,opts){const r=await authedFetch(API+path,opts);const t=await r.text();let d={};try{d=t?JSON.parse(t):{}}catch(e){throw Error('Invalid API response ('+r.status+')')}if(!r.ok)throw Error(d.message||d.error||('HTTP '+r.status));return d}
function boot(){
  showSplash(['Loading Cost IQ engine…','Loading diagnostic framework…','Preparing adaptive assessment…'],function(){
    Promise.all([api('/api/evaluate/cost-iq/questions'),api('/api/evaluate/cost-iq/metadata')]).then(function(values){allQuestions=values[0].questions||[];BASELINE=(values[0].selection||{}).baselineSections||[];DEFAULT_AREAS=(values[0].selection||{}).defaultAreas||[];AREAS=(values[0].selection||{}).areas||{};assessmentMetadata=values[1].release||{};notices=values[1].notices||null;home()}).catch(function(e){fail(e.message)});
  });
}
function showSplash(steps,done){
  const o=document.createElement('div');o.className='overlay';o.innerHTML='<div class="engine"><div class="pulse"><div class="core"></div></div><div class="eyebrow">LTM · TECHNOLOGY ECONOMICS</div><h2>Cost IQ</h2><p class="muted">Technology Cost & Value Diagnostic Engine</p><div id="ssteps">'+steps.map((x,i)=>'<div class="step" id="sp'+i+'">'+x+'</div>').join('')+'</div></div>';document.body.appendChild(o);
  steps.forEach(function(x,i){setTimeout(function(){document.querySelectorAll('.step').forEach(function(s){s.classList.remove('active')});const s=document.getElementById('sp'+i);if(s)s.classList.add('active')},i*650)});
  setTimeout(function(){o.remove();done()},steps.length*650+650);
}
// Questions that are always asked for this selection; estate questions gated on the footprint are added as the footprint is answered.
function questionCountForSelection(){return selectQuestions(selectedAreas).filter(function(q){return !(q.applicableWhen&&q.applicableWhen.questionId==='CORE-01')}).length}
function updateQuestionCount(){
  const el=$('selectionQuestionCount');
  if(el) el.textContent=questionCountForSelection();
}
function home(){
  const epoch=++viewEpoch;
  if(persistTimer&&savedAssessment&&!testScenario&&savedAssessment.status!=='completed'){clearTimeout(persistTimer);const pending=persistenceRecord('in_progress');persistQueue=persistQueue.then(()=>window.CostIqPersistence.update(pending)).catch(e=>persistStatus('Save failed · '+e.message))}
  clearTimeout(persistTimer);savedAssessment=null;testScenario=false;
  selectedAreas=DEFAULT_AREAS.slice();
  const cards=Object.keys(AREAS).map(function(a){
    const checked=selectedAreas.includes(a);
    return '<label class="area '+(checked?'selected':'')+'" data-area="'+esc(a)+'"><input type="checkbox" '+(checked?'checked':'')+' onchange="toggleArea(this,\''+esc(a).replace(/'/g,"\\'")+'\')"><span class="check">'+(checked?'✓':'')+'</span><h3>'+esc(a)+'</h3><p>'+esc(AREA_DESC[a])+'</p></label>';
  }).join('');
  $('app').innerHTML='<div class="hero"><div class="eyebrow">LTM VANTAGE · RESPONSIBLE ADVISORY</div><h1>Technology Cost & Value Diagnostic</h1><p>Cost IQ helps leadership understand where technology spend is going, where value is being created, and where management attention may be required.</p><label class="field-label" for="clientName">Organisation this assessment is for</label><input class="field" id="clientName" type="text" maxlength="120" autocomplete="organization" aria-describedby="clientNameError" placeholder="For example, Example Bank plc"><div class="field-error" id="clientNameError" role="alert"></div><div class="actions"><button class="btn primary" onclick="begin()">Start the assessment →</button></div>'+scenarioCard()+'</div>'+noticeCard()+'<div class="stat-grid"><div class="stat"><span class="mini">Questions</span><br><b id="selectionQuestionCount">'+questionCountForSelection()+'</b><div class="mini">Questions for this selection, plus any estate questions your footprint calls for</div></div><div class="stat"><span class="mini">Baseline</span><br><b>16</b><div class="mini">Cost & value dimensions</div></div><div class="stat"><span class="mini">Engine</span><br><b>20</b><div class="mini">Findings the engine can raise</div></div><div class="stat"><span class="mini">Report</span><br><b>PDF</b><div class="mini">Client edition, consultant edition and a CSV backlog</div></div></div><div class="card"><div class="eyebrow" style="color:#60717d">STEP 01 · FOCUS AREAS</div><h2>What would you like to diagnose?</h2><p class="muted">Select one or more focus areas. Two are pre-selected to give you a useful starting point. Baseline questions remain part of every assessment.</p><div class="baseline">✓ Enterprise context, CIO priorities, spend visibility and cost governance remain part of every assessment.</div><div class="section-grid" style="margin-top:16px">'+cards+'</div><div class="actions"><button class="btn primary" onclick="begin()">Start focused assessment →</button></div></div>';
  if(window.CostIqPersistence?.configured()) loadSavedAssessments(epoch);
  else {const note=document.createElement('div');note.className='card';note.innerHTML='<div class="eyebrow">SAVED ASSESSMENTS</div><p class="muted">Assessment saving is not configured in this environment yet. You can still complete a session in this browser.</p>';$('app').appendChild(note)}
}
async function loadSavedAssessments(epoch){
  try{
    const records=await window.CostIqPersistence.list();
    if(epoch!==viewEpoch)return;
    const rows=records.sort((a,b)=>String(b.updatedAt||'').localeCompare(String(a.updatedAt||''))).map(function(r){
      let score=null;try{score=r.resultJson?JSON.parse(r.resultJson).headlines?.costIQ:null}catch(_){score=null}
      return '<div class="signal"><b>'+esc(r.clientName||'Cost IQ assessment')+'</b><span>'+esc(r.status)+' · Updated '+esc(new Date(r.updatedAt).toLocaleString())+(score!==null&&score!==undefined?' · Cost IQ '+esc(score):'')+'</span><div class="actions"><button class="btn" data-assessment-id="'+esc(r.assessmentId)+'">'+(r.status==='completed'?'View result':'Resume')+'</button><span class="delete" data-delete-for="'+esc(r.assessmentId)+'"><button class="btn" type="button" data-delete="'+esc(r.assessmentId)+'">Delete</button></span></div></div>';
    }).join('');
    const card=document.createElement('div');card.className='card';card.innerHTML='<div class="eyebrow">SAVED ASSESSMENTS</div><h2>Continue where you left off</h2><div class="report-band">'+(rows||'<p class="muted">No saved assessments yet.</p>')+'</div>';
    card.querySelectorAll('[data-assessment-id]').forEach(button=>button.addEventListener('click',()=>resumeAssessment(button.dataset.assessmentId)));
    // Deletion is permanent, so it asks for a second click in place.
    card.querySelectorAll('[data-delete]').forEach(button=>button.addEventListener('click',()=>askDelete(card,button.dataset.delete)));
    $('app').appendChild(card);
  }catch(e){console.warn('Cost IQ history unavailable:',e.message)}
}
// The section of the first unanswered question, where a resume lands, and the share answered: saved with each update.
function costIqProgress(){
  const secs=sections(),all=vq();const answered=all.filter(q=>answers[q.id]!==undefined).length;
  const stage=secs.find(s=>all.filter(q=>q.section===s).some(q=>answers[q.id]===undefined))||secs[secs.length-1];
  return {stage:stage,percent:all.length?Math.round(100*answered/all.length):0};
}
function askDelete(card,id){
  const cell=[...card.querySelectorAll('[data-delete-for]')].find(c=>c.dataset.deleteFor===id);if(!cell)return;
  cell.innerHTML='<span class="muted" role="status">Delete permanently? </span><button class="btn" type="button" data-confirm>Confirm delete</button> <button class="btn" type="button" data-cancel>Cancel</button>';
  cell.querySelector('[data-confirm]').focus();
  cell.querySelector('[data-cancel]').addEventListener('click',()=>home());
  cell.querySelector('[data-confirm]').addEventListener('click',async()=>{
    try{await window.CostIqPersistence.remove(id);home()}
    catch(e){cell.innerHTML='<span class="muted" role="alert">Not deleted: '+esc(e.message)+'</span>'}
  });
}
function persistStatus(message){const el=$('status');if(el)el.textContent=message}
function persistenceRecord(status){
  if(!savedAssessment)return null;
  return {...savedAssessment,status:status||'in_progress',selectedAreasJson:JSON.stringify(selectedAreas),answersJson:JSON.stringify(answers),subjectiveJson:JSON.stringify(subjective),updatedAt:new Date().toISOString()};
}
function scheduleProgressSave(){
  if(testScenario||!savedAssessment)return;
  clearTimeout(persistTimer);
  persistTimer=setTimeout(function(){
    persistTimer=null;
    const record=persistenceRecord('in_progress');
    persistQueue=persistQueue.then(()=>window.CostIqPersistence.update(record)).then(updated=>{if(savedAssessment?.assessmentId===record.assessmentId)savedAssessment=updated;persistStatus('Progress saved')}).catch(e=>persistStatus('Save failed · '+e.message));
  },700);
}
async function resumeAssessment(id){

    const record=await window.CostIqPersistence.get(id);if(!record)throw new Error('Assessment not found or access denied.');
    if(epoch!==viewEpoch)return;

    questions=selectQuestions(selectedAreas);

function toggleArea(el,a){
  if(el.checked){
    if(!selectedAreas.includes(a))selectedAreas.push(a);
    el.parentElement.classList.add('selected');
    el.parentElement.querySelector('.check').textContent='✓';
  }else{
    selectedAreas=selectedAreas.filter(x=>x!==a);
    el.parentElement.classList.remove('selected');
    el.parentElement.querySelector('.check').textContent='';
  }
  updateQuestionCount();
}
function testAnswer(q,profile){
  const strength=profile==='healthy'?5:profile==='challenge'?1:3;
  const interaction=String(q.interaction||'').toLowerCase();
  if(interaction.includes('slider')){
    const min=Number(q.control?.min??1),max=Number(q.control?.max??5);
    return profile==='healthy'?max:profile==='challenge'?min:Math.round((min+max)/2);
  }
  if(interaction.includes('star'))return strength;
  if(interaction.includes('multi-select-ranking')){
    const opts=q.options||q.choices||[];
    return opts.slice(0,Math.min(2,opts.length)).map(function(x){return x.value??x.id??x});
  }
  if(interaction.includes('multi-select')){
    const opts=q.options||q.choices||[];
    return opts.length?[opts[0].value??opts[0].id??opts[0]]:[];
  }
  if(interaction.includes('select')||interaction.includes('choice')||interaction.includes('radio')){
    const opts=q.options||q.choices||[];
    if(!opts.length)return strength;
    const x=profile==='challenge'?opts[0]:profile==='healthy'?opts[opts.length-1]:opts[Math.min(1,opts.length-1)];
    return x.value??x.id??x;
  }
  if(interaction.includes('text')||interaction.includes('textarea'))return profile==='healthy'?'Established and measured':profile==='challenge'?'Not established':'Partially established';
  return strength;
}

function selectQuestions(areas){return allQuestions.filter(q=>BASELINE.includes(q.section)||areas.some(a=>(AREAS[a]||[]).includes(q.section))||(q.applicableWhen&&q.applicableWhen.questionId==='CORE-01'))}
function applies(q){const w=q.applicableWhen;if(!w)return true;const a=answers[w.questionId];return (Array.isArray(a)?a:a==null?[]:[a]).some(v=>w.anyOf.includes(String(v)))}

function questionHTML(q,n,total){

  else if(q.interaction==='ranking'){body=(q.options||[]).map(function(o,i){return '<div class="option '+((answers[q.id]||[]).includes(o.id)?'selected':'')+'" onclick="toggle(\''+q.id+'\',\''+o.id+'\')"><span class="letter">'+(i+1)+'</span><div class="option-title">'+esc(optionLabel(q,o))+'</div></div>'}).join('')}

  const subjectiveAllowed=!!(q.control?.allowActual||q.interaction==='range'||q.interaction==='slider'||q.interaction==='single-select'||q.interaction==='true-false'||q.interaction==='stars');

}

function scoreEntries(){
  const src=assessment?.dimensionScores||assessment?.dimensions||assessment?.scores||{};
  let raw=[];
  if(Array.isArray(src)) raw=src;
  else raw=Object.keys(src||{}).map(k=>({id:k,name:k,value:src[k]}));
  return raw.map(function(x){
    const name=x.name||x.label||x.title||x.id||'Dimension';
    let value=x.score??x.value??x.rating??x.percent??x.percentage;
    if(value&&typeof value==='object') value=value.score??value.value??value.rating??0;
    value=Number(value);
    if(!Number.isFinite(value)) return null;
    if(value<=1) value=Math.round(value*100);
    return {name:String(name),score:Math.max(0,Math.min(100,Math.round(value)))};
  }).filter(Boolean).slice(0,16);
}
function scoreColor(v){
  if(v>=75)return 'background:#e4f4e9;color:#245c39';

}

  let ev=null;try{const rec=await window.CostIqPersistence.get(savedAssessment.assessmentId);ev=rec&&rec.leverEvidenceJson?JSON.parse(rec.leverEvidenceJson):null}catch(e){ev=null}
  const f=function(id,label,hint){return '<label for="'+id+'" class="muted">'+label+'</label><input class="input" id="'+id+'" type="number" min="0" step="any" inputmode="decimal" aria-describedby="'+id+'Hint"><div class="muted" id="'+id+'Hint" style="font-size:12px;margin-bottom:8px">'+hint+'</div>'};
  host.innerHTML=f('levBase','Unused or over-entitled licence cost, a year','Required. From the licence reconciliation: entitlements held against what is deployed and used.')+f('levSpend','Total annual spend on these licences','Optional. If given, the unused cost may not exceed it.')+f('levRenew','Share of those contracts renewing in year one, %','Optional, 0 to 100. A quarter is assumed if blank.')+f('levRate','Client\'s own cost of one FTE-month','Required for a net figure. LTM does not assume a salary.')+
    '<div class="actions"><button class="btn primary" type="button" id="levSave">Save measured figures</button><button class="btn" type="button" id="levClear">Clear</button></div><p class="muted" id="levMsg" role="status"></p>';
  const L=ev&&ev.levers&&ev.levers['LEV-11']||{};
  if(L.unusedAnnualCost!=null)$('levBase').value=L.unusedAnnualCost;if(L.addressableSpend!=null)$('levSpend').value=L.addressableSpend;if(L.renewingYear1Share!=null)$('levRenew').value=Math.round(L.renewingYear1Share*10000)/100;if(ev&&ev.internalRatePerFteMonth!=null)$('levRate').value=ev.internalRatePerFteMonth;
  const num=function(id){const v=$(id).value;return v===''?undefined:Number(v)};
  const say=function(t){$('levMsg').textContent=t};
  $('levSave').onclick=async function(){
    const base=num('levBase'),renew=num('levRenew');
    if(base===undefined||!(base>=0))return say('Enter the unused licence cost as a number, not negative.');
    if(renew!==undefined&&!(renew>=0&&renew<=100))return say('The renewal share is between 0 and 100.');
    const lever={unusedAnnualCost:base};if(num('levSpend')!==undefined)lever.addressableSpend=num('levSpend');if(renew!==undefined)lever.renewingYear1Share=renew/100;
    const evidence={currency:cur,levers:{'LEV-11':lever}};if(num('levRate')!==undefined)evidence.internalRatePerFteMonth=num('levRate');
    try{await window.CostIqPersistence.setLeverEvidence(savedAssessment.assessmentId,evidence);say('Saved. The next report includes this lever if the licensing finding is raised.')}catch(e){say('Not saved: '+e.message)}
  };
  $('levClear').onclick=async function(){try{await window.CostIqPersistence.setLeverEvidence(savedAssessment.assessmentId,null);loadLeverEvidence()}catch(e){say('Not cleared: '+e.message)}};
}
function preliminary(){
  const h=assessment.headlines||{};const ev=assessment.evidence||{};const dims=scoreEntries();const SEV={high:0,medium:1,low:2};const findings=(assessment.findings||[]).slice().sort(function(a,b){return (SEV[a.severity]??3)-(SEV[b.severity]??3)});
  const signals=findings.slice(0,4).map(function(f){return '<div class="signal"><b>'+esc(f.title||f.id||'Finding')+'</b><span>'+esc(f.severity||'Management attention required')+(f.description?' · '+esc(f.description):'')+'</span></div>'}).join('');
  $('app').innerHTML='<div class="hero"><div class="eyebrow">COST IQ · PRELIMINARY DIAGNOSTIC</div><h1>Your technology cost & value snapshot</h1><p>The engine has scored the answers. Each score and finding below comes from fixed rules, and the report explains how it was reached.</p></div><div class="report-kpi" style="margin-top:20px"><div class="score-card"><div class="score-label">Cost management</div><div class="score-num">'+esc(h.costIQ??'—')+'<span class="muted" style="font-size:15px"> / 100</span></div></div><div class="score-card"><div class="score-label">Value management</div><div class="score-num">'+esc(h.valueIQ??'—')+'<span class="muted" style="font-size:15px"> / 100</span></div></div><div class="score-card"><div class="score-label">Questions answered</div><div class="score-num">'+esc(ev.assessmentCompleteness??0)+'%</div><div class="muted" style="font-size:12px">Of the questions asked for the areas chosen; not confidence in a saving</div></div></div><div class="card">'+visualSection(dims)+'</div><div class="card"><div class="eyebrow">INITIAL SIGNALS</div><h2>What the engine is seeing</h2><div class="report-band">'+(signals||'<div class="signal"><b>No findings raised</b><span>The detailed report will explain the evidence.</span></div>')+'</div></div><div class="card" id="reportCard"><div class="eyebrow">REPORT</div><h2>Your Cost IQ report</h2><p class="muted">Built on the server from the saved, completed assessment: scores, findings, a delivery plan, how LTM can help, and the assumptions and sources behind every figure. The client edition leaves out consultant notes and internal references.</p>'+reportButtons()+'</div>';
  $('app').insertAdjacentHTML('beforeend',cloudPanelHtml());
  $('app').insertAdjacentHTML('beforeend',leverPanelHtml());
  if(reportReady())$('app').insertAdjacentHTML('beforeend',narrativePanelHtml());
  initVisuals();
  loadCloudLine();
  loadLeverEvidence();
  loadNarrative();
}
// AI narrative (CQ8): off unless the consultant switches it on for this engagement. The service writes it from the scores, findings and recommendations only and rejects anything that fails the grounding check.
var narPollMs=4000;
function narrativePanelHtml(){
  return '<div class="card" id="narrativeCard" style="margin-top:16px"><div class="eyebrow">AI NARRATIVE · OPTIONAL</div><h2>Written summary for the report</h2><div id="narrativeBody"><p class="muted">Loading…</p></div></div>';
}
function narrativeBox(n){
  if(!n||!n.narrative)return '';
  const nr=n.narrative;
  return '<div class="signal"><b>Narrative summary</b><span>'+nr.summary.split(/\n\s*\n/).map(function(t){return esc(t)}).join('<br><br>')+'</span></div><p class="muted" style="font-size:12px">Written by '+esc(n.modelId||'an AI model')+' and checked against the result. It appears in the report when AI is on for this engagement.</p>';
}
async function loadNarrative(){
  const host=$('narrativeBody');if(!host)return;
  if(!savedAssessment||!window.CostIqPersistence?.configured()){host.innerHTML='<p class="muted">Sign in and save the assessment to use the AI narrative.</p>';return}
  let rec=null;try{rec=await window.CostIqPersistence.get(savedAssessment.assessmentId)}catch(e){rec=null}
  const on=!!(rec&&rec.aiEnabled);let stored=null;try{stored=rec&&rec.narrativeJson?JSON.parse(rec.narrativeJson):null}catch(e){stored=null}
  const say=function(t){const m=$('narMsg');if(m)m.textContent=t};
  host.innerHTML=(on
    ?'<p class="muted">AI is on for this engagement. The scores, findings and recommendations, without the organisation\'s name, answers or figures, go to Claude in Amazon Bedrock in India. Nothing is sent until you choose to write.</p><label for="narFocus" class="muted">Optional focus note (up to 300 characters; the organisation\'s name is removed)</label><input class="input" id="narFocus" maxlength="300" type="text"><div class="actions"><button class="btn primary" type="button" id="narWrite">Write narrative</button><button class="btn" type="button" id="narOff">Switch off</button></div>'
    :'<p class="muted">Off. The report is written without AI. Switching on records that this engagement uses AI, and the report\'s data notice says so.</p><div class="actions"><button class="btn primary" type="button" id="narOn">Switch on for this engagement</button></div>')
    +'<div id="narResult">'+(stored&&stored.status==='ok'?narrativeBox(stored):stored&&stored.status!=='pending'?'<p class="muted">The last attempt was not used: it did not pass the checks, or could not be completed.</p>':'')+'</div><p class="muted" id="narMsg" role="status"></p>';
  const act=async function(action,focus){
    try{return await window.CostIqPersistence.narrative(savedAssessment.assessmentId,action,focus)}catch(e){say(e.message);return null}
  };
  if($('narOn'))$('narOn').onclick=async function(){if(await act('enable'))loadNarrative()};
  if($('narOff'))$('narOff').onclick=async function(){if(await act('disable'))loadNarrative()};
  // The service starts the model call and answers at once; the stored state is read until it is ok, rejected or error.
  const poll=async function(){
    const until=Date.now()+5*60*1000;
    while(Date.now()<until){
      await new Promise(function(r){setTimeout(r,narPollMs)});
      if(!$('narMsg'))return;
      let r=null;try{r=await window.CostIqPersistence.get(savedAssessment.assessmentId)}catch(e){continue}
      let n=null;try{n=r&&r.narrativeJson?JSON.parse(r.narrativeJson):null}catch(e){n=null}
      if(!n||n.status==='pending')continue;
      if(n.status==='ok'){$('narResult').innerHTML=narrativeBox(n);say('Done. It will appear in the next report you download.')}
      else say(n.status==='rejected'?'The draft added facts that are not in the result, so it was not used. Try again, or use the report without it.':'The narrative could not be written. Please try again.');
      const b=$('narWrite');if(b)b.disabled=false;return;
    }
    say('This is taking longer than expected. Check back later; the report is unaffected.');
    const b=$('narWrite');if(b)b.disabled=false;
  };
  if($('narWrite'))$('narWrite').onclick=async function(){
    $('narWrite').disabled=true;
    say('Writing and checking the narrative. This can take a minute or two…');
    const d=await act('generate',($('narFocus').value||'').trim()||undefined);
    if(d){poll()}else $('narWrite').disabled=false;
  };
  // Opened while a job is already running (for example after a reload): wait for it.
  if(stored&&stored.status==='pending'&&$('narWrite')){$('narWrite').disabled=true;say('A narrative is being written. This can take a minute or two…');poll()}
}
function reportReady(){return !!savedAssessment&&!testScenario&&savedAssessment.status==='completed'}
function reportButtons(){
  if(!reportReady())return '<p class="muted" id="reportNote">The downloadable report is produced from a saved, completed assessment.</p>';
  return '<div class="actions" role="group" aria-label="Download the report"><button class="btn primary" onclick="downloadReport(\'pdf\',\'client\',this)">Client edition (PDF)</button><button class="btn" onclick="downloadReport(\'pdf\',\'consultant\',this)">Consultant edition (PDF)</button><button class="btn" onclick="downloadReport(\'csv\',\'client\',this)">Backlog (CSV)</button></div><p class="muted" id="reportNote" role="status"></p>';
}
async function downloadReport(format,view,btn){
  const note=$('reportNote');const say=t=>{if(note)note.textContent=t};
  if(!reportReady()){say('Complete and save the assessment first.');return}
  if(btn)btn.disabled=true;say('Preparing the report…');
  try{
    const r=await authedFetch(API+'/api/cost-iq/report?assessmentId='+encodeURIComponent(savedAssessment.assessmentId)+'&format='+format+'&view='+view);
    if(!r.ok){let m='HTTP '+r.status;try{const d=await r.json();m=d.message||d.error||m}catch(e){}throw Error(m)}
    const blob=await r.blob();const m=/filename="([^"]+)"/.exec(r.headers.get('Content-Disposition')||'');
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=m?m[1]:'cost-iq-report.'+format;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
    say('Downloaded.');
  }catch(e){say('Not downloaded: '+e.message)}
  finally{if(btn)btn.disabled=false}
}
function fail(m){$('app').innerHTML='<div class="card"><h2>Cost IQ is temporarily unavailable</h2><p class="muted">'+esc(m)+'</p><button class="btn primary" onclick="boot()">Retry</button></div>'}
boot();
</script>
</body></html>
