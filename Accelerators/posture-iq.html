@import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap");

/* ES Klarheit Grotesk Local Fonts */
@font-face {
  font-family: 'ES Klarheit Grotesk';
  src: local('ES Klarheit Grotesk'), local('ESKlarheitGrotesk-Regular'), local('Klarheit Grotesk');
  font-weight: 400 500;
  font-style: normal;
}
@font-face {
  font-family: 'ES Klarheit Grotesk';
  src: local('ES Klarheit Grotesk Bold'), local('ESKlarheitGrotesk-Bold'), local('Klarheit Grotesk Bold');
  font-weight: 700 800;
  font-style: normal;
}


.brand-badge {
  background: linear-gradient(135deg, #FF5E4F 0%, #E54536 100%);
  color: #fff;
  font-family: var(--font-h);
  font-weight: 800;
  font-size: 14px;
  padding: 4px 10px;
  border-radius: 6px;
  letter-spacing: .04em;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.hero-bg-glow {
  position: absolute;
  top: -60px;
  right: -60px;
  width: 480px;
  height: 340px;
  background: radial-gradient(circle at 60% 40%, rgba(255, 94, 79, 0.18) 0%, rgba(255, 94, 79, 0.05) 50%, transparent 75%);
  pointer-events: none;
  z-index: 0;
  border-radius: 50%;
  filter: blur(25px);
}

.cover-bg-glow {
  position: absolute;
  top: -40px;
  right: -40px;
  width: 380px;
  height: 280px;
  background: radial-gradient(circle at 60% 40%, rgba(255, 94, 79, 0.14) 0%, rgba(255, 94, 79, 0.03) 50%, transparent 75%);
  pointer-events: none;
  z-index: 0;
  border-radius: 50%;
  filter: blur(20px);
}

/* Mode Switcher Pill */
.mode-pill-toggle {
  display: inline-flex;
  background: var(--panel2);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px;
  gap: 3px;
}
.mode-pill {
  border: none;
  background: transparent;
  color: var(--ink3);
  font-family: var(--font-h);
  font-size: 11.5px;
  font-weight: 700;
  padding: 5px 12px;
  border-radius: 999px;
  cursor: pointer;
  transition: .15s ease;
}
.mode-pill:hover {
  color: var(--ink);
}
.mode-pill.active {
  background: var(--ltm-red);
  color: #fff;
  box-shadow: 0 1px 4px rgba(255,94,79,0.25);
}

/* Pre-Calibrated Archetypes Grid */
.grid4 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 14px;
}
.archetype-card {
  background: #FFFFFF;
  border: 1px solid var(--line);
  border-radius: var(--radius-s);
  padding: 16px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
}
.archetype-card:hover {
  border-color: #226882;
  box-shadow: 0 4px 14px rgba(34,104,130,0.12);
  transform: translateY(-2px);
}
.arch-badge {
  font-family: var(--font-m);
  font-size: 9.5px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .08em;
  background: #EDF5F8;
  color: #226882;
  border: 1px solid #C4DCE5;
  padding: 2px 7px;
  border-radius: 4px;
  display: inline-block;
  margin-bottom: 8px;
}
.arch-name {
  font-family: var(--font-h);
  font-size: 14px;
  font-weight: 700;
  color: var(--ink);
  line-height: 1.35;
  margin-bottom: 6px;
}
.arch-meta {
  font-size: 11.5px;
  color: var(--ink3);
  line-height: 1.45;
  margin-bottom: 14px;
}
.arch-actions {
  display: flex;
  gap: 8px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
}
.arch-actions .btn {
  flex: 1;
  justify-content: center;
  font-size: 11.5px;
  padding: 7px 10px;
}

/* Dynamic Contradiction Probe Callout Styles */
.probe-callout {
  background: linear-gradient(135deg, #FFFDF8 0%, #FFF4E5 100%);
  border: 1px solid #FF9800;
  border-left: 4px solid #F57C00;
  border-radius: var(--radius-s);
  padding: 14px 16px;
  margin-top: 14px;
  animation: fadeInProbe .3s ease;
}
@keyframes fadeInProbe {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: translateY(0); }
}
.probe-callout-hd {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}
.probe-callout-badge {
  background: #F57C00;
  color: #fff;
  font-family: var(--font-m);
  font-size: 9.5px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .08em;
  padding: 2px 6px;
  border-radius: 3px;
}
.probe-callout-title {
  font-family: var(--font-h);
  font-size: 13.5px;
  font-weight: 700;
  color: #B26A00;
}
.probe-assertion {
  font-size: 12px;
  color: #5B5B5B;
  margin: 4px 0 6px;
  font-style: italic;
}
.probe-script-box {
  background: #FFFFFF;
  border: 1px dashed #FFA726;
  border-radius: 6px;
  padding: 10px 14px;
  margin: 8px 0;
  font-size: 12.5px;
  line-height: 1.55;
  color: #282828;
}
.probe-script-box b {
  color: #B26A00;
}
.probe-remedy-box {
  font-size: 11.5px;
  color: #35754D;
  margin-top: 6px;
}

/* Pillar Progress and Cards */
.pillar-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 14px;
  margin-top: 14px;
}
.pillar-card {
  background: #FFFFFF;
  border: 1px solid var(--line);
  border-radius: var(--radius-s);
  padding: 14px 16px;
  transition: transform .15s ease, border-color .15s ease;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.pillar-card:hover {
  border-color: #C6C6C6;
  transform: translateY(-1px);
}
.pillar-hd {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 4px;
}
.pillar-num {
  font-family: var(--font-m);
  font-size: 10px;
  font-weight: 700;
  color: var(--ink3);
  letter-spacing: .1em;
}
.pillar-score {
  font-family: var(--font-h);
  font-size: 20px;
  font-weight: 800;
  color: var(--ink);
}
.pillar-name {
  font-family: var(--font-h);
  font-size: 13px;
  font-weight: 700;
  color: var(--ink);
  line-height: 1.35;
  margin-bottom: 8px;
  min-height: 35px;
}
.pillar-bar-wrap {
  height: 6px;
  background: #EAEAEA;
  border-radius: 3px;
  overflow: hidden;
  margin-bottom: 8px;
}
.pillar-bar-fill {
  height: 100%;
  border-radius: 3px;
  transition: width .6s cubic-bezier(0.16,1,0.3,1);
}
.pillar-status {
  font-family: var(--font-m);
  font-size: 10.5px;
  font-weight: 700;
  display: inline-block;
  padding: 2px 6px;
  border-radius: 3px;
}

/* Statutory Fine Cards */
.stat-penalty-card {
  background: #FFFFFF;
  border: 1px solid #ECECEC;
  border-left: 4px solid var(--ltm-red);
  border-radius: var(--radius-s);
  padding: 12px 14px;
}
.stat-penalty-hd {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
}
.stat-penalty-name {
  font-family: var(--font-h);
  font-weight: 700;
  font-size: 13px;
  color: var(--ink);
}
.stat-penalty-cap {
  font-family: var(--font-h);
  font-weight: 800;
  font-size: 15px;
  color: #CC2B1C;
  white-space: nowrap;
}
.stat-penalty-basis {
  font-size: 11.5px;
  color: var(--ink3);
  margin-top: 4px;
  line-height: 1.4;
}

/* Handoff Banner */
#ltm-handoff-banner {
  background: #FFF9E6;
  border-bottom: 1px solid #FFE58F;
  color: #8A6500;
  font-family: var(--font-h);
  font-size: 12.5px;
  padding: 8px 16px;
}
.ltm-hb-inner {
  max-width: 1120px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.ltm-hb-badge {
  background: #FF5E4F;
  color: #fff;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .08em;
  padding: 2px 7px;
  border-radius: 4px;
}
.ltm-hb-close {
  background: none;
  border: none;
  color: #8A6500;
  cursor: pointer;
  font-size: 12px;
  text-decoration: underline;
}

:root{
  --bg:#F8FAFC; --bg2:#F1F5F9; --panel:#FFFFFF; --panel2:#F8FAFC; --panel3:#E2E8F0;
  --line:#CBD5E1; --line2:#94A3B8; --ink:#0F172A; --ink2:#334155; --ink3:#64748B;
  --ltm-red:#FF5E4F; --ltm-darkred:#E54536; --ltm-navy:#00354F; --ltm-amber:#FF5E4F; --ltm-purple:#482475;
  --teal:#35754D; --teal2:#1B5B34;
  --rag-red:#E54536; --rag-amber:#E39A2E; --rag-green:#35754D; --rag-grey:#8E8E8E;
  --font-h:'ES Klarheit Grotesk','Klarheit Grotesk','Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; --font-b:'ES Klarheit Grotesk','Klarheit Grotesk','Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; --font-m:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace;
  --radius:8px; --radius-s:4px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body{ min-height:100vh; background:var(--bg); position:relative; overflow-x:hidden; }
h1,h2,h3,h4,h5{font-family:var(--font-h);font-weight:600;line-height:1.25;letter-spacing:-.01em}
.mono{font-family:var(--font-m)}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
a{color:var(--ltm-amber);text-decoration:none}

/* ---- top bar ---- */
.topbar{border-bottom:1px solid var(--line);background:rgba(255,255,255,.92);backdrop-filter:blur(8px);position:sticky;top:0;z-index:40}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;height:62px}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--ltm-red),var(--ltm-darkred));display:flex;align-items:center;justify-content:center;font-family:var(--font-h);font-weight:700;color:#fff;font-size:16px}
.brand .name{font-family:var(--font-h);font-weight:600;font-size:15px;letter-spacing:.01em}
.brand .sub{font-family:var(--font-m);font-size:11px;color:var(--ink3);letter-spacing:.08em;text-transform:uppercase}
.topbar-actions{display:flex;gap:8px;align-items:center}

/* ---- buttons ---- */
.btn{font-family:var(--font-b);font-weight:600;font-size:14px;padding:10px 18px;border-radius:var(--radius-s);border:1px solid var(--line2);background:var(--panel2);color:var(--ink);cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--ltm-amber);background:var(--panel3)}
.btn-primary{background:var(--ltm-red);border-color:var(--ltm-red);color:#fff}
.btn-primary:hover{background:var(--ltm-darkred);border-color:var(--ltm-darkred)}
.btn-ghost{background:transparent;border-color:var(--line)}
.btn-sm{padding:7px 12px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ---- screens ---- */
.screen{display:none;padding:36px 0 80px}
.screen.active{display:block}

/* ---- hero / intake ---- */
.eyebrow{font-family:var(--font-m);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ltm-amber);margin-bottom:14px}
.hero h1{font-size:38px;margin-bottom:14px}
.hero p.lede{font-size:17px;color:var(--ink2);max-width:760px;margin-bottom:8px}
.model-thread{display:flex;gap:8px;align-items:center;margin:22px 0 30px;font-family:var(--font-m);font-size:12px;letter-spacing:.06em;color:var(--ink3);text-transform:uppercase}
.model-thread b{color:var(--ltm-amber);font-weight:500}
.model-thread span{color:var(--line2)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:24px}
.card + .card{margin-top:18px}
.card h3{font-size:18px;margin-bottom:4px}
.card .card-sub{color:var(--ink3);font-size:13px;margin-bottom:18px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
@media(max-width:820px){.grid2,.grid3{grid-template-columns:1fr}}

.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.field .hint{font-size:12px;color:var(--ink3);font-weight:400;margin-top:4px}
input[type=text],input[type=email],input[type=number],select,textarea{
  width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius-s);
  color:var(--ink);font-family:var(--font-b);font-size:14px;padding:10px 12px;transition:.15s
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ltm-amber)}
textarea{resize:vertical;min-height:70px}

/* ---- feature strip ---- */
.feat-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:26px}
@media(max-width:820px){.feat-strip{grid-template-columns:1fr 1fr}}
.feat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.feat .fnum{font-family:var(--font-m);font-size:11px;color:var(--ltm-amber);letter-spacing:.1em}
.feat h4{font-size:14px;margin:8px 0 4px}
.feat p{font-size:12.5px;color:var(--ink3);line-height:1.5}

/* ---- reg chips ---- */
.reg-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(max-width:820px){.reg-grid{grid-template-columns:1fr}}
.reg-chip{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--bg2);cursor:pointer;transition:.15s}
.reg-chip:hover{border-color:var(--line2)}
.reg-chip.on{border-color:var(--ltm-amber);background:var(--panel2)}
.reg-chip .rbox{width:20px;height:20px;border:1.5px solid var(--line2);border-radius:4px;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.reg-chip.on .rbox{background:var(--ltm-amber);border-color:var(--ltm-amber);color:#fff}
.reg-chip .rname{font-weight:600;font-size:14px;font-family:var(--font-h)}
.reg-chip .rdesc{font-size:12px;color:var(--ink3);margin-top:2px}
.reg-chip .rtag{font-family:var(--font-m);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ltm-amber);margin-top:6px;display:inline-block}

/* ---- sector select ---- */
.sector-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:820px){.sector-grid{grid-template-columns:1fr 1fr}}
.sector{padding:14px;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--bg2);cursor:pointer;transition:.15s;text-align:left}
.sector:hover{border-color:var(--line2)}
.sector.on{border-color:var(--ltm-red);background:var(--panel2)}
.sector .sname{font-weight:600;font-size:13.5px}
.sector .stag{font-family:var(--font-m);font-size:10px;color:var(--ink3);margin-top:4px;letter-spacing:.04em}
.sector.on .stag{color:var(--ltm-amber)}

/* ---- Sovereign IQ Assessment Design System ---- */
.assess-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px;flex-wrap:wrap;gap:12px}
.assess-progress-card {
  background: #FFFFFF;
  border: 1.5px solid #CBD5E1;
  border-radius: 10px;
  padding: 14px 20px;
  margin: 12px 0 20px 0;
  box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
}
.progress-meta-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: var(--font-m);
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 8px;
}
.progress-label { color: #334155; }
.progress-val { color: #FF5E4F; font-weight: 800; }
.assess-progress-card .progress-track, .progress-track {
  height: 8px;
  background: #E2E8F0;
  border-radius: 4px;
  overflow: hidden;
  margin: 0;
}
.assess-progress-card .progress-fill, .progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #FF5E4F 0%, #E54536 100%);
  border-radius: 4px;
  transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}

/* Sovereign Horizontal Section Rail */
.section-rail-wrap {
  margin: 14px 0 22px 0;
}
.rail, .section-nav {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 4px 2px 14px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
}
.rail::-webkit-scrollbar, .section-nav::-webkit-scrollbar {
  height: 6px;
}
.rail::-webkit-scrollbar-thumb, .section-nav::-webkit-scrollbar-thumb {
  background: #CBD5E1;
  border-radius: 4px;
}
.railitem, .snav {
  background: #FFFFFF;
  border: 1.5px solid #CBD5E1;
  border-radius: 24px;
  padding: 8px 16px;
  font-family: var(--font-h);
  font-size: 13px;
  font-weight: 600;
  color: #475569;
  cursor: pointer;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: all 0.15s ease;
  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
}
.railitem:hover, .snav:hover {
  border-color: #FF5E4F;
  color: #FF5E4F;
  background: #FFF5F4;
}
.railitem.active, .snav.active {
  background: #1E2932 !important;
  border-color: #1E2932 !important;
  color: #FFFFFF !important;
  box-shadow: 0 3px 10px rgba(30, 41, 50, 0.25) !important;
}
.railitem.active .rail-sec-num, .snav.active .rail-sec-num {
  background: #FF5E4F;
  color: #FFFFFF;
}
.railitem.done, .snav.done {
  border-color: #10B981;
  color: #065F46;
  background: #F0FDF4;
}
.railitem.done .rail-sec-num, .snav.done .rail-sec-num {
  background: #DCFCE7;
  color: #166534;
}
.rail-sec-num {
  font-family: var(--font-m);
  font-size: 11px;
  font-weight: 800;
  padding: 2px 7px;
  border-radius: 4px;
  background: #F1F5F9;
  color: #334155;
  transition: all 0.15s ease;
}
.rail-sec-title {
  font-size: 12.5px;
  letter-spacing: .01em;
}
.railck {
  font-size: 12px;
  font-family: var(--font-m);
  font-weight: 800;
  color: #10B981;
}
.rail-count {
  font-size: 11px;
  font-family: var(--font-m);
  font-weight: 700;
  color: #64748B;
  background: #F1F5F9;
  padding: 1px 6px;
  border-radius: 4px;
}

/* Section Header Card */
.sec-card-header {
  background: linear-gradient(180deg, #FFFFFF 0%, #F8FAFC 100%);
  border: 1.5px solid #CBD5E1;
  border-radius: 12px;
  padding: 22px 26px;
  margin-bottom: 22px;
  box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
}
.sec-header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}
.sec-eyebrow {
  font-family: var(--font-m);
  font-size: 11.5px;
  font-weight: 800;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: #FF5E4F;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.sec-counter {
  font-family: var(--font-m);
  font-size: 12px;
  color: #64748B;
  font-weight: 600;
  background: #F1F5F9;
  padding: 4px 10px;
  border-radius: 6px;
  border: 1px solid #E2E8F0;
}
.sec-heading {
  font-family: var(--font-h);
  font-size: 23px;
  font-weight: 800;
  color: #0F172A;
  margin: 0 0 8px 0;
  line-height: 1.25;
}
.sec-lead {
  font-size: 14px;
  color: #475569;
  margin: 0;
  line-height: 1.55;
  max-width: 860px;
}

/* High-Contrast Sovereign IQ Question Card */
.q {
  background: #FFFFFF;
  border: 1.5px solid #CBD5E1;
  border-radius: 12px;
  padding: 24px 26px;
  margin-bottom: 20px;
  box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05), 0 6px 18px rgba(15, 23, 42, 0.03);
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}
.q:hover {
  border-color: #94A3B8;
  box-shadow: 0 3px 10px rgba(15, 23, 42, 0.08);
}
.q.flagged {
  border-left: 5px solid #EF4444;
}
.q-header-bar {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  margin-bottom: 12px;
}
.q-id-badge {
  font-family: var(--font-m);
  font-size: 13px;
  font-weight: 800;
  color: #1E2932;
  background: #F1F5F9;
  border: 1.5px solid #CBD5E1;
  padding: 4px 10px;
  border-radius: 6px;
  flex-shrink: 0;
  letter-spacing: .02em;
}
.q-header-meta {
  flex: 1;
}
.q-text {
  font-family: var(--font-h);
  font-weight: 700;
  font-size: 17px;
  color: #0F172A;
  line-height: 1.4;
  margin-bottom: 6px;
}
.q-refs {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.ref-pill {
  font-family: var(--font-m);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .02em;
  padding: 3px 8px;
  border-radius: 4px;
  background: #EFF6FF;
  color: #1D4ED8;
  border: 1px solid #BFDBFE;
  display: inline-flex;
  align-items: center;
}
.flag-chip {
  font-family: var(--font-m);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .06em;
  padding: 4px 10px;
  border-radius: 6px;
  background: #FEF2F2;
  color: #B91C1C;
  border: 1px solid #FCA5A5;
  white-space: nowrap;
  flex-shrink: 0;
}
.q-help-box {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  background: #F8FAFC;
  border-left: 3.5px solid #3B82F6;
  border-radius: 0 6px 6px 0;
  padding: 11px 15px;
  margin: 12px 0 16px 0;
  font-size: 13.5px;
  color: #334155;
  line-height: 1.5;
}
.q-help-icon {
  font-size: 14px;
  flex-shrink: 0;
  margin-top: 1px;
}

/* High-Contrast Question Options & A B C D Badges */
.opts-vert { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
.opts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
@media(max-width:720px){ .opts-grid { grid-template-columns: 1fr; } }

.opt {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 13px 18px;
  border: 2px solid #CBD5E1;
  border-radius: 8px;
  background: #FFFFFF;
  cursor: pointer;
  transition: all 0.15s ease;
  font-size: 14.5px;
  color: #0F172A;
  user-select: none;
  position: relative;
}
.opt:hover {
  border-color: #FF5E4F;
  background: #FFF5F4;
  transform: translateY(-1px);
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
/* SELECTED STATE - HIGH CONTRAST & CLEAR VISIBILITY */
.opt.selected, .opt.on, .opt.sel {
  border-color: #FF5E4F !important;
  background: #FCF0EE !important;
  font-weight: 600;
  color: #000000;
  box-shadow: 0 0 0 1.5px #FF5E4F, 0 3px 12px rgba(255, 94, 79, 0.22) !important;
}

/* Option Letter Badges (A, B, C, D) */
.opt-badge {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  background: #F1F5F9;
  border: 1.5px solid #CBD5E1;
  color: #334155;
  font-weight: 800;
  font-size: 12.5px;
  font-family: var(--font-m);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.15s ease;
}
.opt:hover .opt-badge {
  border-color: #FF5E4F;
  color: #CC2B1C;
  background: #FFE8E5;
}
.opt.selected .opt-badge, .opt.on .opt-badge, .opt.sel .opt-badge {
  background: #FF5E4F !important;
  border-color: #FF5E4F !important;
  color: #FFFFFF !important;
  box-shadow: 0 2px 6px rgba(255, 94, 79, 0.35);
}

.opt-label {
  flex: 1;
  font-size: 14.5px;
  line-height: 1.45;
  color: #1E2932;
}
.opt.selected .opt-label, .opt.on .opt-label, .opt.sel .opt-label {
  color: #000000;
  font-weight: 700;
}

/* Right-Hand Mark (Radio/Check Indicator) */
.opt .mark {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 2px solid #CBD5E1;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s ease;
  background: #FFFFFF;
}
.opt.multi .mark {
  border-radius: 5px;
}
.opt:hover .mark {
  border-color: #FF5E4F;
}
.opt.selected .mark, .opt.on .mark, .opt.sel .mark {
  border-color: #FF5E4F !important;
  background: #FF5E4F !important;
}
.opt.selected .mark::after, .opt.on .mark::after, .opt.sel .mark::after {
  content: '';
  display: block;
  width: 6px;
  height: 10px;
  border: solid #FFFFFF;
  border-width: 0 2.5px 2.5px 0;
  transform: rotate(45deg);
  margin-bottom: 2px;
}

.opt .osev {
  font-family: var(--font-m);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 4px;
  align-self: center;
  flex-shrink: 0;
}

/* High-Contrast Scale Buttons */
.opts-horiz {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 14px;
}
.scale-btn {
  flex: 1;
  min-width: 80px;
  border: 2px solid #CBD5E1;
  background: #FFFFFF;
  border-radius: 8px;
  padding: 14px 12px;
  cursor: pointer;
  transition: all 0.15s ease;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.scale-btn:hover {
  border-color: #FF5E4F;
  background: #FFF5F4;
  transform: translateY(-1px);
}
.scale-btn.selected {
  border-color: #FF5E4F !important;
  background: #FCF0EE !important;
  box-shadow: 0 0 0 1.5px #FF5E4F, 0 3px 10px rgba(255, 94, 79, 0.2) !important;
}
.scale-btn b {
  font-size: 16px;
  font-weight: 800;
  color: #1E2932;
}
.scale-btn.selected b {
  color: #CC2B1C;
}
.scale-btn span {
  font-size: 11.5px;
  color: #64748B;
}
.scale-btn.selected span {
  color: #8A1308;
  font-weight: 600;
}

/* High-Contrast Matrix Table */
.matrix table {
  border-collapse: separate;
  border-spacing: 0;
  width: 100%;
  font-size: 13px;
  border: 2px solid #CBD5E1;
  border-radius: 8px;
  overflow: hidden;
}
.matrix th {
  background: #F1F5F9;
  color: #1E2932;
  font-weight: 700;
  padding: 10px 12px;
  border-bottom: 2px solid #CBD5E1;
  border-right: 1px solid #CBD5E1;
}
.matrix td {
  background: #FFFFFF;
  padding: 10px 8px;
  border-bottom: 1px solid #E2E8F0;
  border-right: 1px solid #E2E8F0;
  text-align: center;
}
.m-cell {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  border: 2px solid #CBD5E1;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.15s ease;
  font-weight: 800;
  font-size: 13px;
  background: #FFFFFF;
}
.m-cell:hover {
  border-color: #FF5E4F;
  background: #FFF5F4;
}
.m-cell.sel {
  border-color: #FF5E4F !important;
  background: #FF5E4F !important;
  color: #FFFFFF !important;
  box-shadow: 0 2px 6px rgba(255, 94, 79, 0.35);
}

.matrix{overflow-x:auto}
.matrix table{border-collapse:collapse;width:100%;font-size:12.5px}
.matrix th,.matrix td{border:1px solid var(--line);padding:8px 6px;text-align:center}
.matrix th{background:var(--panel2);font-family:var(--font-m);font-size:10.5px;letter-spacing:.03em;color:var(--ink2);font-weight:500}
.matrix td.rowlab{text-align:left;font-weight:600;background:var(--bg2);color:var(--ink2)}
.matrix input[type=radio]{accent-color:var(--ltm-amber);cursor:pointer}

.scale-row{display:flex;gap:6px;flex-wrap:wrap}
.scale-btn{flex:1;min-width:60px;padding:10px 6px;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--bg2);cursor:pointer;text-align:center;transition:.12s}
.scale-btn:hover{border-color:var(--line2)}
.scale-btn.on{border-color:var(--ltm-amber);background:var(--panel2);color:var(--ltm-amber)}
.scale-btn .sv{font-family:var(--font-m);font-size:16px;font-weight:600;display:block}
.scale-btn .sl{font-size:10.5px;color:var(--ink3);margin-top:2px}

.assess-foot{display:flex;justify-content:space-between;margin-top:22px;gap:12px}

/* ---- severity colors ---- */
.sev-critical{background:#F7D6D1;color:#B21203}
.sev-high{background:#FBE0DB;color:#CC2B1C}
.sev-medium{background:#F5E6C9;color:#8A5A12}
.sev-low{background:#ECECEC;color:#5B5B5B}
.sev-positive{background:#DCEAE0;color:#1B5B34}

/* ---- results ---- */
.result-hero{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:20px;margin-bottom:8px}
.score-ring{display:flex;gap:24px;align-items:center}
.big-score{font-family:var(--font-h);font-size:52px;font-weight:700;line-height:1}
.big-score small{font-size:20px;color:var(--ink3)}
.result-badges{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0}

.rag-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:6px}
@media(max-width:820px){.rag-grid{grid-template-columns:1fr}}
.rag-card{border:1px solid var(--line);border-radius:var(--radius);padding:16px;background:var(--panel);border-top:3px solid var(--rag-grey)}
.rag-card.red{border-top-color:var(--rag-red)}
.rag-card.amber{border-top-color:var(--rag-amber)}
.rag-card.green{border-top-color:var(--rag-green)}
.rag-card.grey{border-top-color:var(--rag-grey)}
.rag-card .rag-reg{font-family:var(--font-h);font-weight:600;font-size:16px}
.rag-card .rag-status{font-family:var(--font-m);font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin:6px 0 8px}
.rag-card.red .rag-status{color:var(--rag-red)}
.rag-card.amber .rag-status{color:var(--rag-amber)}
.rag-card.green .rag-status{color:var(--rag-green)}
.rag-card.grey .rag-status{color:var(--rag-grey)}
.rag-card .rag-count{font-size:12.5px;color:var(--ink3)}

.heatmap{border-collapse:collapse;margin-top:10px}
.heatmap td,.heatmap th{border:1px solid var(--line);padding:0;text-align:center;font-size:12px}
.heatmap th{background:var(--panel2);font-family:var(--font-m);font-size:10px;color:var(--ink2);padding:6px 10px;letter-spacing:.04em}
.heat-cell{width:92px;height:56px;position:relative;font-family:var(--font-m);font-weight:600;font-size:18px}

.finding{border:1px solid var(--line);border-left-width:3px;border-radius:var(--radius-s);padding:16px 18px;margin-bottom:12px;background:var(--panel)}
.finding.critical{border-left-color:var(--rag-red)}
.finding.high{border-left-color:var(--ltm-darkred)}
.finding.medium{border-left-color:var(--rag-amber)}
.finding.low{border-left-color:var(--rag-grey)}
.finding .f-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:8px}
.finding .f-title{font-weight:600;font-size:15px}
.finding .f-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.finding .f-body{font-size:13.5px;color:var(--ink2);line-height:1.6}
.finding .f-remedy{font-size:13px;color:var(--ink2);margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);line-height:1.6}
.finding .f-remedy b{color:var(--ltm-amber);font-weight:600}

.phase{margin-bottom:22px}
.phase-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.phase-head .ph-badge{font-family:var(--font-m);font-size:11px;padding:4px 10px;border-radius:5px;letter-spacing:.06em;text-transform:uppercase}
.phase-1 .ph-badge{background:#FBE0DB;color:#CC2B1C}
.phase-2 .ph-badge{background:#F5E6C9;color:#8A5A12}
.phase-3 .ph-badge{background:#EDE7F3;color:#482475}
.phase-head h3{font-size:18px}
.phase-desc{font-size:13px;color:var(--ink3);margin-bottom:14px}
.action{border:1px solid var(--line);border-radius:var(--radius-s);padding:14px 16px;margin-bottom:10px;background:var(--panel)}
.action .a-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.action .a-title{font-weight:600;font-size:14px}
.action .a-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.a-tag{font-family:var(--font-m);font-size:10px;padding:2px 7px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);color:var(--ink2);letter-spacing:.03em}
.action .a-steps{margin-top:10px;font-size:12.5px;color:var(--ink3)}
.action .a-steps ul{margin:6px 0 0 18px}
.action .a-steps li{margin-bottom:3px}

.placeholder-block{border:1.5px dashed var(--line2);border-radius:var(--radius);padding:22px;background:repeating-linear-gradient(45deg,transparent,transparent 10px,rgba(40,40,40,.03) 10px,rgba(40,40,40,.03) 20px);text-align:center}
.placeholder-block .ph-label{font-family:var(--font-m);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ltm-amber);margin-bottom:8px}
.placeholder-block h4{font-size:16px;margin-bottom:6px}
.placeholder-block p{font-size:13px;color:var(--ink3);max-width:620px;margin:0 auto}

.section-title{display:flex;align-items:center;gap:12px;margin:34px 0 14px}
.section-title .st-line{flex:1;height:1px;background:var(--line)}
.section-title h2{font-size:20px;white-space:nowrap}
.section-title .st-num{font-family:var(--font-m);font-size:12px;color:var(--ltm-amber)}

.disclaimer{font-size:11.5px;color:var(--ink3);line-height:1.6;border:1px solid var(--line);border-radius:var(--radius-s);padding:14px 16px;background:var(--bg2);margin-top:20px}

/* ---- drawer (question bank mgmt) ---- */
.drawer-overlay{display:none;position:fixed;inset:0;background:rgba(4,10,17,.7);z-index:60;backdrop-filter:blur(3px)}
.drawer-overlay.open{display:block}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(520px,94vw);background:var(--bg2);border-left:1px solid var(--line2);z-index:61;transform:translateX(100%);transition:.25s;overflow-y:auto;padding:24px}
.drawer.open{transform:translateX(0)}
.drawer h3{font-size:18px;margin-bottom:4px}
.drawer .d-sub{color:var(--ink3);font-size:13px;margin-bottom:18px}
.drawer-close{position:absolute;top:18px;right:18px;background:none;border:none;color:var(--ink3);font-size:22px;cursor:pointer}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel3);border:1px solid var(--ltm-amber);color:var(--ink);padding:12px 20px;border-radius:8px;font-size:13.5px;z-index:80;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.hidden{display:none!important}

/* =================== PRINT / PDF =================== */
@media print{
  @page{size:A4;margin:16mm 14mm}
  html,body{background:#fff!important;color:#12222f!important;font-size:11px;background-image:none!important}
  .topbar,.section-nav,.rail,.section-rail-wrap,.assess-progress-card,.assess-foot,.assess-head .btn,.no-print,.drawer,.drawer-overlay,.toast,.snav,.railitem,.btn{display:none!important}
  .wrap{max-width:none;padding:0}
  .screen{display:none!important;padding:0}
  #screen-results.active,#print-root{display:block!important}
  .card,.finding,.action,.rag-card,.q{background:#fff!important;border-color:#c9d6e2!important;color:#12222f!important;break-inside:avoid}
  .print-page{page-break-after:always}
  .print-cover{page-break-after:always;padding-top:40mm}
  h1,h2,h3,h4,h5{color:#0a2540!important}
  .ink2,.ink3,.f-body,.f-remedy,.rag-count,.phase-desc,.a-steps{color:#3a5061!important}
  .ref-pill,.a-tag{background:#eef3f8!important;border-color:#c9d6e2!important;color:#3a5061!important}
  .placeholder-block{background:#f6f9fc!important;border-color:#9db4c8!important}
  a{color:#0a5cad!important}
  .heat-cell{border:1px solid #c9d6e2!important}
}
.print-only{display:none}
@media print{.print-only{display:block}}

/* Streamlined Intake Card */
.intake-card-clean {

/* AI Anomaly Clarification Stage */
.clarify-header {
  background: linear-gradient(135deg, #1E2932 0%, #226882 100%);
  color: #fff;
  border-radius: 12px;
  padding: 26px 30px;
  margin-bottom: 22px;
}
.clarify-badge {

  <script>
    (function(){
      var splash = document.getElementById('ltm-splash');
      if (!splash) return;
      var bar = document.getElementById('splashBar');
      var status = document.getElementById('splashStatus');
      var pct = document.getElementById('splashPct');
      var skip = document.getElementById('splashSkip');
      var canvas = document.getElementById('splash-canvas');

      // 1. Ambient Particle Wave Canvas
      var ctx = canvas ? canvas.getContext('2d') : null;
      var particles = [];
      var w, h;
      function resize() {
        if (!canvas) return;
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      var animId;
      if (ctx) {
        for (var i = 0; i < 45; i++) {
          particles.push({
            x: Math.random() * (w || 800),
            y: Math.random() * (h || 600),
            radius: Math.random() * 2 + 0.8,
            speedX: Math.random() * 0.8 + 0.2,
            speedY: (Math.random() - 0.5) * 0.4,
            alpha: Math.random() * 0.6 + 0.2,
            color: Math.random() > 0.4 ? '#FF5E4F' : '#3C829B'
          });
        }
        function renderParticles() {
          ctx.clearRect(0, 0, w, h);
          for (var i = 0; i < particles.length; i++) {
            var p = particles[i];
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.alpha;
            ctx.shadowBlur = 8;
            ctx.shadowColor = p.color;
            ctx.fill();

            p.x += p.speedX;
            p.y += p.speedY;
            if (p.x > w) p.x = 0;
            if (p.y < 0) p.y = h;
            if (p.y > h) p.y = 0;
          }
          animId = requestAnimationFrame(renderParticles);
        }
        renderParticles();
      }

      // 2. Cinematic Statutory Loading Sequence
      var steps = [
        { p: 15, text: "Initializing Statutory Defensibility Engine (v2.1)..." },
        { p: 38, text: "Mounting DORA, NIS2, EU AI Act & UK Op Res frameworks..." },
        { p: 64, text: "Calibrating cross-border transfers & concentration risk matrix..." },
        { p: 88, text: "Synthesizing executive defensibility & penalty ceiling models..." },
        { p: 100, text: "Statutory Diagnostic Ready · Launching Posture IQ..." }
      ];

      var duration = 2400; // 2.4 seconds total
      var stepInterval = duration / steps.length;
      var isDismissed = false;

      function updateStep(idx) {
        if (isDismissed || !steps[idx]) return;
        var s = steps[idx];
        if (bar) bar.style.width = s.p + '%';
        if (pct) pct.textContent = (s.p < 10 ? '0' : '') + s.p + '%';
        if (status) {
          status.style.opacity = '0';
          setTimeout(function(){
            if (isDismissed) return;
            status.textContent = s.text;
            status.style.opacity = '1';
          }, 100);
        }
      }

      updateStep(0);
      var timers = [];
      for (var j = 1; j < steps.length; j++) {
        (function(idx){
          timers.push(setTimeout(function(){ updateStep(idx); }, idx * stepInterval));
        })(j);
      }

      function dismiss() {
        if (isDismissed) return;
        isDismissed = true;
        timers.forEach(clearTimeout);
        if (animId) cancelAnimationFrame(animId);
        window.removeEventListener('resize', resize);
        splash.classList.add('splash-out');
        try { sessionStorage.setItem('posture_iq_splash_seen', '1'); } catch(e){}
        setTimeout(function(){
          if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
        }, 550);
      }

      // Auto dismiss after completion + slight pause
      setTimeout(dismiss, duration + 350);

      // Skip triggers
      if (skip) skip.addEventListener('click', dismiss);
      window.addEventListener('keydown', function(e){
        if (e.key === 'Escape') dismiss();
      }, { once: true });
    })();
  </script>

option>\n            <option value=\"water\">Water &amp; Waste Management (NIS2)</option>\n            <option value=\"transport\">Transport &amp; Logistics (NIS2)</option>\n            <option value=\"diginfra\">Digital Infrastructure &amp; Cloud (EUCS \u00b7 NIS2)</option>\n            <option value=\"public\">Public Sector &amp; Government (Sovereign)</option>\n            <option value=\"tech\">Technology &amp; B2B SaaS (DORA CTPP \u00b7 EUCS)</option>\n            <option value=\"manuf\">Manufacturing &amp; Industrial (NIS2)</option>\n            <option value=\"retail\">Retail &amp; Consumer Goods (GDPR \u00b7 PECR)</option>\n          </select>\n        </div>\n\n        <div class=\"field\">\n          <label>Primary Data Subject &amp; Customer Footprint</label>\n          <select id=\"org-footprint\">\n            <option value=\"\">Select footprint\u2026</option>\n            <option value=\"EEA / EU only\">EEA / EU only</option>\n            <option value=\"UK only\">UK only</option>\n            <option value=\"EU + UK\">EU + UK (Dual Regime)</option>\n            <option value=\"EU + US / global\">EU + US / Global (Cross-Border Transfer Scope)</option>\n            <option value=\"UK + US / global\">UK + US / Global (IDTA Scope)</option>\n            <option value=\"Global \u2014 multi-region\">Global \u2014 Multi-Region Enterprise</option>\n          </select>\n        </div>\n\n        <div class=\"field\">\n          <label>Annual Global Turnover / Revenue ($ USD)</label>\n          <select id=\"org-turnover\">\n            <option value=\"50000000\">&lt; $100M USD</option>\n            <option value=\"250000000\" selected>$100M \u2013 $500M USD</option>\n            <option value=\"750000000\">$500M \u2013 $1B USD</option>\n            <option value=\"2500000000\">$1B \u2013 $5B USD</option>\n            <option value=\"10000000000\">$5B \u2013 $20B USD</option>\n            <option value=\"35000000000\">&gt; $20B USD</option>\n          </select>\n        </div>\n\n        <div class=\"field\">\n          <label>Executive Sponsor Name (Optional)</label>\n          <input type=\"text\" id=\"resp-name\" placeholder=\"Full name\">\n        </div>\n\n        <div class=\"field\">\n          <label>Executive Role / Title</label>\n          <input type=\"text\" id=\"resp-role\" placeholder=\"e.g. Chief Information Officer (CIO) / CISO\">\n        </div>\n      </div>\n\n      <!-- Collapsible Advanced Scope Accordion -->\n      <div class=\"scope-accordion\" style=\"margin-top:18px\">\n        <div class=\"scope-acc-hd\" onclick=\"toggleScopeAccordion()\">\n          <span style=\"display:flex;align-items:center;gap:8px\">\n            <span style=\"font-size:13px\">\u2699\ufe0f</span>\n            <b>Applicable Statutory Frameworks</b>\n            <span id=\"scope-count-badge\" class=\"scope-badge\">Mapped to Sector</span>\n          </span>\n          <span id=\"scope-acc-arrow\" style=\"font-size:12px;color:var(--ink3)\">\u25bc Customize</span>\n        </div>\n        <div id=\"scope-acc-body\" style=\"display:none;padding-top:12px\">\n          <p style=\"font-size:12px;color:var(--ink3);margin-bottom:8px\">Statutory frameworks are automatically selected based on your chosen sector. You may toggle individual acts below:</p>\n          <div class=\"reg-grid\" id=\"reg-grid\"></div>\n        </div>\n      </div>\n\n      <div class=\"intake-actions-row\" style=\"margin-top:22px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px\">\n        <div style=\"font-size:12px;color:var(--ink3)\">\n          \ud83d\udd12 In-Browser Execution \u00b7 Zero External Data Storage \u00b7 Non-Legal Advisory\n        </div>\n        <button class=\"btn btn-primary\" onclick=\"startAssessment()\" style=\"padding:12px 28px;font-size:15px;font-weight:700\">\n          Begin Diagnostic Assessment \u2192\n        </button>\n      </div>\n    </div>\n\n    <!-- Hidden elements required by existing engine (managed programmatically) -->\n    <div style=\"display:none\">\n      <select id=\"org-hq\"><option>EU \u2014 multiple</option></select>\n      <select id=\"org-size\"><option>1,000\u20135,000</option></select>\n      <div id=\"sector-grid\"></div>\n    </div>\n\n    <div style=\"display:flex;align-items:center;gap:14px;margin-top:44px;padding-top:22px;border-top:1px solid var(--line)\">\n      <span class=\"brand-badge\" style=\"font-size:11px;padding:2px 8px\">LTM CIS</span>\n      <span style=\"font-size:11.5px;color:var(--ink3)\">Digital Sovereignty Accelerator \u00b7 Infrastructure Tech Advisory \u00b7 A Larsen &amp; Toubro Group Company</span>\n    </div>\n  </div>\n</section>\n\n<!-- ============ SCREEN 2: ASSESSMENT ============ -->\n<section class=\"screen\" id=\"screen-assess\">\n  <div class=\"wrap\" style=\"max-width:1040px\">\n    <div class=\"assess-head\">\n      <div>\n        <div class=\"eyebrow\" style=\"margin-bottom:4px\">STATUTORY POSTURE DIAGNOSTIC \u00b7 IN PROGRESS</div>\n        <h1 style=\"font-size:26px;color:#0F172A;font-weight:800;letter-spacing:-0.02em\" id=\"assess-org\">\u2014</h1>\n      </div>\n      <button class=\"btn btn-ghost btn-sm no-print\" onclick=\"jumpToResults()\" style=\"border:1px solid var(--line);background:#fff;font-weight:600\">Skip to results \u2192</button>\n    </div>\n    <div class=\"assess-progress-card\">\n      <div class=\"progress-meta-row\">\n        <span class=\"progress-label\" id=\"progress-count\">0 answered</span>\n        <span class=\"progress-val\" id=\"progress-pct\">0% Complete</span>\n      </div>\n      <div class=\"progress-track\"><div class=\"progress-fill\" id=\"progress-fill\"></div></div>\n    </div>\n    <div class=\"section-rail-wrap\">\n      <div class=\"rail\" id=\"section-nav\"></div>\n    </div>\n    <div id=\"assess-body\"></div>\n    <div class=\"assess-foot no-print\">\n      <button class=\"btn btn-ghost\" id=\"btn-prev\" onclick=\"prevSection()\" style=\"font-weight:600;padding:12px 24px\">\u2190 Previous Section</button>\n      <button class=\"btn btn-primary\" id=\"btn-next\" onclick=\"nextSection()\" style=\"font-weight:700;padding:12px 30px\">Next Section \u2192</button>\n    </div>\n  </div>\n</section>\n\n<!-- ============ SCREEN CLARIFY: AI ANOMALY AUDITOR ============ -->\n<section class=\"screen\" id=\"screen-clarify\">\n  <div class=\"wrap\">\n    <div class=\"clarify-header\">\n      <span class=\"clarify-badge\">\ud83e\udd16 AI Posture Auditor \u00b7 Adaptive Discovery</span>\n      <h2 style=\"font-size:24px;margin-bottom:6px;color:#fff\">Architectural Ambiguity &amp; Anomaly Review</h2>\n      <p style=\"font-size:13.5px;color:rgba(255,255,255,0.85);max-width:780px;line-height:1.5\">Our discovery engine identified potential statutory contradictions between declared operational practices and regulatory mandates. Please clarify the following before finalizing your executive report:</p>\n    </div>\n    <div id=\"clarify-questions-mount\"></div>\n    <div style=\"display:flex;justify-content:space-between;align-items:center;margin-top:20px;flex-wrap:wrap;gap:12px\" class=\"no-print\">\n      <button class=\"btn btn-ghost\" onclick=\"showScreen('assess')\">&larr; Back to Questions</button>\n      <button class=\"btn btn-primary\" onclick=\"submitClarificationsAndShowResults()\" style=\"padding:11px 24px;font-size:14px;font-weight:700\">Confirm Clarifications &amp; Generate Teaser Report &rarr;</button>\n    </div>\n  </div>\n</section>\n\n<!-- ============ SCREEN 3: RESULTS ============ -->\n<section class=\"screen\" id=\"screen-results\">\n  <div class=\"wrap\" id=\"results-body\"></div>\n</section>\n\n<!-- ============ DRAWER: QUESTION BANK ============ -->\n<div class=\"drawer-overlay\" id=\"drawer-overlay\" onclick=\"closeDrawer()\"></div>\n<div class=\"drawer\" id=\"drawer\">\n  <button class=\"drawer-close\" onclick=\"closeDrawer()\">\u00d7</button>\n  <h3>Question bank</h3>\n  <p class=\"d-sub\">This accelerator's canonical, editable question bank. Export to version it; re-import to update scoring parameters without touching the tool code.</p>\n  <div class=\"field\">\n    <label>Bank summary</label>\n    <div id=\"bank-summary\" class=\"mono\" style=\"font-size:12px;color:var(--ink2);background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:12px;line-height:1.7\"></div>\n  </div>\n  <div style=\"display:flex;gap:8px;flex-wrap:wrap;margin-top:8px\">\n    <button class=\"btn btn-sm\" onclick=\"exportBankJSON()\">Export JSON</button>\n    <button class=\"btn btn-sm\" onclick=\"exportBankCSV()\">Export CSV</button>\n    <button class=\"btn btn-sm\" onclick=\"document.getElementById('import-json').click()\">Import JSON</button>\n    <input type=\"file\" id=\"import-json\" accept=\".json\" class=\"hidden\" onchange=\"importBankJSON(event)\">\n  </div>\n  <div class=\"disclaimer\" style=\"margin-top:22px\">\n    <b>Architectural note.</b> Scoring <i>parameters</i> \u2014 weights, thresholds, severities, Article references and remediation text \u2014 live in this bank. Scoring <i>algorithms</i> (5-pillar rollup, statutory penalty sizing, contradiction probing, heat-map placement) remain in the tool as code. This keeps the bank portable across the accelerator suite via Question Bank Studio.\n  </div>\n</div>\n\n<div class=\"toast\" id=\"toast\"></div>\n<!-- ============ BOARDROOM SLIDES MODAL ============ -->\n<div class=\"modal-overlay\" id=\"boardModal\" onclick=\"if(event.target===this)closeSlideDeck()\">\n  <div class=\"modal-content\" style=\"max-width:920px\">\n    <div class=\"modal-head\">\n      <div>\n        <div style=\"font-size:11px;font-family:var(--font-m);font-weight:700;color:#FF5E4F;text-transform:uppercase;letter-spacing:.12em\">LTM Board Advisory Practice \u00b7 3-Slide Executive Briefing</div>\n        <h3 style=\"font-family:var(--font-h);font-size:18px;margin:2px 0 0\">Boardroom Executive Readout &middot; Slide Deck</h3>\n      </div>\n      <div style=\"display:flex;gap:8px;align-items:center\">\n        <button class=\"btn btn-ghost btn-sm\" onclick=\"copyMarpDeck()\">Copy Deck (.md)</button>\n        <button class=\"btn btn-ghost btn-sm\" onclick=\"closeSlideDeck()\">Close &times;</button>\n      </div>\n    </div>\n    <div class=\"modal-body\">\n      <div id=\"slideMount\"></div>\n      <div style=\"display:flex;justify-content:space-between;align-items:center;margin-top:14px;flex-wrap:wrap;gap:10px\">\n        <div style=\"display:flex;gap:8px\">\n          <button class=\"btn btn-ghost btn-sm\" onclick=\"prevSlide()\">&larr; Previous Slide</button>\n          <button class=\"btn btn-ghost btn-sm\" onclick=\"nextSlide()\">Next Slide &rarr;</button>\n        </div>\n        <span style=\"font-size:12px;color:var(--ink3);font-family:var(--font-m)\" id=\"slideCounter\">Slide 1 of 3 &middot; Use &larr; &rarr; Keys to Navigate</span>\n        <button class=\"btn btn-primary btn-sm\" onclick=\"downloadPostureExecutivePDF()\">Download Executive PDF Pack &darr;</button>\n      </div>\n    </div>\n  </div>\n</div>\n\n\n<!-- ============ SAMPLE ARCHETYPES MODAL ============ -->\n<div class=\"modal-overlay\" id=\"archetypeModal\" onclick=\"if(event.target===this)closeArchetypeModal()\">\n  <div class=\"modal-content\" style=\"max-width:920px\">\n    <div class=\"modal-head\">\n      <div>\n        <div style=\"font-size:11px;font-family:var(--font-m);font-weight:700;color:#226882;text-transform:uppercase;letter-spacing:.12em\">Sample Reference Profiles &middot; Pre-Calibrated Baselines</div>\n        <h3 style=\"font-family:var(--font-h);font-size:18px;margin:2px 0 0\">Sample Enterprise Archetypes</h3>\n      </div>\n      <button class=\"btn btn-ghost btn-sm\" onclick=\"closeArchetypeModal()\">Close &times;</button>\n    </div>\n    <div class=\"modal-body\">\n      <p style=\"font-size:13px;color:var(--ink3);margin-bottom:16px\">Load a sample enterprise posture profile to test the diagnostic engine, explore statutory findings, or benchmark defensibility in seconds.</p>\n      <div class=\"grid2\" style=\"gap:14px\">\n        <!-- Archetype 1 -->\n        <div class=\"archetype-card\" style=\"margin:0\">\n          <div>\n            <div class=\"arch-badge\">BFSI \u00b7 DORA</div>\n            <div class=\"arch-name\">Tier-1 Pan-European Universal Bank</div>\n            <div class=\"arch-meta\">\u20ac8B Turnover \u00b7 AWS/Azure Hybrid \u00b7 Mainframe \u00b7 DORA &amp; NIS2</div>\n          </div>\n          <div class=\"arch-actions\">\n            <button class=\"btn btn-sm btn-ghost\" onclick=\"loadArchetype('bank', false); closeArchetypeModal()\">Load Sample &amp; Step</button>\n            <button class=\"btn btn-sm btn-primary\" onclick=\"loadArchetype('bank', true); closeArchetypeModal()\">\u26a1 Readout</button>\n          </div>\n        </div>\n        <!-- Archetype 2 -->\n        <div class=\"archetype-card\" style=\"margin:0\">\n          <div>\n            <div class=\"arch-badge\" style=\"background:#F3EDF9;color:#482475;border-color:#D8C4EE\">MedTech \u00b7 AI Act</div>\n            <div class=\"arch-name\">National Healthcare &amp; Diagnostic Network</div>\n            <div class=\"arch-meta\">\u20ac1.2B Turnover \u00b7 Azure EU \u00b7 GenAI Imaging \u00b7 NIS2 Essential</div>\n          </div>\n          <div class=\"arch-actions\">\n            <button class=\"btn btn-sm btn-ghost\" onclick=\"loadArchetype('health', false); closeArchetypeModal()\">Load Sample &amp; Step</button>\n            <button class=\"btn btn-sm btn-primary\" onclick=\"loadArchetype('health', true); closeArchetypeModal()\">\u26a1 Readout</button>\n          </div>\n        </div>\n        <!-- Archetype 3 -->\n        <div class=\"archetype-card\" style=\"margin:0\">\n          <div>\n            <div class=\"arch-badge\" style=\"background:#EDF7F1;color:#35754D;border-color:#A3D3B5\">Critical Infra \u00b7 NIS2</div>\n            <div class=\"arch-name\">Consortium Energy &amp; Power Grid Utility</div>\n            <div class=\"arch-meta\">\u20ac3.5B Turnover \u00b7 On-Prem/AWS \u00b7 OT/IT Boundary \u00b7 EUCS</div>\n          </div>\n          <div class=\"arch-actions\">\n            <button class=\"btn btn-sm btn-ghost\" onclick=\"loadArchetype('utility', false); closeArchetypeModal()\">Load Sample &amp; Step</button>\n            <button class=\"btn btn-sm btn-primary\" onclick=\"loadArchetype('utility', true); closeArchetypeModal()\">\u26a1 Readout</button>\n          </div>\n        </div>\n        <!-- Archetype 4 -->\n        <div class=\"archetype-card\" style=\"margin:0\">\n          <div>\n            <div class=\"arch-badge\" style=\"background:#FFF9E6;color:#8A6500;border-color:#FFE58F\">SaaS \u00b7 Global</div>\n            <div class=\"arch-name\">Enterprise B2B SaaS &amp; Payment Gateway</div>\n            <div class=\"arch-meta\">\u20ac300M Turnover \u00b7 Multi-Tenant AWS \u00b7 US Parent \u00b7 DORA CTPP</div>\n          </div>\n          <div class=\"arch-actions\">\n            <button class=\"btn btn-sm btn-ghost\" onclick=\"loadArchetype('saas', false); closeArchetypeModal()\">Load Sample &amp; Step</button>\n            <button class=\"btn btn-sm btn-primary\" onclick=\"loadArchetype('saas', true); closeArchetypeModal()\">\u26a1 Readout</button>\n          </div>\n        </div>\n      </div>\n    </div>\n  </div>\n</div>\n\n<!-- ============ BYOK AI CONFIG MODAL ============ -->\n<div class=\"modal-overlay\" id=\"aiConfigModal\" onclick=\"if(event.target===this)closeAIConfigModal()\">\n  <div class=\"modal-content\" style=\"max-width:680px\">\n    <div class=\"modal-head\">\n      <div>\n        <div style=\"font-size:11px;font-family:var(--font-m);font-weight:700;color:#35754D;text-transform:uppercase;letter-spacing:.12em\">Autonomous Advisory Engine \u00b7 BYOK</div>\n        <h3 style=\"font-family:var(--font-h);font-size:18px;margin:2px 0 0\">AI Model Configuration</h3>\n      </div>\n      <button class=\"btn btn-ghost btn-sm\" onclick=\"closeAIConfigModal()\">Close &times;</button>\n    </div>\n    <div class=\"modal-body\">\n      <p style=\"font-size:13px;color:var(--ink2);line-height:1.5;margin-bottom:16px\">Connect your preferred frontier AI model to power real-time anomaly discovery, tailored clarification questioning, and C-suite executive summary synthesis. Your key is stored strictly in your browser's local storage.</p>\n      \n      <div class=\"field\" style=\"margin-bottom:12px\">\n        <label>Select AI Provider</label>\n        <select id=\"ai-provider-select\" onchange=\"handleAIProviderChange(this.value)\">\n          <option value=\"gemini\">Google Gemini (Recommended \u2014 Gemini 2.0 Flash / 1.5 Pro)</option>\n          <option value=\"claude\">Anthropic Claude (Claude 3.5 Sonnet)</option>\n          <option value=\"openai\">OpenAI (GPT-4o / GPT-4o-mini)</option>\n        </select>\n      </div>\n\n      <div class=\"field\" style=\"margin-bottom:12px\">\n        <label>Model Identifier</label>\n        <select id=\"ai-model-select\">\n          <option value=\"gemini-2.0-flash\">gemini-2.0-flash (Ultra fast, reasoning)</option>\n          <option value=\"gemini-1.5-pro\">gemini-1.5-pro (Deep analysis)</option>\n        </select>\n      </div>\n\n      <div class=\"field\" style=\"margin-bottom:16px\">\n        <label>API Key</label>\n        <div style=\"display:flex;gap:8px\">\n          <input type=\"password\" id=\"ai-api-key\" placeholder=\"Paste your API key here (e.g. AIzaSy... or sk-ant...)\" style=\"flex:1\">\n          <button class=\"btn btn-ghost btn-sm\" type=\"button\" onclick=\"toggleAPIKeyVisibility()\">Show/Hide</button>\n        </div>\n      </div>\n\n      <div style=\"background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:12px;font-size:12px;color:var(--ink3);margin-bottom:18px;line-height:1.5\">\n        <b>Privacy &amp; Data Sovereignty Guarantee:</b> Requests travel directly from your browser to the provider endpoint over TLS. No prompts or keys are sent to LTM servers. If no key is set, the accelerator executes using its deterministic built-in rules engine.\n      </div>\n\n      <div style=\"display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px\">\n        <button class=\"btn btn-ghost btn-sm\" onclick=\"testAIConnection()\">\u26a1 Test Connection</button>\n        <div style=\"display:flex;gap:8px\">\n          <button class=\"btn btn-ghost btn-sm\" onclick=\"clearAIConfig()\">Clear Key</button>\n          <button class=\"btn btn-primary btn-sm\" onclick=\"saveAIConfigFromUI()\">Save &amp; Activate</button>\n        </div>\n      </div>\n    </div>\n  </div>\n</div>\n\n<!-- ============ BOOKING REQUEST MODAL ============ -->\n<div class=\"modal-overlay\" id=\"bookingModal\" onclick=\"if(event.target===this)closeBookingModal()\">\n  <div class=\"modal-content\" style=\"max-width:720px\">\n    <div class=\"modal-head\">\n      <div>\n        <div style=\"font-size:11px;font-family:var(--font-m);font-weight:700;color:#FF5E4F;text-transform:uppercase;letter-spacing:.12em\">LTM CIS Tech Advisory \u00b7 Executive Briefing</div>\n        <h3 style=\"font-family:var(--font-h);font-size:18px;margin:2px 0 0\">Schedule Strategic Readout &amp; Unlock Dossier</h3>\n      </div>\n      <button class=\"btn btn-ghost btn-sm\" onclick=\"closeBookingModal()\">Close &times;</button>\n    </div>\n    <div class=\"modal-body\">\n      <p style=\"font-size:13px;color:var(--ink2);line-height:1.5;margin-bottom:16px\">Schedule a 30-minute executive briefing with practice leadership to review your full 28-page statutory dossier, peer benchmark analysis, and customized 3-Horizon modernization roadmap.</p>\n      \n      <div class=\"grid2\" style=\"gap:14px;margin-bottom:12px\">\n        <div class=\"field\">\n          <label>Executive Name</label>\n          <input type=\"text\" id=\"book-name\" placeholder=\"Full name\">\n        </div>\n        <div class=\"field\">\n          <label>Executive Role / Title</label>\n          <input type=\"text\" id=\"book-role\" placeholder=\"e.g. CIO, CISO, Head of Enterprise Arch\">\n        </div>\n        <div class=\"field\">\n          <label>Corporate Work Email</label>\n          <input type=\"email\" id=\"book-email\" placeholder=\"name@company.com\">\n        </div>\n        <div class=\"field\">\n          <label>Organization / Enterprise</label>\n          <input type=\"text\" id=\"book-company\" placeholder=\"Company name\">\n        </div>\n      </div>\n\n      <div class=\"field\" style=\"margin-bottom:16px\">\n        <label>Preferred Timeframe for 30-Minute Briefing</label>\n        <select id=\"book-timeframe\">\n          <option>Within the next 7 business days</option>\n          <option>Next 2–3 weeks</option>\n          <option>Next month (Q-planning alignment)</option>\n        </select>\n      </div>\n\n      <div style=\"background:#FCF0EE;border:1px solid #FF5E4F;border-radius:6px;padding:12px 14px;font-size:12px;color:#CC2B1C;margin-bottom:18px\">\n        <b>Instant Access:</b> Submitting your request will immediately unlock the unmasked 28-page dossier and vector PDF download on this screen.\n      </div>\n\n      <div style=\"display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px\">\n        <a href=\"javascript:void(0)\" onclick=\"toggleConsultantUnlock(); closeBookingModal()\" style=\"font-size:11px;color:var(--ink3);text-decoration:underline\">LTM Consultant Immediate Bypass</a>\n        <button class=\"btn btn-primary\" onclick=\"submitBookingRequest()\" style=\"padding:10px 22px;font-weight:700\">Submit Request &amp; Unlock Dossier &rarr;</button>\n      </div>\n    </div>\n  </div>\n</div>\n\n<!-- ============ EMAIL TEASER MODAL ============ -->\n<div class=\"modal-overlay\" id=\"emailModal\" onclick=\"if(event.target===this)closeEmailModal()\">\n  <div class=\"modal-content\" style=\"max-width:600px\">\n    <div class=\"modal-head\">\n      <div>\n        <div style=\"font-size:11px;font-family:var(--font-m);font-weight:700;color:#226882;text-transform:uppercase;letter-spacing:.12em\">Executive Summary</div>\n        <h3 style=\"font-family:var(--font-h);font-size:18px;margin:2px 0 0\">Email Teaser Briefing</h3>\n      </div>\n      <button class=\"btn btn-ghost btn-sm\" onclick=\"closeEmailModal()\">Close &times;</button>\n    </div>\n    <div class=\"modal-body\">\n      <p style=\"font-size:13px;color:var(--ink2);margin-bottom:14px\">Draft an email containing your high-level defensibility score and statutory Value at Stake to share internally with your leadership team.</p>\n      <div class=\"field\" style=\"margin-bottom:14px\">\n        <label>Recipient Email</label>\n        <input type=\"email\" id=\"teaser-email\" placeholder=\"e.g. colleague@company.com\">\n      </div>\n      <div style=\"display:flex;justify-content:flex-end;gap:8px\">\n        <button class=\"btn btn-ghost btn-sm\" onclick=\"closeEmailModal()\">Cancel</button>\n        <button class=\"btn btn-primary btn-sm\" onclick=\"sendTeaserEmail()\">Open Draft in Mail App &rarr;</button>\n      </div>\n    </div>\n  </div>\n</div>\n<!-- ============ ADVISORY SOW GENERATOR MODAL ============ -->\n<div class=\"modal-overlay\" id=\"sowModal\" onclick=\"if(event.target===this)closeSOWModal()\">\n  <div class=\"modal-content\" style=\"max-width:880px\">\n    <div class=\"modal-head\">\n      <div>\n        <div style=\"font-size:11px;font-family:var(--font-m);font-weight:700;color:#FF5E4F;text-transform:uppercase;letter-spacing:.12em\">LTM CIS Tech Advisory \u00b7 Commercial Scoping</div>\n        <h3 style=\"font-family:var(--font-h);font-size:18px;margin:2px 0 0\">Statement of Work (SOW) \u00b7 Advisory Proposal Blueprint</h3>\n      </div>\n      <button class=\"btn btn-ghost btn-sm\" onclick=\"closeSOWModal()\">Close &times;</button>\n    </div>\n    <div class=\"modal-body\">\n      <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px\">\n        <span style=\"font-size:12px;color:var(--ink2)\">Auto-generated from live diagnostic findings, pillar scores &amp; statutory exposure</span>\n        <div style=\"display:flex;gap:8px\">\n          <button class=\"btn btn-ghost btn-sm\" onclick=\"copySOWToClipboard()\">Copy Markdown</button>\n          <button class=\"btn btn-primary btn-sm\" onclick=\"downloadSOWMarkdown()\">Download .md SOW &darr;</button>\n        </div>\n      </div>\n      <textarea id=\"sowTextarea\" style=\"width:100%;height:380px;font-family:var(--font-m);font-size:12px;line-height:1.55;padding:14px;border:1px solid var(--line);border-radius:6px;background:var(--bg2);color:var(--ink)\" readonly></textarea>\n    </div>\n  </div>\n</div>\n<!-- ============ INSUFFICIENT DATA MODAL ============ -->\n<div class=\"modal-overlay\" id=\"insufficientDataModal\" onclick=\"if(event.target===this)closeInsufModal()\">\n  <div class=\"modal-content\" style=\"max-width:640px\">\n    <div class=\"modal-head\" style=\"background:linear-gradient(135deg,#FCF0EE,#FFF4F2);border-bottom:1px solid #FF5E4F\">\n      <div>\n        <div style=\"font-size:11px;font-family:var(--font-m);font-weight:700;color:#CC2B1C;text-transform:uppercase;letter-spacing:.12em\">⚠️ Diagnostic Quality Gate</div>\n        <h3 style=\"font-family:var(--font-h);font-size:18px;margin:2px 0 0;color:#B21203\">Insufficient Data for Reliable Diagnostic</h3>\n      </div>\n      <button class=\"btn btn-ghost btn-sm\" onclick=\"closeInsufModal()\">Close &times;</button>\n    </div>\n    <div class=\"modal-body\">\n      <p style=\"font-size:13.5px;color:var(--ink2);line-height:1.6;margin-bottom:16px\">The statutory diagnostic engine requires a minimum of <b>60% question completion</b> to generate a statistically reliable executive report. Please complete additional sections to proceed.</p>\n      <div class=\"insuf-stats\" id=\"insuf-stats-mount\"></div>\n      <div style=\"margin-bottom:12px\">\n        <div class=\"mono\" style=\"font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);margin-bottom:8px\">Section Completion Breakdown</div>\n        <ul class=\"insuf-section-list\" id=\"insuf-section-list-mount\"></ul>\n      </div>\n      <div style=\"display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-top:20px\">\n        <button class=\"btn btn-ghost\" onclick=\"jumpToFirstUnanswered(); closeInsufModal()\">&larr; Return to Assessment</button>\n        <button class=\"btn btn-primary\" onclick=\"forceGeneratePartialReport()\">Generate Partial Report with Warning &rarr;</button>\n      </div>\n    </div>\n  </div>\n</div>\n";

/* ---------- helpers & financial calculations ---------- */
function formatCurrency(n){
  if(!n || isNaN(n)) return '$0';
  if(n >= 1000000000) return '$' + (n / 1000000000).toFixed(1) + 'B';
  if(n >= 1000000) return '$' + (n / 1000000).toFixed(1) + 'M';
  if(n >= 1000) return '$' + Math.round(n / 1000) + 'K';
  return '$' + Math.round(n);
}

function calculateStatutoryPenalties(turnover, inScopeRegs, answers, findings){
  var EUR_TO_USD = 1.08;
  var tUSD = turnover || 250000000;
  var tEUR = tUSD / EUR_TO_USD;
  
  var fines = [];
  var maxSinglePenalty = 0;
  
  if(inScopeRegs.includes('gdpr') || inScopeRegs.includes('ukgdpr')){
    var capEUR = Math.max(20000000, tEUR * 0.04);
    var capUSD = Math.round(capEUR * EUR_TO_USD);
    var hasGap = findings.some(function(f){ return f.reg === 'gdpr' || f.reg === 'ukgdpr'; });
    var isCrit = findings.some(function(f){ return (f.reg === 'gdpr' || f.reg === 'ukgdpr') && f.severity === 'critical'; });
    fines.push({
      regId: 'gdpr',
      regName: 'GDPR / UK GDPR (Art. 83 Statutory Cap)',
      statuteBasis: 'Up to €20M / £17.5M or 4% worldwide annual turnover, whichever is higher (Chapter V transfers & processor duties).',
      capUSD: capUSD,
      capFormatted: formatCurrency(capUSD),
      status: hasGap ? (isCrit ? 'Critical Breach Exposure' : 'High Regulatory Exposure') : 'Defensible / Managed',
      statusColor: hasGap ? (isCrit ? 'var(--rag-red)' : '#E39A2E') : 'var(--rag-green)'
    });
    maxSinglePenalty = Math.max(maxSinglePenalty, capUSD);
  }

  if(inScopeRegs.includes('nis2')){
    var isEssential = answers['A1'] === 'essential';
    var rate = isEssential ? 0.02 : 0.014;
    var baseEUR = isEssential ? 10000000 : 7000000;
    var capEUR = Math.max(baseEUR, tEUR * rate);
    var capUSD = Math.round(capEUR * EUR_TO_USD);
    var hasGap = findings.some(function(f){ return f.reg === 'nis2'; });
    fines.push({
      regId: 'nis2',
      regName: isEssential ? 'NIS2 Directive (Essential Entity · Art. 34)' : 'NIS2 Directive (Important Entity · Art. 34)',
      statuteBasis: isEssential 
        ? 'Up to €10M or 2% worldwide annual turnover + direct management liability and operational bans.' 
        : 'Up to €7M or 1.4% worldwide annual turnover (ex-post supervisory enforcement).',
      capUSD: capUSD,
      capFormatted: formatCurrency(capUSD),
      status: hasGap ? 'Direct Enforcement Risk' : 'Baseline Met',
      statusColor: hasGap ? 'var(--rag-red)' : 'var(--rag-green)'
    });
    maxSinglePenalty = Math.max(maxSinglePenalty, capUSD);
  }

  if(inScopeRegs.includes('aiact') || inScopeRegs.includes('ukai')){
    var capEUR = Math.max(35000000, tEUR * 0.07);
    var capUSD = Math.round(capEUR * EUR_TO_USD);
    var hasGap = findings.some(function(f){ return f.reg === 'aiact'; });
    fines.push({
      regId: 'aiact',
      regName: 'EU AI Act (Art. 99 Statutory Ceiling)',
      statuteBasis: 'Up to €35M or 7% global turnover (prohibited practices) / €15M or 3% (Art. 10 training-data governance & provenance).',
      capUSD: capUSD,
      capFormatted: formatCurrency(capUSD),
      status: hasGap ? 'Severe Non-Compliance' : 'Governance Aligned',
      statusColor: hasGap ? 'var(--rag-red)' : 'var(--rag-green)'
    });
    maxSinglePenalty = Math.max(maxSinglePenalty, capUSD);
  }

  if(inScopeRegs.includes('dora')){
    var dailyUSD = tUSD / 365;
    var capUSD = Math.round(dailyUSD * 0.01 * 180);
    var hasGap = findings.some(function(f){ return f.reg === 'dora'; });
    fines.push({
      regId: 'dora',
      regName: 'DORA (Art. 35 Periodic Penalty Payments & CTPP Oversight)',
      statuteBasis: 'Daily periodic fines up to 1% avg. daily global turnover for up to 6 months + ESA public disclosure & sanctions.',
      capUSD: capUSD,
      capFormatted: formatCurrency(capUSD),
      status: hasGap ? 'Supervisory Sanction Exposure' : 'Compliant Architecture',
      statusColor: hasGap ? 'var(--rag-red)' : 'var(--rag-green)'
    });
    maxSinglePenalty = Math.max(maxSinglePenalty, capUSD);
  }

  if(!fines.length){
    var defaultCapUSD = Math.round(Math.max(20000000, tEUR * 0.04) * EUR_TO_USD);
    fines.push({
      regId: 'gdpr',
      regName: 'Statutory Compliance Baseline (GDPR Art. 83)',
      statuteBasis: 'Up to €20M or 4% global turnover baseline.',
      capUSD: defaultCapUSD,
      capFormatted: formatCurrency(defaultCapUSD),
      status: 'In Scope',
      statusColor: '#E39A2E'
    });
    maxSinglePenalty = defaultCapUSD;
  }

  var advisoryFeeEstimate = 185000;
  var riskHedgeRatio = ((advisoryFeeEstimate / (maxSinglePenalty || 1)) * 100).toFixed(2);

  return {
    turnover: tUSD,
    fines: fines,
    totalValueAtStake: maxSinglePenalty,
    advisoryFeeEstimate: advisoryFeeEstimate,
    riskHedgeRatio: riskHedgeRatio
  };
}

function evaluateQuestionScore(q, ans){
  if(ans === undefined || ans === null) return null;
  if(q.type === 'single'){
    var opt = (q.options || []).find(function(o){ return o.value === ans; });
    if(!opt) return null;
    if(opt.sev === 'positive') return 100;
    if(opt.sev === 'low') return 75;
    if(opt.sev === 'medium') return 50;
    if(opt.sev === 'high') return 25;
    if(opt.sev === 'critical') return 0;
    return 60;
  }
  if(q.type === 'scale'){
    var sOpt = (q.scale || []).find(function(s){ return s.v === ans; });
    if(!sOpt) return null;
    if(sOpt.sev === 'positive') return 100;
    if(sOpt.sev === 'low') return 75;
    if(sOpt.sev === 'medium') return 50;
    if(sOpt.sev === 'high') return 25;
    if(sOpt.sev === 'critical') return 0;
    return 60;
  }
  if(q.type === 'multi'){
    var arr = Array.isArray(ans) ? ans : [];
    if(!arr.length) return 80;
    var tFindings = [];
    (q.options || []).forEach(function(o){
      if(arr.includes(o.value) && o.findings){
        tFindings = tFindings.concat(o.findings);
      }
    });
    if(tFindings.some(function(f){ return f.severity === 'critical'; })) return 15;
    if(tFindings.some(function(f){ return f.severity === 'high'; })) return 35;
    if(tFindings.some(function(f){ return f.severity === 'medium'; })) return 60;
    if(tFindings.some(function(f){ return f.severity === 'low'; })) return 80;
    return 95;
  }
  if(q.type === 'matrix'){
    if(typeof ans !== 'object' || !ans) return null;
    var entries = Object.entries(ans);
    if(!entries.length) return null;
    var worst = 100;
    entries.forEach(function(pair){
      var k = pair[0] + ':' + pair[1];
      var f = q.cellFindings ? q.cellFindings[k] : null;
      if(f){
        if(f.severity === 'critical') worst = Math.min(worst, 10);
        else if(f.severity === 'high') worst = Math.min(worst, 30);
        else if(f.severity === 'medium') worst = Math.min(worst, 55);
        else if(f.severity === 'low') worst = Math.min(worst, 75);
      }
    });
    return worst;
  }
  return 70;
}

function computePillarScores(answers, activeQuestions){
  var pillars = PILLAR_CONFIG.map(function(p){
    var qList = activeQuestions.filter(function(q){ return p.sections.includes(q.section); });
    var total = 0;
    var scored = 0;
    qList.forEach(function(q){
      var s = evaluateQuestionScore(q, answers[q.id]);
      if(s !== null){
        total += s;
        scored++;
      }
    });
    var score = scored > 0 ? Math.round(total / scored) : 55;
    var status = 'Managed';
    var color = '#226882';
    var bg = '#EDF5F8';
    if(score >= 85){ status = 'Defensible'; color = 'var(--rag-green)'; bg = '#EDF7F1'; }
    else if(score >= 65){ status = 'Managed'; color = '#226882'; bg = '#EDF5F8'; }
    else if(score >= 40){ status = 'Exposed'; color = '#E39A2E'; bg = '#FFF9E6'; }
    else { status = 'Critical Risk'; color = 'var(--rag-red)'; bg = '#FFEBEE'; }

    return {
      id: p.id,
      num: p.num,
      name: p.name,
      desc: p.desc,
      weight: p.weight,
      score: score,
      status: status,
      color: color,
      bg: bg,
      qCount: qList.length,
      answeredCount: scored
    };
  });

  var weightedSum = 0;
  var weightSum = 0;
  pillars.forEach(function(p){
    weightedSum += p.score * p.weight;
    weightSum += p.weight;
  });
  var overall = Math.round(weightedSum / (weightSum || 1));
  var label = postureLabel(overall);

  return {
    pillars: pillars,
    overallScore: overall,
    label: label
  };
}

function questionApplies(q){
  if(STATE.mode === 'flash' && !FLASH_QUESTIONS.includes(q.id)) {
    return false;
  }
  if(!q.appliesTo) return true;
  const a=q.appliesTo;
  if(a.regulations && a.regulations.length){
    if(!a.regulations.some(r=>STATE.regulations.includes(r))) return false;
  }
  if(a.condition && typeof a.condition==='function'){
    if(!a.condition(STATE.answers)) return false;
  }
  return true;
}

  }).join('');

function updateNavDone(){
  document.querySelectorAll('.railitem, .snav').forEach((el,i)=>{
    const sec=STATE.activeSections[i];
    if(!sec) return;
    const qList=STATE.activeQuestions.filter(q=>q.section===sec.id);
    const answeredCount=qList.filter(q=>STATE.answers[q.id]!==undefined).length;
    const done=qList.length>0 && answeredCount===qList.length;
    const isActive=i===STATE.sectionIdx;
    el.classList.toggle('active', isActive);
    el.classList.toggle('done', done);
    const ck=el.querySelector('.railck');
    const cnt=el.querySelector('.rail-count');
    if(done){
      if(cnt) cnt.remove();
      if(!ck){
        const span=document.createElement('span');
        span.className='railck';
        span.textContent='✓';
        el.appendChild(span);
      }
    } else if(answeredCount>0){
      if(ck) ck.remove();
      if(!cnt){
        const span=document.createElement('span');
        span.className='rail-count';
        span.textContent=`${answeredCount}/${qList.length}`;
        el.appendChild(span);
      } else {
        cnt.textContent=`${answeredCount}/${qList.length}`;
      }
    } else {
      if(ck) ck.remove();
      if(cnt) cnt.remove();
    }
  });
}

/* ---------- findings engine ---------- */
function collectFindingsForQuestion(q){
  const ans=STATE.answers[q.id];
  const list=[];
  if(ans===undefined) return list;

  if(q.type==='single'){
    const opt=(q.options||[]).find(o=>o.value===ans);
    if(opt&&opt.findings) opt.findings.forEach(f=>list.push(Object.assign({qid:q.id}, f)));
  } else if(q.type==='scale'){
    const s=(q.scale||[]).find(x=>x.v===ans);
    if(s&&s.findings) s.findings.forEach(f=>list.push(Object.assign({qid:q.id}, f)));
  } else if(q.type==='multi'){
    const arr=Array.isArray(ans)?ans:[];
    arr.forEach(val=>{
      const opt=(q.options||[]).find(o=>o.value===val);
      if(opt&&opt.findings) opt.findings.forEach(f=>list.push(Object.assign({qid:q.id}, f)));
    });
  } else if(q.type==='matrix'){
    const cur=ans||{};
    Object.entries(cur).forEach(([row,col])=>{
      const key=`${row}:${col}`;
      if(q.cellFindings&&q.cellFindings[key]){
        const f=q.cellFindings[key];
        list.push(Object.assign({qid:q.id, row, col}, f));
      }
    });
  }
  return list;
}
function collectAllFindings(){
  let all=[];
  STATE.activeQuestions.forEach(q=>{ all=all.concat(collectFindingsForQuestion(q)); });
  return all.filter(f=>f.severity!=='positive');
}

/* ---------- RAG rollup ---------- */
function ragForRegulation(regId, findings){
  const rf=findings.filter(f=>f.reg===regId);
  const answered=STATE.activeQuestions.some(q=>{
    const refs=(q.refs||[]).some(r=>r.reg===regId) || (q.appliesTo&&(q.appliesTo.regulations||[]).includes(regId));
    return refs && STATE.answers[q.id]!==undefined;
  });
  if(rf.some(f=>f.severity==='critical'||f.severity==='high')) return {rag:'red', status:'Non-compliant', count:rf.length};
  if(rf.some(f=>f.severity==='medium')) return {rag:'amber', status:'Partial — action required', count:rf.length};
  if(answered) return {rag:'green', status:'No material gaps found', count:rf.length};
  return {rag:'grey', status:'Not answered — cannot assess', count:0};
}

/* ---------- posture score & labels ---------- */
function postureScore(findings){
  const w={critical:26,high:13,medium:5,low:1};
  let deduct=0; findings.forEach(f=>{ deduct+=w[f.severity]||0; });
  return Math.max(0, 100-deduct);
}
function postureLabel(s){
  if(s>=85) return {t:'Defensible', c:'var(--rag-green)', grade:'A'};
  if(s>=65) return {t:'Improving / Managed', c:'#226882', grade:'B'};
  if(s>=40) return {t:'Material Exposure', c:'#E39A2E', grade:'C'};
  return {t:'Critical Non-Compliance', c:'var(--rag-red)', grade:'D'};
}

/* ---------- business impact banding ---------- */
function businessImpactBand(){
  const cats=STATE.answers['B1'];
  const set=new Set(Array.isArray(cats)?cats:[]);
  if(set.has('special')||set.has('financial')||set.has('government')) return 3;
  if(set.has('pii')||set.has('behavioural')||set.has('aitraining')) return 2;
  return 1;
}

function heatmapBlock(findings){
  const grid={}; [1,2,3].forEach(b=>{ grid[b]={1:0,2:0,3:0,4:0}; });
  const bi=businessImpactBand();
  findings.forEach(f=>{ const reg=SEV_ORDER[f.severity]||1; grid[bi][reg]=(grid[bi][reg]||0)+1; });
  const cellColor=(bi,reg,n)=>{
    if(n===0) return 'background:var(--bg2);color:var(--ink3)';
    const risk=bi*reg;
    if(risk>=9) return 'background:#F3B6AE;color:#B21203';
    if(risk>=6) return 'background:#F8CFC7;color:#CC2B1C';
    if(risk>=3) return 'background:#F2DBB0;color:#8A5A12';
    return 'background:#E8E8E8;color:#5B5B5B';
  };
  const rows=[3,2,1].map((b,rowIdx)=>{
    const blab={3:'High',2:'Medium',1:'Low'}[b];
    return `<tr><th>${blab}</th>${[1,2,3,4].map((r,colIdx)=>{
      const n=grid[b][r];
      const delay=(rowIdx*4+colIdx)*0.07;
      return `<td><div class="heat-cell" style="${cellColor(b,r,n)};--cell-delay:${delay}s">${n||''}</div></td>`;
    }).join('')}</tr>`;
  }).join('');
  return `<div class="section-title"><span class="st-num">06</span><h2>Strategic Risk Heat Map</h2><span class="st-line"></span></div>
  <div class="card"><p style="font-size:13.5px;color:var(--ink3);margin-bottom:12px">Findings plotted by <b style="color:var(--ink2)">regulatory severity</b> (horizontal) against <b style="color:var(--ink2)">business impact</b> of the data involved (vertical). The upper-right concentration is where remediation delivers the most risk reduction.</p>

}

function roadmapBlock(findings){
  const byPhase={1:[],2:[],3:[]};
  findings.forEach(f=>{ if(byPhase[f.phase]) byPhase[f.phase].push(f); });
  const dedupe=arr=>{ const seen={}; return arr.filter(f=>{ if(seen[f.title]) return false; seen[f.title]=1; return true; }); };
  const horizonColors={1:{tag:'#FFE0DC',tagText:'#B21203',node:'#FF5E4F'},2:{tag:'#F5E6C9',tagText:'#8A5A12',node:'#E39A2E'},3:{tag:'#EDE7F3',tagText:'#482475',node:'#482475'}};
