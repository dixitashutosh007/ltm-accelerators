/* ES Klarheit Grotesk Local Fonts */

}


.brand-badge {
  background: linear-gradient(135deg, #FF5E4F 0%, #E54536 100%);

}

/* Mode Switcher Pill */
.mode-pill-toggle {
  display: inline-flex;
  background: var(--panel2);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px;
  gap: 3px;
}
.mode-pill {
  border: none;
  background: transparent;
  color: var(--ink3);
  font-family: var(--font-h);
  font-size: 11.5px;
  font-weight: 700;
  padding: 5px 12px;
  border-radius: 999px;
  cursor: pointer;
  transition: .15s ease;
}
.mode-pill:hover {
  color: var(--ink);
}
.mode-pill.active {
  background: var(--ltm-red);
  color: #fff;
  box-shadow: 0 1px 4px rgba(255,94,79,0.25);
}

/* Pre-Calibrated Archetypes Grid */
.grid4 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 14px;
}
.archetype-card {
  background: #FFFFFF;
  border: 1px solid var(--line);
  border-radius: var(--radius-s);
  padding: 16px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
}
.archetype-card:hover {
  border-color: #226882;
  box-shadow: 0 4px 14px rgba(34,104,130,0.12);
  transform: translateY(-2px);
}
.arch-badge {
  font-family: var(--font-m);
  font-size: 9.5px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .08em;
  background: #EDF5F8;
  color: #226882;
  border: 1px solid #C4DCE5;
  padding: 2px 7px;
  border-radius: 4px;
  display: inline-block;
  margin-bottom: 8px;
}
.arch-name {
  font-family: var(--font-h);
  font-size: 14px;
  font-weight: 700;
  color: var(--ink);
  line-height: 1.35;
  margin-bottom: 6px;
}
.arch-meta {
  font-size: 11.5px;
  color: var(--ink3);
  line-height: 1.45;

}
.arch-actions {
  display: flex;
  gap: 8px;
  padding-top: 12px;
  border-top: 1px solid var(--line);
}
.arch-actions .btn {
  flex: 1;
  justify-content: center;
  font-size: 11.5px;
  padding: 7px 10px;
}

/* Dynamic Contradiction Probe Callout Styles */
.probe-callout {
  background: linear-gradient(135deg, #FFFDF8 0%, #FFF4E5 100%);
  border: 1px solid #FF9800;
  border-left: 4px solid #F57C00;
  border-radius: var(--radius-s);
  padding: 14px 16px;
  margin-top: 14px;
  animation: fadeInProbe .3s ease;
}
@keyframes fadeInProbe {
  from { opacity: 0; transform: translateY(-4px); }
  to { opacity: 1; transform: translateY(0); }
}
.probe-callout-hd {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
}
.probe-callout-badge {
  background: #F57C00;
  color: #fff;
  font-family: var(--font-m);
  font-size: 9.5px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: .08em;
  padding: 2px 6px;
  border-radius: 3px;
}
.probe-callout-title {
  font-family: var(--font-h);
  font-size: 13.5px;
  font-weight: 700;
  color: #B26A00;
}
.probe-assertion {
  font-size: 12px;
  color: #5B5B5B;
  margin: 4px 0 6px;
  font-style: italic;
}
.probe-script-box {
  background: #FFFFFF;
  border: 1px dashed #FFA726;
  border-radius: 6px;
  padding: 10px 14px;
  margin: 8px 0;
  font-size: 12.5px;
  line-height: 1.55;
  color: #282828;
}
.probe-script-box b {
  color: #B26A00;
}
.probe-remedy-box {
  font-size: 11.5px;
  color: #35754D;
  margin-top: 6px;
}

/* Pillar Progress and Cards */
.pillar-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 14px;
  margin-top: 14px;
}
.pillar-card {
  background: #FFFFFF;
  border: 1px solid var(--line);
  border-radius: var(--radius-s);
  padding: 14px 16px;
  transition: transform .15s ease, border-color .15s ease;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.pillar-card:hover {
  border-color: #C6C6C6;
  transform: translateY(-1px);
}
.pillar-hd {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  margin-bottom: 4px;
}
.pillar-num {
  font-family: var(--font-m);
  font-size: 10px;
  font-weight: 700;
  color: var(--ink3);
  letter-spacing: .1em;
}
.pillar-score {
  font-family: var(--font-h);
  font-size: 20px;
  font-weight: 800;
  color: var(--ink);
}
.pillar-name {
  font-family: var(--font-h);
  font-size: 13px;
  font-weight: 700;
  color: var(--ink);
  line-height: 1.35;
  margin-bottom: 8px;
  min-height: 35px;
}
.pillar-bar-wrap {
  height: 6px;
  background: #EAEAEA;
  border-radius: 3px;
  overflow: hidden;
  margin-bottom: 8px;
}
.pillar-bar-fill {
  height: 100%;
  border-radius: 3px;
  transition: width .6s cubic-bezier(0.16,1,0.3,1);
}
.pillar-status {
  font-family: var(--font-m);
  font-size: 10.5px;
  font-weight: 700;
  display: inline-block;
  padding: 2px 6px;
  border-radius: 3px;
}

/* Statutory Fine Cards */
.stat-penalty-card {
  background: #FFFFFF;
  border: 1px solid #ECECEC;
  border-left: 4px solid var(--ltm-red);
  border-radius: var(--radius-s);
  padding: 12px 14px;
}
.stat-penalty-hd {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
}
.stat-penalty-name {
  font-family: var(--font-h);
  font-weight: 700;

}
.stat-penalty-cap {
  font-family: var(--font-h);
  font-weight: 800;
  font-size: 15px;
  color: #CC2B1C;
  white-space: nowrap;
}
.stat-penalty-basis {
  font-size: 11.5px;
  color: var(--ink3);
  margin-top: 4px;
  line-height: 1.4;
}

/* Handoff Banner */
#ltm-handoff-banner {
  background: #FFF9E6;
  border-bottom: 1px solid #FFE58F;
  color: #8A6500;

}
.ltm-hb-inner {

.ltm-hb-badge {

:root{
  --bg:#F8FAFC; --bg2:#F1F5F9; --panel:#FFFFFF; --panel2:#F8FAFC; --panel3:#E2E8F0;
  --line:#CBD5E1; --line2:#94A3B8; --ink:#0F172A; --ink2:#334155; --ink3:#64748B;
  --ltm-red:#FF5E4F; --ltm-darkred:#E54536; --ltm-navy:#00354F; --ltm-amber:#FF5E4F; --ltm-purple:#482475;
  --teal:#35754D; --teal2:#1B5B34;
  --rag-red:#E54536; --rag-amber:#E39A2E; --rag-green:#35754D; --rag-grey:#8E8E8E;
  --font-h:'ES Klarheit Grotesk','Klarheit Grotesk','Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; --font-b:'ES Klarheit Grotesk','Klarheit Grotesk','Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; --font-m:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace;
  --radius:8px; --radius-s:4px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body{ min-height:100vh; background:var(--bg); position:relative; overflow-x:hidden; }
h1,h2,h3,h4,h5{font-family:var(--font-h);font-weight:600;line-height:1.25;letter-spacing:-.01em}
.mono{font-family:var(--font-m)}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
a{color:var(--ltm-amber);text-decoration:none}

/* ---- top bar ---- */
.topbar{border-bottom:1px solid var(--line);background:rgba(255,255,255,.92);backdrop-filter:blur(8px);position:sticky;top:0;z-index:40}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;height:62px}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--ltm-red),var(--ltm-darkred));display:flex;align-items:center;justify-content:center;font-family:var(--font-h);font-weight:700;color:#fff;font-size:16px}
.brand .name{font-family:var(--font-h);font-weight:600;font-size:15px;letter-spacing:.01em}
.brand .sub{font-family:var(--font-m);font-size:11px;color:var(--ink3);letter-spacing:.08em;text-transform:uppercase}
.topbar-actions{display:flex;gap:8px;align-items:center}

/* ---- buttons ---- */
.btn{font-family:var(--font-b);font-weight:600;font-size:14px;padding:10px 18px;border-radius:var(--radius-s);border:1px solid var(--line2);background:var(--panel2);color:var(--ink);cursor:pointer;transition:.15s;display:inline-flex;align-items:center;gap:8px}
.btn:hover{border-color:var(--ltm-amber);background:var(--panel3)}
.btn-primary{background:var(--ltm-red);border-color:var(--ltm-red);color:#fff}
.btn-primary:hover{background:var(--ltm-darkred);border-color:var(--ltm-darkred)}
.btn-ghost{background:transparent;border-color:var(--line)}
.btn-sm{padding:7px 12px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* ---- screens ---- */
.screen{display:none;padding:36px 0 80px}
.screen.active{display:block}

/* ---- hero / intake ---- */
.eyebrow{font-family:var(--font-m);font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ltm-amber);margin-bottom:14px}
.hero h1{font-size:38px;margin-bottom:14px}
.hero p.lede{font-size:17px;color:var(--ink2);max-width:760px;margin-bottom:8px}
.model-thread{display:flex;gap:8px;align-items:center;margin:22px 0 30px;font-family:var(--font-m);font-size:12px;letter-spacing:.06em;color:var(--ink3);text-transform:uppercase}
.model-thread b{color:var(--ltm-amber);font-weight:500}
.model-thread span{color:var(--line2)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:24px}
.card + .card{margin-top:18px}
.card h3{font-size:18px;margin-bottom:4px}
.card .card-sub{color:var(--ink3);font-size:13px;margin-bottom:18px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
@media(max-width:820px){.grid2,.grid3{grid-template-columns:1fr}}

.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:6px}
.field .hint{font-size:12px;color:var(--ink3);font-weight:400;margin-top:4px}
input[type=text],input[type=email],input[type=number],select,textarea{
  width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius-s);
  color:var(--ink);font-family:var(--font-b);font-size:14px;padding:10px 12px;transition:.15s
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ltm-amber)}
textarea{resize:vertical;min-height:70px}

/* ---- feature strip ---- */
.feat-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:26px}
@media(max-width:820px){.feat-strip{grid-template-columns:1fr 1fr}}
.feat{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.feat .fnum{font-family:var(--font-m);font-size:11px;color:var(--ltm-amber);letter-spacing:.1em}
.feat h4{font-size:14px;margin:8px 0 4px}
.feat p{font-size:12.5px;color:var(--ink3);line-height:1.5}

/* ---- reg chips ---- */
.reg-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(max-width:820px){.reg-grid{grid-template-columns:1fr}}
.reg-chip{display:flex;gap:12px;align-items:flex-start;padding:14px;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--bg2);cursor:pointer;transition:.15s}
.reg-chip:hover{border-color:var(--line2)}
.reg-chip.on{border-color:var(--ltm-amber);background:var(--panel2)}
.reg-chip .rbox{width:20px;height:20px;border:1.5px solid var(--line2);border-radius:4px;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff}
.reg-chip.on .rbox{background:var(--ltm-amber);border-color:var(--ltm-amber);color:#fff}
.reg-chip .rname{font-weight:600;font-size:14px;font-family:var(--font-h)}
.reg-chip .rdesc{font-size:12px;color:var(--ink3);margin-top:2px}
.reg-chip .rtag{font-family:var(--font-m);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ltm-amber);margin-top:6px;display:inline-block}

/* ---- sector select ---- */
.sector-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:820px){.sector-grid{grid-template-columns:1fr 1fr}}
.sector{padding:14px;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--bg2);cursor:pointer;transition:.15s;text-align:left}
.sector:hover{border-color:var(--line2)}
.sector.on{border-color:var(--ltm-red);background:var(--panel2)}
.sector .sname{font-weight:600;font-size:13.5px}
.sector .stag{font-family:var(--font-m);font-size:10px;color:var(--ink3);margin-top:4px;letter-spacing:.04em}
.sector.on .stag{color:var(--ltm-amber)}

/* ---- Sovereign IQ Assessment Design System ---- */
.assess-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px;flex-wrap:wrap;gap:12px}
.assess-progress-card {
  background: #FFFFFF;
  border: 1.5px solid #CBD5E1;
  border-radius: 10px;
  padding: 14px 20px;
  margin: 12px 0 20px 0;
  box-shadow: 0 1px 3px rgba(15, 23, 42, 0.04);
}
.progress-meta-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: var(--font-m);
  font-size: 12px;
  font-weight: 700;
  margin-bottom: 8px;
}
.progress-label { color: #334155; }
.progress-val { color: #FF5E4F; font-weight: 800; }
.assess-progress-card .progress-track, .progress-track {
  height: 8px;
  background: #E2E8F0;
  border-radius: 4px;
  overflow: hidden;
  margin: 0;
}
.assess-progress-card .progress-fill, .progress-fill {
  height: 100%;
  background: linear-gradient(90deg, #FF5E4F 0%, #E54536 100%);
  border-radius: 4px;
  transition: width 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}

/* Sovereign Horizontal Section Rail */
.section-rail-wrap {
  margin: 14px 0 22px 0;
}
.rail, .section-nav {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 4px 2px 14px;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
}
.rail::-webkit-scrollbar, .section-nav::-webkit-scrollbar {
  height: 6px;
}
.rail::-webkit-scrollbar-thumb, .section-nav::-webkit-scrollbar-thumb {
  background: #CBD5E1;
  border-radius: 4px;
}
.railitem, .snav {
  background: #FFFFFF;
  border: 1.5px solid #CBD5E1;
  border-radius: 24px;
  padding: 8px 16px;
  font-family: var(--font-h);
  font-size: 13px;
  font-weight: 600;
  color: #475569;
  cursor: pointer;
  white-space: nowrap;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: all 0.15s ease;
  box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
}
.railitem:hover, .snav:hover {
  border-color: #FF5E4F;
  color: #FF5E4F;
  background: #FFF5F4;
}
.railitem.active, .snav.active {
  background: #1E2932 !important;
  border-color: #1E2932 !important;
  color: #FFFFFF !important;
  box-shadow: 0 3px 10px rgba(30, 41, 50, 0.25) !important;
}
.railitem.active .rail-sec-num, .snav.active .rail-sec-num {
  background: #FF5E4F;
  color: #FFFFFF;
}
.railitem.done, .snav.done {
  border-color: #10B981;
  color: #065F46;
  background: #F0FDF4;
}
.railitem.done .rail-sec-num, .snav.done .rail-sec-num {
  background: #DCFCE7;
  color: #166534;
}
.rail-sec-num {
  font-family: var(--font-m);
  font-size: 11px;
  font-weight: 800;
  padding: 2px 7px;
  border-radius: 4px;
  background: #F1F5F9;
  color: #334155;
  transition: all 0.15s ease;
}
.rail-sec-title {
  font-size: 12.5px;
  letter-spacing: .01em;
}
.railck {
  font-size: 12px;
  font-family: var(--font-m);
  font-weight: 800;
  color: #10B981;
}
.rail-count {
  font-size: 11px;
  font-family: var(--font-m);
  font-weight: 700;
  color: #64748B;
  background: #F1F5F9;
  padding: 1px 6px;
  border-radius: 4px;
}

/* Section Header Card */
.sec-card-header {
  background: linear-gradient(180deg, #FFFFFF 0%, #F8FAFC 100%);
  border: 1.5px solid #CBD5E1;
  border-radius: 12px;
  padding: 22px 26px;
  margin-bottom: 22px;
  box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
}
.sec-header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}
.sec-eyebrow {
  font-family: var(--font-m);
  font-size: 11.5px;
  font-weight: 800;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: #FF5E4F;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.sec-counter {
  font-family: var(--font-m);
  font-size: 12px;
  color: #64748B;
  font-weight: 600;
  background: #F1F5F9;
  padding: 4px 10px;
  border-radius: 6px;
  border: 1px solid #E2E8F0;
}
.sec-heading {
  font-family: var(--font-h);
  font-size: 23px;
  font-weight: 800;
  color: #0F172A;
  margin: 0 0 8px 0;
  line-height: 1.25;
}
.sec-lead {
  font-size: 14px;
  color: #475569;
  margin: 0;
  line-height: 1.55;
  max-width: 860px;
}

/* High-Contrast Sovereign IQ Question Card */
.q {
  background: #FFFFFF;
  border: 1.5px solid #CBD5E1;
  border-radius: 12px;
  padding: 24px 26px;
  margin-bottom: 20px;
  box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05), 0 6px 18px rgba(15, 23, 42, 0.03);
  transition: border-color 0.2s ease, box-shadow 0.2s ease;
}
.q:hover {
  border-color: #94A3B8;
  box-shadow: 0 3px 10px rgba(15, 23, 42, 0.08);
}
.q.flagged {
  border-left: 5px solid #EF4444;
}
.q-header-bar {
  display: flex;
  align-items: flex-start;
  gap: 14px;
  margin-bottom: 12px;
}
.q-id-badge {
  font-family: var(--font-m);
  font-size: 13px;
  font-weight: 800;
  color: #1E2932;
  background: #F1F5F9;
  border: 1.5px solid #CBD5E1;
  padding: 4px 10px;
  border-radius: 6px;
  flex-shrink: 0;
  letter-spacing: .02em;
}
.q-header-meta {
  flex: 1;
}
.q-text {
  font-family: var(--font-h);
  font-weight: 700;
  font-size: 17px;
  color: #0F172A;
  line-height: 1.4;
  margin-bottom: 6px;
}
.q-refs {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}
.ref-pill {
  font-family: var(--font-m);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .02em;
  padding: 3px 8px;
  border-radius: 4px;
  background: #EFF6FF;
  color: #1D4ED8;
  border: 1px solid #BFDBFE;
  display: inline-flex;
  align-items: center;
}
.flag-chip {
  font-family: var(--font-m);
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .06em;
  padding: 4px 10px;
  border-radius: 6px;
  background: #FEF2F2;
  color: #B91C1C;
  border: 1px solid #FCA5A5;
  white-space: nowrap;
  flex-shrink: 0;
}
.q-help-box {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  background: #F8FAFC;
  border-left: 3.5px solid #3B82F6;
  border-radius: 0 6px 6px 0;
  padding: 11px 15px;
  margin: 12px 0 16px 0;
  font-size: 13.5px;
  color: #334155;
  line-height: 1.5;
}
.q-help-icon {
  font-size: 14px;
  flex-shrink: 0;
  margin-top: 1px;
}

/* High-Contrast Question Options & A B C D Badges */
.opts-vert { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
.opts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
@media(max-width:720px){ .opts-grid { grid-template-columns: 1fr; } }

.opt {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 13px 18px;
  border: 2px solid #CBD5E1;
  border-radius: 8px;
  background: #FFFFFF;
  cursor: pointer;
  transition: all 0.15s ease;
  font-size: 14.5px;
  color: #0F172A;
  user-select: none;
  position: relative;
}
.opt:hover {
  border-color: #FF5E4F;
  background: #FFF5F4;
  transform: translateY(-1px);
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}
/* SELECTED STATE - HIGH CONTRAST & CLEAR VISIBILITY */
.opt.selected, .opt.on, .opt.sel {
  border-color: #FF5E4F !important;
  background: #FCF0EE !important;
  font-weight: 600;
  color: #000000;
  box-shadow: 0 0 0 1.5px #FF5E4F, 0 3px 12px rgba(255, 94, 79, 0.22) !important;
}

/* Option Letter Badges (A, B, C, D) */
.opt-badge {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  background: #F1F5F9;
  border: 1.5px solid #CBD5E1;
  color: #334155;
  font-weight: 800;
  font-size: 12.5px;
  font-family: var(--font-m);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.15s ease;
}
.opt:hover .opt-badge {
  border-color: #FF5E4F;
  color: #CC2B1C;
  background: #FFE8E5;
}
.opt.selected .opt-badge, .opt.on .opt-badge, .opt.sel .opt-badge {
  background: #FF5E4F !important;
  border-color: #FF5E4F !important;
  color: #FFFFFF !important;
  box-shadow: 0 2px 6px rgba(255, 94, 79, 0.35);
}

.opt-label {
  flex: 1;
  font-size: 14.5px;
  line-height: 1.45;
  color: #1E2932;
}
.opt.selected .opt-label, .opt.on .opt-label, .opt.sel .opt-label {
  color: #000000;
  font-weight: 700;
}

/* Right-Hand Mark (Radio/Check Indicator) */
.opt .mark {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  border: 2px solid #CBD5E1;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s ease;
  background: #FFFFFF;
}
.opt.multi .mark {
  border-radius: 5px;
}
.opt:hover .mark {
  border-color: #FF5E4F;
}
.opt.selected .mark, .opt.on .mark, .opt.sel .mark {
  border-color: #FF5E4F !important;
  background: #FF5E4F !important;
}
.opt.selected .mark::after, .opt.on .mark::after, .opt.sel .mark::after {
  content: '';
  display: block;
  width: 6px;
  height: 10px;
  border: solid #FFFFFF;
  border-width: 0 2.5px 2.5px 0;
  transform: rotate(45deg);
  margin-bottom: 2px;
}

.opt .osev {
  font-family: var(--font-m);
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 4px;
  align-self: center;
  flex-shrink: 0;
}

/* High-Contrast Scale Buttons */
.opts-horiz {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 14px;
}
.scale-btn {
  flex: 1;
  min-width: 80px;
  border: 2px solid #CBD5E1;
  background: #FFFFFF;
  border-radius: 8px;
  padding: 14px 12px;
  cursor: pointer;
  transition: all 0.15s ease;
  text-align: center;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.scale-btn:hover {
  border-color: #FF5E4F;
  background: #FFF5F4;
  transform: translateY(-1px);
}
.scale-btn.selected {
  border-color: #FF5E4F !important;
  background: #FCF0EE !important;
  box-shadow: 0 0 0 1.5px #FF5E4F, 0 3px 10px rgba(255, 94, 79, 0.2) !important;
}
.scale-btn b {
  font-size: 16px;
  font-weight: 800;
  color: #1E2932;
}
.scale-btn.selected b {
  color: #CC2B1C;
}
.scale-btn span {
  font-size: 11.5px;
  color: #64748B;
}
.scale-btn.selected span {
  color: #8A1308;
  font-weight: 600;
}

/* High-Contrast Matrix Table */
.matrix table {
  border-collapse: separate;
  border-spacing: 0;
  width: 100%;
  font-size: 13px;
  border: 2px solid #CBD5E1;
  border-radius: 8px;
  overflow: hidden;
}
.matrix th {
  background: #F1F5F9;
  color: #1E2932;
  font-weight: 700;
  padding: 10px 12px;
  border-bottom: 2px solid #CBD5E1;
  border-right: 1px solid #CBD5E1;
}
.matrix td {
  background: #FFFFFF;
  padding: 10px 8px;
  border-bottom: 1px solid #E2E8F0;
  border-right: 1px solid #E2E8F0;
  text-align: center;
}
.m-cell {
  width: 28px;
  height: 28px;
  border-radius: 6px;
  border: 2px solid #CBD5E1;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all 0.15s ease;
  font-weight: 800;
  font-size: 13px;
  background: #FFFFFF;
}
.m-cell:hover {
  border-color: #FF5E4F;
  background: #FFF5F4;
}
.m-cell.sel {
  border-color: #FF5E4F !important;
  background: #FF5E4F !important;
  color: #FFFFFF !important;
  box-shadow: 0 2px 6px rgba(255, 94, 79, 0.35);
}

.matrix{overflow-x:auto}
.matrix table{border-collapse:collapse;width:100%;font-size:12.5px}
.matrix th,.matrix td{border:1px solid var(--line);padding:8px 6px;text-align:center}
.matrix th{background:var(--panel2);font-family:var(--font-m);font-size:10.5px;letter-spacing:.03em;color:var(--ink2);font-weight:500}
.matrix td.rowlab{text-align:left;font-weight:600;background:var(--bg2);color:var(--ink2)}
.matrix input[type=radio]{accent-color:var(--ltm-amber);cursor:pointer}

.scale-row{display:flex;gap:6px;flex-wrap:wrap}
.scale-btn{flex:1;min-width:60px;padding:10px 6px;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--bg2);cursor:pointer;text-align:center;transition:.12s}
.scale-btn:hover{border-color:var(--line2)}
.scale-btn.on{border-color:var(--ltm-amber);background:var(--panel2);color:var(--ltm-amber)}
.scale-btn .sv{font-family:var(--font-m);font-size:16px;font-weight:600;display:block}
.scale-btn .sl{font-size:10.5px;color:var(--ink3);margin-top:2px}

.assess-foot{display:flex;justify-content:space-between;margin-top:22px;gap:12px}

/* ---- severity colors ---- */
.sev-critical{background:#F7D6D1;color:#B21203}
.sev-high{background:#FBE0DB;color:#CC2B1C}
.sev-medium{background:#F5E6C9;color:#8A5A12}
.sev-low{background:#ECECEC;color:#5B5B5B}
.sev-positive{background:#DCEAE0;color:#1B5B34}

/* ---- results ---- */
.result-hero{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:20px;margin-bottom:8px}
.score-ring{display:flex;gap:24px;align-items:center}
.big-score{font-family:var(--font-h);font-size:52px;font-weight:700;line-height:1}
.big-score small{font-size:20px;color:var(--ink3)}
.result-badges{display:flex;gap:10px;flex-wrap:wrap;margin:6px 0}

.rag-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:6px}
@media(max-width:820px){.rag-grid{grid-template-columns:1fr}}
.rag-card{border:1px solid var(--line);border-radius:var(--radius);padding:16px;background:var(--panel);border-top:3px solid var(--rag-grey)}
.rag-card.red{border-top-color:var(--rag-red)}
.rag-card.amber{border-top-color:var(--rag-amber)}
.rag-card.green{border-top-color:var(--rag-green)}
.rag-card.grey{border-top-color:var(--rag-grey)}
.rag-card .rag-reg{font-family:var(--font-h);font-weight:600;font-size:16px}
.rag-card .rag-status{font-family:var(--font-m);font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin:6px 0 8px}
.rag-card.red .rag-status{color:var(--rag-red)}
.rag-card.amber .rag-status{color:var(--rag-amber)}
.rag-card.green .rag-status{color:var(--rag-green)}
.rag-card.grey .rag-status{color:var(--rag-grey)}
.rag-card .rag-count{font-size:12.5px;color:var(--ink3)}

.heatmap{border-collapse:collapse;margin-top:10px}
.heatmap td,.heatmap th{border:1px solid var(--line);padding:0;text-align:center;font-size:12px}
.heatmap th{background:var(--panel2);font-family:var(--font-m);font-size:10px;color:var(--ink2);padding:6px 10px;letter-spacing:.04em}
.heat-cell{width:92px;height:56px;position:relative;font-family:var(--font-m);font-weight:600;font-size:18px}

.finding{border:1px solid var(--line);border-left-width:3px;border-radius:var(--radius-s);padding:16px 18px;margin-bottom:12px;background:var(--panel)}
.finding.critical{border-left-color:var(--rag-red)}
.finding.high{border-left-color:var(--ltm-darkred)}
.finding.medium{border-left-color:var(--rag-amber)}
.finding.low{border-left-color:var(--rag-grey)}
.finding .f-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:8px}
.finding .f-title{font-weight:600;font-size:15px}
.finding .f-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.finding .f-body{font-size:13.5px;color:var(--ink2);line-height:1.6}
.finding .f-remedy{font-size:13px;color:var(--ink2);margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);line-height:1.6}
.finding .f-remedy b{color:var(--ltm-amber);font-weight:600}

.phase{margin-bottom:22px}
.phase-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.phase-head .ph-badge{font-family:var(--font-m);font-size:11px;padding:4px 10px;border-radius:5px;letter-spacing:.06em;text-transform:uppercase}
.phase-1 .ph-badge{background:#FBE0DB;color:#CC2B1C}
.phase-2 .ph-badge{background:#F5E6C9;color:#8A5A12}
.phase-3 .ph-badge{background:#EDE7F3;color:#482475}
.phase-head h3{font-size:18px}
.phase-desc{font-size:13px;color:var(--ink3);margin-bottom:14px}
.action{border:1px solid var(--line);border-radius:var(--radius-s);padding:14px 16px;margin-bottom:10px;background:var(--panel)}
.action .a-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.action .a-title{font-weight:600;font-size:14px}
.action .a-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.a-tag{font-family:var(--font-m);font-size:10px;padding:2px 7px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);color:var(--ink2);letter-spacing:.03em}
.action .a-steps{margin-top:10px;font-size:12.5px;color:var(--ink3)}
.action .a-steps ul{margin:6px 0 0 18px}
.action .a-steps li{margin-bottom:3px}

.placeholder-block{border:1.5px dashed var(--line2);border-radius:var(--radius);padding:22px;background:repeating-linear-gradient(45deg,transparent,transparent 10px,rgba(40,40,40,.03) 10px,rgba(40,40,40,.03) 20px);text-align:center}
.placeholder-block .ph-label{font-family:var(--font-m);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ltm-amber);margin-bottom:8px}
.placeholder-block h4{font-size:16px;margin-bottom:6px}
.placeholder-block p{font-size:13px;color:var(--ink3);max-width:620px;margin:0 auto}

.section-title{display:flex;align-items:center;gap:12px;margin:34px 0 14px}
.section-title .st-line{flex:1;height:1px;background:var(--line)}
.section-title h2{font-size:20px;white-space:nowrap}
.section-title .st-num{font-family:var(--font-m);font-size:12px;color:var(--ltm-amber)}

.disclaimer{font-size:11.5px;color:var(--ink3);line-height:1.6;border:1px solid var(--line);border-radius:var(--radius-s);padding:14px 16px;background:var(--bg2);margin-top:20px}

/* ---- drawer (question bank mgmt) ---- */
.drawer-overlay{display:none;position:fixed;inset:0;background:rgba(4,10,17,.7);z-index:60;backdrop-filter:blur(3px)}
.drawer-overlay.open{display:block}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(520px,94vw);background:var(--bg2);border-left:1px solid var(--line2);z-index:61;transform:translateX(100%);transition:.25s;overflow-y:auto;padding:24px}
.drawer.open{transform:translateX(0)}
.drawer h3{font-size:18px;margin-bottom:4px}
.drawer .d-sub{color:var(--ink3);font-size:13px;margin-bottom:18px}
.drawer-close{position:absolute;top:18px;right:18px;background:none;border:none;color:var(--ink3);font-size:22px;cursor:pointer}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--panel3);border:1px solid var(--ltm-amber);color:var(--ink);padding:12px 20px;border-radius:8px;font-size:13.5px;z-index:80;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.hidden{display:none!important}

/* =================== PRINT / PDF =================== */
@media print{
  @page{size:A4;margin:16mm 14mm}
  html,body{background:#fff!important;color:#12222f!important;font-size:11px;background-image:none!important}
  .topbar,.section-nav,.rail,.section-rail-wrap,.assess-progress-card,.assess-foot,.assess-head .btn,.no-print,.drawer,.drawer-overlay,.toast,.snav,.railitem,.btn{display:none!important}
  .wrap{max-width:none;padding:0}
  .screen{display:none!important;padding:0}
  #screen-results.active,#print-root{display:block!important}
  .card,.finding,.action,.rag-card,.q{background:#fff!important;border-color:#c9d6e2!important;color:#12222f!important;break-inside:avoid}
  .print-page{page-break-after:always}
  .print-cover{page-break-after:always;padding-top:40mm}
  h1,h2,h3,h4,h5{color:#0a2540!important}
  .ink2,.ink3,.f-body,.f-remedy,.rag-count,.phase-desc,.a-steps{color:#3a5061!important}
  .ref-pill,.a-tag{background:#eef3f8!important;border-color:#c9d6e2!important;color:#3a5061!important}
  .placeholder-block{background:#f6f9fc!important;border-color:#9db4c8!important}
  a{color:#0a5cad!important}
  .heat-cell{border:1px solid #c9d6e2!important}
}
.print-only{display:none}
@media print{.print-only{display:block}}



/* =================== PHASE 4: CIO EXECUTIVE BANNER & GATING STYLES =================== */

/* Streamlined Intake Card */
.intake-card-clean {
  background: #FFFFFF;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 26px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.04);
}
.intake-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  flex-wrap: wrap;
  gap: 12px;
  padding-bottom: 16px;

}
.scope-accordion {
  border: 1px solid var(--line);
  border-radius: 8px;

}
.scope-acc-hd {

}
.scope-badge {

/* AI Anomaly Clarification Stage */
.clarify-header {

  <script>
    (function(){
      var splash = document.getElementById('ltm-splash');
      if (!splash) return;
      var bar = document.getElementById('splashBar');
      var status = document.getElementById('splashStatus');
      var pct = document.getElementById('splashPct');
      var skip = document.getElementById('splashSkip');
      var canvas = document.getElementById('splash-canvas');

      // 1. Ambient Particle Wave Canvas
      var ctx = canvas ? canvas.getContext('2d') : null;
      var particles = [];
      var w, h;
      function resize() {
        if (!canvas) return;
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      var animId;
      if (ctx) {
        for (var i = 0; i < 45; i++) {
          particles.push({
            x: Math.random() * (w || 800),
            y: Math.random() * (h || 600),
            radius: Math.random() * 2 + 0.8,
            speedX: Math.random() * 0.8 + 0.2,
            speedY: (Math.random() - 0.5) * 0.4,
            alpha: Math.random() * 0.6 + 0.2,
            color: Math.random() > 0.4 ? '#FF5E4F' : '#3C829B'
          });
        }
        function renderParticles() {
          ctx.clearRect(0, 0, w, h);
          for (var i = 0; i < particles.length; i++) {
            var p = particles[i];
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.alpha;
            ctx.shadowBlur = 8;
            ctx.shadowColor = p.color;
            ctx.fill();

            p.x += p.speedX;
            p.y += p.speedY;
            if (p.x > w) p.x = 0;
            if (p.y < 0) p.y = h;
            if (p.y > h) p.y = 0;
          }
          animId = requestAnimationFrame(renderParticles);
        }
        renderParticles();
      }

      // 2. Cinematic Statutory Loading Sequence
      var steps = [
        { p: 15, text: "Initializing Statutory Defensibility Engine (v2.1)..." },
        { p: 38, text: "Mounting DORA, NIS2, EU AI Act & UK Op Res frameworks..." },
        { p: 64, text: "Calibrating cross-border transfers & concentration risk matrix..." },
        { p: 88, text: "Synthesizing executive defensibility & penalty ceiling models..." },
        { p: 100, text: "Statutory Diagnostic Ready · Launching Posture IQ..." }
      ];

      var duration = 2400; // 2.4 seconds total
      var stepInterval = duration / steps.length;
      var isDismissed = false;

      function updateStep(idx) {
        if (isDismissed || !steps[idx]) return;
        var s = steps[idx];
        if (bar) bar.style.width = s.p + '%';
        if (pct) pct.textContent = (s.p < 10 ? '0' : '') + s.p + '%';
        if (status) {
          status.style.opacity = '0';
          setTimeout(function(){
            if (isDismissed) return;
            status.textContent = s.text;
            status.style.opacity = '1';
          }, 100);
        }
      }

      updateStep(0);
      var timers = [];
      for (var j = 1; j < steps.length; j++) {
        (function(idx){
          timers.push(setTimeout(function(){ updateStep(idx); }, idx * stepInterval));
        })(j);
      }

      function dismiss() {
        if (isDismissed) return;
        isDismissed = true;
        timers.forEach(clearTimeout);
        if (animId) cancelAnimationFrame(animId);
        window.removeEventListener('resize', resize);
        splash.classList.add('splash-out');
        try { sessionStorage.setItem('posture_iq_splash_seen', '1'); } catch(e){}
        setTimeout(function(){
          if (splash && splash.parentNode) splash.parentNode.removeChild(splash);
        }, 550);
      }

      // Auto dismiss after completion + slight pause
      setTimeout(dismiss, duration + 350);

      // Skip triggers
      if (skip) skip.addEventListener('click', dismiss);
      window.addEventListener('keydown', function(e){
        if (e.key === 'Escape') dismiss();
      }, { once: true });
    })();
  </script>

  });
}

function questionApplies(q){
  if(STATE.mode === 'flash' && !FLASH_QUESTIONS.includes(q.id)) {
    return false;
  }
  if(!q.appliesTo) return true;
  const a=q.appliesTo;
  if(a.regulations && a.regulations.length){
    if(!a.regulations.some(r=>STATE.regulations.includes(r))) return false;
  }
  if(a.condition && typeof a.condition==='function'){
    if(!a.condition(STATE.answers)) return false;
  }
  return true;
}

    inputHtml = `<div class="opts-vert">${q.options.map((o, idx)=>{
      const letter = letters[idx] || (idx+1);
      const isSel = ans === o.value;
      return `
      <div class="opt ${isSel ? 'selected' : ''}" onclick="answerSingle('${q.id}','${o.value}')" role="radio" aria-checked="${isSel}">
        <span class="opt-badge">${letter}</span>

        <div class="mark"></div>

    }).join('')}</div>`;
  } else if(q.type==='scale'){
    inputHtml = `<div class="opts-horiz">${q.scale.map(s=>`
      <div class="scale-btn ${ans===s.v?'selected':''}" onclick="answerScale('${q.id}',${s.v})">
        <b>${s.v}</b><span>${s.label}</span>
      </div>`).join('')}</div>`;
  } else if(q.type==='multi'){
    const sel=Array.isArray(ans)?ans:[];
    inputHtml = `<div class="opts-grid">${q.options.map((o, idx)=>{
      const letter = letters[idx] || (idx+1);
      const isSel = sel.includes(o.value);
      return `
      <div class="opt multi ${isSel ? 'selected' : ''}" onclick="answerMulti('${q.id}','${o.value}')" role="checkbox" aria-checked="${isSel}">

        <div class="mark"></div>
      </div>`;
    }).join('')}</div>`;
  } else if(q.type==='matrix'){
    const rows=q.rows||[]; const cols=q.cols||[];
    const cur=ans||{};
    inputHtml = `<div style="overflow-x:auto"><table class="matrix">
      <thead><tr><th>Data category</th>${cols.map(c=>`<th>${c.label}</th>`).join('')}</tr></thead>
      <tbody>${rows.map(r=>`<tr><th>${r.label}</th>${cols.map(c=>`
        <td><div class="m-cell ${cur[r.id]===c.id?'sel':''}" onclick="answerMatrix('${q.id}','${r.id}','${c.id}')">${cur[r.id]===c.id?'✓':''}</div></td>`).join('')}</tr>`).join('')}
      </tbody></table></div>`;
  }

  const flagged = isFlagged(q);
  const triggeredProbes = getTriggeredProbesForQuestion(q.id, STATE.answers, STATE);

        <div class="probe-callout-hd">

        <div class="probe-script-box">
          <b>Consultant Interrogation Script:</b><br>
          &ldquo;${p.interrogationScript}&rdquo;
        </div>

        </div>
      </div>`).join('');
  }

  return `<div class="q ${flagged?'flagged':''}" id="qbox-${q.id}">
    <div class="q-header-bar">

function isFlagged(q){
  const f=collectFindingsForQuestion(q);
  return f.some(x=>x.severity==='critical'||x.severity==='high');
}

function answerSingle(qid,val){ STATE.answers[qid]=val; softRerender(qid); }
function answerScale(qid,v){ STATE.answers[qid]=v; softRerender(qid); }
function answerMulti(qid,val){
  const cur=Array.isArray(STATE.answers[qid])?STATE.answers[qid]:[];
  if(cur.includes(val)) STATE.answers[qid]=cur.filter(x=>x!==val);
  else STATE.answers[qid]=[...cur, val];
  softRerender(qid);
}
function answerMatrix(qid,row,col){
  const cur=Object.assign({}, STATE.answers[qid]||{});
  cur[row]=col; STATE.answers[qid]=cur; softRerender(qid);
}

function updateProgress(){

  const pctEl=document.getElementById('progress-pct');

/* ---------- findings engine ---------- */
function collectFindingsForQuestion(q){
  const ans=STATE.answers[q.id];
  const list=[];
  if(ans===undefined) return list;

  if(q.type==='single'||q.type==='boolean'){
    const opt=(q.options||[]).find(o=>o.value===ans);
    if(opt&&opt.findings) opt.findings.forEach(f=>list.push(Object.assign({qid:q.id}, f)));
  } else if(q.type==='scale'){
    const s=(q.scale||[]).find(x=>x.v===ans);
    if(s&&s.findings) s.findings.forEach(f=>list.push(Object.assign({qid:q.id}, f)));
  } else if(q.type==='multi'){
    const arr=Array.isArray(ans)?ans:[];
    arr.forEach(val=>{
      const opt=(q.options||[]).find(o=>o.value===val);
      if(opt&&opt.findings) opt.findings.forEach(f=>list.push(Object.assign({qid:q.id}, f)));
    });
  } else if(q.type==='matrix'){
    const cur=ans||{};
    Object.entries(cur).forEach(([row,col])=>{
      const key=col; // cell findings are keyed by column; the row stays on the finding
      if(q.cellFindings&&q.cellFindings[key]){
        const f=q.cellFindings[key];
        list.push(Object.assign({qid:q.id, row, col}, f));
      }
    });
  }
  return list;
}

function ragForRegulation(regId, findings){
  const rf=findings.filter(f=>f.reg===regId);
  const answered=STATE.activeQuestions.some(q=>{
    const refs=(q.refs||[]).some(r=>r.reg===regId) || (q.appliesTo&&(q.appliesTo.regulations||[]).includes(regId));
    return refs && STATE.answers[q.id]!==undefined;
  });
  if(rf.some(f=>f.severity==='critical'||f.severity==='high')) return {rag:'red', status:'Non-compliant', count:rf.length};
  if(rf.some(f=>f.severity==='medium')) return {rag:'amber', status:'Partial — action required', count:rf.length};
  if(answered) return {rag:'green', status:'No material gaps found', count:rf.length};
  return {rag:'grey', status:'Not answered — cannot assess', count:0};
}

/* ---------- posture score & labels ---------- */
function postureLabel(s){
  if(s>=85) return {t:'Defensible', c:'var(--rag-green)', grade:'A'};
  if(s>=65) return {t:'Improving / Managed', c:'#226882', grade:'B'};
  if(s>=40) return {t:'Material Exposure', c:'#E39A2E', grade:'C'};
  return {t:'Critical Non-Compliance', c:'var(--rag-red)', grade:'D'};
}

/* ---------- business impact banding ---------- */
function businessImpactBand(){
  const cats=STATE.answers['B1'];
  const set=new Set(Array.isArray(cats)?cats:[]);
  if(set.has('special')||set.has('financial')||set.has('government')) return 3;
  if(set.has('pii')||set.has('behavioural')||set.has('aitraining')) return 2;
  return 1;
}

/* ---------- Cloud Scoring Engine Bridge (AWS Lambda ap-south-1) ---------- */
// Scoring runs on the Advisory API; LTM_API attaches the signed-in user's token.
const EVALUATE_API_PATH = "/api/evaluate/posture-iq";

// Returns the server's evaluation, or null (and shows an error). Never keeps a stale result.
async function fetchPostureIqEvaluation() {
  STATE.evaluation = null;
  hideScoringError();
  try {
    const payload = {
      answers: STATE.answers,
      // The engine needs only turnover; respondent details stay in the browser.
      org: { name: STATE.org.name || '', turnover: STATE.org.turnover },
      regulations: STATE.regulations,
      sectors: STATE.sectors,
      mode: STATE.mode
    };
    const res = await LTM_API.fetch(EVALUATE_API_PATH, {
      method: 'POST',
      body: JSON.stringify(payload)
    });
    const json = await res.json().catch(() => null);
    if (res.ok && json && json.ok && json.data) {
      STATE.evaluation = json.data;
      return STATE.evaluation;
    }
    console.error('[Posture IQ Cloud Eval] Error:', res.status, json);
  } catch (err) {
    console.error('[Posture IQ Cloud Eval] Connection failed:', err);
  }
  showScoringError();
  return null;
}

function toggleAINarrative(){
  if(!STATE.evaluation){ showScoringError(); return; }

  if(container){
    var findings = STATE.evaluation.findings.slice();
    var pillarData = STATE.evaluation.pillarScores;
    var penalties = STATE.evaluation.penalties;
    var counts = {critical:0,high:0,medium:0,low:0};
    findings.forEach(function(f){ counts[f.severity]=(counts[f.severity]||0)+1; });

function execSummary(findings,counts,score,penalties){
  const label=postureLabel(score);
  const topReg = STATE.regulations.map(r=>({r,x:ragForRegulation(r,findings)})).filter(o=>o.x.rag==='red');
  const critList=findings.filter(f=>f.severity==='critical').slice(0,4);
  const fineStr = penalties ? formatCurrency(penalties.totalValueAtStake) : '';
  
  let deterministicNarr;
  // Branch on the score band (the same bands as the label), not on raw finding counts.
  const gapStr = `${counts.critical} critical, ${counts.high} high and ${counts.medium} medium-severity findings`;
  const ceilingStr = penalties && penalties.totalValueAtStake > 0 ? `, against a largest single statutory ceiling of <b>${fineStr}</b>` : '';
  if(score<40){
    deterministicNarr=`${STATE.org.name} scores <b>${score}/100 (${label.t})</b>, with ${gapStr}${ceilingStr}. The current data-residency and extraterritorial transfer posture is <b>not defensible</b> against ${topReg.map(o=>regName(o.r)).join(', ')||'the assessed regulations'} and requires immediate Phase 1 containment.`;
  } else if(score<65){
    deterministicNarr=`${STATE.org.name} scores <b>${score}/100 (${label.t})</b>, with ${gapStr}${ceilingStr}. The posture is <b>materially exposed</b>; a prioritised 3-horizon programme, starting with the highest-severity items, is needed to reach a defensible baseline.`;
  } else if(score<85){
    deterministicNarr=`${STATE.org.name} scores <b>${score}/100 (${label.t})</b>, with ${gapStr}. The posture is <b>managed but not yet defensible</b>; closing the remaining gaps will satisfy supervisory audit expectations and reduce residual transfer risk.`;
  } else {
    deterministicNarr=`${STATE.org.name} scores <b>${score}/100 (${label.t})</b>${counts.critical+counts.high+counts.medium ? `, with ${gapStr} still to close` : ''}. Focus can shift to institutionalising governance, embedding Continuous Assurance, and pursuing sovereign accreditation as a commercial differentiator.`;
  }

  const hasAI = !!(STATE._aiSynthesis && STATE._aiSynthesis.narrative);
  const useAI = hasAI && !STATE._showBaselineNarrative;
  const activeNarr = useAI ? STATE._aiSynthesis.narrative : deterministicNarr;

  const modelTag = STATE._aiSynthesisModel || 'Frontier AI';
  const providerTag = (STATE._aiSynthesisProvider || 'BYOK').toUpperCase();

  const aiBadgeHtml = hasAI ? `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;background:#F0F7FA;border:1px solid #226882;padding:8px 14px;border-radius:6px;font-size:12px;flex-wrap:wrap;gap:8px">
      <div style="display:flex;align-items:center;gap:8px">
        <span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#35754D"></span>
        <b style="color:#00354F">${useAI ? '🤖 AI-Synthesized C-Suite Briefing · ' + providerTag + ' (' + modelTag + ')' : '⚙️ Rules Engine Baseline Narrative'}</b>
      </div>

        ${useAI ? 'View Rules Engine Baseline' : 'Switch to AI-Synthesized Briefing'} &rarr;
      </a>

  ` : '';

  return `<div id="exec-narrative-container">
    <div class="section-title"><span class="st-num">04</span><h2>Executive Summary &amp; Board Narrative</h2><span class="st-line"></span></div>

function heatmapBlock(findings){
  const grid={}; [1,2,3].forEach(b=>{ grid[b]={1:0,2:0,3:0,4:0}; });
  const bi=businessImpactBand();
  findings.forEach(f=>{ const reg=SEV_ORDER[f.severity]||1; grid[bi][reg]=(grid[bi][reg]||0)+1; });
  const cellColor=(bi,reg,n)=>{
    if(n===0) return 'background:var(--bg2);color:var(--ink3)';
    const risk=bi*reg;
    if(risk>=9) return 'background:#F3B6AE;color:#B21203';
    if(risk>=6) return 'background:#F8CFC7;color:#CC2B1C';
    if(risk>=3) return 'background:#F2DBB0;color:#8A5A12';
    return 'background:#E8E8E8;color:#5B5B5B';
  };
  const rows=[3,2,1].map((b,rowIdx)=>{
    const blab={3:'High',2:'Medium',1:'Low'}[b];
    return `<tr><th>${blab}</th>${[1,2,3,4].map((r,colIdx)=>{
      const n=grid[b][r];
      const delay=(rowIdx*4+colIdx)*0.07;
      return `<td><div class="heat-cell" style="${cellColor(b,r,n)};--cell-delay:${delay}s">${n||''}</div></td>`;
    }).join('')}</tr>`;
  }).join('');
  return `<div class="section-title"><span class="st-num">06</span><h2>Strategic Risk Heat Map</h2><span class="st-line"></span></div>
  <div class="card"><p style="font-size:13.5px;color:var(--ink3);margin-bottom:12px">Findings plotted by <b style="color:var(--ink2)">regulatory severity</b> (horizontal) against <b style="color:var(--ink2)">business impact</b> of the data involved (vertical). The upper-right concentration is where remediation delivers the most risk reduction.</p>

}

function roadmapBlock(findings){
  const byPhase={1:[],2:[],3:[]};
  findings.forEach(f=>{ if(byPhase[f.phase]) byPhase[f.phase].push(f); });
  const dedupe=arr=>{ const seen={}; return arr.filter(f=>{ if(seen[f.title]) return false; seen[f.title]=1; return true; }); };
  const horizonColors={1:{tag:'#FFE0DC',tagText:'#B21203',node:'#FF5E4F'},2:{tag:'#F5E6C9',tagText:'#8A5A12',node:'#E39A2E'},3:{tag:'#EDE7F3',tagText:'#482475',node:'#482475'}};
  const hasAIStrategy = !!(STATE._aiSynthesis && STATE._aiSynthesis.horizonStrategy && (STATE._aiSynthesis.horizonStrategy.h1 || STATE._aiSynthesis.horizonStrategy.h2));
  const aiStrategyHtml = hasAIStrategy ? `

  let html=`<div class="section-title"><span class="st-num">08</span><h2>Prioritized Remediation Roadmap</h2><span class="st-line"></span></div>
  <div class="card" style="margin-bottom:18px">

  </div>
  <div class="roadmap-timeline">`;
  [1,2,3].forEach(p=>{
    const items=dedupe(byPhase[p]);
    const m=PHASE_META[p];
    const hc=horizonColors[p];
    html+=`<div class="rt-phase">

    if(!items.length){ html+=`<div class="action"><div class="a-title" style="color:var(--ink3)">No actions in this phase.</div></div>`; }
    items.forEach(f=>{
      html+=`<div class="action">
        <div class="a-head"><div class="a-title">${f.title.replace(/^([A-Za-z].*?) (located|replicated|stored|located in|is unknown)/,'$1')}</div><span class="osev sev-${f.severity}">${SEV_LABEL[f.severity]}</span></div>
        <div class="a-tags"><span class="a-tag">${regName(f.reg)} · ${f.a}</span><span class="a-tag">Source: ${f.qid}</span></div>
        <div class="f-remedy" style="border-top:none;padding-top:8px"><b>Strategic move:</b> ${f.remedy}</div>

      </div>`;
    });
    html+=`</div></div>`;
  });
  html+=`</div>`;
  return html;
}

function download(name,content,type){
  const blob=new Blob([content],{type:type||'application/json'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=name; a.click(); URL.revokeObjectURL(url);
}

function importBankJSON(ev){

  md += "- **Contradiction Probes Triggered:** **" + probes.length + " substantive architectural contradictions** detected between operational claims and technical controls.\n";
  md += "- **Statutory Findings Count:** " + findings.filter(function(f){ return f.severity==='critical'; }).length + " Critical, " + findings.filter(function(f){ return f.severity==='high'; }).length + " High severity compliance gaps.\n\n";

  md += "### 2. Engagement Objectives\n\n";
  md += "1. **Mitigate Statutory Downside Risk:** Systematically eliminate high-severity statutory non-compliance exposure before regulatory enforcement audits.\n";
  md += "2. **Resolve Architectural Contradictions:** Implement technical mitigations for all " + probes.length + " triggered facilitator probes (Residency Illusion, SaaS Blindspots, DORA Exit Strategy).\n";

function checkAnswerThreshold() {

  var answered = STATE.activeQuestions.filter(function(q){ return STATE.answers[q.id] !== undefined; }).length;
  var pct = total > 0 ? (answered / total) : 0;
  if (pct < 0.60) {
    var statsMount = document.getElementById('insuf-stats-mount');
    if (statsMount) {
      statsMount.innerHTML =
        '<div class="insuf-stat"><div class="insuf-stat-num" style="color:var(--ltm-red)">' + answered + '</div><div class="insuf-stat-label">Answered</div></div>' +
        '<div class="insuf-stat"><div class="insuf-stat-num">' + total + '</div><div class="insuf-stat-label">Total Questions</div></div>' +
        '<div class="insuf-stat"><div class="insuf-stat-num" style="color:#E39A2E">' + Math.round(pct*100) + '%</div><div class="insuf-stat-label">Completion Rate</div></div>';
    }
    var listMount = document.getElementById('insuf-section-list-mount');
    if (listMount) {
      listMount.innerHTML = STATE.activeSections.map(function(sec) {
        var qList = STATE.activeQuestions.filter(function(q){ return q.section === sec.id; });
        var secAns = qList.filter(function(q){ return STATE.answers[q.id] !== undefined; }).length;
        var sp = qList.length > 0 ? secAns / qList.length : 0;
        var badge = sp >= 1 ? '<span class="insuf-badge complete">Complete</span>' :
                    sp > 0  ? '<span class="insuf-badge partial">' + secAns + ' / ' + qList.length + '</span>' :
                               '<span class="insuf-badge empty">Not started</span>';
        return '<li><span>' + sec.title + '</span>' + badge + '</li>';
      }).join('');
    }
    var m = document.getElementById('insufficientDataModal');
    if (m) m.classList.add('open');
    return false;
  }
  STATE._lowConfidence = (pct < 0.80);
  return true;
}

function showReportGenerationAnimation(callback) {
  var overlay = document.createElement('div');
  overlay.className = 'report-gen-overlay';

  var steps = [

    '</ul>' +
    '<div class="rg-progress-track"><div class="rg-progress-fill" id="rg-pf"></div></div>';
  document.body.appendChild(overlay);

  var totalDuration = 3800;
  var stepDuration = totalDuration / steps.length;
  var pf = overlay.querySelector('#rg-pf');

  function activateStep(idx) {
    if (idx > 0) {
      var prev=overlay.querySelector('#rg-step-'+(idx-1));
      if(prev){ prev.classList.remove('active'); prev.classList.add('done'); prev.querySelector('.rg-step-icon').textContent='✓'; }
    }
    var cur=overlay.querySelector('#rg-step-'+idx);
    if(cur) cur.classList.add('active');
    if(pf) pf.style.width = ((idx+1)/steps.length*100)+'%';
  }

  activateStep(0);
  for (var i=1; i<steps.length; i++) {
    (function(si){ setTimeout(function(){ activateStep(si); }, si*stepDuration); })(i);
  }
  setTimeout(function(){
    var last=overlay.querySelector('#rg-step-'+(steps.length-1));
    if(last){ last.classList.remove('active'); last.classList.add('done'); last.querySelector('.rg-step-icon').textContent='✓'; }
    if(pf) pf.style.width='100%';
    setTimeout(function(){
      overlay.classList.add('fade-out');
      setTimeout(function(){ if(overlay.parentNode) overlay.parentNode.removeChild(overlay); callback(); }, 500);
    }, 400);
  }, totalDuration);
}

/* ---------- Kavach-style Animated KPI Counters ---------- */
function animateCountUp(el, target, duration, prefix, suffix) {
  prefix = prefix||''; suffix = suffix||'';
  var startTs = null;
  function step(ts) {
    if (!startTs) startTs = ts;
    var progress = Math.min((ts - startTs) / duration, 1);
    var ease = 1 - Math.pow(1 - progress, 3);
    var cur = Math.floor(ease * target);
    el.textContent = prefix + cur.toLocaleString() + suffix;
    if (progress < 1) requestAnimationFrame(step);
    else el.textContent = prefix + target.toLocaleString() + suffix;
  }
  requestAnimationFrame(step);
}
function initKPICounters() {
  var bar = document.getElementById('kpi-counter-bar');
  if (!bar) return;
  var counters = bar.querySelectorAll('[data-kpi-target]');
  if (!counters.length) return;
  var trigger = function(el) {
    var target = parseFloat(el.getAttribute('data-kpi-target'))||0;
    var prefix = el.getAttribute('data-kpi-prefix')||'';
    var suffix = el.getAttribute('data-kpi-suffix')||'';
    var delay = parseInt(el.getAttribute('data-kpi-delay'))||0;
    setTimeout(function(){ animateCountUp(el, target, 1600, prefix, suffix); }, delay);
  };
  if ('IntersectionObserver' in window) {
    var obs = new IntersectionObserver(function(entries, o) {
      entries.forEach(function(e){ if(e.isIntersecting){ trigger(e.target); o.unobserve(e.target); } });
    }, { threshold: 0.3 });
    counters.forEach(function(c){ obs.observe(c); });
  } else {
    counters.forEach(function(c){ trigger(c); });
  }
}

<script id="ltm-handoff-script">
(function(){
  try {
    var params = new URLSearchParams(location.search);
    var from = params.get('from');
    if (from !== 'cloud-iq') return;
    var industry = params.get('industry') || '';
    var spend = params.get('spend') || '';
    var waste = params.get('waste') || '';
    var sov = params.get('sov') || '';
    var frameworks = params.get('frameworks') || '';
    var v = params.get('v') || '';

    var bits = [];
    if (industry) bits.push('<b>' + industry + '</b>');
    if (spend) bits.push('annual spend <b>' + spend + '</b>');
    if (waste) bits.push('~<b>' + waste + '%</b> waste');
    if (frameworks) bits.push('flagged frameworks <b>' + frameworks.toUpperCase() + '</b>');
    else if (sov === '1') bits.push('<b>sovereignty flag</b>');
    var suffix = bits.length ? (' with ' + bits.join(' &middot; ')) : '';

    try {
      window.CLOUD_IQ_TELEMETRY = window.CLOUD_IQ_TELEMETRY || {events:[]};
      var evt = {type:'handoff_received', from:from, v:v, industry:industry, spend:spend, waste:waste, sov:sov, frameworks:frameworks, ts:Date.now()};
      window.CLOUD_IQ_TELEMETRY.events.push(evt);
      window.dispatchEvent(new CustomEvent('cloudiq:event', {detail: evt}));
    } catch(e){}

    window.LTM_HANDOFF = {from:from, industry:industry, spend:spend, waste:waste, sov:sov, frameworks:frameworks, v:v};

    // ---- Posture-IQ-specific hydration ----
    if (typeof window.toggleSector === 'function') {
      var sectorMap = {
        "BFSI":"finserv", "Public Sector":"public", "Healthcare":"health",
        "Retail / CPG":"retail", "Manufacturing":"manuf", "Telco / Media":"telecom"
      };
      var fwMap = { dora:"dora", gdpr:"gdpr" };

      var targetSector = sectorMap[industry] || null;
      var targetRegs = (frameworks || "").toLowerCase().split(",").map(function(s){return s.trim();}).filter(Boolean)
        .map(function(k){ return fwMap[k]; }).filter(Boolean);

      if (targetSector || targetRegs.length) {
        var attempts = 0;
        var hydrate = function(){
          attempts++;
          var hydrated = false;
          try {
            if (targetSector && window.STATE && Array.isArray(window.STATE.sectors)) {
              if (!window.STATE.sectors.includes(targetSector)) {
                var chip = document.querySelector('.sector[data-id="' + targetSector + '"]');
                if (chip) { window.toggleSector(targetSector); hydrated = true; }
              }
            }
            if (targetRegs.length && window.STATE && Array.isArray(window.STATE.regulations)) {
              targetRegs.forEach(function(r){
                if (!window.STATE.regulations.includes(r)) {
                  var rchip = document.querySelector('.reg-chip[data-id="' + r + '"]');
                  if (rchip) { window.toggleReg(r); hydrated = true; }
                }
              });
            }
          } catch(err){}
          if (!hydrated && attempts < 60) setTimeout(hydrate, 250);   // retry ~15s
        };
        setTimeout(hydrate, 400);
      }
    }

    function mount(){
      if (document.getElementById('ltm-handoff-banner')) return;
      var banner = document.createElement('div');
      banner.id = 'ltm-handoff-banner';
      banner.setAttribute('role', 'status');
      banner.innerHTML = '<div class="ltm-hb-inner">' +
        '<span class="ltm-hb-badge">Arrived from Cloud IQ</span>' +
        '<span class="ltm-hb-msg">Your Cloud IQ diagnostic routed here' + suffix + '. The result will land in that context.</span>' +
        '<button class="ltm-hb-close" onclick="this.parentElement.parentElement.remove()">Dismiss</button>' +
        '</div>';
      var nav = document.getElementById('ltm-family-nav');
      if (nav && nav.parentNode) nav.parentNode.insertBefore(banner, nav.nextSibling);
      else if (document.body) document.body.insertBefore(banner, document.body.firstChild);
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', mount);
    } else {
      mount();
    }
  } catch(e) { /* fail silent */ }
})();
