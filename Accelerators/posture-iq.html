        <div class="ai-horizon-item"><b>H3 (DAYS 180+): ASSURANCE</b>${STATE._aiSynthesis.horizonStrategy.h3 || 'Operationalize automated continuous posture drift drills.'}</div>
      </div>
    </div>
  ` : '';

  let html=`<div class="section-title"><span class="st-num">08</span><h2>Prioritized Remediation Roadmap</h2><span class="st-line"></span></div>
  <div class="card" style="margin-bottom:18px">
    ${aiStrategyHtml}
    <p style="font-size:13.5px;color:var(--ink2)">The roadmap sequences every finding into three strategic horizons. Each action states the <b style="color:var(--ltm-amber)">strategic move</b> (the comprehensive remediation) and the <b style="color:var(--ltm-amber)">granular steps</b> to deliver it.</p>
  </div>
  <div class="roadmap-timeline">`;
  [1,2,3].forEach(p=>{
    const items=dedupe(byPhase[p]);
    const m=PHASE_META[p];
    const hc=horizonColors[p];
    html+=`<div class="rt-phase">
      <div class="rt-node">H${p}</div>
      <div class="rt-phase-card">
        <span class="rt-horizon-tag" style="background:${hc.tag};color:${hc.tagText}">${m.horizon}</span>
        <h3 style="font-size:17px;margin-bottom:4px">${m.name}</h3>
        <p class="phase-desc" style="margin-bottom:12px">${m.desc}</p>`;
    if(!items.length){ html+=`<div class="action"><div class="a-title" style="color:var(--ink3)">No actions in this phase.</div></div>`; }
    items.forEach(f=>{
      html+=`<div class="action">
        <div class="a-head"><div class="a-title">${f.title.replace(/^([A-Za-z].*?) (located|replicated|stored|located in|is unknown)/,'$1')}</div><span class="osev sev-${f.severity}">${SEV_LABEL[f.severity]}</span></div>
        <div class="a-tags"><span class="a-tag">${regName(f.reg)} · ${f.a}</span><span class="a-tag">Source: ${f.qid}</span></div>
        <div class="f-remedy" style="border-top:none;padding-top:8px"><b>Strategic move:</b> ${f.remedy}</div>
        ${f.steps&&f.steps.length?`<div class="a-steps"><b style="color:var(--ink2)">Granular steps:</b><ul>${f.steps.map(s=>`<li>${s}</li>`).join('')}</ul></div>`:''}
      </div>`;
    });
    html+=`</div></div>`;
  });
  html+=`</div>`;
  return html;
}

function download(name,content,type){
  const blob=new Blob([content],{type:type||'application/json'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=name; a.click(); URL.revokeObjectURL(url);

// Helper to parse JSON from AI responses (handles code fences and raw text)
function parseAIResponse(raw) {

  }

async function executeAICall(cfg, prompt, systemInstruction, timeoutMs){
  timeoutMs = timeoutMs || 10000;
  var controller = new AbortController();
  var timer = setTimeout(function(){ controller.abort(); }, timeoutMs);

  try {
    if(cfg.provider === 'gemini'){
    var url = 'https://generativelanguage.googleapis.com/v1beta/models/' + (cfg.model || 'gemini-2.0-flash') + ':generateContent?key=' + encodeURIComponent(cfg.key);
    var payload = {
      contents: [{ role: 'user', parts: [{ text: prompt }] }]
    };
    if(systemInstruction) payload.systemInstruction = { parts: [{ text: systemInstruction }] };
    var resp = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
      signal: controller.signal
    });
    clearTimeout(timer);
    if(!resp.ok){
      var errData = await resp.json().catch(function(){ return {}; });
      throw new Error((errData.error && errData.error.message) || ('Gemini HTTP error ' + resp.status));
    }
    var data = await resp.json();
    return data.candidates[0].content.parts[0].text;
  }
  else if(cfg.provider === 'claude'){
    var url = 'https://api.anthropic.com/v1/messages';
    var payload = {
      model: cfg.model || 'claude-3-5-sonnet-20241022',
      max_tokens: 1200,
      messages: [{ role: 'user', content: prompt }]
    };
    if(systemInstruction) payload.system = systemInstruction;
    var resp = await fetch(url, {
      method: 'POST',
      headers: {
        'x-api-key': cfg.key,
        'anthropic-version': '2023-06-01',
        'content-type': 'application/json',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify(payload),
      signal: controller.signal
    });
    clearTimeout(timer);
    if(!resp.ok){
      var errData = await resp.json().catch(function(){ return {}; });
      throw new Error((errData.error && errData.error.message) || ('Claude HTTP error ' + resp.status));
    }
    var data = await resp.json();
    return data.content[0].text;
  }
  else if(cfg.provider === 'openai'){
    var url = 'https://api.openai.com/v1/chat/completions';
    var messages = [];
    if(systemInstruction) messages.push({ role: 'system', content: systemInstruction });
    messages.push({ role: 'user', content: prompt });
    var resp = await fetch(url, {
      method: 'POST',
      headers: {
        'Authorization': 'Bearer ' + cfg.key,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ model: cfg.model || 'gpt-4o', messages: messages }),
      signal: controller.signal
    });
    clearTimeout(timer);
    if(!resp.ok){
      var errData = await resp.json().catch(function(){ return {}; });
      throw new Error((errData.error && errData.error.message) || ('OpenAI HTTP error ' + resp.status));
    }
    var data = await resp.json();
    return data.choices[0].message.content;
  }
  } catch(err){
    clearTimeout(timer);
    throw err;
  }
}

/* ---------- Kavach-style Animated KPI Counters ---------- */
function animateCountUp(el, target, duration, prefix, suffix) {
  prefix = prefix||''; suffix = suffix||'';
  var startTs = null;
  function step(ts) {
    if (!startTs) startTs = ts;
    var progress = Math.min((ts - startTs) / duration, 1);
    var ease = 1 - Math.pow(1 - progress, 3);
    var cur = Math.floor(ease * target);
    el.textContent = prefix + cur.toLocaleString() + suffix;
    if (progress < 1) requestAnimationFrame(step);
    else el.textContent = prefix + target.toLocaleString() + suffix;
  }
  requestAnimationFrame(step);
}
function initKPICounters() {
  var bar = document.getElementById('kpi-counter-bar');
  if (!bar) return;
  var counters = bar.querySelectorAll('[data-kpi-target]');
  if (!counters.length) return;
  var trigger = function(el) {
    var target = parseFloat(el.getAttribute('data-kpi-target'))||0;
    var prefix = el.getAttribute('data-kpi-prefix')||'';
    var suffix = el.getAttribute('data-kpi-suffix')||'';
    var delay = parseInt(el.getAttribute('data-kpi-delay'))||0;
    setTimeout(function(){ animateCountUp(el, target, 1600, prefix, suffix); }, delay);
  };
  if ('IntersectionObserver' in window) {
    var obs = new IntersectionObserver(function(entries, o) {
      entries.forEach(function(e){ if(e.isIntersecting){ trigger(e.target); o.unobserve(e.target); } });
    }, { threshold: 0.3 });
    counters.forEach(function(c){ obs.observe(c); });
  } else {
    counters.forEach(function(c){ trigger(c); });
  }
}

    data: { labels: labels, datasets: [
      { label: 'Your Posture', data: scores, backgroundColor: 'rgba(255,94,79,0.18)', borderColor: 'rgba(255,94,79,0.9)', borderWidth: 2.5, pointBackgroundColor: '#FF5E4F', pointRadius: 5, pointHoverRadius: 7 },
      { label: 'Defensible Baseline (80)', data: pillarData.pillars.map(function(){ return 80; }), backgroundColor: 'rgba(53,117,77,0.08)', borderColor: 'rgba(53,117,77,0.5)', borderWidth: 1.5, borderDash: [5,4], pointRadius: 0 }
    ]},
    options: {
      responsive: true, maintainAspectRatio: true,
      animation: { duration: 1000, easing: 'easeOutQuart' },
      scales: { r: { min: 0, max: 100, ticks: { stepSize: 20, font: { size: 10 }, color: '#8E8E8E' }, grid: { color: 'rgba(0,0,0,0.07)' }, pointLabels: { font: { size: 11, weight: '600' }, color: '#313131' } } },
      plugins: { legend: { position: 'bottom', labels: { font: { size: 11 }, padding: 14, boxWidth: 12 } }, tooltip: { backgroundColor: '#1E2932' } }
    }
  });
}

function renderDefensibilityDoughnut(score, labelColor) {
  var canvas = document.getElementById('defensibility-doughnut');
  if (!canvas || typeof Chart === 'undefined') return;
  destroyChart('doughnut');
  labelColor = labelColor || '#FF5E4F';
  var centerPlugin = { id: 'ct', afterDraw: function(c) {
    var ctx=c.ctx, cx=c.chartArea.left+(c.chartArea.right-c.chartArea.left)/2, cy=c.chartArea.top+(c.chartArea.bottom-c.chartArea.top)/2;
    ctx.save(); ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.font='bold 30px "Plus Jakarta Sans",sans-serif'; ctx.fillStyle=labelColor; ctx.fillText(score,cx,cy-10);
    ctx.font='11px "JetBrains Mono",monospace'; ctx.fillStyle='#8E8E8E'; ctx.fillText('/ 100',cx,cy+14);
    ctx.restore();
  }};
  _chartInstances['doughnut'] = new Chart(canvas, {
    type: 'doughnut', plugins: [centerPlugin],
    data: { datasets: [{ data: [score, 100-score], backgroundColor: [labelColor, 'rgba(0,0,0,0.06)'], borderWidth: 0 }] },
    options: { responsive: true, maintainAspectRatio: true, cutout: '72%', animation: { animateRotate: true, duration: 1200 }, plugins: { legend: { display: false }, tooltip: { enabled: false } } }
  });
}

function renderSeverityBar(counts) {
  var canvas = document.getElementById('severity-bar-chart');
  if (!canvas || typeof Chart === 'undefined') return;
  destroyChart('sevbar');
  var total = (counts.critical||0)+(counts.high||0)+(counts.medium||0)+(counts.low||0);
  if (!total) { canvas.parentNode.style.display='none'; return; }
  _chartInstances['sevbar'] = new Chart(canvas, {
    type: 'bar',
    data: { labels: ['Severity'], datasets: [
      { label: 'Critical', data: [counts.critical||0], backgroundColor: '#B21203', borderRadius: 3 },
      { label: 'High',     data: [counts.high||0],     backgroundColor: '#E54536', borderRadius: 3 },
      { label: 'Medium',   data: [counts.medium||0],   backgroundColor: '#E39A2E', borderRadius: 3 },
      { label: 'Low',      data: [counts.low||0],      backgroundColor: '#ACACAC', borderRadius: 3 }
    ]},
    options: {
      indexAxis: 'y', responsive: true, maintainAspectRatio: false,
      animation: { duration: 900 },
      scales: { x: { stacked: true, grid: { display: false }, ticks: { font: { size: 10 }, precision: 0 } }, y: { stacked: true, display: false } },
      plugins: { legend: { position: 'bottom', labels: { font: { size: 11 }, padding: 10, boxWidth: 10 } }, tooltip: { backgroundColor: '#1E2932' } }
    }
  });
}

<script id="ltm-handoff-script">
(function(){
  try {
    var params = new URLSearchParams(location.search);
    var from = params.get('from');
    if (from !== 'cloud-iq') return;
    var industry = params.get('industry') || '';
    var spend = params.get('spend') || '';
    var waste = params.get('waste') || '';
    var sov = params.get('sov') || '';
    var frameworks = params.get('frameworks') || '';
    var v = params.get('v') || '';

    var bits = [];
    if (industry) bits.push('<b>' + industry + '</b>');
    if (spend) bits.push('annual spend <b>' + spend + '</b>');
    if (waste) bits.push('~<b>' + waste + '%</b> waste');
    if (frameworks) bits.push('flagged frameworks <b>' + frameworks.toUpperCase() + '</b>');
    else if (sov === '1') bits.push('<b>sovereignty flag</b>');
    var suffix = bits.length ? (' with ' + bits.join(' &middot; ')) : '';

    try {
      window.CLOUD_IQ_TELEMETRY = window.CLOUD_IQ_TELEMETRY || {events:[]};
      var evt = {type:'handoff_received', from:from, v:v, industry:industry, spend:spend, waste:waste, sov:sov, frameworks:frameworks, ts:Date.now()};
      window.CLOUD_IQ_TELEMETRY.events.push(evt);
      window.dispatchEvent(new CustomEvent('cloudiq:event', {detail: evt}));
    } catch(e){}

    window.LTM_HANDOFF = {from:from, industry:industry, spend:spend, waste:waste, sov:sov, frameworks:frameworks, v:v};

    // ---- Posture-IQ-specific hydration ----
    if (typeof window.toggleSector === 'function') {
      var sectorMap = {
        "BFSI":"finserv", "Public Sector":"public", "Healthcare":"health",
        "Retail / CPG":"retail", "Manufacturing":"manuf", "Telco / Media":"telecom"
      };
      var fwMap = { dora:"dora", gdpr:"gdpr" };

      var targetSector = sectorMap[industry] || null;
      var targetRegs = (frameworks || "").toLowerCase().split(",").map(function(s){return s.trim();}).filter(Boolean)
        .map(function(k){ return fwMap[k]; }).filter(Boolean);

      if (targetSector || targetRegs.length) {
        var attempts = 0;
        var hydrate = function(){
          attempts++;
          var hydrated = false;
          try {
            if (targetSector && window.STATE && Array.isArray(window.STATE.sectors)) {
              if (!window.STATE.sectors.includes(targetSector)) {
                var chip = document.querySelector('.sector[data-id="' + targetSector + '"]');
                if (chip) { window.toggleSector(targetSector); hydrated = true; }
              }
            }
            if (targetRegs.length && window.STATE && Array.isArray(window.STATE.regulations)) {
              targetRegs.forEach(function(r){
                if (!window.STATE.regulations.includes(r)) {
                  var rchip = document.querySelector('.reg-chip[data-id="' + r + '"]');
                  if (rchip) { window.toggleReg(r); hydrated = true; }
                }
              });
            }
          } catch(err){}
          if (!hydrated && attempts < 60) setTimeout(hydrate, 250);   // retry ~15s
        };
        setTimeout(hydrate, 400);
      }
    }

    function mount(){
      if (document.getElementById('ltm-handoff-banner')) return;
      var banner = document.createElement('div');
      banner.id = 'ltm-handoff-banner';
      banner.setAttribute('role', 'status');
      banner.innerHTML = '<div class="ltm-hb-inner">' +
        '<span class="ltm-hb-badge">Arrived from Cloud IQ</span>' +
        '<span class="ltm-hb-msg">Your Cloud IQ diagnostic routed here' + suffix + '. The result will land in that context.</span>' +
        '<button class="ltm-hb-close" onclick="this.parentElement.parentElement.remove()">Dismiss</button>' +
        '</div>';
      var nav = document.getElementById('ltm-family-nav');
      if (nav && nav.parentNode) nav.parentNode.insertBefore(banner, nav.nextSibling);
      else if (document.body) document.body.insertBefore(banner, document.body.firstChild);
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', mount);
    } else {
      mount();
    }
  } catch(e) { /* fail silent */ }
})();
</script>
