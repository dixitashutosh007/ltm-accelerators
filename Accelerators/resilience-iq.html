{color:var(--accent)}.mono{font-family:ui-monospace,monospace}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.hero h1{font-size:32px}.q{font-size:20px}}

@import url("https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap");
:root{--bg:#F8FAFC;--panel:#fff;--line:#CBD5E1;--ink:#0F172A;--ink2:#334155;--ink3:#64748B;--red:#FF5E4F;--red2:#E54536;--navy:#00354F;--green:#35754D;--amber:#E39A2E;--font-h:'Plus Jakarta Sans',sans-serif;--font-m:'JetBrains Mono',monospace}
html,body{background:var(--bg)!important;color:var(--ink)!important;font-family:var(--font-h)!important}.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.suitebar{height:62px;display:flex;align-items:center;justify-content:space-between;max-width:1120px;margin:auto;padding:0 24px}.suitebrand{display:flex;align-items:center;gap:11px;font-weight:700}.suite-logo{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--red),var(--red2));color:#fff;display:grid;place-items:center;font-weight:800}.suite-sub{font:10px var(--font-m);color:var(--ink3);letter-spacing:.08em;text-transform:uppercase}.wrap{max-width:1120px!important;padding:0 24px!important}.hero{padding:38px 0 10px}.eyebrow{font:11px var(--font-m);letter-spacing:.16em;text-transform:uppercase;color:var(--red);margin-bottom:12px}.hero h1{font-size:40px!important;letter-spacing:-.03em}.hero p{color:var(--ink2)!important;max-width:780px}.panel{background:#fff!important;border:1px solid var(--line)!important;border-radius:8px!important;box-shadow:0 1px 2px rgba(15,23,42,.03);padding:28px!important}.progressbar{height:5px;background:#E2E8F0;border-radius:4px;overflow:hidden;margin:8px 0 25px}.progressbar i{display:block;height:100%;background:var(--red);transition:width .35s ease}.progress{color:var(--ink3)!important}.q{font-size:25px!important;letter-spacing:-.02em;color:var(--ink)}.hint{color:var(--ink3)!important}.options{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.option{background:#fff!important;border:1px solid var(--line)!important;color:var(--ink)!important;border-radius:6px!important;transition:.15s}.option:hover{border-color:#94A3B8!important;transform:translateY(-1px)}.option.selected{border-color:var(--red)!important;background:#FFF4F2!important;box-shadow:0 0 0 1px rgba(255,94,79,.08)}.btn.primary{background:var(--red)!important;color:#fff!important}.btn.secondary{background:#fff!important;color:var(--ink)!important;border:1px solid var(--line)}.interaction-note{font:10px var(--font-m);color:var(--ink3);text-transform:uppercase;letter-spacing:.08em;margin:0 0 12px}.slider-wrap{padding:24px 8px 8px}.slider{width:100%;accent-color:var(--red)}.slider-value{text-align:center;font-size:30px;font-weight:800;margin-bottom:16px}.slider-scale{display:flex;justify-content:space-between;color:var(--ink3);font-size:11px}.matrix{display:grid;grid-template-columns:1.5fr repeat(4,1fr);border:1px solid var(--line);border-radius:6px;overflow:hidden}.matrix>div{padding:11px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:12px}.matrix .mh{font:10px var(--font-m);text-transform:uppercase;color:var(--ink3);background:#F8FAFC}.matrix button{width:100%;border:0;background:transparent;cursor:pointer;padding:7px;border-radius:4px}.matrix button.selected{background:#FFF0ED;box-shadow:inset 0 0 0 1px var(--red)}.rank-list{display:grid;gap:8px}.rank-item{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:6px;padding:13px;cursor:grab}.rank-item .handle{font:12px var(--font-m);color:var(--ink3)}.rank-item .ranknum{width:25px;height:25px;border-radius:50%;background:#F1F5F9;display:grid;place-items:center;font:11px var(--font-m)}.rank-item.dragging{opacity:.5;border-color:var(--red)}.splash{position:fixed;inset:0;background:#07111F;color:#fff;z-index:999;display:grid;place-items:center;overflow:hidden}.splash:before{content:"";position:absolute;width:650px;height:650px;border-radius:50%;background:radial-gradient(circle,rgba(255,94,79,.18),transparent 68%);animation:pulse 2s ease-in-out infinite}.splash-inner{position:relative;text-align:center;max-width:700px;padding:30px}.splash-mark{font:800 13px var(--font-m);letter-spacing:.18em;color:#FF8A80}.splash-title{font-size:58px;line-height:1;margin:18px 0 14px;letter-spacing:-.05em}.splash-copy{color:#A9B8CA;font-size:15px;line-height:1.7}.splash-line{width:180px;height:2px;background:#FF5E4F;margin:28px auto 0;animation:loadline 1.4s ease forwards}.fadeout{animation:fadeout .55s ease forwards}@keyframes pulse{50%{transform:scale(1.15);opacity:.7}}@keyframes loadline{from{width:0}to{width:180px}}@keyframes fadeout{to{opacity:0;visibility:hidden}}@media(max-width:700px){.options{grid-template-columns:1fr}.splash-title{font-size:42px}.matrix{grid-template-columns:1.1fr repeat(4,1fr);font-size:10px}}
</style>
<script src="./cost-iq-runtime-config.js"></script>
</head>
<body>
<div class="topbar"><div class="suitebar"><div class="suitebrand"><span class="suite-logo">L</span><span>LTM Advisory<br><span class="suite-sub">Resilience IQ · Enterprise Resilience</span></span></div><div style="display:flex;align-items:center;gap:10px"><a href="./resilience-iq-question-bank.html" class="studio-link">QUESTION BANK STUDIO</a><span class="badge">EXECUTIVE SCAN</span></div></div></div><div id="splash" class="splash"><div class="splash-inner"><div class="splash-mark">LTM ADVISORY · RESILIENCE IQ</div><div class="splash-title">Resilience under pressure.</div><div class="splash-copy">A business-service-first diagnostic for continuity, recovery, cyber resilience and operational resilience.</div><div class="splash-line"></div></div></div>
<div class="wrap">
<div id="app"></div>
</div>
<script>
const API=(window.RESILIENCE_IQ_API||'')+'/api/evaluate/resilience-iq';
let questions=[
{id:'EX-01',t:'Which business services are most critical to the enterprise?',type:'rank',o:['Customer-facing services','Revenue-generating services','Regulatory/financial reporting','Workforce-critical services','Supply-chain/operations services','Other']},
{id:'EX-02',t:'For the most critical service, how long can the business tolerate material disruption before impact becomes unacceptable?',type:'slider',o:['<15 minutes','15-60 minutes','1-4 hours','4-24 hours','>24 hours','Unknown']},
{id:'EX-03',t:'What is the required recovery time for the most critical service?',type:'slider',o:['<15 minutes','15-60 minutes','1-4 hours','4-24 hours','>24 hours','Unknown']},
{id:'EX-04',t:'What is the maximum acceptable data loss for the most critical service?',type:'slider',o:['Near-zero','<15 minutes','15-60 minutes','1-4 hours','4-24 hours','>24 hours','Unknown']},
{id:'EX-05',t:'Are critical business services mapped end-to-end to applications, data, infrastructure, people and third parties?',type:'matrix',rows:['Applications','Data','Infrastructure','People','Third parties'],cols:['Validated','Partial','Stale','No mapping']},
{id:'EX-06',t:'Can critical applications be recovered within their stated RTO today?',type:'single',o:['Yes, proven by testing','Likely, but not recently tested','No','Unknown']},
{id:'EX-07',t:'When was the last successful end-to-end recovery test of a critical service?',type:'single',o:['Within 3 months','3-12 months ago','1-2 years ago','>2 years ago','Never','Unknown']},
{id:'EX-08',t:'A destructive cyber event hits production. How confident are you that recovery assets remain usable?',type:'scenario',o:['No, recovery is isolated','Potentially','Yes','Unknown']},
{id:'EX-09',t:'Are critical backups immutable and independently recoverable?',type:'single',o:['Yes, tested','Immutable but restore not proven','Recoverable but not immutable','No','Unknown']},
{id:'EX-10',t:'Do critical services depend on third parties whose failure could breach business impact tolerance?',type:'single',o:['No','Yes, but alternatives exist','Yes, with no viable alternative','Unknown']},
{id:'EX-11',t:'Do multiple critical services rely on the same cloud provider, region, network provider, SaaS platform or other concentration point?',type:'single',o:['No material concentration','Moderate concentration','High concentration','Unknown']},
{id:'EX-12',t:'Are there known single points of failure in facilities, power, network, storage, identity or recovery infrastructure?',type:'single',o:['No known SPOFs','Some non-critical SPOFs','Critical SPOFs exist','Unknown']},
{id:'EX-13',t:'Can critical business processes continue if key people or the primary workplace are unavailable?',type:'single',o:['Yes, proven','Yes, documented','Partially','No','Unknown']},
{id:'EX-14',t:'Is there an established crisis-management and executive decision process with clear roles and communications?',type:'single',o:['Yes, exercised','Yes, documented','Partially','No']},
{id:'EX-15',t:'Is resilience performance reviewed regularly by accountable business and technology leadership?',type:'single',o:['Yes, with metrics and actions','Yes, periodic review','Informal','No']},
{id:'EX-16',t:'Have severe-but-plausible scenarios been exercised across business and technology teams?',type:'single',o:['Yes, regularly','Yes, occasionally','Technical tests only','No','Unknown']},
{id:'EX-17',t:'Do critical third parties have tested continuity or exit arrangements?',type:'single',o:['Yes, tested','Documented only','Contractual only','No','Unknown']},
{id:'EX-18',t:'What technology environments support critical services?',type:'multi',o:['On-premises','AWS','Azure','GCP','Other public cloud','SaaS']},
{id:'EX-19',t:'Can privileged identity and access be recovered if the primary identity/control plane is compromised?',type:'single',o:['Yes, isolated alternate path exists','Partially','No','Unknown']},
{id:'EX-20',t:'How confident are you that documented recovery procedures meet the stated business objectives?',type:'single',o:['High — independently validated','High — tested','Medium — documented but not fully tested','Low','Unknown']}
];
let answers={},idx=0,result=null;
function esc(s){return String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function render(){
 if(result){renderReport();return}
 const q=questions[idx], cur=answers[q.id];
 const pct=Math.round(((idx+1)/questions.length)*100);
 let body='';
 if(q.type==='slider'){
   const vals=q.o; const pos=cur===undefined?2:cur;
   body='<div class="slider-wrap"><div class="slider-value" id="sliderVal">'+esc(vals[pos])+'</div><input class="slider" type="range" min="0" max="'+(vals.length-1)+'" step="1" value="'+pos+'" oninput="slide(this.value)"><div class="slider-scale">'+vals.map(x=>'<span>'+esc(x)+'</span>').join('')+'</div></div>';
 } else if(q.type==='matrix'){
   const m=answers[q.id]||{}; body='<div class="matrix"><div class="mh">Dependency</div>'+q.cols.map(x=>'<div class="mh">'+esc(x)+'</div>').join('')+q.rows.map((r,ri)=>'<div><b>'+esc(r)+'</b></div>'+q.cols.map((c,ci)=>'<div><button class="'+(m[ri]===ci?'selected':'')+'" onclick="matrixPick('+ri+','+ci+')">'+(m[ri]===ci?'●':'○')+'</button></div>').join('')).join('')+'</div>';
 } else if(q.type==='rank'){
   const order=answers[q.id]||q.o.map((_,i)=>i); body='<div class="interaction-note">Drag to arrange · most critical first</div><div class="rank-list">'+order.map((i,n)=>'<div class="rank-item" draggable="true" data-i="'+i+'" ondragstart="dragStart(event)" ondragover="event.preventDefault()" ondrop="dropRank(event,'+n+')"><span class="handle">☷</span><span class="ranknum">'+(n+1)+'</span><span>'+esc(q.o[i])+'</span></div>').join('')+'</div>';
 } else {
   const selected=Array.isArray(cur)?cur:[cur]; body='<div class="options">'+q.o.map((x,i)=>'<button class="option '+(selected.includes(i)?'selected':'')+'" onclick="pick('+i+')">'+esc(x)+'</button>').join('')+'</div>';
 }
 document.getElementById('app').innerHTML='<div class="hero"><div class="eyebrow">LTM ADVISORY · EXECUTIVE RESILIENCE DIAGNOSTIC</div><h1>Resilience IQ</h1><p>Assess the enterprise ability to sustain critical business services through disruption — before technology choices are made.</p></div><div class="panel"><div class="progress"><span>Question '+(idx+1)+' of '+questions.length+'</span><span class="mono">'+q.id+' · '+pct+'%</span></div><div class="progressbar"><i style="width:'+pct+'%"></i></div><div class="interaction-note">'+(q.type==='multi'?'Multiple selection':q.type==='slider'?'Slider assessment':q.type==='matrix'?'Dependency matrix':q.type==='rank'?'Priority ranking':q.type==='scenario'?'Scenario decision':'Single selection')+'</div><div class="q">'+esc(q.t)+'</div><div class="hint">Answer from the current state. The assessment separates business requirements, recovery strategy and supporting resilience controls.</div>'+body+'<div class="bar"><button class="btn secondary" onclick="back()" '+(idx===0?'disabled':'')+'>← Previous</button><button class="btn primary" onclick="next()">'+(idx===questions.length-1?'Run Resilience Assessment →':'Next →')+'</button></div></div>';
}
function pick(i){const q=questions[idx];if(q.type==='multi'){const cur=Array.isArray(answers[q.id])?[...answers[q.id]]:[];const p=cur.indexOf(i);p>=0?cur.splice(p,1):cur.push(i);answers[q.id]=cur;}else answers[q.id]=i;render();}
function slide(v){answers[questions[idx].id]=Number(v);const q=questions[idx];const el=document.getElementById('sliderVal');if(el)el.textContent=q.o[Number(v)];}
function matrixPick(r,c){const q=questions[idx];const m=answers[q.id]||{};m[r]=c;answers[q.id]=m;render();}
let dragFrom=null;
function dragStart(e){dragFrom=Number(e.currentTarget.dataset.i);e.currentTarget.classList.add('dragging');}
function dropRank(e,target){e.currentTarget.classList.remove('dragging');const q=questions[idx];const order=[...(answers[q.id]||q.o.map((_,i)=>i))];const from=order.indexOf(dragFrom);if(from<0)return;order.splice(from,1);order.splice(target,0,dragFrom);answers[q.id]=order;render();}
function back(){if(idx>0){idx--;render();}}
function next(){const q=questions[idx];if(q.type==='rank'&&answers[q.id]===undefined)answers[q.id]=q.o.map((_,i)=>i);if(q.type==='matrix'&&(!answers[q.id]||Object.keys(answers[q.id]).length<q.rows.length)){alert('Please complete the dependency matrix before continuing.');return}if(answers[q.id]===undefined){alert('Please select an answer before continuing.');return}if(idx<questions.length-1){idx++;render();}else evaluate();}
async function evaluate(){
 document.getElementById('app').innerHTML='<div class="panel" style="text-align:center;padding:70px"><h2>Running Resilience IQ...</h2><p style="color:var(--muted)">Applying decision branches, evidence confidence, hard constraints, pattern ranking and blueprint logic.</p></div>';
 try{
  const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({answers:mapAnswers()})});
  const j=await res.json();if(!j.ok)throw new Error(j.error||'Evaluation failed');result=j.data;
  if(result.status==='requirements_incomplete' && Array.isArray(result.nextQuestions) && result.nextQuestions.length){
    await loadAdvisoryQuestions(result.nextQuestions);
    return;
  }
  renderReport();
 }catch(e){document.getElementById('app').innerHTML='<div class="panel"><h2>Evaluation failed</h2><p class="danger">'+esc(e.message)+'</p><button class="btn primary" onclick="render()">Retry</button></div>';}}
async function loadAdvisoryQuestions(nextQuestions){
 try{
  const bank=await fetch('../resilience-iq/knowledge/question-bank.json',{cache:'no-store'}).then(r=>r.ok?r.json():null);
  if(!bank)throw new Error('Question bank unavailable');
  const byId=new Map((bank.advisory_questions||[]).map(q=>[q.id,q]));
  const additions=nextQuestions.map(n=>byId.get(n.id)).filter(Boolean).map(q=>({
    id:q.id,t:q.text,type:q.ui?.interaction||q.type,o:q.options||[],rows:q.ui?.rows||[],cols:q.ui?.columns||[],required:true
  })).filter(q=>!questions.some(existing=>existing.id===q.id));
  if(!additions.length){renderReport();return;}
  questions=[...questions,...additions];
  for(const q of additions) answers[q.id]=undefined;
  idx=questions.length-additions.length;
  document.querySelector('.badge').textContent='ADVISORY DEEP DIVE';
  render();
 }catch(e){
  document.getElementById('app').innerHTML='<div class="panel"><h2>Advisory questions unavailable</h2><p class="danger">'+esc(e.message)+'</p><button class="btn primary" onclick="evaluate()">Retry</button></div>';
 }}
function mapAnswers(){const out={};for(const q of questions){const v=answers[q.id];if(q.type==='multi')out[q.id]=(v||[]).map(i=>q.o[i]);else if(q.type==='slider')out[q.id]=q.o[v];else if(q.type==='rank')out[q.id]=(v||q.o.map((_,i)=>i)).map(i=>q.o[i]);else if(q.type==='matrix'){const m=v||{};out[q.id]=Object.fromEntries(Object.entries(m).map(([row,i])=>[q.rows[row],q.cols[i]]));}else out[q.id]=q.o[v];}return out;}
function renderReport(){const d=result;document.getElementById('app').innerHTML=`
<div class="hero"><h1>Resilience IQ Results</h1><p>${d.status==='ready'?'Executive assessment complete.':'Final recommendation is blocked until required business objectives and baseline questions are complete.'}</p></div>
<div class="grid">
<div class="stat"><div class="label">Resilience Posture</div><div class="value">${d.postureScore??'—'}</div></div>
<div class="stat"><div class="label">Critical Exposure</div><div class="value" style="font-size:20px">${esc(d.criticalExposure||'—')}</div></div>
<div class="stat"><div class="label">Rating</div><div class="value" style="font-size:20px">${esc(d.rating||'Incomplete')}</div></div>
<div class="stat"><div class="label">Maturity</div><div class="value" style="font-size:20px">${d.maturity?esc(d.maturity.label):'—'}</div></div>
<div class="stat"><div class="label">Evidence</div><div class="value" style="font-size:17px">${esc(d.evidenceConfidence)}</div></div>
</div>
<div class="panel"><div class="section"><h2>Executive Advisory Report</h2><div class="pill">Executive Scan · Initial Advisory</div><p style="color:var(--muted);margin-top:10px">This is an initial executive posture assessment. Final target-state architecture and investment decisions should be validated through the evidence requests and advisory questions identified below.</p></div><div class="section"><h2>Executive Summary</h2><p style="font-size:18px;line-height:1.6">${esc(d.executiveSummary||"")}</p></div></div>
<div class="panel" style="border-color:var(--accent)">
<div class="section"><h2>Executive Decision View</h2><p style="color:var(--muted)">The decision view translates the assessment into the actions a CIO/CTO can take now. It deliberately separates the recovery strategy from supporting resilience controls and keeps unresolved evidence visible.</p></div>
<div class="section"><h2>What is the situation?</h2><p style="font-size:18px;line-height:1.55">${esc(d.executiveReport?.executiveSummary||d.executiveSummary||'Initial resilience posture assessment completed.')}</p></div>
<div class="section"><h2>Top 5 Risks</h2>${(d.executiveReport?.topRisks||[]).slice(0,5).map((x,i)=>`<div class="row"><span class="pill">${i+1}</span> <b>${esc(x.name||x.risk||x)}</b><div style="color:var(--muted);margin-top:5px">${esc(x.action||x.impact||'Requires validation and risk treatment.')}</div></div>`).join('')||'<p style="color:var(--muted)">No ranked risks returned.</p>'}</div>
<div class="section"><h2>What should we do?</h2>${(d.roadmap||[]).slice(0,4).map(w=>`<div class="row"><b>${esc(w.wave)} · ${esc(w.window)}</b><div style="color:var(--muted);margin-top:6px">${(w.actions||[]).slice(0,4).map(esc).join(' · ')}</div></div>`).join('')}</div>
<div class="section"><h2>Why this strategy?</h2><p style="color:var(--muted)">${esc(d.executiveReport?.recoveryStrategy?.rationale||'The preferred recovery strategy is driven by stated business recovery objectives, then constrained by cyber, dependency, concentration and technology risks.')}</p><div class="row"><b>Preferred recovery strategy</b><span style="float:right">${esc(d.preferredPattern||'Not yet determined')}</span></div>${(d.executiveReport?.recoveryStrategy?.alternatives||[]).slice(0,2).map(x=>`<div class="row"><b>Alternative</b><span style="float:right">${esc(x)}</span></div>`).join('')}</div>
<div class="section"><h2>Investment decisions</h2>${(d.executiveReport?.decisionPoints||[]).slice(0,5).map(x=>`<div class="row">${esc(x)}</div>`).join('')||'<div class="row">Validate the target recovery objectives, protected recovery capability, identity recovery and third-party resilience before committing major investment.</div>'}</div>
<div class="section"><h2>Missing evidence</h2>${(d.executiveReport?.evidenceValidation||[]).slice(0,8).map(x=>`<div class="row"><b>${esc(x.evidence)}</b><div style="color:var(--muted);margin-top:5px">${esc(x.purpose)}</div></div>`).join('')||'<div class="row">No additional evidence was returned.</div>'}</div>
<div class="section"><h2>What could change the recommendation?</h2>${(d.executiveReport?.recoveryStrategy?.sensitivity||[]).map(x=>`<div class="row">${esc(x)}</div>`).join('')||'<div class="row">Measured recovery results, business objectives, dependency topology, cyber recovery isolation and concentration constraints could change the strategy.</div>'}</div>
</div>

async function loadQuestionBank(){
 try{
  const r=await fetch('../resilience-iq/knowledge/question-bank.json',{cache:'no-store'});
  if(!r.ok)throw new Error('Question bank unavailable');
  const bank=await r.json();
  const byId=Object.fromEntries((bank.executive_questions||[]).map(q=>[q.id,q]));
  questions=questions.map(q=>{
   const b=byId[q.id]; if(!b)return q;
   const ui=b.ui||{};
   const typeMap={ranking:'rank',slider_choice:'slider',matrix:'matrix',scenario:'scenario',multi_select:'multi',single_select:'single'};
   const merged={...q,t:b.text||q.t};
   if(ui.interaction)merged.type=typeMap[ui.interaction]||q.type;
   if(merged.type==='matrix'){merged.rows=ui.rows||q.rows;merged.cols=ui.columns||q.cols;}
   else if(Array.isArray(b.options))merged.o=b.options;
   return merged;
  });
  render();
 }catch(e){console.warn('Using embedded Resilience IQ question fallback:',e.message);}
}
loadQuestionBank();
setTimeout(()=>{const splash=document.getElementById("splash");if(splash){splash.classList.add("fadeout");setTimeout(()=>splash.remove(),600);}},1400);render();
</script>
