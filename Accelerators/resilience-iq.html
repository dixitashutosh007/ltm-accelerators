atus-draft{color:var(--amber)}.status-completed{color:var(--green)}.status-in_progress{color:#60A5FA}.report-cover{background:linear-gradient(135deg,#111B29 0%,#0D141E 58%,#17202C 100%);border:1px solid #2A394C!important;padding:34px!important}.report-meta{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.report-kicker{font:10px var(--font-m);letter-spacing:.16em;text-transform:uppercase;color:#FF8A80}.report-title{font-size:34px;font-weight:800;letter-spacing:-.04em;margin:8px 0}.report-client{font-size:15px;color:var(--ink2)}.report-date{font:11px var(--font-m);color:var(--ink3);text-align:right}.report-lead{font-size:17px;line-height:1.7;color:#E5EAF0;max-width:900px;margin:24px 0 0}.report-grid{display:grid;grid-template-columns:1.25fr .75fr;gap:16px}.report-stat{background:#0D151F;border:1px solid var(--line);border-radius:8px;padding:20px}.report-stat .value{font-size:30px}.report-score{font-size:48px!important;color:var(--red)}.report-card-title{font:10px var(--font-m);letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);margin-bottom:10px}.report-list{margin:0;padding-left:19px}.report-list li{padding:7px 0;color:var(--ink2);line-height:1.5}.risk-severe{border-left:3px solid var(--danger);padding-left:14px}.risk-high{border-left:3px solid var(--amber);padding-left:14px}.confidence{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;background:#172437;color:var(--ink2);font:10px var(--font-m)}.roadmap{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.wave{background:#0D151F;border:1px solid var(--line);border-radius:8px;padding:16px}.wave-num{font:10px var(--font-m);color:var(--red);text-transform:uppercase}.wave h3{font-size:15px;margin:7px 0}.wave p{color:var(--ink3);font-size:12px;line-height:1.5}.print-actions{display:flex;gap:10px;margin-top:24px}@media(max-width:800px){.report-grid,.roadmap{grid-template-columns:1fr}.report-meta{display:block}.report-date{text-align:left;margin-top:10p <div class="topbar"><div class="suitebar"><div class="suitebrand"><span class="suite-logo">L</span><span>LTM Vantage<br><span class="suite-sub">Resilience IQ · Responsible Advisory</span></span></div><div style="display:flex;align-items:center;gap:10px"><a href="./resilience-iq-question-bank.html" class="studio-link">QUESTION BANK STUDIO</a><span class="badge">EXECUTIVE SCAN</span></div></div></div><div id="splash" class="splash"><div class="splash-inner"><div class="splash-mark">LTM VANTAGE · RESILIENCE IQ</div><div class="splash-title">Resilience under pressure.</div><div class="splash-copy">A business-service-first diagnostic for continuity, recovery, cyber resilience and operational resilience.</div><div class="splash-line"></div></div></div>

<script>
const API_BASE=(window.RESILIENCE_IQ_API||'').replace(/\/$/,'');
const API=API_BASE+'/api/evaluate/resilience-iq';
const ASSESSMENT_API=API_BASE+'/api/resilience-iq/assessment';
function appAuthToken(){
 try { const raw=sessionStorage.getItem('ltm_auth_user'); return raw ? JSON.parse(raw).token || '' : ''; }
 catch { return ''; }
}
// Calls the Resilience IQ API with the platform session's ID token. LTM_API renews an expiring token with the
// refresh token, so long assessments do not fail after an hour; a 401 is retried once with a renewed token.
async function authFetch(url,options={}){
 const api=window.LTM_API;
 const token=api?await api.getIdToken():appAuthToken();
 if(!token){requireAppLogin();throw new Error('Your session has expired. Please sign in again.');}
 const send=t=>fetch(url,Object.assign({},options,{headers:Object.assign({},options.headers||{},{'Authorization':'Bearer '+t})}));
 let res=await send(token);
 if(res.status===401&&api){const renewed=await api.refreshIdToken();if(renewed)res=await send(renewed);}
 if(res.status===401){requireAppLogin(true);throw new Error('Your session has expired. Please sign in again.');}
 return res;
}
function requireAppLogin(force){
 if(force||!(window.LTM_API?window.LTM_API.hasUsableSession():appAuthToken())){
   const target=encodeURIComponent(window.location.pathname+window.location.search);
   window.location.href='/?require_login=1&redirect='+target;
   return false;
 }
 return true;
}
let questions=[
{id:'EX-01',t:'Which business services are most critical to the enterprise?',type:'rank',o:['Customer-facing services','Revenue-generating services','Regulatory/financial reporting','Workforce-critical services','Supply-chain/operations services','Other']},
{id:'EX-02',t:'For the most critical service, how long can the business tolerate material disruption before impact becomes unacceptable?',type:'slider',o:['<15 minutes','15-60 minutes','1-4 hours','4-24 hours','>24 hours','Unknown']},
{id:'EX-03',t:'What is the required recovery time for the most critical service?',type:'slider',o:['<15 minutes','15-60 minutes','1-4 hours','4-24 hours','>24 hours','Unknown']},
{id:'EX-04',t:'What is the maximum acceptable data loss for the most critical service?',type:'slider',o:['Near-zero','<15 minutes','15-60 minutes','1-4 hours','4-24 hours','>24 hours','Unknown']},
{id:'EX-05',t:'Are critical business services mapped end-to-end to applications, data, infrastructure, people and third parties?',type:'matrix',rows:['Applications','Data','Infrastructure','People','Third parties'],cols:['Validated','Partial','Stale','No mapping']},
{id:'EX-06',t:'Can critical applications be recovered within their stated RTO today?',type:'single',o:['Yes, proven by testing','Likely, but not recently tested','No','Unknown']},
{id:'EX-07',t:'When was the last successful end-to-end recovery test of a critical service?',type:'single',o:['Within 3 months','3-12 months ago','1-2 years ago','>2 years ago','Never','Unknown']},
{id:'EX-08',t:'A destructive cyber event hits production. How confident are you that recovery assets remain usable?',type:'scenario',o:['No, recovery is isolated','Potentially','Yes','Unknown']},
{id:'EX-09',t:'Are critical backups immutable and independently recoverable?',type:'single',o:['Yes, tested','Immutable but restore not proven','Recoverable but not immutable','No','Unknown']},
{id:'EX-10',t:'Do critical services depend on third parties whose failure could breach business impact tolerance?',type:'single',o:['No','Yes, but alternatives exist','Yes, with no viable alternative','Unknown']},
{id:'EX-11',t:'Do multiple critical services rely on the same cloud provider, region, network provider, SaaS platform or other concentration point?',type:'single',o:['No material concentration','Moderate concentration','High concentration','Unknown']},
{id:'EX-12',t:'Are there known single points of failure in facilities, power, network, storage, identity or recovery infrastructure?',type:'single',o:['No known SPOFs','Some non-critical SPOFs','Critical SPOFs exist','Unknown']},
{id:'EX-13',t:'Can critical business processes continue if key people or the primary workplace are unavailable?',type:'single',o:['Yes, proven','Yes, documented','Partially','No','Unknown']},
{id:'EX-14',t:'Is there an established crisis-management and executive decision process with clear roles and communications?',type:'single',o:['Yes, exercised','Yes, documented','Partially','No']},
{id:'EX-15',t:'Is resilience performance reviewed regularly by accountable business and technology leadership?',type:'single',o:['Yes, with metrics and actions','Yes, periodic review','Informal','No']},
{id:'EX-16',t:'Have severe-but-plausible scenarios been exercised across business and technology teams?',type:'single',o:['Yes, regularly','Yes, occasionally','Technical tests only','No','Unknown']},
{id:'EX-17',t:'Do critical third parties have tested continuity or exit arrangements?',type:'single',o:['Yes, tested','Documented only','Contractual only','No','Unknown']},
{id:'EX-18',t:'What technology environments support critical services?',type:'multi',o:['On-premises','AWS','Azure','GCP','Other public cloud','SaaS']},
{id:'EX-19',t:'Can privileged identity and access be recovered if the primary identity/control plane is compromised?',type:'single',o:['Yes, isolated alternate path exists','Partially','No','Unknown']},
{id:'EX-20',t:'How confident are you that documented recovery procedures meet the stated business objectives?',type:'single',o:['High — independently validated','High — tested','Medium — documented but not fully tested','Low','Unknown']}
];
let answers={},idx=0,result=null,assessment=null,assessmentSaving=false;
const ASSESSMENT_VERSIONS={questionBank:'1.0',scoringModel:'1.0',decisionTree:'1.0',blueprintEngine:'1.0',executiveReport:'1.0',engine:'1.0.0'};
function esc(s){return String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function render(){
 if(result){renderReport();return}
 if(!assessment){renderAssessmentSetup();loadAssessmentHistory();return}
 const q=questions[idx];
 // A slider's displayed starting position is a real answer, not an unanswered placeholder.
 if(q.type==='slider' && answers[q.id]===undefined) answers[q.id]=2;
 const cur=answers[q.id];
 const pct=Math.round(((idx+1)/questions.length)*100);
 let body='';
 if(q.type==='slider'){
   const vals=q.o; const pos=cur===undefined?2:cur;
   body='<div class="slider-wrap"><div class="slider-value" id="sliderVal">'+esc(vals[pos])+'</div><input class="slider" type="range" min="0" max="'+(vals.length-1)+'" step="1" value="'+pos+'" oninput="slide(this.value)"><div class="slider-scale">'+vals.map(x=>'<span>'+esc(x)+'</span>').join('')+'</div></div>';
 } else if(q.type==='matrix'){
   const m=answers[q.id]||{}; body='<div class="matrix"><div class="mh">Dependency</div>'+q.cols.map(x=>'<div class="mh">'+esc(x)+'</div>').join('')+q.rows.map((r,ri)=>'<div><b>'+esc(r)+'</b></div>'+q.cols.map((c,ci)=>'<div><button class="'+(m[ri]===ci?'selected':'')+'" onclick="matrixPick('+ri+','+ci+')">'+(m[ri]===ci?'●':'○')+'</button></div>').join('')).join('')+'</div>';
 } else if(q.type==='rank'){
   const order=answers[q.id]||q.o.map((_,i)=>i); body='<div class="interaction-note">Drag to arrange · most critical first</div><div class="rank-list">'+order.map((i,n)=>'<div class="rank-item" draggable="true" data-i="'+i+'" ondragstart="dragStart(event)" ondragover="event.preventDefault()" ondrop="dropRank(event,'+n+')"><span class="handle">☷</span><span class="ranknum">'+(n+1)+'</span><span>'+esc(q.o[i])+'</span></div>').join('')+'</div>';
 } else {
   const selected=Array.isArray(cur)?cur:[cur]; body='<div class="options">'+q.o.map((x,i)=>'<button class="option '+(selected.includes(i)?'selected':'')+'" onclick="pick('+i+')">'+esc(x)+'</button>').join('')+'</div>';
 }
 document.getElementById('app').innerHTML='<div class="hero"><div class="eyebrow">LTM VANTAGE · EXECUTIVE RESILIENCE DIAGNOSTIC</div><h1>Resilience IQ</h1><p>Assess the enterprise ability to sustain critical business services through disruption — before technology choices are made.</p></div><div class="panel"><div class="progress"><span>Question '+(idx+1)+' of '+questions.length+'</span><span class="mono">'+q.id+' · '+pct+'%</span></div><div class="progressbar"><i style="width:'+pct+'%"></i></div><div class="interaction-note">'+(q.type==='multi'?'Multiple selection':q.type==='slider'?'Slider assessment':q.type==='matrix'?'Dependency matrix':q.type==='rank'?'Priority ranking':q.type==='scenario'?'Scenario decision':'Single selection')+'</div><div class="q">'+esc(q.t)+'</div><div class="hint">Answer from the current state. The assessment separates business requirements, recovery strategy and supporting resilience controls.</div>'+body+'<div class="bar"><button class="btn secondary" onclick="back()" '+(idx===0?'disabled':'')+'>← Previous</button><button class="btn primary" onclick="next()">'+(idx===questions.length-1?'Run Resilience Assessment →':'Next →')+'</button></div></div>';
}
function renderAssessmentSetup(){
 let email='';try{email=(JSON.parse(sessionStorage.getItem('ltm_auth_user')||'{}').email)||'';}catch{email='';}
 document.getElementById('app').innerHTML=
 '<div class="hero"><div class="eyebrow">LTM VANTAGE · RESILIENCE IQ</div>'+
 '<h1>Start Resilience Assessment</h1>'+
 '<p>Set the client context once. Resilience IQ will then save the assessment securely as you progress.</p></div>'+
 '<div class="panel"><div class="section">'+
 '<h2>Assessment Context</h2>'+
 '<p class="hint">This is the working record for the current assessment. Your existing platform identity is used for access.</p>'+
 '<div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px">'+
 '<label>Client / Organisation<input id="assessmentClient" class="text-input" placeholder="e.g. ACME Bank"></label>'+
 '<label>Sector<input id="assessmentSector" class="text-input" placeholder="e.g. Banking"></label>'+
 '</div>'+
 '<label style="display:block;margin-top:16px">Respondent email<input id="assessmentEmail" class="text-input" value="'+esc(email)+'"></label>'+
 '<div id="assessmentStartError" class="danger" style="display:none;margin-top:14px"></div>'+
 '<div class="bar"><button class="btn primary" id="startAssessmentBtn" onclick="startAssessment()">Start Assessment →</button></div>'+
 '</div></div>'+
 '</div><div class="panel"><div class="section"><h2>Previous Assessments</h2><div id="assessmentHistory"><p class="hint">Loading...</p></div></div></div>';
}
async function loadAssessmentHistory(){
 const host=document.getElementById('assessmentHistory');
 if(!host)return;
 host.innerHTML='<p class="hint">Loading previous assessments...</p>';
 try{
  const res=await authFetch(ASSESSMENT_API);
  const j=await res.json();
  if(!res.ok||!j.ok)throw new Error(j.message||j.error||('Unable to load history (HTTP '+res.status+').'));
  const items=Array.isArray(j.data)?j.data:[];
  if(!items.length){host.innerHTML='<p class="hint">No previous Resilience IQ assessments found for this account.</p>';return;}
  host.innerHTML='<div class="history-grid">'+items.map(x=>{
    const dt=x.updatedAt||x.completedAt||x.startedAt;
    const date=dt?new Date(dt).toLocaleDateString(undefined,{day:'2-digit',month:'short',year:'numeric'}):'—';
    const score=x.resultJson?(()=>{try{return JSON.parse(x.resultJson).postureScore??'—'}catch{return '—'}})():'—';
    const status=String(x.status||'draft');
    const action=status==='completed'?'View Report':'Resume';

 const btn=document.getElementById('startAssessmentBtn'); btn.disabled=true; btn.textContent='Creating Assessment...';
 assessment={assessmentId:crypto.randomUUID(),clientName,clientSector,respondentEmail,startedAt:new Date().toISOString(),status:'draft'};
 try{

async function saveAssessment(status,action='save'){
 if(!assessment)return;
 assessment.status=status;
 assessmentSaving=true;
 const snapshot={
  ...assessment,
  version:ASSESSMENT_VERSIONS,
  answers:mapAnswers(),
  result:result||undefined,
  completedAt:status==='completed'?(assessment.completedAt||new Date().toISOString()):assessment.completedAt,
  finalizedAt:assessment.finalizedAt
 };
 const res=await authFetch(ASSESSMENT_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,snapshot})});
 let j; try{j=await res.json();}catch{throw new Error('Persistence service returned an invalid response.');}
 if(!res.ok||!j.ok)throw new Error(j.message||j.error||('Persistence failed (HTTP '+res.status+').'));
 assessmentSaving=false;
 return j.data;
}
function numberPick(v){answers[questions[idx].id]=v===''?undefined:Number(v);}
function textPick(v){answers[questions[idx].id]=v;}
function pick(i){const q=questions[idx];if(q.type==='multi'){const cur=Array.isArray(answers[q.id])?[...answers[q.id]]:[];const p=cur.indexOf(i);p>=0?cur.splice(p,1):cur.push(i);answers[q.id]=cur;}else answers[q.id]=i;render();}
function slide(v){answers[questions[idx].id]=Number(v);const q=questions[idx];const el=document.getElementById('sliderVal');if(el)el.textContent=q.o[Number(v)];}
function matrixPick(r,c){const q=questions[idx];const m=answers[q.id]||{};m[r]=c;answers[q.id]=m;render();}
let dragFrom=null;
function dragStart(e){dragFrom=Number(e.currentTarget.dataset.i);e.currentTarget.classList.add('dragging');}
function dropRank(e,target){e.currentTarget.classList.remove('dragging');const q=questions[idx];const order=[...(answers[q.id]||q.o.map((_,i)=>i))];const from=order.indexOf(dragFrom);if(from<0)return;order.splice(from,1);order.splice(target,0,dragFrom);answers[q.id]=order;render();}
function back(){if(idx>0){idx--;render();}}
function answerProvided(q){
 const v=answers[q.id];
 if(q.type==='number'||q.type==='text')return v!==undefined&&v!==null&&String(v).trim()!=='';
 if(q.type==='multi')return Array.isArray(v)&&v.length>0;
 if(q.type==='matrix')return v&&Object.keys(v).length===q.rows.length;
 if(q.type==='rank')return Array.isArray(v)&&v.length===q.o.length;
 return v!==undefined&&v!==null;
}
function next(){
 const q=questions[idx];
 if(q.type==='rank'&&answers[q.id]===undefined)answers[q.id]=q.o.map((_,i)=>i);
 if(!answerProvided(q)){alert(q.type==='matrix'?'Please complete the dependency matrix before continuing.':'Please provide an answer before continuing.');return;}
 if(idx<questions.length-1){
  saveAssessment('in_progress','save').then(()=>{idx++;render();}).catch(e=>alert('Progress could not be saved: '+e.message));
 }else evaluate();
}

async function loadAdvisoryQuestions(nextQuestions){
 try{
  const bank=await fetch('./resilience-iq/knowledge/question-bank.json',{cache:'no-store'}).then(r=>r.ok?r.json():null);
  if(!bank)throw new Error('Question bank unavailable');
  const byId=new Map((bank.advisory_questions||[]).map(q=>[q.id,q]));
  const additions=nextQuestions.map(n=>byId.get(n.id)).filter(Boolean).map(q=>{
    const interaction=q.ui?.interaction||q.type;
    const typeMap={multi_select:'multi',slider_choice:'slider',ranking:'rank',matrix:'matrix',scenario:'scenario',single_select:'single',yes_no:'single',evidence_select:'multi',number:'number',text:'text'};
    return {id:q.id,t:q.text,type:typeMap[interaction]||'single',o:q.options||[],rows:q.ui?.rows||[],cols:q.ui?.columns||[],required:true};
  }).filter(q=>!questions.some(existing=>existing.id===q.id));
  if(!additions.length){renderReport();return;}
  result=null;
  questions=[...questions,...additions];
  for(const q of additions) answers[q.id]=undefined;
  idx=questions.length-additions.length;
  document.querySelector('.badge').textContent='ADVISORY DEEP DIVE';
  render();
 }catch(e){
  document.getElementById('app').innerHTML='<div class="panel"><h2>Advisory questions unavailable</h2><p class="danger">'+esc(e.message)+'</p><button class="btn primary" onclick="evaluate()">Retry</button></div>';
 }}
function mapAnswers(){const out={};for(const q of questions){const v=answers[q.id];if(q.type==='multi')out[q.id]=(v||[]).map(i=>q.o[i]);else if(q.type==='slider')out[q.id]=q.o[v];else if(q.type==='rank')out[q.id]=(v||q.o.map((_,i)=>i)).map(i=>q.o[i]);else if(q.type==='matrix'){const m=v||{};out[q.id]=Object.fromEntries(Object.entries(m).map(([row,i])=>[q.rows[row],q.cols[i]]));}else if(q.type==='number'||q.type==='text')out[q.id]=v;else out[q.id]=q.o[v];}return out;}

async function loadQuestionBank(){
 try{
  const r=await fetch('./resilience-iq/knowledge/question-bank.json',{cache:'no-store'});
  if(!r.ok)throw new Error('Question bank unavailable');
  const bank=await r.json();
  const byId=Object.fromEntries((bank.executive_questions||[]).map(q=>[q.id,q]));
  questions=questions.map(q=>{
   const b=byId[q.id]; if(!b)return q;
   const ui=b.ui||{};
   const typeMap={ranking:'rank',slider_choice:'slider',matrix:'matrix',scenario:'scenario',multi_select:'multi',single_select:'single'};
   const merged={...q,t:b.text||q.t};
   if(ui.interaction)merged.type=typeMap[ui.interaction]||q.type;
   if(merged.type==='matrix'){merged.rows=ui.rows||q.rows;merged.cols=ui.columns||q.cols;}
   else if(Array.isArray(b.options))merged.o=b.options;
   return merged;
  });
  render();
 }catch(e){console.warn('Using embedded Resilience IQ question fallback:',e.message);}
}
async function restoreAssessmentFromServer(){
 const assessmentId=new URLSearchParams(window.location.search).get('assessmentId');
 if(!assessmentId)return false;
 try{
  const res=await authFetch(ASSESSMENT_API+'?assessmentId='+encodeURIComponent(assessmentId));
  const j=await res.json();
  if(!res.ok||!j.ok)throw new Error(j.message||j.error||('Unable to load assessment (HTTP '+res.status+').'));
  const saved=j.data||{};
  assessment={
   assessmentId:String(saved.assessmentId||assessmentId),
   clientName:String(saved.clientName||''),
   clientSector:String(saved.clientSector||''),
   respondentEmail:String(saved.respondentEmail||''),
   startedAt:String(saved.startedAt||''),
   status:String(saved.status||'draft'),
   completedAt:saved.completedAt||undefined,
   finalizedAt:saved.finalizedAt||undefined
  };
  const rawAnswers=saved.answersJson?JSON.parse(saved.answersJson):{};
  answers={};
  for(const q of questions){
   const value=rawAnswers[q.id];
   if(value===undefined)continue;
   if(q.type==='slider'){
    const pos=q.o.indexOf(String(value));
    answers[q.id]=pos>=0?pos:undefined;
   }else if(q.type==='multi'||q.type==='rank'){
    answers[q.id]=Array.isArray(value)?value.map(v=>q.o.indexOf(String(v))).filter(i=>i>=0):[];
   }else if(q.type==='matrix'){
    const m={};
    if(value&&typeof value==='object'){
     for(const [row,column] of Object.entries(value)){
      const ri=q.rows.indexOf(row), ci=q.cols.indexOf(String(column));
      if(ri>=0&&ci>=0)m[ri]=ci;
     }
    }
    answers[q.id]=m;
   }else if(q.type==='number') answers[q.id]=Number(value);
   else if(q.type==='text') answers[q.id]=String(value);
   else {
    const pos=q.o.indexOf(String(value));
    answers[q.id]=pos>=0?pos:undefined;
   }
  }
  if(saved.resultJson){
   try{result=JSON.parse(saved.resultJson);}catch{result=null;}
  }
  if(result||assessment.status==='completed')return true;
  const savedCount=Object.values(answers).filter(v=>v!==undefined).length;
  idx=Math.min(savedCount,questions.length-1);
  return true;
 }catch(e){
  console.warn('Unable to restore Resilience IQ assessment:',e.message);
  return false;
 }
}
