<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resilience IQ | LTM Advisory</title>
<style>
:root{--bg:#08111f;--panel:#101b2d;--line:#26364e;--text:#eef4fb;--muted:#9eafc5;--accent:#55d6be;--warn:#f6c85f;--danger:#ff7b72}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px Inter,Arial,sans-serif}header{padding:20px 6%;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}.brand{font-weight:800;letter-spacing:.08em}.badge{color:var(--accent);font-size:12px}.wrap{max-width:1050px;margin:0 auto;padding:40px 24px}.hero h1{font-size:42px;margin:0 0 8px}.hero p{color:var(--muted);max-width:760px;line-height:1.6}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;margin-top:28px}.progress{color:var(--muted);font-size:12px;margin-bottom:28px;display:flex;justify-content:space-between}.q{font-size:24px;font-weight:700;line-height:1.35;margin-bottom:8px}.hint{color:var(--muted);margin-bottom:22px}.options{display:grid;gap:10px}.option{background:#0c1626;border:1px solid var(--line);border-radius:10px;padding:15px;text-align:left;color:var(--text);cursor:pointer}.option.selected{border-color:var(--accent);background:#102a2a}.bar{display:flex;justify-content:space-between;margin-top:26px}.btn{border:0;border-radius:9px;padding:12px 18px;cursor:pointer;font-weight:700}.primary{background:var(--accent);color:#06131b}.secondary{background:#1b2940;color:var(--text)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{background:#0b1525;border:1px solid var(--line);padding:18px;border-radius:12px}.label{color:var(--muted);font-size:11px;text-transform:uppercase}.value{font-size:27px;font-weight:800;margin-top:6px}.section{margin-top:30px}.section h2{font-size:20px}.row{padding:14px 0;border-bottom:1px solid var(--line)}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#1c2a40;color:var(--muted);font-size:11px}.danger{color:var(--danger)}.good{color:var(--accent)}.mono{font-family:ui-monospace,monospace}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.hero h1{font-size:32px}.q{font-size:20px}}
</style>
<script src="./cost-iq-runtime-config.js"></script>
</head>
<body>
<header><div class="brand">LTM ADVISORY <span class="badge">· RESILIENCE IQ</span></div><div class="badge">Enterprise Resilience & Continuity</div></header>
<div class="wrap">
<div id="app"></div>
</div>
<script>
const API=(window.RESILIENCE_IQ_API||'')+'/api/evaluate/resilience-iq';
const questions=[
{id:'EX-01',t:'Which business services are most critical to the enterprise?',type:'multi',o:['Customer-facing services','Revenue-generating services','Regulatory/financial reporting','Workforce-critical services','Supply-chain/operations services','Other']},
{id:'EX-02',t:'For the most critical service, how long can the business tolerate material disruption before impact becomes unacceptable?',o:['<15 minutes','15-60 minutes','1-4 hours','4-24 hours','>24 hours','Unknown']},
{id:'EX-03',t:'What is the required recovery time for the most critical service?',o:['<15 minutes','15-60 minutes','1-4 hours','4-24 hours','>24 hours','Unknown']},
{id:'EX-04',t:'What is the maximum acceptable data loss for the most critical service?',o:['Near-zero','<15 minutes','15-60 minutes','1-4 hours','4-24 hours','>24 hours','Unknown']},
{id:'EX-05',t:'Are critical business services mapped end-to-end to applications, data, infrastructure, people and third parties?',o:['Yes, current and validated','Partially','Documented but stale','No','Unknown']},
{id:'EX-06',t:'Can critical applications be recovered within their stated RTO today?',o:['Yes, proven by testing','Likely, but not recently tested','No','Unknown']},
{id:'EX-07',t:'When was the last successful end-to-end recovery test of a critical service?',o:['Within 3 months','3-12 months ago','1-2 years ago','>2 years ago','Never','Unknown']},
{id:'EX-08',t:'Can ransomware or destructive compromise affect both production and recovery assets?',o:['No, recovery is isolated','Potentially','Yes','Unknown']},
{id:'EX-09',t:'Are critical backups immutable and independently recoverable?',o:['Yes, tested','Immutable but restore not proven','Recoverable but not immutable','No','Unknown']},
{id:'EX-10',t:'Do critical services depend on third parties whose failure could breach business impact tolerance?',o:['No','Yes, but alternatives exist','Yes, with no viable alternative','Unknown']},
{id:'EX-11',t:'Do multiple critical services rely on the same cloud provider, region, network provider, SaaS platform or other concentration point?',o:['No material concentration','Moderate concentration','High concentration','Unknown']},
{id:'EX-12',t:'Are there known single points of failure in facilities, power, network, storage, identity or recovery infrastructure?',o:['No known SPOFs','Some non-critical SPOFs','Critical SPOFs exist','Unknown']},
{id:'EX-13',t:'Can critical business processes continue if key people or the primary workplace are unavailable?',o:['Yes, proven','Yes, documented','Partially','No','Unknown']},
{id:'EX-14',t:'Is there an established crisis-management and executive decision process with clear roles and communications?',o:['Yes, exercised','Yes, documented','Partially','No']},
{id:'EX-15',t:'Is resilience performance reviewed regularly by accountable business and technology leadership?',o:['Yes, with metrics and actions','Yes, periodic review','Informal','No']},
{id:'EX-16',t:'Have severe-but-plausible scenarios been exercised across business and technology teams?',o:['Yes, regularly','Yes, occasionally','Technical tests only','No','Unknown']},
{id:'EX-17',t:'Do critical third parties have tested continuity or exit arrangements?',o:['Yes, tested','Documented only','Contractual only','No','Unknown']},
{id:'EX-18',t:'What technology environments support critical services?',type:'multi',o:['On-premises','AWS','Azure','GCP','Other public cloud','SaaS']},
{id:'EX-19',t:'Can privileged identity and access be recovered if the primary identity/control plane is compromised?',o:['Yes, isolated alternate path exists','Partially','No','Unknown']},
{id:'EX-20',t:'How confident are you that documented recovery procedures meet the stated business objectives?',o:['High — independently validated','High — tested','Medium — documented but not fully tested','Low','Unknown']}
];
let answers={},idx=0,result=null;
function esc(s){return String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function render(){
 if(result){renderReport();return}
 const q=questions[idx], cur=answers[q.id], selected=Array.isArray(cur)?cur:[cur];
 document.getElementById('app').innerHTML=`
 <div class="hero"><h1>Resilience IQ</h1><p>Evidence-aware assessment of business continuity, disaster recovery, cyber recovery, operational resilience, third-party resilience and infrastructure resilience.</p></div>
 <div class="panel"><div class="progress"><span>Question ${idx+1} of ${questions.length}</span><span class="mono">${q.id}</span></div>
 <div class="q">${esc(q.t)}</div><div class="hint">Choose the closest current-state answer. Recommendations remain vendor-neutral until the strategy is selected.</div>
 <div class="options">${q.o.map((x,i)=>`<button class="option ${selected.includes(i)?'selected':''}" onclick="pick(${i})">${esc(x)}</button>`).join('')}</div>
 <div class="bar"><button class="btn secondary" onclick="back()" ${idx===0?'disabled':''}>← Previous</button><button class="btn primary" onclick="next()">${idx===questions.length-1?'Run Resilience Assessment →':'Next →'}</button></div></div>`;
}
function pick(i){const q=questions[idx];if(q.type==='multi'){const cur=Array.isArray(answers[q.id])?[...answers[q.id]]:[];const p=cur.indexOf(i);p>=0?cur.splice(p,1):cur.push(i);answers[q.id]=cur;}else answers[q.id]=i;render();}
function back(){if(idx>0){idx--;render();}}
function next(){if(answers[questions[idx].id]===undefined){alert('Please select an answer before continuing.');return}if(idx<questions.length-1){idx++;render();}else evaluate();}
async function evaluate(){
 document.getElementById('app').innerHTML='<div class="panel" style="text-align:center;padding:70px"><h2>Running Resilience IQ...</h2><p style="color:var(--muted)">Applying decision branches, evidence confidence, hard constraints, pattern ranking and blueprint logic.</p></div>';
 try{const res=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({answers:mapAnswers()})});const j=await res.json();if(!j.ok)throw new Error(j.error||'Evaluation failed');result=j.data;renderReport();}catch(e){document.getElementById('app').innerHTML='<div class="panel"><h2>Evaluation failed</h2><p class="danger">'+esc(e.message)+'</p><button class="btn primary" onclick="render()">Retry</button></div>';}}
function mapAnswers(){const out={};for(const q of questions){const v=answers[q.id];if(q.type==='multi')out[q.id]=v.map(i=>q.o[i]);else out[q.id]=q.o[v];}return out;}
function renderReport(){const d=result;document.getElementById('app').innerHTML=`
<div class="hero"><h1>Resilience IQ Results</h1><p>${d.status==='ready'?'Executive assessment complete.':'Final recommendation is blocked until required business objectives and baseline questions are complete.'}</p></div>
<div class="grid">
<div class="stat"><div class="label">Resilience Posture</div><div class="value">${d.postureScore??'—'}</div></div>
<div class="stat"><div class="label">Critical Exposure</div><div class="value" style="font-size:20px">${esc(d.criticalExposure||'—')}</div></div>
<div class="stat"><div class="label">Rating</div><div class="value" style="font-size:20px">${esc(d.rating||'Incomplete')}</div></div>
<div class="stat"><div class="label">Maturity</div><div class="value" style="font-size:20px">${d.maturity?esc(d.maturity.label):'—'}</div></div>
<div class="stat"><div class="label">Evidence</div><div class="value" style="font-size:17px">${esc(d.evidenceConfidence)}</div></div>
</div>
<div class="panel">
<div class="section"><h2>Recovery Strategy</h2><p style="font-size:24px;font-weight:800">${esc(d.preferredPattern||'No final strategy yet')}</p><p style="color:var(--muted)">Primary recovery strategy is selected separately from cyber-recovery and supporting controls.</p></div>
<div class="section"><h2>Domain Scorecard</h2>${Object.entries(d.domainScores||{}).map(([k,v])=>`<div class="row"><b>${k}</b><span style="float:right">${v}/100</span></div>`).join('')}</div>
<div class="section"><h2>Critical Gaps</h2>${(d.gapRegister||[]).map(g=>`<div class="row"><span class="pill">${esc(g.severity)}</span> <b>${esc(g.name)}</b><div style="color:var(--muted);margin-top:5px">${esc(g.action)}</div></div>`).join('')||'<p>No material gaps returned.</p>'}</div>
<div class="section"><h2>Recovery Strategy Ranking</h2>${(d.patternRanking||[]).slice(0,5).map(p=>`<div class="row"><b>${esc(p.id)} — ${esc(p.name)}</b><span style="float:right">${p.score}/100</span><div style="color:var(--muted);margin-top:5px">${esc(p.fit)}</div></div>`).join('')}</div>
<div class="section"><h2>Technology Options</h2>${Object.entries(d.technologyOptions||{}).map(([k,v])=>`<div class="row"><b>${esc(k)}</b><div style="color:var(--muted);margin-top:5px">${v.map(esc).join(' · ')}</div></div>`).join('')||'<p style="color:var(--muted)">Provider mapping becomes available after a final pattern is selected.</p>'}</div>
<div class="section"><h2>Evidence Requests</h2><p>${(d.evidenceRequests||[]).map(x=>'<span class="pill" style="margin:3px">'+esc(x)+'</span>').join(' ')||'None'}</p></div>
<div class="section"><h2>Roadmap</h2>${(d.roadmap||[]).map(w=>`<div class="row"><b>${esc(w.wave)} · ${esc(w.window)}</b><div style="color:var(--muted);margin-top:6px">${(w.actions||[]).map(esc).join(' · ')}</div></div>`).join('')}</div>
<div class="bar"><button class="btn secondary" onclick="location.reload()">← Back to Assessment</button></div>
</div>`;}
render();
</script>
</body></html>
