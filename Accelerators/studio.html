<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Question Bank Studio — Accelerator Platform · LTM Vantage</title>
<script src="/assets/runtime-config.js"></script>
<script src="/assets/ltm-api.js"></script>
<script src="/assets/rbac-guard.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>:root{
  --ground:#FFFFFF;--panel:#F9F9F9;--panel2:#ECECEC;--line:#DADADA;
  --ink:#282828;--mut:#5B5B5B;--mutd:#8E8E8E;
  --navy:#282828;--red:#FF5E4F;--amber:#B26A00;--steel:#3C829B;--lilac:#5A3A83;--blue:#3C829B;--green:#35754D;
}
*{box-sizing:border-box;}html,body{margin:0;padding:0;height:100%;}
body{font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;color:var(--ink);background:var(--ground);line-height:1.5;}
.mono{font-family:'Manrope',sans-serif;}
.eyebrow{font-family:'Manrope',sans-serif;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--steel);}
h1,h2,h3{font-family:'Manrope',sans-serif;letter-spacing:-.01em;margin:0;}

/* shell */
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
 padding:11px clamp(14px,2.5vw,26px);border-bottom:1px solid var(--line);background:rgba(255,255,255,.9);position:sticky;top:0;z-index:20;}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;}
.mark{width:28px;height:28px;border-radius:6px;background:var(--red);box-shadow:inset 0 0 0 3px var(--ground);flex:none;}
.brand img{height:28px;max-width:140px;object-fit:contain;}
.bw b{font-family:'Manrope',sans-serif;font-size:14.5px;font-weight:600;display:block;line-height:1.2;}
.bw span{font-family:'Manrope',sans-serif;font-size:9px;letter-spacing:.14em;color:var(--mutd);text-transform:uppercase;}
.ph{font-family:'Manrope',sans-serif;font-size:8px;letter-spacing:.1em;color:var(--amber);border:1px solid var(--line);border-radius:4px;padding:1px 4px;margin-left:6px;}
.tabs{display:flex;gap:4px;}
.tab{font-family:'Manrope',sans-serif;font-size:11.5px;color:var(--mut);background:none;border:1px solid transparent;padding:7px 12px;border-radius:8px;cursor:pointer;}
.tab:hover{color:var(--ink);}.tab.on{background:var(--panel);color:var(--ink);border-color:var(--line);}
.barmeta{display:flex;align-items:center;gap:10px;font-family:'Manrope',sans-serif;font-size:11px;color:var(--mutd);}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);}
.dot.warn{background:var(--amber);}.dot.err{background:var(--red);}

.btn{font-family:'Manrope',sans-serif;font-weight:600;font-size:13px;padding:9px 15px;border-radius:9px;cursor:pointer;border:1px solid transparent;transition:background .12s,border-color .12s;}
.btn.primary{background:var(--red);color:#FFFFFF;}.btn.primary:hover{background:#E54536;}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);}.btn.ghost:hover{border-color:var(--steel);}
.btn.sm{font-size:11.5px;padding:6px 11px;}
.btn.danger{background:transparent;color:var(--red);border:1px solid rgba(255,94,79,.4);}
.btn.danger:hover{background:rgba(255,94,79,.1);}
.btn:disabled{opacity:.4;cursor:not-allowed;}

.wrap{max-width:1280px;margin:0 auto;padding:20px clamp(14px,2.5vw,26px) 60px;}
.split{display:grid;grid-template-columns:330px 1fr;gap:18px;align-items:start;}
.card{border:1px solid var(--line);border-radius:13px;background:var(--panel);padding:16px;}
.card h3{font-size:14.5px;margin-bottom:10px;}
.hint{color:var(--mut);font-size:12.5px;margin:0 0 12px;}
.field{margin-bottom:13px;}
.field label{display:block;font-size:11.5px;font-weight:600;margin-bottom:5px;color:var(--mut);}
.inp,select,textarea{width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--ground);color:var(--ink);font-family:inherit;font-size:13.5px;}
.inp:focus,select:focus,textarea:focus{outline:none;border-color:var(--steel);}
textarea{resize:vertical;min-height:64px;}
.inp.mono,textarea.mono{font-family:'Manrope',sans-serif;font-size:12px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:7px 0;}
.chk input{accent-color:var(--red);width:15px;height:15px;}

/* question list */
.qlist{display:flex;flex-direction:column;gap:5px;max-height:66vh;overflow-y:auto;padding-right:4px;}
.secgroup{margin-bottom:10px;}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:7px;background:var(--ground);margin-bottom:4px;}
.sechead .sn{font-family:'Manrope',sans-serif;font-size:10px;color:var(--steel);letter-spacing:.08em;}
.sechead .sl{flex:1;font-size:12.5px;font-weight:600;}
.qrow{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;border:1px solid transparent;background:var(--ground);cursor:pointer;font-size:12.5px;}
.qrow:hover{border-color:var(--line);}
.qrow.sel{border-color:var(--red);background:rgba(255,94,79,.09);}
.qid{font-family:'Manrope',sans-serif;font-size:10px;color:var(--mutd);min-width:36px;}
.qt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.qbadge{font-family:'Manrope',sans-serif;font-size:8.5px;padding:2px 5px;border-radius:4px;border:1px solid var(--line);color:var(--mutd);white-space:nowrap;}
.qbadge.crit{color:var(--red);border-color:rgba(255,94,79,.4);}
.qbadge.err{color:var(--red);border-color:var(--red);background:rgba(255,94,79,.12);}
.qmove{display:flex;flex-direction:column;gap:1px;}
.qmove button{width:18px;height:14px;border:none;background:none;color:var(--mutd);cursor:pointer;font-size:8px;padding:0;line-height:1;}
.qmove button:hover{color:var(--ink);}

/* option editor */
.optrow{display:grid;grid-template-columns:1fr 70px auto;gap:8px;align-items:center;margin-bottom:7px;}
.optrow.nosc{grid-template-columns:1fr auto;}
.iconbtn{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--ground);color:var(--mut);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;}
.iconbtn:hover{border-color:var(--red);color:var(--red);}
.pill{font-family:'Manrope',sans-serif;font-size:10px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--mut);}
.pill.ok{color:var(--green);border-color:rgba(53,117,77,.4);}
.pill.warn{color:var(--amber);border-color:rgba(178,106,0,.4);}
.pill.err{color:var(--red);border-color:rgba(255,94,79,.4);}

.stat{display:flex;gap:20px;flex-wrap:wrap;font-family:'Manrope',sans-serif;font-size:11px;color:var(--mut);}
.stat b{color:var(--ink);font-size:18px;font-family:'Manrope',sans-serif;display:block;}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}

.vitem{display:flex;gap:10px;padding:9px 11px;border-radius:8px;background:var(--ground);margin-bottom:6px;font-size:12.5px;align-items:flex-start;}
.vsev{font-family:'Manrope',sans-serif;font-size:9px;padding:2px 6px;border-radius:4px;flex:none;margin-top:1px;}
.vsev.err{background:rgba(255,94,79,.15);color:var(--red);}
.vsev.warn{background:rgba(178,106,0,.15);color:var(--amber);}
.vsev.info{background:rgba(60,130,155,.15);color:var(--steel);}
.vmsg{flex:1;} .vwhere{font-family:'Manrope',sans-serif;font-size:10px;color:var(--mutd);margin-top:2px;}

table.tbl{width:100%;border-collapse:collapse;font-size:12.5px;}
table.tbl th,table.tbl td{text-align:left;padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top;}
table.tbl th{font-family:'Manrope',sans-serif;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mutd);}

.prof{border:1px solid var(--line);border-radius:11px;padding:14px;background:var(--ground);cursor:pointer;margin-bottom:9px;}
.prof:hover{border-color:var(--steel);}
.prof.sel{border-color:var(--red);background:rgba(255,94,79,.07);}
.profname{font-family:'Manrope',sans-serif;font-weight:600;font-size:14px;margin-bottom:3px;}
.profdesc{color:var(--mut);font-size:12px;line-height:1.45;}
.proftools{font-family:'Manrope',sans-serif;font-size:9.5px;color:var(--mutd);margin-top:7px;}

.impact{border:1px solid var(--line);border-radius:10px;background:var(--ground);padding:12px 14px;margin:6px 0 12px;}
.impacthead{font-family:'Manrope',sans-serif;font-weight:600;font-size:12.5px;display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.idot{width:8px;height:8px;border-radius:50%;flex:none;}
.irow{display:flex;gap:9px;font-size:12.5px;color:var(--mut);line-height:1.5;margin-bottom:5px;align-items:flex-start;}
.irow b{color:var(--ink);font-weight:600;}
.ik{width:5px;height:5px;border-radius:50%;flex:none;margin-top:7px;background:var(--mutd);}
.ik.ok{background:var(--green);}.ik.warn{background:var(--amber);}.ik.err{background:var(--red);}
.dropzone{border:1px dashed var(--line);border-radius:11px;padding:26px;text-align:center;color:var(--mut);font-size:13px;background:var(--ground);}
.dropzone.hot{border-color:var(--steel);background:rgba(60,130,155,.06);}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--steel);padding:10px 17px;border-radius:9px;font-size:13px;z-index:99;box-shadow:0 8px 30px rgba(0,0,0,.45);max-width:80vw;}
.toast.err{border-color:var(--red);}
.empty{color:var(--mutd);font-size:13px;text-align:center;padding:36px 16px;}
code{font-family:'Manrope',sans-serif;font-size:11.5px;background:var(--ground);padding:1px 5px;border-radius:4px;color:var(--steel);}

@media(max-width:900px){.split{grid-template-columns:1fr;}.row2,.row3{grid-template-columns:1fr;}}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px;}

.jsoned,textarea.mono,.inp.mono,code{font-family:ui-monospace,Menlo,Consolas,monospace;}
</style>
</head>

<body>
<header class="bar">
  <div class="brand" id="brand"></div>
  <div style="display:flex;align-items:center;gap:10px">
    <span style="font-family:'Manrope',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mutd)">Accelerator:</span>
    <select id="accSelector" style="font-family:'Manrope',sans-serif;font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--ground);color:var(--ink);cursor:pointer">
      <option value="posture-iq">🛡️ Posture IQ</option>
      <option value="sovereign-iq">🌐 Sovereign IQ</option>
      <option value="cloud-iq">☁️ Cloud IQ</option>
      <option value="strategy-iq">🎯 Strategy IQ</option>
      <option value="modernization-iq">🏗️ Modernize IQ</option>
    </select>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="barmeta">
    <span class="dot" id="hdot"></span><span id="hmeta"></span>
    <div id="authStatus" style="margin-left:8px"></div>
  </div>
</header>

<!-- Cognito Auth Modal -->
<div id="loginModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);backdrop-filter:blur(4px);z-index:9999;align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:14px;box-shadow:0 12px 36px rgba(0,0,0,0.25);width:90%;max-width:400px;padding:28px;font-family:'Manrope',sans-serif">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">
      <h3 style="margin:0;font-size:18px;font-weight:800;color:var(--ink)">LTM Vantage Admin Login</h3>
      <button onclick="closeLoginModal()" style="border:none;background:none;font-size:20px;cursor:pointer;color:var(--mutd)">&times;</button>
    </div>
    <p style="font-size:13px;color:var(--mut);margin:0 0 16px;line-height:1.5">Sign in with your authorized LTM Cognito account to edit questions, weights, and scoring engines.</p>
    <div style="margin-bottom:12px">
      <label style="display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:var(--ink)">Email Address</label>
      <input id="loginEmail" type="email" placeholder="name@ltm.com" style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;font-family:'Manrope',sans-serif" />
    </div>
    <div style="margin-bottom:16px">
      <label style="display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:var(--ink)">Password</label>
      <input id="loginPassword" type="password" placeholder="••••••••••••" style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;font-family:'Manrope',sans-serif" />
    </div>
    <div id="loginError" style="display:none;color:var(--red);font-size:12.5px;margin-bottom:14px;background:#FFF0EF;padding:8px 12px;border-radius:6px;border:1px solid rgba(255,94,79,0.3)"></div>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button onclick="closeLoginModal()" class="btn ghost sm">Cancel</button>
      <button id="btnSubmitLogin" onclick="handleCognitoLogin()" class="btn primary sm" style="padding:10px 20px;font-weight:700">Sign In →</button>
    </div>
  </div>
</div>
<div id="app"></div>
<input type="file" id="fLogo" accept="image/*" style="display:none">
<input type="file" id="fImport" accept=".json,application/json" style="display:none">
<input type="file" id="fHtml" accept=".html,text/html" style="display:none">

"url": "https://www.enisa.europa.eu/topics/certification/eucs-cloud-services-scheme"}]}, {"id": "dataact", "name": "EU Data Act", "full": "Regulation (EU) 2023/2854 on harmonised rules on fair access to and use of data", "tag": "EU \u00b7 cloud switching & non-personal data access", "desc": "Cloud switching and portability obligations for data-processing services; safeguards against unlawful third-country access to non-personal data held in the EU. Applies from 12 September 2025; switching provisions phased.", "sources": [{"name": "Regulation (EU) 2023/2854 (Data Act) \u2014 EUR-Lex", "url": "https://eur-lex.europa.eu/eli/reg/2023/2854/oj"}, {"name": "Commission \u2014 EU Data Act", "url": "https://digital-strategy.ec.europa.eu/en/policies/data-act"}]}, {"id": "ukopres", "name": "UK Op Res", "full": "FCA PS21/3; PRA SS2/21 \u2014 Operational Resilience", "tag": "UK \u00b7 financial services resilience", "desc": "Impact tolerances for important business services, mapping, scenario testing, self-assessment and outsourcing / third-party risk expectations.", "sources": [{"name": "FCA PS21/3 \u2014 Building operational resilience", "url": "https://www.fca.org.uk/publications/policy-statements/ps21-3-building-operational-resilience"}, {"name": "PRA SS2/21 \u2014 Operational resilience", "url": "https://www.bankofengland.co.uk/prudential-regulation/publication/2021/march/operational-resilience-impact-tolerances-for-important-business-services-ss"}, {"name": "Bank of England \u2014 Operational resilience", "url": "https://www.bankofengland.co.uk/prudential-regulation/regulation/operational-resilience"}]}, {"id": "ukctp", "name": "UK CTP", "full": "Financial Services and Markets Act 2023, Part 9; FCA PS24/16; PRA PS16/24", "tag": "UK \u00b7 CTP oversight", "desc": "HM Treasury designations of Critical Third Parties to the UK financial sector; joint FCA / PRA / BoE oversight; six Fundamental Rules.", "sources": [{"name": "FSMA 2023 \u2014 Critical Third Parties (Part 9)", "url": "https://www.legislation.gov.uk/ukpga/2023/29/contents"}, {"name": "FCA PS24/16 \u2014 Operational resilience: CTPs", "url": "https://www.fca.org.uk/publications/policy-statements/ps24-16-operational-resilience-critical-third-parties"}, {"name": "PRA PS16/24 \u2014 CTPs to the UK financial sector", "url": "https://www.bankofengland.co.uk/prudential-regulation/publication/2024/november/operational-resilience-critical-third-parties-to-the-uk-financial-sector"}]}, {"id": "ukai", "name": "UK AI approach", "full": "ICO Guidance on AI and data protection; FCA AI update; PRA/BoE SS1/23 (Model risk management for AI/ML)", "tag": "UK \u00b7 principles-based AI regulation", "desc": "UK operates a principles-based, regulator-led approach to AI rather than a UK equivalent of the EU AI Act. ICO guidance on AI and data protection, FCA supervisory expectations for AI in regulated activities, and PRA/BoE SS1/23 on model risk management for AI/ML apply. Track further UK regulatory evolution.", "sources": [{"name": "ICO \u2014 Guidance on AI and data protection", "url": "https://ico.org.uk/for-organisations/uk-gdpr-guidance-and-resources/artificial-intelligence/guidance-on-ai-and-data-protection/"}, {"name": "FCA \u2014 AI update", "url": "https://www.fca.org.uk/publications/corporate-documents/our-approach-artificial-intelligence"}, {"name": "PRA / Bank of England SS1/23 \u2014 Model risk", "url": "https://www.bankofengland.co.uk/prudential-regulation/publication/2023/may/model-risk-management-principles-for-banks-ss"}, {"name": "UK Government \u2014 Pro-innovation approach to AI", "url": "https://www.gov.uk/government/publications/ai-regulation-a-pro-innovation-approach"}]}], "sectors": [{"id": "finserv", "name": "Banking & capital markets", "high": true, "regs": ["dora", "gdpr", "nis2", "ukopres", "ukctp", "dataact", "ukai"]}, {"id": "insurance", "name": "Insurance & pensions", "high": true, "regs": ["dora", "gdpr", "nis2", "ukopres", "ukctp", "dataact", "ukai"]}, {"id": "health", "name": "Healthcare providers", "high": true, "regs": ["nis2", "gdpr"]}, {"id": "pharma", "name": "Pharma & life sciences", "high": true, "regs": ["nis2", "gdpr", "aiact"]}, {"id": "telecom", "name": "Telecom & connectivity", "high": true, "regs": ["nis2", "gdpr"]}, {"id": "energy", "name": "Energy & utilities", "high": true, "regs": ["nis2", "gdpr"]}, {"id": "water", "name": "Water & waste", "high": true, "regs": ["nis2"]}, {"id": "transport", "name": "Transport & logistics", "high": true, "regs": ["nis2", "gdpr"]}, {"id": "diginfra", "name": "Digital infrastructure / cloud", "high": true, "regs": ["nis2", "eucs", "gdpr", "dataact"]}, {"id": "public", "name": "Public sector & government", "high": true, "regs": ["nis2", "gdpr"]}, {"id": "manuf", "name": "Manufacturing & industrial", "high": false, "regs": ["nis2", "gdpr"]}, {"id": "retail", "name": "Retail & e-commerce", "high": false, "regs": ["gdpr"]}, {"id": "tech", "name": "Technology & SaaS", "high": false, "regs": ["gdpr", "eucs"]}, {"id": "prof", "name": "Professional services", "high": false, "regs": ["gdpr"]}], "sections": [{"id": "scope", "num": "A", "title": "Regulatory scope & entity classification", "desc": "Establishes which obligations bite. NIS2 and DORA impose sharply different duties depending on how your entity is classified."}, {"id": "inventory", "num": "B", "title": "Data asset inventory & classification", "desc": "You cannot protect residency for data you have not classified. This maps sensitive categories to volume and criticality."}, {"id": "location", "num": "C", "title": "Data location & residency", "desc": "Where each category of data is stored and processed today, across cloud regions, SaaS and on-premises estate."}, {"id": "transfers", "num": "D", "title": "International transfers & transfer mechanisms", "desc": "Post-Schrems II, any flow of personal data outside the EEA/UK needs a valid mechanism and a transfer impact assessment."}, {"id": "vendors", "num": "E", "title": "Third-party processors & ICT supply chain", "desc": "Processor agreements (GDPR Art. 28), DORA ICT third-party risk, and NIS2 supply-chain security converge here."}, {"id": "resilience", "num": "F", "title": "Backup, DR, resilience & encryption", "desc": "Where backups live, how data is encrypted, and whether resilience arrangements themselves create residency exposure."}, {"id": "ai", "num": "G", "title": "AI systems & data governance", "desc": "Training-data residency, provenance and governance controls for AI \u2014 increasingly in scope under the EU AI Act and DORA."}, {"id": "cloud", "num": "H", "title": "Cloud sovereignty & assurance", "desc": "Operator jurisdiction, key custody and assurance level of the cloud platforms underpinning regulated workloads."}, {"id": "governance", "num": "I", "title": "Governance, contracts & audit rights", "desc": "Contractual audit rights, subprocessor control, register of information and accountable ownership."}, {"id": "incident", "num": "J", "title": "Incident detection & regulatory reporting", "desc": "Whether you can detect, and report within statutory windows, a breach or major ICT incident touching cross-border data."}, {"id": "outcomes", "num": "K", "title": "Programme constraints & target outcomes", "desc": "Compliance tolerance, investment appetite and performance constraints that shape a realistic remediation roadmap."}], "pillarConfig": [{"id": "P1", "num": "P1", "name": "Statutory Scope & Legal Classification", "desc": "NIS2 entity duties, DORA financial entity scope, and sensitive data category classification.", "sections": ["scope", "inventory"], "weight": 0.15}, {"id": "P2", "num": "P2", "name": "Technical Sovereignty & Key Custody", "desc": "Workload localization, extraterritorial subpoena exposure (CLOUD Act/FISA), cross-border egress, and HYOK.", "sections": ["location", "transfers", "cloud"], "weight": 0.25}, {"id": "P3", "num": "P3", "name": "Third-Party & ICT Supply Chain Assurance", "desc": "GDPR Art. 28 DPAs, DORA Art. 28 CTPP concentration, contract audit rights, and sub-processor lockbox.", "sections": ["vendors", "governance"], "weight": 0.25}, {"id": "P4", "num": "P4", "name": "Operational Resilience & Incident Reporting", "desc": "Backup geographic isolation, immutable storage, DORA exit strategies, and 24h/72h breach notification.", "sections": ["resilience", "incident"], "weight": 0.2}, {"id": "P5", "num": "P5", "name": "AI & Data Provenance Governance", "desc": "EU AI Act Art. 10 compliance, model training residency, data provenance documentation, and human oversight.", "sections": ["ai", "outcomes"], "weight": 0.15}], "flashQuestions": ["A1", "A2", "B1", "C1", "D1", "E1", "G1", "H1"], "demoArchetypes": {"bank": {"key": "bank", "name": "Meridian Pan-European Universal Bank", "badge": "BFSI \u00b7 DORA", "lead": "Chief Risk Officer / Head of Operational Resilience", "hq": "Germany", "resp": "Dr. Maximilian Weber", "role": "Chief Operational Risk Officer", "footprint": "EEA / EU only", "size": "> 20,000", "turnover": 8000000000, "sectors": ["finserv", "diginfra"], "regulations": ["dora", "gdpr", "nis2", "dataact"], "answers": {"A1": "essential", "A2": "credit", "B1": ["financial", "pii", "special"], "C1": ["aws-eu", "azure-eu", "onprem", "saas"], "C2": "multi", "C3": "partial", "D1": "sccs", "D2": "tier1", "D3": "partial", "E1": "most", "E2": "yes", "E3": "yes", "E4": "partial", "F1": "eu", "F2": "provider", "F3": "no", "F4": "yes", "F5": "partial", "G1": "highrisk", "G2": "mixed", "G3": "partial", "G4": "planned", "H1": "us-eubound", "H2": "no", "H3": "medium", "I1": "limited", "I2": "yes", "I3": "partial", "J1": "partial", "K1": "strict", "K2": "high", "K3": "performance"}}, "health": {"key": "health", "name": "Aethel MedTech & Pan-European Hospital Network", "badge": "MedTech \u00b7 AI Act", "lead": "CISO / Data Protection Officer", "hq": "France", "resp": "Claire Delacroix", "role": "Chief Information Security Officer & DPO", "footprint": "EEA / EU only", "size": "5,000\u201320,000", "turnover": 1200000000, "sectors": ["health", "pharma"], "regulations": ["nis2", "gdpr", "aiact"], "answers": {"A1": "essential", "B1": ["special", "pii", "aitraining"], "C1": ["azure-eu", "saas"], "C2": "single", "C3": "no", "D1": "sccs", "D2": "ad-hoc", "D3": "no", "E1": "most", "E2": "partial", "E3": "no", "E4": "no", "F1": "eu-enc", "F2": "provider", "F3": "no", "F4": "planned", "F5": "no", "G1": "highrisk", "G2": "us-dpf", "G3": "no", "G4": "no", "H1": "us", "H2": "no", "H3": "high", "I1": "limited", "I2": "no", "I3": "no", "J1": "partial", "K1": "strict", "K2": "medium", "K3": "compliance"}}, "utility": {"key": "utility", "name": "Consortium Energy & Power Grid Utility", "badge": "Critical Infra \u00b7 NIS2", "lead": "Head of IT/OT Cybersecurity & Critical Infrastructure", "hq": "Nordics", "resp": "Henrik Lindqvist", "role": "Head of Critical Cyber Infrastructure", "footprint": "EEA / EU only", "size": "1,000\u20135,000", "turnover": 3500000000, "sectors": ["energy", "diginfra"], "regulations": ["nis2", "gdpr", "eucs"], "answers": {"A1": "essential", "B1": ["government", "pii"], "C1": ["onprem", "aws-eu"], "C2": "hybrid", "C3": "partial", "D1": "no", "D2": "none", "D3": "yes", "E1": "all", "E2": "yes", "E3": "partial", "E4": "partial", "F1": "eu", "F2": "cmk-eu", "F3": "yes", "F4": "yes", "F5": "yes", "G1": "none", "H1": "us", "H2": "yes", "H3": "low", "I1": "full", "I2": "yes", "I3": "yes", "J1": "yes", "K1": "balanced", "K2": "high", "K3": "security"}}, "saas": {"key": "saas", "name": "Enterprise B2B SaaS & Payment Gateway", "badge": "SaaS \u00b7 Global", "lead": "VP Information Security & Compliance", "hq": "Ireland", "resp": "Sean O'Connor", "role": "VP Information Security & DPO", "footprint": "EU + US / global", "size": "250\u20131,000", "turnover": 300000000, "sectors": ["tech", "finserv"], "regulations": ["gdpr", "ukgdpr", "dora", "dataact"], "answers": {"A1": "important", "A2": "ict_ctpp", "B1": ["financial", "pii", "behavioural"], "C1": ["aws-global", "saas"], "C2": "multi", "C3": "no", "D1": "adequate", "D2": "tier1", "D3": "partial", "E1": "most", "E2": "partial", "E3": "yes", "E4": "no", "F1": "us-dpf", "F2": "provider", "F3": "no", "F4": "planned", "F5": "no", "G1": "embedded", "G2": "mixed", "G3": "partial", "G4": "no", "H1": "us", "H2": "no", "H3": "high", "I1": "limited", "I2": "partial", "I3": "no", "J1": "partial", "K1": "flexible", "K2": "medium", "K3": "performance"}}}, "dynamicProbes": [{"id": "PROBE_1_RESIDENCY_ILLUSION", "name": "The Residency Illusion Anomaly", "badge": "Extraterritorial Jurisdiction Risk", "relevantQids": ["C1", "H1", "F2"], "clientAssertion": "We host all production workloads in AWS Frankfurt / Azure Dublin, so GDPR Chapter V and DORA residency are fully satisfied.", "statutoryConflict": "Physical localization in Frankfurt or Dublin satisfies the territorial criterion, but leaves extraterritorial reach unmitigated. Under the US CLOUD Act (18 U.S.C. \u00a7 2713) and FISA \u00a7702, US law enforcement can issue lawful access orders directly to the US parent entity. Absent Hold-Your-Own-Key (HYOK) with client-held HSMs, the cloud provider can be compelled to decrypt data without client notice, directly conflicting with GDPR Art. 48 and EU Data Act Art. 32.", "interrogationScript": "Physical localization in Frankfurt satisfies half the equation, but leaves legal reach completely unmitigated. Under the US CLOUD Act, your contract with a US-headquartered parent entity means US courts have legal reach over the data, regardless of physical location. If a lawful access order is served, can you technically prevent the provider from decrypting data? Who on your executive risk committee has formally approved this residual legal exposure?"}, {"id": "PROBE_2_SAAS_BLINDSPOT", "name": "The Enterprise SaaS Administrative Blindspot", "badge": "Supply Chain & Shadow Egress", "relevantQids": ["C1", "B1", "F2", "E1"], "clientAssertion": "Microsoft 365, Salesforce, and ServiceNow are standard enterprise SaaS tools covered by our corporate SOC 2 and ISO 27001 certifications.", "statutoryConflict": "Enterprise SaaS represents the largest unmapped data leakage channel in modern enterprises. Multi-tenant SaaS environments routinely grant global SREs and support engineers follow-the-sun privileged access to diagnose incidents. Tenant data is encrypted with vendor-managed keys, violating DORA Art. 28 and NIS2 Art. 21 supply chain obligations.", "interrogationScript": "Enterprise SaaS represents the single largest unmapped data leakage channel in modern enterprises. While customer data sits in regional datacenters, vendor support engineers operating out of follow-the-sun global centers possess privileged access to diagnose incidents. Have you implemented Customer Lockbox to mandate explicit approval for every vendor session, and deployed tenant-held cache keys (such as M365 Customer Key or Salesforce Shield) to enforce cryptographic opacity?"}, {"id": "PROBE_3_DORA_EXIT", "name": "The DORA & APRA Concentration Cliff (The Exit Strategy Myth)", "badge": "Operational Resilience Non-Compliance", "relevantQids": ["F3", "F4", "C1"], "clientAssertion": "Our primary cloud provider has four Availability Zones and a 99.99% SLA. Our exit plan is documented in our annual Disaster Recovery handbook.", "statutoryConflict": "DORA Art. 28(8), UK CTP (FSMA 2023 Part 9), and APRA CPS 230 explicitly mandate tested, feasible exit strategies from Critical ICT Third-Party Providers (CTPPs). A Disaster Recovery plan within the same hyperscaler does not qualify as an exit strategy. If the provider suffers a systemic outage, sanctions, or contractual dispute, moving proprietary PaaS services takes 18\u201324+ months without containerized portability.", "interrogationScript": "Regulators distinguish sharply between high availability and vendor exitability. DORA and APRA require an auditable playbook to migrate critical functions away from a concentrated provider without operational disruption. When was the last time you simulated an actual technical cutover of a core business service to an alternative provider or private cloud enclave? If your primary provider experienced a systemic lockout, what is your verified cutover timeline?"}, {"id": "PROBE_4_AI_DRIFT", "name": "Unregulated AI Training Data Drift", "badge": "EU AI Act Art. 10 Statutory Exposure", "relevantQids": ["G1", "G2"], "clientAssertion": "Our AI models were trained internally on enterprise data, and we access external LLMs via enterprise APIs with zero-retention contractual clauses.", "statutoryConflict": "EU AI Act Art. 10 imposes strict governance mandates on high-risk AI data provenance, bias mitigation, and training validation. Processing European customer data through out-of-region compute instances or fine-tuning models without auditable training lineage triggers compounding penalties up to \u20ac35M or 7% of worldwide turnover under Art. 99.", "interrogationScript": "The EU AI Act and GDPR treat AI inference and fine-tuning as restricted data processing. If prompt tokens or fine-tuning datasets traverse out-of-EEA compute nodes, you face compounding penalties under both GDPR Chapter V and AI Act Art. 10. Do you possess an immutable provenance register verifying exactly which training epochs touched customer data, and are your GenAI workloads confined to certified EU sovereign AI fabrics?"}, {"id": "PROBE_5_ONPREM_BACKDOOR", "name": "The Remote Management Telemetry Backdoor", "badge": "Hardware Supply Chain Egress", "relevantQids": ["C1", "H1", "E4"], "clientAssertion": "Our critical core runs on-premises in our own private data center; therefore, we have zero foreign access exposure.", "statutoryConflict": "Modern enterprise server management controllers (Dell iDRAC, HPE iLO), storage arrays, and network firewalls frequently maintain active telemetry and remote diagnostic tunnels (call-home) connected to foreign vendor support clouds. This creates an unmonitored management plane backdoor bypassing perimeter controls under NIS2 Art. 21.", "interrogationScript": "While physical servers sit inside your perimeter, the management plane often connects outbound to foreign vendor telemetry centers. Are your out-of-band management controllers strictly air-gapped on isolated VLANs with all phone-home diagnostic telemetry blocked? Has the hardware bill of materials been audited against clean supply chain standards (such as NDAA Section 889)?"}, {"id": "PROBE_6_KMS_BYOK_ILLUSION", "name": "The Cloud-Native KMS Lock-In (The BYOK Illusion)", "badge": "Cryptographic Custody Risk", "relevantQids": ["F2", "H1"], "clientAssertion": "We use AWS KMS and Azure Key Vault with our own Customer Managed Keys (CMK), so the cloud provider cannot decrypt our data.", "statutoryConflict": "A cloud-native CMK is still hosted inside the cloud provider's hardware security modules (HSMs). The provider's hypervisor executes cryptographic operations in plaintext in volatile RAM. Under FISA \u00a7702 or CLOUD Act direct subpoenas, the provider can be compelled to decrypt workloads in memory without client involvement, failing EDPB Schrems II supplementary measure requirements.", "interrogationScript": "Cloud-managed keys (CMK) protect against external hackers, but provide zero legal protection against the cloud provider itself. Under cloud-native KMS, the provider controls the hypervisor and the HSM where your key is instantiated. If the provider is compelled under a lawful access warrant, they possess the technical ability to decrypt your workloads in volatile RAM. True technical defensibility requires Hold-Your-Own-Key (HYOK)\u2014where the root of trust resides in external HSMs under your exclusive physical control."}], "questions": [{"id": "A1", "section": "scope", "type": "single", "text": "Under NIS2, how is your entity classified?", "help": "NIS2 splits organisations into 'essential' and 'important' entities, each with different supervisory and penalty regimes. Classification usually follows sector and size.", "refs": [{"reg": "nis2", "a": "Art. 3, Annexes I\u2013II"}], "appliesTo": {"regulations": ["nis2"]}, "options": [{"value": "essential", "label": "Essential entity (e.g. energy, transport, banking, health, digital infrastructure, ICT service management)", "sev": "high", "findings": [{"reg": "nis2", "a": "Art. 3, 32", "severity": "high", "title": "Essential-entity supervisory regime applies", "detail": "As an essential entity you are subject to proactive (ex-ante) supervision, on-site inspections and the highest tier of administrative fines (up to \u20ac10m or 2% of global turnover).", "phase": 1, "remedy": "Confirm classification with your national competent authority and register accordingly.", "steps": ["Confirm classification against the national NIS2 transposition", "Register with the competent authority within the national deadline", "Map essential-entity obligations to an accountable executive owner"]}]}, {"value": "important", "label": "Important entity (e.g. manufacturing, postal, waste, chemicals, food, digital providers)", "sev": "medium", "findings": [{"reg": "nis2", "a": "Art. 3, 33", "severity": "medium", "title": "Important-entity duties apply", "detail": "Important entities face ex-post supervision but the same core security and reporting obligations, with fines up to \u20ac7m or 1.4% of global turnover.", "phase": 1, "remedy": "Register and align security measures to Art. 21.", "steps": ["Register with the competent authority", "Baseline current measures against Art. 21 risk-management requirements"]}]}, {"value": "unsure", "label": "Unsure / not yet assessed", "sev": "high", "findings": [{"reg": "nis2", "a": "Art. 3", "severity": "high", "title": "NIS2 classification not yet determined", "detail": "Operating without a confirmed NIS2 classification means obligations, registration deadlines and reporting duties may already be unmet.", "phase": 1, "remedy": "Run a formal scoping exercise against national transposition rules.", "steps": ["Commission a NIS2 applicability assessment", "Cross-check sector + size thresholds against Annexes I\u2013II", "Document the determination for the competent authority"]}]}, {"value": "na", "label": "Not in scope of NIS2", "sev": "positive", "findings": []}]}, {"id": "A2", "section": "scope", "type": "single", "text": "Under DORA, which type of financial entity are you?", "help": "DORA applies to a broad set of financial entities and to the ICT providers serving them. The obligations scale with entity type and systemic importance.", "refs": [{"reg": "dora", "a": "Art. 2"}], "appliesTo": {"regulations": ["dora"]}, "options": [{"value": "credit", "label": "Credit institution / bank", "sev": "high", "findings": [{"reg": "dora", "a": "Art. 5\u201315", "severity": "high", "title": "Full DORA ICT risk-management framework required", "detail": "Credit institutions must operate a documented ICT risk-management framework, maintain a register of information on all ICT third-party arrangements, and manage concentration risk.", "phase": 1, "remedy": "Confirm the ICT risk framework and register of information are in place and current.", "steps": ["Confirm board-approved ICT risk-management framework", "Verify the register of information covers all ICT arrangements", "Identify contracts supporting critical or important functions"]}]}, {"value": "invest", "label": "Investment firm / asset manager / trading venue", "sev": "high", "findings": [{"reg": "dora", "a": "Art. 5\u201315, 28", "severity": "high", "title": "DORA third-party and resilience duties apply", "detail": "Investment and asset-management firms must manage ICT third-party risk, test operational resilience and ensure critical functions can withstand disruption to cross-border ICT providers.", "phase": 1, "remedy": "Map critical/important functions to underlying ICT providers and their data locations.", "steps": ["Inventory critical/important business functions", "Map each to supporting ICT services and their processing locations", "Assess exit and substitutability for each"]}]}, {"value": "insurer", "label": "Insurer / reinsurer / IORP", "sev": "high", "findings": [{"reg": "dora", "a": "Art. 5\u201315", "severity": "high", "title": "DORA applies to insurance undertakings", "detail": "Insurers must embed ICT risk management and third-party oversight, including data-location transparency for outsourced functions.", "phase": 1, "remedy": "Extend existing outsourcing governance to meet DORA's ICT-specific requirements.", "steps": ["Gap-assess current outsourcing policy against DORA Art. 28\u201330", "Update contracts to include mandatory DORA clauses"]}]}, {"value": "payment-emi", "label": "Payment institution / e-money institution (PI / EMI)", "sev": "high", "findings": [{"reg": "dora", "a": "Art. 2, 5\u201315", "severity": "high", "title": "DORA ICT framework + PSD2 obligations", "detail": "PIs and EMIs fall in DORA scope and simultaneously carry PSD2 obligations (SCA, AIS/PIS access, incident reporting to competent authority). ICT third-party risk, register of information and contractual clauses apply.", "phase": 1, "remedy": "Ensure the DORA framework is in place alongside PSD2 operational and outsourcing controls.", "steps": ["Confirm DORA ICT risk framework covers PSD2 processes", "Verify SCA and incident-reporting readiness", "Register ICT third-party arrangements including data locations"]}]}, {"value": "casp", "label": "Crypto-asset service provider (CASP)", "sev": "high", "findings": [{"reg": "dora", "a": "Art. 2, 5\u201315", "severity": "high", "title": "DORA applies to CASPs + MiCA authorisation", "detail": "MiCA-authorised CASPs providing services in the EU are DORA-in-scope. ICT risk management, third-party arrangements and resilience testing apply alongside MiCA prudential and safeguarding rules.", "phase": 1, "remedy": "Align DORA ICT framework with MiCA authorisation and safeguarding requirements.", "steps": ["Confirm DORA framework is fit for a MiCA-authorised firm", "Cover crypto-custody arrangements as ICT third-party arrangements", "Include CASP-specific scenarios in resilience testing"]}]}, {"value": "other-fin", "label": "Other financial entity (crowdfunding, credit rating agency, benchmark administrator, etc.)", "sev": "medium", "findings": [{"reg": "dora", "a": "Art. 2", "severity": "medium", "title": "DORA proportionality applies", "detail": "Smaller or specialised financial entities benefit from a proportionate regime but core ICT risk and third-party obligations still apply.", "phase": 2, "remedy": "Confirm which proportionality carve-outs apply and document the rationale.", "steps": ["Confirm entity type and any simplified regime", "Document proportionality decisions"]}]}, {"value": "na", "label": "Not a financial entity under DORA", "sev": "positive", "findings": []}]}, {"id": "A3", "section": "scope", "type": "single", "text": "For personal data, what is the primary jurisdiction of your data subjects?", "help": "This determines whether EU GDPR, UK GDPR or both apply, and sets the baseline residency expectation.", "refs": [{"reg": "gdpr", "a": "Art. 3"}, {"reg": "ukgdpr", "a": "Art. 3"}], "options": [{"value": "eea", "label": "EEA / EU only", "sev": "positive", "findings": []}, {"value": "uk", "label": "UK only", "sev": "positive", "findings": []}, {"value": "euuk", "label": "EU + UK", "sev": "low", "findings": [{"reg": "ukgdpr", "a": "Art. 44\u201349", "severity": "low", "title": "Dual EU/UK regime \u2014 divergence risk", "detail": "Operating under both regimes means EU\u2013UK data flows rely on the current UK adequacy decision, which is subject to periodic review and possible expiry.", "phase": 2, "remedy": "Maintain a fallback transfer mechanism (SCCs + IDTA) in case adequacy lapses.", "steps": ["Confirm reliance on the EU\u2192UK adequacy decision", "Prepare SCC/IDTA fallback documentation"]}]}, {"value": "global", "label": "EU/UK + US / global footprint", "sev": "medium", "findings": [{"reg": "gdpr", "a": "Art. 44", "severity": "medium", "title": "Global footprint triggers transfer scrutiny", "detail": "A global data-subject footprint substantially increases the surface area for unlawful cross-border transfers and jurisdictional conflict.", "phase": 2, "remedy": "Prioritise a full transfer-mapping exercise (Section D).", "steps": ["Map all cross-border personal-data flows", "Identify transfers lacking a valid Chapter V mechanism"]}]}]}, {"id": "A4", "section": "scope", "type": "boolean", "text": "Has a data-flow map (data mapping / RoPA) been produced and kept current in the last 12 months?", "help": "A Record of Processing Activities under GDPR Art. 30 \u2014 and an equivalent data-flow inventory \u2014 is the foundation of every residency control.", "refs": [{"reg": "gdpr", "a": "Art. 30"}, {"reg": "dora", "a": "Art. 8"}], "options": [{"value": "yes", "label": "Yes \u2014 current within 12 months", "sev": "positive", "findings": []}, {"value": "partial", "label": "Partial / out of date", "sev": "medium", "findings": [{"reg": "gdpr", "a": "Art. 30", "severity": "medium", "title": "Data mapping incomplete or stale", "detail": "An out-of-date RoPA means residency findings in this report are working from partial visibility; new systems and flows may be unmapped.", "phase": 1, "remedy": "Refresh the RoPA and data-flow inventory before finalising architecture decisions.", "steps": ["Refresh RoPA to cover all current systems", "Reconcile against actual cloud/SaaS inventory", "Establish a quarterly review cadence"]}]}, {"value": "no", "label": "No", "sev": "high", "findings": [{"reg": "gdpr", "a": "Art. 30", "severity": "high", "title": "No record of processing activities", "detail": "Absence of a RoPA is itself a GDPR compliance gap and prevents reliable residency assessment.", "phase": 1, "remedy": "Stand up a RoPA / data-flow inventory as a priority.", "steps": ["Commission a data-discovery and mapping exercise", "Document processing purposes, categories, recipients and locations", "Assign ongoing ownership to the DPO / data office"]}]}]}, {"id": "B1", "section": "inventory", "type": "multi", "text": "Which categories of sensitive data does your organisation process?", "help": "Special-category and financial data carry heightened residency and security expectations across all regimes.", "refs": [{"reg": "gdpr", "a": "Art. 9"}], "options": [{"value": "pii", "label": "Personal data (names, contact details, identifiers)", "sev": "medium", "findings": [{"reg": "gdpr", "a": "Art. 5, 32", "severity": "medium", "title": "Personal data in scope", "detail": "General personal data must be processed with appropriate security and a lawful residency posture.", "phase": 2, "remedy": "Ensure all personal-data stores are covered by the residency controls in Sections C\u2013D.", "steps": ["Confirm all PII stores are inventoried", "Apply baseline encryption and access control"]}]}, {"value": "special", "label": "Special-category data (health, biometric, ethnicity, beliefs)", "sev": "high", "findings": [{"reg": "gdpr", "a": "Art. 9", "severity": "high", "title": "Special-category data present", "detail": "Art. 9 data demands an explicit condition for processing plus enhanced safeguards; cross-border exposure is materially higher risk.", "phase": 1, "remedy": "Confirm an Art. 9 condition and lock storage to the highest-assurance region available.", "steps": ["Document the Art. 9 processing condition for each dataset", "Restrict special-category stores to EEA/UK regions", "Apply enhanced encryption and least-privilege access"]}]}, {"value": "financial", "label": "Financial / transactional data (accounts, payments, cards)", "sev": "high", "findings": [{"reg": "dora", "a": "Art. 3 (definitions), Art. 5", "severity": "high", "title": "Financial data supports critical or important functions", "detail": "Financial and payment data typically supports critical or important functions under DORA \u2014 its residency and availability drive operational-resilience obligations, ICT third-party clauses and the register of information. National banking-secrecy rules and, for card data, PCI DSS impose additional obligations.", "phase": 1, "remedy": "Treat financial data stores as supporting critical or important functions; confirm PCI DSS scope for card data.", "steps": ["Classify financial data stores by criticality", "Confirm PCI DSS scope for cardholder data", "Confirm resilience and residency for each store"]}]}, {"value": "behavioural", "label": "Customer behavioural / analytics data", "sev": "medium", "findings": [{"reg": "gdpr", "a": "Art. 6", "severity": "medium", "title": "Behavioural data often flows to third parties", "detail": "Analytics and behavioural datasets frequently transit to SaaS platforms in non-EEA jurisdictions, creating transfer exposure.", "phase": 2, "remedy": "Trace behavioural data to its downstream processors (Section E).", "steps": ["Identify analytics/behavioural data recipients", "Confirm processor agreements and processing locations"]}]}, {"value": "aitraining", "label": "AI / ML training datasets", "sev": "high", "findings": [{"reg": "aiact", "a": "Art. 10", "severity": "high", "title": "Training data in scope of AI Act governance", "detail": "Where AI systems are high-risk, training, validation and testing data are subject to specific governance and provenance requirements.", "phase": 2, "remedy": "Establish provenance and residency controls for training data (Section G).", "steps": ["Inventory training/validation/test datasets", "Document data provenance and lineage", "Confirm residency of the training environment"]}]}, {"value": "proprietary", "label": "Proprietary / commercially sensitive business data", "sev": "low", "findings": [{"reg": "nis2", "a": "Art. 21", "severity": "low", "title": "Business-critical data protection", "detail": "Proprietary data loss can constitute a significant incident; NIS2 expects proportionate protection.", "phase": 3, "remedy": "Include proprietary data in the resilience and access-control scope.", "steps": ["Classify proprietary data sensitivity", "Apply access control consistent with NIS2 Art. 21"]}]}, {"value": "government", "label": "Government / classified / restricted data", "sev": "critical", "findings": [{"reg": "eucs", "a": "High assurance", "severity": "critical", "title": "Government/classified data demands sovereign controls", "detail": "Restricted or classified data typically cannot lawfully reside on cloud services controlled from non-EU jurisdictions and may require High-assurance sovereign hosting.", "phase": 1, "remedy": "Confirm sovereign hosting and key custody for all classified data.", "steps": ["Confirm national handling rules for the classification level", "Restrict to sovereign / High-assurance platforms", "Ensure keys are held under EU/national control"]}]}]}, {"id": "B2", "section": "inventory", "type": "scale", "text": "Approximately what volume of sensitive data (personal, financial, special-category) do you hold?", "help": "Volume scales both regulatory exposure and remediation effort. Breach impact and notification burden grow with volume.", "refs": [{"reg": "gdpr", "a": "Art. 32"}], "scale": [{"v": 1, "label": "< 100 GB", "sev": "low", "findings": []}, {"v": 2, "label": "100 GB \u2013 1 TB", "sev": "low", "findings": []}, {"v": 3, "label": "1 \u2013 10 TB", "sev": "medium", "findings": [{"reg": "gdpr", "a": "Art. 32\u201334", "severity": "medium", "title": "Material data volume raises breach impact", "detail": "At multi-terabyte scale, a residency or security failure affects a large data-subject population, escalating notification and remediation cost.", "phase": 2, "remedy": "Prioritise encryption and access segmentation for the largest stores.", "steps": ["Identify the largest sensitive-data stores", "Confirm encryption and segmentation for each"]}]}, {"v": 4, "label": "10 \u2013 100 TB", "sev": "high", "findings": [{"reg": "gdpr", "a": "Art. 32\u201334", "severity": "high", "title": "Large-scale processing", "detail": "Large-scale processing of sensitive data triggers heightened accountability, likely a DPIA, and severe breach consequences.", "phase": 1, "remedy": "Confirm a DPIA is in place and residency is centrally governed.", "steps": ["Confirm DPIA coverage for large-scale processing", "Centralise residency governance"]}]}, {"v": 5, "label": "> 100 TB", "sev": "high", "findings": [{"reg": "gdpr", "a": "Art. 35", "severity": "high", "title": "Very large-scale processing", "detail": "At this scale, systematic monitoring and DPIA obligations are almost certainly engaged and any residency failure is systemically material.", "phase": 1, "remedy": "Treat residency as a board-level operational risk.", "steps": ["Elevate data residency to the enterprise risk register", "Ensure DPIA and prior-consultation readiness"]}]}]}, {"id": "C1", "section": "location", "type": "multi", "text": "Which cloud and hosting platforms run your production systems?", "help": "Operator jurisdiction and region selection are the primary levers of data residency.", "refs": [{"reg": "gdpr", "a": "Art. 44"}, {"reg": "eucs", "a": "Assurance"}], "options": [{"value": "aws-eu", "label": "AWS \u2014 EU regions only", "sev": "positive", "findings": []}, {"value": "aws-global", "label": "AWS \u2014 includes non-EU regions", "sev": "high", "findings": [{"reg": "gdpr", "a": "Art. 44", "severity": "high", "title": "Production workloads in non-EU cloud regions", "detail": "Personal data processed in non-EU regions constitutes a restricted transfer requiring a valid Chapter V mechanism and, for US operators, exposure to foreign government access.", "phase": 1, "remedy": "Confirm which workloads sit outside the EU and lock personal-data workloads to EU regions.", "steps": ["Enumerate all non-EU regions in use", "Identify personal-data workloads among them", "Migrate or region-lock personal-data workloads to EU"]}]}, {"value": "azure-eu", "label": "Microsoft Azure \u2014 EU regions only", "sev": "positive", "findings": []}, {"value": "azure-global", "label": "Microsoft Azure \u2014 includes non-EU regions", "sev": "high", "findings": [{"reg": "gdpr", "a": "Art. 44", "severity": "high", "title": "Azure workloads in non-EU regions", "detail": "Non-EU Azure regions processing personal data create restricted transfers and potential CLOUD Act exposure via a US-controlled operator.", "phase": 1, "remedy": "Region-lock personal-data workloads to EU Azure regions.", "steps": ["Audit Azure region configuration", "Apply Azure Policy to restrict region deployment", "Migrate non-compliant workloads"]}]}, {"value": "gcp-eu", "label": "Google Cloud \u2014 EU regions only", "sev": "positive", "findings": []}, {"value": "gcp-global", "label": "Google Cloud \u2014 includes non-EU regions", "sev": "high", "findings": [{"reg": "gdpr", "a": "Art. 44", "severity": "high", "title": "GCP workloads in non-EU regions", "detail": "Non-EU GCP regions processing personal data create restricted transfers and potential CLOUD Act exposure via a US-controlled operator.", "phase": 1, "remedy": "Region-lock personal-data workloads to EU GCP regions.", "steps": ["Audit GCP region configuration", "Apply Organization Policy to restrict region deployment", "Migrate non-compliant workloads"]}]}, {"value": "oracle-eu", "label": "Oracle Cloud \u2014 EU regions only", "sev": "low", "findings": [{"reg": "gdpr", "a": "Art. 44", "severity": "low", "title": "US-HQ operator in use (Oracle Cloud) \u2014 even EU-only", "detail": "Oracle Cloud EU regions constrain data location, but operator jurisdiction remains the United States; extraterritorial access risk under the CLOUD Act should still be assessed at the workload level.", "phase": 2, "remedy": "Assess CLOUD Act residual risk for the most sensitive workloads.", "steps": ["Confirm all Oracle Cloud regions are EU", "Assess residual CLOUD Act exposure for the most sensitive workloads", "Consider EU-controlled alternatives for highest tier"]}]}, {"value": "oracle-global", "label": "Oracle Cloud \u2014 includes non-EU regions", "sev": "high", "findings": [{"reg": "gdpr", "a": "Art. 44", "severity": "high", "title": "Oracle Cloud workloads in non-EU regions", "detail": "Non-EU Oracle Cloud regions processing personal data create restricted transfers and CLOUD Act exposure via a US-controlled operator.", "phase": 1, "remedy": "Region-lock personal-data workloads to EU Oracle Cloud regions.", "steps": ["Audit Oracle Cloud region configuration", "Restrict provisioning to EU regions", "Migrate non-compliant workloads"]}]}, {"value": "ibm-eu", "label": "IBM Cloud \u2014 EU regions only", "sev": "low", "findings": [{"reg": "gdpr", "a": "Art. 44", "severity": "low", "title": "US-HQ operator in use (IBM Cloud) \u2014 even EU-only", "detail": "IBM Cloud EU regions constrain data location, but operator jurisdiction remains the United States; assess residual extraterritorial access risk.", "phase": 2, "remedy": "Confirm region residency and assess CLOUD Act residual risk.", "steps": ["Confirm all IBM Cloud regions are EU", "Assess residual CLOUD Act exposure for the most sensitive workloads"]}]}, {"value": "ibm-global", "label": "IBM Cloud \u2014 includes non-EU regions", "sev": "high", "findings": [{"reg": "gdpr", "a": "Art. 44", "severity": "high", "title": "IBM Cloud workloads in non-EU regions", "detail": "Non-EU IBM Cloud regions processing personal data create restricted transfers and CLOUD Act exposure via a US-controlled operator.", "phase": 1, "remedy": "Region-lock personal-data workloads to EU IBM Cloud regions.", "steps": ["Audit IBM Cloud region configuration", "Restrict provisioning to EU regions", "Migrate non-compliant workloads"]}]}, {"value": "salesforce", "label": "Salesforce / Heroku (US-controlled)", "sev": "medium", "findings": [{"reg": "gdpr", "a": "Art. 44", "severity": "medium", "title": "Salesforce / Heroku is a US-HQ SaaS operator", "detail": "Salesforce and Heroku operate under US jurisdiction; even EU-hosted tenants remain within CLOUD Act reach via the operator. Assess supplementary measures and data residency clauses.", "phase": 2, "remedy": "Confirm EU hosting, tenant isolation and DPF certification (if applicable).", "steps": ["Confirm EU data residency for the Salesforce org", "Check Salesforce DPF-list entry", "Add supplementary encryption for sensitive fields"]}]}, {"value": "snowflake", "label": "Snowflake (US-HQ, region-selectable)", "sev": "medium", "findings": [{"reg": "gdpr", "a": "Art. 44", "severity": "medium", "title": "Snowflake \u2014 US-HQ operator, region matters", "detail": "Snowflake supports EU regions but is a US-HQ operator; region selection alone does not remove CLOUD Act exposure.", "phase": 2, "remedy": "Confirm EU region + assess CLOUD Act residual risk.", "steps": ["Confirm Snowflake account region is EU", "Enable customer-managed encryption keys where available", "Assess DPF certification and supplementary measures"]}]}, {"value": "databricks", "label": "Databricks (US-HQ, region-selectable)", "sev": "medium", "findings": [{"reg": "gdpr", "a": "Art. 44", "severity": "medium", "title": "Databricks \u2014 US-HQ operator, region matters", "detail": "Databricks supports EU regions but is a US-HQ operator; region selection alone does not remove CLOUD Act exposure \u2014 relevant especially for training-data workloads.", "phase": 2, "remedy": "Confirm EU region and assess CLOUD Act residual risk; consider EU-controlled ML platforms for the most sensitive workloads.", "steps": ["Confirm Databricks workspace region is EU", "Assess CLOUD Act residual risk", "Evaluate sovereign alternatives for the most sensitive workloads"]}]}, {"value": "sovereign", "label": "Sovereign / EU-controlled cloud (e.g. EUCS-aligned, Gaia-X, national)", "sev": "positive", "findings": [{"reg": "eucs", "a": "High assurance", "severity": "positive", "title": "Sovereign platform in use", "detail": "An EU-controlled or sovereign platform substantially reduces jurisdictional exposure for regulated workloads.", "phase": 3, "remedy": "Confirm the assurance level meets the sensitivity of hosted data.", "steps": ["Verify certified assurance level", "Match assurance level to data classification"]}]}, {"value": "onprem", "label": "On-premises / private data centre", "sev": "positive", "findings": []}, {"value": "colo", "label": "Third-party colocation / managed hosting", "sev": "low", "findings": [{"reg": "nis2", "a": "Art. 21", "severity": "low", "title": "Managed-hosting supply-chain dependency", "detail": "Colocation and managed hosting introduce a supply-chain dependency that must be governed under NIS2 supply-chain security.", "phase": 3, "remedy": "Include hosting provider in supply-chain risk assessment.", "steps": ["Add hosting provider to the supplier register", "Confirm physical and jurisdictional controls"]}]}]}, {"id": "C2", "section": "location", "type": "matrix", "text": "For each sensitive data category, where is it stored and processed today?", "help": "This is the residency heart of the assessment. 'Unknown' is scored as a risk in its own right.", "refs": [{"reg": "gdpr", "a": "Art. 44"}, {"reg": "dora", "a": "Art. 5"}], "rows": [{"id": "pii", "label": "Personal data"}, {"id": "special", "label": "Special-category data"}, {"id": "financial", "label": "Financial data"}, {"id": "behavioural", "label": "Behavioural / analytics data"}, {"id": "aitraining", "label": "AI / ML training data"}, {"id": "government", "label": "Government / classified / restricted data"}], "cols": [{"id": "eu-only", "label": "EU region only", "sev": "positive"}, {"id": "uk-only", "label": "UK region only", "sev": "positive"}, {"id": "eu-backup", "label": "EU + encrypted non-EU backup", "sev": "low"}, {"id": "us-dpf", "label": "US cloud with DPF-certified processor", "sev": "low"}, {"id": "us-cloud", "label": "US / non-EU cloud (no DPF)", "sev": "critical"}, {"id": "multi", "label": "Multi-region global", "sev": "high"}, {"id": "unknown", "label": "Unknown", "sev": "high"}], "cellFindings": {"us-cloud": {"reg": "gdpr", "a": "Art. 44\u201349", "severity": "critical", "title": "{row} located in a non-EU jurisdiction", "detail": "Storing {rowlower} in US/non-EU cloud is a restricted transfer that is unlawful absent a valid mechanism, and exposes the data to foreign government access requests.", "phase": 1, "remedy": "Migrate {rowlower} to an EU region or a valid transfer mechanism with supplementary measures.", "steps": ["Confirm the exact location and operator of {rowlower}", "Assess whether a valid Chapter V mechanism exists", "Migrate to EU region or implement SCCs + supplementary measures"]}, "multi": {"reg": "gdpr", "a": "Art. 44", "severity": "high", "title": "{row} replicated across multiple regions", "detail": "Multi-region replication of {rowlower} means copies exist in non-EU jurisdictions, each an independent transfer that must be justified.", "phase": 1, "remedy": "Constrain replication topology so {rowlower} never leaves approved regions.", "steps": ["Map the replication topology for {rowlower}", "Reconfigure replication to EU-approved regions only"]}, "unknown": {"reg": "gdpr", "a": "Art. 30", "severity": "high", "title": "Location of {row} is unknown", "detail": "You cannot demonstrate compliance for data whose location you cannot state. This is a visibility gap that must be closed first.", "phase": 1, "remedy": "Run data discovery to locate {rowlower}.", "steps": ["Run automated data discovery for {rowlower}", "Record findings in the RoPA"]}, "us-dpf": {"reg": "gdpr", "a": "Art. 45", "severity": "low", "title": "{row} transferred to a DPF-certified US processor", "detail": "Transfers of {rowlower} to US recipients certified under the EU-US Data Privacy Framework benefit from adequacy. Schrems-III risk remains open \u2014 reconfirm certification periodically.", "phase": 2, "remedy": "Verify DPF certification and maintain SCC + TIA fallback for {rowlower}.", "steps": ["Verify recipient on commerce.gov Data Privacy Framework Program list", "Document DPF reliance in the RoPA", "Maintain SCC fallback"]}, "eu-backup": {"reg": "gdpr", "a": "Art. 32", "severity": "low", "title": "{row} backed up outside the EU", "detail": "Encrypted non-EU backup of {rowlower} is lower risk but the encrypted copy is still a transfer; key custody determines whether it is defensible.", "phase": 2, "remedy": "Confirm backup encryption keys are held under EU control.", "steps": ["Confirm backup encryption standard", "Confirm keys are EU-held and not accessible to the non-EU operator"]}}}, {"id": "C3", "section": "location", "type": "single", "text": "Are data-residency constraints enforced technically (e.g. region-lock policy) or only by convention?", "help": "Policy-as-code prevents residency drift; convention alone tends to erode as teams deploy new services.", "refs": [{"reg": "gdpr", "a": "Art. 25"}, {"reg": "nis2", "a": "Art. 21"}], "options": [{"value": "enforced", "label": "Technically enforced (guardrails / policy-as-code)", "sev": "positive", "findings": []}, {"value": "partial", "label": "Partially enforced", "sev": "medium", "findings": [{"reg": "gdpr", "a": "Art. 25", "severity": "medium", "title": "Partial residency enforcement", "detail": "Where residency is only partly enforced, new or shadow deployments can silently place data in non-approved regions.", "phase": 2, "remedy": "Extend region-lock guardrails across all accounts and subscriptions.", "steps": ["Apply region-restriction policy to all cloud accounts", "Add residency checks to CI/CD deployment gates"]}]}, {"value": "convention", "label": "By convention / manual review only", "sev": "high", "findings": [{"reg": "gdpr", "a": "Art. 25", "severity": "high", "title": "No technical residency enforcement", "detail": "Data-protection-by-design (Art. 25) expects technical enforcement; convention-only controls routinely fail as the estate grows.", "phase": 1, "remedy": "Implement organisation-wide region-restriction guardrails.", "steps": ["Define approved regions per data classification", "Deploy preventative guardrails (e.g. SCPs / Azure Policy)", "Alert on any attempted non-compliant deployment"]}]}]}, {"id": "D1", "section": "transfers", "type": "single", "text": "Do personal data flows leave the EEA (or the UK, for UK data)?", "help": "Any egress of personal data to a third country is a 'restricted transfer' requiring a Chapter V safeguard.", "refs": [{"reg": "gdpr", "a": "Art. 44"}, {"reg": "ukgdpr", "a": "Art. 44"}], "options": [{"value": "no", "label": "No \u2014 personal data stays within EEA/UK", "sev": "positive", "findings": []}, {"value": "adequate", "label": "Yes, but only to adequate countries", "sev": "low", "findings": [{"reg": "gdpr", "a": "Art. 45", "severity": "low", "title": "Transfers rely on adequacy decisions", "detail": "Adequacy decisions are periodically reviewed and can be suspended; reliance on adequacy alone carries residual risk.", "phase": 2, "remedy": "Maintain a fallback safeguard in case an adequacy decision lapses.", "steps": ["List destination countries and their adequacy status", "Prepare SCC fallback for each"]}]}, {"value": "sccs", "label": "Yes, under SCCs / IDTA with safeguards", "sev": "medium", "findings": [{"reg": "gdpr", "a": "Art. 46", "severity": "medium", "title": "Transfers rely on SCCs \u2014 verify supplementary measures", "detail": "Post-Schrems II, SCCs alone are insufficient; a transfer impact assessment and supplementary measures are required, especially for US transfers.", "phase": 2, "remedy": "Confirm a TIA and supplementary technical measures exist for each SCC transfer.", "steps": ["Confirm SCCs are the current (2021) modules", "Complete a transfer impact assessment per destination", "Implement supplementary measures (e.g. encryption with EU-held keys)"]}]}, {"value": "sccs-dpf", "label": "Yes \u2014 to US recipients certified under the EU-US Data Privacy Framework (DPF)", "sev": "low", "findings": [{"reg": "gdpr", "a": "Art. 45", "severity": "low", "title": "Transfers relying on EU-US DPF adequacy", "detail": "US recipients certified under the EU-US Data Privacy Framework (Commission Implementing Decision (EU) 2023/1795, 10 July 2023) benefit from adequacy. Reconfirm the recipient DPF certification periodically \u2014 a future CJEU challenge remains possible; UK-established firms can additionally rely on the UK-US Data Bridge extension (October 2023).", "phase": 2, "remedy": "Maintain the DPF certification check and a fallback (SCCs + TIA) in case adequacy lapses.", "steps": ["Verify each US recipient on the DPF Program list at commerce.gov", "Document reliance on DPF adequacy in your RoPA", "Prepare SCC + TIA fallback documentation"]}]}, {"value": "nomech", "label": "Yes, without a documented mechanism / unsure", "sev": "critical", "findings": [{"reg": "gdpr", "a": "Art. 44\u201349", "severity": "critical", "title": "Undocumented international transfers", "detail": "Transferring personal data abroad without a valid, documented Chapter V mechanism is a direct GDPR breach exposing the organisation to the top tier of fines.", "phase": 1, "remedy": "Halt or lawfully paper every undocumented transfer as a priority.", "steps": ["Identify every cross-border personal-data flow", "Implement SCCs/IDTA + TIA for each, or repatriate", "Document all mechanisms in the RoPA"]}]}]}, {"id": "D2", "section": "transfers", "type": "boolean", "text": "Have transfer impact assessments (TIAs) been completed for transfers to non-adequate countries?", "help": "Schrems II requires a case-by-case assessment of whether the destination's laws undermine the SCCs, plus supplementary measures where they do.", "refs": [{"reg": "gdpr", "a": "Art. 46"}], "appliesTo": {"regulations": ["gdpr", "ukgdpr"]}, "options": [{"value": "yes", "label": "Yes \u2014 TIAs completed and documented", "sev": "positive", "findings": []}, {"value": "partial", "label": "Partially / for some transfers", "sev": "medium", "findings": [{"reg": "gdpr", "a": "Art. 46", "severity": "medium", "title": "Incomplete transfer impact assessments", "detail": "Gaps in TIA coverage leave some transfers unassessed and potentially unlawful.", "phase": 2, "remedy": "Complete TIAs for all remaining non-adequate transfers.", "steps": ["List transfers lacking a TIA", "Complete and document each TIA"]}]}, {"value": "no", "label": "No", "sev": "high", "findings": [{"reg": "gdpr", "a": "Art. 46", "severity": "high", "title": "No transfer impact assessments", "detail": "Without TIAs, reliance on SCCs is not defensible following Schrems II.", "phase": 1, "remedy": "Run TIAs for all restricted transfers and add supplementary measures.", "steps": ["Build a TIA template aligned to EDPB recommendations", "Assess each destination's surveillance regime", "Apply supplementary measures where risk is identified"]}]}]}, {"id": "D3", "section": "transfers", "type": "single", "text": "Do you rely on any cloud or data-processing service that would be subject to EU Data Act switching / portability obligations?", "help": "The Data Act (Regulation (EU) 2023/2854) applies from 12 September 2025; cloud switching provisions phase in later. Providers and their customers both have roles.", "refs": [{"reg": "dataact", "a": "Chapter VIII"}], "appliesTo": {"regulations": ["dataact"]}, "options": [{"value": "customer", "label": "Yes \u2014 as a customer of cloud / data-processing services", "sev": "low", "findings": [{"reg": "dataact", "a": "Chapter VIII", "severity": "low", "title": "Data Act switching rights available", "detail": "As a customer, the Data Act grants you rights to switch and port data between providers on transparent terms; ensure your contracts reflect these rights.", "phase": 2, "remedy": "Review provider contracts for Data Act switching / portability terms.", "steps": ["Confirm contract includes Data Act switching provisions", "Verify functional-equivalence obligations", "Track upcoming Data Act commencement milestones"]}]}, {"value": "provider", "label": "Yes \u2014 as a provider of cloud / data-processing services", "sev": "high", "findings": [{"reg": "dataact", "a": "Chapter VIII", "severity": "high", "title": "Data Act provider obligations apply", "detail": "As a provider, you must facilitate customer switching, ensure portability of exportable data, meet contractual-fairness rules, and safeguard against unlawful third-country access to non-personal data held in the EU.", "phase": 1, "remedy": "Build a Data Act compliance programme covering switching, portability and non-personal-data access safeguards.", "steps": ["Document switching / portability procedures", "Update customer contracts for Data Act terms", "Implement safeguards against unlawful third-country access to non-personal data"]}]}, {"value": "na", "label": "Not applicable / EU Data Act not in scope", "sev": "positive", "findings": []}]}, {"id": "E1", "section": "vendors", "type": "single", "text": "Do you maintain Data Processing Agreements (GDPR Art. 28) with all processors?", "help": "Every processor handling personal data on your behalf must be bound by Art. 28 terms, including subprocessor and location controls.", "refs": [{"reg": "gdpr", "a": "Art. 28"}], "options": [{"value": "all", "label": "Yes \u2014 DPAs with all processors", "sev": "positive", "findings": []}, {"value": "most", "label": "Most, with some gaps", "sev": "medium", "findings": [{"reg": "gdpr", "a": "Art. 28", "severity": "medium", "title": "Processor agreements incomplete", "detail": "Any processor without a compliant DPA processes personal data without a lawful basis for that processing relationship.", "phase": 1, "remedy": "Close DPA gaps and confirm location/subprocessor clauses.", "steps": ["Reconcile the processor list against signed DPAs", "Execute compliant DPAs for gaps", "Confirm each DPA specifies processing locations"]}]}, {"value": "few", "label": "Only for major vendors", "sev": "high", "findings": [{"reg": "gdpr", "a": "Art. 28", "severity": "high", "title": "Widespread processor-agreement gaps", "detail": "Relying on DPAs only for major vendors leaves a long tail of SaaS and analytics processors unbound and unmonitored.", "phase": 1, "remedy": "Undertake a full processor discovery and remediation.", "steps": ["Discover all processors (including SaaS/analytics)", "Prioritise by data sensitivity", "Execute DPAs across the estate"]}]}, {"value": "none", "label": "No formal DPAs / unsure", "sev": "critical", "findings": [{"reg": "gdpr", "a": "Art. 28", "severity": "critical", "title": "No processor agreements in place", "detail": "Processing personal data through processors without Art. 28 agreements is a systemic GDPR breach.", "phase": 1, "remedy": "Treat as an immediate remediation programme.", "steps": ["Stand up a processor-governance workstream", "Inventory and rank all processors", "Execute DPAs, prioritising sensitive-data processors"]}]}]}, {"id": "E2", "section": "vendors", "type": "single", "text": "Do you maintain a register of ICT third-party arrangements (DORA register of information)?", "help": "DORA requires financial entities to maintain a structured register of all ICT third-party service arrangements, flagging those supporting critical or important functions.", "refs": [{"reg": "dora", "a": "Art. 28"}], "appliesTo": {"regulations": ["dora"]}, "options": [{"value": "yes", "label": "Yes \u2014 complete and maintained", "sev": "positive", "findings": []}, {"value": "partial", "label": "Partial / in progress", "sev": "medium", "findings": [{"reg": "dora", "a": "Art. 28", "severity": "medium", "title": "DORA register of information incomplete", "detail": "An incomplete register means concentration and substitutability risk cannot be assessed and supervisory reporting will fail.", "phase": 1, "remedy": "Complete the register to the RTS template.", "steps": ["Populate the register to the regulatory template", "Flag arrangements supporting critical/important functions", "Establish maintenance ownership"]}]}, {"value": "no", "label": "No", "sev": "high", "findings": [{"reg": "dora", "a": "Art. 28", "severity": "high", "title": "No DORA register of information", "detail": "Absence of the register is a direct DORA gap and blocks any assessment of ICT concentration risk, including data-location concentration.", "phase": 1, "remedy": "Build the register as a foundational DORA deliverable.", "steps": ["Adopt the regulatory register template", "Inventory all ICT arrangements and their data locations", "Identify concentration on single providers/regions"]}]}]}, {"id": "E3", "section": "vendors", "type": "single", "text": "Do you have visibility of where your key SaaS and ICT providers actually process and store your data?", "help": "Data-location transparency is required under both GDPR (Art. 28) and DORA (Art. 30); default vendor configurations often place data outside the EU.", "refs": [{"reg": "gdpr", "a": "Art. 28"}, {"reg": "dora", "a": "Art. 30"}], "options": [{"value": "full", "label": "Full visibility \u2014 locations documented per provider", "sev": "positive", "findings": []}, {"value": "partial", "label": "Partial \u2014 some providers unclear", "sev": "medium", "findings": [{"reg": "dora", "a": "Art. 30", "severity": "medium", "title": "Partial vendor data-location visibility", "detail": "Where vendor processing locations are unclear, undisclosed non-EU processing and subprocessor chains may exist.", "phase": 2, "remedy": "Require location disclosure from every material provider.", "steps": ["Request data-location and subprocessor disclosure from providers", "Update the register/RoPA with confirmed locations"]}]}, {"value": "none", "label": "Little / no visibility", "sev": "high", "findings": [{"reg": "dora", "a": "Art. 30", "severity": "high", "title": "No vendor data-location visibility", "detail": "Without knowing where providers process your data, residency compliance cannot be asserted and DORA contractual requirements are unmet.", "phase": 1, "remedy": "Establish data-location transparency contractually and technically.", "steps": ["Add mandatory data-location clauses to contracts", "Obtain current subprocessor lists", "Verify against actual traffic/region telemetry where possible"]}]}]}, {"id": "E4", "section": "vendors", "type": "boolean", "text": "Are subprocessor changes controlled (prior notice + right to object)?", "help": "Uncontrolled subprocessor chains are a common route by which data silently moves to new jurisdictions.", "refs": [{"reg": "gdpr", "a": "Art. 28(2)"}, {"reg": "nis2", "a": "Art. 21"}], "options": [{"value": "yes", "label": "Yes \u2014 notice and objection rights in place", "sev": "positive", "findings": []}, {"value": "no", "label": "No / unsure", "sev": "medium", "findings": [{"reg": "gdpr", "a": "Art. 28(2)", "severity": "medium", "title": "Uncontrolled subprocessor changes", "detail": "Without prior-notice and objection rights, a processor can add a subprocessor in a new jurisdiction without your knowledge, moving data across borders.", "phase": 2, "remedy": "Insert subprocessor-control clauses and monitor subprocessor lists.", "steps": ["Add prior-notice + objection clauses to DPAs", "Subscribe to provider subprocessor-change notifications", "Review subprocessor lists quarterly"]}]}]}, {"id": "F1", "section": "resilience", "type": "single", "text": "Where are production backups physically stored?", "help": "Backups are frequently the forgotten residency exposure \u2014 a compliant primary with a non-EU backup is still non-compliant.", "refs": [{"reg": "gdpr", "a": "Art. 32"}, {"reg": "nis2", "a": "Art. 21"}], "options": [{"value": "eu", "label": "EU / EEA only", "sev": "positive", "findings": []}, {"value": "eu-enc", "label": "EU primary + encrypted non-EU secondary", "sev": "low", "findings": [{"reg": "gdpr", "a": "Art. 32", "severity": "low", "title": "Encrypted backup held outside the EU", "detail": "An encrypted non-EU backup is a transfer; defensibility hinges on key custody remaining under EU control.", "phase": 2, "remedy": "Confirm EU key custody or repatriate the secondary copy.", "steps": ["Confirm backup encryption keys are EU-held", "Confirm the operator cannot access plaintext"]}]}, {"value": "us-dpf", "label": "US-based, with DPF-certified backup provider", "sev": "low", "findings": [{"reg": "gdpr", "a": "Art. 45", "severity": "low", "title": "US backup relying on DPF adequacy", "detail": "Backups stored with a DPF-certified US recipient rely on adequacy; the backup is still a transfer and DPF certification must be maintained and reconfirmed periodically.", "phase": 2, "remedy": "Verify and monitor the backup provider DPF certification status.", "steps": ["Verify the backup provider on commerce.gov Data Privacy Framework Program list", "Document reliance in the RoPA", "Maintain SCC fallback in case adequacy lapses"]}]}, {"value": "us", "label": "US / non-EU based backup (no DPF)", "sev": "critical", "findings": [{"reg": "gdpr", "a": "Art. 32, 44", "severity": "critical", "title": "Backups stored in a non-EU jurisdiction", "detail": "Non-EU backups replicate every residency and transfer exposure of the primary, often silently and at full data volume. Without DPF adequacy or another Chapter V mechanism, this is a direct GDPR breach.", "phase": 1, "remedy": "Region-lock backups to the EU as an immediate action, or move to a DPF-certified provider.", "steps": ["Reconfigure backup targets to EU regions", "Purge or migrate existing non-EU backup copies", "Verify retention/deletion of migrated copies"]}]}, {"value": "unknown", "label": "Unknown", "sev": "high", "findings": [{"reg": "gdpr", "a": "Art. 30", "severity": "high", "title": "Backup location unknown", "detail": "Unknown backup location is a visibility gap that frequently conceals the largest residency exposure in the estate.", "phase": 1, "remedy": "Determine backup topology before other remediation.", "steps": ["Map
