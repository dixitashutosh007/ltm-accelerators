<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Question Bank Studio — LTM Accelerator Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>:root{
  --ground:#FFFFFF;--panel:#F9F9F9;--panel2:#ECECEC;--line:#DADADA;
  --ink:#282828;--mut:#5B5B5B;--mutd:#8E8E8E;
  --navy:#282828;--red:#FF5E4F;--amber:#B26A00;--steel:#3C829B;--lilac:#5A3A83;--blue:#3C829B;--green:#35754D;
}
*{box-sizing:border-box;}html,body{margin:0;padding:0;height:100%;}
body{font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;color:var(--ink);background:var(--ground);line-height:1.5;}
.mono{font-family:'Manrope',sans-serif;}
.eyebrow{font-family:'Manrope',sans-serif;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--steel);}
h1,h2,h3{font-family:'Manrope',sans-serif;letter-spacing:-.01em;margin:0;}

/* shell */
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
 padding:11px clamp(14px,2.5vw,26px);border-bottom:1px solid var(--line);background:rgba(255,255,255,.9);position:sticky;top:0;z-index:20;}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;}
.mark{width:28px;height:28px;border-radius:6px;background:var(--red);box-shadow:inset 0 0 0 3px var(--ground);flex:none;}
.brand img{height:28px;max-width:140px;object-fit:contain;}
.bw b{font-family:'Manrope',sans-serif;font-size:14.5px;font-weight:600;display:block;line-height:1.2;}
.bw span{font-family:'Manrope',sans-serif;font-size:9px;letter-spacing:.14em;color:var(--mutd);text-transform:uppercase;}
.ph{font-family:'Manrope',sans-serif;font-size:8px;letter-spacing:.1em;color:var(--amber);border:1px solid var(--line);border-radius:4px;padding:1px 4px;margin-left:6px;}
.tabs{display:flex;gap:4px;}
.tab{font-family:'Manrope',sans-serif;font-size:11.5px;color:var(--mut);background:none;border:1px solid transparent;padding:7px 12px;border-radius:8px;cursor:pointer;}
.tab:hover{color:var(--ink);}.tab.on{background:var(--panel);color:var(--ink);border-color:var(--line);}
.barmeta{display:flex;align-items:center;gap:10px;font-family:'Manrope',sans-serif;font-size:11px;color:var(--mutd);}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);}
.dot.warn{background:var(--amber);}.dot.err{background:var(--red);}

.btn{font-family:'Manrope',sans-serif;font-weight:600;font-size:13px;padding:9px 15px;border-radius:9px;cursor:pointer;border:1px solid transparent;transition:background .12s,border-color .12s;}
.btn.primary{background:var(--red);color:#FFFFFF;}.btn.primary:hover{background:#E54536;}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);}.btn.ghost:hover{border-color:var(--steel);}
.btn.sm{font-size:11.5px;padding:6px 11px;}
.btn.danger{background:transparent;color:var(--red);border:1px solid rgba(255,94,79,.4);}
.btn.danger:hover{background:rgba(255,94,79,.1);}
.btn:disabled{opacity:.4;cursor:not-allowed;}

.wrap{max-width:1280px;margin:0 auto;padding:20px clamp(14px,2.5vw,26px) 60px;}
.split{display:grid;grid-template-columns:330px 1fr;gap:18px;align-items:start;}
.card{border:1px solid var(--line);border-radius:13px;background:var(--panel);padding:16px;}
.card h3{font-size:14.5px;margin-bottom:10px;}
.hint{color:var(--mut);font-size:12.5px;margin:0 0 12px;}
.field{margin-bottom:13px;}
.field label{display:block;font-size:11.5px;font-weight:600;margin-bottom:5px;color:var(--mut);}
.inp,select,textarea{width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--ground);color:var(--ink);font-family:inherit;font-size:13.5px;}
.inp:focus,select:focus,textarea:focus{outline:none;border-color:var(--steel);}
textarea{resize:vertical;min-height:64px;}
.inp.mono,textarea.mono{font-family:'Manrope',sans-serif;font-size:12px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:7px 0;}
.chk input{accent-color:var(--red);width:15px;height:15px;}

/* question list */
.qlist{display:flex;flex-direction:column;gap:5px;max-height:66vh;overflow-y:auto;padding-right:4px;}
.secgroup{margin-bottom:10px;}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:7px;background:var(--ground);margin-bottom:4px;}
.sechead .sn{font-family:'Manrope',sans-serif;font-size:10px;color:var(--steel);letter-spacing:.08em;}
.sechead .sl{flex:1;font-size:12.5px;font-weight:600;}
.qrow{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;border:1px solid transparent;background:var(--ground);cursor:pointer;font-size:12.5px;}
.qrow:hover{border-color:var(--line);}
.qrow.sel{border-color:var(--red);background:rgba(255,94,79,.09);}
.qid{font-family:'Manrope',sans-serif;font-size:10px;color:var(--mutd);min-width:36px;}
.qt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.qbadge{font-family:'Manrope',sans-serif;font-size:8.5px;padding:2px 5px;border-radius:4px;border:1px solid var(--line);color:var(--mutd);white-space:nowrap;}
.qbadge.crit{color:var(--red);border-color:rgba(255,94,79,.4);}
.qbadge.err{color:var(--red);border-color:var(--red);background:rgba(255,94,79,.12);}
.qmove{display:flex;flex-direction:column;gap:1px;}
.qmove button{width:18px;height:14px;border:none;background:none;color:var(--mutd);cursor:pointer;font-size:8px;padding:0;line-height:1;}
.qmove button:hover{color:var(--ink);}

/* option editor */
.optrow{display:grid;grid-template-columns:1fr 70px auto;gap:8px;align-items:center;margin-bottom:7px;}
.optrow.nosc{grid-template-columns:1fr auto;}
.iconbtn{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--ground);color:var(--mut);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;}
.iconbtn:hover{border-color:var(--red);color:var(--red);}
.pill{font-family:'Manrope',sans-serif;font-size:10px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--mut);}
.pill.ok{color:var(--green);border-color:rgba(53,117,77,.4);}
.pill.warn{color:var(--amber);border-color:rgba(178,106,0,.4);}
.pill.err{color:var(--red);border-color:rgba(255,94,79,.4);}

.stat{display:flex;gap:20px;flex-wrap:wrap;font-family:'Manrope',sans-serif;font-size:11px;color:var(--mut);}
.stat b{color:var(--ink);font-size:18px;font-family:'Manrope',sans-serif;display:block;}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}

.vitem{display:flex;gap:10px;padding:9px 11px;border-radius:8px;background:var(--ground);margin-bottom:6px;font-size:12.5px;align-items:flex-start;}
.vsev{font-family:'Manrope',sans-serif;font-size:9px;padding:2px 6px;border-radius:4px;flex:none;margin-top:1px;}
.vsev.err{background:rgba(255,94,79,.15);color:var(--red);}
.vsev.warn{background:rgba(178,106,0,.15);color:var(--amber);}
.vsev.info{background:rgba(60,130,155,.15);color:var(--steel);}
.vmsg{flex:1;} .vwhere{font-family:'Manrope',sans-serif;font-size:10px;color:var(--mutd);margin-top:2px;}

table.tbl{width:100%;border-collapse:collapse;font-size:12.5px;}
table.tbl th,table.tbl td{text-align:left;padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top;}
table.tbl th{font-family:'Manrope',sans-serif;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mutd);}

.prof{border:1px solid var(--line);border-radius:11px;padding:14px;background:var(--ground);cursor:pointer;margin-bottom:9px;}
.prof:hover{border-color:var(--steel);}
.prof.sel{border-color:var(--red);background:rgba(255,94,79,.07);}
.profname{font-family:'Manrope',sans-serif;font-weight:600;font-size:14px;margin-bottom:3px;}
.profdesc{color:var(--mut);font-size:12px;line-height:1.45;}
.proftools{font-family:'Manrope',sans-serif;font-size:9.5px;color:var(--mutd);margin-top:7px;}

.impact{border:1px solid var(--line);border-radius:10px;background:var(--ground);padding:12px 14px;margin:6px 0 12px;}
.impacthead{font-family:'Manrope',sans-serif;font-weight:600;font-size:12.5px;display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.idot{width:8px;height:8px;border-radius:50%;flex:none;}
.irow{display:flex;gap:9px;font-size:12.5px;color:var(--mut);line-height:1.5;margin-bottom:5px;align-items:flex-start;}
.irow b{color:var(--ink);font-weight:600;}
.ik{width:5px;height:5px;border-radius:50%;flex:none;margin-top:7px;background:var(--mutd);}
.ik.ok{background:var(--green);}.ik.warn{background:var(--amber);}.ik.err{background:var(--red);}
.dropzone{border:1px dashed var(--line);border-radius:11px;padding:26px;text-align:center;color:var(--mut);font-size:13px;background:var(--ground);}
.dropzone.hot{border-color:var(--steel);background:rgba(60,130,155,.06);}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--steel);padding:10px 17px;border-radius:9px;font-size:13px;z-index:99;box-shadow:0 8px 30px rgba(0,0,0,.45);max-width:80vw;}
.toast.err{border-color:var(--red);}
.empty{color:var(--mutd);font-size:13px;text-align:center;padding:36px 16px;}
code{font-family:'Manrope',sans-serif;font-size:11.5px;background:var(--ground);padding:1px 5px;border-radius:4px;color:var(--steel);}

@media(max-width:900px){.split{grid-template-columns:1fr;}.row2,.row3{grid-template-columns:1fr;}}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px;}

.jsoned,textarea.mono,.inp.mono,code{font-family:ui-monospace,Menlo,Consolas,monospace;}
</style>
</head>

<body>
<header class="bar">
  <div class="brand" id="brand"></div>
  <div style="display:flex;align-items:center;gap:10px">
    <span style="font-family:'Manrope',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mutd)">Accelerator:</span>
    <select id="accSelector" style="font-family:'Manrope',sans-serif;font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--ground);color:var(--ink);cursor:pointer">
      <option value="finops-value-case">⚡ FinOps Value Case</option>
      <option value="finops-iq">📊 FinOps IQ</option>
      <option value="posture-iq">🛡️ Posture IQ</option>
    </select>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="barmeta">
    <span class="dot" id="hdot"></span><span id="hmeta"></span>
    <div id="authStatus" style="margin-left:8px"></div>
  </div>
</header>

<!-- Cognito Auth Modal -->
<div id="loginModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);backdrop-filter:blur(4px);z-index:9999;align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:14px;box-shadow:0 12px 36px rgba(0,0,0,0.25);width:90%;max-width:400px;padding:28px;font-family:'Manrope',sans-serif">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">
      <h3 style="margin:0;font-size:18px;font-weight:800;color:var(--ink)">LTM Advisory Admin Login</h3>
      <button onclick="closeLoginModal()" style="border:none;background:none;font-size:20px;cursor:pointer;color:var(--mutd)">&times;</button>
    </div>
    <p style="font-size:13px;color:var(--mut);margin:0 0 16px;line-height:1.5">Sign in with your authorized LTM Cognito account to edit questions, weights, and scoring engines.</p>
    <div style="margin-bottom:12px">
      <label style="display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:var(--ink)">Email Address</label>
      <input id="loginEmail" type="email" placeholder="name@ltm.com" style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;font-family:'Manrope',sans-serif" />
    </div>
    <div style="margin-bottom:16px">
      <label style="display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:var(--ink)">Password</label>
      <input id="loginPassword" type="password" placeholder="••••••••••••" style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;font-family:'Manrope',sans-serif" />
    </div>
    <div id="loginError" style="display:none;color:var(--red);font-size:12.5px;margin-bottom:14px;background:#FFF0EF;padding:8px 12px;border-radius:6px;border:1px solid rgba(255,94,79,0.3)"></div>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button onclick="closeLoginModal()" class="btn ghost sm">Cancel</button>
      <button id="btnSubmitLogin" onclick="handleCognitoLogin()" class="btn primary sm" style="padding:10px 20px;font-weight:700">Sign In →</button>
    </div>
  </div>
</div>
<div id="app"></div>
<input type="file" id="fLogo" accept="image/*" style="display:none">
<input type="file" id="fImport" accept=".json,application/json" style="display:none">
<input type="file" id="fHtml" accept=".html,text/html" style="display:none">

<script>

/* ---------- Embedded Accelerator Knowledge Bases ---------- */
const PRELOADED_KBS = {
  "finops-value-case": {"meta": {"schema_version": "1.0.3", "instrument": "FinOps Value Case \u2014 Pre-Maturity Qualification", "last_reviewed": "2026-07-22", "disclaimer": "Indicative estimate based on self-reported inputs and published industry benchmarks. Figures illustrate the scale of opportunity and are not a guarantee of savings. A validated baseline requires assessment of actual billing data. Indicative and directional only. Not a commitment, quote or financial advice.", "currencies": [{"id": "gbp", "symbol": "\u00a3"}, {"id": "usd", "symbol": "$"}, {"id": "eur", "symbol": "\u20ac"}, {"id": "inr", "symbol": "\u20b9"}], "signals": [{"id": "visibility", "label": "Cost visibility", "weight": 0.22, "color": "#3C829B"}, {"id": "predictability", "label": "Bill predictability", "weight": 0.2, "color": "#B26A00"}, {"id": "ownership", "label": "Ownership & accountability", "weight": 0.2, "color": "#5A3A83"}, {"id": "control", "label": "Controls & optimisation", "weight": 0.22, "color": "#35754D"}, {"id": "value", "label": "Value realisation", "weight": 0.16, "color": "#226882"}], "benchmarks": {"sector": "Banking, Financial Services & Insurance (BFSI)", "honesty_note": "Published waste benchmarks are reported cross-industry, not per-sector. Headline anchors below are global figures from named public sources. BFSI modifiers are LTM directional adjustments based on sector characteristics \u2014 not published sector waste rates \u2014 and are editable.", "sources": [{"label": "Flexera 2026 State of the Cloud Report (n=753, March 2026)", "url": "https://info.flexera.com/CM-REPORT-State-of-the-Cloud", "note": "Wasted IaaS/PaaS spend 29% \u2014 the first increase in five years, attributed to AI workloads and new PaaS/SaaS pricing complexity. 63% of organisations run an established FinOps team; 71% operate a CCoE; 49% use unit economics. Fewer than half use any one commitment discount per provider."}, {"label": "Flexera State of the Cloud, multi-year (2019\u20132026)", "url": "https://info.flexera.com/CM-REPORT-State-of-the-Cloud", "note": "Estimated waste has stayed within a 27\u201332% band every year since 2019 \u2014 the most stable benchmark available."}, {"label": "Harness Cloud Cost Management Report (2025)", "url": "https://www.harness.io/whitepapers/cloud-cost-management-report", "note": "21% of infrastructure budget wasted on unused or underused resources; a useful conservative floor."}, {"label": "FinOps Foundation, State of FinOps 2026", "url": "https://www.finops.org/insights/state-of-finops/", "note": "Workload optimisation and waste reduction remain the top practitioner priority, but with diminishing returns \u2014 the large obvious waste has been captured."}], "anchor_logic": "The Flexera 29% figure is an average across a population in which 63% already run an established FinOps team. An organisation with no FinOps function therefore sits materially above that average; one with mature controls sits below it.", "bfsi_modifiers": {"editable": true, "basis": "LTM directional adjustment \u2014 replace with engagement data when available", "cap": 0.45, "factors": [{"id": "nonprod", "label": "Elevated non-production estate", "pts": 0.03, "rationale": "Regulatory testing, UAT, model validation and parallel-run environments create a larger idle footprint than other sectors."}, {"id": "dr", "label": "Mandated DR and resilience duplication", "pts": 0.02, "rationale": "Operational resilience requirements (DORA, FCA/PRA and local equivalents) mandate standby capacity that is provisioned but rarely consumed."}, {"id": "residency", "label": "Data residency and sovereignty constraints", "pts": 0.015, "rationale": "Limits region arbitrage and constrains commitment flexibility."}, {"id": "liftshift", "label": "Core system lift-and-shift patterns", "pts": 0.03, "rationale": "Migrated core banking, payments and policy administration systems often retain data-centre sizing rather than cloud-native elasticity."}, {"id": "change", "label": "Extended change control cycles", "pts": 0.015, "rationale": "Rightsizing and decommissioning move through governance slowly, so identified waste persists longer."}, {"id": "commitment", "label": "Conservative commitment purchasing", "pts": 0.02, "rationale": "Budget governance and multi-year approval cycles suppress commitment coverage, leaving predictable workloads on on-demand rates."}]}}, "waste_model": {"bands": [{"max_capability": 25, "low": 0.3, "high": 0.4, "label": "No effective cost management", "anchor": "Above the 29% cross-industry average, since that average includes a majority with established FinOps teams."}, {"max_capability": 50, "low": 0.22, "high": 0.3, "label": "Ad hoc cost management", "anchor": "Straddles the 27\u201332% historical band."}, {"max_capability": 75, "low": 0.14, "high": 0.22, "label": "Partial controls in place", "anchor": "Approaching the Harness 21% floor for unused and underused infrastructure."}, {"max_capability": 100, "low": 0.08, "high": 0.14, "label": "Established controls", "anchor": "Consistent with practitioners reporting diminishing returns once large waste is captured."}]}, "verdict_bands": [{"min": 0, "max": 25, "id": "monitor", "label": "Lightweight practices sufficient", "color": "#35754D", "headline": "No material FinOps gap at current scale", "narrative": "At the current estate size and growth rate, formal FinOps investment is difficult to justify. Maintain basic budget alerting and revisit when spend or migration pace increases."}, {"min": 26, "max": 50, "id": "foundations", "label": "Establish foundations now", "color": "#226882", "headline": "Foundations needed before the estate grows", "narrative": "The estate is approaching the scale where informal cost management stops working. Establishing visibility and ownership now is materially cheaper than retrofitting them later."}, {"min": 51, "max": 75, "id": "material", "label": "Material exposure \u2014 act this year", "color": "#B26A00", "headline": "A quantifiable amount of spend is unmanaged", "narrative": "Cost is being incurred faster than it can be explained or controlled. The gap is large enough to be visible in financial results and will widen as migration continues."}, {"min": 76, "max": 100, "id": "urgent", "label": "Urgent \u2014 significant value leaking", "color": "#FF5E4F", "headline": "Spend is running substantially ahead of control", "narrative": "The combination of scale, growth and absent controls means a significant proportion of cloud investment is not producing recoverable value. This is normally visible to Finance before it is visible to Technology."}], "service_areas": [{"id": "operating_model", "name": "FinOps Operating Model & Governance", "triggers": [{"signal": "ownership", "below": 60}], "problem": "No one is genuinely accountable for cloud spend, so decisions default to whoever notices the bill.", "deliverables": ["FinOps charter and mandate, signed at executive level", "Operating model design \u2014 centralised, federated or hybrid, with rationale", "RACI across Engineering, Finance, Procurement and BU owners", "Governance forum design, cadence and decision rights", "Tooling assessment and platform recommendation", "90-day mobilisation plan with named owners"]}, {"id": "visibility_allocation", "name": "Cost Visibility & Allocation", "triggers": [{"signal": "visibility", "below": 65}], "problem": "Spend cannot be attributed to a team, product or customer, so no one can be held to it.", "deliverables": ["Tagging and metadata taxonomy with enforcement policy", "Cost allocation model including shared-cost treatment", "Showback design, progressing to chargeback where appropriate", "Executive and team-level cost dashboards", "Automated cost data pipeline into enterprise BI", "Allocation coverage baseline and improvement roadmap"]}, {"id": "forecast_control", "name": "Forecasting, Budgets & Anomaly Control", "triggers": [{"signal": "predictability", "below": 65}], "problem": "The bill cannot be predicted, so Finance treats cloud as uncontrolled spend.", "deliverables": ["Driver-based forecasting model with documented assumptions", "Budget framework at BU and product level with forecast-breach alerting", "Anomaly detection configuration and escalation routing", "Monthly variance reporting pack and commentary standard", "Forecast accuracy baseline and improvement target"]}, {"id": "rate_optimisation", "name": "Commitment & Rate Optimisation", "triggers": [{"signal": "control", "below": 70}], "problem": "Paying on-demand rates for predictable, steady-state workloads.", "deliverables": ["Commitment coverage analysis across providers", "Commitment strategy and purchase calendar", "Savings plan and reserved capacity portfolio design", "Provider agreement and discount review", "Ongoing coverage monitoring and renewal governance"]}, {"id": "workload_optimisation", "name": "Workload & Architecture Optimisation", "triggers": [{"signal": "control", "below": 60}], "problem": "Resources are oversized, idle or orphaned, and nothing systematically reclaims them.", "deliverables": ["Rightsizing assessment with prioritised savings backlog", "Waste and orphaned-resource elimination programme", "Storage tiering and lifecycle policy design", "Non-production scheduling and automated parking", "Spot and transient capacity adoption strategy", "Architecture cost review standard for design gates"]}, {"id": "unit_economics", "name": "Unit Economics & Value Realisation", "triggers": [{"signal": "value", "below": 60}], "problem": "Cloud spend cannot be defended to the board because its business value is not measured.", "deliverables": ["Unit metric definition per product or service line", "Cost-per-unit instrumentation and trending", "Cloud business case validation against original assumptions", "Margin and cost-to-serve analysis by customer or tenant", "Board-level cloud value reporting pack"]}, {"id": "enablement", "name": "FinOps Enablement & Capability Build", "triggers": [{"signal": "ownership", "below": 70}, {"signal": "value", "below": 70}], "problem": "Cost awareness does not survive contact with delivery pressure unless it is built into how engineers work.", "deliverables": ["FinOps role definitions and target capability model", "Training curriculum and FinOps certification pathway", "Cost-aware architecture and design standards", "Engineering enablement \u2014 cost feedback in CI/CD and pull requests", "Community of practice launch and operating rhythm"]}], "case_studies": [{"id": "cs_airline_na", "title": "How a leading North American airline saved 30% on cloud cost with our FinOps Excellence Service", "region": "North America", "industry": "Aviation & Transport", "outcome": "30% cost reduction", "relevance": ["control", "predictability"], "file": "assets/case-studies/PLACEHOLDER-airline-north-america.pdf", "status": "placeholder"}, {"id": "cs_bank_africa", "title": "How we helped a leading African bank establish a FinOps governance model", "region": "Africa", "industry": "Banking & Financial Services", "outcome": "Governance model established", "relevance": ["ownership", "visibility"], "file": "assets/case-studies/PLACEHOLDER-bank-africa.pdf", "status": "placeholder"}, {"id": "cs_retail_eu", "title": "How an EU retail business implemented FinOps to improve every-dollar-spend efficacy", "region": "Europe", "industry": "Retail & Consumer", "outcome": "Improved spend efficacy", "relevance": ["value", "visibility"], "file": "assets/case-studies/PLACEHOLDER-retail-eu.pdf", "status": "placeholder"}], "brochure": {"title": "LTM FinOps Services", "subtitle": "Cloud financial management \u2014 advisory, implementation and managed practice", "file": "assets/PLACEHOLDER-ltm-finops-brochure.pdf", "status": "placeholder"}}, "sections": [{"id": "estate", "n": "01", "label": "Your cloud estate", "blurb": "Where you are today, and where you are heading."}, {"id": "visibility", "n": "02", "label": "Visibility", "blurb": "Whether spend can be attributed
