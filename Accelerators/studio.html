<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Question Bank Studio — Accelerator Platform · LTM Vantage</title>
<script src="/assets/runtime-config.js"></script>
<script src="/assets/ltm-api.js"></script>
<script src="/assets/rbac-guard.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>:root{
  --ground:#FFFFFF;--panel:#F9F9F9;--panel2:#ECECEC;--line:#DADADA;
  --ink:#282828;--mut:#5B5B5B;--mutd:#8E8E8E;
  --navy:#282828;--red:#FF5E4F;--amber:#B26A00;--steel:#3C829B;--lilac:#5A3A83;--blue:#3C829B;--green:#35754D;
}
*{box-sizing:border-box;}html,body{margin:0;padding:0;height:100%;}
body{font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;color:var(--ink);background:var(--ground);line-height:1.5;}
.mono{font-family:'Manrope',sans-serif;}
.eyebrow{font-family:'Manrope',sans-serif;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--steel);}
h1,h2,h3{font-family:'Manrope',sans-serif;letter-spacing:-.01em;margin:0;}

/* shell */
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
 padding:11px clamp(14px,2.5vw,26px);border-bottom:1px solid var(--line);background:rgba(255,255,255,.9);position:sticky;top:0;z-index:20;}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;}
.mark{width:28px;height:28px;border-radius:6px;background:var(--red);box-shadow:inset 0 0 0 3px var(--ground);flex:none;}
.brand img{height:28px;max-width:140px;object-fit:contain;}
.bw b{font-family:'Manrope',sans-serif;font-size:14.5px;font-weight:600;display:block;line-height:1.2;}
.bw span{font-family:'Manrope',sans-serif;font-size:9px;letter-spacing:.14em;color:var(--mutd);text-transform:uppercase;}
.ph{font-family:'Manrope',sans-serif;font-size:8px;letter-spacing:.1em;color:var(--amber);border:1px solid var(--line);border-radius:4px;padding:1px 4px;margin-left:6px;}
.tabs{display:flex;gap:4px;}
.tab{font-family:'Manrope',sans-serif;font-size:11.5px;color:var(--mut);background:none;border:1px solid transparent;padding:7px 12px;border-radius:8px;cursor:pointer;}
.tab:hover{color:var(--ink);}.tab.on{background:var(--panel);color:var(--ink);border-color:var(--line);}
.barmeta{display:flex;align-items:center;gap:10px;font-family:'Manrope',sans-serif;font-size:11px;color:var(--mutd);}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);}
.dot.warn{background:var(--amber);}.dot.err{background:var(--red);}

.btn{font-family:'Manrope',sans-serif;font-weight:600;font-size:13px;padding:9px 15px;border-radius:9px;cursor:pointer;border:1px solid transparent;transition:background .12s,border-color .12s;}
.btn.primary{background:var(--red);color:#FFFFFF;}.btn.primary:hover{background:#E54536;}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);}.btn.ghost:hover{border-color:var(--steel);}
.btn.sm{font-size:11.5px;padding:6px 11px;}
.btn.danger{background:transparent;color:var(--red);border:1px solid rgba(255,94,79,.4);}
.btn.danger:hover{background:rgba(255,94,79,.1);}
.btn:disabled{opacity:.4;cursor:not-allowed;}

.wrap{max-width:1280px;margin:0 auto;padding:20px clamp(14px,2.5vw,26px) 60px;}
.split{display:grid;grid-template-columns:330px 1fr;gap:18px;align-items:start;}
.card{border:1px solid var(--line);border-radius:13px;background:var(--panel);padding:16px;}
.card h3{font-size:14.5px;margin-bottom:10px;}
.hint{color:var(--mut);font-size:12.5px;margin:0 0 12px;}
.field{margin-bottom:13px;}
.field label{display:block;font-size:11.5px;font-weight:600;margin-bottom:5px;color:var(--mut);}
.inp,select,textarea{width:100%;padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--ground);color:var(--ink);font-family:inherit;font-size:13.5px;}
.inp:focus,select:focus,textarea:focus{outline:none;border-color:var(--steel);}
textarea{resize:vertical;min-height:64px;}
.inp.mono,textarea.mono{font-family:'Manrope',sans-serif;font-size:12px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:7px 0;}
.chk input{accent-color:var(--red);width:15px;height:15px;}

/* question list */
.qlist{display:flex;flex-direction:column;gap:5px;max-height:66vh;overflow-y:auto;padding-right:4px;}
.secgroup{margin-bottom:10px;}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:7px;background:var(--ground);margin-bottom:4px;}
.sechead .sn{font-family:'Manrope',sans-serif;font-size:10px;color:var(--steel);letter-spacing:.08em;}
.sechead .sl{flex:1;font-size:12.5px;font-weight:600;}
.qrow{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;border:1px solid transparent;background:var(--ground);cursor:pointer;font-size:12.5px;}
.qrow:hover{border-color:var(--line);}
.qrow.sel{border-color:var(--red);background:rgba(255,94,79,.09);}
.qid{font-family:'Manrope',sans-serif;font-size:10px;color:var(--mutd);min-width:36px;}
.qt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.qbadge{font-family:'Manrope',sans-serif;font-size:8.5px;padding:2px 5px;border-radius:4px;border:1px solid var(--line);color:var(--mutd);white-space:nowrap;}
.qbadge.crit{color:var(--red);border-color:rgba(255,94,79,.4);}
.qbadge.err{color:var(--red);border-color:var(--red);background:rgba(255,94,79,.12);}
.qmove{display:flex;flex-direction:column;gap:1px;}
.qmove button{width:18px;height:14px;border:none;background:none;color:var(--mutd);cursor:pointer;font-size:8px;padding:0;line-height:1;}
.qmove button:hover{color:var(--ink);}

/* option editor */
.optrow{display:grid;grid-template-columns:1fr 70px auto;gap:8px;align-items:center;margin-bottom:7px;}
.optrow.nosc{grid-template-columns:1fr auto;}
.iconbtn{width:28px;height:28px;border-radius:7px;border:1px solid var(--line);background:var(--ground);color:var(--mut);cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;}
.iconbtn:hover{border-color:var(--red);color:var(--red);}
.pill{font-family:'Manrope',sans-serif;font-size:10px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);color:var(--mut);}
.pill.ok{color:var(--green);border-color:rgba(53,117,77,.4);}
.pill.warn{color:var(--amber);border-color:rgba(178,106,0,.4);}
.pill.err{color:var(--red);border-color:rgba(255,94,79,.4);}

.stat{display:flex;gap:20px;flex-wrap:wrap;font-family:'Manrope',sans-serif;font-size:11px;color:var(--mut);}
.stat b{color:var(--ink);font-size:18px;font-family:'Manrope',sans-serif;display:block;}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;}

.vitem{display:flex;gap:10px;padding:9px 11px;border-radius:8px;background:var(--ground);margin-bottom:6px;font-size:12.5px;align-items:flex-start;}
.vsev{font-family:'Manrope',sans-serif;font-size:9px;padding:2px 6px;border-radius:4px;flex:none;margin-top:1px;}
.vsev.err{background:rgba(255,94,79,.15);color:var(--red);}
.vsev.warn{background:rgba(178,106,0,.15);color:var(--amber);}
.vsev.info{background:rgba(60,130,155,.15);color:var(--steel);}
.vmsg{flex:1;} .vwhere{font-family:'Manrope',sans-serif;font-size:10px;color:var(--mutd);margin-top:2px;}

table.tbl{width:100%;border-collapse:collapse;font-size:12.5px;}
table.tbl th,table.tbl td{text-align:left;padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top;}
table.tbl th{font-family:'Manrope',sans-serif;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mutd);}

.prof{border:1px solid var(--line);border-radius:11px;padding:14px;background:var(--ground);cursor:pointer;margin-bottom:9px;}
.prof:hover{border-color:var(--steel);}
.prof.sel{border-color:var(--red);background:rgba(255,94,79,.07);}
.profname{font-family:'Manrope',sans-serif;font-weight:600;font-size:14px;margin-bottom:3px;}
.profdesc{color:var(--mut);font-size:12px;line-height:1.45;}
.proftools{font-family:'Manrope',sans-serif;font-size:9.5px;color:var(--mutd);margin-top:7px;}

.impact{border:1px solid var(--line);border-radius:10px;background:var(--ground);padding:12px 14px;margin:6px 0 12px;}
.impacthead{font-family:'Manrope',sans-serif;font-weight:600;font-size:12.5px;display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.idot{width:8px;height:8px;border-radius:50%;flex:none;}
.irow{display:flex;gap:9px;font-size:12.5px;color:var(--mut);line-height:1.5;margin-bottom:5px;align-items:flex-start;}
.irow b{color:var(--ink);font-weight:600;}
.ik{width:5px;height:5px;border-radius:50%;flex:none;margin-top:7px;background:var(--mutd);}
.ik.ok{background:var(--green);}.ik.warn{background:var(--amber);}.ik.err{background:var(--red);}
.dropzone{border:1px dashed var(--line);border-radius:11px;padding:26px;text-align:center;color:var(--mut);font-size:13px;background:var(--ground);}
.dropzone.hot{border-color:var(--steel);background:rgba(60,130,155,.06);}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--steel);padding:10px 17px;border-radius:9px;font-size:13px;z-index:99;box-shadow:0 8px 30px rgba(0,0,0,.45);max-width:80vw;}
.toast.err{border-color:var(--red);}
.empty{color:var(--mutd);font-size:13px;text-align:center;padding:36px 16px;}
code{font-family:'Manrope',sans-serif;font-size:11.5px;background:var(--ground);padding:1px 5px;border-radius:4px;color:var(--steel);}

@media(max-width:900px){.split{grid-template-columns:1fr;}.row2,.row3{grid-template-columns:1fr;}}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px;}

.jsoned,textarea.mono,.inp.mono,code{font-family:ui-monospace,Menlo,Consolas,monospace;}
</style>
</head>

<body>
<header class="bar">
  <div class="brand" id="brand"></div>
  <div style="display:flex;align-items:center;gap:10px">
    <span style="font-family:'Manrope',sans-serif;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mutd)">Accelerator:</span>
    <select id="accSelector" style="font-family:'Manrope',sans-serif;font-size:12.5px;font-weight:700;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--ground);color:var(--ink);cursor:pointer">
      <option value="cloud-iq">☁️ Cloud IQ</option>
      <option value="strategy-iq">🎯 Strategy IQ</option>
      <option value="modernization-iq">🏗️ Modernize IQ</option>
    </select>
  </div>
  <div class="tabs" id="tabs"></div>
  <div class="barmeta">
    <span class="dot" id="hdot"></span><span id="hmeta"></span>
    <div id="authStatus" style="margin-left:8px"></div>
  </div>
</header>

<!-- Cognito Auth Modal -->
<div id="loginModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.55);backdrop-filter:blur(4px);z-index:9999;align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:14px;box-shadow:0 12px 36px rgba(0,0,0,0.25);width:90%;max-width:400px;padding:28px;font-family:'Manrope',sans-serif">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:18px">
      <h3 style="margin:0;font-size:18px;font-weight:800;color:var(--ink)">LTM Vantage Admin Login</h3>
      <button onclick="closeLoginModal()" style="border:none;background:none;font-size:20px;cursor:pointer;color:var(--mutd)">&times;</button>
    </div>
    <p style="font-size:13px;color:var(--mut);margin:0 0 16px;line-height:1.5">Sign in with your authorized LTM Cognito account to edit questions, weights, and scoring engines.</p>
    <div style="margin-bottom:12px">
      <label style="display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:var(--ink)">Email Address</label>
      <input id="loginEmail" type="email" placeholder="name@ltm.com" style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;font-family:'Manrope',sans-serif" />
    </div>
    <div style="margin-bottom:16px">
      <label style="display:block;font-size:12px;font-weight:700;margin-bottom:6px;color:var(--ink)">Password</label>
      <input id="loginPassword" type="password" placeholder="••••••••••••" style="width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;font-family:'Manrope',sans-serif" />
    </div>
    <div id="loginError" style="display:none;color:var(--red);font-size:12.5px;margin-bottom:14px;background:#FFF0EF;padding:8px 12px;border-radius:6px;border:1px solid rgba(255,94,79,0.3)"></div>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button onclick="closeLoginModal()" class="btn ghost sm">Cancel</button>
      <button id="btnSubmitLogin" onclick="handleCognitoLogin()" class="btn primary sm" style="padding:10px 20px;font-weight:700">Sign In →</button>
    </div>
  </div>
</div>
<div id="app"></div>
<input type="file" id="fLogo" accept="image/*" style="display:none">
<input type="file" id="fImport" accept=".json,application/json" style="display:none">
<input type="file" id="fHtml" accept=".html,text/html" style="display:none">

/* ---------- Cognito RBAC Config (ap-south-1) ---------- */
const COGNITO_CONFIG = (window.LTM_CONFIG && window.LTM_CONFIG.cognito) || {};

let AUTH_USER = null;

function initAuth() {
  try {
    const stored = sessionStorage.getItem("ltm_auth_user");
    if (stored) {
      AUTH_USER = JSON.parse(stored);
    }
  } catch(e) {}
  renderAuthWidget();
}

function renderAuthWidget() {
  const w = document.getElementById("authStatus");
  if (!w) return;
  if (AUTH_USER && AUTH_USER.email) {
    const isSuper = AUTH_USER.role === "super_admin";
    w.innerHTML = '<span class="pill" style="background:#EBF3F5;color:var(--steel);font-weight:700;padding:4px 8px;font-size:11px">'
      + (isSuper ? '👑 Super Admin: ' : '👤 Consultant: ') + esc(AUTH_USER.email) + '</span>'
      + '<button class="btn ghost sm" onclick="logout()" style="margin-left:6px;padding:3px 8px;font-size:11px">Sign Out</button>';
  } else {
    w.innerHTML = '<button class="btn primary sm" onclick="openLoginModal()" style="padding:4px 10px;font-size:11.5px;font-weight:700">🔐 Sign In</button>';
  }
}

function openLoginModal() {
  const m = document.getElementById("loginModal");
  if (m) { m.style.display = "flex"; document.getElementById("loginEmail").focus(); }
}

function closeLoginModal() {
  const m = document.getElementById("loginModal");
  if (m) m.style.display = "none";
}

async function handleCognitoLogin() {
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  const errDiv = document.getElementById("loginError");
  const btn = document.getElementById("btnSubmitLogin");

  if (!email || !password) {
    errDiv.textContent = "Please enter both email and password.";
    errDiv.style.display = "block";
    return;
  }

  btn.disabled = true;
  btn.textContent = "Verifying...";
  errDiv.style.display = "none";

  try {
    // Shared client: stores the ID + refresh token; role/permissions come from the server.
    const session = await LTM_API.signIn(email, password);
    try {
      const meRes = await LTM_API.fetch("/api/me");
      if (meRes.ok) {
        const me = await meRes.json();
        if (me.ok) { session.role = me.role; session.permissions = me.permissions; LTM_API.writeSession(session); }
      }
    } catch (e) { console.warn("Could not load permissions:", e.message); }
    AUTH_USER = session;
    closeLoginModal();
    renderAuthWidget();
    toast("Welcome " + AUTH_USER.email + " (Signed In)");
  } catch(err) {
    errDiv.textContent = err.message || "Invalid email or password.";
    errDiv.style.display = "block";
  } finally {
    btn.disabled = false;
    btn.textContent = "Sign In →";
  }
}

function logout() {
  AUTH_USER = null;
  LTM_API.signOut();
  renderAuthWidget();
  toast("Signed out");
}

function checkEditPermission() {
  if (!AUTH_USER) {
    openLoginModal();
    return false;
  }
  return true;
}


/* =====================================================================
   LTM QUESTION BANK STUDIO
   Common core schema + per-tool profiles.
   The Studio holds banks in the common schema and exports either the
   common format or each accelerator's NATIVE format — so existing tools
   need no changes to benefit.
   ===================================================================== */

const SCHEMA = "ltm-qbank/1.0";

/* ---------- answer type library (shared across all accelerators) ---------- */
const TYPES = {
  single_select:   {label:"Single select",       opts:"scored",  desc:"One choice. Each option carries a score."},
  multi_select:    {label:"Multi select",        opts:"scored",  desc:"Several choices. Scores sum, capped at 100. Supports an exclusive 'none' option."},
  boolean:         {label:"Yes / No",            opts:"none",    desc:"Two-state. Yes=100, No=0."},
  boolean_dk:      {label:"Yes / No / Don't know",opts:"none",   desc:"Three-state. 'Don't know' scores worst-case and flags a blind spot."},
  rating_1_5:      {label:"Rating 1–5",          opts:"labels",  desc:"Five-point scale with a label per point."},
  slider_percent:  {label:"Percentage slider",   opts:"slider",  desc:"0–100 style slider. Can be inverted where lower is better."},
  slider_signed:   {label:"Signed slider",       opts:"slider",  desc:"Range that crosses zero, e.g. −25% to +200% growth."},
  slider_currency: {label:"Currency slider",     opts:"slider",  desc:"Logarithmic money slider for spend bands."},
  range:           {label:"Numeric range",       opts:"slider",  desc:"Plain numeric range, e.g. count of member states."},
  card_select:     {label:"Card select",         opts:"cards",   desc:"Visual single select with an icon per card."},
  allocation_100:  {label:"100-point allocation",opts:"buckets", desc:"Distribute 100 points across named buckets."},
  drag_order:      {label:"Drag to rank",        opts:"plain",   desc:"Ordered list. Can score against an ideal order, or stay unscored."},
  open_text:       {label:"Open text",           opts:"none",    desc:"Free text. Never scored — captured as evidence."}
};

/* ---------- tool profiles ---------- */
const PROFILES = {
  signal_scoring:{
    name:"Signal scoring",
    desc:"Questions feed weighted signals which aggregate into an index and a derived value model.",
    tools:[],
    nativeId:"value_case",
    ext:[
      {key:"signals",label:"Signals fed",kind:"signalList",help:"Which signals this question contributes to, and at what weight."},
      {key:"dkBlind",label:"Blind-spot text",kind:"text",help:"Shown in the report when the answer is \"don't know\"."}
    ],
    scoringBlocks:["signals","verdictBands","serviceAreas"]
  },
  staged_gating:{
    name:"Staged gating",
    desc:"Questions belong to sequential stages. A stage passes only when the weighted score clears a threshold and every critical question meets its minimum.",
    tools:["FinOps Maturity Screen"],
    nativeId:"finops_maturity",
    ext:[
      {key:"stage",label:"Stage",kind:"stageRef",help:"Which maturity stage this question belongs to."},
      {key:"critical",label:"Critical",kind:"bool",help:"Blocks stage progression until met, regardless of overall score."},
      {key:"weight",label:"Weight",kind:"number",help:"Relative weight within the stage."},
      {key:"domain",label:"Domain",kind:"text",help:"Capability domain for the breakdown chart."}
    ],
    scoringBlocks:["stages","domains"]
  },
  rules_engine:{
    name:"Rules engine",
    desc:"Answers write facts. Facts trigger graded findings against a regime or rule register. Readiness scored per dimension.",
    tools:["Sovereign Screen"],
    nativeId:"sovereign",
    ext:[
      {key:"sector",label:"Sector",kind:"text",help:"common, or a vertical id such as finance or health."},
      {key:"writes",label:"Writes facts",kind:"list",help:"Fact keys this answer sets directly (boolean and range types)."},
      {key:"readiness",label:"Readiness mapping",kind:"readinessList",help:"Regime and dimension this question scores against."}
    ],
    scoringBlocks:["regimes","facts"]
  },
  simple_survey:{
    name:"Simple survey",
    desc:"Weighted questions with no gating or fact model. The default for a new accelerator.",
    tools:["(new tools)"],
    nativeId:"common",
    ext:[{key:"weight",label:"Weight",kind:"number",help:"Relative weight in the overall score."}],
    scoringBlocks:[]
  }
};

/* ---------- starter bank ---------- */
function newBank(profile){
  return {
    $schema:SCHEMA,
    meta:{id:"new-accelerator",name:"New Accelerator",profile:profile||"simple_survey",
      version:"0.1.0",lastReviewed:new Date().toISOString().slice(0,10),
      disclaimer:"Indicative assessment based on self-reported inputs."},
    sections:[{id:"s1",n:"01",label:"First section",blurb:"What this section establishes."}],
    questions:[],
    scoring:{},
    assets:{}
  };
}

/* ---------- state ---------- */
const S={bank:newBank("simple_survey"),tab:"questions",selQ:null,logo:null,
  bakeHtml:"",bakeName:""};
const $=s=>document.querySelector(s);
const app=$("#app");
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function uid(p){let n=1;while(S.bank.questions.some(q=>q.id===p+n))n++;return p+n;}
function prof(){return PROFILES[S.bank.meta.profile]||PROFILES.simple_survey;}
function today(){return new Date().toISOString().slice(0,10);}
let tT=null;
function toast(m,err){let t=$(".toast");if(!t){t=document.createElement("div");document.body.appendChild(t);}
  t.className="toast"+(err?" err":"");t.textContent=m;clearTimeout(tT);tT=setTimeout(()=>t.remove(),3400);}
function dl(name,text,type){const b=new Blob([text],{type:type||"application/json"});const u=URL.createObjectURL(b);
  const a=document.createElement("a");a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),900);}

/* ---------- wiring contracts ----------
   A question is "wired" when it can actually affect a result. Unwired
   questions render fine and change nothing — the most common authoring
   mistake, so the contract makes it a blocking error unless declared. */
const WIRING={
  value_case:{
    noun:"signal",
    isWired(q){return ((q.ext&&q.ext.signals)||[]).length>0;},
    fix:"Tick at least one signal, or mark the question as intentionally unscored."
  },
  finops_maturity:{
    noun:"stage",
    isWired(q,B){
      if(!(q.ext&&q.ext.stage))return false;
      const sh=TYPES[q.type]?TYPES[q.type].opts:null;
      if(sh==="scored")return (q.options||[]).some(o=>typeof o.score==="number");
      if(sh==="none")return q.type!=="open_text";
      return sh==="labels"||sh==="slider"||sh==="buckets";
    },
    fix:"Assign a stage and make sure the answer can produce a score."
  },
  sovereign:{
    noun:"fact or readiness mapping",
    isWired(q,B){
      const writes=((q.ext&&q.ext.writes)||[]).length>0;
      const factOpts=(q.options||[]).some(o=>o.factValue&&Object.keys(o.factValue).length);
      const read=((q.ext&&q.ext.readiness)||[]).length>0;
      return writes||factOpts||read;
    },
    fix:"Write a fact that a rule reads, add a readiness mapping, or mark it intentionally unscored."
  },
  common:{
    noun:"weight",
    isWired(){return true;},
    fix:""
  }
};
function wiring(){return WIRING[prof().nativeId]||WIRING.common;}
function qRole(q){return q.role||(q.unscored?"unscored":"scored");}
function isWired(q){return qRole(q)!=="scored"?true:wiring().isWired(q,S.bank);}

/* ---------- fact graph (rules engine) ---------- */
function walkCond(c,cb){
  if(!c||typeof c!=="object")return;
  if(Array.isArray(c.all))return c.all.forEach(x=>walkCond(x,cb));
  if(Array.isArray(c.any))return c.any.forEach(x=>walkCond(x,cb));
  if(c.not)return walkCond(c.not,cb);
  if(c.fact)cb(c.fact);
}
function factsRead(B){
  const m={};
  (B.scoring.regimes||[]).forEach(r=>{
    (r.applicability_rules||[]).forEach((rule,i)=>{
      walkCond(rule.when,f=>{(m[f]=m[f]||[]).push({regime:r.name||r.id,rule:i,grade:rule.grade});});
    });
  });
  B.questions.forEach(q=>{ if(q.shownIf)walkCond(q.shownIf,f=>{(m[f]=m[f]||[]).push({regime:"(visibility of "+q.id+")",rule:-1});}); });
  return m;
}
function factsWritten(B){
  const m={};
  B.questions.forEach(q=>{
    ((q.ext&&q.ext.writes)||[]).forEach(f=>{(m[f]=m[f]||[]);if(!m[f].includes(q.id))m[f].push(q.id);});
    (q.options||[]).forEach(o=>{ if(o.factValue)Object.keys(o.factValue).forEach(f=>{
      (m[f]=m[f]||[]);if(!m[f].includes(q.id))m[f].push(q.id);});});
  });
  return m;
}
function readinessDims(B){
  const m={};
  (B.scoring.regimes||[]).forEach(r=>{m[r.id]={name:r.name||r.id,dims:new Set((r.readiness_dimensions||[]).map(d=>d.id))};});
  return m;
}

/* ---------- impact preview ---------- */
function impact(q){
  const B=S.bank,P=prof(),out=[];
  if(q.type==="open_text"){out.push({k:"info",t:"Free text is never scored — captured as evidence in the report."});return out;}
  const role=qRole(q);
  if(role==="unscored"){out.push({k:"info",t:"Marked <b>unscored</b>. Renders to the respondent and appears in the report, but contributes nothing to any result."});return out;}
  if(role==="context"){out.push({k:"info",t:"Marked <b>context</b>. Feeds the engine outside the scoring system — spend, growth or platform mix driving a derived model. The Studio cannot trace that wiring, so verify it against the tool."});return out;}

  if(P.nativeId==="value_case"){
    const sigs=(q.ext&&q.ext.signals)||[];
    if(!sigs.length){out.push({k:"err",t:"Feeds no signal — this question will not affect the result."});return out;}
    sigs.forEach(s=>{
      const def=(B.scoring.signals||[]).find(x=>x.id===s.id);
      if(!def){out.push({k:"err",t:"Feeds unknown signal \""+s.id+"\"."});return;}
      const feeders=B.questions.filter(x=>((x.ext&&x.ext.signals)||[]).some(y=>y.id===s.id)&&!x.unscored);
      const total=feeders.reduce((a,x)=>a+(((x.ext.signals.find(y=>y.id===s.id))||{}).w||0),0);
      const share=total?Math.round((s.w/total)*100):0;
      const overall=Math.round(share*(def.weight||0));
      out.push({k:"ok",t:"Contributes <b>"+share+"%</b> of the <b>"+esc(def.label||def.id)+"</b> signal"
        +(def.weight?" — roughly <b>"+overall+"%</b> of the overall index":"")+"."});
    });
    if(q.allowDK||q.type==="boolean_dk"){
      out.push({k:(q.ext&&q.ext.dkBlind)?"ok":"warn",
        t:(q.ext&&q.ext.dkBlind)?"A \"don't know\" answer scores zero and raises a named blind spot."
          :"A \"don't know\" answer scores zero but has no blind-spot text, so the report cannot explain it."});
    }
  }
  else if(P.nativeId==="finops_maturity"){
    const st=(B.scoring.stages||[]).find(s=>s.id===(q.ext&&q.ext.stage));
    if(!st){out.push({k:"err",t:"No stage assigned — this question is not part of any gate."});return out;}
    const sibs=B.questions.filter(x=>x.ext&&x.ext.stage===st.id&&!x.unscored);
    const tw=sibs.reduce((a,x)=>a+((x.ext&&x.ext.weight)||1),0);
    const mine=(q.ext&&q.ext.weight)||1;
    out.push({k:"ok",t:"Weight <b>"+mine+"</b> of "+tw+" in <b>"+esc(st.name||st.id)+"</b> — about <b>"
      +(tw?Math.round(mine/tw*100):0)+"%</b> of that stage's score (threshold "+st.threshold+")."});
    if(q.ext&&q.ext.critical){
      const crits=sibs.filter(x=>x.ext&&x.ext.critical).length;
      out.push({k:"warn",t:"<b>Critical.</b> Scoring below "+st.critMin+" blocks progression past "+esc(st.name||st.id)
        +" regardless of the stage average. This stage has "+crits+" critical question"+(crits>1?"s":"")+"."});
    }
  }
  else if(P.nativeId==="sovereign"){
    const read=factsRead(B),dims=readinessDims(B);
    const mine=[];
    ((q.ext&&q.ext.writes)||[]).forEach(f=>mine.push(f));
    (q.options||[]).forEach(o=>{if(o.factValue)Object.keys(o.factValue).forEach(f=>{if(!mine.includes(f))mine.push(f);});});
    if(!mine.length&&!((q.ext&&q.ext.readiness)||[]).length){
      out.push({k:"err",t:"Writes no fact and has no readiness mapping — this question affects nothing."});return out;}
    mine.forEach(f=>{
      const rs=read[f]||[];
      if(!rs.length)out.push({k:"err",t:"Writes fact <b>"+esc(f)+"</b>, but <b>no rule reads it</b> — the answer changes nothing."});
      else{
        const regimes=[...new Set(rs.map(r=>r.regime))];
        out.push({k:"ok",t:"Writes <b>"+esc(f)+"</b>, read by <b>"+rs.length+"</b> rule"+(rs.length>1?"s":"")
          +" across "+regimes.length+" regime"+(regimes.length>1?"s":"")+": "+esc(regimes.slice(0,3).join(", "))
          +(regimes.length>3?" +"+(regimes.length-3)+" more":"")+"."});
      }
    });
    ((q.ext&&q.ext.readiness)||[]).forEach(r=>{
      const reg=dims[r.regime];
      if(!reg)out.push({k:"err",t:"Readiness points at unknown regime <b>"+esc(r.regime)+"</b>."});
      else if(!reg.dims.has(r.dimension))out.push({k:"err",t:"Regime <b>"+esc(reg.name)+"</b> has no dimension <b>"+esc(r.dimension)+"</b>."});
      else out.push({k:"ok",t:"Scores the <b>"+esc(r.dimension)+"</b> dimension of <b>"+esc(reg.name)+"</b>."});
    });
  }
  else{
    const tot=B.questions.filter(x=>!x.unscored).reduce((a,x)=>a+((x.ext&&x.ext.weight)||1),0);
    const mine=(q.ext&&q.ext.weight)||1;
    out.push({k:"ok",t:"Weight <b>"+mine+"</b> of "+tot+" — about <b>"+(tot?Math.round(mine/tot*100):0)+"%</b> of the overall score."});
  }
  if(q.shownIf&&q.shownIf.fact)
    out.push({k:"info",t:"Only shown when <b>"+esc(q.shownIf.fact)+"</b> "+esc(q.shownIf.op||"")+" "
      +esc(Array.isArray(q.shownIf.value)?q.shownIf.value.join(", "):(q.shownIf.value!=null?q.shownIf.value:""))+"."});
  return out;
}

/* ---------- validation ---------- */
function validate(){
  const out=[],B=S.bank,P=prof();
  const ids={};
  B.questions.forEach(q=>{ids[q.id]=(ids[q.id]||0)+1;});
  Object.keys(ids).forEach(id=>{if(ids[id]>1)out.push({sev:"err",msg:"Duplicate question id",where:id});});
  const secIds=B.sections.map(s=>s.id);
  B.questions.forEach(q=>{
    if(!q.text||!q.text.trim())out.push({sev:"err",msg:"Question has no text",where:q.id});
    if(!TYPES[q.type])out.push({sev:"err",msg:"Unknown answer type: "+q.type,where:q.id});
    if(q.section&&!secIds.includes(q.section))out.push({sev:"err",msg:"Points at a section that does not exist ("+q.section+")",where:q.id});
    const shape=TYPES[q.type]?TYPES[q.type].opts:null;
    const scoresMatter=(qRole(q)==="scored")&&P.nativeId!=="sovereign";
    if(shape==="scored"){
      if(!q.options||!q.options.length)out.push({sev:"err",msg:"Select question has no options",where:q.id});
      else if(scoresMatter){
        const ns=q.options.filter(o=>typeof o.score!=="number").length;
        if(ns===q.options.length)out.push({sev:"warn",msg:"No option carries a score — this question cannot contribute to any result",where:q.id});
        else if(ns>0)out.push({sev:"warn",msg:ns+" option(s) missing a score",where:q.id});
        if(q.type==="single_select"&&!q.options.some(o=>o.score>=90))
          out.push({sev:"info",msg:"No option scores near 100 — the best available answer still loses points",where:q.id});
      }
    }
    if(shape==="labels"&&(!q.labels||q.labels.length!==5))out.push({sev:"warn",msg:"Rating needs exactly 5 labels",where:q.id});
    if(shape==="slider"&&(!q.slider||q.slider.min===undefined||q.slider.max===undefined))out.push({sev:"err",msg:"Slider has no min/max defined",where:q.id});
    if(shape==="slider"&&q.slider&&q.slider.min>=q.slider.max)out.push({sev:"err",msg:"Slider min is not below max",where:q.id});
    if(shape==="buckets"&&(!q.buckets||q.buckets.length<2))out.push({sev:"err",msg:"Allocation needs at least 2 buckets",where:q.id});
    if(shape==="plain"&&(!q.options||q.options.length<2))out.push({sev:"err",msg:"Ranking needs at least 2 items",where:q.id});
    if(q.shownIf&&q.shownIf.fact){
      const writers=B.questions.filter(x=>(x.ext&&Array.isArray(x.ext.writes)&&x.ext.writes.includes(q.shownIf.fact))
        ||(x.options||[]).some(o=>o.factValue&&Object.keys(o.factValue).includes(q.shownIf.fact)));
      if(!writers.length)out.push({sev:"warn",msg:"Condition depends on fact \""+q.shownIf.fact+"\" that no question writes",where:q.id});
    }
    // wiring contract — applies to every profile
    if(q.type!=="open_text"&&!isWired(q))
      out.push({sev:"err",msg:"Not wired to anything — needs a "+wiring().noun+". "+wiring().fix,where:q.id});
    // profile-specific
    if(P.nativeId==="value_case"){
      const sg=(q.ext&&q.ext.signals)||[];
      sg.forEach(s=>{if(!(B.scoring.signals||[]).some(x=>x.id===s.id))out.push({sev:"err",msg:"Feeds unknown signal \""+s.id+"\"",where:q.id});});
      if((q.allowDK||q.type==="boolean_dk")&&!(q.ext&&q.ext.dkBlind))
        out.push({sev:"warn",msg:"Allows \"don't know\" but has no blind-spot text — the report cannot explain the gap",where:q.id});
    }
    if(P.nativeId==="finops_maturity"){
      const st=q.ext&&q.ext.stage;
      if(st&&!(B.scoring.stages||[]).some(x=>x.id===st))out.push({sev:"err",msg:"Points at unknown stage \""+st+"\"",where:q.id});
    }
    if(P.nativeId==="sovereign"){
      const read=factsRead(B),dims=readinessDims(B);
      const writes=[];
      ((q.ext&&q.ext.writes)||[]).forEach(f=>writes.push(f));
      (q.options||[]).forEach(o=>{if(o.factValue)Object.keys(o.factValue).forEach(f=>{if(!writes.includes(f))writes.push(f);});});
      writes.forEach(f=>{if(!read[f])out.push({sev:"warn",msg:"Writes fact \""+f+"\" that no rule reads — the answer changes nothing",where:q.id});});
      ((q.ext&&q.ext.readiness)||[]).forEach(r=>{
        if(!dims[r.regime])out.push({sev:"err",msg:"Readiness points at unknown regime \""+r.regime+"\"",where:q.id});
        else if(!dims[r.regime].dims.has(r.dimension))out.push({sev:"err",msg:"Regime \""+r.regime+"\" has no dimension \""+r.dimension+"\"",where:q.id});
      });
    }
  });
  if(P.nativeId==="value_case"){
    (B.scoring.signals||[]).forEach(sig=>{
      const fed=B.questions.some(q=>q.ext&&(q.ext.signals||[]).some(s=>s.id===sig.id));
      if(!fed)out.push({sev:"warn",msg:"Signal \""+sig.id+"\" has no question feeding it and will never score",where:"scoring"});
    });
  }
  if(P.nativeId==="finops_maturity"){
    (B.scoring.stages||[]).forEach(st=>{
      const qs=B.questions.filter(q=>q.ext&&q.ext.stage===st.id);
      if(!qs.length)out.push({sev:"warn",msg:"Stage \""+st.id+"\" has no questions",where:"scoring"});
      else if(!qs.some(q=>q.ext.critical))out.push({sev:"info",msg:"Stage \""+st.id+"\" has no critical question — nothing gates progression",where:"scoring"});
    });
  }
  if(P.nativeId==="sovereign"){
    const read=factsRead(B),written=factsWritten(B);
    Object.keys(read).forEach(f=>{
      if(!written[f])out.push({sev:"err",msg:"Rules read fact \""+f+"\" that no question writes — those rules can never fire",where:"facts"});
    });
  }
  if(!B.questions.length)out.push({sev:"warn",msg:"Bank has no questions yet",where:"bank"});
  const order={err:0,warn:1,info:2};
  out.sort((a,b)=>order[a.sev]-order[b.sev]);
  return out;
}

/* ---------- render ---------- */
function render(){
  const tabs=[["questions","Questions"],["sections","Sections"],["scoring","Scoring"]];
  if(prof().nativeId==="sovereign")tabs.push(["facts","Facts"]);
  tabs.push(["validate","Validate"],["io","Import / Export"],["bake","Publish"]);
  if(!tabs.some(t=>t[0]===S.tab))S.tab="questions";
  $("#tabs").innerHTML=tabs.map(([k,l])=>'<button class="tab'+(S.tab===k?" on":"")+'" data-t="'+k+'">'+l+'</button>').join("");
  $("#brand").innerHTML=S.logo?'<img src="'+S.logo+'" alt="LTM"/>'
    :'<a href="/" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;"><img src="/assets/ltm-logo.png" alt="LTM" style="height:28px;width:auto;border-radius:4px;object-fit:contain;"><span class="bw"><b>Question Bank Studio</b><span>LTM Vantage · Responsible Advisory</span></span></a>';
  const v=validate(),errs=v.filter(x=>x.sev==="err").length,warns=v.filter(x=>x.sev==="warn").length;
  $("#hdot").className="dot"+(errs?" err":warns?" warn":"");
  $("#hmeta").textContent=S.bank.questions.length+" questions · "+(errs?errs+" errors":warns?warns+" warnings":"valid");
  const V={questions:vQuestions,sections:vSections,scoring:vScoring,facts:vFacts,validate:vValidate,io:vIO,bake:vBake};
  app.innerHTML='<div class="wrap">'+(V[S.tab]||vQuestions)()+'</div>';
}

function vQuestions(){
  const B=S.bank,P=prof();
  let list="";
  B.sections.forEach(sec=>{
    const qs=B.questions.filter(q=>q.section===sec.id);
    list+='<div class="secgroup"><div class="sechead"><span class="sn">'+esc(sec.n||"")+'</span><span class="sl">'+esc(sec.label)+'</span>'
      +'<button class="btn ghost sm" data-a="addQ" data-sec="'+sec.id+'">+ Question</button></div>';
    list+=qs.length?qs.map(q=>qRow(q)).join(""):'<div class="empty" style="padding:14px;font-size:12px">No questions yet</div>';
    list+='</div>';
  });
  const orphan=B.questions.filter(q=>!B.sections.some(s=>s.id===q.section));
  if(orphan.length)list+='<div class="secgroup"><div class="sechead"><span class="sn">!!</span><span class="sl" style="color:var(--red)">Unassigned</span></div>'+orphan.map(qRow).join("")+'</div>';

  const q=B.questions.find(x=>x.id===S.selQ);
  return '<div class="split"><div>'
    +'<div class="card"><h3>'+esc(B.meta.name)+'</h3>'
    +'<p class="hint">'+esc(P.name)+' profile · '+B.questions.length+' questions across '+B.sections.length+' sections</p>'
    +'<div class="qlist">'+(list||'<div class="empty">No sections yet — add one first</div>')+'</div></div></div>'
    +'<div>'+(q?qEditor(q):'<div class="card"><div class="empty">Select a question to edit, or add a new one.</div></div>')+'</div></div>';
}
function qRow(q){
  const v=validate().filter(x=>x.where===q.id&&x.sev==="err").length;
  const t=TYPES[q.type];
  return '<div class="qrow'+(S.selQ===q.id?' sel':'')+'" data-a="selQ" data-id="'+q.id+'">'
    +'<span class="qmove"><button data-a="mvUp" data-id="'+q.id+'">▲</button><button data-a="mvDn" data-id="'+q.id+'">▼</button></span>'
    +'<span class="qid">'+esc(q.id)+'</span><span class="qt">'+esc(q.text||"(no text)")+'</span>'
    +(q.ext&&q.ext.critical?'<span class="qbadge crit">CRIT</span>':'')
    +'<span class="qbadge">'+esc(t?t.label.split(" ")[0]:q.type)+'</span>'
    +(!isWired(q)&&q.type!=="open_text"?'<span class="qbadge err">UNWIRED</span>':'')
    +(v?'<span class="qbadge err">'+v+'</span>':'')+'</div>';
}
function qEditor(q){
  const P=prof(),t=TYPES[q.type]||{},shape=t.opts;
  const typeOpts=Object.keys(TYPES).map(k=>'<option value="'+k+'"'+(q.type===k?' selected':'')+'>'+TYPES[k].label+'</option>').join("");
  const secOpts=S.bank.sections.map(s=>'<option value="'+s.id+'"'+(q.section===s.id?' selected':'')+'>'+esc(s.label)+'</option>').join("");

  let body="";
  if(shape==="scored"||shape==="cards"){
    body='<div class="field"><label>Options'+(shape==="cards"?' (icon + label)':' (label + score 0–100)')+'</label>'
      +(q.options||[]).map((o,i)=>'<div class="optrow">'
        +'<input class="inp" value="'+esc(o.label||"")+'" data-qf="optLabel" data-i="'+i+'" placeholder="Option text"/>'
        +'<input class="inp mono" type="number" min="0" max="100" value="'+(o.score!=null?o.score:"")+'" data-qf="optScore" data-i="'+i+'" placeholder="—"/>'
        +'<button class="iconbtn" data-a="delOpt" data-i="'+i+'">✕</button></div>').join("")
      +'<button class="btn ghost sm" data-a="addOpt">+ Add option</button>'
      +(q.type==="multi_select"?'<label class="chk" style="margin-top:8px"><input type="checkbox" data-qf="hasExclusive" '+((q.options||[]).some(o=>o.exclusive)?"checked":"")+'/> Last option is exclusive (a "none of these" answer)</label>':'')
      +'</div>';
  } else if(shape==="labels"){
    body='<div class="field"><label>Scale labels (1 → 5)</label>'
      +(q.labels||["","","","",""]).map((l,i)=>'<div class="optrow nosc"><input class="inp" value="'+esc(l)+'" data-qf="label" data-i="'+i+'" placeholder="Point '+(i+1)+'"/><span class="pill">'+(i*25)+'</span></div>').join("")+'</div>';
  } else if(shape==="slider"){
    const sl=q.slider||{};
    body='<div class="field"><label>Slider configuration</label><div class="row3">'
      +'<input class="inp mono" type="number" value="'+(sl.min!=null?sl.min:0)+'" data-qf="slMin" placeholder="min"/>'
      +'<input class="inp mono" type="number" value="'+(sl.max!=null?sl.max:100)+'" data-qf="slMax" placeholder="max"/>'
      +'<input class="inp mono" type="number" value="'+(sl.step||1)+'" data-qf="slStep" placeholder="step"/></div>'
      +'<div class="row2" style="margin-top:8px">'
      +'<input class="inp" value="'+esc(sl.suffix||"")+'" data-qf="slSuffix" placeholder="suffix e.g. %"/>'
      +'<input class="inp mono" type="number" value="'+(sl.default!=null?sl.default:"")+'" data-qf="slDefault" placeholder="default"/></div>'
      +'<label class="chk"><input type="checkbox" data-qf="invert" '+(q.invert?"checked":"")+'/> Invert — lower values score better (e.g. waste %, variance)</label></div>';
  } else if(shape==="buckets"){
    body='<div class="field"><label>Allocation buckets</label>'
      +(q.buckets||[]).map((b,i)=>'<div class="optrow nosc"><input class="inp" value="'+esc(b.label||"")+'" data-qf="bucketLabel" data-i="'+i+'" placeholder="Bucket name"/>'
        +'<button class="iconbtn" data-a="delBucket" data-i="'+i+'">✕</button></div>').join("")
      +'<button class="btn ghost sm" data-a="addBucket">+ Add bucket</button></div>';
  } else if(shape==="plain"){
    body='<div class="field"><label>Items to rank</label>'
      +(q.options||[]).map((o,i)=>'<div class="optrow nosc"><input class="inp" value="'+esc(typeof o==="string"?o:o.label)+'" data-qf="plainItem" data-i="'+i+'"/>'
        +'<button class="iconbtn" data-a="delOpt" data-i="'+i+'">✕</button></div>').join("")
      +'<button class="btn ghost sm" data-a="addOpt">+ Add item</button>'
      +'<label class="chk" style="margin-top:8px"><input type="checkbox" data-qf="scoreOrder" '+(q.ideal?"checked":"")+'/> Score against the order shown above as ideal</label></div>';
  }

  // profile extensions
  let extHtml="";
  P.ext.forEach(f=>{
    const val=(q.ext||{})[f.key];
    if(f.kind==="bool")
      extHtml+='<label class="chk"><input type="checkbox" data-ext="'+f.key+'" '+(val?"checked":"")+'/> '+esc(f.label)+'</label><p class="hint" style="margin:0 0 10px 24px;font-size:11.5px">'+esc(f.help)+'</p>';
    else if(f.kind==="number")
      extHtml+='<div class="field"><label>'+esc(f.label)+'</label><input class="inp mono" type="number" step="0.5" value="'+(val!=null?val:1)+'" data-ext="'+f.key+'"/><p class="hint" style="margin-top:4px;font-size:11.5px">'+esc(f.help)+'</p></div>';
    else if(f.kind==="stageRef"){
      const so=(S.bank.scoring.stages||[]).map(s=>'<option value="'+s.id+'"'+(val===s.id?' selected':'')+'>'+esc(s.name||s.id)+'</option>').join("");
      extHtml+='<div class="field"><label>'+esc(f.label)+'</label><select data-ext="'+f.key+'"><option value="">— none —</option>'+so+'</select></div>';
    } else if(f.kind==="signalList"){
      const sigs=S.bank.scoring.signals||[];
      extHtml+='<div class="field"><label>'+esc(f.label)+'</label>'
        +(sigs.length?sigs.map(sg=>{
          const found=(val||[]).find(x=>x.id===sg.id);
          return '<div class="optrow"><label class="chk" style="padding:0"><input type="checkbox" data-sig="'+sg.id+'" '+(found?"checked":"")+'/> '+esc(sg.label||sg.id)+'</label>'
            +'<input class="inp mono" type="number" step="0.5" min="0" value="'+(found?found.w:1)+'" data-sigw="'+sg.id+'" '+(found?"":"disabled")+'/><span></span></div>';
        }).join(""):'<p class="hint">Define signals in the Scoring tab first.</p>')
        +'<p class="hint" style="margin-top:4px;font-size:11.5px">'+esc(f.help)+'</p></div>';
    } else if(f.kind==="list")
      extHtml+='<div class="field"><label>'+esc(f.label)+'</label><input class="inp mono" value="'+esc((val||[]).join(", "))+'" data-ext="'+f.key+'" data-list="1" placeholder="comma separated"/><p class="hint" style="margin-top:4px;font-size:11.5px">'+esc(f.help)+'</p></div>';
    else if(f.kind==="readinessList")
      extHtml+='<div class="field"><label>'+esc(f.label)+'</label><input class="inp mono" value="'+esc((val||[]).map(r=>r.regime+"."+r.dimension).join(", "))+'" data-ext="'+f.key+'" data-readiness="1" placeholder="regime.dimension, regime.dimension"/><p class="hint" style="margin-top:4px;font-size:11.5px">'+esc(f.help)+'</p></div>';
    else
      extHtml+='<div class="field"><label>'+esc(f.label)+'</label><input class="inp" value="'+esc(val||"")+'" data-ext="'+f.key+'"/><p class="hint" style="margin-top:4px;font-size:11.5px">'+esc(f.help)+'</p></div>';
  });

  const cond=q.shownIf||{};
  return '<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px">'
    +'<h3 style="margin:0">Edit <span class="mono" style="color:var(--steel)">'+esc(q.id)+'</span></h3>'
    +'<div style="display:flex;gap:7px"><button class="btn ghost sm" data-a="dupQ">Duplicate</button><button class="btn danger sm" data-a="delQ">Delete</button></div></div>'
    +'<div class="row2"><div class="field"><label>Question id</label><input class="inp mono" value="'+esc(q.id)+'" data-qf="id"/></div>'
    +'<div class="field"><label>Section</label><select data-qf="section">'+secOpts+'</select></div></div>'
    +'<div class="field"><label>Question text</label><textarea data-qf="text">'+esc(q.text||"")+'</textarea></div>'
    +'<div class="field"><label>Hint (optional)</label><input class="inp" value="'+esc(q.hint||"")+'" data-qf="hint" placeholder="Shown under the question"/></div>'
    +'<div class="row2"><div class="field"><label>Answer type</label><select data-qf="type">'+typeOpts+'</select>'
    +'<p class="hint" style="margin-top:5px;font-size:11.5px">'+esc(t.desc||"")+'</p></div>'
    +'<div class="field"><label>Tier</label><select data-qf="tier"><option value="1"'+(q.tier!==2?' selected':'')+'>1 — self-serve</option><option value="2"'+(q.tier===2?' selected':'')+'>2 — facilitated</option></select></div></div>'
    +body
    +'<div style="display:flex;gap:18px;flex-wrap:wrap;margin:4px 0 10px">'
    +'<label class="chk"><input type="checkbox" data-qf="allowNA" '+(q.allowNA?"checked":"")+'/> Allow "not applicable"</label>'
    +'<label class="chk"><input type="checkbox" data-qf="allowDK" '+(q.allowDK?"checked":"")+'/> Allow "don\'t know"</label>'
    +'<label class="chk"><input type="checkbox" data-qf="unscored" '+(q.unscored?"checked":"")+'/> Intentionally unscored</label></div>'
    +impactPanel(q)
    +'<div class="field"><label>Show only if (optional)</label><div class="row3">'
    +'<input class="inp mono" value="'+esc(cond.fact||"")+'" data-qf="condFact" placeholder="fact key"/>'
    +'<select data-qf="condOp"><option value="">op</option>'
    +["is_true","is_false","eq","neq","in","includes_any","gte","lte"].map(o=>'<option value="'+o+'"'+(cond.op===o?' selected':'')+'>'+o+'</option>').join("")+'</select>'
    +'<input class="inp mono" value="'+esc(cond.value!=null?(Array.isArray(cond.value)?cond.value.join(","):cond.value):"")+'" data-qf="condValue" placeholder="value"/></div></div>'
    +(extHtml?'<div style="border-top:1px solid var(--line);margin-top:14px;padding-top:14px"><div class="eyebrow" style="margin-bottom:10px">'+esc(P.name)+' fields</div>'+extHtml+'</div>':'')
    +'</div>';
}

function impactPanel(q){
  const rows=impact(q);
  const worst=rows.some(r=>r.k==="err")?"err":rows.some(r=>r.k==="warn")?"warn":"ok";
  const head={ok:"This question counts",warn:"Counts, with a caveat",err:"This question will not count"}[worst];
  const col={ok:"var(--green)",warn:"var(--amber)",err:"var(--red)"}[worst];
  return '<div class="impact"><div class="impacthead" style="color:'+col+'">'
    +'<span class="idot" style="background:'+col+'"></span>'+head+'</div>'
    +rows.map(r=>'<div class="irow"><span class="ik '+r.k+'"></span><span>'+r.t+'</span></div>').join("")
    +'</div>';
}

function vFacts(){
  const B=S.bank;
  const read=factsRead(B),written=factsWritten(B);
  const declared=(B.scoring.facts||[]).map(f=>typeof f==="string"?f:f.key);
  const all=[...new Set([...Object.keys(read),...Object.keys(written),...declared])].sort();
  if(!all.length)return '<div class="card"><h3>Fact map</h3><div class="empty">No facts in this bank. The rules engine profile expects questions to write facts that regime rules read.</div></div>';
  const rows=all.map(f=>{
    const w=written[f]||[],r=read[f]||[];
    let st,cls;
    if(w.length&&r.length){st="Wired";cls="ok";}
    else if(w.length&&!r.length){st="Written, never read";cls="warn";}
    else if(!w.length&&r.length){st="Read, never written";cls="err";}
    else{st="Declared, unused";cls="warn";}
    const regimes=[...new Set(r.map(x=>x.regime))];
    return '<tr><td class="mono">'+esc(f)+'</td>'
      +'<td class="mono" style="font-size:11px">'+(w.length?esc(w.join(", ")):'<span style="color:var(--red)">none</span>')+'</td>'
      +'<td style="font-size:11.5px">'+(r.length?r.length+' rule'+(r.length>1?'s':'')+'<div class="vwhere">'+esc(regimes.slice(0,2).join(", "))+(regimes.length>2?" +"+(regimes.length-2):"")+'</div>':'<span style="color:var(--amber)">no rule</span>')+'</td>'
      +'<td><span class="pill '+cls+'">'+st+'</span></td></tr>';
  }).join("");
  const bad=all.filter(f=>!(written[f]||[]).length&&(read[f]||[]).length).length;
  const orphan=all.filter(f=>(written[f]||[]).length&&!(read[f]||[]).length).length;
  return '<div class="card"><h3>Fact map</h3>'
    +'<p class="hint">Every fact in the bank, which questions write it, and which rules read it. In a rules engine a question only matters if the fact it writes reaches a rule.</p>'
    +'<div class="stat" style="margin-bottom:14px"><span><b>'+all.length+'</b>facts</span>'
    +'<span><b style="color:'+(bad?"var(--red)":"var(--green)")+'">'+bad+'</b>read but never written</span>'
    +'<span><b style="color:'+(orphan?"var(--amber)":"var(--mut)")+'">'+orphan+'</b>written but never read</span></div>'
    +(bad?'<div class="vitem"><span class="vsev err">ERR</span><span class="vmsg">Rules depend on facts that nothing sets. Those rules can never fire, so the findings they produce are unreachable.</span></div>':'')
    +'<table class="tbl"><thead><tr><th>Fact</th><th>Written by</th><th>Read by</th><th>Status</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}

function vScoring(){
  const B=S.bank,P=prof();
  if(!P.scoringBlocks.length)
    return '<div class="card"><h3>Scoring</h3><p class="hint">The <b>'+esc(P.name)+'</b> profile scores on question weights alone — there is nothing further to configure here. Set each question\'s weight in the Questions tab.</p></div>';
  let h="";
  if(P.scoringBlocks.includes("signals")){
    const sigs=B.scoring.signals||[];
    h+='<div class="card"><h3>Signals</h3><p class="hint">Questions feed these. Weights should sum to 1.0 — currently <b>'+sigs.reduce((a,s)=>a+(Number(s.weight)||0),0).toFixed(2)+'</b>.</p>'
      +sigs.map((s,i)=>'<div class="optrow" style="grid-template-columns:110px 1fr 80px auto">'
        +'<input class="inp mono" value="'+esc(s.id)+'" data-scf="signals.id" data-i="'+i+'" placeholder="id"/>'
        +'<input class="inp" value="'+esc(s.label||"")+'" data-scf="signals.label" data-i="'+i+'" placeholder="Label"/>'
        +'<input class="inp mono" type="number" step="0.01" value="'+(s.weight!=null?s.weight:0)+'" data-scf="signals.weight" data-i="'+i+'"/>'
        +'<button class="iconbtn" data-a="delSig" data-i="'+i+'">✕</button></div>').join("")
      +'<button class="btn ghost sm" data-a="addSig">+ Add signal</button></div>';
  }
  if(P.scoringBlocks.includes("stages")){
    const st=B.scoring.stages||[];
    h+='<div class="card" style="margin-top:16px"><h3>Stages</h3><p class="hint">Sequential gates. A stage passes when its weighted score meets the threshold <b>and</b> every critical question meets the critical minimum.</p>'
      +'<div class="optrow" style="grid-template-columns:1fr 90px 90px auto;padding-bottom:5px;border-bottom:1px solid var(--line);margin-bottom:8px">'
      +'<span class="eyebrow">Stage</span><span class="eyebrow">Threshold</span><span class="eyebrow">Crit min</span><span></span></div>'
      +st.map((s,i)=>'<div class="optrow" style="grid-template-columns:1fr 90px 90px auto">'
        +'<input class="inp" value="'+esc(s.name||s.id)+'" data-scf="stages.name" data-i="'+i+'"/>'
        +'<input class="inp mono" type="number" value="'+(s.threshold!=null?s.threshold:70)+'" data-scf="stages.threshold" data-i="'+i+'"/>'
        +'<input class="inp mono" type="number" value="'+(s.critMin!=null?s.critMin:80)+'" data-scf="stages.critMin" data-i="'+i+'"/>'
        +'<button class="iconbtn" data-a="delStage" data-i="'+i+'">✕</button></div>').join("")
      +'<button class="btn ghost sm" data-a="addStage">+ Add stage</button></div>';
  }
  if(P.scoringBlocks.includes("regimes")||P.scoringBlocks.includes("serviceAreas")||P.scoringBlocks.includes("domains")){
    const key=P.scoringBlocks.includes("regimes")?"regimes":P.scoringBlocks.includes("serviceAreas")?"serviceAreas":"domains";
    const arr=B.scoring[key]||[];
    h+='<div class="card" style="margin-top:16px"><h3>'+key.replace(/([A-Z])/g," $1").replace(/^./,c=>c.toUpperCase())+'</h3>'
      +'<p class="hint">This block is large and structured. Edit it as JSON — the Studio validates references against it.</p>'
      +'<textarea class="mono" style="min-height:220px" data-scjson="'+key+'">'+esc(JSON.stringify(arr,null,2))+'</textarea>'
      +'<button class="btn ghost sm" style="margin-top:8px" data-a="applyScJson" data-k="'+key+'">Apply</button></div>';
  }
  return h;
}

function vValidate(){
  const v=validate();
  const c={err:v.filter(x=>x.sev==="err").length,warn:v.filter(x=>x.sev==="warn").length,info:v.filter(x=>x.sev==="info").length};
  return '<div class="card"><h3>Validation</h3>'
    +'<div class="stat" style="margin:12px 0 16px"><span><b style="color:'+(c.err?"var(--red)":"var(--green)")+'">'+c.err+'</b>errors</span>'
    +'<span><b style="color:'+(c.warn?"var(--amber)":"var(--mut)")+'">'+c.warn+'</b>warnings</span>'
    +'<span><b>'+c.info+'</b>notes</span>'
    +'<span><b>'+S.bank.questions.length+'</b>questions</span></div>'
    +'<p class="hint">Errors will break the accelerator. Warnings mean a question or signal exists but can never affect a result — usually a wiring mistake, occasionally deliberate.</p>'
    +(v.length?v.map(x=>'<div class="vitem"><span class="vsev '+x.sev+'">'+x.sev.toUpperCase()+'</span>'
      +'<span class="vmsg">'+esc(x.msg)+'<div class="vwhere">'+esc(x.where)+'</div></span></div>').join("")
      :'<div class="empty">Nothing to report — the bank is clean.</div>')+'</div>';
}

/* ---------- converters ---------- */
function detectFormat(o){
  if(o&&o.$schema===SCHEMA)return "common";
  if(o&&o.regulations&&Array.isArray(o.regulations))return "posture_iq";
  if(o&&(Array.isArray(o.regimes)||(o.meta&&o.meta.id==="sovereign-iq")))return "sovereign";
  if(o&&o.meta&&Array.isArray(o.meta.stages)&&Array.isArray(o.questions))return "finops_maturity";
  if(o&&o.meta&&Array.isArray(o.meta.signals))return "value_case";
  if(o&&o.meta&&(o.meta.id==="cloud-iq"||o.dimensions))return "cloud_iq";
  if(o&&o.meta&&(o.meta.id==="strategy-iq"||o.meta.id==="strategy_iq"))return "strategy_iq";
  if(o&&o.meta&&(o.meta.id==="modernization-iq"||o.meta.id==="modernize-iq"||o.meta.name==="Modernize IQ"||o.meta.name==="Modernization IQ"))return "modernization_iq";
  if(o&&Array.isArray(o.stages)&&!o.questions)return "legacy_v3";
  return null;
}

        if(q.labels)o.labels=q.labels; if(q.slider)o.range=q.slider; if(q.invert)o.invert=true;

function toCsv(){
  const q2=v=>{const s=String(v==null?"":v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  const rows=[["id","section","type","tier","text","hint","options","ext"].join(",")];
  S.bank.questions.forEach(q=>{
    let opts="";
    if(q.options&&q.options.length)opts=q.options.map(o=>o.label+(o.score!=null?"::"+o.score:"")).join(" | ");
    else if(q.buckets)opts=q.buckets.map(b=>b.label).join(" | ");
    else if(q.labels)opts=q.labels.join(" | ");
    else if(q.slider)opts="min="+q.slider.min+"; max="+q.slider.max;
    rows.push([q.id,q.section,q.type,q.tier||1,q.text,q.hint||"",opts,JSON.stringify(q.ext||{})].map(q2).join(","));
  });
  return rows.join("\n");
}

/* ---------- bake ---------- */
function bake(){
  const html=S.bakeHtml;
  if(S.bank && S.bank.meta && (S.bank.meta.id === "modernization-iq" || S.bank.meta.id === "modernize-iq")){
    const rawQuestions = S.bank.questions.map(q => {
      const type = q.type === "range" ? "slider" : (q.type === "rating_1_5" ? "rating" : (q.type === "multi_select" ? "multi" : "single"));
      const item = {
        id: q.id,
        dim: q.section,
        type: type,
        q: q.text,
        hint: q.hint || ""
      };
      if (type === "slider") {
        item.min = q.slider ? q.slider.min : 0;
        item.max = q.slider ? q.slider.max : 100;
        item.step = q.slider ? q.slider.step : 5;
        item.defaultVal = q.slider ? q.slider.default || 50 : 50;
        item.unit = "%";
      } else if (type === "multi") {
        item.options = (q.options || []).map((op, idx) => ({ id: "opt_" + idx, label: op.label || op.text || "" }));
      } else if (type === "rating") {
        item.scaleLabels = (q.options && q.options.length) ? q.options.map(op => op.label || op.text || "") : ["1", "2", "3", "4", "5"];
      } else {
        item.opts = (q.options || []).map(op => op.label || op.text || "");
      }
      return item;
    });
    const marked = /\/\*\s*QBANK:START\s*\*\/[\s\S]*?\/\*\s*QBANK:END\s*\*\//;
    if (marked.test(html)) {
      return html.replace(marked, "/* QBANK:START */\nconst QUESTIONS = " + JSON.stringify(rawQuestions, null, 2) + ";\n/* QBANK:END */");
    }
  }
  const native=JSON.stringify(toNative(S.bank),null,2);
  const marked=/\/\*\s*QBANK:START\s*\*\/[\s\S]*?\/\*\s*QBANK:END\s*\*\//;
  if(marked.test(html))
    return html.replace(marked,"/* QBANK:START */\nconst DEFAULT_KB = "+native+";\n/* QBANK:END */");
  // fallback: brace-match from the declaration
  const start=html.indexOf("const DEFAULT_KB");
  if(start<0)return null;
  const open=html.indexOf("{",start);
  if(open<0)return null;
  let d=0,end=-1,inStr=false,strCh="",prev="";
  for(let i=open;i<html.length;i++){
    const c=html[i];
    if(inStr){ if(c===strCh&&prev!=="\\")inStr=false; }
    else if(c==='"'||c==="'"){inStr=true;strCh=c;}
    else if(c==="{")d++;
    else if(c==="}"){d--;if(d===0){end=i;break;}}
    prev=c;
  }
  if(end<0)return null;
  return html.slice(0,start)+"/* QBANK:START */\nconst DEFAULT_KB = "+native+";\n/* QBANK:END */"+html.slice(end+1).replace(/^\s*;/,"");
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a],[data-t]");if(!el)return;
  if(el.dataset.t){S.tab=el.dataset.t;render();return;}
  const a=el.dataset.a,B=S.bank,i=Number(el.dataset.i);
  const q=B.questions.find(x=>x.id===S.selQ);
  if(a==="selQ"){S.selQ=el.dataset.id;render();}
  else if(a==="addQ"){const nq={id:uid("Q"),section:el.dataset.sec,text:"",type:"single_select",tier:1,role:"scored",
      options:[{label:"",score:100},{label:"",score:50},{label:"",score:0}],ext:{}};
    if(prof().nativeId==="finops_maturity")nq.ext={stage:el.dataset.sec,critical:false,weight:1,domain:""};
    B.questions.push(nq);S.selQ=nq.id;render();}
  else if(a==="dupQ"&&q){const c=JSON.parse(JSON.stringify(q));c.id=uid("Q");
    B.questions.splice(B.questions.indexOf(q)+1,0,c);S.selQ=c.id;render();toast("Duplicated as "+c.id);}
  else if(a==="delQ"&&q){B.questions.splice(B.questions.indexOf(q),1);S.selQ=null;render();}
  else if(a==="mvUp"||a==="mvDn"){const id=el.dataset.id;const idx=B.questions.findIndex(x=>x.id===id);
    const sec=B.questions[idx].section;
    const sibs=B.questions.map((x,n)=>({x,n})).filter(o=>o.x.section===sec);
    const p=sibs.findIndex(o=>o.x.id===id);const t=p+(a==="mvUp"?-1:1);
    if(t<0||t>=sibs.length)return;
    const A=sibs[p].n,Bn=sibs[t].n;
    [B.questions[A],B.questions[Bn]]=[B.questions[Bn],B.questions[A]];render();}
  else if(a==="addOpt"&&q){q.options=q.options||[];
    q.options.push(TYPES[q.type].opts==="plain"?{label:"New item"}:{label:"",score:0});render();}
  else if(a==="delOpt"&&q){q.options.splice(i,1);render();}
  else if(a==="addBucket"&&q){q.buckets=q.buckets||[];q.buckets.push({id:"b"+(q.buckets.length+1),label:"",color:"#226882"});render();}
  else if(a==="delBucket"&&q){q.buckets.splice(i,1);render();}
  else if(a==="addSec"){B.sections.push({id:"s"+(B.sections.length+1),n:String(B.sections.length+1).padStart(2,"0"),label:"New section",blurb:""});render();}
  else if(a==="delSec"){const s=B.sections[i];
    if(B.questions.some(x=>x.section===s.id)){toast("Move or delete its questions first",true);return;}
    B.sections.splice(i,1);render();}
  else if(a==="setProfile"){const p=el.dataset.p;
    if(p===B.meta.profile)return;
    B.meta.profile=p;B.questions.forEach(x=>x.ext={});B.scoring=B.scoring||{};
    if(p==="signal_scoring"&&!B.scoring.signals)B.scoring.signals=[{id:"signal1",label:"First signal",weight:1}];
    if(p==="staged_gating"&&!B.scoring.stages)B.scoring.stages=[{id:"st1",name:"Stage 1",threshold:70,critMin:80}];
    render();toast("Profile changed — profile-specific fields cleared");}
  else if(a==="addSig"){B.scoring.signals=B.scoring.signals||[];
    B.scoring.signals.push({id:"sig"+(B.scoring.signals.length+1),label:"New signal",weight:0});render();}
  else if(a==="delSig"){B.scoring.signals.splice(i,1);render();}
  else if(a==="addStage"){B.scoring.stages=B.scoring.stages||[];
    B.scoring.stages.push({id:"st"+(B.scoring.stages.length+1),name:"New stage",threshold:70,critMin:80});render();}
  else if(a==="delStage"){B.scoring.stages.splice(i,1);render();}
  else if(a==="applyScJson"){const k=el.dataset.k;
    try{B.scoring[k]=JSON.parse(document.querySelector('[data-scjson="'+k+'"]').value);render();toast("Applied");}
    catch(err){toast("Invalid JSON — "+err.message,true);}}
  else if(a==="setLogo"){$("#fLogo").click();}
  else if(a==="pickImport"){$("#fImport").click();}
  else if(a==="pickHtml"){$("#fHtml").click();}
  else if(a==="importPaste"){const t=$("#pasteJson").value.trim();
    if(!t){toast("Nothing pasted",true);return;} doImport(t);}
  else if(a==="exCommon"){dl((B.meta.id||"bank")+"-common-"+today()+".json",JSON.stringify(B,null,2));toast("Common schema exported");}
  else if(a==="exNative"){dl((B.meta.id||"bank")+"-native-"+today()+".json",JSON.stringify(toNative(B),null,2));
    toast("Native export for "+prof().tools.join(", "));}
  else if(a==="exCsv"){dl((B.meta.id||"bank")+"-"+today()+".csv",toCsv(),"text/csv");toast("CSV exported");}
  else if(a==="newBank"){S.bank=newBank(el.dataset.p);S.selQ=null;S.tab="sections";render();toast("New bank created");}
  else if(a==="publishCloud"){
    if(!checkEditPermission()){
      toast("Authentication required. Please sign in to publish.", true);
      return;
    }
    const nativeKb = toNative(S.bank);
    dl(S.bank.meta.id + "-published-kb-" + today() + ".json", JSON.stringify(nativeKb, null, 2));
    toast("Published " + S.bank.meta.name + " (" + S.bank.questions.length + " questions) to Cloud Engine!");
  }
  else if(a==="doBake"){const out=bake();
    if(!out){toast("Could not find DEFAULT_KB in that file",true);return;}
    dl(S.bakeName.replace(/\.html$/,"")+"-published.html",out,"text/html");toast("Published — bank injected");}
  else if(a==="clearBake"){S.bakeHtml="";S.bakeName="";render();}
});

document.addEventListener("input",e=>{
  const el=e.target,B=S.bank;const q=B.questions.find(x=>x.id===S.selQ);
  const i=el.dataset.i!==undefined?Number(el.dataset.i):null;
  if(el.dataset.mf){B.meta[el.dataset.mf]=el.value;if(el.dataset.mf==="name")render();return;}
  if(el.dataset.sf){B.sections[i][el.dataset.sf]=el.value;return;}
  if(el.dataset.scf){const[blk,f]=el.dataset.scf.split(".");
    const v=(f==="weight"||f==="threshold"||f==="critMin")?Number(el.value):el.value;
    B.scoring[blk][i][f]=v;return;}
  if(!q)return;
  const f=el.dataset.qf;
  if(f==="id"){const old=q.id;q.id=el.value;S.selQ=el.value;
    if(old!==el.value)render();return;}
  if(f==="text"||f==="hint"){q[f]=el.value;return;}
  if(f==="section"){q.section=el.value;render();return;}
  if(f==="type"){q.type=el.value;
    const sh=TYPES[q.type].opts;
    if(sh==="scored"&&!q.options)q.options=[{label:"",score:100},{label:"",score:0}];
    if(sh==="labels"&&!q.labels)q.labels=["","","","",""];
    if(sh==="slider"&&!q.slider)q.slider={min:0,max:100,step:5,suffix:"%",default:50};
    if(sh==="buckets"&&!q.buckets)q.buckets=[{id:"b1",label:""},{id:"b2",label:""}];
    if(sh==="plain"&&!q.options)q.options=[{label:"Item one"},{label:"Item two"}];
    render();return;}
  if(f==="tier"){q.tier=Number(el.value);return;}
  if(f==="allowNA"){q.allowNA=el.checked;return;}
  if(f==="allowDK"){q.allowDK=el.checked;render();return;}
  if(f==="unscored"){q.unscored=el.checked;render();return;}
  if(f==="invert"){q.invert=el.checked;return;}
  if(f==="optLabel"){q.options[i].label=el.value;return;}
  if(f==="optScore"){q.options[i].score=el.value===""?undefined:Number(el.value);return;}
  if(f==="plainItem"){q.options[i]={label:el.value};if(q.ideal)q.ideal=q.options.map(o=>o.label);return;}
  if(f==="label"){q.labels[i]=el.value;return;}
  if(f==="bucketLabel"){q.buckets[i].label=el.value;return;}
  if(f==="scoreOrder"){q.ideal=el.checked?q.options.map(o=>o.label):undefined;return;}
  if(f==="hasExclusive"){if(q.options&&q.options.length){q.options.forEach(o=>delete o.exclusive);
    if(el.checked)q.options[q.options.length-1].exclusive=true;}return;}
  if(f&&f.startsWith("sl")){q.slider=q.slider||{};
    const k={slMin:"min",slMax:"max",slStep:"step",slSuffix:"suffix",slDefault:"default"}[f];
    q.slider[k]=(k==="suffix")?el.value:Number(el.value);return;}
  if(f&&f.startsWith("cond")){q.shownIf=q.shownIf||{};
    const k={condFact:"fact",condOp:"op",condValue:"value"}[f];
    let v=el.value;
    if(k==="value"&&v.includes(","))v=v.split(",").map(x=>x.trim());
    q.shownIf[k]=v;
    if(!q.shownIf.fact&&!q.shownIf.op)delete q.shownIf;
    return;}
  if(el.dataset.ext){q.ext=q.ext||{};const k=el.dataset.ext;
    if(el.type==="checkbox")q.ext[k]=el.checked;
    else if(el.dataset.list)q.ext[k]=el.value.split(",").map(s=>s.trim()).filter(Boolean);
    else if(el.dataset.readiness)q.ext[k]=el.value.split(",").map(s=>s.trim()).filter(Boolean)
      .map(s=>{const[r,d]=s.split(".");return{regime:r,dimension:d};});
    else if(el.type==="number")q.ext[k]=Number(el.value);
    else q.ext[k]=el.value;
    if(el.type==="checkbox")render();
    return;}
  if(el.dataset.sig){q.ext=q.ext||{};q.ext.signals=q.ext.signals||[];
    const id=el.dataset.sig;
    if(el.checked)q.ext.signals.push({id,w:1});
    else q.ext.signals=q.ext.signals.filter(s=>s.id!==id);
    render();return;}
  if(el.dataset.sigw){q.ext=q.ext||{};const s=(q.ext.signals||[]).find(x=>x.id===el.dataset.sigw);
    if(s)s.w=Number(el.value);return;}
});
document.addEventListener("change",e=>{
  if(e.target.dataset.qf==="type"||e.target.dataset.qf==="section")return; // handled on input
});

/* files */
function doImport(text){
  let o;try{o=JSON.parse(text);}catch(err){toast("Invalid JSON — "+err.message,true);return;}
  const fmt=detectFormat(o);
  if(!fmt){toast("Unrecognised format — see Recognised formats",true);return;}
  S.bank=toCommon(o,fmt);S.selQ=null;S.tab="questions";render();
  toast("Imported as "+fmt.replace(/_/g," ")+" → "+S.bank.questions.length+" questions");
}
$("#fImport").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{doImport(r.result);e.target.value="";};r.readAsText(f);});
$("#fHtml").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{S.bakeHtml=r.result;S.bakeName=f.name;render();
    toast("Loaded "+f.name);e.target.value="";};r.readAsText(f);});
$("#fLogo").addEventListener("change",e=>{const f=e.target.files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{S.logo=r.result;render();toast("Logo set");e.target.value="";};r.readAsDataURL(f);});

document.addEventListener("dragover",e=>{const z=e.target.closest("#drop,#dropHtml");if(z){e.preventDefault();z.classList.add("hot");}});
document.addEventListener("dragleave",e=>{const z=e.target.closest("#drop,#dropHtml");if(z)z.classList.remove("hot");});
document.addEventListener("drop",e=>{
  const z=e.target.closest("#drop,#dropHtml");if(!z)return;e.preventDefault();z.classList.remove("hot");
  const f=e.dataTransfer.files[0];if(!f)return;const r=new FileReader();
  if(z.id==="drop"){r.onload=()=>doImport(r.result);r.readAsText(f);}
  else{r.onload=()=>{S.bakeHtml=r.result;S.bakeName=f.name;render();toast("Loaded "+f.name);};r.readAsText(f);}
});
