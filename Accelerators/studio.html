 framework is fit for a MiCA-authorised firm", "Cover crypto-custody arrangements as ICT third-party arrangements", "Include CASP-specific scenarios in resilience testing"]}]}, {"value": "other-fin", "label": "Other financial entity (crowdfunding, credit rating agency, benchmark administrator, etc.)", "sev": "medium", "findings": [{"reg": "dora", "a": "Art. 2", "severity": "medium", "title": "DORA proportionality applies", "detail": "Smaller or specialised financial entities benefit from a proportionate regime but core ICT risk and third-party obligations still apply.", "phase": 2, "remedy": "Confirm which proportionality carve-outs apply and document the rationale.", "steps": ["Confirm entity type and any simplified regime", "Document proportionality decisions"]}]}, {"value": "na", "label": "Not a financial entity under DORA", "sev": "positive", "findings": []}]}, {"id": "A3", "section": "scope", "type": "single", "text": "For personal data, what is the primary jurisdiction of your data subjects?", "help": "This determines whether EU GDPR, UK GDPR or both apply, and sets the baseline residency expectation.", "refs": [{"reg": "gdpr", "a": "Art. 3"}, {"reg": "ukgdpr", "a": "Art. 3"}], "options": [{"value": "eea", "label": "EEA / EU only", "sev": "positive", "findings": []}, {"value": "uk", "label": "UK only", "sev": "positive", "findings": []}, {"value": "euuk", "label": "EU + UK", "sev": "low", "findings": [{"reg": "ukgdpr", "a": "Art. 44\u201349", "severity": "low", "title": "Dual EU/UK regime \u2014 divergence risk", "detail": "Operating under both regimes means EU\u2013UK data flows rely on the current UK adequacy decision, which is subject to periodic review and possible expiry.", "phase": 2, "remedy": "Maintain a fallback transfer mechanism (SCCs + IDTA) in case adequacy lapses.", "steps": ["Confirm reliance on the EU\u2192UK adequacy decision", "Prepare SCC/IDTA fallback documentation"]}]}, {"value": "global", "label": "EU/UK + US / global footprint", "sev": "medium", "findings": [{"reg": "gdpr", "a": "Art. 44", "severity": "medium", "title": "Global footprint triggers transfer scrutiny", "detail": "A global data-subject footprint substantially increases the surface area for unlawful cross-border transfers and jurisdictional conflict.", "phase": 2, "remedy": "Prioritise a full transfer-mapping exercise (Section D).", "steps": ["Map all cross-border personal-data flows", "Identify transfers lacking a valid Chapter V mechanism"]}]}]}, {"id": "A4", "section": "scope", "type": "boolean", "text": "Has a data-flow map (data mapping / RoPA) been produced and kept current in the last 12 months?", "help": "A Record of Processing Activities under GDPR Art. 30 \u2014 and an equivalent data-flow inventory \u2014 is the foundation of every residency control.", "refs": [{"reg": "gdpr", "a": "Art. 30"}, {"reg": "dora", "a": "Art. 8"}], "options": [{"value": "yes", "label": "Yes \u2014 current within 12 months", "sev": "positive", "findings": []}, {"value": "partial", "label": "Partial / out of date", "sev": "medium", "findings": [{"reg": "gdpr", "a": "Art. 30", "severity": "medium", "title": "Data mapping incomplete or stale", "detail": "An out-of-date RoPA means residency findings in this report are working from partial visibility; new systems and flows may be unmapped.", "phase": 1, "remedy": "Refresh the RoPA and data-flow inventory before finalising architecture decisions.", "steps": ["Refresh RoPA to cover all current systems", "Reconcile against actual cloud/SaaS inventory", "Establish a quarterly review cadence"]}]}, {"value": "no", "label": "No", "sev": "high", "findings": [{"reg": "gdpr", "a": "Art. 30", "severity": "high", "title": "No record of processing activities", "detail": "Absence of a RoPA is itself a GDPR compliance gap and prevents reliable residency assessment.", "phase": 1, "remedy": "Stand up a RoPA / data-flow inventory as a priority.", "steps": ["Commission a data-discovery and mapping exercise", "Document processing purposes, categories, recipients and locations", "Assign ongoing ownership to the DPO / data office"]}]}]}, {"id": "B1", "section": "inventory", "type": "multi", "text": "Which categories of sensitive data does your organisation process?", "help": "Special-category and financial data carry heightened residency and security expectations across all regimes.", "refs": [{"reg": "gdpr", "a": "Art. 9"}], "options": [{"value": "pii", "label": "Personal data (names, contact details, identifiers)", "sev": "medium", "findings": [{"reg": "gdpr", "a": "Art. 5, 32", "severity": "medium", "title": "Personal data in scope", "detail": "General personal data must be processed with appropriate security and a lawful residency posture.", "phase": 2, "remedy": "Ensure all personal-data stores are covered by the residency controls in Sections C\u2013D.", "steps": ["Confirm all PII stores are inventoried", "Apply baseline encryption and access control"]}]}, {"value": "special", "label": "Special-category data (health, biometric, ethnicity, beliefs)", "sev": "high", "findings": [{"reg": "gdpr", "a": "Art. 9", "severity": "high", "title": "Special-category data present", "detail": "Art. 9 data demands an explicit condition for processing plus enhanced safeguards; cross-border exposure is materially higher risk.", "phase": 1, "remedy": "Confirm an Art. 9 condition and lock storage to the highest-assurance region available.", "steps": ["Document the Art. 9 processing condition for each dataset", "Restrict special-category stores to EEA/UK regions", "Apply enhanced encryption and least-privilege access"]}]}, {"value": "financial", "label": "Financial / transactional data (accounts, payments, cards)", "sev": "high", "findings": [{"reg": "dora", "a": "Art. 3 (definitions), Art. 5", "severity": "high", "title": "Financial data supports critical or important functions", "detail": "Financial and payment data typically supports critical or important functions under DORA \u2014 its residency and availability drive operational-resilience obligations, ICT third-party clauses and the register of information. National banking-secrecy rules and, for card data, PCI DSS impose additional obligations.", "phase": 1, "remedy": "Treat financial data stores as supporting critical or important functions; confirm PCI DSS scope for card data.", "steps": ["Classify financial data stores by criticality", "Confirm PCI DSS scope for cardholder data", "Confirm resilience and residency for each store"]}]}, {"value": "behavioural", "label": "Customer behavioural / analytics data", "sev": "medium", "findings": [{"reg": "gdpr", "a": "Art. 6", "severity": "medium", "title": "Behavioural data often flows to third parties", "detail": "Analytics and behavioural datasets frequently transit to SaaS platforms in non-EEA jurisdictions, creating transfer exposure.", "phase": 2, "remedy": "Trace behavioural data to its downstream processors (Section E).", "steps": ["Identify analytics/behavioural data recipients", "Confirm processor agreements and processing locations"]}]}, {"value": "aitraining", "label": "AI / ML training datasets", "sev": "high", "findings": [{"reg": "aiact", "a": "Art. 10", "severity": "high", "title": "Training data in scope of AI Act governance", "detail": "Where AI systems are high-risk, training, validation and testing data are subject to specific governance and provenance requirements.", "phase": 2, "remedy": "Establish provenance and residency controls for training data (Section G).", "steps": ["Inventory training/validation/test datasets", "Document data provenance and lineage", "Confirm residency of the training environment"]}]}, {"value": "proprietary", "label": "Proprietary / commercially sensitive business data", "sev": "low", "findings": [{"reg": "nis2", "a": "Art. 21", "severity": "low", "title": "Business-critical data protection", "detail": "Proprietary data loss can constitute a significant incident; NIS2 expects proportionate protection.", "phase": 3, "remedy": "Include proprietary data in the resilience and access-control scope.", "steps": ["Classify proprietary data sensitivity", "Apply access control consistent with NIS2 Art. 21"]}]}, {"value": "government", "label": "Government / classified / restricted data", "sev": "critical", "findings": [{"reg": "eucs", "a": "High assurance", "severity": "critical", "title": "Government/classified data demands sovereign controls", "detail": "Restricted or classified data typically cannot lawfully reside on cloud services controlled from non-EU jurisdictions and may require High-assurance sovereign hosting.", "phase": 1, "remedy": "Confirm sovereign hosting and key custody for all classified data.", "steps": ["Confirm national handling rules for the classification level", "Restrict to sovereign / High-assurance platforms", "Ensure keys are held under EU/national control"]}]}]}, {"id": "B2", "section": "inventory", "type": "scale", "text": "Approximately what volume of sensitive data (personal, financial, special-category) do you hold?", "help": "Volume scales both regulatory exposure and remediation effort. Breach impact and notification burden grow with volume.", "refs": [{"reg": "gdpr", "a": "Art. 32"}], "scale": [{"v": 1, "label": "< 100 GB", "sev": "low", "findings": []}, {"v": 2, "label": "100 GB \u2013 1 TB", "sev": "low", "findings": []}, {"v": 3, "label": "1 \u2013 10 TB", "sev": "medium", "findings": [{"reg": "gdpr", "a": "Art. 32\u201334", "severity": "medium", "title": "Material data volume raises breach impact", "detail": "At multi-terabyte scale, a residency or security failure affects a large data-subject population, escalating notification and remediation cost.", "phase": 2, "remedy": "Prioritise encryption and access segmentation for the largest stores.", "steps": ["Identify the largest sensitive-data stores", "Confirm encryption and segmentation for each"]}]}, {"v": 4, "label": "10 \u2013 100 TB", "sev": "high", "findings": [{"reg": "gdpr", "a": "Art. 32\u201334", "severity": "high", "title": "Large-scale processing", "detail": "Large-scale processing of sensitive data triggers heightened accountability, likely a DPIA, and severe breach consequences.", "phase": 1, "remedy": "Confirm a DPIA is in place and residency is centrally governed.", "steps": ["Confirm DPIA coverage for large-scale processing", "Centralise residency governance"]}]}, {"v": 5, "label": "> 100 TB", "sev": "high", "findings": [{"reg": "gdpr", "a": "Art. 35", "severity": "high", "title": "Very large-scale processing", "detail": "At this scale, systematic monitoring and DPIA obligations are almost certainly engaged and any residency failure is systemically material.", "phase": 1, "remedy": "Treat residency as a board-level operational risk.", "steps": ["Elevate data residency to the enterprise risk register", "Ensure DPIA and prior-consultation readiness"]}]}]}, {"id": "C1", "section": "location", "type": "multi", "text": "Which cloud and hosting platforms run your production systems?", "help": "Operator jurisdiction and region selection are the primary levers of data residency.", "refs": [{"reg": "gdpr", "a": "Art. 44"}, {"reg": "eucs", "a": "Assurance"}], "options": [{"value": "aws-eu", "label": "AWS \u2014 EU regions only", "sev": "positive", "findings": []}, {"value": "aws-global", "label": "AWS \u2014 includes non-EU regions", "sev": "high", "findings": [{"reg": "gdpr", "a": "Art. 44", "severity": "high", "title": "Production workloads in non-EU cloud regions", "detail": "Personal data processed in non-EU regions constitutes a restricted transfer requiring a valid Chapter V mechanism and, for US operators, exposure to foreign government access.", "phase": 1, "remedy": "Confirm which workloads sit outside the EU and lock personal-data workloads to EU regions.", "steps": ["Enumerate all non-EU regions in use", "Identify personal-data workloads among them", "Migrate or region-lock personal-data workloads to EU"]}]}, {"value": "azure-eu", "label": "Microsoft Azure \u2014 EU regions only", "sev": "positive", "findings": []}, {"value": "azure-global", "label": "Microsoft Azure \u2014 includes non-EU regions", "sev": "high", "findings": [{"reg": "gdpr", "a": "Art. 44", "severity": "high", "title": "Azure workloads in non-EU regions", "detail": "Non-EU Azure regions processing personal data create restricted transfers and potential CLOUD Act exposure via a US-controlled operator.", "phase": 1, "remedy": "Region-lock personal-data workloads to EU Azure regions.", "steps": ["Audit Azure region configuration", "Apply Azure Policy to restrict region deployment", "Migrate non-compliant workloads"]}]}, {"value": "gcp-eu", "label": "Google Cloud \u2014 EU regions only", "sev": "positive", "findings": []}, {"value": "gcp-global", "label": "Google Cloud \u2014 includes non-EU regions", "sev": "high", "findings": [{"reg": "gdpr", "a": "Art. 44", "severity": "high", "title": "GCP workloads in non-EU regions", "detail": "Non-EU GCP regions processing personal data create restricted transfers and potential CLOUD Act exposure via a US-controlled operator.", "phase": 1, "remedy": "Region-lock personal-data workloads to EU GCP regions.", "steps": ["Audit GCP region configuration", "Apply Organization Policy to restrict region deployment", "Migrate non-compliant workloads"]}]}, {"value": "oracle-eu", "label": "Oracle Cloud \u2014 EU regions only", "sev": "low", "findings": [{"reg": "gdpr", "a": "Art. 44", "severity": "low", "title": "US-HQ operator in use (Oracle Cloud) \u2014 even EU-only", "detail": "Oracle Cloud EU regions constrain data location, but operator jurisdiction remains the United States; extraterritorial access risk under the CLOUD Act should still be assessed at the workload level.", "phase": 2, "remedy": "Assess CLOUD Act residual risk for the most sensitive workloads.", "steps": ["Confirm all Oracle Cloud regions are EU", "Assess residual CLOUD Act exposure for the most sensitive workloads", "Consider EU-controlled alternatives for highest tier"]}]}, {"value": "oracle-global", "label": "Oracle Cloud \u2014 includes non-EU regions", "sev": "high", "findings": [{"reg": "gdpr", "a": "Art. 44", "severity": "high", "title": "Oracle Cloud workloads in non-EU regions", "detail": "Non-EU Oracle Cloud regions processing personal data create restricted transfers and CLOUD Act exposure via a US-controlled operator.", "phase": 1, "remedy": "Region-lock personal-data workloads to EU Oracle Cloud regions.", "steps": ["Audit Oracle Cloud region configuration", "Restrict provisioning to EU regions", "Migrate non-compliant workloads"]}]}, {"value": "ibm-eu", "label": "IBM Cloud \u2014 EU regions only", "sev": "low", "findings": [{"reg": "gdpr", "a": "Art. 44", "severity": "low", "title": "US-HQ operator in use (IBM Cloud) \u2014 even EU-only", "detail": "IBM Cloud EU regions constrain data location, but operator jurisdiction remains the United States; assess residual extraterritorial access risk.", "phase": 2, "remedy": "Confirm region residency and assess CLOUD Act residual risk.", "steps": ["Confirm all IBM Cloud regions are EU", "Assess residual CLOUD Act exposure for the most sensitive workloads"]}]}, {"value": "ibm-global", "label": "IBM Cloud \u2014 includes non-EU regions", "sev": "high", "findings": [{"reg": "gdpr", "a": "Art. 44", "severity": "high", "title": "IBM Cloud workloads in non-EU regions", "detail": "Non-EU IBM Cloud regions processing personal data create restricted transfers and CLOUD Act exposure via a US-controlled operator.", "phase": 1, "remedy": "Region-lock personal-data workloads to EU IBM Cloud regions.", "steps": ["Audit IBM Cloud region configuration", "Restrict provisioning to EU regions", "Migrate non-compliant workloads"]}]}, {"value": "salesforce", "label": "Salesforce / Heroku (US-controlled)", "sev": "medium", "findings": [{"reg": "gdpr", "a": "Art. 44", "severity": "medium", "title": "Salesforce / Heroku is a US-HQ SaaS operator", "detail": "Salesforce and Heroku operate under US jurisdiction; even EU-hosted tenants remain within CLOUD Act reach via the operator. Assess supplementary measures and data residency clauses.", "phase": 2, "remedy": "Confirm EU hosting, tenant isolation and DPF certification (if applicable).", "steps": ["Confirm EU data residency for the Salesforce org", "Check Salesforce DPF-list entry", "Add supplementary encryption for sensitive fields"]}]}, {"value": "snowflake", "label": "Snowflake (US-HQ, region-selectable)", "sev": "medium", "findings": [{"reg": "gdpr", "a": "Art. 44", "severity": "medium", "title": "Snowflake \u2014 US-HQ operator, region matters", "detail": "Snowflake supports EU regions but is a US-HQ operator; region selection alone does not remove CLOUD Act exposure.", "phase": 2, "remedy": "Confirm EU region + assess CLOUD Act residual risk.", "steps": ["Confirm Snowflake account region is EU", "Enable customer-managed encryption keys where available", "Assess DPF certification and supplementary measures"]}]}, {"value": "databricks", "label": "Databricks (US-HQ, region-selectable)", "sev": "medium", "findings": [{"reg": "gdpr", "a": "Art. 44", "severity": "medium", "title": "Databricks \u2014 US-HQ operator, region matters", "detail": "Databricks supports EU regions but is a US-HQ operator; region selection alone does not remove CLOUD Act exposure \u2014 relevant especially for training-data workloads.", "phase": 2, "remedy": "Confirm EU region and assess CLOUD Act residual risk; consider EU-controlled ML platforms for the most sensitive workloads.", "steps": ["Confirm Databricks workspace region is EU", "Assess CLOUD Act residual risk", "Evaluate sovereign alternatives for the most sensitive workloads"]}]}, {"value": "sovereign", "label": "Sovereign / EU-controlled cloud (e.g. EUCS-aligned, Gaia-X, national)", "sev": "positive", "findings": [{"reg": "eucs", "a": "High assurance", "severity": "positive", "title": "Sovereign platform in use", "detail": "An EU-controlled or sovereign platform substantially reduces jurisdictional exposure for regulated workloads.", "phase": 3, "remedy": "Confirm the assurance level meets the sensitivity of hosted data.", "steps": ["Verify certified assurance level", "Match assurance level to data classification"]}]}, {"value": "onprem", "label": "On-premises / private data centre", "sev": "positive", "findings": []}, {"value": "colo", "label": "Third-party colocation / managed hosting", "sev": "low", "findings": [{"reg": "nis2", "a": "Art. 21", "severity": "low", "title": "Managed-hosting supply-chain dependency", "detail": "Colocation and managed hosting introduce a supply-chain dependency that must be governed under NIS2 supply-chain security.", "phase": 3, "remedy": "Include hosting provider in supply-chain risk assessment.", "steps": ["Add hosting provider to the supplier register", "Confirm physical and jurisdictional controls"]}]}]}, {"id": "C2", "section": "location", "type": "matrix", "text": "For each sensitive data category, where is it stored and processed today?", "help": "This is the residency heart of the assessment. 'Unknown' is scored as a risk in its own right.", "refs": [{"reg": "gdpr", "a": "Art. 44"}, {"reg": "dora", "a": "Art. 5"}], "rows": [{"id": "pii", "label": "Personal data"}, {"id": "special", "label": "Special-category data"}, {"id": "financial", "label": "Financial data"}, {"id": "behavioural", "label": "Behavioural / analytics data"}, {"id": "aitraining", "label": "AI / ML training data"}, {"id": "government", "label": "Government / classified / restricted data"}], "cols": [{"id": "eu-only", "label": "EU region only", "sev": "positive"}, {"id": "uk-only", "label": "UK region only", "sev": "positive"}, {"id": "eu-backup", "label": "EU + encrypted non-EU backup", "sev": "low"}, {"id": "us-dpf", "label": "US cloud with DPF-certified processor", "sev": "low"}, {"id": "us-cloud", "label": "US / non-EU cloud (no DPF)", "sev": "critical"}, {"id": "multi", "label": "Multi-region global", "sev": "high"}, {"id": "unknown", "label": "Unknown", "sev": "high"}], "cellFindings": {"us-cloud": {"reg": "gdpr", "a": "Art. 44\u201349", "severity": "critical", "title": "{row} located in a non-EU jurisdiction", "detail": "Storing {rowlower} in US/non-EU cloud is a restricted transfer that is unlawful absent a valid mechanism, and exposes the data to foreign government access requests.", "phase": 1, "remedy": "Migrate {rowlower} to an EU region or a valid transfer mechanism with supplementary measures.", "steps": ["Confirm the exact location and operator of {rowlower}", "Assess whether a valid Chapter V mechanism exists", "Migrate to EU region or implement SCCs + supplementary measures"]}, "multi": {"reg": "gdpr", "a": "Art. 44", "severity": "high", "title": "{row} replicated across multiple regions", "detail": "Multi-region replication of {rowlower} means copies exist in non-EU jurisdictions, each an independent transfer that must be justified.", "phase": 1, "remedy": "Constrain replication topology so {rowlower} never leaves approved regions.", "steps": ["Map the replication topology for {rowlower}", "Reconfigure replication to EU-approved regions only"]}, "unknown": {"reg": "gdpr", "a": "Art. 30", "severity": "high", "title": "Location of {row} is unknown", "detail": "You cannot demonstrate compliance for data whose location you cannot state. This is a visibility gap that must be closed first.", "phase": 1, "remedy": "Run data discovery to locate {rowlower}.", "steps": ["Run automated data discovery for {rowlower}", "Record findings in the RoPA"]}, "us-dpf": {"reg": "gdpr", "a": "Art. 45", "severity": "low", "title": "{row} transferred to a DPF-certified US processor", "detail": "Transfers of {rowlower} to US recipients certified under the EU-US Data Privacy Framework benefit from adequacy. Schrems-III risk remains open \u2014 reconfirm certification periodically.", "phase": 2, "remedy": "Verify DPF certification and maintain SCC + TIA fallback for {rowlower}.", "steps": ["Verify recipient on commerce.gov Data Privacy Framework Program list", "Document DPF reliance in the RoPA", "Maintain SCC fallback"]}, "eu-backup": {"reg": "gdpr", "a": "Art. 32", "severity": "low", "title": "{row} backed up outside the EU", "detail": "Encrypted non-EU backup of {rowlower} is lower risk but the encrypted copy is still a transfer; key custody determines whether it is defensible.", "phase": 2, "remedy": "Confirm backup encryption keys are held under EU control.", "steps": ["Confirm backup encryption standard", "Confirm keys are EU-held and not accessible to the non-EU operator"]}}}, {"id": "C3", "section": "location", "type": "single", "text": "Are data-residency constraints enforced technically (e.g. region-lock policy) or only by convention?", "help": "Policy-as-code prevents residency drift; convention alone tends to erode as teams deploy new services.", "refs": [{"reg": "gdpr", "a": "Art. 25"}, {"reg": "nis2", "a": "Art. 21"}], "options": [{"value": "enforced", "label": "Technically enforced (guardrails / policy-as-code)", "sev": "positive", "findings": []}, {"value": "partial", "label": "Partially enforced", "sev": "medium", "findings": [{"reg": "gdpr", "a": "Art. 25", "severity": "medium", "title": "Partial residency enforcement", "detail": "Where residency is only partly enforced, new or shadow deployments can silently place data in non-approved regions.", "phase": 2, "remedy": "Extend region-lock guardrails across all accounts and subscriptions.", "steps": ["Apply region-restriction policy to all cloud accounts", "Add residency checks to CI/CD deployment gates"]}]}, {"value": "convention", "label": "By convention / manual review only", "sev": "high", "findings": [{"reg": "gdpr", "a": "Art. 25", "severity": "high", "title": "No technical residency enforcement", "detail": "Data-protection-by-design (Art. 25) expects technical enforcement; convention-only controls routinely fail as the estate grows.", "phase": 1, "remedy": "Implement organisation-wide region-restriction guardrails.", "steps": ["Define approved regions per data classification", "Deploy preventative guardrails (e.g. SCPs / Azure Policy)", "Alert on any attempted non-compliant deployment"]}]}]}, {"id": "D1", "section": "transfers", "type": "single", "text": "Do personal data flows leave the EEA (or the UK, for UK data)?", "help": "Any egress of personal data to a third country is a 'restricted transfer' requiring a Chapter V safeguard.", "refs": [{"reg": "gdpr", "a": "Art. 44"}, {"reg": "ukgdpr", "a": "Art. 44"}], "options": [{"value": "no", "label": "No \u2014 personal data stays within EEA/UK", "sev": "positive", "findings": []}, {"value": "adequate", "label": "Yes, but only to adequate countries", "sev": "low", "findings": [{"reg": "gdpr", "a": "Art. 45", "severity": "low", "title": "Transfers rely on adequacy decisions", "detail": "Adequacy decisions are periodically reviewed and can be suspended; reliance on adequacy alone carries residual risk.", "phase": 2, "remedy": "Maintain a fallback safeguard in case an adequacy decision lapses.", "steps": ["List destination countries and their adequacy status", "Prepare SCC fallback for each"]}]}, {"value": "sccs", "label": "Yes, under SCCs / IDTA with safeguards", "sev": "medium", "findings": [{"reg": "gdpr", "a": "Art. 46", "severity": "medium", "title": "Transfers rely on SCCs \u2014 verify supplementary measures", "detail": "Post-Schrems II, SCCs alone are insufficient; a transfer impact assessment and supplementary measures are required, especially for US transfers.", "phase": 2, "remedy": "Confirm a TIA and supplementary technical measures exist for each SCC transfer.", "steps": ["Confirm SCCs are the current (2021) modules", "Complete a transfer impact assessment per destination", "Implement supplementary measures (e.g. encryption with EU-held keys)"]}]}, {"value": "sccs-dpf", "label": "Yes \u2014 to US recipients certified under the EU-US Data Privacy Framework (DPF)", "sev": "low", "findings": [{"reg": "gdpr", "a": "Art. 45", "severity": "low", "title": "Transfers relying on EU-US DPF adequacy", "detail": "US recipients certified under the EU-US Data Privacy Framework (Commission Implementing Decision (EU) 2023/1795, 10 July 2023) benefit from adequacy. Reconfirm the recipient DPF certification periodically \u2014 a future CJEU challenge remains possible; UK-established firms can additionally rely on the UK-US Data Bridge extension (October 2023).", "phase": 2, "remedy": "Maintain the DPF certification check and a fallback (SCCs + TIA) in case adequacy lapses.", "steps": ["Verify each US recipient on the DPF Program list at commerce.gov", "Document reliance on DPF adequacy in your RoPA", "Prepare SCC + TIA fallback documentation"]}]}, {"value": "nomech", "label": "Yes, without a documented mechanism / unsure", "sev": "critical", "findings": [{"reg": "gdpr", "a": "Art. 44\u201349", "severity": "critical", "title": "Undocumented international transfers", "detail": "Transferring personal data abroad without a valid, documented Chapter V mechanism is a direct GDPR breach exposing the organisation to the top tier of fines.", "phase": 1, "remedy": "Halt or lawfully paper every undocumented transfer as a priority.", "steps": ["Identify every cross-border personal-data flow", "Implement SCCs/IDTA + TIA for each, or repatriate", "Document all mechanisms in the RoPA"]}]}]}, {"id": "D2", "section": "transfers", "type": "boolean", "text": "Have transfer impact assessments (TIAs) been completed for transfers to non-adequate countries?", "help": "Schrems II requires a case-by-case assessment of whether the destination's laws undermine the SCCs, plus supplementary measures where they do.", "refs": [{"reg": "gdpr", "a": "Art. 46"}], "appliesTo": {"regulations": ["gdpr", "ukgdpr"]}, "options": [{"value": "yes", "label": "Yes \u2014 TIAs completed and documented", "sev": "positive", "findings": []}, {"value": "partial", "label": "Partially / for some transfers", "sev": "medium", "findings": [{"reg": "gdpr", "a": "Art. 46", "severity": "medium", "title": "Incomplete transfer impact assessments", "detail": "Gaps in TIA coverage leave some transfers unassessed and potentially unlawful.", "phase": 2, "remedy": "Complete TIAs for all remaining non-adequate transfers.", "steps": ["List transfers lacking a TIA", "Complete and document each TIA"]}]}, {"value": "no", "label": "No", "sev": "high", "findings": [{"reg": "gdpr", "a": "Art. 46", "severity": "high", "title": "No transfer impact assessments", "detail": "Without TIAs, reliance on SCCs is not defensible following Schrems II.", "phase": 1, "remedy": "Run TIAs for all restricted transfers and add supplementary measures.", "steps": ["Build a TIA template aligned to EDPB recommendations", "Assess each destination's surveillance regime", "Apply supplementary measures where risk is identified"]}]}]}, {"id": "D3", "section": "transfers", "type": "single", "text": "Do you rely on any cloud or data-processing service that would be subject to EU Data Act switching / portability obligations?", "help": "The Data Act (Regulation (EU) 2023/2854) applies from 12 September 2025; cloud switching provisions phase in later. Providers and their customers both have roles.", "refs": [{"reg": "dataact", "a": "Chapter VIII"}], "appliesTo": {"regulations": ["dataact"]}, "options": [{"value": "customer", "label": "Yes \u2014 as a customer of cloud / data-processing services", "sev": "low", "findings": [{"reg": "dataact", "a": "Chapter VIII", "severity": "low", "title": "Data Act switching rights available", "detail": "As a customer, the Data Act grants you rights to switch and port data between providers on transparent terms; ensure your contracts reflect these rights.", "phase": 2, "remedy": "Review provider contracts for Data Act switching / portability terms.", "steps": ["Confirm contract includes Data Act switching provisions", "Verify functional-equivalence obligations", "Track upcoming Data Act commencement milestones"]}]}, {"value": "provider", "label": "Yes \u2014 as a provider of cloud / data-processing services", "sev": "high", "findings": [{"reg": "dataact", "a": "Chapter VIII", "severity": "high", "title": "Data Act provider obligations apply", "detail": "As a provider, you must facilitate customer switching, ensure portability of exportable data, meet contractual-fairness rules, and safeguard against unlawful third-country access to non-personal data held in the EU.", "phase": 1, "remedy": "Build a Data Act compliance programme covering switching, portability and non-personal-data access safeguards.", "steps": ["Document switching / portability procedures", "Update customer contracts for Data Act terms", "Implement safeguards against unlawful third-country access to non-personal data"]}]}, {"value": "na", "label": "Not applicable / EU Data Act not in scope", "sev": "positive", "findings": []}]}, {"id": "E1", "section": "vendors", "type": "single", "text": "Do you maintain Data Processing Agreements (GDPR Art. 28) with all processors?", "help": "Every processor handling personal data on your behalf must be bound by Art. 28 terms, including subprocessor and location controls.", "refs": [{"reg": "gdpr", "a": "Art. 28"}], "options": [{"value": "all", "label": "Yes \u2014 DPAs with all processors", "sev": "positive", "findings": []}, {"value": "most", "label": "Most, with some gaps", "sev": "medium", "findings": [{"reg": "gdpr", "a": "Art. 28", "severity": "medium", "title": "Processor agreements incomplete", "detail": "Any processor without a compliant DPA processes personal data without a lawful basis for that processing relationship.", "phase": 1, "remedy": "Close DPA gaps and confirm location/subprocessor clauses.", "steps": ["Reconcile the processor list against signed DPAs", "Execute compliant DPAs for gaps", "Confirm each DPA specifies processing locations"]}]}, {"value": "few", "label": "Only for major vendors", "sev": "high", "findings": [{"reg": "gdpr", "a": "Art. 28", "severity": "high", "title": "Widespread processor-agreement gaps", "detail": "Relying on DPAs only for major vendors leaves a long tail of SaaS and analytics processors unbound and unmonitored.", "phase": 1, "remedy": "Undertake a full processor discovery and remediation.", "steps": ["Discover all processors (including SaaS/analytics)", "Prioritise by data sensitivity", "Execute DPAs across the estate"]}]}, {"value": "none", "label": "No formal DPAs / unsure", "sev": "critical", "findings": [{"reg": "gdpr", "a": "Art. 28", "severity": "critical", "title": "No processor agreements in place", "detail": "Processing personal data through processors without Art. 28 agreements is a systemic GDPR breach.", "phase": 1, "remedy": "Treat as an immediate remediation programme.", "steps": ["Stand up a processor-governance workstream", "Inventory and rank all processors", "Execute DPAs, prioritising sensitive-data processors"]}]}]}, {"id": "E2", "section": "vendors", "type": "single", "text": "Do you maintain a register of ICT third-party arrangements (DORA register of information)?", "help": "DORA requires financial entities to maintain a structured register of all ICT third-party service arrangements, flagging those supporting critical or important functions.", "refs": [{"reg": "dora", "a": "Art. 28"}], "appliesTo": {"regulations": ["dora"]}, "options": [{"value": "yes", "label": "Yes \u2014 complete and maintained", "sev": "positive", "findings": []}, {"value": "partial", "label": "Partial / in progress", "sev": "medium", "findings": [{"reg": "dora", "a": "Art. 28", "severity": "medium", "title": "DORA register of information incomplete", "detail": "An incomplete register means concentration and substitutability risk cannot be assessed and supervisory reporting will fail.", "phase": 1, "remedy": "Complete the register to the RTS template.", "steps": ["Populate the register to the regulatory template", "Flag arrangements supporting critical/important functions", "Establish maintenance ownership"]}]}, {"value": "no", "label": "No", "sev": "high", "findings": [{"reg": "dora", "a": "Art. 28", "severity": "high", "title": "No DORA register of information", "detail": "Absence of the register is a direct DORA gap and blocks any assessment of ICT concentration risk, including data-location concentration.", "phase": 1, "remedy": "Build the register as a foundational DORA deliverable.", "steps": ["Adopt the regulatory register template", "Inventory all ICT arrangements and their data locations", "Identify concentration on single providers/regions"]}]}]}, {"id": "E3", "section": "vendors", "type": "single", "text": "Do you have visibility of where your key SaaS and ICT providers actually process and store your data?", "help": "Data-location transparency is required under both GDPR (Art. 28) and DORA (Art. 30); default vendor configurations often place data outside the EU.", "refs": [{"reg": "gdpr", "a": "Art. 28"}, {"reg": "dora", "a": "Art. 30"}], "options": [{"value": "full", "label": "Full visibility \u2014 locations documented per provider", "sev": "positive", "findings": []}, {"value": "partial", "label": "Partial \u2014 some providers unclear", "sev": "medium", "findings": [{"reg": "dora", "a": "Art. 30", "severity": "medium", "title": "Partial vendor data-location visibility", "detail": "Where vendor processing locations are unclear, undisclosed non-EU processing and subprocessor chains may exist.", "phase": 2, "remedy": "Require location disclosure from every material provider.", "steps": ["Request data-location and subprocessor disclosure from providers", "Update the register/RoPA with confirmed locations"]}]}, {"value": "none", "label": "Little / no visibility", "sev": "high", "findings": [{"reg": "dora", "a": "Art. 30", "severity": "high", "title": "No vendor data-location visibility", "detail": "Without knowing where providers process your data, residency compliance cannot be asserted and DORA contractual requirements are unmet.", "phase": 1, "remedy": "Establish data-location transparency contractually and technically.", "steps": ["Add mandatory data-location clauses to contracts", "Obtain current subprocessor lists", "Verify against actual traffic/region telemetry where possible"]}]}]}, {"id": "E4", "section": "vendors", "type": "boolean", "text": "Are subprocessor changes controlled (prior notice + right to object)?", "help": "Uncontrolled subprocessor chains are a common route by which data silently moves to new jurisdictions.", "refs": [{"reg": "gdpr", "a": "Art. 28(2)"}, {"reg": "nis2", "a": "Art. 21"}], "options": [{"value": "yes", "label": "Yes \u2014 notice and objection rights in place", "sev": "positive", "findings": []}, {"value": "no", "label": "No / unsure", "sev": "medium", "findings": [{"reg": "gdpr", "a": "Art. 28(2)", "severity": "medium", "title": "Uncontrolled subprocessor changes", "detail": "Without prior-notice and objection rights, a processor can add a subprocessor in a new jurisdiction without your knowledge, moving data across borders.", "phase": 2, "remedy": "Insert subprocessor-control clauses and monitor subprocessor lists.", "steps": ["Add prior-notice + objection clauses to DPAs", "Subscribe to provider subprocessor-change notifications", "Review subprocessor lists quarterly"]}]}]}, {"id": "F1", "section": "resilience", "type": "single", "text": "Where are production backups physically stored?", "help": "Backups are frequently the forgotten residency exposure \u2014 a compliant primary with a non-EU backup is still non-compliant.", "refs": [{"reg": "gdpr", "a": "Art. 32"}, {"reg": "nis2", "a": "Art. 21"}], "options": [{"value": "eu", "label": "EU / EEA only", "sev": "positive", "findings": []}, {"value": "eu-enc", "label": "EU primary + encrypted non-EU secondary", "sev": "low", "findings": [{"reg": "gdpr", "a": "Art. 32", "severity": "low", "title": "Encrypted backup held outside the EU", "detail": "An encrypted non-EU backup is a transfer; defensibility hinges on key custody remaining under EU control.", "phase": 2, "remedy": "Confirm EU key custody or repatriate the secondary copy.", "steps": ["Confirm backup encryption keys are EU-held", "Confirm the operator cannot access plaintext"]}]}, {"value": "us-dpf", "label": "US-based, with DPF-certified backup provider", "sev": "low", "findings": [{"reg": "gdpr", "a": "Art. 45", "severity": "low", "title": "US backup relying on DPF adequacy", "detail": "Backups stored with a DPF-certified US recipient rely on adequacy; the backup is still a transfer and DPF certification must be maintained and reconfirmed periodically.", "phase": 2, "remedy": "Verify and monitor the backup provider DPF certification status.", "steps": ["Verify the backup provider on commerce.gov Data Privacy Framework Program list", "Document reliance in the RoPA", "Maintain SCC fallback in case adequacy lapses"]}]}, {"value": "us", "label": "US / non-EU based backup (no DPF)", "sev": "critical", "findings": [{"reg": "gdpr", "a": "Art. 32, 44", "severity": "critical", "title": "Backups stored in a non-EU jurisdiction", "detail": "Non-EU backups replicate every residency and transfer exposure of the primary, often silently and at full data volume. Without DPF adequacy or another Chapter V mechanism, this is a direct GDPR breach.", "phase": 1, "remedy": "Region-lock backups to the EU as an immediate action, or move to a DPF-certified provider.", "steps": ["Reconfigure backup targets to EU regions", "Purge or migrate existing non-EU backup copies", "Verify retention/deletion of migrated copies"]}]}, {"value": "unknown", "label": "Unknown", "sev": "high", "findings": [{"reg": "gdpr", "a": "Art. 30", "severity": "high", "title": "Backup location unknown", "detail": "Unknown backup location is a visibility gap that frequently conceals the largest residency exposure in the estate.", "phase": 1, "remedy": "Determine backup topology before other remediation.", "steps": ["Map the full backup and replication topology", "Document all backup destinations"]}]}]}, {"id": "F2", "section": "resilience", "type": "single", "text": "Is data encrypted at rest, and who controls the encryption keys?", "help": "Encryption with customer-held (EU-custodied) keys is a recognised supplementary measure for transfers and a strong residency safeguard.", "refs": [{"reg": "gdpr", "a": "Art. 32"}, {"reg": "eucs", "a": "Key mgmt"}], "options": [{"value": "cmk-eu", "label": "Yes \u2014 AES-256 with EU-held customer-managed keys", "sev": "positive", "findings": []}, {"value": "provider", "label": "Yes \u2014 but keys managed by the (non-EU) provider", "sev": "medium", "findings": [{"reg": "gdpr", "a": "Art. 32", "severity": "medium", "title": "Encryption keys held by non-EU provider", "detail": "Provider-managed keys mean the operator (and its home jurisdiction) can technically access plaintext, weakening encryption as a transfer safeguard.", "phase": 2, "remedy": "Move to customer-managed keys held under EU control (e.g. external key store / HYOK).", "steps": ["Adopt customer-managed keys (CMK/BYOK)", "Host key material in an EU-controlled KMS/HSM", "Consider Hold-Your-Own-Key for the most sensitive data"]}]}, {"value": "weak", "label": "Partially / weaker encryption", "sev": "high", "findings": [{"reg": "gdpr", "a": "Art. 32", "severity": "high", "title": "Inadequate encryption at rest", "detail": "Weak or partial encryption fails Art. 32 'appropriate measures' and cannot serve as a transfer supplementary measure.", "phase": 1, "remedy": "Standardise strong encryption at rest across sensitive stores.", "steps": ["Adopt AES-256 (or equivalent) for all sensitive stores", "Remediate unencrypted stores first"]}]}, {"value": "none", "label": "No encryption at rest", "sev": "critical", "findings": [{"reg": "gdpr", "a": "Art. 32", "severity": "critical", "title": "Sensitive data unencrypted at rest", "detail": "Unencrypted sensitive data at rest is a serious security-of-processing failure and dramatically increases breach severity.", "phase": 1, "remedy": "Encrypt all sensitive data at rest immediately.", "steps": ["Enable encryption at rest on all sensitive stores", "Prioritise special-category and financial data", "Verify no plaintext backups remain"]}]}]}, {"id": "F3", "section": "resilience", "type": "boolean", "text": "Is data encrypted in transit (TLS) for all connections to and between cloud systems?", "help": "In-transit encryption is table stakes for Art. 32 and prevents interception during cross-border transit.", "refs": [{"reg": "gdpr", "a": "Art. 32"}], "options": [{"value": "yes", "label": "Yes \u2014 enforced everywhere", "sev": "positive", "findings": []}, {"value": "partial", "label": "Partial \u2014 some internal traffic unencrypted", "sev": "medium", "findings": [{"reg": "gdpr", "a": "Art. 32", "severity": "medium", "title": "Gaps in in-transit encryption", "detail": "Unencrypted internal or inter-service traffic is exploitable and undermines the security-of-processing baseline.", "phase": 2, "remedy": "Enforce TLS on all links, including east-west traffic.", "steps": ["Enforce TLS 1.2+ on all connections", "Enable mutual TLS for service-to-service traffic"]}]}, {"value": "no", "label": "No / unsure", "sev": "high", "findings": [{"reg": "gdpr", "a": "Art. 32", "severity": "high", "title": "In-transit encryption not assured", "detail": "Without enforced transport encryption, data crossing networks (and borders) is exposed to interception.", "phase": 1, "remedy": "Mandate transport encryption as a baseline control.", "steps": ["Mandate TLS across all ingress/egress", "Disable plaintext protocols"]}]}]}, {"id": "F4", "section": "resilience", "type": "single", "text": "For financial entities: have you tested that critical functions survive disruption to a cross-border ICT provider?", "help": "DORA requires digital operational resilience testing, including scenarios where a key ICT/cloud provider or region becomes unavailable.", "refs": [{"reg": "dora", "a": "Art. 24\u201326"}], "appliesTo": {"regulations": ["dora"]}, "options": [{"value": "yes", "label": "Yes \u2014 tested with exit/substitution scenarios", "sev": "positive", "findings": []}, {"value": "planned", "label": "Planned but not yet performed", "sev": "medium", "findings": [{"reg": "dora", "a": "Art. 24", "severity": "medium", "title": "Resilience testing not yet performed", "detail": "Untested resilience means concentration on a single cross-border provider or region may be an unquantified single point of failure.", "phase": 2, "remedy": "Schedule resilience testing including provider-loss scenarios.", "steps": ["Define severe-but-plausible ICT disruption scenarios", "Test failover and provider substitution", "Document results and remediation"]}]}, {"value": "no", "label": "No", "sev": "high", "findings": [{"reg": "dora", "a": "Art. 24", "severity": "high", "title": "No operational resilience testing", "detail": "Absence of resilience testing is a DORA gap and leaves cross-border concentration risk unmanaged.", "phase": 1, "remedy": "Establish a digital operational resilience testing programme.", "steps": ["Stand up a DORA testing programme", "Prioritise critical-function and single-provider scenarios", "Feed results into the ICT risk framework"]}]}]}, {"id": "F5", "section": "resilience", "type": "single", "text": "For UK-regulated financial firms: are impact tolerances set for important business services (UK Operational Resilience)?", "help": "FCA PS21/3 and PRA SS2/21 require identification of important business services, impact tolerances, mapping and scenario testing. Since March 2025, firms must be able to remain within tolerances for severe-but-plausible scenarios.", "refs": [{"reg": "ukopres", "a": "FCA PS21/3; PRA SS2/21"}], "appliesTo": {"regulations": ["ukopres"]}, "options": [{"value": "yes", "label": "Yes \u2014 impact tolerances set, mapping and testing complete", "sev": "positive", "findings": []}, {"value": "partial", "label": "Partial \u2014 tolerances set but mapping / testing incomplete", "sev": "medium", "findings": [{"reg": "ukopres", "a": "FCA PS21/3", "severity": "medium", "title": "UK Op Res mapping / testing incomplete", "detail": "Impact tolerances without complete mapping and scenario testing cannot be shown to be defensible against a severe-but-plausible disruption. Post-March 2025 supervisory expectations require evidence.", "phase": 2, "remedy": "Complete mapping of important business services and scenario testing.", "steps": ["Complete mapping to underlying resources incl. ICT and data locations", "Run severe-but-plausible scenario tests", "Update the self-assessment document"]}]}, {"value": "no", "label": "No \u2014 not yet established", "sev": "high", "findings": [{"reg": "ukopres", "a": "PRA SS2/21", "severity": "high", "title": "UK operational-resilience framework not established", "detail": "Post-March 2025, the FCA and PRA expect firms to be able to demonstrate they can remain within impact tolerances for important business services. Absence is a material gap.", "phase": 1, "remedy": "Stand up the UK Op Res framework as a priority.", "steps": ["Identify important business services", "Set impact tolerances", "Map underlying resources", "Design and run scenario tests", "Produce the self-assessment"]}]}, {"value": "na", "label": "Not applicable (non-UK / non-FS)", "sev": "positive", "findings": []}]}, {"id": "G1", "section": "ai", "type": "single", "text": "Do you develop, deploy or fine-tune AI/ML systems on personal or sensitive data?", "help": "AI processing frequently defaults to non-EU compute regions and raises training-data governance obligations.", "refs": [{"reg": "aiact", "a": "Art. 10"}], "options": [{"value": "none", "label": "No AI/ML on personal or sensitive data", "sev": "positive", "findings": []}, {"value": "internal", "label": "Yes \u2014 internal / non-high-risk use", "sev": "low", "findings": [{"reg": "aiact", "a": "Art. 10", "severity": "low", "title": "AI data-governance baseline applies", "detail": "Even non-high-risk AI benefits from documented data provenance and residency to avoid future re-work as scope tightens.", "phase": 3, "remedy": "Establish baseline AI data-governance and training-data residency.", "steps": ["Document training-data sources and residency", "Set a policy for AI compute region selection"]}]}, {"value": "highrisk", "label": "Yes \u2014 high-risk AI (e.g. credit scoring, life/health insurance pricing, employment/HR AI, biometric identification)", "sev": "high", "findings": [{"reg": "aiact", "a": "Art. 10, 12; Annex III items 1, 4, 5(b), 5(c)", "severity": "high", "title": "High-risk AI data-governance obligations", "detail": "Annex III of the AI Act enumerates high-risk categories including biometric identification (item 1), employment/workforce management (item 4), creditworthiness (item 5(b)), and life/health insurance risk-and-pricing (item 5(c)). High-risk AI must meet Art. 10 data-governance requirements \u2014 relevant, representative, error-checked datasets with documented provenance \u2014 plus record-keeping and human oversight.", "phase": 1, "remedy": "Implement AI Act data-governance controls and confirm training residency.", "steps": ["Classify AI systems against Annex III high-risk categories", "Implement data-governance and provenance controls (Art. 10)", "Confirm training/validation environments reside in approved regions", "Establish record-keeping and human-oversight measures"]}]}]}, {"id": "G2", "section": "ai", "type": "single", "text": "Where does AI model training and inference compute physically run?", "help": "Training compute frequently defaults to US regions (e.g. managed ML platforms), moving sensitive training data across borders.", "refs": [{"reg": "gdpr", "a": "Art. 44"}, {"reg": "dora", "a": "Art. 5"}], "appliesTo": {"regulations": ["aiact", "gdpr", "dora"]}, "options": [{"value": "eu", "label": "EU regions only", "sev": "positive", "findings": []}, {"value": "mixed", "label": "Mixed \u2014 some non-EU compute", "sev": "high", "findings": [{"reg": "gdpr", "a": "Art. 44", "severity": "high", "title": "AI compute partly outside the EU", "detail": "Non-EU training or inference moves sensitive training data across borders \u2014 a transfer that often escapes the RoPA entirely.", "phase": 2, "remedy": "Region-lock AI compute for sensitive workloads to the EU.", "steps": ["Audit ML platform default regions", "Region-lock training and inference for sensitive data", "Update the RoPA to capture AI data flows"]}]}, {"value": "us-dpf", "label": "Primarily US / non-EU compute, with DPF-certified provider", "sev": "medium", "findings": [{"reg": "gdpr", "a": "Art. 45", "severity": "medium", "title": "AI compute at DPF-certified US provider", "detail": "Running training/inference on sensitive data at a DPF-certified US recipient benefits from adequacy; residual Schrems-III risk plus DORA and AI Act residency and record-keeping obligations still apply.", "phase": 2, "remedy": "Verify DPF certification and add AI-specific contractual controls; consider sovereign alternatives for the most sensitive workloads.", "steps": ["Verify the AI compute provider on commerce.gov Data Privacy Framework Program list", "Add AI-specific data-protection and data-provenance terms", "Consider EU sovereign AI compute for the most sensitive workloads"]}]}, {"value": "us", "label": "Primarily US / non-EU compute (no DPF)", "sev": "critical", "findings": [{"reg": "gdpr", "a": "Art. 44", "severity": "critical", "title": "AI compute located outside the EU", "detail": "Running training/inference on sensitive data in non-EU regions without a valid Chapter V mechanism is a restricted transfer at scale, frequently undocumented, and may breach DORA and the AI Act simultaneously.", "phase": 1, "remedy": "Repatriate sensitive AI compute to the EU or an approved sovereign platform, or move to a DPF-certified provider.", "steps": ["Identify all non-EU AI compute touching sensitive data", "Migrate to EU / sovereign ML platforms", "Implement provenance tracking for training data"]}]}, {"value": "unknown", "label": "Unknown", "sev": "high", "findings": [{"reg": "gdpr", "a": "Art. 30", "severity": "high", "title": "AI compute location unknown", "detail": "Unknown AI compute location is a common blind spot where the largest undocumented transfers occur.", "phase": 1, "remedy": "Determine where AI workloads actually execute.", "steps": ["Trace AI platform region configuration", "Document AI data flows in the RoPA"]}]}]}, {"id": "G3", "section": "ai", "type": "single", "text": "Do you use, embed or provide any general-purpose AI (GPAI) model in production (e.g. LLMs, foundation models)?", "help": "GPAI obligations under EU AI Act Chapter V (Arts. 51\u201356) attach differently depending on your role \u2014 provider, downstream user, or integrator.", "refs": [{"reg": "aiact", "a": "Chapter V, Arts. 51\u201356"}], "appliesTo": {"regulations": ["aiact"]}, "options": [{"value": "none", "label": "No \u2014 we do not use GPAI", "sev": "positive", "findings": []}, {"value": "downstream", "label": "Yes \u2014 we deploy third-party GPAI (downstream user)", "sev": "low", "findings": [{"reg": "aiact", "a": "Art. 51\u201356", "severity": "low", "title": "GPAI downstream-user obligations", "detail": "Downstream users of GPAI benefit from the transparency documentation provided by the GPAI provider, must respect copyright policy, and must ensure their use case does not silently turn a general model into an Annex III high-risk system without corresponding controls.", "phase": 2, "remedy": "Integrate GPAI provider transparency documentation into your AI governance.", "steps": ["Obtain and archive GPAI provider transparency documentation", "Ensure your use case does not create an unclassified high-risk system", "Track EU AI Office guidance updates"]}]}, {"value": "provider", "label": "Yes \u2014 we develop / provide our own GPAI models placed on the EU market", "sev": "high", "findings": [{"reg": "aiact", "a": "Art. 51\u201356", "severity": "high", "title": "GPAI provider obligations apply", "detail": "Providers of GPAI models placed on the EU market are subject to Chapter V: technical documentation, transparency to downstream deployers, EU copyright compliance policy, publication of a training-data summary, cooperation with the AI Office. Systemic-risk GPAI (compute threshold under Art. 51(2)) owes additional model-evaluation, adversarial-testing and incident-reporting duties. GPAI provisions apply from 2 August 2025.", "phase": 1, "remedy": "Stand up a GPAI compliance programme covering documentation, transparency, copyright and cooperation.", "steps": ["Produce technical documentation per AI Office template", "Publish training-data summary", "Adopt an EU copyright compliance policy", "If systemic-risk: model evaluation, adversarial testing, cybersecurity, incident reporting"]}]}, {"value": "integrator", "label": "Yes \u2014 we embed third-party GPAI into products or services we sell", "sev": "medium", "findings": [{"reg": "aiact", "a": "Art. 25", "severity": "medium", "title": "Integrator may become provider under Art. 25", "detail": "Firms placing an AI system on the market under their own name may be treated as providers of the resulting system (Art. 25 \u2014 provider substitution). Assess whether provider-level obligations attach to the integrated system in addition to base-model provider obligations.", "phase": 2, "remedy": "Assess Art. 25 provider-substitution risk for each integrated GPAI product.", "steps": ["Map each product embedding third-party GPAI", "Determine if you place the system under your own name", "Adopt provider-level obligations where applicable"]}]}]}, {"id": "G4", "section": "ai", "type": "single", "text": "For UK-established firms using AI/ML: how aligned is your AI governance with UK principles-based expectations (ICO / FCA / PRA)?", "help": "The UK follows a principles-based, regulator-led AI approach. ICO guidance on AI and data protection, FCA supervisory expectations for AI in regulated activities, and PRA/BoE SS1/23 on model risk management for AI/ML apply.", "refs": [{"reg": "ukai", "a": "ICO AI guidance; FCA AI update; PRA/BoE SS1/23"}], "appliesTo": {"regulations": ["ukai"]}, "options": [{"value": "aligned", "label": "Yes \u2014 governance evidenced against ICO / FCA / PRA principles", "sev": "positive", "findings": []}, {"value": "partial", "label": "Partial \u2014 awareness of ICO / FCA / PRA expectations, evidence incomplete", "sev": "medium", "findings": [{"reg": "ukai", "a": "ICO / FCA / PRA principles", "severity": "medium", "title": "UK AI governance evidence incomplete", "detail": "Principles-based expectations still require evidence \u2014 DPIAs for AI processing (ICO), consumer-duty and senior-manager accountability (FCA), and model risk governance (PRA/BoE SS1/23). Partial alignment is a common finding; document controls end-to-end.", "phase": 2, "remedy": "Close the evidence gaps against each supervisor guideline.", "steps": ["Complete DPIAs for AI processing personal data (ICO)", "Document FCA-relevant AI governance for regulated activities", "Adopt SS1/23 model risk management framework for material AI/ML"]}]}, {"value": "none", "label": "No \u2014 UK AI governance not established", "sev": "high", "findings": [{"reg": "ukai", "a": "ICO / FCA / PRA principles", "severity": "high", "title": "UK AI governance not established", "detail": "Absence of AI governance in a UK-regulated firm exposes the firm to ICO enforcement on data-protection aspects and to FCA/PRA supervisory action for regulated activities. PRA/BoE SS1/23 is now the reference framework for banks and insurers on AI/ML model risk.", "phase": 1, "remedy": "Stand up an AI governance framework aligned to the three UK supervisory streams.", "steps": ["Establish an AI governance forum with named executive owner", "Complete DPIAs for AI processing (ICO)", "Adopt SS1/23 model risk management principles", "Align to FCA senior-manager accountability and consumer duty"]}]}, {"value": "na", "label": "Not applicable (no UK establishment or no AI use)", "sev": "positive", "findings": []}]}, {"id": "H1", "section": "cloud", "type": "single", "text": "What is the jurisdiction of the entity that ultimately controls your primary cloud platform?", "help": "Operator jurisdiction \u2014 not just data-centre location \u2014 determines exposure to extraterritorial access laws (e.g. US CLOUD Act).", "refs": [{"reg": "eucs", "a": "Sovereignty"}, {"reg": "gdpr", "a": "Art. 44"}], "options": [{"value": "eu", "label": "EU-controlled operator", "sev": "positive", "findings": []}, {"value": "us-eubound", "label": "US-controlled, with EU 'sovereign' boundary offering", "sev": "medium", "findings": [{"reg": "eucs", "a": "Sovereignty", "severity": "medium", "title": "US operator with sovereign boundary", "detail": "Sovereign-boundary offerings from US operators reduce but do not eliminate jurisdictional exposure; the degree of protection depends on operational control and key custody.", "phase": 2, "remedy": "Validate the sovereign offering's operational-control and key-custody claims against your data classification.", "steps": ["Review the sovereign offering's control model", "Confirm EU-personnel operation and EU key custody", "Assess residual CLOUD Act exposure"]}]}, {"value": "us", "label": "US-controlled operator (standard offering)", "sev": "high", "findings": [{"reg": "gdpr", "a": "Art. 44", "severity": "high", "title": "US-controlled cloud for regulated data", "detail": "A US-controlled operator is subject to US extraterritorial access laws regardless of data-centre location, a recognised Schrems II concern.", "phase": 2, "remedy": "For the most sensitive workloads, evaluate sovereign or EU-controlled alternatives.", "steps": ["Classify workloads by sensitivity", "Evaluate sovereign options for the highest tier", "Apply supplementary measures (EU-held keys) in the interim"]}]}, {"value": "other", "label": "Other non-EU jurisdiction", "sev": "high", "findings": [{"reg": "gdpr", "a": "Art. 44", "severity": "high", "title": "Non-EU operator jurisdiction", "detail": "Any non-EU operator jurisdiction should be assessed for extraterritorial access risk and adequacy.", "phase": 2, "remedy": "Assess the jurisdiction's access laws and adequacy status.", "steps": ["Assess the operator jurisdiction's surveillance regime", "Confirm a valid transfer mechanism"]}]}]}, {"id": "H2", "section": "cloud", "type": "single", "text": "For regulated workloads, is the cloud service certified to an assurance level (e.g. EUCS Substantial/High)?", "help": "Assurance certification provides objective evidence of the controls appropriate to the sensitivity of hosted data.", "refs": [{"reg": "eucs", "a": "Assurance levels"}], "appliesTo": {"regulations": ["eucs", "nis2"]}, "options": [{"value": "high", "label": "Yes \u2014 High assurance", "sev": "positive", "findings": []}, {"value": "substantial", "label": "Yes \u2014 Substantial assurance", "sev": "low", "findings": [{"reg": "eucs", "a": "Assurance", "severity": "low", "title": "Substantial assurance in place", "detail": "Substantial assurance suits many workloads; the most sensitive or sovereignty-critical data may warrant High.", "phase": 3, "remedy": "Confirm the assurance level matches your highest data classification.", "steps": ["Map workloads to required assurance levels", "Escalate the most sensitive workloads to High where needed"]}]}, {"value": "basic", "label": "Yes \u2014 Basic assurance", "sev": "medium", "findings": [{"reg": "eucs", "a": "Assurance \u2014 Basic", "severity": "medium", "title": "Basic assurance may under-serve regulated workloads", "detail": "EUCS Basic covers low-sensitivity workloads. Regulated data \u2014 especially personal, financial, or special-category \u2014 typically requires Substantial or High assurance for defensibility.", "phase": 2, "remedy": "Match assurance level to workload sensitivity; escalate regulated workloads above Basic.", "steps": ["Identify workloads currently on Basic-assured platforms", "Reclassify per data sensitivity", "Migrate or contract for Substantial or High assurance where needed"]}]}, {"value": "none", "label": "No formal assurance certification", "sev": "medium", "findings": [{"reg": "eucs", "a": "Assurance", "severity": "medium", "title": "No cloud assurance certification", "detail": "Without a recognised assurance level, the appropriateness of cloud security controls for regulated data cannot be objectively demonstrated.", "phase": 2, "remedy": "Pursue assurance certification for platforms hosting regulated data.", "steps": ["Identify platforms hosting regulated data", "Target an appropriate assurance level", "Include assurance in future procurement criteria"]}]}]}, {"id": "H3", "section": "cloud", "type": "multi", "text": "For any 'sovereign-boundary' or EU-controlled cloud offering, which controls are contractually and operationally in place?", "help": "An offering marketed as 'sovereign' but without contractual, operational and cryptographic controls is not sovereign in a legal sense. This question fires the evidence side of Q_H1.", "refs": [{"reg": "eucs", "a": "Sovereignty"}, {"reg": "gdpr", "a": "Art. 32, 44"}], "options": [{"value": "eu-personnel", "label": "EU-only operations personnel (customer support and platform operators are EU nationals)", "sev": "positive", "findings": []}, {"value": "hyok", "label": "Customer-held encryption keys (HYOK / EU-controlled KMS)", "sev": "positive", "findings": []}, {"value": "antidisclosure", "label": "Contractual protection against extraterritorial disclosure requests (e.g. CLOUD Act, FISA \u00a7702)", "sev": "positive", "findings": []}, {"value": "eu-subprocessors", "label": "Sub-processor list restricted to EU-jurisdiction entities", "sev": "positive", "findings": []}, {"value": "local-entity", "label": "Local operating entity with EU jurisdiction of dispute resolution", "sev": "positive", "findings": []}, {"value": "none", "label": "None of the above / not documented", "sev": "high", "findings": [{"reg": "eucs", "a": "Sovereignty", "severity": "high", "title": "Sovereign offering claimed without documented controls", "detail": "An offering marketed as 'sovereign' but without documented EU-personnel operations, customer-held keys, anti-disclosure clauses or sub-processor limits is not sovereign in a legal sense \u2014 CLOUD Act and other extraterritorial exposures remain.", "phase": 1, "remedy": "Document each sovereignty control contractually or select a genuinely sovereign platform.", "steps": ["Request contractual evidence for each sovereignty claim", "Verify EU-personnel operations model", "Confirm key custody arrangements", "Restrict sub-processor list to EU jurisdictions"]}]}]}, {"id": "I1", "section": "governance", "type": "single", "text": "Do your cloud/ICT contracts grant audit and inspection rights over data handling?", "help": "Audit rights are explicitly required under DORA (Art. 30) and expected under NIS2 supply-chain security and GDPR Art. 28.", "refs": [{"reg": "dora", "a": "Art. 30"}, {"reg": "gdpr", "a": "Art. 28"}], "options": [{"value": "full", "label": "Yes \u2014 full audit and inspection rights", "sev": "positive", "findings": []}, {"value": "limited", "label": "Limited (e.g. reports only, no on-site)", "sev": "medium", "findings": [{"reg": "dora", "a": "Art. 30", "severity": "medium", "title": "Limited audit rights", "detail": "Report-only rights may not satisfy DORA's requirement for effective audit and access, including for critical/important functions.", "phase": 2, "remedy": "Negotiate fuller audit and access rights for critical arrangements.", "steps": ["Identify contracts supporting critical/important functions", "Negotiate on-site/access and audit rights", "Document supervisory access provisions"]}]}, {"value": "none", "label": "No audit rights / unsure", "sev": "high", "findings": [{"reg": "dora", "a": "Art. 30", "severity": "high", "title": "No contractual audit rights", "detail": "Absence of audit rights breaches DORA contractual requirements and prevents verification of data-location and security claims.", "phase": 1, "remedy": "Insert mandatory DORA audit and access clauses.", "steps": ["Add DORA-mandated clauses to ICT contracts", "Prioritise critical-function providers", "Confirm regulator access rights"]}]}]}, {"id": "I2", "section": "governance", "type": "single", "text": "Who owns data-residency decisions in your organisation?", "help": "NIS2 places accountability on management bodies; unclear ownership is a common root cause of residency drift.", "refs": [{"reg": "nis2", "a": "Art. 20"}], "options": [{"value": "exec", "label": "Clear executive owner with a governance forum", "sev": "positive", "findings": []}, {"value": "diffuse", "label": "Shared across teams, no single owner", "sev": "medium", "findings": [{"reg": "nis2", "a": "Art. 20", "severity": "medium", "title": "Diffuse residency ownership", "detail": "Without a single accountable owner, residency decisions are made inconsistently at team level and drift over time.", "phase": 2, "remedy": "Assign an accountable executive and a governance forum.", "steps": ["Assign an accountable executive for data residency", "Establish a cross-functional governance forum", "Define decision rights and escalation"]}]}, {"value": "none", "label": "No clear owner", "sev": "high", "findings": [{"reg": "nis2", "a": "Art. 20", "severity": "high", "title": "No accountable owner for residency", "detail": "NIS2 requires management-body accountability for cyber risk; unowned residency risk cannot be governed and exposes management personally.", "phase": 1, "remedy": "Establish accountable ownership at management-body level.", "steps": ["Nominate a management-body owner", "Brief the board on NIS2 accountability", "Stand up governance and reporting"]}]}]}, {"id": "I3", "section": "governance", "type": "single", "text": "For UK-regulated financial firms: do you rely on providers that may be designated Critical Third Parties (CTPs) under FSMA 2023?", "help": "HM Treasury (on recommendation of FCA / PRA / BoE) designates CTPs. Designated CTPs are subject to six Fundamental Rules and joint FCA / PRA / BoE oversight. The rules bind the provider, but your own resilience accountability is undiminished.", "refs": [{"reg": "ukctp", "a": "FSMA 2023 Part 9; FCA PS24/16; PRA PS16/24"}], "appliesTo": {"regulations": ["ukctp"]}, "options": [{"value": "yes", "label": "Yes \u2014 we rely on likely / designated CTPs and understand our own residual duties", "sev": "low", "findings": [{"reg": "ukctp", "a": "FSMA 2023 Part 9", "severity": "low", "title": "CTP dependency identified and managed", "detail": "CTP designations bind the provider under FCA / PRA / BoE oversight, but your own outsourcing, resilience and exit-planning duties are undiminished. Maintain governance directly.", "phase": 2, "remedy": "Maintain outsourcing governance and exit-plan readiness for CTP arrangements.", "steps": ["Identify all critical arrangements with likely CTPs", "Confirm outsourcing controls remain in place", "Update exit plans and concentration-risk analysis"]}]}, {"value": "unsure", "label": "Unsure \u2014 CTP status of key providers not established", "sev": "medium", "findings": [{"reg": "ukctp", "a": "FSMA 2023", "severity": "medium", "title": "CTP dependency status unclear", "detail": "Not knowing which of your providers is (or may be) a designated CTP prevents effective concentration-risk and exit-plan design.", "phase": 2, "remedy": "Establish which providers are likely CTPs and plan accordingly.", "steps": ["List providers supporting important business services", "Assess likelihood of CTP designation via HM Treasury", "Refresh concentration-risk analysis"]}]}, {"value": "no", "label": "No \u2014 no material CTP dependencies", "sev": "positive", "findings": []}, {"value": "na", "label": "Not applicable (non-UK / non-FS)", "sev": "positive", "findings": []}]}, {"id": "J1", "section": "incident", "type": "single", "text": "Can you detect and report a personal-data breach within 72 hours (GDPR) and a major incident within NIS2/DORA windows?", "help": "GDPR requires notification within 72 hours; NIS2 requires an early warning within 24 hours and a full report within 72; DORA (via Commission Delegated Regulation (EU) 2025/301) requires initial notification within 4 hours of classifying an incident as major, an intermediate report within 72 hours, and a final report within 1 month.", "refs": [{"reg": "gdpr", "a": "Art. 33"}, {"reg": "nis2", "a": "Art. 23"}, {"reg": "dora", "a": "Art. 19; Comm. Del. Reg. (EU) 2025/301 (initial 4h / intermediate 72h / final 1 month)"}], "options": [{"value": "yes", "label": "Yes \u2014 tested detection and reporting process", "sev": "positive", "findings": []}, {"value": "partial", "label": "Process exists but untested / unclear on cross-border", "sev": "medium", "findings": [{"reg": "nis2", "a": "Art. 23", "severity": "medium", "title": "Incident reporting readiness unproven", "detail": "Overlapping GDPR/NIS2/DORA windows are hard to meet without a tested process, especially where data spans multiple jurisdictions and authorities.", "phase": 2, "remedy": "Test the incident-reporting process against all applicable regimes.", "steps": ["Map notification duties across GDPR/NIS2/DORA", "Run a cross-border breach tabletop", "Pre-identify each competent authority and template"]}]}, {"value": "no", "label": "No reliable process", "sev": "high", "findings": [{"reg": "nis2", "a": "Art. 23", "severity": "high", "title": "Incident reporting not assured", "detail": "Missing statutory reporting windows compounds an incident with regulatory penalties across multiple regimes.", "phase": 1, "remedy": "Establish a multi-regime incident detection and reporting capability.", "steps": ["Stand up incident detection and triage", "Build a multi-regime notification playbook", "Establish 24/72-hour reporting readiness"]}]}]}, {"id": "K1", "section": "outcomes", "type": "single", "text": "What is your compliance tolerance for this assessment?", "help": "Shapes how aggressively the roadmap sequences remediation.", "refs": [], "scoreOnly": true, "options": [{"value": "zero", "label": "Zero tolerance \u2014 strict compliance required", "sev": "low", "findings": []}, {"value": "minimal", "label": "Minimal \u2014 acceptable with a short-term plan", "sev": "low", "findings": []}, {"value": "moderate", "label": "Moderate \u2014 acceptable if residual risk is low", "sev": "low", "findings": []}, {"value": "flexible", "label": "Flexible \u2014 cost/performance prioritised", "sev": "low", "findings": []}]}, {"id": "K2", "section": "outcomes", "type": "single", "text": "What is your investment appetite for remediation across Phases 1\u20133?", "help": "Used to frame the roadmap's ambition and sequencing.", "refs": [], "scoreOnly": true, "options": [{"value": "high", "label": "High \u2014 significant, near-term investment available", "sev": "low", "findings": []}, {"value": "medium", "label": "Medium \u2014 phased over 6\u201312 months", "sev": "low", "findings": []}, {"value": "low", "label": "Low \u2014 quick wins only for now", "sev": "low", "findings": []}, {"value": "tbd", "label": "Under review", "sev": "low", "findings": []}]}, {"id": "K3", "section": "outcomes", "type": "multi", "text": "Which outcomes matter most for the target architecture?", "help": "Frames the strategic narrative in the report's roadmap.", "refs": [], "scoreOnly": true, "options": [{"value": "compliance", "label": "Demonstrable regulatory compliance", "sev": "low", "findings": []}, {"value": "sovereignty", "label": "Data sovereignty as a market differentiator", "sev": "low", "findings": []}, {"value": "resilience", "label": "Operational resilience / DR assurance", "sev": "low", "findings": []}, {"value": "cost", "label": "Cost control during remediation", "sev": "low", "findings": []}, {"value": "performance", "label": "No degradation of application performance", "sev": "low", "findings": []}, {"value": "speed", "label": "Speed to a defensible position", "sev": "low", "findings": []}]}]},
  "sovereign-iq": {"meta": {"id": "sovereign-iq", "name": "Sovereign IQ", "version": "3.0.0", "profile": "rules_engine", "lastReviewed": "2026-09-28", "disclaimer": "This executive diagnostic provides directional technical sovereignty and regulatory defensibility analysis. It does not constitute legal counsel."}, "pillars": [{"id": "P1", "code": "P1", "name": "Data Sovereignty & Localization", "weight": 0.25, "desc": "Data at rest, in transit, and in-memory residency across borders."}, {"id": "P2", "code": "P2", "name": "Jurisdictional Reach & Extraterritoriality", "weight": 0.25, "desc": "Immunity to foreign subpoenas, CLOUD Act reach & conflict of laws."}, {"id": "P3", "code": "P3", "name": "Operational & Personnel Sovereignty", "weight": 0.15, "desc": "Local clearance, 24/7 follow-the-sun admin bounds & out-of-band telemetry."}, {"id": "P4", "code": "P4", "name": "Cryptographic & Technical Autonomy", "weight": 0.2, "desc": "HYOK/External Key Management, HSM isolation & Confidential Computing."}, {"id": "P5", "code": "P5", "name": "Software, Vendor & Supply Chain Sovereignty", "weight": 0.15, "desc": "CTPP concentration, exitability, open standards & hardware provenance."}], "maturityStages": [{"stage": 1, "label": "Reactive", "band": [0, 20], "color": "#D32F2F", "desc": "Compliance handled ad-hoc and after the fact; cross-border and foreign access exposure largely unmapped."}, {"stage": 2, "label": "Aware", "band": [21, 40], "color": "#B8860B", "desc": "Obligations identified; residency addressed on paper but operational and jurisdictional controls patchy."}, {"stage": 3, "label": "Structured", "band": [41, 60], "color": "#226882", "desc": "Defined policies and ownership; residency localized, but vendor-held encryption keys and SaaS blindspots remain."}, {"stage": 4, "label": "Managed", "band": [61, 80], "color": "#482475", "desc": "Controls tested and evidenced; HYOK/BYOK deployed, sub-processor chains audited, and exit strategies documented."}, {"stage": 5, "label": "Sovereign-by-Design", "band": [81, 100], "color": "#35754D", "desc": "Sovereignty embedded in architecture, procurement & CI/CD; provably immune to extraterritorial overreach."}], "regimes": [{"id": "DORA", "name": "Digital Operational Resilience Act (DORA)", "short": "EU \u00b7 Financial ICT Resilience", "jurisdiction": "EU", "citation": "Regulation (EU) 2022/2554", "url": "https://eur-lex.europa.eu/eli/reg/2022/2554/oj", "impact": 4, "penalty_rule": "Periodic penalty payments up to 1% daily global turnover for CTPPs; severe supervisory sanctions.", "duties": ["Board ICT risk governance", "Major incident reporting within 4h", "Threat-Led Penetration Testing (TLPT) >= 3 yrs", "Register of Information for all ICT contracts", "Documented & tested exit strategies for critical functions"]}, {"id": "NIS2", "name": "NIS2 Directive & CER", "short": "EU \u00b7 Critical Infrastructure Cyber", "jurisdiction": "EU", "citation": "Directive (EU) 2022/2555", "url": "https://eur-lex.europa.eu/eli/dir/2022/2555/oj", "impact": 4, "penalty_rule": "Up to \u20ac10M or 2% global turnover for essential entities; \u20ac7M or 1.4% for important entities.", "duties": ["Corporate cyber hygiene (MFA, asset inventory, patching)", "Supply chain security assessments", "24h early warning incident reporting", "Direct management body liability for non-compliance"]}, {"id": "EU_AI_ACT", "name": "EU AI Act", "short": "EU \u00b7 High-Risk AI & GPAI", "jurisdiction": "EU", "citation": "Regulation (EU) 2024/1689", "url": "https://eur-lex.europa.eu/eli/reg/2024/1689/oj", "impact": 4, "penalty_rule": "Up to \u20ac35M or 7% global turnover (prohibited AI); \u20ac15M or 3% (high-risk violations).", "duties": ["Risk management system & data governance for Annex III high-risk AI", "Technical documentation & continuous event logging", "Human oversight controls & conformity assessment", "GPAI provider transparency & copyright policy compliance"]}, {"id": "EU_DATA_ACT", "name": "EU Data Act", "short": "EU
