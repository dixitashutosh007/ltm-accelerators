the full backup and replication topology", "Document all backup destinations"]}]}]}, {"id": "F2", "section": "resilience", "type": "single", "text": "Is data encrypted at rest, and who controls the encryption keys?", "help": "Encryption with customer-held (EU-custodied) keys is a recognised supplementary measure for transfers and a strong residency safeguard.", "refs": [{"reg": "gdpr", "a": "Art. 32"}, {"reg": "eucs", "a": "Key mgmt"}], "options": [{"value": "cmk-eu", "label": "Yes \u2014 AES-256 with EU-held customer-managed keys", "sev": "positive", "findings": []}, {"value": "provider", "label": "Yes \u2014 but keys managed by the (non-EU) provider", "sev": "medium", "findings": [{"reg": "gdpr", "a": "Art. 32", "severity": "medium", "title": "Encryption keys held by non-EU provider", "detail": "Provider-managed keys mean the operator (and its home jurisdiction) can technically access plaintext, weakening encryption as a transfer safeguard.", "phase": 2, "remedy": "Move to customer-managed keys held under EU control (e.g. external key store / HYOK).", "steps": ["Adopt customer-managed keys (CMK/BYOK)", "Host key material in an EU-controlled KMS/HSM", "Consider Hold-Your-Own-Key for the most sensitive data"]}]}, {"value": "weak", "label": "Partially / weaker encryption", "sev": "high", "findings": [{"reg": "gdpr", "a": "Art. 32", "severity": "high", "title": "Inadequate encryption at rest", "detail": "Weak or partial encryption fails Art. 32 'appropriate measures' and cannot serve as a transfer supplementary measure.", "phase": 1, "remedy": "Standardise strong encryption at rest across sensitive stores.", "steps": ["Adopt AES-256 (or equivalent) for all sensitive stores", "Remediate unencrypted stores first"]}]}, {"value": "none", "label": "No encryption at rest", "sev": "critical", "findings": [{"reg": "gdpr", "a": "Art. 32", "severity": "critical", "title": "Sensitive data unencrypted at rest", "detail": "Unencrypted sensitive data at rest is a serious security-of-processing failure and dramatically increases breach severity.", "phase": 1, "remedy": "Encrypt all sensitive data at rest immediately.", "steps": ["Enable encryption at rest on all sensitive stores", "Prioritise special-category and financial data", "Verify no plaintext backups remain"]}]}]}, {"id": "F3", "section": "resilience", "type": "boolean", "text": "Is data encrypted in transit (TLS) for all connections to and between cloud systems?", "help": "In-transit encryption is table stakes for Art. 32 and prevents interception during cross-border transit.", "refs": [{"reg": "gdpr", "a": "Art. 32"}], "options": [{"value": "yes", "label": "Yes \u2014 enforced everywhere", "sev": "positive", "findings": []}, {"value": "partial", "label": "Partial \u2014 some internal traffic unencrypted", "sev": "medium", "findings": [{"reg": "gdpr", "a": "Art. 32", "severity": "medium", "title": "Gaps in in-transit encryption", "detail": "Unencrypted internal or inter-service traffic is exploitable and undermines the security-of-processing baseline.", "phase": 2, "remedy": "Enforce TLS on all links, including east-west traffic.", "steps": ["Enforce TLS 1.2+ on all connections", "Enable mutual TLS for service-to-service traffic"]}]}, {"value": "no", "label": "No / unsure", "sev": "high", "findings": [{"reg": "gdpr", "a": "Art. 32", "severity": "high", "title": "In-transit encryption not assured", "detail": "Without enforced transport encryption, data crossing networks (and borders) is exposed to interception.", "phase": 1, "remedy": "Mandate transport encryption as a baseline control.", "steps": ["Mandate TLS across all ingress/egress", "Disable plaintext protocols"]}]}]}, {"id": "F4", "section": "resilience", "type": "single", "text": "For financial entities: have you tested that critical functions survive disruption to a cross-border ICT provider?", "help": "DORA requires digital operational resilience testing, including scenarios where a key ICT/cloud provider or region becomes unavailable.", "refs": [{"reg": "dora", "a": "Art. 24\u201326"}], "appliesTo": {"regulations": ["dora"]}, "options": [{"value": "yes", "label": "Yes \u2014 tested with exit/substitution scenarios", "sev": "positive", "findings": []}, {"value": "planned", "label": "Planned but not yet performed", "sev": "medium", "findings": [{"reg": "dora", "a": "Art. 24", "severity": "medium", "title": "Resilience testing not yet performed", "detail": "Untested resilience means concentration on a single cross-border provider or region may be an unquantified single point of failure.", "phase": 2, "remedy": "Schedule resilience testing including provider-loss scenarios.", "steps": ["Define severe-but-plausible ICT disruption scenarios", "Test failover and provider substitution", "Document results and remediation"]}]}, {"value": "no", "label": "No", "sev": "high", "findings": [{"reg": "dora", "a": "Art. 24", "severity": "high", "title": "No operational resilience testing", "detail": "Absence of resilience testing is a DORA gap and leaves cross-border concentration risk unmanaged.", "phase": 1, "remedy": "Establish a digital operational resilience testing programme.", "steps": ["Stand up a DORA testing programme", "Prioritise critical-function and single-provider scenarios", "Feed results into the ICT risk framework"]}]}]}, {"id": "F5", "section": "resilience", "type": "single", "text": "For UK-regulated financial firms: are impact tolerances set for important business services (UK Operational Resilience)?", "help": "FCA PS21/3 and PRA SS2/21 require identification of important business services, impact tolerances, mapping and scenario testing. Since March 2025, firms must be able to remain within tolerances for severe-but-plausible scenarios.", "refs": [{"reg": "ukopres", "a": "FCA PS21/3; PRA SS2/21"}], "appliesTo": {"regulations": ["ukopres"]}, "options": [{"value": "yes", "label": "Yes \u2014 impact tolerances set, mapping and testing complete", "sev": "positive", "findings": []}, {"value": "partial", "label": "Partial \u2014 tolerances set but mapping / testing incomplete", "sev": "medium", "findings": [{"reg": "ukopres", "a": "FCA PS21/3", "severity": "medium", "title": "UK Op Res mapping / testing incomplete", "detail": "Impact tolerances without complete mapping and scenario testing cannot be shown to be defensible against a severe-but-plausible disruption. Post-March 2025 supervisory expectations require evidence.", "phase": 2, "remedy": "Complete mapping of important business services and scenario testing.", "steps": ["Complete mapping to underlying resources incl. ICT and data locations", "Run severe-but-plausible scenario tests", "Update the self-assessment document"]}]}, {"value": "no", "label": "No \u2014 not yet established", "sev": "high", "findings": [{"reg": "ukopres", "a": "PRA SS2/21", "severity": "high", "title": "UK operational-resilience framework not established", "detail": "Post-March 2025, the FCA and PRA expect firms to be able to demonstrate they can remain within impact tolerances for important business services. Absence is a material gap.", "phase": 1, "remedy": "Stand up the UK Op Res framework as a priority.", "steps": ["Identify important business services", "Set impact tolerances", "Map underlying resources", "Design and run scenario tests", "Produce the self-assessment"]}]}, {"value": "na", "label": "Not applicable (non-UK / non-FS)", "sev": "positive", "findings": []}]}, {"id": "G1", "section": "ai", "type": "single", "text": "Do you develop, deploy or fine-tune AI/ML systems on personal or sensitive data?", "help": "AI processing frequently defaults to non-EU compute regions and raises training-data governance obligations.", "refs": [{"reg": "aiact", "a": "Art. 10"}], "options": [{"value": "none", "label": "No AI/ML on personal or sensitive data", "sev": "positive", "findings": []}, {"value": "internal", "label": "Yes \u2014 internal / non-high-risk use", "sev": "low", "findings": [{"reg": "aiact", "a": "Art. 10", "severity": "low", "title": "AI data-governance baseline applies", "detail": "Even non-high-risk AI benefits from documented data provenance and residency to avoid future re-work as scope tightens.", "phase": 3, "remedy": "Establish baseline AI data-governance and training-data residency.", "steps": ["Document training-data sources and residency", "Set a policy for AI compute region selection"]}]}, {"value": "highrisk", "label": "Yes \u2014 high-risk AI (e.g. credit scoring, life/health insurance pricing, employment/HR AI, biometric identification)", "sev": "high", "findings": [{"reg": "aiact", "a": "Art. 10, 12; Annex III items 1, 4, 5(b), 5(c)", "severity": "high", "title": "High-risk AI data-governance obligations", "detail": "Annex III of the AI Act enumerates high-risk categories including biometric identification (item 1), employment/workforce management (item 4), creditworthiness (item 5(b)), and life/health insurance risk-and-pricing (item 5(c)). High-risk AI must meet Art. 10 data-governance requirements \u2014 relevant, representative, error-checked datasets with documented provenance \u2014 plus record-keeping and human oversight.", "phase": 1, "remedy": "Implement AI Act data-governance controls and confirm training residency.", "steps": ["Classify AI systems against Annex III high-risk categories", "Implement data-governance and provenance controls (Art. 10)", "Confirm training/validation environments reside in approved regions", "Establish record-keeping and human-oversight measures"]}]}]}, {"id": "G2", "section": "ai", "type": "single", "text": "Where does AI model training and inference compute physically run?", "help": "Training compute frequently defaults to US regions (e.g. managed ML platforms), moving sensitive training data across borders.", "refs": [{"reg": "gdpr", "a": "Art. 44"}, {"reg": "dora", "a": "Art. 5"}], "appliesTo": {"regulations": ["aiact", "gdpr", "dora"]}, "options": [{"value": "eu", "label": "EU regions only", "sev": "positive", "findings": []}, {"value": "mixed", "label": "Mixed \u2014 some non-EU compute", "sev": "high", "findings": [{"reg": "gdpr", "a": "Art. 44", "severity": "high", "title": "AI compute partly outside the EU", "detail": "Non-EU training or inference moves sensitive training data across borders \u2014 a transfer that often escapes the RoPA entirely.", "phase": 2, "remedy": "Region-lock AI compute for sensitive workloads to the EU.", "steps": ["Audit ML platform default regions", "Region-lock training and inference for sensitive data", "Update the RoPA to capture AI data flows"]}]}, {"value": "us-dpf", "label": "Primarily US / non-EU compute, with DPF-certified provider", "sev": "medium", "findings": [{"reg": "gdpr", "a": "Art. 45", "severity": "medium", "title": "AI compute at DPF-certified US provider", "detail": "Running training/inference on sensitive data at a DPF-certified US recipient benefits from adequacy; residual Schrems-III risk plus DORA and AI Act residency and record-keeping obligations still apply.", "phase": 2, "remedy": "Verify DPF certification and add AI-specific contractual controls; consider sovereign alternatives for the most sensitive workloads.", "steps": ["Verify the AI compute provider on commerce.gov Data Privacy Framework Program list", "Add AI-specific data-protection and data-provenance terms", "Consider EU sovereign AI compute for the most sensitive workloads"]}]}, {"value": "us", "label": "Primarily US / non-EU compute (no DPF)", "sev": "critical", "findings": [{"reg": "gdpr", "a": "Art. 44", "severity": "critical", "title": "AI compute located outside the EU", "detail": "Running training/inference on sensitive data in non-EU regions without a valid Chapter V mechanism is a restricted transfer at scale, frequently undocumented, and may breach DORA and the AI Act simultaneously.", "phase": 1, "remedy": "Repatriate sensitive AI compute to the EU or an approved sovereign platform, or move to a DPF-certified provider.", "steps": ["Identify all non-EU AI compute touching sensitive data", "Migrate to EU / sovereign ML platforms", "Implement provenance tracking for training data"]}]}, {"value": "unknown", "label": "Unknown", "sev": "high", "findings": [{"reg": "gdpr", "a": "Art. 30", "severity": "high", "title": "AI compute location unknown", "detail": "Unknown AI compute location is a common blind spot where the largest undocumented transfers occur.", "phase": 1, "remedy": "Determine where AI workloads actually execute.", "steps": ["Trace AI platform region configuration", "Document AI data flows in the RoPA"]}]}]}, {"id": "G3", "section": "ai", "type": "single", "text": "Do you use, embed or provide any general-purpose AI (GPAI) model in production (e.g. LLMs, foundation models)?", "help": "GPAI obligations under EU AI Act Chapter V (Arts. 51\u201356) attach differently depending on your role \u2014 provider, downstream user, or integrator.", "refs": [{"reg": "aiact", "a": "Chapter V, Arts. 51\u201356"}], "appliesTo": {"regulations": ["aiact"]}, "options": [{"value": "none", "label": "No \u2014 we do not use GPAI", "sev": "positive", "findings": []}, {"value": "downstream", "label": "Yes \u2014 we deploy third-party GPAI (downstream user)", "sev": "low", "findings": [{"reg": "aiact", "a": "Art. 51\u201356", "severity": "low", "title": "GPAI downstream-user obligations", "detail": "Downstream users of GPAI benefit from the transparency documentation provided by the GPAI provider, must respect copyright policy, and must ensure their use case does not silently turn a general model into an Annex III high-risk system without corresponding controls.", "phase": 2, "remedy": "Integrate GPAI provider transparency documentation into your AI governance.", "steps": ["Obtain and archive GPAI provider transparency documentation", "Ensure your use case does not create an unclassified high-risk system", "Track EU AI Office guidance updates"]}]}, {"value": "provider", "label": "Yes \u2014 we develop / provide our own GPAI models placed on the EU market", "sev": "high", "findings": [{"reg": "aiact", "a": "Art. 51\u201356", "severity": "high", "title": "GPAI provider obligations apply", "detail": "Providers of GPAI models placed on the EU market are subject to Chapter V: technical documentation, transparency to downstream deployers, EU copyright compliance policy, publication of a training-data summary, cooperation with the AI Office. Systemic-risk GPAI (compute threshold under Art. 51(2)) owes additional model-evaluation, adversarial-testing and incident-reporting duties. GPAI provisions apply from 2 August 2025.", "phase": 1, "remedy": "Stand up a GPAI compliance programme covering documentation, transparency, copyright and cooperation.", "steps": ["Produce technical documentation per AI Office template", "Publish training-data summary", "Adopt an EU copyright compliance policy", "If systemic-risk: model evaluation, adversarial testing, cybersecurity, incident reporting"]}]}, {"value": "integrator", "label": "Yes \u2014 we embed third-party GPAI into products or services we sell", "sev": "medium", "findings": [{"reg": "aiact", "a": "Art. 25", "severity": "medium", "title": "Integrator may become provider under Art. 25", "detail": "Firms placing an AI system on the market under their own name may be treated as providers of the resulting system (Art. 25 \u2014 provider substitution). Assess whether provider-level obligations attach to the integrated system in addition to base-model provider obligations.", "phase": 2, "remedy": "Assess Art. 25 provider-substitution risk for each integrated GPAI product.", "steps": ["Map each product embedding third-party GPAI", "Determine if you place the system under your own name", "Adopt provider-level obligations where applicable"]}]}]}, {"id": "G4", "section": "ai", "type": "single", "text": "For UK-established firms using AI/ML: how aligned is your AI governance with UK principles-based expectations (ICO / FCA / PRA)?", "help": "The UK follows a principles-based, regulator-led AI approach. ICO guidance on AI and data protection, FCA supervisory expectations for AI in regulated activities, and PRA/BoE SS1/23 on model risk management for AI/ML apply.", "refs": [{"reg": "ukai", "a": "ICO AI guidance; FCA AI update; PRA/BoE SS1/23"}], "appliesTo": {"regulations": ["ukai"]}, "options": [{"value": "aligned", "label": "Yes \u2014 governance evidenced against ICO / FCA / PRA principles", "sev": "positive", "findings": []}, {"value": "partial", "label": "Partial \u2014 awareness of ICO / FCA / PRA expectations, evidence incomplete", "sev": "medium", "findings": [{"reg": "ukai", "a": "ICO / FCA / PRA principles", "severity": "medium", "title": "UK AI governance evidence incomplete", "detail": "Principles-based expectations still require evidence \u2014 DPIAs for AI processing (ICO), consumer-duty and senior-manager accountability (FCA), and model risk governance (PRA/BoE SS1/23). Partial alignment is a common finding; document controls end-to-end.", "phase": 2, "remedy": "Close the evidence gaps against each supervisor guideline.", "steps": ["Complete DPIAs for AI processing personal data (ICO)", "Document FCA-relevant AI governance for regulated activities", "Adopt SS1/23 model risk management framework for material AI/ML"]}]}, {"value": "none", "label": "No \u2014 UK AI governance not established", "sev": "high", "findings": [{"reg": "ukai", "a": "ICO / FCA / PRA principles", "severity": "high", "title": "UK AI governance not established", "detail": "Absence of AI governance in a UK-regulated firm exposes the firm to ICO enforcement on data-protection aspects and to FCA/PRA supervisory action for regulated activities. PRA/BoE SS1/23 is now the reference framework for banks and insurers on AI/ML model risk.", "phase": 1, "remedy": "Stand up an AI governance framework aligned to the three UK supervisory streams.", "steps": ["Establish an AI governance forum with named executive owner", "Complete DPIAs for AI processing (ICO)", "Adopt SS1/23 model risk management principles", "Align to FCA senior-manager accountability and consumer duty"]}]}, {"value": "na", "label": "Not applicable (no UK establishment or no AI use)", "sev": "positive", "findings": []}]}, {"id": "H1", "section": "cloud", "type": "single", "text": "What is the jurisdiction of the entity that ultimately controls your primary cloud platform?", "help": "Operator jurisdiction \u2014 not just data-centre location \u2014 determines exposure to extraterritorial access laws (e.g. US CLOUD Act).", "refs": [{"reg": "eucs", "a": "Sovereignty"}, {"reg": "gdpr", "a": "Art. 44"}], "options": [{"value": "eu", "label": "EU-controlled operator", "sev": "positive", "findings": []}, {"value": "us-eubound", "label": "US-controlled, with EU 'sovereign' boundary offering", "sev": "medium", "findings": [{"reg": "eucs", "a": "Sovereignty", "severity": "medium", "title": "US operator with sovereign boundary", "detail": "Sovereign-boundary offerings from US operators reduce but do not eliminate jurisdictional exposure; the degree of protection depends on operational control and key custody.", "phase": 2, "remedy": "Validate the sovereign offering's operational-control and key-custody claims against your data classification.", "steps": ["Review the sovereign offering's control model", "Confirm EU-personnel operation and EU key custody", "Assess residual CLOUD Act exposure"]}]}, {"value": "us", "label": "US-controlled operator (standard offering)", "sev": "high", "findings": [{"reg": "gdpr", "a": "Art. 44", "severity": "high", "title": "US-controlled cloud for regulated data", "detail": "A US-controlled operator is subject to US extraterritorial access laws regardless of data-centre location, a recognised Schrems II concern.", "phase": 2, "remedy": "For the most sensitive workloads, evaluate sovereign or EU-controlled alternatives.", "steps": ["Classify workloads by sensitivity", "Evaluate sovereign options for the highest tier", "Apply supplementary measures (EU-held keys) in the interim"]}]}, {"value": "other", "label": "Other non-EU jurisdiction", "sev": "high", "findings": [{"reg": "gdpr", "a": "Art. 44", "severity": "high", "title": "Non-EU operator jurisdiction", "detail": "Any non-EU operator jurisdiction should be assessed for extraterritorial access risk and adequacy.", "phase": 2, "remedy": "Assess the jurisdiction's access laws and adequacy status.", "steps": ["Assess the operator jurisdiction's surveillance regime", "Confirm a valid transfer mechanism"]}]}]}, {"id": "H2", "section": "cloud", "type": "single", "text": "For regulated workloads, is the cloud service certified to an assurance level (e.g. EUCS Substantial/High)?", "help": "Assurance certification provides objective evidence of the controls appropriate to the sensitivity of hosted data.", "refs": [{"reg": "eucs", "a": "Assurance levels"}], "appliesTo": {"regulations": ["eucs", "nis2"]}, "options": [{"value": "high", "label": "Yes \u2014 High assurance", "sev": "positive", "findings": []}, {"value": "substantial", "label": "Yes \u2014 Substantial assurance", "sev": "low", "findings": [{"reg": "eucs", "a": "Assurance", "severity": "low", "title": "Substantial assurance in place", "detail": "Substantial assurance suits many workloads; the most sensitive or sovereignty-critical data may warrant High.", "phase": 3, "remedy": "Confirm the assurance level matches your highest data classification.", "steps": ["Map workloads to required assurance levels", "Escalate the most sensitive workloads to High where needed"]}]}, {"value": "basic", "label": "Yes \u2014 Basic assurance", "sev": "medium", "findings": [{"reg": "eucs", "a": "Assurance \u2014 Basic", "severity": "medium", "title": "Basic assurance may under-serve regulated workloads", "detail": "EUCS Basic covers low-sensitivity workloads. Regulated data \u2014 especially personal, financial, or special-category \u2014 typically requires Substantial or High assurance for defensibility.", "phase": 2, "remedy": "Match assurance level to workload sensitivity; escalate regulated workloads above Basic.", "steps": ["Identify workloads currently on Basic-assured platforms", "Reclassify per data sensitivity", "Migrate or contract for Substantial or High assurance where needed"]}]}, {"value": "none", "label": "No formal assurance certification", "sev": "medium", "findings": [{"reg": "eucs", "a": "Assurance", "severity": "medium", "title": "No cloud assurance certification", "detail": "Without a recognised assurance level, the appropriateness of cloud security controls for regulated data cannot be objectively demonstrated.", "phase": 2, "remedy": "Pursue assurance certification for platforms hosting regulated data.", "steps": ["Identify platforms hosting regulated data", "Target an appropriate assurance level", "Include assurance in future procurement criteria"]}]}]}, {"id": "H3", "section": "cloud", "type": "multi", "text": "For any 'sovereign-boundary' or EU-controlled cloud offering, which controls are contractually and operationally in place?", "help": "An offering marketed as 'sovereign' but without contractual, operational and cryptographic controls is not sovereign in a legal sense. This question fires the evidence side of Q_H1.", "refs": [{"reg": "eucs", "a": "Sovereignty"}, {"reg": "gdpr", "a": "Art. 32, 44"}], "options": [{"value": "eu-personnel", "label": "EU-only operations personnel (customer support and platform operators are EU nationals)", "sev": "positive", "findings": []}, {"value": "hyok", "label": "Customer-held encryption keys (HYOK / EU-controlled KMS)", "sev": "positive", "findings": []}, {"value": "antidisclosure", "label": "Contractual protection against extraterritorial disclosure requests (e.g. CLOUD Act, FISA \u00a7702)", "sev": "positive", "findings": []}, {"value": "eu-subprocessors", "label": "Sub-processor list restricted to EU-jurisdiction entities", "sev": "positive", "findings": []}, {"value": "local-entity", "label": "Local operating entity with EU jurisdiction of dispute resolution", "sev": "positive", "findings": []}, {"value": "none", "label": "None of the above / not documented", "sev": "high", "findings": [{"reg": "eucs", "a": "Sovereignty", "severity": "high", "title": "Sovereign offering claimed without documented controls", "detail": "An offering marketed as 'sovereign' but without documented EU-personnel operations, customer-held keys, anti-disclosure clauses or sub-processor limits is not sovereign in a legal sense \u2014 CLOUD Act and other extraterritorial exposures remain.", "phase": 1, "remedy": "Document each sovereignty control contractually or select a genuinely sovereign platform.", "steps": ["Request contractual evidence for each sovereignty claim", "Verify EU-personnel operations model", "Confirm key custody arrangements", "Restrict sub-processor list to EU jurisdictions"]}]}]}, {"id": "I1", "section": "governance", "type": "single", "text": "Do your cloud/ICT contracts grant audit and inspection rights over data handling?", "help": "Audit rights are explicitly required under DORA (Art. 30) and expected under NIS2 supply-chain security and GDPR Art. 28.", "refs": [{"reg": "dora", "a": "Art. 30"}, {"reg": "gdpr", "a": "Art. 28"}], "options": [{"value": "full", "label": "Yes \u2014 full audit and inspection rights", "sev": "positive", "findings": []}, {"value": "limited", "label": "Limited (e.g. reports only, no on-site)", "sev": "medium", "findings": [{"reg": "dora", "a": "Art. 30", "severity": "medium", "title": "Limited audit rights", "detail": "Report-only rights may not satisfy DORA's requirement for effective audit and access, including for critical/important functions.", "phase": 2, "remedy": "Negotiate fuller audit and access rights for critical arrangements.", "steps": ["Identify contracts supporting critical/important functions", "Negotiate on-site/access and audit rights", "Document supervisory access provisions"]}]}, {"value": "none", "label": "No audit rights / unsure", "sev": "high", "findings": [{"reg": "dora", "a": "Art. 30", "severity": "high", "title": "No contractual audit rights", "detail": "Absence of audit rights breaches DORA contractual requirements and prevents verification of data-location and security claims.", "phase": 1, "remedy": "Insert mandatory DORA audit and access clauses.", "steps": ["Add DORA-mandated clauses to ICT contracts", "Prioritise critical-function providers", "Confirm regulator access rights"]}]}]}, {"id": "I2", "section": "governance", "type": "single", "text": "Who owns data-residency decisions in your organisation?", "help": "NIS2 places accountability on management bodies; unclear ownership is a common root cause of residency drift.", "refs": [{"reg": "nis2", "a": "Art. 20"}], "options": [{"value": "exec", "label": "Clear executive owner with a governance forum", "sev": "positive", "findings": []}, {"value": "diffuse", "label": "Shared across teams, no single owner", "sev": "medium", "findings": [{"reg": "nis2", "a": "Art. 20", "severity": "medium", "title": "Diffuse residency ownership", "detail": "Without a single accountable owner, residency decisions are made inconsistently at team level and drift over time.", "phase": 2, "remedy": "Assign an accountable executive and a governance forum.", "steps": ["Assign an accountable executive for data residency", "Establish a cross-functional governance forum", "Define decision rights and escalation"]}]}, {"value": "none", "label": "No clear owner", "sev": "high", "findings": [{"reg": "nis2", "a": "Art. 20", "severity": "high", "title": "No accountable owner for residency", "detail": "NIS2 requires management-body accountability for cyber risk; unowned residency risk cannot be governed and exposes management personally.", "phase": 1, "remedy": "Establish accountable ownership at management-body level.", "steps": ["Nominate a management-body owner", "Brief the board on NIS2 accountability", "Stand up governance and reporting"]}]}]}, {"id": "I3", "section": "governance", "type": "single", "text": "For UK-regulated financial firms: do you rely on providers that may be designated Critical Third Parties (CTPs) under FSMA 2023?", "help": "HM Treasury (on recommendation of FCA / PRA / BoE) designates CTPs. Designated CTPs are subject to six Fundamental Rules and joint FCA / PRA / BoE oversight. The rules bind the provider, but your own resilience accountability is undiminished.", "refs": [{"reg": "ukctp", "a": "FSMA 2023 Part 9; FCA PS24/16; PRA PS16/24"}], "appliesTo": {"regulations": ["ukctp"]}, "options": [{"value": "yes", "label": "Yes \u2014 we rely on likely / designated CTPs and understand our own residual duties", "sev": "low", "findings": [{"reg": "ukctp", "a": "FSMA 2023 Part 9", "severity": "low", "title": "CTP dependency identified and managed", "detail": "CTP designations bind the provider under FCA / PRA / BoE oversight, but your own outsourcing, resilience and exit-planning duties are undiminished. Maintain governance directly.", "phase": 2, "remedy": "Maintain outsourcing governance and exit-plan readiness for CTP arrangements.", "steps": ["Identify all critical arrangements with likely CTPs", "Confirm outsourcing controls remain in place", "Update exit plans and concentration-risk analysis"]}]}, {"value": "unsure", "label": "Unsure \u2014 CTP status of key providers not established", "sev": "medium", "findings": [{"reg": "ukctp", "a": "FSMA 2023", "severity": "medium", "title": "CTP dependency status unclear", "detail": "Not knowing which of your providers is (or may be) a designated CTP prevents effective concentration-risk and exit-plan design.", "phase": 2, "remedy": "Establish which providers are likely CTPs and plan accordingly.", "steps": ["List providers supporting important business services", "Assess likelihood of CTP designation via HM Treasury", "Refresh concentration-risk analysis"]}]}, {"value": "no", "label": "No \u2014 no material CTP dependencies", "sev": "positive", "findings": []}, {"value": "na", "label": "Not applicable (non-UK / non-FS)", "sev": "positive", "findings": []}]}, {"id": "J1", "section": "incident", "type": "single", "text": "Can you detect and report a personal-data breach within 72 hours (GDPR) and a major incident within NIS2/DORA windows?", "help": "GDPR requires notification within 72 hours; NIS2 requires an early warning within 24 hours and a full report within 72; DORA (via Commission Delegated Regulation (EU) 2025/301) requires initial notification within 4 hours of classifying an incident as major, an intermediate report within 72 hours, and a final report within 1 month.", "refs": [{"reg": "gdpr", "a": "Art. 33"}, {"reg": "nis2", "a": "Art. 23"}, {"reg": "dora", "a": "Art. 19; Comm. Del. Reg. (EU) 2025/301 (initial 4h / intermediate 72h / final 1 month)"}], "options": [{"value": "yes", "label": "Yes \u2014 tested detection and reporting process", "sev": "positive", "findings": []}, {"value": "partial", "label": "Process exists but untested / unclear on cross-border", "sev": "medium", "findings": [{"reg": "nis2", "a": "Art. 23", "severity": "medium", "title": "Incident reporting readiness unproven", "detail": "Overlapping GDPR/NIS2/DORA windows are hard to meet without a tested process, especially where data spans multiple jurisdictions and authorities.", "phase": 2, "remedy": "Test the incident-reporting process against all applicable regimes.", "steps": ["Map notification duties across GDPR/NIS2/DORA", "Run a cross-border breach tabletop", "Pre-identify each competent authority and template"]}]}, {"value": "no", "label": "No reliable process", "sev": "high", "findings": [{"reg": "nis2", "a": "Art. 23", "severity": "high", "title": "Incident reporting not assured", "detail": "Missing statutory reporting windows compounds an incident with regulatory penalties across multiple regimes.", "phase": 1, "remedy": "Establish a multi-regime incident detection and reporting capability.", "steps": ["Stand up incident detection and triage", "Build a multi-regime notification playbook", "Establish 24/72-hour reporting readiness"]}]}]}, {"id": "K1", "section": "outcomes", "type": "single", "text": "What is your compliance tolerance for this assessment?", "help": "Shapes how aggressively the roadmap sequences remediation.", "refs": [], "scoreOnly": true, "options": [{"value": "zero", "label": "Zero tolerance \u2014 strict compliance required", "sev": "low", "findings": []}, {"value": "minimal", "label": "Minimal \u2014 acceptable with a short-term plan", "sev": "low", "findings": []}, {"value": "moderate", "label": "Moderate \u2014 acceptable if residual risk is low", "sev": "low", "findings": []}, {"value": "flexible", "label": "Flexible \u2014 cost/performance prioritised", "sev": "low", "findings": []}]}, {"id": "K2", "section": "outcomes", "type": "single", "text": "What is your investment appetite for remediation across Phases 1\u20133?", "help": "Used to frame the roadmap's ambition and sequencing.", "refs": [], "scoreOnly": true, "options": [{"value": "high", "label": "High \u2014 significant, near-term investment available", "sev": "low", "findings": []}, {"value": "medium", "label": "Medium \u2014 phased over 6\u201312 months", "sev": "low", "findings": []}, {"value": "low", "label": "Low \u2014 quick wins only for now", "sev": "low", "findings": []}, {"value": "tbd", "label": "Under review", "sev": "low", "findings": []}]}, {"id": "K3", "section": "outcomes", "type": "multi", "text": "Which outcomes matter most for the target architecture?", "help": "Frames the strategic narrative in the report's roadmap.", "refs": [], "scoreOnly": true, "options": [{"value": "compliance", "label": "Demonstrable regulatory compliance", "sev": "low", "findings": []}, {"value": "sovereignty", "label": "Data sovereignty as a market differentiator", "sev": "low", "findings": []}, {"value": "resilience", "label": "Operational resilience / DR assurance", "sev": "low", "findings": []}, {"value": "cost", "label": "Cost control during remediation", "sev": "low", "findings": []}, {"value": "performance", "label": "No degradation of application performance", "sev": "low", "findings": []}, {"value": "speed", "label": "Speed to a defensible position", "sev": "low", "findings": []}]}]},

ver or data migration tested", "Disaster recovery tested annually within the same hyperscaler, but alternative provider migration untested", "Active multi-cloud / container portability project budgeted to reduce single-vendor dependency"], "probePrompt": "Consultant notes on Register of Information status, CTPP alternative provider feasibility, or legacy lock-in..."}, {"id": "P_DR_LEAK", "badge": "Leak: Cross-Border Backup Replication", "badgeClass": "amber", "q": "While primary production data is localized domestically, secondary disaster recovery, snapshot archives, or database replication traverse national borders. In jurisdictions with strict localization (KSA, India, UAE, Russia), this secondary flow represents a statutory breach. Is replication encrypted with independent domestic keys?", "options": ["Replication uses cloud-native encrypted pipes, but secondary region sits in a foreign jurisdiction without domestic KMS", "Legal counsel cleared regional replication under existing international data transfer mechanisms", "Currently re-architecting backup policies to force local secondary availability zones", "Disaster recovery data is fully pseudonymized / tokenized prior to cross-border replication"], "probePrompt": "Consultant notes on backup data flows, secondary storage locations, or cross-border network topologies..."}, {"id": "P_AI_RECLASS", "badge": "Reclassification: EU AI Act & GPAI Risk", "badgeClass": "blue", "q": "Under EU AI Act Art. 25, an enterprise integrating a third-party General Purpose AI model (e.g. OpenAI, Anthropic) into a high-risk workflow can be legally reclassified as an AI Provider \u2014 bearing full conformity and technical documentation obligations. Have you secured the vendor technical provenance files and training data summaries?", "options": ["No provenance files secured; deploying third-party commercial APIs under standard enterprise terms", "Conducting fundamental rights and data governance impact assessments prior to productio r to US, APAC, or global backup pools without contractual isolation", "tag": "Cross-Border DR", "score": 10, "fact": {"dr_cross_border": true}}]}, {"id": "Q4.1", "sec": "Jurisdictional Exposure", "secNum": "04", "mode": "both", "type": "single", "q": "What is the corporate parent headquarters jurisdiction of your primary hyperscalers and SaaS providers?", "hint": "Under the US CLOUD Act, a US-headquartered parent must comply with US warrants regardless of where data sits.", "opts": [{"text": "Primarily US-headquartered providers (AWS, Microsoft, Google Cloud, Salesforce, Oracle, Snowflake)", "tag": "US Hyperscalers", "score": 30, "fact": {"uses_us_hq": true}}, {"text": "Mix of US hyperscalers with certified local sovereign partners (e.g. T-Systems, Thales, stc, e&)", "tag": "Sovereign Enclave", "score": 75, "fact": {"uses_sovereign_partner": true}}, {"text": "Strictly domestic / national sovereign cloud providers (OVHcloud, Hetzner, domestic telecom clouds)", "tag": "National Sovereign", "score": 95, "fact": {"uses_national_cloud": true}}]}, {"id": "Q4.2", "sec": "Jurisdictional Exposure", "secNum": "04", "mode": "workshop", "type": "single", "q": "What contractual vehicle governs your relationship with cloud and technology providers?", "hint": "Contracting directly with a US parent entity waives corporate veil protections vs contracting with an EU/local entity.", "opts": [{"text": "Direct contract with local/in-country operating subsidiary governed exclusively by local law", "tag": "Local Entity", "score": 85, "fact": {"contract_local": true}}, {"text": "Standard global terms governed by Delaware, California, or non-domestic foreign courts", "tag": "Foreign Law", "score": 20, "fact": {"contract_foreign": true}}, {"text": "Contract terms unexamined / default click-through enterprise agreement", "tag": "Unreviewed", "score": 10, "fact": {"contract_unreviewed": true}}]}, {"id": "Q4.3", "sec": "Jurisdictional Exposure", "secNum": "04", "mode": "both", "type": "single", "q": "Have you conducted Transfer Impact Assessments (TIAs) covering foreign lawful access (CLOUD Act, FISA 702)?", "hint": "Required by EDPB Schrems II guidance, UK ICO, and KSA PDPL before cross-border routing.", "opts": [{"text": "Yes \u2014 Formal TIAs executed and regularly reviewed with documented supplementary technical measures", "tag": "Formal TIAs", "score": 100, "fact": {"tia_complete": true}}, {"text": "Partially \u2014 Standard Contractual Clauses (SCCs) signed, but formal surveillance analysis incomplete", "tag": "Partial TIAs", "score": 45, "fact": {"tia_partial": true}}, {"text": "No \u2014 Relying solely on provider marketing claims and standard Data Processing Addenda (DPAs)", "tag": "No TIAs", "score": 10, "fact": {"tia_none": true}}]}, {"id": "Q5.1", "sec": "Operational Sovereignty", "secNum": "05", "mode": "both", "type": "single", "q": "How is administrative support and root-level infrastructure maintenance handled by your technology providers?", "hint": "Follow-the-Sun models allow engineers in India, the US, or Eastern Europe to hold elevated access to live estates.", "opts": [{"text": "Strictly bounded: 24/7 support operated exclusively by cleared domestic/EU nationals in-country", "tag": "Sovereign Support", "score": 95, "fact": {"ops_sovereign_support": true}}, {"text": "Customer Approval Required: Provider support requires Just-In-Time (JIT) customer approval and access broker logging", "tag": "Customer Broker", "score": 70, "fact": {"ops_jit_approval": true}}, {"text": "Standard Follow-the-Sun: Global support engineers access environments based on timezone rotations", "tag": "Follow-the-Sun", "score": 25, "fact": {"ops_follow_the_sun": true}}]}, {"id": "Q5.2", "sec": "Operational Sovereignty", "secNum": "05", "mode": "workshop", "type": "single", "q": "For on-premises hardware, storage, and firewalls, are remote out-of-band management channels (iDRAC/iLO) active?", "hint": "Hardware vendor call-home telemetry and remote support tunnels represent unmapped extraterritorial vectors.", "opts": [{"text": "Air-gapped / Strictly internal OOB networks with all vendor phone-home telemetry blocked", "tag": "Air-Gapped OOB", "score": 95, "fact": {"oob_airgap": true}}, {"text": "Connected OOB networks with automated vendor telemetry and remote diagnostics enabled", "tag": "Connected OOB", "score": 35, "fact": {"oob_connected": true}}, {"text": "No on-premises infrastructure / Pure Cloud", "tag": "N/A Cloud", "score": 70, "fact": {"oob_na": true}}]}, {"id": "Q5.3", "sec": "Operational Sovereignty", "secNum": "05", "mode": "both", "type": "single", "q": "In SaaS applications (M365, Salesforce, ServiceNow), does the SaaS provider hold administrative access to tenant data?", "hint": "Most enterprise SaaS platforms operate multi-tenant databases where vendor SREs possess broad diagnostic privileges.", "opts": [{"text": "Customer Lockbox enforced: Vendor engineers cannot access tenant data without explicit time-limited approval", "tag": "Lockbox Enforced", "score": 85, "fact": {"saas_lockbox": true}}, {"text": "Standard SaaS operations: Provider manages uptime and internal access under standard security attestations (SOC2)", "tag": "Standard SaaS", "score": 40, "fact": {"saas_standard": true}}, {"text": "Uncontrolled / Multi-tenant SaaS with unmonitored vendor telemetry feeds", "tag": "Unmonitored", "score": 15, "fact": {"saas_unmonitored": true}}]}, {"id": "Q6.1", "sec": "Cryptographic Autonomy", "secNum": "06", "mode": "both", "type": "single", "q": "How are encryption keys managed for data at rest across your public cloud and SaaS environments?", "hint": "If the cloud provider holds or has access to your encryption keys, encryption does NOT defeat foreign subpoenas.", "opts": [{"text": "Hold Your Own Key (HYOK) / External HSM: Keys generated, stored, and managed in on-prem or sovereign HSMs", "tag": "HYOK / External HSM", "score": 100, "fact": {"crypto_hyok": true}}, {"text": "Bring Your Own Key (BYOK): Customer imports keys into cloud-managed KMS (provider can access during operations)", "tag": "BYOK (Cloud KMS)", "score": 55, "fact": {"crypto_byok": true}}, {"text": "Cloud Provider-Managed Keys: Default server-side encryption with provider-owned keys (AWS SSE-S3, Azure PMK)", "tag": "Provider KMS", "score": 15, "fact": {"crypto_provider_kms": true}}]}, {"id": "Q6.2", "sec": "Cryptographic Autonomy", "secNum": "06", "mode": "workshop", "type": "single", "q": "Have you implemented Confidential Computing (hardware-rooted enclaves e.g. AMD SEV-SNP, Intel SGX) for data in use?", "hint": "Confidential Computing protects data in memory from hypervisor inspection and rogue administrative access.", "opts": [{"text": "Yes \u2014 Deployed in production for high-risk data processing and AI inference", "tag": "Production Enclaves", "score": 100, "fact": {"conf_compute_prod": true}}, {"text": "Evaluating / PoC \u2014 Testing confidential VMs for regulated financial or healthcare workloads", "tag": "Evaluating PoC", "score": 50, "fact": {"conf_compute_poc": true}}, {"text": "No \u2014 Standard virtualization and container runtimes only", "tag": "No Confidential VM", "score": 15, "fact": {"conf_compute_none": true}}]}, {"id": "Q6.3", "sec": "Cryptographic Autonomy", "secNum": "06", "mode": "both", "type": "single", "q": "Can your organization instantly revoke encryption keys to render foreign-hosted data permanently unreadable?", "hint": "The definitive technical test of cryptographic sovereignty: remote cryptographic kill-switch.", "opts": [{"text": "Yes \u2014 Cryptographic kill-switch verified: revoking key access instantly blinds all cloud/SaaS data stores", "tag": "Kill-Switch Verified", "score": 100, "fact": {"crypto_killswitch": true}}, {"text": "Partial \u2014 Can disable keys in cloud console, but cached keys or provider backups may persist", "tag": "Partial Revocation", "score": 45, "fact": {"crypto_partial_revoke": true}}, {"text": "No \u2014 Provider manages the lifecycle; instantaneous unilateral revocation is impossible", "tag": "No Revocation", "score": 10, "fact": {"crypto_no_revoke": true}}]}, {"id": "Q7.1", "sec": "Third-Party & Exitability", "secNum": "07", "mode": "both", "type": "single", "q": "Do you have single-vendor concentration where a disruption to one cloud or SaaS provider halts core business operations?", "hint": "A primary focus of DORA Art. 28, UK CTP, APRA CPS 230, and MAS Outsourcing guidelines.", "opts": [{"text": "Severe Concentration: Single hyperscaler / SaaS platform hosts >75% of all critical business functions", "tag": "Critical Concentration", "score": 20, "fact": {"conc_critical": true}}, {"text": "Managed Concentration: Dominant primary provider, but critical workloads have documented fallback options", "tag": "Managed Concentration", "score": 60, "fact": {"conc_managed": true}}, {"text": "Architectural Multi-Cloud / Hybrid: Workloads portable across distinct providers and on-premises enclaves", "tag": "Multi-Cloud Portable", "score": 90, "fact": {"conc_portable": true}}]}, {"id": "Q7.2", "sec": "Third-Party & Exitability", "secNum": "07", "mode": "workshop", "type": "single", "q": "What is your realistic, tested timeline to execute a complete exit strategy from your primary cloud provider?", "hint": "Regulatory requirements mandate an actionable, auditable, and tested exit strategy without disruption.", "opts": [{"text": "Under 3 Months: Workloads are containerized (Kubernetes/OpenShift) and data formats are open standard", "tag": "<3 Months", "score": 95, "fact": {"exit_under_3m": true}}, {"text": "6 to 12 Months: Documented transition plan exists, but significant proprietary PaaS rewrites would be required", "tag": "6-12 Months", "score": 55, "fact": {"exit_6_12m": true}}, {"text": "Over 18 Months / Effectively Impossible: Deep proprietary serverless and database lock-in prevents migration", "tag": ">18 Months", "score": 15, "fact": {"exit_impossible": true}}]}, {"id": "Q7.3", "sec": "Third-Party & Exitability", "secNum": "07", "mode": "both", "type": "single", "q": "For on-premises hardware, appliances, and telecom equipment, have you audited hardware provenance (e.g. NDAA Section 889)?", "hint": "National security rules in the US, UK, Australia, and EU ban certain foreign-manufactured telecom and compute components.", "opts": [{"text": "Fully Audited: Hardware bill of materials (SBOM/HBOM) verified compliant with clean supply chain lists", "tag": "Hardware Verified", "score": 95, "fact": {"hw_audited": true}}, {"text": "Partially Audited: Major server vendors certified, but network switches, cameras, and IoT unverified", "tag": "Partially Audited", "score": 50, "fact": {"hw_partial": true}}, {"text": "Not Audited: Hardware procurement driven purely by commercial cost with no origin restrictions", "tag": "Not Audited", "score": 20, "fact": {"hw_not_audited": true}}]}]},

utomated cross-cloud failover"]],"maturity":true},{"id":"Q6.1","sec":"Platform Engineering","dim":"D5","q":"Infrastructure as Code (IaC) & automation maturity?","type":"single","mode":"both","opts":[["Manual click-ops in web consoles"],["Ad-hoc Bash / PowerShell scripts"],["IaC standardized (Terraform / Bicep / OpenTofu)"],["GitOps CI/CD with automated drift detection"],["Policy-as-code (OPA/Sentinel) with self-healing infrastructure"]],"maturity":true},{"id":"Q6.2","sec":"Platform Engineering","dim":"D5","q":"Do engineering teams have self-service 'Golden Paths'?","hint":"Paved-road templates with networking, IAM, CI/CD and security baked in.","type":"single","mode":"both","opts":[["No — every team builds bespoke infra"],["A few template repos; mostly manual setup"],["Documented golden paths used by ~50% of teams"],["Automated Internal Developer Platform (IDP) used by default"],["Full platform-as-a-product with developer NPS tracking"]],"maturity":true},{"id":"Q6.3","sec":"Platform Engineering","dim":"D5","q":"Typical lead time to provision a production-grade environment?","type":"single","mode":"workshop","opts":[["> 4 weeks (ticket-driven bureaucracy)"],["1–4 weeks (semi-automated)"],["2–5 business days"],["1–4 hours (self-service catalog)"],["< 15 minutes (fully automated GitOps)"]],"maturity":true},{"id":"Q7.1","sec":"Data Centre & Estate","dim":"D6","q":"What is your data centre exit or consolidation posture?","type":"single","mode":"both","opts":[["Committed to owned DCs long-term"],["No strategic plan despite rising costs"],["Actively evaluating colocation / DC exit options"],["Formal DC exit programme committed with target dates"],["DC exit underway or fully complete"]],"maturity":true},{"id":"Q7.2","sec":"Data Centre & Estate","dim":"D6","q":"Fidelity of application inventory & dependency mapping?","type":"single","mode":"both","opts":[["No central inventory (tribal knowledge)"],["Outdated manual spreadsheets"],["Standard CMDB updated periodically"],["Automated discovery tools deployed (e.g. Device42, Dynatrace)"],["Real-time continuous dependency graph with API telemetry"]],"maturity":true},{"id":"Q7.3","sec":"Data Centre & Estate","dim":"D6","q":"On-premise storage saturation & ransomware backup immutability?","type":"single","mode":"workshop","opts":[["Storage nearing 90% capacity; legacy backups"],["Adequate SAN capacity; mutable backups"],["Modern SAN with offsite tape/cloud replication"],["Air-gapped immutable backups tested quarterly"],["Continuous zero-trust cyber-resilience with instant snapshot recovery"]],"maturity":true},{"id":"Q8.1","sec":"Governance & Security","dim":"D7","q":"Maturity of cloud landing zones & security guardrails?","type":"single","mode":"both","opts":[["No landing zones — flat network topology"],["Basic perimeter security and reactive scans"],["Well-Architected landing zone baseline deployed"],["Automated preventative guardrails & policy-as-code"],["Continuous real-time posture management (CSPM) with auto-remediation"]],"maturity":true},{"id":"Q8.2","sec":"Governance & Security","dim":"D7","q":"Do you have binding digital sovereignty or data-residency mandates?","type":"tf","mode":"both","sovFlagTF":true,"maturityTF":true},{"id":"Q8.3","sec":"Governance & Security","dim":"D7","q":"Identity, Zero Trust & IAM blast-radius containment?","type":"single","mode":"workshop","opts":[["Overprivileged shared admin credentials"],["Federated AD/Okta but wide internal network trust"],["Role-based access (RBAC) with MFA enforced"],["Least-privilege JIT (Just-In-Time) access & microsegmentation"],["Zero Trust architecture with continuous identity verification"]],"maturity":true},{"id":"Q9.1","sec":"Data & AI Readiness","dim":"D8","q":"How ready is your enterprise data foundation for modern AI?","type":"single","mode":"both","opts":[["Siloed legacy databases / no centralized data lake"],["Data lake in place but untagged and ungoverned"],["Governed lakehouse (Snowflake/Databricks/BigQuery) with catalogs"],["Data contracts, quality SLOs, and lineage monitoring enforced"],["Enterprise feature stores & real-time data mesh in production"]],"maturity":true},{"id":"Q9.2","sec":"Data & AI Readiness","dim":"D8","q":"AI & GenAI ambitions over the next 12 months?","hint":"Select all targeted initiatives.","type":"multi","mode":"both","opts":[["None yet / monitoring only"],["GenAI copilots & developer productivity"],["Customer-facing AI chatbots & assistants"],["Domain-specific fine-tuned LLMs on corporate data"],["Autonomous agentic workflows & core product infusion"]],"aiFlagExcept":"None yet / monitoring only"},{"id":"Q9.3","sec":"Data & AI Readiness","dim":"D8","q":"AI cost governance (TokenOps) and data boundary protection?","type":"single","mode":"workshop","opts":[["No visibility into AI API usage or data leaks"],["Basic acceptable-use policy for public AI"],["Private VPC-hosted models with DLP/PII filtering"],["Token budgets, provider cost routing & observability"],["Full enterprise AI boundary with sovereign compute control"]],"maturity":true}]},
  "strategy-iq": {"meta":{"id":"strategy-iq","name":"Strategy IQ","version":"2.2.0","profile":"strategic_alignment_maturity","delivery":"single-file-html","updated":"2026-10-04","disclaimer":"This diagnostic provides strategic advisory guidance to support enterprise IT strategy, Target Operating Model (TOM), application rationalization, tech debt sizing, and board-level investment governance. It does not constitute a formal legal or financial audit."},"sections":[{"id":"S1","num":"01","title":"Business-IT Alignment & Co-Design","desc":"Coupling between technology investments and enterprise P&L growth strategies."},{"id":"S2","num":"02","title":"Target Operating Model (TOM)","desc":"Product-led squad structures, platform-as-a-product, and decision autonomy."},{"id":"S3","num":"03","title":"Application Portfolio Health & TIME","desc":"TIME rationalization (Tolerate, Invest, Migrate, Eliminate) and lifecycle currency."},{"id":"S4","num":"04","title":"Tech Debt Sizing & Modernization","desc":"Balance sheet tech debt quantification and ring-fenced refactoring capacity."},{"id":"S5","num":"05","title":"Capability Sourcing & Resilience","desc":"Core-vs-context partner intentionality, key-person de-risking, and talent ladders."},{"id":"S6","num":"06","title":"Investment Governance & Value Realization","desc":"Economic value gating, post-launch benefit realization, and unit economics."}],"questions":[{"id":"S1.1","section":"S1","type":"single_select","q":"How intentionally is IT strategy coupled with enterprise business strategy?","hint":"Evaluates whether technology is treated as a back-office cost center or a co-author of market differentiation.","opts":[{"text":"<b>Level 1 · Nascent:</b> Isolated IT roadmap with zero reference to business P&L outcomes","score":1},{"text":"<b>Level 2 · Emerging:</b> Periodic presentation of IT plans with loose references to corporate goals","score":2},{"text":"<b>Level 3 · Established:</b> Documented alignment matrices mapping projects to strategic priorities","score":3},{"text":"<b>Level 4 · Advanced:</b> Shared OKRs and joint accountability between IT and business executives","score":4},{"text":"<b>Level 5 · Leading:</b> Continuous co-design where technology directly originates new revenue models","score":5}]},{"id":"S1.2","section":"S1","type":"slider","q":"What is the strategic review cadence for technology roadmaps?","hint":"Frequency of recalibration against market shifts, competitor moves, and macro dynamics.","sliderConfig":{"min":1,"max":5,"step":1,"defaultVal":3,"ticks":["Static (Years)","Annual Review","Twice-Yearly","Quarterly OKRs","Continuous Waves"],"descs":["Level 1 · Nascent: Multi-year static plan rarely revisited until crises occur","Level 2 · Emerging: Annual defensive review aligned strictly to budget calendar","Level 3 · Established: Twice-yearly structured executive architectural health reviews","Level 4 · Advanced: Quarterly rolling horizon reviews with adaptive reallocation","Level 5 · Leading: Continuous rolling waves with real-time portfolio reprioritization"]}},{"id":"S1.3","section":"S1","type":"single_select","q":"How is the digital/technology value proposition perceived by the Board and CEO?","hint":"Strategic posture of IT in boardroom capital allocation decisions.","opts":[{"text":"<b>Level 1 · Utility Cost Center:</b> Subject to arbitrary across-the-board budget reduction targets","score":1},{"text":"<b>Level 2 · Operational Enabler:</b> Funded primarily to keep the lights on and satisfy compliance mandates","score":2},{"text":"<b>Level 3 · Respected Service Partner:</b> Dedicated funding allocated for business process automation","score":3},{"text":"<b>Level 4 · Strategic Growth Driver:</b> Primary driver of customer experience, retention, and speed-to-market","score":4},{"text":"<b>Level 5 · Core Business Multiplier:</b> Foundational board-level value multiplier and competitive differentiator","score":5}]},{"id":"S1.4","section":"S1","type":"multi_select","q":"Which Business Architecture & Strategic Mapping artifacts are active in practice?","hint":"Select all that are maintained, actively used, and reviewed with business stakeholders.","opts":[{"text":"Documented Enterprise Business Capability Model (Level 1–3 capabilities defined)","score":1},{"text":"Value Stream Mapping tying customer journeys to underlying IT systems","score":1},{"text":"Systems-to-Capability Heatmap highlighting technical health and redundancy","score":1},{"text":"Domain Data Architecture models governed by designated business data stewards","score":1},{"text":"Dynamic runtime telemetry linking business KPIs directly to system performance","score":1}]},{"id":"S2.1","section":"S2","type":"single_select","q":"What is the primary structure of your technology delivery operating model?","hint":"Distinction between project-based handoff silos and dedicated cross-functional product squads.","opts":[{"text":"<b>Level 1 · Siloed Waterfall:</b> Rigid project-mode silos with painful cross-departmental handover chains","score":1},{"text":"<b>Level 2 · Component Teams:</b> Component-based delivery teams with fragmented accountability and ticketing queues","score":2},{"text":"<b>Level 3 · Hybrid Matrix:</b> Product squads piloted in digital channels, while core platforms remain in waterfall silos","score":3},{"text":"<b>Level 4 · Product & Platform TOM:</b> Standardized product-and-platform operating model across core business domains","score":4},{"text":"<b>Level 5 · Scaled Product Flow:</b> Scaled team topologies with autonomous squads, golden paths, and flow telemetry","score":5}]},{"id":"S2.2","section":"S2","type":"rating_matrix","q":"Rate maturity across your internal Developer Platform & Platform-as-a-Product capabilities:","hint":"Rate each sub-capability from 1 (Manual/Friction) to 5 (Autonomous/Golden Path):","subItems":[{"id":"p1","name":"Self-Service Infrastructure & Environments (cloud sandbox provisioning)"},{"id":"p2","name":"CI/CD Golden Paths & Automated Deployment Pipelines"},{"id":"p3","name":"Policy-as-Code, Security Scanning & Automated Governance Guardrails"},{"id":"p4","name":"Platform Observability, Error Budgets & Developer Experience SLOs"}]},{"id":"S2.3","section":"S2","type":"drag_rank","q":"Rank your primary operational delivery bottlenecks (Drag or use arrows to sort from Biggest Bottleneck to Lowest):","hint":"Arrange the most significant organizational friction points impacting delivery speed:","rankItems":[{"id":"r1","label":"Manual Ticket-based Infrastructure Provisioning & Environment Delays"},{"id":"r2","label":"Ivory-Tower Architecture Approvals & Bureaucratic Stage Gates"},{"id":"r3","label":"Legacy Monolithic Deploy Freezes & Fear of Production Regression"},{"id":"r4","label":"Uncontrolled Shadow IT & Disjointed Engineering Standards Across Teams"}]},{"id":"S2.4","section":"S2","type":"single_select","q":"How seamlessly do business product owners and engineering squads collaborate?","hint":"Proximity of software engineering to end customer feedback and commercial decision-makers.","opts":[{"text":"<b>Level 1 · Adversarial Handover:</b> Business writes heavy specs and throws them over the wall to IT","score":1},{"text":"<b>Level 2 · Intermediated:</b> Business analysts act as intermediaries with delayed feedback and mismatched intent","score":2},{"text":"<b>Level 3 · Nominal Participation:</b> Product owners present in ceremonies but engineers remain insulated from customers","score":3},{"text":"<b>Level 4 · Co-Located Squads:</b> True cross-functional product squads with shared customer empathy and weekly releases","score":4},{"text":"<b>Level 5 · Autonomous Commercial Squads:</b> Empowered teams with direct authority to experiment, measure, and pivot","score":5}]},{"id":"S3.1","section":"S3","type":"single_select","q":"How structured is your Application Portfolio Management (APM) & TIME scoring?","hint":"Tolerate, Invest, Migrate, Eliminate methodology applied across systems.","opts":[{"text":"<b>Level 1 · Untracked:</b> No central inventory; applications tracked across disparate informal spreadsheets","score":1},{"text":"<b>Level 2 · Static CMDB:</b> CMDB contains system names but lacks business value, cost, or fitness ratings","score":2},{"text":"<b>Level 3 · Periodic Survey:</b> Annual APM survey categorizing applications by high-level lifecycle tags","score":3},{"text":"<b>Level 4 · Active TIME Governance:</b> Rigorous TIME framework actively driving retirement and modernization budgets","score":4},{"text":"<b>Level 5 · Real-Time Observability:</b> Continuous real-time APM telemetry scoring cost, technical risk, and business fitness","score":5}]},{"id":"S3.2","section":"S3","type":"drag_rank","q":"Rank the biggest areas of capability duplication & overlap across your business units:","hint":"Order from Highest Capability Redundancy to Lowest Redundancy:","rankItems":[{"id":"d1","label":"Multiple Disjointed ERPs & Core General Ledger Accounts"},{"id":"d2","label":"Fragmented CRM & Customer Master Data Repositories"},{"id":"d3","label":"Overlapping Collaboration, Ticketing & Document Tooling"},{"id":"d4","label":"Redundant Analytics Warehouses & Unsynchronized Data Lakes"}]},{"id":"S3.3","section":"S3","type":"slider","q":"What percentage of your production applications run on supported/current vendor runtimes?","hint":"Operating systems, databases, runtime frameworks within N-1 supported vendor currency.","sliderConfig":{"min":0,"max":100,"step":5,"defaultVal":65,"ticks":["0% (Severely EOL)","25%","50%","75%","100% (Fully Current)"],"descs":["Critical Exposure: Majority of production workloads running on end-of-life, unpatched runtimes","High Vulnerability: Severe legacy sprawl; multiple unsupported databases and core OS layers","Moderate Currency: Core systems maintained; peripheral applications lag in obsolescence","High Currency: Over 75% of production estate actively complies with N-1 support policies","Automated Currency: Continuous SBOM scanning, automated patch pipelines, zero EOL systems"]}},{"id":"S3.4","section":"S3","type":"single_select","q":"What is the architectural maturity of your enterprise integration backbone?","hint":"Decoupling between systems via APIs/events versus point-to-point batch files.","opts":[{"text":"<b>Level 1 · Point-to-Point Spaghetti:</b> Fragile direct database links, batch CSV exports, and scheduled FTP scripts","score":1},{"text":"<b>Level 2 · Monolithic ESB:</b> Legacy on-prem Enterprise Service Bus creating an operational bottleneck","score":2},{"text":"<b>Level 3 · Hybrid APIs:</b> Central API gateway with REST endpoints exposed for high-priority systems","score":3},{"text":"<b>Level 4 · Governed Event Architecture:</b> Standardized API catalog combined with an enterprise event-driven backbone","score":4},{"text":"<b>Level 5 · Composable Mesh:</b> Enterprise event mesh with published developer contracts, schema registries, and SLOs","score":5}]},{"id":"S4.1","section":"S4","type":"single_select","q":"How quantitatively is technical debt measured and sized across the enterprise?","hint":"Financial and operational quantification of architectural compromises.","opts":[{"text":"<b>Level 1 · Unmeasured:</b> Tech debt is dismissed as engineer complaining; zero visibility into liability","score":1},{"text":"<b>Level 2 · Anecdotal Register:</b> Informally maintained lists of legacy grievances with no financial sizing","score":2},{"text":"<b>Level 3 · Risk-Weighted Backlog:</b> Documented tech-debt backlog with qualitative risk severity ratings","score":3},{"text":"<b>Level 4 · Quantified Balance Sheet:</b> Fully sized debt register with estimated business remediation costs and outage risks","score":4},{"text":"<b>Level 5 · Boardroom Index:</b> Tech Debt Index integrated directly into corporate risk registers and capital governance","score":5}]},{"id":"S4.2","section":"S4","type":"slider","q":"What percentage of annual engineering change budget is ring-fenced for debt paydown?","hint":"Dedicated capacity allocated for refactoring, architectural upgrades, and deprecation.","sliderConfig":{"min":0,"max":40,"step":5,"defaultVal":10,"ticks":["0% (Firefighting)","10%","20% (Recommended)","30%","40%+ (Deep Refactoring)"],"descs":["Level 1 (0%): Zero capacity; 100% of bandwidth hijacked by emergency firefighting and feature demands","Level 2 (5-10%): Stealth refactoring performed by engineers informally during feature delivery","Level 3 (15-20%): Ring-fenced recurring capacity formally agreed between engineering and product leadership","Level 4 (25-30%): Continuous debt retirement built into every squad capacity model with measurable burndown","Level 5 (>35%): Transformational modernization sprint actively retiring monolithic liabilities"]}},{"id":"S4.3","section":"S4","type":"multi_select","q":"Which Modernization & Decoupling Patterns are actively utilized in production?","hint":"Select all patterns currently executed with verified production workloads:","opts":[{"text":"Strangler Fig Pattern systematically hollowing out legacy monolithic systems","score":1},{"text":"Domain Microservices with independent databases and deployment pipelines","score":1},{"text":"Infrastructure-as-Code (Terraform/CloudFormation) with automated immutable staging","score":1},{"text":"Automated Regression Test Suites preventing deployment regressions without manual QA","score":1},{"text":"Anti-Corruption Layers protecting new cloud architectures from legacy database schemas","score":1}]},{"id":"S4.4","section":"S4","type":"single_select","q":"How is cloud modernization structured across your infrastructure estate?","hint":"Evolution from legacy on-premises data centers to cloud-native managed architectures.","opts":[{"text":"<b>Level 1 · Data Center Lock-in:</b> Legacy on-prem colocation with aging hardware and no cloud exit strategy","score":1},{"text":"<b>Level 2 · Unoptimized Lift-and-Shift:</b> Virtual machines migrated to public cloud with inflated run costs","score":2},{"text":"<b>Level 3 · Hybrid Replatforming:</b> Managed cloud services utilized for new initiatives; core estate on IaaS","score":3},{"text":"<b>Level 4 · Cloud-Native Containers:</b> Containerized microservices, serverless components, and automated IaC","score":4},{"text":"<b>Level 5 · Sovereign & Multi-Cloud:</b> Architecturally decoupled workloads optimizing cost, latency, and compliance","score":5}]},{"id":"S5.1","section":"S5","type":"single_select","q":"How deliberate is your strategic sourcing model (In-House vs. SIs vs. SaaS)?","hint":"Clear segregation between strategic differentiating core and commoditized context capabilities.","opts":[{"text":"<b>Level 1 · Accidental Sourcing:</b> Reactive reliance on short-term contractor body-shopping without IP retention","score":1},{"text":"<b>Level 2 · Vendor Lock-in:</b> Heavy dependence on a single systems integrator with no knowledge transfer","score":2},{"text":"<b>Level 3 · Documented Guidelines:</b> Clear sourcing policy defining build vs. buy criteria for new projects","score":3},{"text":"<b>Level 4 · Core-vs-Context Segregation:</b> Differentiating IP built in-house; context capabilities sourced via SaaS/partners","score":4},{"text":"<b>Level 5 · Dynamic Partner Ecosystem:</b> Multi-vendor leverage with transparent benchmarking and continuous knowledge capture","score":5}]},{"id":"S5.2","section":"S5","type":"rating_matrix","q":"Rate operational resilience against Key-Person Dependency in critical systems:","hint":"Rate resilience from 1 (Extreme Single Point of Failure) to 5 (Fully Documented / Self-Healing):","subItems":[{"id":"k1","name":"Core Transaction Ledger / Mission-Critical Business Runtimes"},{"id":"k2","name":"Cloud Infrastructure, IAM Security & Network Routing"},{"id":"k3","name":"Integration Middleware, Legacy ETL & Data Pipelines"},{"id":"k4","name":"Proprietary Algorithms, Pricing Engines & Regulatory Reporting"}]},{"id":"S5.3","section":"S5","type":"single_select","q":"How effectively are critical software and cloud vendor renewals managed?","hint":"Commercial leverage, audit defense, and mitigation of punitive price escalation.","opts":[{"text":"<b>Level 1 · Passive Renewals:</b> Automatic renewals with zero leverage and frequent vendor audit true-up penalties","score":1},{"text":"<b>Level 2 · Last-Minute Sourcing:</b> Procurement steps in 30 days prior with minimal time for architecture leverage","score":2},{"text":"<b>Level 3 · Centralized VMO:</b> Vendor Management Office tracking renewal calendars and major license spend tiers","score":3},{"text":"<b>Level 4 · Strategic Vendor Governance:</b> Proactive roadmaps, competitive benchmarks, and multi-cloud architectural leverage","score":4},{"text":"<b>Level 5 · Continuous Commercial Optimization:</b> Real-time consumption telemetry, aggressive price gating, and exit options","score":5}]},{"id":"S5.4","section":"S5","type":"multi_select","q":"Which Technical Talent & Engineering Retention structures are established?","hint":"Select all active mechanisms in your engineering organization:","opts":[{"text":"Dedicated Fellow/Principal Technical Career Ladder (growth without managerial overhead)","score":1},{"text":"Market-Benchmarked Compensation Parity for elite software and cloud architects","score":1},{"text":"Internal Engineering Academy with protected hours for certifications and cross-skilling","score":1},{"text":"Rotational Guilds & Communities of Practice sharing architectural standards","score":1},{"text":"Active Open-Source contribution policy and engineering brand visibility","score":1}]},{"id":"S6.1","section":"S6","type":"drag_rank","q":"Rank what actually drives project funding and capital approval in practice:","hint":"Order from Most Influential Driver of Project Funding to Least Influential:","rankItems":[{"id":"f1","label":"Executive Sponsor Clout & Political Loudest Voice in the Room"},{"id":"f2","label":"Urgent Regulatory Mandates & Imminent Compliance Deadlines"},{"id":"f3","label":"Exaggerated Upfront ROI Business Cases (Never Formally Audited)"},{"id":"f4","label":"Quantified Economic Value Added (EVA) & Customer Value Stream Telemetry"}]},{"id":"S6.2","section":"S6","type":"single_select","q":"How rigorously is business value tracked after modernizations go live?","hint":"Post-implementation review and verified realization of P&L benefits.","opts":[{"text":"<b>Level 1 · Unaudited:</b> Zero tracking post-launch; project success is declared purely if it goes live","score":1},{"text":"<b>Level 2 · Delivery Retrospective:</b> One-time project close meeting focused strictly on schedule and cost variance","score":2},{"text":"<b>Level 3 · Qualitative Confirmation:</b> Business sponsor submits an informal benefit memo after 6 months","score":3},{"text":"<b>Level 4 · Formal Finance Reconciliation:</b> 12-month post-launch value realization audit reconciled against P&L results","score":4},{"text":"<b>Level 5 · Automated Telemetry:</b> Continuous real-time value realization metrics directly linking software releases to revenue","score":5}]},{"id":"S6.3","section":"S6","type":"slider","q":"What is your Cloud Financial Management (FinOps) and unit economics maturity?","hint":"Visibility into technology unit cost per customer transaction, active user, or product line.","sliderConfig":{"min":0,"max":100,"step":5,"defaultVal":45,"ticks":["0% (Black Box Overhead)","25%","50%","75%","100% (Unit Economics)"],"descs":["Unallocated Overhead: Technology bills are a black box shared expense; zero accountability","Basic Bill Reviews: Monthly cloud invoice reviews with frequent bill-shock surprises","Enforced Tagging: Departmental cost allocation and showback implemented for major systems","Mature FinOps: Automated anomaly detection, rightsizing, and committed use discount coverage","Unit Economics: Real-time cost-per-transaction telemetry actively guiding engineering decisions"]}},{"id":"S6.4","section":"S6","type":"single_select","q":"How disciplined is /* ---------- Cognito RBAC Config (ap-south-1) ---------- */
const COGNITO_CONFIG = (window.LTM_CONFIG && window.LTM_CONFIG.cognito) || {};

let AUTH_USER = null;

function initAuth() {
  try {
    const stored = sessionStorage.getItem("ltm_auth_user");
    if (stored) {
      AUTH_USER = JSON.parse(stored);
    }
  } catch(e) {}
  renderAuthWidget();
}

function renderAuthWidget() {
  const w = document.getElementById("authStatus");
  if (!w) return;
  if (AUTH_USER && AUTH_USER.email) {
    const isSuper = AUTH_USER.role === "super_admin";
    w.innerHTML = '<span class="pill" style="background:#EBF3F5;color:var(--steel);font-weight:700;padding:4px 8px;font-size:11px">'
      + (isSuper ? '👑 Super Admin: ' : '👤 Consultant: ') + esc(AUTH_USER.email) + '</span>'
      + '<button class="btn ghost sm" onclick="logout()" style="margin-left:6px;padding:3px 8px;font-size:11px">Sign Out</button>';
  } else {
    w.innerHTML = '<button class="btn primary sm" onclick="openLoginModal()" style="padding:4px 10px;font-size:11.5px;font-weight:700">🔐 Sign In</button>';
  }
}

function openLoginModal() {
  const m = document.getElementById("loginModal");
  if (m) { m.style.display = "flex"; document.getElementById("loginEmail").focus(); }
}

function closeLoginModal() {
  const m = document.getElementById("loginModal");
  if (m) m.style.display = "none";
}

async function handleCognitoLogin() {
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  const errDiv = document.getElementById("loginError");
  const btn = document.getElementById("btnSubmitLogin");

  if (!email || !password) {
    errDiv.textContent = "Please enter both email and password.";
    errDiv.style.display = "block";
    return;
  }

  btn.disabled = true;
  btn.textContent = "Verifying...";
  errDiv.style.display = "none";

  try {
    // Shared client: stores the ID + refresh token; role/permissions come from the server.
    const session = await LTM_API.signIn(email, password);
    try {
      const meRes = await LTM_API.fetch("/api/me");
      if (meRes.ok) {
        const me = await meRes.json();
        if (me.ok) { session.role = me.role; session.permissions = me.permissions; LTM_API.writeSession(session); }
      }
    } catch (e) { console.warn("Could not load permissions:", e.message); }
    AUTH_USER = session;
    closeLoginModal();
    renderAuthWidget();
    toast("Welcome " + AUTH_USER.email + " (Signed In)");
  } catch(err) {
    errDiv.textContent = err.message || "Invalid email or password.";
    errDiv.style.display = "block";
  } finally {
    btn.disabled = false;
    btn.textContent = "Sign In →";
  }
}

function logout() {
  AUTH_USER = null;
  LTM_API.signOut();
  renderAuthWidget();
  toast("Signed out");
}

function checkEditPermission() {
  if (!AUTH_USER) {
    openLoginModal();
    return false;
  }
  return true;
}
