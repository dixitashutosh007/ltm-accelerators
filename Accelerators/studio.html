  "finops-iq": {"meta": {"schema_version": "2.2.0", "framework": "FinOps IQ", "edition": "Production Consulting & Advisory Edition", "last_reviewed": "2026-09", "scale": "0-100 normalised", "disclaimer": "Indicative FinOps maturity screen based on self-reported inputs and consultant diagnostic probes. Scores reflect responses given and are intended to prioritize advisory action, not to certify compliance. Aligned with FinOps Foundation Framework (Inform, Optimize, Operate) and FOCUS 1.0 specifications. 'FinOps' is a trademark of the FinOps Foundation.", "gating_note": "Maturity is the highest stage passed with all preceding stages also passed. A stage passes only when its weighted score meets the threshold AND every critical checkpoint question meets the critical minimum threshold.", "sources": [{"name": "FinOps Foundation \u2014 FinOps Framework 2026", "url": "https://www.finops.org/framework/"}, {"name": "FinOps Open Cost and Usage Specification (FOCUS 1.0)", "url": "https://focus.finops.org/"}, {"name": "State of FinOps 2026 Benchmark", "url": "https://www.finops.org/insights/state-of-finops/"}], "stages": [{"id": "chaos", "n": 1, "name": "Chaos / Crawl Baseline", "short_name": "Chaos", "color": "#FF5E4F", "threshold": 60, "crit_min": 70, "desc": "Foundational governance, security root boundaries, and raw billing data ingestion must exist before meaningful FinOps work can begin.", "aim": "Establish who owns what, eliminate rogue unallocated spend, and ingest trustworthy raw billing data.", "leap_guide": "To graduate from Chaos to Informed: (1) Formalize an account registry with a single named owner per subscription; (2) Ingest raw cloud billing exports into central S3/Blob storage; (3) Mandate the 3 core tags (CostCenter, Owner, App) on all compute resources."}, {"id": "informed", "n": 2, "name": "Informed / Walk Foundation", "short_name": "Informed", "color": "#B26A00", "threshold": 65, "crit_min": 70, "desc": "Cost visibility, tagging discipline (\u226580%), scheduled showback cadence, and anomaly detection are established across business units.", "aim": "Make spend visible and attributable, detect unexpected cost anomalies within 24h, and build regular monthly review cadences.", "leap_guide": "To graduate from Informed to Optimized: (1) Shift from mere reporting to active waste elimination; (2) Establish a centralized commitment discount strategy (RIs/Savings Plans coverage \u2265 70%); (3) Allocate shared container and Kubernetes clusters by namespace."}, {"id": "optimized", "n": 3, "name": "Optimized / Rate & Usage", "short_name": "Optimized", "color": "#35754D", "threshold": 70, "crit_min": 75, "desc": "The enterprise actively reduces waste, optimizes commitment-based rates, rightsizes compute/storage, and evaluates cost in architecture reviews.", "aim": "Convert visibility into recurring, measurable savings and embed cost consciousness into engineering sprints.", "leap_guide": "To graduate from Optimized to Automated: (1) Replace manual Jira tickets with automated policy-as-code guardrails; (2) Implement automated non-prod parking schedules; (3) Put FinOps efficiency metrics into engineering OKRs and performance reviews."}, {"id": "automated", "n": 4, "name": "Automated / Run Practice", "short_name": "Automated", "color": "#3C829B", "threshold": 75, "crit_min": 75, "desc": "Cost governance is enforced programmatically through policy-as-code pipelines, auto-parking, storage tiering, and engineering KPIs.", "aim": "Make the efficient path the default path without manual friction, and extend FinOps to modern GenAI/GPU workloads.", "leap_guide": "To graduate from Automated to Transparent: (1) Transition from showback to automated multi-tenant chargeback; (2) Model real-time unit economics (cost per transaction/tenant/API); (3) Integrate cloud unit costs directly into product pricing and gross margin models."}, {"id": "transparent", "n": 5, "name": "Transparent / Unit Economics", "short_name": "Transparent", "color": "#5A3A83", "threshold": 80, "crit_min": 80, "desc": "Full financial accountability, real-time unit economics, margin forecasting, and direct integration into product roadmaps and pricing.", "aim": "Run cloud as a core business driver, priced, margin-managed, and optimized for maximum shareholder value.", "leap_guide": "At Stage 5 (Transparent): Focus on continuous posture defensibility, real-time margin defense, automated vendor contract renegotiations, and carbon sustainability unit economics."}], "domains": [{"id": "understanding_usage", "label": "Understanding Cloud Usage & Cost", "color": "#3C829B", "icon": "\ud83d\udcca"}, {"id": "business_value", "label": "Quantifying Business Value", "color": "#5A3A83", "icon": "\ud83c\udfaf"}, {"id": "optimizing_cost", "label": "Optimizing Usage & Cost", "color": "#35754D", "icon": "\u26a1"}, {"id": "managing_practice", "label": "Managing the FinOps Practice", "color": "#B26A00", "icon": "\ud83c\udfdb\ufe0f"}, {"id": "modern_workloads", "label": "Modern Workloads (K8s & GenAI)", "color": "#FF5E4F", "icon": "\ud83e\udd16"}], "checkpoints": [{"id": "chk-c1", "stage": "chaos", "title": "Account Ownership & Scoped Access Model", "desc": "Named technical & business owners assigned per account/subscription with least-privilege billing console access."}, {"id": "chk-c2", "stage": "chaos", "title": "Centralized Raw Billing Ingestion", "desc": "Granular hourly/daily cost & usage data exported to centralized, durable storage (S3/GCS/Blob)."}, {"id": "chk-c3", "stage": "chaos", "title": "Basic Billing Alarms & Spend Thresholds", "desc": "Active budget threshold alerts configured to fire before bills unexpectedly surge."}, {"id": "chk-c4", "stage": "chaos", "title": "Finance Direct Cost Console Visibility", "desc": "Finance & procurement have self-service read-only access to billing data without ticketing engineering."}, {"id": "chk-c5", "stage": "chaos", "title": "Production & Non-Prod Account Isolation", "desc": "Separate accounts/subscriptions with clear billing boundaries between production and sandbox/dev estates."}, {"id": "chk-i1", "stage": "informed", "title": "Comprehensive Tagging Policy (\u226580% coverage)", "desc": "Documented tagging strategy with CostCenter, Owner, and App tags actively enforced on \u226580% compute/storage."}, {"id": "chk-i2", "stage": "informed", "title": "Multi-Cloud Normalization & FOCUS Readiness", "desc": "Billing data mapped to standardized taxonomy or FOCUS 1.0 format across hyperscalers."}, {"id": "chk-i3", "stage": "informed", "title": "Scheduled Showback Reporting Cadence", "desc": "Bi-weekly or monthly showback reports distributed directly to engineering team leads and BUs."}, {"id": "chk-i4", "stage": "informed", "title": "Automated Anomaly Detection", "desc": "Algorithmic cost anomaly detection alerting on unexpected spend spikes within 24 hours."}, {"id": "chk-i5", "stage": "informed", "title": "Month-over-Month Variance Accountability", "desc": "Engineering and product leads can explain month-over-month cloud cost variances with business drivers."}, {"id": "chk-o1", "stage": "optimized", "title": "Commitment Discount Coverage (\u226570%)", "desc": "\u226570% of steady-state compute covered by RIs, Savings Plans, or CUDs with centralized portfolio management."}, {"id": "chk-o2", "stage": "optimized", "title": "Continuous Rightsizing Review & Execution", "desc": "Bi-weekly/monthly cadence where rightsizing and idle resource recommendations are actively deployed."}, {"id": "chk-o3", "stage": "optimized", "title": "Container & Kubernetes Cost Allocation", "desc": "Shared cluster costs broken down by namespace, pod, service, or tenant (e.g. Kubecost, OpenCost)."}, {"id": "chk-o4", "stage": "optimized", "title": "Spot & Transient Compute Workload Adoption", "desc": "Eligible stateless, batch, or non-critical workloads leverage Spot/Preemptible instances with automated eviction handling."}, {"id": "chk-a1", "stage": "automated", "title": "Policy-as-Code Guardrails & Enforcement", "desc": "Automated enforcement (OPA, Terraform Sentinel, Azure Policy, SCPs) blocking non-compliant or untagged provisioning."}, {"id": "chk-a2", "stage": "automated", "title": "Automated Non-Prod Environment Parking", "desc": "Development and test environments automatically parked outside of core business hours."}, {"id": "chk-a3", "stage": "automated", "title": "Storage Lifecycle & Snapshot Auto-Pruning", "desc": "Automated lifecycle policies tiering object storage and purging unattached snapshots/disks by TTL."}, {"id": "chk-a4", "stage": "automated", "title": "AI / GenAI & GPU Spend Governance", "desc": "GPU cluster utilization tracking, idle model endpoint shutoff, and token inference cost attribution."}, {"id": "chk-t1", "stage": "transparent", "title": "Automated Multi-Tenant Chargeback", "desc": "Direct financial cross-charging to business unit P&Ls with auditable allocation of shared platforms."}, {"id": "chk-t2", "stage": "transparent", "title": "Real-Time Unit Economics Tracking", "desc": "Cloud spend measured against business metrics (cost per transaction, cost per active user, cost per API call)."}, {"id": "chk-t3", "stage": "transparent", "title": "Product Pricing & Gross Margin Integration", "desc": "Cloud unit costs feed directly into product pricing, enterprise client contract margins, and CFO forecasting."}, {"id": "chk-t4", "stage": "transparent", "title": "Near-Zero Waste Posture (<4% bill)", "desc": "Orphaned, idle, and unallocated cloud waste consistently held under 4% of total estate spend."}]}, "questions": [{"id": "C1", "stage": "chaos", "domain": "managing_practice", "finops_capability": "Account & Identity Governance", "critical": true, "weight": 2, "checkpoint_id": "chk-c1", "text": "Is there an account-ownership and access model that supports cost governance (named owners per account, least-privilege access to billing and cost consoles)?", "consultant_probe": "Ask to inspect their cloud organizational hierarchy (AWS Organizations / Azure Management Groups / GCP Resource Manager). Verify whether individual subscriptions have documented business & technical owners or are orphaned under former employees.", "subjective_prompt": "Document client's account ownership structure, billing console access policies, and any known orphaned subscriptions.", "options": [{"label": "Yes \u2014 named owners on every account, scoped billing access documented", "score": 100}, {"label": "Ownership mostly assigned, access permissions ad hoc", "score": 65}, {"label": "Owners named for some accounts only", "score": 30}, {"label": "Neither owners nor access model defined", "score": 0}], "remediation": "Establish named owners for every account/subscription and a documented access model for billing and cost consoles \u2014 the foundation FinOps decisions attach to."}, {"id": "C2", "stage": "chaos", "domain": "understanding_usage", "finops_capability": "Cost Data Ingestion", "critical": true, "weight": 2, "checkpoint_id": "chk-c2", "text": "Is granular billing and usage data exported to a centralised, durable store (e.g. CUR to S3, Cost Management export to Azure Blob, Cloud Billing export to BigQuery)?", "consultant_probe": "Verify if raw hourly/daily Cost & Usage Reports (CUR / FOCUS-ready exports) are enabled and flowing to an immutable analytical bucket, or if teams rely solely on 30-day portal summaries.", "subjective_prompt": "Note data export frequency, storage destination, retention policy, and whether multiple cloud providers are consolidated.", "options": [{"label": "Yes \u2014 daily/hourly granular export active to a central bucket for all cloud accounts", "score": 100}, {"label": "Export enabled for primary cloud accounts only", "score": 65}, {"label": "Billing data viewed in console only; no automated export", "score": 30}, {"label": "No centralised access to billing data", "score": 0}], "remediation": "Enable automated daily/hourly billing exports (AWS CUR 2.0, Azure Cost Export, GCP BigQuery Export) to an analytical data lake \u2014 without granular data, attribution and optimization are impossible."}, {"id": "C3", "stage": "chaos", "domain": "business_value", "finops_capability": "Budgeting & Anomaly Alerting", "critical": false, "weight": 1, "checkpoint_id": "chk-c3", "text": "Are billing alarms or spend threshold notifications configured and actively alerting when spend crosses defined thresholds?", "consultant_probe": "Ask when the last unexpected spend surge occurred. Were they alerted by an automated notification, or did they only find out when the monthly invoice arrived?", "subjective_prompt": "Document current alert configuration, distribution lists, and false-positive / alert-fatigue issues.", "options": [{"label": "Yes \u2014 proactive threshold alerts on all accounts, routed to active communication channels (Slack/Teams/Email)", "score": 100}, {"label": "Alarms configured for some accounts or at high threshold only", "score": 65}, {"label": "Configured historically but alerts are ignored or misrouted", "score": 30}, {"label": "No billing alarms or spend alerts exist", "score": 0}], "remediation": "Configure automated spend alerts at 50%, 80%, and 100% of budgeted spend with routing to active engineering communication channels."}, {"id": "C4", "stage": "chaos", "domain": "managing_practice", "finops_capability": "Cross-Functional Collaboration", "critical": true, "weight": 2, "checkpoint_id": "chk-c4", "text": "Does the finance team have direct read-only access to cloud billing consoles and cost dashboards without needing engineering tickets?", "consultant_probe": "Ask Finance how they reconcile month-end invoices. Do they wait 2 weeks for an engineering manager to manually pull a CSV, or can they self-service in the cloud console?", "subjective_prompt": "Capture current finance workflow, invoice reconciliation delay, and any friction between finance and cloud architects.", "options": [{"label": "Yes \u2014 finance has self-service, read-only access to cloud billing tools and portals", "score": 100}, {"label": "Finance receives periodic manual reports from engineering on request", "score": 65}, {"label": "Finance sees the top-level invoice only with no line-item visibility", "score": 30}, {"label": "Finance has no direct visibility into cloud spend", "score": 0}], "remediation": "Grant Finance and procurement read-only billing IAM roles (e.g. AWS BillingReadOnlyAccess, Azure Cost Management Reader) to eliminate invoice blind spots."}, {"id": "C5", "stage": "chaos", "domain": "managing_practice", "finops_capability": "Account & Subscription Governance", "critical": true, "weight": 2, "checkpoint_id": "chk-c1", "text": "Does an account / subscription ownership registry exist with a named technical and business owner per account?", "consultant_probe": "Ask for the registry document or CMDB extract. Check if ownership is maintained in an automated service catalog or an outdated spreadsheet from two years ago.", "subjective_prompt": "Assess accuracy of the account registry and how new cloud accounts are provisioned and registered.", "options": [{"label": "Yes \u2014 comprehensive registry maintained and reviewed on account provisioning", "score": 100}, {"label": "Registry exists but is partially out of date or missing some business owners", "score": 65}, {"label": "Informal knowledge of who owns which accounts", "score": 30}, {"label": "No account registry exists", "score": 0}], "remediation": "Mandate an Account Ownership Registry integrated into your Identity Provider (Okta/Entra ID) and account vending pipeline."}, {"id": "C6", "stage": "chaos", "domain": "managing_practice", "finops_capability": "Cloud Architecture & Boundaries", "critical": false, "weight": 1, "checkpoint_id": "chk-c5", "text": "Are production and non-production environments strictly separated into distinct cloud accounts/subscriptions with clear billing boundaries?", "consultant_probe": "Inspect whether developers have permissions to spin up GPU or high-memory instances in the same AWS account / Azure subscription that hosts production workloads.", "subjective_prompt": "Note environment segmentation architecture, sandbox policies, and cost containment guardrails.", "options": [{"label": "Yes \u2014 strict separation into separate accounts/subscriptions with isolated billing", "score": 100}, {"label": "Separated by VPC / Resource Group but sharing the same account / subscription", "score": 65}, {"label": "Partially mixed environments across legacy workloads", "score": 30}, {"label": "Production and non-production share the same accounts with no boundary", "score": 0}], "remediation": "Isolate production, staging, and sandbox environments into dedicated accounts/subscriptions to prevent non-prod experiments from polluting production billing."}, {"id": "C7", "stage": "chaos", "domain": "managing_practice", "finops_capability": "FinOps Enablement & Team Structure", "critical": false, "weight": 1, "checkpoint_id": "chk-c1", "text": "Is a single team or individual formally accountable for cloud spend governance (e.g. CCoE, FinOps Champion, Cloud Architect)?", "consultant_probe": "Ask who owns the cloud budget variance conversation. If everyone says 'everyone is responsible', in practice nobody is accountable.", "subjective_prompt": "Document existing FinOps/CCoE charter, reporting line (CFO vs CTO), and time dedication.", "options": [{"label": "Yes \u2014 formally chartered FinOps team or lead with documented responsibilities", "score": 100}, {"label": "Informally owned by a cloud lead alongside other infrastructure duties", "score": 65}, {"label": "FinOps responsibilities fragmented across engineering leads with no coordination", "score": 30}, {"label": "No team or individual is accountable for cloud spend governance", "score": 0}], "remediation": "Appoint a dedicated FinOps Lead or formalize a Cloud Center of Excellence (CCoE) cross-functional charter with Finance and Engineering representation."}, {"id": "C8", "stage": "chaos", "domain": "understanding_usage", "finops_capability": "Multi-Cloud Account Isolation", "critical": false, "weight": 1, "checkpoint_id": "chk-c2", "text": "Are root credentials, multi-cloud master payer accounts, and enterprise agreement portals properly secured with MFA and restricted billing console roles?", "consultant_probe": "Check how master payer accounts (AWS Management Account / Azure Enterprise Agreement portal) are accessed and who can purchase savings plans or marketplace items.", "subjective_prompt": "Document master payer security, marketplace commitment approval gates, and IAM controls.", "options": [{"label": "Yes \u2014 master payer isolated, root MFA enforced, dedicated billing IAM roles", "score": 100}, {"label": "Master payer secured, but billing role access is loosely restricted", "score": 65}, {"label": "Shared administrator logins used for billing consoles", "score": 30}, {"label": "No access controls or MFA on root/master billing consoles", "score": 0}], "remediation": "Lock down root billing credentials with hardware MFA and enforce least-privilege IAM roles for purchasing and marketplace commitments."}, {"id": "I1", "stage": "informed", "domain": "understanding_usage", "finops_capability": "Cost Allocation & Metadata", "critical": true, "weight": 2, "checkpoint_id": "chk-i1", "text": "Is a tagging / metadata strategy formally defined and documented (specifying CostCenter, Owner, Application, and Environment)?", "consultant_probe": "Ask to see the written tagging standard. Check if there are case-sensitivity clashes (e.g. 'Environment' vs 'env') and whether shared services have defined allocation keys.", "subjective_prompt": "Evaluate completeness of tagging standard and consistency across business units.", "options": [{"label": "Yes \u2014 formal policy covering required keys, allowed values, and inheritance rules", "score": 100}, {"label": "Standard documented but loosely adopted or inconsistent across teams", "score": 65}, {"label": "Informal conventions exist without formal documentation", "score": 30}, {"label": "No tagging strategy or metadata standard defined", "score": 0}], "remediation": "Publish a mandatory tagging taxonomy (CostCenter, Owner, AppID, Env, DataClassification) with strict casing and value validation rules."}, {"id": "I2", "stage": "informed", "domain": "understanding_usage", "finops_capability": "Cost Allocation Coverage", "critical": true, "weight": 2, "checkpoint_id": "chk-i1", "text": "What percentage of active compute and storage resources currently carry complete, valid mandatory tags in production and non-production?", "consultant_probe": "Run or ask for a Cost Allocation Tag coverage report. Many clients think they are at 90%, but untagged disks, snapshots, and networking bring actual coverage below 50%.", "subjective_prompt": "Record actual tag coverage percentage, hardest resources to tag, and untagged spend dollar value.", "options": [{"label": "\u2265 85% of total spend carries full, validated mandatory tags", "score": 100}, {"label": "60% \u2013 84% tagged; key compute tagged but storage/network untagged", "score": 65}, {"label": "30% \u2013 59% tagged with substantial unallocated spend", "score": 30}, {"label": "< 30% tagged; spend cannot be reliably mapped to teams", "score": 0}], "remediation": "Establish a sprint goal to achieve \u226580% tag coverage on compute and storage, focusing on the top 20% of resources that generate 80% of spend."}, {"id": "I3", "stage": "informed", "domain": "understanding_usage", "finops_capability": "Data Normalization & FOCUS", "critical": false, "weight": 1, "checkpoint_id": "chk-i2", "text": "Is multi-cloud and hybrid cost data normalized using a common taxonomy or the FinOps Open Cost and Usage Specification (FOCUS 1.0)?", "consultant_probe": "Ask how they compare AWS EC2 vs Azure VM vs GCP Compute Engine costs. Is there a normalized data model, or do analysts write bespoke SQL scripts for each provider?", "subjective_prompt": "Note multi-cloud data pipeline tools (e.g. Snowflake, Databricks, CloudHealth, Apptio) and FOCUS adoption plans.", "options": [{"label": "Yes \u2014 normalized data model or FOCUS 1.0 specification adopted across all clouds", "score": 100}, {"label": "Single-cloud estate, or partial normalization across primary clouds", "score": 65}, {"label": "Multi-cloud data maintained in separate siloed spreadsheets/consoles", "score": 30}, {"label": "No normalization; impossible to compare cross-cloud usage", "score": 0}], "remediation": "Adopt the FinOps Foundation FOCUS 1.0 schema to normalize multi-cloud billing into consistent dimensions (BilledCost, EffectiveCost, Provider, ChargeSubcategory)."}, {"id": "I4", "stage": "informed", "domain": "understanding_usage", "finops_capability": "Data Analysis & Showback", "critical": false, "weight": 1, "checkpoint_id": "chk-i3", "text": "Can engineering and product teams view their own team's cost data self-service without raising a ticket or waiting for monthly finance reports?", "consultant_probe": "Ask an engineering lead to show where they look up yesterday's spend for their team. Is it on a live dashboard or completely hidden?", "subjective_prompt": "Document developer access to cost dashboards, tool adoption rates, and feedback.", "options": [{"label": "Yes \u2014 self-service dashboards filtered to team/application updated daily", "score": 100}, {"label": "Dashboards exist but require manual permission setup or are infrequently used", "score": 65}, {"label": "Teams can view top-level account cost but cannot filter to their workloads", "score": 30}, {"label": "Engineering teams have no visibility into their specific cost data", "score": 0}], "remediation": "Deploy role-based, team-filtered showback dashboards (e.g. QuickSight, PowerBI, Grafana, Cloudability) showing daily cost trends per product squad."}, {"id": "I5", "stage": "informed", "domain": "understanding_usage", "finops_capability": "Showback Cadence", "critical": false, "weight": 1, "checkpoint_id": "chk-i3", "text": "How regularly are showback reports or automated spend summaries distributed to engineering leaders and business unit stakeholders?", "consultant_probe": "Check if showback is an automated proactive push (Slack/email digest) or a reactive report compiled only when budgets are blown.", "subjective_prompt": "Capture showback frequency, recipients, and whether teams actively review reports.", "options": [{"label": "Weekly or bi-weekly automated reports with trend analysis", "score": 100}, {"label": "Monthly showback reports distributed alongside finance reviews", "score": 65}, {"label": "Quarterly or ad-hoc reports only when leadership requests", "score": 30}, {"label": "No showback reporting exists", "score": 0}], "remediation": "Automate a weekly showback digest highlighting top spend drivers, cost deltas, and month-to-date budget consumption for each engineering director."}, {"id": "I6", "stage": "informed", "domain": "business_value", "finops_capability": "Anomaly Management", "critical": false, "weight": 1, "checkpoint_id": "chk-i4", "text": "Is automated cost anomaly detection enabled and alerting on unexpected spend spikes within 24 hours of occurrence?", "consultant_probe": "Ask: 'If an engineer mistakenly deploys an unindexed vector DB cluster that burns $10k in a weekend, when does someone find out?'", "subjective_prompt": "Record recent cost anomaly horror stories, threshold tuning, and response procedures.", "options": [{"label": "Yes \u2014 automated ML-based anomaly detection alerting within 24 hours to team channels", "score": 100}, {"label": "Cloud-native anomaly detection active on some accounts with email alerts", "score": 65}, {"label": "Static threshold alerts only; anomalies discovered during monthly bill review", "score": 30}, {"label": "No anomaly detection in place", "score": 0}], "remediation": "Turn on AWS Cost Anomaly Detection / Azure Cost Alerts with Slack/Teams webhooks configured to notify on-call engineers for spend spikes > $200/day."}, {"id": "I7", "stage": "informed", "domain": "optimizing_cost", "finops_capability": "Waste Management & Orphan Discovery", "critical": false, "weight": 1, "checkpoint_id": "chk-i4", "text": "Are orphaned and idle resources (unattached EBS/disks, unassociated Elastic IPs, stale snapshots, idle load balancers) routinely identified?", "consultant_probe": "Inspect their storage bill. In almost every unmanaged environment, 10-25% of storage cost comes from abandoned snapshots and detached disks from terminated instances.", "subjective_prompt": "Estimate dollar value of idle resources and frequency of cleanup sprints.", "options": [{"label": "Yes \u2014 continuous automated scans identify and flag orphaned resources weekly", "score": 100}, {"label": "Periodic manual audits conducted every few months", "score": 65}, {"label": "Identified opportunistically when cleaning up environments", "score": 30}, {"label": "Orphaned and idle resources are never scanned or tracked", "score": 0}], "remediation": "Schedule an immediate 'Cloud Janitor' cleanup sprint to delete unattached volumes, idle load balancers, and snapshots older than 90 days."}, {"id": "I8", "stage": "informed", "domain": "managing_practice", "finops_capability": "Variance Analysis & Accountability", "critical": true, "weight": 2, "checkpoint_id": "chk-i5", "text": "How confidently can engineering teams explain their month-over-month cloud cost variances with specific business and architectural drivers?", "consultant_probe": "Ask what caused last month's largest cost increase. If the answer is 'we don't know, maybe data transfer or traffic', accountability is weak.", "subjective_prompt": "Gauge engineering familiarity with cost drivers (user growth vs inefficient code vs architectural leak).", "options": [{"label": "Very confidently \u2014 variances tied directly to release changes, traffic volume, or unit scaling", "score": 100}, {"label": "Moderate confidence \u2014 explainable with research, but takes several days to diagnose", "score": 65}, {"label": "Low confidence \u2014 cost increases often unexplained or attributed to generic cloud growth", "score": 30}, {"label": "Teams have no awareness of their cost variances", "score": 0}], "remediation": "Incorporate a 15-minute monthly FinOps variance review into sprint retrospectives, requiring teams to account for changes >10% MoM."}, {"id": "I9", "stage": "informed", "domain": "managing_practice", "finops_capability": "Review Cadence & Culture", "critical": false, "weight": 1, "checkpoint_id": "chk-i5", "text": "What formal cadence exists for reviewing cloud cost trends, forecasts, and optimization opportunities at team or BU level?", "consultant_probe": "Check if cost reviews are embedded into existing engineering sprint rituals or isolated into a dreaded annual procurement grilling.", "subjective_prompt": "Document meeting cadence, attendance (finance vs engineering), and follow-through on action items.", "options": [{"label": "Monthly structured review with both engineering and finance leaders attending", "score": 100}, {"label": "Quarterly reviews tied to budget cycles", "score": 65}, {"label": "Ad-hoc reviews triggered only when budgets are overrun", "score": 30}, {"label": "No regular cost review cadence exists", "score": 0}], "remediation": "Establish a standing monthly Cloud Financial Review between Engineering Directors, Product Owners, and Finance Leads."}, {"id": "O1", "stage": "optimized", "domain": "optimizing_cost", "finops_capability": "Rate Optimization & Commitments", "critical": true, "weight": 2, "checkpoint_id": "chk-o1", "text": "What percentage of steady-state, eligible compute spend is covered by commitment-based discounts (Savings Plans, Reserved Instances, CUDs)?", "consultant_probe": "Ask for their Compute Savings Plans / RI coverage and utilization percentages. Elite FinOps practitioners maintain 75\u201385% coverage with >98% utilization.", "subjective_prompt": "Capture current commitment coverage %, utilization %, commitment expiration calendar, and purchasing policy.", "options": [{"label": "\u2265 75% coverage with >95% commitment utilization managed centrally", "score": 100}, {"label": "50% \u2013 74% coverage; some accounts optimized, others running purely on-demand", "score": 65}, {"label": "25% \u2013 49% coverage; ad-hoc purchases without centralized tracking", "score": 30}, {"label": "< 25% coverage; vast majority running on expensive on-demand rates", "score": 0}], "remediation": "Centralize commitment purchasing at the master payer level and execute a 1-year / 3-year Compute Savings Plan to cover steady-state baseline, yielding immediate 20-35% savings."}, {"id": "O2", "stage": "optimized", "domain": "optimizing_cost", "finops_capability": "Workload Optimization & Rightsizing", "critical": true, "weight": 2, "checkpoint_id": "chk-o2", "text": "How regularly are instance rightsizing, CPU/memory downsizing, and modern generation upgrades (e.g. Graviton/ARM) reviewed and deployed?", "consultant_probe": "Check if rightsizing recommendations in AWS Compute Optimizer or Azure Advisor sit in an untouched backlog or are actively converted into Jira tickets and deployed.", "subjective_prompt": "Document rightsizing deployment blockers (e.g. fear of outages, lack of automated testing, dev team resistance).", "options": [{"label": "Bi-weekly or monthly cadence with verified rightsizing actions deployed to production", "score": 100}, {"label": "Quarterly reviews; recommendations actioned for non-prod, slow for production", "score": 65}, {"label": "Rightsizing reviewed ad-hoc or only during infrastructure refresh", "score": 30}, {"label": "Instances are rarely or never rightsized after initial provisioning", "score": 0}], "remediation": "Dedicate 10% of engineering sprint capacity to deploy Compute Optimizer rightsizing recommendations, starting with non-prod and over-provisioned memory instances."}, {"id": "O3", "stage": "optimized", "domain": "modern_workloads", "finops_capability": "Container & K8s Allocation", "critical": false, "weight": 2, "checkpoint_id": "chk-o3", "text": "Are Kubernetes / container cluster infrastructure costs broken down and allocated by namespace, deployment, pod, or microservice?", "consultant_probe": "Ask how multi-tenant EKS/GKE/AKS cluster costs are distributed to product squads. Are clusters treated as a single massive black-box bill, or allocated via Kubecost/OpenCost?", "subjective_prompt": "Detail container footprint (EKS/AKS/GKE/ECS), cluster tooling, and pod resource request vs limit discipline.", "options": [{"label": "Yes \u2014 container cost allocation tool (e.g. Kubecost, OpenCost) active with pod-level showback", "score": 100}, {"label": "Cluster costs allocated using rough namespace node percentages or tag proxies", "score": 65}, {"label": "Cluster spend tracked as a single shared pool with no team breakdown", "score": 30}, {"label": "Containerized workloads have zero cost visibility", "score": 0}], "remediation": "Deploy OpenCost or Kubecost across your Kubernetes clusters to allocate node costs down to namespaces, controller workloads, and idle pod allocations."}, {"id": "O4", "stage": "optimized", "domain": "optimizing_cost", "finops_capability": "Spot & Preemptible Compute", "critical": false, "weight": 1, "checkpoint_id": "chk-o4", "text": "What share of eligible stateless, batch, CI/CD, or transient compute spend runs on Spot / Preemptible instances?", "consultant_probe": "Inspect CI/CD runners, batch processing, and non-prod Kubernetes worker nodes. Are they paying full on-demand pricing for disposable compute?", "subjective_prompt": "Document Spot utilization, auto-scaler configuration (e.g. Karpenter), and interruption tolerance.", "options": [{"label": "\u2265 50% of eligible stateless/batch workloads leverage Spot with automated eviction handling", "score": 100}, {"label": "20% \u2013 49% Spot usage in dev/test or specific batch pipelines", "score": 65}, {"label": "< 20% Spot usage; perceived as too risky or complex", "score": 30}, {"label": "Zero Spot usage; everything runs on on-demand compute", "score": 0}], "remediation": "Migrate CI/CD runners and dev Kubernetes node pools to Spot instances using Karpenter / Spot Ocean, cutting compute costs by up to 70%."}, {"id": "O5", "stage": "optimized", "domain": "managing_practice", "finops_capability": "Architecture & Engineering Review", "critical": true, "weight": 2, "checkpoint_id": "chk-o5", "text": "Is cloud financial impact and unit cost a mandatory evaluation criterion in architectural reviews, RFCs, and major system design approvals?", "consultant_probe": "Review a recent Architecture Review Board (ARB) design document. Does it have an estimated monthly operating cost and unit economics section, or purely latency/HA diagrams?", "subjective_prompt": "Assess whether cloud cost is designed in at inception or treated as an afterthought.", "options": [{"label": "Yes \u2014 estimated cost and unit economics are mandatory in all design reviews/RFCs", "score": 100}, {"label": "Cost is discussed informally but not formally modeled or audited", "score": 65}, {"label": "Cost is considered only for multi-million dollar projects", "score": 30}, {"label": "Architecture reviews evaluate performance and security only, ignoring cost", "score": 0}], "remediation": "Add a mandatory 'FinOps & Operating Cost Impact' section to your Architecture Review Board (ARB) templates before code is written."}, {"id": "O6", "stage": "optimized", "domain": "optimizing_cost", "finops_capability": "Commitment Lifecycle Management", "critical": false, "weight": 1, "checkpoint_id": "chk-o1", "text": "How are commitment-based discount portfolios (RIs, Savings Plans, CUDs) monitored for expiration, utilization drift, and break-even targets?", "consultant_probe": "Ask who tracks expiring 1-year and 3-year commitments. Have commitments ever expired unnoticed, causing spend to spike by 30% overnight?", "subjective_prompt": "Review commitment renewal calendar and portfolio hedging strategy.", "options": [{"label": "Continuous automated monitoring with staggered expiration pipeline and alerts", "score": 100}, {"label": "Tracked in a shared spreadsheet with quarterly renewal checks", "score": 65}, {"label": "Reactive renewals; commitments have expired unnoticed in the past", "score": 30}, {"label": "No tracking of commitment expirations or utilization", "score": 0}], "remediation": "Implement a rolling commitment strategy with staggered expirations every quarter to smooth budget impact and prevent cliff-edge renewals."}, {"id": "O7", "stage": "optimized", "domain": "optimizing_cost", "finops_capability": "Data Transfer & Egress Optimization", "critical": false, "weight": 1, "checkpoint_id": "chk-o2", "text": "Has data transfer, cross-AZ traffic, NAT Gateway data processing, and public egress been reviewed and optimized with architectural controls?", "consultant_probe": "Look at the NAT Gateway and Cross-AZ Inter-Region data transfer line items. In modern microservices, inter-AZ traffic often accounts for 15-25% of the total network bill.", "subjective_prompt": "Document network topology, VPC endpoints, CloudFront caching, and cross-AZ traffic patterns.", "options": [{"label": "Yes \u2014 VPC endpoints, direct interconnects, and local AZ routing active; egress audited quarterly", "score": 100}, {"label": "VPC endpoints deployed for top services (S3/Dynamo), but cross-AZ traffic unoptimized", "score": 65}, {"label": "Egress acknowledged as high but no architectural remediation implemented", "score": 30}, {"label": "Data transfer and cross-AZ traffic are unmonitored and unoptimized", "score": 0}], "remediation": "Deploy VPC Gateway Endpoints for S3 and DynamoDB and configure zonal DNS routing to eliminate expensive NAT Gateway and cross-AZ transfer charges."}, {"id": "O8", "stage": "optimized", "domain": "managing_practice", "finops_capability": "FinOps Culture & Gamification", "critical": false, "weight": 1, "checkpoint_id": "chk-o5", "text": "To what extent are engineering teams recognized, celebrated, or rewarded for eliminating cloud waste and improving architectural efficiency?", "consultant_probe": "Ask engineers: 'Do you get recognition in performance reviews or all-hands for saving $50k/month in cloud waste, or only for shipping features?'", "subjective_prompt": "Evaluate organizational incentives, gamification leaderboards, and engineering leadership support.", "options": [{"label": "Active recognition \u2014 FinOps achievements celebrated in all-hands, bonuses, or hackathons", "score": 100}, {"label": "Informal shout-outs in team retrospectives for major savings", "score": 65}, {"label": "Cost savings expected but never publicly recognized or rewarded", "score": 30}, {"label": "Feature velocity is rewarded exclusively; cost optimization is invisible", "score": 0}], "remediation": "Launch an internal 'FinOps Champions' recognition award and highlight top waste-reduction stories in engineering monthly town halls."}, {"id": "O9", "stage": "optimized", "domain": "optimizing_cost", "finops_capability": "Continuous Optimization Backlog", "critical": false, "weight": 1, "checkpoint_id": "chk-o2", "text": "Does a dedicated cost optimization backlog exist and get groomed alongside functional features in regular engineering sprints?", "consultant_probe": "Check their Jira / Azure DevOps backlog. Are FinOps tickets tagged with estimated monthly savings and prioritized by ROI?", "subjective_prompt": "Review Jira backlog for FinOps stories, prioritization criteria, and completion velocity.", "options": [{"label": "Yes \u2014 dedicated FinOps epics/stories with quantified ROI groomed in standard sprints", "score": 100}, {"label": "Stories created occasionally but routinely deprioritized for functional features", "score": 65}, {"label": "Ad-hoc tickets created only when finance rings alarm bells", "score": 30}, {"label": "No cost optimization stories exist in engineering backlogs", "score": 0}], "remediation": "Tag optimization tickets in Jira with estimated monthly savings (e.g. '$2,400/mo savings \u00b7 4 story points') to enable data-driven sprint prioritization."}, {"id": "O10", "stage": "optimized", "domain": "optimizing_cost", "finops_capability": "Optimization Lever Prioritization", "critical": false, "weight": 1, "checkpoint_id": "chk-o1", "text": "Rank these optimization levers by historical ROI in your estate: Commitments, Rightsizing, Storage Lifecycle, and Spot/Autoscaling.", "consultant_probe": "Evaluate which levers have matured vs which are completely neglected by their infrastructure teams.", "subjective_prompt": "Document realized savings across each lever over the past 12 months.", "options": [{"label": "All four levers actively harvested across steady-state workloads", "score": 100}, {"label": "Commitments and storage lifecycle mature; rightsizing and spot nascent", "score": 65}, {"label": "Commitments only; usage optimization and rightsizing not executed", "score": 30}, {"label": "None of these optimization levers have been systematically deployed", "score": 0}], "remediation": "Balance rate optimization (quick financial wins) with architectural usage optimization (permanent engineering efficiency) for compounded ROI."}, {"id": "A1", "stage": "automated", "domain": "managing_practice", "finops_capability": "Policy-as-Code & Guardrails", "critical": true, "weight": 2, "checkpoint_id": "chk-a1", "text": "Is tagging and cost governance enforced automatically through policy-as-code guardrails (e.g. OPA, Terraform Sentinel, Azure Policy, SCPs)?", "consultant_probe": "Test whether an engineer can deploy an untagged EC2 instance or Azure VM via CLI/Terraform right now. Does the CI/CD pipeline or cloud policy immediately block or quarantine it?", "subjective_prompt": "Assess policy-as-code enforcement tools, bypass mechanisms, and automated remediation bots.", "options": [{"label": "Yes \u2014 automated policy gates block non-compliant deployments in CI/CD and at cloud API level", "score": 100}, {"label": "Policies configured in audit mode (flags violations but does not block)", "score": 65}, {"label": "Linting rules exist in some repos but no central enforcement gate", "score": 30}, {"label": "No policy-as-code or automated guardrails exist", "score": 0}], "remediation": "Convert tagging and instance-family guidelines into strict policy-as-code guardrails in Terraform/OpenTofu and Azure Policy / AWS SCPs to block non-compliant deployments."}, {"id": "A2", "stage": "automated", "domain": "optimizing_cost", "finops_capability": "Automated Workload Scheduling", "critical": false, "weight": 1, "checkpoint_id": "chk-a2", "text": "Are non-production resources (dev, test, staging environments) automatically parked or shut down outside working hours and on weekends?", "consultant_probe": "Check if non-prod compute runs 24/7 (744 hours/month) or is on a 50-hour weekly schedule (10 hours x 5 days). Automated parking immediately cuts 65% of non-prod compute spend.", "subjective_prompt": "Document auto-parking tools (AWS Instance Scheduler, Cloud Custodian, Azure Automation) and opt-out rate.", "options": [{"label": "Yes \u2014 default automated schedule stops non-prod outside 8am-6pm weekdays with easy opt-out", "score": 100}, {"label": "Automated schedules active for some teams; others run 24/7 continuously", "score": 65}, {"label": "Engineers are asked to stop instances manually (infrequently done)", "score": 30}, {"label": "All non-production environments run 24/7 by default", "score": 0}], "remediation": "Deploy automated environment schedulers across all dev/staging accounts to power down compute outside core business hours, reclaiming 65% of non-prod cost."}, {"id": "A3", "stage": "automated", "domain": "optimizing_cost", "finops_capability": "Storage Auto-Lifecycle", "critical": false, "weight": 1, "checkpoint_id": "chk-a3", "text": "Do automated lifecycle policies govern object storage tiering (e.g. S3 Intelligent-Tiering / Glacier, Azure Blob cool/archive) and snapshot TTL expiration?", "consultant_probe": "Check S3/Blob storage classes. Are petabytes of log data or backups sitting on S3 Standard / Blob Hot storage that hasn't been accessed in 180 days?", "subjective_prompt": "Audit object storage lifecycle policies, snapshot retention scripts, and archive usage.", "options": [{"label": "Yes \u2014 comprehensive lifecycle rules automatically transition and expire storage across all buckets", "score": 100}, {"label": "Lifecycle rules active on primary buckets; secondary storage unmanaged", "score": 65}, {"label": "Manual cleanup scripts run occasionally when storage bills escalate", "score": 30}, {"label": "No automated lifecycle policies exist; data accumulates indefinitely", "score": 0}], "remediation": "Enable S3 Intelligent-Tiering across all production buckets and enforce a 30-day lifecycle rule on debug logs and ephemeral test snapshots."}, {"id": "A4", "stage": "automated", "domain": "modern_workloads", "finops_capability": "AI & GenAI Cloud Spend Governance", "critical": false, "weight": 2, "checkpoint_id": "chk-a4", "text": "Are modern AI / GenAI and GPU infrastructure costs tracked with idle model endpoint shutdown, GPU utilization metrics, and token cost attribution?", "consultant_probe": "Ask how they track spending on OpenAI/Anthropic APIs, AWS Bedrock, SageMaker, or Azure OpenAI. Are dedicated GPU clusters sitting idle over weekends at $10k/day?", "subjective_prompt": "Document GenAI architecture, dedicated GPU cluster count, prompt token tracking, and caching mechanisms.", "options": [{"label": "Yes \u2014 dedicated GenAI FinOps tracking GPU cluster saturation, token attribution, and idle shutdown", "score": 100}, {"label": "LLM API spend tracked at account level, but GPU utilization and prompt caching unmonitored", "score": 65}, {"label": "AI spend lumped into general cloud compute with zero visibility into model economics", "score": 30}, {"label": "No AI workloads in cloud, or AI spend completely unmanaged", "score": 0}], "remediation": "Implement automatic scale-to-zero on SageMaker/Azure ML inference endpoints and enforce semantic prompt caching to cut recurring model inference costs."}, {"id": "A5", "stage": "automated", "domain": "modern_workloads", "finops_capability": "Container Autoscaling & Rightsizing", "critical": false, "weight": 1, "checkpoint_id": "chk-a3", "text": "Are container resource requests and limits (CPU/Memory) tuned automatically using Horizontal/Vertical Pod Autoscalers (HPA/VPA) or Karpenter?", "consultant_probe": "Inspect their Kubernetes Pod Resource Requests vs Actual Utilization ratio. Across the industry, pods are provisioned for 4x their average memory/CPU need.", "subjective_prompt": "Evaluate VPA/Karpenter adoption, namespace quota enforcement, and node pool bin-packing efficiency.", "options": [{"label": "Yes \u2014 automated VPA/HPA tuning with intelligent node bin-packing (e.g. Karpenter)", "score": 100}, {"label": "HPA configured based on traffic; pod requests tuned manually every few months", "score": 65}, {"label": "Static pod requests set high to prevent OOM errors, causing massive cluster slack", "score": 30}, {"label": "No pod requests/limits configured; nodes run in unbalanced, unoptimized states", "score": 0}], "remediation": "Deploy Vertical Pod Autoscaler in recommendation mode to rightsize container CPU/Memory requests, eliminating massive cluster slack."}, {"id": "A6", "stage": "automated", "domain": "managing_practice", "finops_capability": "Engineering OKRs & KPIs", "critical": true, "weight": 2, "checkpoint_id": "chk-a1", "text": "Are FinOps efficiency metrics formally included in engineering team OKRs, sprint KPIs, or performance evaluations?", "consultant_probe": "Ask the VP of Engineering: 'Are your engineering managers held accountable for unit efficiency and cost targets in their quarterly performance reviews?'", "subjective_prompt": "Document existing engineering OKRs and how cost efficiency is weighted against delivery velocity.", "options": [{"label": "Yes \u2014 explicit cost-efficiency OKRs (e.g. unit cost reduction, zero untagged compute) in sprint KPIs", "score": 100}, {"label": "Discussed at director level, but not cascaded into individual engineering squad OKRs", "score": 65}, {"label": "Mentioned informally when budgets are tight, but not part of performance reviews", "score": 30}, {"label": "Cost efficiency plays zero role in engineering OKRs or evaluations", "score": 0}], "remediation": "Incorporate a standardized FinOps Key Result into engineering squad quarterly OKRs (e.g. 'Maintain <5% unallocated spend and rightsizing compliance \u226590%')."}, {"id": "A7", "stage": "automated", "domain": "optimizing_cost", "finops_capability": "Automated Spot Interruption Handling", "critical": false, "weight": 1, "checkpoint_id": "chk-a2", "text": "Does automated handling, graceful draining, and instant replacement exist for Spot / Preemptible instance interruptions?", "consultant_probe": "Verify if Spot termination notices (AWS 2-minute warning) trigger automated node draining and replacement via Karpenter/Cluster Autoscaler without dropping user traffic.", "subjective_prompt": "Review Spot resilience architecture and zero-downtime test results.", "options": [{"label": "Yes \u2014 automated node drainer and diversified capacity pools ensure zero-downtime Spot resilience", "score": 100}, {"label": "Basic autoscaler handles replacements, but transient failures can occur", "score": 65}, {"label": "Spot used only for batch tasks that can afford hard crashes", "score": 30}, {"label": "No automated interruption handling; Spot cannot be used for application services", "score": 0}], "remediation": "Implement AWS Node Termination Handler or Karpenter capacity rebalancing to drain and rotate Spot instances before cloud termination."}, {"id": "A8", "stage": "automated", "domain": "business_value", "finops_capability": "Forecasting & Predictive Analytics", "critical": true, "weight": 2, "checkpoint_id": "chk-a1", "text": "Over the last rolling quarter, what has been your cloud spend forecast variance against actual monthly billing?", "consultant_probe": "Ask Finance and Cloud Ops to compare their forecasted spend from 90 days ago against the actual invoiced total. Is variance within 5% or 40% off?", "subjective_prompt": "Record actual forecast variance percentage, forecasting tools, and driver-based modeling capabilities.", "options": [{"label": "Within \u00b1 5% variance consistently across quarters", "score": 100}, {"label": "Within \u00b1 15% variance; major product launches sometimes cause drift", "score": 65}, {"label": "Within \u00b1 30% variance; forecasts are rough approximations", "score": 30}, {"label": "> 30% variance or no formal cloud spend forecast is produced", "score": 0}], "remediation": "Build a driver-based rolling forecast model combining historical run-rate trends with product roadmap launch schedules to maintain variance within \u00b15%."}, {"id": "A9", "stage": "automated", "domain": "managing_practice", "finops_capability": "CI/CD Cost Shift-Left", "critical": false, "weight": 1, "checkpoint_id": "chk-a1", "text": "Do software and DevOps engineers receive automated cost feedback inside their normal workflow (e.g. Infracost in GitHub/GitLab pull requests)?", "consultant_probe": "Ask to see a sample Pull Request. Does Infracost comment directly on the PR showing: 'This Terraform change will increase monthly AWS spend by $340'?", "subjective_prompt": "Assess shift-left FinOps tooling (Infracost, Terraform cost estimators) and developer response.", "options": [{"label": "Yes \u2014 automated PR comments show exact estimated dollar impact before code is merged", "score": 100}, {"label": "PR cost checks deployed on some core repositories but not universal", "score": 65}, {"label": "Cost discussed manually during code reviews for high-risk changes", "score": 30}, {"label": "Engineers merge infrastructure code with zero automated cost visibility", "score": 0}], "remediation": "Integrate Infracost into GitHub/GitLab CI/CD pipelines to show engineers the real-time cost delta of Terraform/CloudFormation PRs before merging."}, {"id": "T1", "stage": "transparent", "domain": "understanding_usage", "finops_capability": "Automated Multi-Tenant Chargeback", "critical": true, "weight": 2, "checkpoint_id": "chk-t1", "text": "How mature is financial chargeback to business units, product lines, and cost centers (actual financial transfer to P&Ls)?", "consultant_probe": "Verify whether chargeback is actual journal entries debiting BU general ledgers or just 'showback' reports that directors can ignore with zero budget consequence.", "subjective_prompt": "Document financial ledger integration, dispute resolution processes, and shared platform allocation keys.", "options": [{"label": "Fully automated chargeback with monthly journal entries posted to SAP/Oracle general ledgers", "score": 100}, {"label": "Showback is enforced with budget accountability, but no direct P&L debit", "score": 65}, {"label": "Informal chargeback based on rough percentage splits with frequent disputes", "score": 30}, {"label": "Centralized IT absorbs all cloud costs as corporate overhead with zero chargeback", "score": 0}], "remediation": "Transition from informational showback to direct automated chargeback in your ERP (SAP/Oracle/NetSuite), holding business unit leaders financially accountable for their cloud consumption."}, {"id": "T2", "stage": "transparent", "domain": "business_value", "finops_capability": "Unit Economics & Margin Modeling", "critical": true, "weight": 2, "checkpoint_id": "chk-t2", "text": "Are business unit economics defined, tracked, and reported in real-time (e.g. cost per transaction, cost per active user, cost per order)?", "consultant_probe": "Ask the client's executive: 'What is your cloud infrastructure cost per completed customer order or active subscriber, and has it increased or decreased over the last 12 months?'", "subjective_prompt": "Document defined unit economics metrics, data source integrations, and executive reporting frequency.", "options": [{"label": "Yes \u2014 granular unit metrics (cost/transaction, cost/tenant) tracked and trended on executive dashboards", "score": 100}, {"label": "Unit metrics calculated manually on a quarterly basis for key products", "score": 65}, {"label": "Top-level cloud spend tracked against revenue, but no operational unit metrics", "score": 30}, {"label": "No unit economics defined; cloud spend treated solely as a lump-sum IT expense", "score": 0}], "remediation": "Define 1-2 core unit economic metrics (e.g. Cloud Cost per 1,000 Transactions) combining cloud billing telemetry with product analytics in BI dashboards."}, {"id": "T3", "stage": "transparent", "domain": "business_value", "finops_capability": "BI & Financial Integration", "critical": true, "weight": 2, "checkpoint_id": "chk-t3", "text": "Is cloud cost and unit telemetry integrated directly into enterprise BI platforms and long-range corporate financial planning?", "consultant_probe": "Check if CFO forecasting models incorporate real-time cloud unit cost metrics, or if cloud budgets are forecasted as a flat 15% annual increase.", "subjective_prompt": "Evaluate FP&A involvement in cloud budgeting and multi-year forecasting accuracy.", "options": [{"label": "Yes \u2014 cloud unit telemetry feeds directly into corporate BI and FP&A financial models", "score": 100}, {"label": "Cloud costs integrated into BI dashboards, but FP&A models use manual quarterly inputs", "score": 65}, {"label": "Separate reporting tracks; cloud team tools do not communicate with finance BI", "score": 30}, {"label": "Cloud financials completely isolated from corporate BI platforms", "score": 0}], "remediation": "Feed normalized cloud cost data directly into the enterprise data warehouse (Snowflake/BigQuery) so FP&A can model cloud COGS against product revenue pipelines."}, {"id": "T4", "stage": "transparent", "domain": "business_value", "finops_capability": "Tenant Cost Attribution & Pricing", "critical": false, "weight": 1, "checkpoint_id": "chk-t2", "text": "Is infrastructure cost per customer or tenant tracked and used directly to inform product tier pricing, enterprise contracts, and margin defense?", "consultant_probe": "Ask Sales / Product: 'Do you know which of your enterprise customers are unprofitable due to heavy cloud compute/storage consumption?'", "subjective_prompt": "Detail multi-tenant cost tracking capabilities and how it informs bespoke enterprise contract pricing.", "options": [{"label": "Yes \u2014 exact cost-to-serve per customer is tracked and informs contract pricing and tier margins", "score": 100}, {"label": "Calculated for high-tier enterprise clients during annual contract renewals", "score": 65}, {"label": "Rough approximations used; individual customer cloud cost unknown", "score": 30}, {"label": "No tracking of customer cost-to-serve; all customers billed standard pricing", "score": 0}], "remediation": "Implement customer-tenant attribution tags on storage and compute to identify unprofitable enterprise accounts and adjust renewal pricing."}, {"id": "T5", "stage": "transparent", "domain": "managing_practice", "finops_capability": "Executive Scorecards & Benchmarking", "critical": false, "weight": 1, "checkpoint_id": "chk-t3", "text": "How embedded are executive FinOps scorecards, department leaderboards, and peer benchmarking in driving executive behavior?", "consultant_probe": "Check if business unit leaders compare their unit costs against other internal BUs on monthly executive scorecards.", "subjective_prompt": "Review executive scorecard metrics and C-suite engagement.", "options": [{"label": "Highly embedded \u2014 monthly executi function openLoginModal() {
  const m = document.getElementById("loginModal");
  if (m) { m.style.display = "flex"; document.getElementById("loginEmail").focus(); }
}

function closeLoginModal() {
  const m = document.getElementById("loginModal");
  if (m) m.style.display = "none";
}

async function handleCognitoLogin() {
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  const errDiv = document.getElementById("loginError");
  const btn = document.getElementById("btnSubmitLogin");

  if (!email || !password) {
    errDiv.textContent = "Please enter both email and password.";
    errDiv.style.display = "block";
    return;
  }

  btn.disabled = true;
  btn.textContent = "Verifying...";
  errDiv.style.display = "none";

  try {
    const res = await fetch("https://cognito-idp." + COGNITO_CONFIG.region + ".amazonaws.com/", {
      method: "POST",
      headers: {
        "X-Amz-Target": "AWSCognitoIdentityProviderService.InitiateAuth",
        "Content-Type": "application/x-amz-json-1.1"
      },
      body: JSON.stringify({
        AuthFlow: "USER_PASSWORD_AUTH",
        ClientId: COGNITO_CONFIG.clientId,
        AuthParameters: {
          USERNAME: email,
          PASSWORD: password
        }
      })
    });

    const data = await res.json();
    if (data.AuthenticationResult) {
      const token = data.AuthenticationResult.IdToken;
      const payload = JSON.parse(atob(token.split('.')[1]));
      AUTH_USER = {
        email: payload.email || email,
        sub: payload.sub,
        token: token
      };
      sessionStorage.setItem("ltm_auth_user", JSON.stringify(AUTH_USER));
      closeLoginModal();
      renderAuthWidget();
      toast("Welcome " + AUTH_USER.email + " (Signed In)");
    } else {
      errDiv.textContent = data.message || "Invalid email or password.";
      errDiv.style.display = "block";
    }
  } catch(err) {
    errDiv.textContent = "Authentication error: " + err.message;
    errDiv.style.display = "block";
  } finally {
    btn.disabled = false;
    btn.textContent = "Sign In →";
  }
}

function logout() {
  AUTH_USER = null;
  sessionStorage.removeItem("ltm_auth_user");
  renderAuthWidget();
  toast("Signed out");
}

function checkEditPermission() {
  if (!AUTH_USER) {
    openLoginModal();
    return false;
  }
  return true;
}

const SCHEMA = "ltm-qbank/1.0";

/* ---------- answer type library (shared across all accelerators) ---------- */
const TYPES = {
  single_select:   {label:"Single select",       opts:"scored",  desc:"One choice. Each option carries a score."},

  drag_order:      {label:"Drag to rank",        opts:"plain",   desc:"Ordered list. Can score against an ideal order, or stay unscored."},

/* ---------- tool profiles ---------- */

/* ---------- starter bank ---------- */
function newBank(profile){

    questions:[],

    assets:{}

}

/* ---------- state ---------- */
const S={bank:newBank("simple_survey"),tab:"questions",selQ:null,logo:null,
  bakeHtml:"",bakeName:""};
const $=s=>document.querySelector(s);
const app=$("#app");
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function uid(p){let n=1;while(S.bank.questions.some(q=>q.id===p+n))n++;return p+n;}
function prof(){return PROFILES[S.bank.meta.profile]||PROFILES.simple_survey;}
function today(){return new Date().toISOString().slice(0,10);}
let tT=null;
function toast(m,err){let t=$(".toast");if(!t){t=document.createElement("div");document.body.appendChild(t);}
  t.className="toast"+(err?" err":"");t.textContent=m;clearTimeout(tT);tT=setTimeout(()=>t.remove(),3400);}
function dl(name,text,type){const b=new Blob([text],{type:type||"application/json"});const u=URL.createObjectURL(b);
  const a=document.createElement("a");a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),900);}

/* ---------- wiring contracts ----------
   A question is "wired" when it can actually affect a result. Unwired
   questions render fine and change nothing — the most common authoring
   mistake, so the contract makes it a blocking error unless declared. */
const WIRING={
  value_case:{
    noun:"signal",
    isWired(q){return ((q.ext&&q.ext.signals)||[]).length>0;},
    fix:"Tick at least one signal, or mark the question as intentionally unscored."
  },
  finops_maturity:{
    noun:"stage",
    isWired(q,B){
      if(!(q.ext&&q.ext.stage))return false;
      const sh=TYPES[q.type]?TYPES[q.type].opts:null;
      if(sh==="scored")return (q.options||[]).some(o=>typeof o.score==="number");
      if(sh==="none")return q.type!=="open_text";
      return sh==="labels"||sh==="slider"||sh==="buckets";
    },
    fix:"Assign a stage and make sure the answer can produce a score."
  },
  sovereign:{
    noun:"fact or readiness mapping",
    isWired(q,B){
      const writes=((q.ext&&q.ext.writes)||[]).length>0;
      const factOpts=(q.options||[]).some(o=>o.factValue&&Object.keys(o.factValue).length);
      const read=((q.ext&&q.ext.readiness)||[]).length>0;
      return writes||factOpts||read;
    },
    fix:"Write a fact that a rule reads, add a readiness mapping, or mark it intentionally unscored."
  },
  common:{
    noun:"weight",
    isWired(){return true;},
    fix:""
  }
};
function wiring(){return WIRING[prof().nativeId]||WIRING.common;}
function qRole(q){return q.role||(q.unscored?"unscored":"scored");}
function isWired(q){return qRole(q)!=="scored"?true:wiring().isWired(q,S.bank);}

/* ---------- fact graph (rules engine) ---------- */
function walkCond(c,cb){
  if(!c||typeof c!=="object")return;
  if(Array.isArray(c.all))return c.all.forEach(x=>walkCond(x,cb));
  if(Array.isArray(c.any))return c.any.forEach(x=>walkCond(x,cb));
  if(c.not)return walkCond(c.not,cb);
  if(c.fact)cb(c.fact);
}
function factsRead(B){
  const m={};
  (B.scoring.regimes||[]).forEach(r=>{
    (r.applicability_rules||[]).forEach((rule,i)=>{
      walkCond(rule.when,f=>{(m[f]=m[f]||[]).push({regime:r.name||r.id,rule:i,grade:rule.grade});});
    });
  });
  B.questions.forEach(q=>{ if(q.shownIf)walkCond(q.shownIf,f=>{(m[f]=m[f]||[]).push({regime:"(visibility of "+q.id+")",rule:-1});}); });
  return m;
}
function factsWritten(B){
  const m={};
  B.questions.forEach(q=>{
    ((q.ext&&q.ext.writes)||[]).forEach(f=>{(m[f]=m[f]||[]);if(!m[f].includes(q.id))m[f].push(q.id);});
    (q.options||[]).forEach(o=>{ if(o.factValue)Object.keys(o.factValue).forEach(f=>{
      (m[f]=m[f]||[]);if(!m[f].includes(q.id))m[f].push(q.id);});});
  });
  return m;
}
function readinessDims(B){
  const m={};
  (B.scoring.regimes||[]).forEach(r=>{m[r.id]={name:r.name||r.id,dims:new Set((r.readiness_dimensions||[]).map(d=>d.id))};});
  return m;
}

/* ---------- impact preview ---------- */
function impact(q){
  const B=S.bank,P=prof(),out=[];
  if(q.type==="open_text"){out.push({k:"info",t:"Free text is never scored — captured as evidence in the report."});return out;}
  const role=qRole(q);
  if(role==="unscored"){out.push({k:"info",t:"Marked <b>unscored</b>. Renders to the respondent and appears in the report, but contributes nothing to any result."});return out;}
  if(role==="context"){out.push({k:"info",t:"Marked <b>context</b>. Feeds the engine outside the scoring system — spend, growth or platform mix driving a derived model. The Studio cannot trace that wiring, so verify it against the tool."});return out;}

  if(P.nativeId==="value_case"){
    const sigs=(q.ext&&q.ext.signals)||[];
    if(!sigs.length){out.push({k:"err",t:"Feeds no signal — this question will not affect the result."});return out;}
    sigs.forEach(s=>{
      const def=(B.scoring.signals||[]).find(x=>x.id===s.id);
      if(!def){out.push({k:"err",t:"Feeds unknown signal \""+s.id+"\"."});return;}
      const feeders=B.questions.filter(x=>((x.ext&&x.ext.signals)||[]).some(y=>y.id===s.id)&&!x.unscored);
      const total=feeders.reduce((a,x)=>a+(((x.ext.signals.find(y=>y.id===s.id))||{}).w||0),0);
      const share=total?Math.round((s.w/total)*100):0;
      const overall=Math.round(share*(def.weight||0));
      out.push({k:"ok",t:"Contributes <b>"+share+"%</b> of the <b>"+esc(def.label||def.id)+"</b> signal"
        +(def.weight?" — roughly <b>"+overall+"%</b> of the overall index":"")+"."});
    });
    if(q.allowDK||q.type==="boolean_dk"){
      out.push({k:(q.ext&&q.ext.dkBlind)?"ok":"warn",
        t:(q.ext&&q.ext.dkBlind)?"A \"don't know\" answer scores zero and raises a named blind spot."
          :"A \"don't know\" answer scores zero but has no blind-spot text, so the report cannot explain it."});
    }
  }
  else if(P.nativeId==="finops_maturity"){
    const st=(B.scoring.stages||[]).find(s=>s.id===(q.ext&&q.ext.stage));
    if(!st){out.push({k:"err",t:"No stage assigned — this question is not part of any gate."});return out;}
    const sibs=B.questions.filter(x=>x.ext&&x.ext.stage===st.id&&!x.unscored);
    const tw=sibs.reduce((a,x)=>a+((x.ext&&x.ext.weight)||1),0);
    const mine=(q.ext&&q.ext.weight)||1;
    out.push({k:"ok",t:"Weight <b>"+mine+"</b> of "+tw+" in <b>"+esc(st.name||st.id)+"</b> — about <b>"
      +(tw?Math.round(mine/tw*100):0)+"%</b> of that stage's score (threshold "+st.threshold+")."});
    if(q.ext&&q.ext.critical){
      const crits=sibs.filter(x=>x.ext&&x.ext.critical).length;
      out.push({k:"warn",t:"<b>Critical.</b> Scoring below "+st.critMin+" blocks progression past "+esc(st.name||st.id)
        +" regardless of the stage average. This stage has "+crits+" critical question"+(crits>1?"s":"")+"."});
    }
  }
  else if(P.nativeId==="sovereign"){
    const read=factsRead(B),dims=readinessDims(B);
    const mine=[];
    ((q.ext&&q.ext.writes)||[]).forEach(f=>mine.push(f));
    (q.options||[]).forEach(o=>{if(o.factValue)Object.keys(o.factValue).forEach(f=>{if(!mine.includes(f))mine.push(f);});});
    if(!mine.length&&!((q.ext&&q.ext.readiness)||[]).length){
      out.push({k:"err",t:"Writes no fact and has no readiness mapping — this question affects nothing."});return out;}
    mine.forEach(f=>{
      const rs=read[f]||[];
      if(!rs.length)out.push({k:"err",t:"Writes fact <b>"+esc(f)+"</b>, but <b>no rule reads it</b> — the answer changes nothing."});
      else{
        const regimes=[...new Set(rs.map(r=>r.regime))];
        out.push({k:"ok",t:"Writes <b>"+esc(f)+"</b>, read by <b>"+rs.length+"</b> rule"+(rs.length>1?"s":"")
          +" across "+regimes.length+" regime"+(regimes.length>1?"s":"")+": "+esc(regimes.slice(0,3).join(", "))
          +(regimes.length>3?" +"+(regimes.length-3)+" more":"")+"."});
      }
    });
    ((q.ext&&q.ext.readiness)||[]).forEach(r=>{
      const reg=dims[r.regime];
      if(!reg)out.push({k:"err",t:"Readiness points at unknown regime <b>"+esc(r.regime)+"</b>."});
      else if(!reg.dims.has(r.dimension))out.push({k:"err",t:"Regime <b>"+esc(reg.name)+"</b> has no dimension <b>"+esc(r.dimension)+"</b>."});
      else out.push({k:"ok",t:"Scores the <b>"+esc(r.dimension)+"</b> dimension of <b>"+esc(reg.name)+"</b>."});
    });
  }
  else{
    const tot=B.questions.filter(x=>!x.unscored).reduce((a,x)=>a+((x.ext&&x.ext.weight)||1),0);
    const mine=(q.ext&&q.ext.weight)||1;
    out.push({k:"ok",t:"Weight <b>"+mine+"</b> of "+tot+" — about <b>"+(tot?Math.round(mine/tot*100):0)+"%</b> of the overall score."});
  }
  if(q.shownIf&&q.shownIf.fact)
    out.push({k:"info",t:"Only shown when <b>"+esc(q.shownIf.fact)+"</b> "+esc(q.shownIf.op||"")+" "
      +esc(Array.isArray(q.shownIf.value)?q.shownIf.value.join(", "):(q.shownIf.value!=null?q.shownIf.value:""))+"."});
  return out;
}

/* ---------- validation ---------- */
function validate(){
  const out=[],B=S.bank,P=prof();
  const ids={};
  B.questions.forEach(q=>{ids[q.id]=(ids[q.id]||0)+1;});
  Object.keys(ids).forEach(id=>{if(ids[id]>1)out.push({sev:"err",msg:"Duplicate question id",where:id});});
  const secIds=B.sections.map(s=>s.id);
  B.questions.forEach(q=>{
    if(!q.text||!q.text.trim())out.push({sev:"err",msg:"Question has no text",where:q.id});
    if(!TYPES[q.type])out.push({sev:"err",msg:"Unknown answer type: "+q.type,where:q.id});
    if(q.section&&!secIds.includes(q.section))out.push({sev:"err",msg:"Points at a section that does not exist ("+q.section+")",where:q.id});
    const shape=TYPES[q.type]?TYPES[q.type].opts:null;
    const scoresMatter=(qRole(q)==="scored")&&P.nativeId!=="sovereign";
    if(shape==="scored"){
      if(!q.options||!q.options.length)out.push({sev:"err",msg:"Select question has no options",where:q.id});
      else if(scoresMatter){
        const ns=q.options.filter(o=>typeof o.score!=="number").length;
        if(ns===q.options.length)out.push({sev:"warn",msg:"No option carries a score — this question cannot contribute to any result",where:q.id});
        else if(ns>0)out.push({sev:"warn",msg:ns+" option(s) missing a score",where:q.id});
        if(q.type==="single_select"&&!q.options.some(o=>o.score>=90))
          out.push({sev:"info",msg:"No option scores near 100 — the best available answer still loses points",where:q.id});
      }
    }
    if(shape==="labels"&&(!q.labels||q.labels.length!==5))out.push({sev:"warn",msg:"Rating needs exactly 5 labels",where:q.id});
    if(shape==="slider"&&(!q.slider||q.slider.min===undefined||q.slider.max===undefined))out.push({sev:"err",msg:"Slider has no min/max defined",where:q.id});
    if(shape==="slider"&&q.slider&&q.slider.min>=q.slider.max)out.push({sev:"err",msg:"Slider min is not below max",where:q.id});
    if(shape==="buckets"&&(!q.buckets||q.buckets.length<2))out.push({sev:"err",msg:"Allocation needs at least 2 buckets",where:q.id});
    if(shape==="plain"&&(!q.options||q.options.length<2))out.push({sev:"err",msg:"Ranking needs at least 2 items",where:q.id});
    if(q.shownIf&&q.shownIf.fact){
      const writers=B.questions.filter(x=>(x.ext&&Array.isArray(x.ext.writes)&&x.ext.writes.includes(q.shownIf.fact))
        ||(x.options||[]).some(o=>o.factValue&&Object.keys(o.factValue).includes(q.shownIf.fact)));
      if(!writers.length)out.push({sev:"warn",msg:"Condition depends on fact \""+q.shownIf.fact+"\" that no question writes",where:q.id});
    }
    // wiring contract — applies to every profile
    if(q.type!=="open_text"&&!isWired(q))
      out.push({sev:"err",msg:"Not wired to anything — needs a "+wiring().noun+". "+wiring().fix,where:q.id});
    // profile-specific
    if(P.nativeId==="value_case"){
      const sg=(q.ext&&q.ext.signals)||[];
      sg.forEach(s=>{if(!(B.scoring.signals||[]).some(x=>x.id===s.id))out.push({sev:"err",msg:"Feeds unknown signal \""+s.id+"\"",where:q.id});});
      if((q.allowDK||q.type==="boolean_dk")&&!(q.ext&&q.ext.dkBlind))
        out.push({sev:"warn",msg:"Allows \"don't know\" but has no blind-spot text — the report cannot explain the gap",where:q.id});
    }
    if(P.nativeId==="finops_maturity"){
      const st=q.ext&&q.ext.stage;
      if(st&&!(B.scoring.stages||[]).some(x=>x.id===st))out.push({sev:"err",msg:"Points at unknown stage \""+st+"\"",where:q.id});
    }
    if(P.nativeId==="sovereign"){
      const read=factsRead(B),dims=readinessDims(B);
      const writes=[];
      ((q.ext&&q.ext.writes)||[]).forEach(f=>writes.push(f));
      (q.options||[]).forEach(o=>{if(o.factValue)Object.keys(o.factValue).forEach(f=>{if(!writes.includes(f))writes.push(f);});});
      writes.forEach(f=>{if(!read[f])out.push({sev:"warn",msg:"Writes fact \""+f+"\" that no rule reads — the answer changes nothing",where:q.id});});
      ((q.ext&&q.ext.readiness)||[]).forEach(r=>{
        if(!dims[r.regime])out.push({sev:"err",msg:"Readiness points at unknown regime \""+r.regime+"\"",where:q.id});
        else if(!dims[r.regime].dims.has(r.dimension))out.push({sev:"err",msg:"Regime \""+r.regime+"\" has no dimension \""+r.dimension+"\"",where:q.id});
      });
    }
  });
  if(P.nativeId==="value_case"){
    (B.scoring.signals||[]).forEach(sig=>{
      const fed=B.questions.some(q=>q.ext&&(q.ext.signals||[]).some(s=>s.id===sig.id));
      if(!fed)out.push({sev:"warn",msg:"Signal \""+sig.id+"\" has no question feeding it and will never score",where:"scoring"});
    });
  }
  if(P.nativeId==="finops_maturity"){
    (B.scoring.stages||[]).forEach(st=>{
      const qs=B.questions.filter(q=>q.ext&&q.ext.stage===st.id);
      if(!qs.length)out.push({sev:"warn",msg:"Stage \""+st.id+"\" has no questions",where:"scoring"});
      else if(!qs.some(q=>q.ext.critical))out.push({sev:"info",msg:"Stage \""+st.id+"\" has no critical question — nothing gates progression",where:"scoring"});
    });
  }
  if(P.nativeId==="sovereign"){
    const read=factsRead(B),written=factsWritten(B);
    Object.keys(read).forEach(f=>{
      if(!written[f])out.push({sev:"err",msg:"Rules read fact \""+f+"\" that no question writes — those rules can never fire",where:"facts"});
    });
  }
  if(!B.questions.length)out.push({sev:"warn",msg:"Bank has no questions yet",where:"bank"});
  const order={err:0,warn:1,info:2};
  out.sort((a,b)=>order[a.sev]-order[b.sev]);
  return out;
}

/* ---------- render ---------- */
function render(){
  const tabs=[["questions","Questions"],["sections","Sections"],["scoring","Scoring"]];
  if(prof().nativeId==="sovereign")tabs.push(["facts","Facts"]);
  tabs.push(["validate","Validate"],["io","Import / Export"],["bake","Publish"]);
  if(!tabs.some(t=>t[0]===S.tab))S.tab="questions";
  $("#tabs").innerHTML=tabs.map(([k,l])=>'<button class="tab'+(S.tab===k?" on":"")+'" data-t="'+k+'">'+l+'</button>').join("");
  $("#brand").innerHTML=S.logo?'<img src="'+S.logo+'" alt="LTM"/>'
    :'<span class="mark"></span><span class="bw"><b>Question Bank Studio</b><span>LTM Accelerator Platform</span></span><span class="ph">LOGO</span>';
  const v=validate(),errs=v.filter(x=>x.sev==="err").length,warns=v.filter(x=>x.sev==="warn").length;
  $("#hdot").className="dot"+(errs?" err":warns?" warn":"");
  $("#hmeta").textContent=S.bank.questions.length+" questions · "+(errs?errs+" errors":warns?warns+" warnings":"valid");
  const V={questions:vQuestions,sections:vSections,scoring:vScoring,facts:vFacts,validate:vValidate,io:vIO,bake:vBake};
  app.innerHTML='<div class="wrap">'+(V[S.tab]||vQuestions)()+'</div>';
}

function vQuestions(){
  const B=S.bank,P=prof();
  let list="";
  B.sections.forEach(sec=>{
    const qs=B.questions.filter(q=>q.section===sec.id);
    list+='<div class="secgroup"><div class="sechead"><span class="sn">'+esc(sec.n||"")+'</span><span class="sl">'+esc(sec.label)+'</span>'
      +'<button class="btn ghost sm" data-a="addQ" data-sec="'+sec.id+'">+ Question</button></div>';
    list+=qs.length?qs.map(q=>qRow(q)).join(""):'<div class="empty" style="padding:14px;font-size:12px">No questions yet</div>';
    list+='</div>';
  });
  const orphan=B.questions.filter(q=>!B.sections.some(s=>s.id===q.section));
  if(orphan.length)list+='<div class="secgroup"><div class="sechead"><span class="sn">!!</span><span class="sl" style="color:var(--red)">Unassigned</span></div>'+orphan.map(qRow).join("")+'</div>';

  const q=B.questions.find(x=>x.id===S.selQ);
  return '<div class="split"><div>'
    +'<div class="card"><h3>'+esc(B.meta.name)+'</h3>'
    +'<p class="hint">'+esc(P.name)+' profile · '+B.questions.length+' questions across '+B.sections.length+' sections</p>'
    +'<div class="qlist">'+(list||'<div class="empty">No sections yet — add one first</div>')+'</div></div></div>'
    +'<div>'+(q?qEditor(q):'<div class="card"><div class="empty">Select a question to edit, or add a new one.</div></div>')+'</div></div>';
}
function qRow(q){
  const v=validate().filter(x=>x.where===q.id&&x.sev==="err").length;
  const t=TYPES[q.type];
  return '<div class="qrow'+(S.selQ===q.id?' sel':'')+'" data-a="selQ" data-id="'+q.id+'">'
    +'<span class="qmove"><button data-a="mvUp" data-id="'+q.id+'">▲</button><button data-a="mvDn" data-id="'+q.id+'">▼</button></span>'
    +'<span class="qid">'+esc(q.id)+'</span><span class="qt">'+esc(q.text||"(no text)")+'</span>'
    +(q.ext&&q.ext.critical?'<span class="qbadge crit">CRIT</span>':'')
    +'<span class="qbadge">'+esc(t?t.label.split(" ")[0]:q.type)+'</span>'
    +(!isWired(q)&&q.type!=="open_text"?'<span class="qbadge err">UNWIRED</span>':'')
    +(v?'<span class="qbadge err">'+v+'</span>':'')+'</div>';
}

      +'<input class="inp" value="'+esc(sl.suffix||"")+'" data-qf="slSuffix" placeholder="suffix e.g. %"/>'
      +'<input class="inp mono" type="number" value="'+(sl.default!=null?sl.default:"")+'" data-qf="slDefault" placeholder="default"/></div>'
      +'<label class="chk"><input type="checkbox" data-qf="invert" '+(q.invert?"checked":"")+'/> Invert — lower values score better (e.g. waste %, variance)</label></div>';

    body='<div class="field"><label>Allocation buckets</label>'
      +(q.buckets||[]).map((b,i)=>'<div class="optrow nosc"><input class="inp" value="'+esc(b.label||"")+'" data-qf="bucketLabel" data-i="'+i+'" placeholder="Bucket name"/>'
        +'<button class="iconbtn" data-a="delBucket" data-i="'+i+'">✕</button></div>').join("")

        +'<button class="iconbtn" data-a="delOpt" data-i="'+i+'">✕</button></div>').join("")

  }
